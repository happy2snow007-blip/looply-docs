var MD_CONTENT = "# Looply \u6d77\u5916\u4e1a\u52a1 \u00b7 Collection \u7ba1\u7406\u6a21\u5757 PRD\uff08\u524d\u540e\u53f0\u5408\u4e00\uff09\n\n**\u7248\u672c**\uff1av0.21\n**\u521b\u5efa\u65e5\u671f**\uff1a2026-06-26\n**\u66f4\u65b0\u65e5\u671f**\uff1a2026-07-08\uff08v0.21\uff0c\u00a73.9 \u5546\u54c1\u5361\u8865\u5168\u5b57\u6bb5\u8868\u4e0e\u8df3\u8f6c\u903b\u8f91\uff0c\u5bf9\u9f50\u9996\u9875 Feed PRD v1.4\uff09\n**\u76ee\u6807\u8bfb\u8005**\uff1a\u4ea7\u54c1 \u00b7 UI \u8bbe\u8ba1 \u00b7 \u524d\u7aef \u00b7 \u540e\u7aef \u00b7 CMS \u00b7 \u6d4b\u8bd5\n**\u72b6\u6001**\uff1a\u5f85\u8bc4\u5ba1\n**\u5408\u5e76\u8bf4\u660e**\uff1a\u672c\u6587\u6863\u7531\u300c\u7c7b\u76ee\u7ba1\u7406 PRD v0.1\uff08\u540e\u53f0\u4e3a\u4e3b\uff09\u300d\u4e0e\u300cCollection \u843d\u5730\u9875 PRD v1.6\uff08\u524d\u53f0 Mobile\uff09\u300d\u5408\u5e76\u5347\u7ea7\u800c\u6765\uff0c\u5e76\u5bf9\u9f50\u540e\u53f0\u539f\u578b v0.16\u3002\u524d\u53f0\u8303\u56f4\u5728 v1.6\uff08Mobile\uff09\u57fa\u7840\u4e0a,\u81ea v0.16 \u8d77**PC \u7aef\u843d\u5730\u9875\u7eb3\u5165 V1**\uff08\u5b8c\u6574\u7b5b\u9009\u4f53\u9a8c,\u89c1 \u00a73.12\uff09;\u56fe\u6587\u7b5b / \u5feb\u7b5b\u4ecd\u79fb\u52a8\u7aef\u4e13\u5c5e\u3002\n**\u5386\u6b21\u7248\u672c\u53d8\u66f4**\uff1a\u89c1\u72ec\u7acb\u6587\u4ef6 `looply-\u7c7b\u76ee\u7ba1\u7406-PRD-\u7248\u672c\u53d8\u66f4\u8bf4\u660e.md`\uff08\u6b63\u6587\u4e0d\u518d\u5185\u5d4c\u53d8\u66f4\u5386\u53f2\uff09\u3002\n\n---\n\n## \u76ee\u5f55\n\n- [\u4e00\u3001\u6982\u8ff0](#\u4e00\u6982\u8ff0)\n- [\u4e8c\u3001\u540e\u53f0\u7ba1\u7406\u7aef](#\u4e8c\u540e\u53f0\u7ba1\u7406\u7aef)\n  - [2.1 \u516c\u5171\u7ec4\u4ef6\uff1a\u6761\u4ef6\u6784\u5efa\u5668](#21-\u516c\u5171\u7ec4\u4ef6\u6761\u4ef6\u6784\u5efa\u5668)\n  - [2.2 Collection \u5217\u8868\u9875](#22-collection-\u5217\u8868\u9875)\n  - [2.3 \u65b0\u5efa Collection\uff08\u5411\u5bfc\u6d41\u7a0b\uff09](#23-\u65b0\u5efa-collection\u5411\u5bfc\u6d41\u7a0b)\n  - [2.4 Collection \u8be6\u60c5\u9875\uff08\u7f16\u8f91\u5411\u5bfc\uff09](#24-collection-\u8be6\u60c5\u9875\u7f16\u8f91\u5411\u5bfc)\n  - [2.5 \u7b5b\u9009\u7ef4\u5ea6\u7ba1\u7406](#25-\u7b5b\u9009\u7ef4\u5ea6\u7ba1\u7406)\n  - [2.6 Collection \u7b5b\u9009\u914d\u7f6e\uff08\u79fb\u52a8\u7aef\u56fe\u6587\u7b5b / \u79fb\u52a8\u7aef\u5feb\u7b5b / \u901a\u7528\u7b5b\u9009\u5668\uff09](#26-collection-\u7b5b\u9009\u914d\u7f6e\u79fb\u52a8\u7aef\u56fe\u6587\u7b5b--\u79fb\u52a8\u7aef\u5feb\u7b5b--\u901a\u7528\u7b5b\u9009\u5668)\n- [\u4e09\u3001\u524d\u53f0 C \u7aef\uff1aCollection \u843d\u5730\u9875\uff08Mobile + PC\uff09](#\u4e09\u524d\u53f0-c-\u7aefcollection-\u843d\u5730\u9875mobile--pc)\n- [\u56db\u3001\u901a\u7528\u673a\u5236](#\u56db\u901a\u7528\u673a\u5236)\n- [\u4e94\u3001\u4f9d\u8d56\u4e0e\u98ce\u9669](#\u4e94\u4f9d\u8d56\u4e0e\u98ce\u9669)\n- [\u516d\u3001\u7248\u672c\u89c4\u5212](#\u516d\u7248\u672c\u89c4\u5212)\n- [\u4e03\u3001\u6570\u636e\u4e0e\u57cb\u70b9](#\u4e03\u6570\u636e\u4e0e\u57cb\u70b9)\n- [\u516b\u3001\u9644\u5f55](#\u516b\u9644\u5f55)\n\n---\n\n## \u4e00\u3001\u6982\u8ff0\n\n### 1.1 \u80cc\u666f\u4e0e\u76ee\u6807\n\nLooply \u662f\u8f6c\u8f6c\u56fd\u9645\u4e1a\u52a1\u65d7\u4e0b\u9762\u5411\u6d77\u5916\u5e02\u573a\u7684\u5927\u724c\u4e8c\u624b\u5962\u4f88\u54c1\u7535\u5546\u5e73\u53f0\uff0c\u5207\u5165\u54c1\u7c7b\u4e3a\u4e8c\u624b\u5962\u4f88\u54c1\uff08\u5305\u888b\u3001\u9996\u9970\u3001\u914d\u9970\uff09\u3002\n\n**\u5f53\u524d\u95ee\u9898**\uff1a\u5546\u54c1\u7cfb\u7edf\u5df2\u5b8c\u6210\u540e\u53f0\u7c7b\u76ee\uff08backend_category\uff09\u548c\u5c5e\u6027\u4f53\u7cfb\u5efa\u8bbe\uff0c\u4f46\u540e\u53f0\u7c7b\u76ee\u662f\u9762\u5411\u6570\u636e\u7ba1\u7406\u7684\u5185\u90e8\u5206\u7c7b\uff0c\u65e0\u6cd5\u76f4\u63a5\u4f5c\u4e3a\u6d88\u8d39\u8005\u6d4f\u89c8\u5bfc\u822a\u5165\u53e3\u3002\u7f3a\u4e4f\u524d\u53f0\u5546\u54c1\u5206\u7ec4\u4e0e\u5c55\u793a\u80fd\u529b\u3002\n\n**\u672c\u6a21\u5757\u76ee\u6807**\uff1a\n- \u642d\u5efa\u524d\u53f0\u5546\u54c1\u5206\u7ec4\u7cfb\u7edf\uff08Collection\uff09\uff0c\u8ba 6e\uff09\uff0c\u7f16\u8f91\u5df2\u6709 Collection\u3002\n\n**Step 3\uff1a\u5546\u54c1\u6765\u6e90\uff08\u542b\u5546\u54c1\u5217\u8868\uff09**\n\n> **\u5546\u54c1\u5217\u8868\u5217\u96c6\u5408\uff08\u4e24\u79cd\u6a21\u5f0f\u901a\u7528\uff09**\uff1a\u7f29\u7565\u56fe | \u540d\u79f0 | \u54c1\u724c | \u4ef7\u683c | **\u6210\u8272** | **\u9500\u552e\u72b6\u6001** | **\u53ef\u552e\u5e93\u5b58** | **\u53ef\u89c1\u72b6\u6001** | Position\uff08\u56fa\u5b9a\u4f4d\u7f6e\uff09| \u64cd\u4f5c\u3002\u5176\u4e2d\uff1a\n> - **\u6210\u8272**\uff1aLike New / Excellent / Good / Fair **\u7b49\u5f69\u8272\u6807\u7b7e\uff08\u6b64\u5904\u4ec5\u4e3a\u793a\u610f,\u6700\u7ec8\u7ea7\u6570\u4e0e\u6587\u6848\u4ee5\u5546\u54c1\u7cfb\u7edf condition \u679a\u4e3e\u4e3a\u51c6,\u89c1 \u00a72.1 condition \u884c\uff09**\uff0c\u53d6\u81ea\u5546\u54c1\u6a21\u5757\u3002\n> - **\u9500\u552e\u72b6\u6001**\uff1a\u5728\u552e /\u300c\u5df2\u4e0b\u67b6\u300d\u7070\u663e /\u300c\u5df2\u552e\u51fa\u300d\u7070\u663e\u3002\n> - **\u53ef\u552e\u5e93\u5b58**\uff1a**`\u53ef\u552e\u5e93\u5b58 = max(0, \u5728\u5e93 - \u9884\u5360 - \u9501\u5b9a)`**\uff0c**\u6570\u636e\u6765\u81ea\u5e93\u5b58\u7ba1\u7406\u6a21\u5757**\uff08\u89c1 \u00a75 \u4f9d\u8d56\uff09\uff1b\u4e3a 0 \u65f6\u7ea2\u8272\u52a0\u7c97\u63d0\u793a\uff0c\u8fd0\u8425\u53ef\u70b9\u300c\u8be6\u60c5\u300d\u67e5\u770b\u5e93\u5b58\u660e\u7ec6\u3002**\u4ec5\u4f5c\u5c55\u793a\u4e0e\u63d0\u9192\uff0c\u4e0d\u81ea\u52a8\u5254\u9664\u51fa\u5546\u54c1\u6c60**\uff08\u51c6\u5165/\u5254\u9664\u7531\u5546\u54c1\u51c6\u5165\u903b\u8f91\u7edf\u4e00\u8d1f\u8d23\uff0c\u907f\u514d\u53cc\u91cd\u53e3\u5f84\uff09\u3002\n> - **\u53ef\u89c1\u72b6\u6001**\uff1a\u53ef\u89c1 / \u5df2\u9690\u85cf\u3002\n\n> **\u56fa\u5b9a\u4f4d\u7f6e\u4ea4\u4e92\uff08\u4e24\u79cd\u6a21\u5f0f\u901a\u7528\uff0c\u4e0e\u679a\u4e3e\u503c/\u7c7b\u76ee Pin \u540c\u8303\u5f0f R-30\uff09**\uff1a\n> - **\u5355\u4e2a\u56fa\u5b9a \u2014 \u884c\u5185\u8f93\u5165 + \u5b9e\u65f6\u68c0\u6d4b + \u786e\u8ba4\u6c14\u6ce1**\uff1a\u76f4\u63a5\u5728\u8be5\u884c\u300c\u56fa\u5b9a\u4f4d\u7f6e\u300d\u8f93\u5165\u6846\u586b\u5e8f\u53f7\uff1b\u503c\u4e00\u53d8\u5316\u5373**\u5b9e\u65f6\u68c0\u6d4b**\uff0c\u5e76\u5728\u8f93\u5165\u6846\u4e0a\u5f39\u51fa\u786e\u8ba4\u6c14\u6ce1\u3002**\u65e0\u51b2\u7a81**\u65f6\u6c14\u6ce1\u663e\u793a\u300c\u56fa\u5b9a\u300c{\u5546\u54c1}\u300d\u5230\u7b2c N \u4f4d?\u300d+ \u53d6\u6d88/\u786e\u5b9a\uff1b**\u6709\u51b2\u7a81**\u65f6\u6c14\u6ce1\u663e\u793a\u300c\u26a0\ufe0f \u7b2c N \u4f4d\u5f53\u524d\u4e3a\u300c{\u539f\u5546\u54c1}\u300d\uff0c\u786e\u5b9a\u540e\u5b83\u5c06\u88ab\u9876\u66ff\u3001\u6062\u590d\u81ea\u52a8\u6392\u5e8f\u300d+ \u53d6\u6d88/\u786e\u5b9a\u3002**\u4e24\u79cd\u60c5\u51b5\u90fd\u9700\u70b9\u300c\u786e\u5b9a\u300d\u624d\u5373\u65f6\u751f\u6548**\uff08\u4e0d\u4f9d\u8d56\u9876\u90e8\u5168\u5c40\u4fdd\u5b58\uff09\uff0c\u786e\u5b9a\u540e Toast \u53cd\u9988\uff1b\u56de\u8f66=\u786e\u5b9a\u3002\n> - **\u51b2\u7a81\u9876\u66ff**\uff1a\u786e\u5b9a\u540e**\u9876\u66ff**\u539f\u9879\uff08\u539f\u9879\u4f4d\u7f6e\u6e05\u7a7a\u3001\u6062\u590d\u6309\u6392\u5e8f\u89c4\u5219\u81ea\u52a8\u6392\u5e8f\uff09\uff0cToast\u300c\u4f4d\u7f6e N \u539f\u4e3a\u300c{\u539f\u5546\u54c1}\u300d\uff0c\u5df2\u88ab\u300c{\u65b0\u5546\u54c1}\u300d\u9876\u66ff\uff0c\u300c{\u539f\u5546\u54c1}\u300d\u6062\u590d\u81ea\u52a8\u6392\u5e8f\u300d\u3002\n> - **\u53d6\u6d88\u56fa\u5b9a**\uff1a\u6e05\u7a7a\u8be5\u884c\u8f93\u5165\u6846\u5373\u53d6\u6d88\u56fa\u5b9a\u3001\u5373\u65f6\u751f\u6548\u3002\n> - **\u6279\u91cf\u8fde\u7eed\u56fa\u5b9a \u2014 \u9876\u66ff\u524d\u5f39\u7a97\u786e\u8ba4**\uff1a\u52fe\u9009\u591a\u4ef6 \u2192 \u5de5\u5177\u6761\u8f93\u5165\u8d77\u59cb\u4f4d\u7f6e \u2192 \u70b9\u300c\u786e\u8ba4\u300d**\u5148\u5f39\u7a97**\u5217\u51fa\u5c06\u5360\u7528\u7684\u4f4d\u7f6e\u533a\u95f4\uff0c\u5e76**\u9010\u6761\u5217\u51fa\u4f1a\u88ab\u9876\u66ff\u7684\u539f\u56fa\u5b9a\u9879**\uff1b\u70b9\u300c\u786e\u5b9a\u56fa\u5b9a\u300d\u624d\u6267\u884c\uff08\u6309\u52fe\u9009\u987a\u5e8f\u8fde\u7eed\u586b\u5145\u3001\u9876\u66ff\u51b2\u7a81\u9879\uff09\uff0c\u70b9\u300c\u53d6\u6d88\u300d\u4e0d\u751f\u6548\uff1b\u65e0\u51b2\u7a81\u65f6\u5f39\u7a97\u63d0\u793a\u300c\u65e0\u4f4d\u7f6e\u51b2\u7a81\u300d\u3002\u5de5\u5177\u6761\u672b\u5c3e\u6709\u300c\u53d6\u6d88\u9009\u62e9\u300d\u6309\u94ae\uff08\u9ed8\u8ba4\u6309\u94ae\u6837\u5f0f\uff09\uff0c\u4e00\u952e\u6e05\u7a7a\u52fe\u9009\u3001\u6536\u8d77\u5de5\u5177\u6761\u3002\n> - **\u5355\u9879\u64cd\u4f5c\u5373\u65f6\u751f\u6548**\uff1a\u56fa\u5b9a\u4f4d\u7f6e\u7684\u589e/\u6539/\u6e05\u3001\u9690\u85cf/\u663e\u793a\u3001\u79fb\u9664\u5747\u70b9\u51fb\u5373\u65f6\u751f\u6548\uff08\u8c03\u540e\u7aef\uff09\uff0c\u4e0d\u9760\u9876\u90e8\u5168\u5c40\u4fdd\u5b58\u3002\n\n**\u81ea\u52a8\u9009\u54c1\u6a21\u5f0f\uff1a**\n- \u6761\u4ef6\u6784\u5efa\u5668\uff1a\u7f16\u8f91\u5df2\u4fdd\u5b58\u89c4\u5219\u3002\n- \u5546\u54c1\u5217\u8868\uff08WYSIWYG\uff09\uff0c\u5217\u96c6\u5408\u89c1\u4e0a\uff1b\u56fa\u5b9a\u4f4d\u7f6e\u4ea4\u4e92\u89c1\u4e0a\u65b9\u300c\u56fa\u5b9a\u4f4d\u7f6e\u4ea4\u4e92\u300d\u3002\n  - Position\uff08\u56fa\u5b9a\u4f4d\u7f6e\uff09\uff1a\u5df2\u56fa\u5b9a\u663e\u793a\u4f4d\u7f6e\u6570\u5b57\u3001\u672a\u56fa\u5b9a\u663e\u793a\u300c\u2014\u300d\uff1b\u56fa\u5b9a\u7684\u5546\u54c1\u4f4d\u7f6e\u4e0d\u53d7\u6392\u5e8f\u89c4\u5219\u5f71\u54cd\uff0c\u5176\u4f59\u6309\u9009\u5b9a\u6392\u5e8f\u89c4\u5219\u586b\u5145\u5269\u4f59\u4f4d\u7f6e\u3002\n  - **\u6279\u91cf\u64cd\u4f5c\uff08\u52fe\u9009 \u22651 \u4ef6\u540e\u51fa\u73b0\u5de5\u5177\u6761\uff09**\uff1a\u652f\u6301**\u6279\u91cf\u56fa\u5b9a**\uff08\u8d77\u59cb\u4f4d\u7f6e \u2192 \u5f39\u7a97\u786e\u8ba4 \u2192 \u8fde\u7eed\u586b\u5145\uff09\u4e0e**\u6279\u91cf\u9690\u85cf**\uff1b**\u81ea\u52a8\u9009\u54c1\u65e0\u300c\u79fb\u9664\u300d**\uff08\u5546\u54c1\u7531\u89c4\u5219\u52a8\u6001\u547d\u4e2d\uff0c\u79fb\u9664\u65e0\u610f\u4e49\uff09\u3002\n  - \u884c\u64cd\u4f5c\uff1a\u300c\u9690\u85cf\u300d\uff08\u9690\u85cf\u540e\u663e\u793a\u300c\u663e\u793a\u300d\u53ef\u6062\u590d\uff09+\u300c\u67e5\u770b\u8be6\u60c5\u300d\uff08\u8df3\u5546\u54c1\u7ba1\u7406\uff09\u3002\n\n**\u624b\u52a8\u9009\u54c1\u6a21\u5f0f\uff1a**\n- \u5546\u54c1\u5217\u8868\uff08WYSIWYG\uff09\uff0c\u5217\u96c6\u5408\u89c1\u4e0a\uff1b\u56fa\u5b9a\u4f4d\u7f6e\u4ea4\u4e92\u89c1\u4e0a\u65b9\u300c\u56fa\u5b9a\u4f4d\u7f6e\u4ea4\u4e92\u300d\u3002\n  - \u884c\u64cd\u4f5c\uff1a\u300c\u9690\u85cf/\u663e\u793a\u300d+\u300c\u79fb\u9664\u300d\uff08\u65ad\u5f00\u9009\u54c1\u5173\u7cfb\u3001\u9700\u91cd\u65b0\u6dfb\u52a0\uff0c\u70b9\u51fb\u4e8c\u6b21\u786e\u8ba4\uff09+\u300c\u67e5\u770b\u8be6\u60c5\u300d\u3002\n  - **\u6279\u91cf\u64cd\u4f5c\uff08\u52fe\u9009 \u22651 \u4ef6\u540e\u51fa\u73b0\u5de5\u5177\u6761\uff09**\uff1a**\u6279\u91cf\u56fa\u5b9a**\uff08\u8d77\u59cb\u4f4d\u7f6e \u2192 \u5f39\u7a97\u786e\u8ba4 \u2192 \u8fde\u7eed\u586b\u5145\uff09+ **\u6279\u91cf\u9690\u85cf** + **\u6279\u91cf\u79fb\u9664**\uff08\u4e8c\u6b21\u786e\u8ba4\uff09\u3002\n  - \u72b6\u6001\u7b5b\u9009\u5668\uff1a\u5168\u90e8 / \u5728\u552e / \u5df2\u4e0b\u67b6 / \u5df2\u552e\u51fa\uff1b\u53ef\u89c1\u72b6\u6001\u7b5b\u9009\uff1a\u5168\u90e8 / \u53ef\u89c1 / \u5df2\u9690\u85cf\uff1b\u6309\u540d\u79f0 / ID \u641c\u7d22\uff1b\u6309\u54c1\u724c\u7b5b\u9009\u3002\n  - \u300c+ \u6dfb\u52a0\u5546\u54c1\u300d\u6253\u5f00\u9009\u54c1\u5668\u3002\n  - **\u9690\u85cf vs \u79fb\u9664**\uff1a\u9690\u85cf = \u4e0d\u5728\u672c Collection \u524d\u53f0\u5c55\u793a\uff0c\u4fdd\u7559\u9009\u54c1\u5173\u7cfb\u4e0e\u56fa\u5b9a\u4f4d\u7f6e\u3001\u53ef\u4e00\u952e\u6062\u590d\uff1b\u79fb\u9664 = \u4ece\u672c Collection \u5f7b\u5e95\u5220\u9664\u9009\u54c1\u5173\u7cfb\uff0c\u9700\u91cd\u65b0\u6dfb\u52a0\u3002\n\n**\u4fa7\u6ed1\u62bd\u5c49\uff1a\u9009\u54c1\u5668\uff08\u624b\u52a8\u9009\u54c1\u4e13\u7528\uff09**\n- \u6807\u9898\u300c\u6dfb\u52a0\u5546\u54c1 \u2014 \u624b\u52a8\u9009\u54c1\u300d\u3002\n- \u6761\u4ef6\u6784\u5efa\u5668\uff08\u590d\u7528 \u00a72.1\uff0c\u4f5c\u5019\u9009\u7b5b\u9009\u5668\uff0c\u4e0d\u4fdd\u5b58\u4e3a\u89c4\u5219\uff09+ \u5b9e\u65f6\u5019\u9009\u6570\uff08\u5982\u300c\u7b26\u5408\u6761\u4ef6\u7684\u5019\u9009\u5546\u54c1 328 \u4ef6\u300d\uff09\u3002\n- \u5019\u9009\u5217\u8868\uff08checkbox \u591a\u9009\uff0c\u542b\u540d\u79f0/\u54c1\u724c/\u4ef7\u683c/\u6210\u8272/\u4e0a\u67b6\u65f6\u95f4\uff09+ \u5206\u9875\uff08\u6bcf\u9875 20\uff09\u3002\n- \u5e95\u90e8\u56fa\u5b9a\uff1a\u300c\u6dfb\u52a0\u9009\u4e2d\u5546\u54c1\uff08N\uff09\u300d+\u300c\u53d6\u6d88\u300d\u3002\n- \u5df2\u5728\u5df2\u9009\u5217\u8868\u7684\u5546\u54c1 checkbox \u7f6e\u7070\u3002\n\n**Step 3\uff1a\u7b5b\u9009\u914d\u7f6e**\uff1a\u89c1 \u00a72.6\u3002\n\n**\u4fdd\u5b58\u6821\u9a8c\uff08\u7b5b\u9009\u914d\u7f6e\uff09**\n\n\u4fdd\u5b58\u524d\u6821\u9a8c\u5df2\u542f\u7528\u7684\u7b5b\u9009\u6a21\u5757\u662f\u5426\u914d\u7f6e\u5b8c\u6210\u3002\u4e24\u6a21\u5757\u5747\u4e0d\u5206\u7aef\uff0c\u6821\u9a8c\u53e3\u5f84\u5982\u4e0b\uff1a\n- **\u79fb\u52a8\u7aef\u56fe\u6587\u7b5b**\uff1a\u4ec5\u4f5c\u7528\u4e8e\u79fb\u52a8\u7aef\u3001\u65e0\u9002\u7528\u7ec8\u7aef\u5b57\u6bb5\uff0c\u6a21\u5757\u542f\u7528\u65f6\u9700 \u22651 \u6761 active \u9009\u9879\u3002\n- **\u79fb\u52a8\u7aef\u5feb\u7b5b**\uff1a\u4ec5\u4f5c\u7528\u4e8e\u79fb\u52a8\u7aef\u3001\u65e0\u9002\u7528\u7ec8\u7aef\u5b57\u6bb5\uff0c\u6a21\u5757\u542f\u7528\u65f6\u53ea\u9700 \u22651 \u6761\u9009\u9879\u3002\n\n**\u56fe\u6587\u7b5b\u56fe\u7247\u4fdd\u5b58\u6821\u9a8c**\uff1a\u79fb\u52a8\u7aef\u56fe\u6587\u7b5b\u5904\u4e8e**\u56fe\u6587\u6a21\u5f0f\uff08`display_mode=graphic`\uff09**\u65f6,\u6bcf\u6761 active \u9009\u9879\u5fc5\u987b\u5df2\u914d\u56fe;\u5b58\u5728\u7f3a\u56fe active \u9879\u5219**\u62e6\u622a\u4fdd\u5b58**(\u4fdd\u5b58\u5373\u6821\u9a8c,\u4e0d\u5141\u8bb8\u7f3a\u56fe\u5b58\u8349\u7a3f)\u3002\u8fd0\u8425\u5982\u9700\u5148\u5b58\u6846\u67b6,\u53ef\u5207\u300c\u7eaf\u6587\u672c\u6a21\u5f0f\u300d(\u5168\u90e8\u65e0\u56fe)\u6216\u5173\u95ed\u56fe\u6587\u7b5b\u6a21\u5757\u603b\u5f00\u5173\u3002\n\n\u547d\u4e2d\u300c\u6a21\u5757\u542f\u7528\u5374\u65e0\u9009\u9879\u300d**\u6216\u300c\u56fe\u6587\u6a21\u5f0f\u5b58\u5728\u7f3a\u56fe active \u9879\u300d**\u65f6\u5f39\u7a97\u62e6\u622a\u4fdd\u5b58\uff1a\n- \u6807\u9898\uff1a\u300c\u7b5b\u9009\u914d\u7f6e\u672a\u5b8c\u6210\uff0c\u65e0\u6cd5\u4fdd\u5b58\u300d\n- \u6b63\u6587\uff08\u65e0\u9009\u9879\uff09\uff1a\u300c\u5df2\u542f\u7528\u7684\u79fb\u52a8\u7aef\u56fe\u6587\u7b5b / \u79fb\u52a8\u7aef\u5feb\u7b5b\u6a21\u5757\u5c1a\u65e0\u4efb\u4f55\u914d\u7f6e\u9879\u3002\u8bf7\u5728\u300c\u7b5b\u9009\u914d\u7f6e\u300d\u6b65\u9aa4\u4e3a\u5df2\u542f\u7528\u7684\u6a21\u5757\u81f3\u5c11\u6dfb\u52a0\u4e00\u6761\u9009\u9879\uff1b\u5982\u67d0\u6a21\u5757\u65e0\u9700\u542f\u7528\uff0c\u53ef\u5173\u95ed\u8be5\u6a21\u5757\u603b\u5f00\u5173\u3002\u300d\n- \u6b63\u6587\uff08\u7f3a\u56fe\uff09\uff1a\u300c\u79fb\u52a8\u7aef\u56fe\u6587\u7b5b\u5904\u4e8e\u56fe\u6587\u6a21\u5f0f,\u5b58\u5728\u672a\u914d\u56fe\u7684\u5c55\u793a\u4e2d\u9009\u9879\u3002\u8bf7\u4e3a\u7f3a\u56fe\u9879\u8865\u56fe,\u6216\u5c06\u5c55\u793a\u5f62\u5f0f\u5207\u6362\u4e3a\u7eaf\u6587\u672c\u6a21\u5f0f\u3002\u300d\n- \u6309\u94ae\uff1a\u300c\u53bb\u914d\u7f6e\u300d\uff08\u8df3\u8f6c\u7b5b\u9009\u914d\u7f6e\u6b65\uff09\u3002\n\n> \u300c\u65e0\u9700\u67d0\u6a21\u5757\u300d\u65f6\u5173\u95ed\u8be5\u6a21\u5757\u603b\u5f00\u5173\u5373\u53ef\uff08\u524d\u53f0\u4e0d\u5c55\u793a\u3001\u4e0d\u8981\u6c42\u914d\u7f6e\u9879\uff0c\u6821\u9a8c\u901a\u8fc7\uff09\u3002\n\n**Collection \u72b6\u6001\u7ba1\u7406**\n\n| \u64cd\u4f5c | \u8bf4\u660e | \u4e8c\u6b21\u786e\u8ba4 |\n|---|---|---|\n| \u5173\u95ed\uff08inactive\uff09| URL \u8fd4\u56de 404\uff1b\u5546\u54c1\u53ef\u89c1\u6027\u4e0d\u53d7\u5f71\u54cd\uff1b\u914d\u7f6e\u5b8c\u6574\u4fdd\u7559 | \u2705\u300c\u786e\u8ba4\u5173\u95ed\uff1f\u6d88\u8d39\u8005\u5c06\u65e0\u6cd5\u8bbf\u95ee\u8be5 Collection\uff0c\u4f46\u5546\u54c1\u53ef\u901a\u8fc7\u5176\u4ed6\u9014\u5f84\u53d1\u73b0\u3002\u300d|\n| \u6062\u590d\u542f\u7528\uff08active\u u4e3e\u503c**\u53d6\u81ea\u5546\u54c1\u6a21\u5757**\uff0c\u81ea\u52a8\u540c\u6b65\uff0c\u8fd0\u8425**\u4e0d\u53ef\u589e\u5220\u3001\u4e0d\u53ef\u5408\u5e76\u5f52\u4e00\u5316**\uff0c\u4ec5\u53ef\u914d\u7f6e\u524d\u53f0**\u6392\u5e8f\u7b56\u7565 + Pin \u56fa\u5b9a\u4f4d**\uff08\u89c1\u4e0b\u65b9\u300c\u679a\u4e3e\u503c\u6392\u5e8f\u4e13\u9879\u7ea6\u5b9a\u300d\uff09\u3002\n- `count = 0` \u7684\u503c\u524d\u53f0\u5b9e\u65f6\u9690\u85cf\u3002\u5546\u54c1\u6570\u53e3\u5f84 = \u5168\u7ad9\u300c\u5728\u67b6 + \u6709\u5e93\u5b58\u300d\u547d\u4e2d\u8be5\u503c\u7684\u5546\u54c1\u6570\u3002\n- \u8272\u7cfb\uff08color_family\uff09\u7ef4\u5ea6\u7684\u8272\u503c\uff08hex\uff09\u3001\u8272\u7cfb\u540d\u79f0\u7531\u5546\u54c1\u4fa7\u300c\u8272\u7cfb \u2192 \u989c\u8272\u503c\u300d\u6620\u5c04\u8868\uff08\u5546\u54c1\u7cfb\u7edf\u7ef4\u62a4\uff09\u63d0\u4f9b\uff0c\u672c\u6a21\u5757\u53ea\u8bfb\uff1b\u524d\u53f0\u300c\u989c\u8272\u5361\u7247\u300d\u636e\u6b64\u5c55\u793a\u8272\u5757\u3002\n\n> \u4e0e v0.1 \u7684\u533a\u522b\uff1a\u79fb\u9664 value_mapping \u62d6\u62fd\u5f52\u4e00\u5316\u5206\u7ec4\u3001size_system \u4e13\u5c5e\u914d\u7f6e\uff08\u8de8\u4f53\u7cfb\u6362\u7b97\u3001ONE SIZE \u7b56\u7565\u3001\u54c1\u724c\u5c3a\u7801\u517c\u5bb9\uff09\u3002\u5c3a\u7801\u8d70 attribute(size/ring_size \u7b49) \u7ef4\u5ea6\uff0c\u6309\u679a\u4e3e\u503c\u6392\u5e8f\u7b56\u7565\u5c55\u793a\u3002\n\n**\u679a\u4e3e\u503c\u6392\u5e8f\u4e13\u9879\u7ea6\u5b9a\uff08v0.14 \u91cd\u5199\uff1a\u6392\u5e8f\u7b56\u7565 + Pin \u56fa\u5b9a\u4f4d\uff09**\n\n\u679a\u4e3e\u503c\u53d6\u81ea\u5546\u54c1\u6a21\u5757\u3001\u8fd0\u8425\u4e0d\u53ef\u589e\u5220\uff1b\u5176\u524d\u53f0\u5c55\u793a\u987a\u5e8f\u7531\u300c**\u6392\u5e8f\u7b56\u7565**\u300d\u4e0e\u300c**Pin \u56fa\u5b9a\u4f4d**\u300d\u4e24\u5c42\u51b3\u5b9a\u3002\u9002\u7528\u4e8e attribute / series / condition \u6570\u636e\u6e90\uff08**brand \u56fa\u5b9a\u5b57\u6bcd\u5e8f A\u2192Z\u3001\u4e0d\u53ef\u6539\u3001\u4e0d\u63d0\u4f9b\u56fa\u5b9a\u4f4d\u7f6e* u6587\u5373\u53ef\uff0c\u6392\u5e8f\u80fd\u529b\u6765\u81ea\u5b57\u7b26\u96c6\u89c4\u5219\u3001\u975e\u6570\u636e\u672c\u8eab\u3002\u591a\u97f3\u5b57\u6309 collation \u7684\u9ed8\u8ba4\u8bfb\u97f3\u6392\u5e8f\uff08\u5982\u300c\u91cd\u300d\u53ef\u80fd\u53d6 zhong \u800c\u975e chong\uff09\uff0c\u5982\u4e2a\u522b\u503c\u987a\u5e8f\u4e0d\u7b26\u9884\u671f\uff0c\u7528 Pin \u56fa\u5b9a\u4f4d\u8c03\u6574\uff0c\u4e0d\u5f15\u5165\u9010\u6761\u62fc\u97f3\u914d\u7f6e\u3002\n\n**\u2462 \u56fa\u5b9a\u4f4d\u7f6e\uff08\u5185\u90e8 key\uff1aPin / position\uff09**\n\n> **v0.16 \u672f\u8bed\u53d8\u66f4**\uff1a\u540e\u53f0 UI \u5168\u90e8\u7531\u300cPin\u300d\u6539\u4e3a\u300c**\u56fa\u5b9a\u4f4d\u7f6e**\u300d\uff08\u8fd0\u8425\u53cd\u9988\u300cPin\u300d\u6613\u8bef\u89e3\u4e3a\u522b\u9488\uff09\uff0c\u5185\u90e8\u5b57\u6bb5 key \u4e0d\u53d8\u3002\n> **v0.16 \u4ea4\u4e92\u53d8\u66f4**\uff1a\u679a\u4e3e\u503c\u6392\u5e8f\u5217\u8868\u4e2d\u7684**\u5e8f\u53f7\u79fb\u5230\u9009\u9879\u6846\u5916**\uff08\u5e38\u9a7b\u6846\u5de6\u4fa7\uff0c\u4f5c\u4e3a\u7edd\u5bf9\u4f4d\u7f6e\u7f16\u53f7\uff09\uff0c\u4e0d\u968f\u9009\u9879\u6846\u79fb\u52a8\uff1b\u539f\u5e8f\u53f7\u5728\u6846\u5185\u4f1a\u968f\u56fa\u5b9a/\u91cd\u6392\u4e00\u8d77\u79fb\u52a8\uff0c\u6613\u88ab\u8bef\u89e3\u4e3a\u9879\u76ee\u81ea\u5e26\u7f16\u53f7\u3002\n> **v0.18 \u4ea4\u4e92\u53d8\u66f4**\uff1a\u56fa\u5b9a\u4f4d\u7f6e\u8f93\u5165\u6846\u524d\u7f6e**\u5916\u7f6e\u6807\u7b7e\u300c\u8f93\u5165\u5e8f\u53f7:\u300d**\u3001\u8f93\u5165\u6846\u5185 placeholder \u6536\u655b\u4e3a\u300c\u56fa\u5b9a\u6392\u5e8f\u300d\uff08\u539f placeholder\u300c\u8f93\u5165\u5e8f\u53f7\u56fa\u5b9a\u6392\u5e8f\u300d\u5728\u7a84\u6846\u5185\u663e\u793a\u4e0d\u5168\u88ab\u622a\u65ad\uff09\uff1b\u8f93\u5165\u6846\u5bbd\u5ea6\u76f8\u5e94\u6536\u7a84\u3002\u9002\u7528**\u4e24\u5904**\uff08\u7c7b\u76ee\u56fa\u5b9a\u4f4d\u7f6e\u3001\u6253\u5e73\u6001\uff09\u2014\u2014**\u5206\u7ec4\u6001\u5df2\u4e8e v0.18 \u6539\u4e3a\u300c\u5168\u5c40\u6392\u5e8f\u8868\u300d\u62d6\u62fd\u5b9a\u5e8f\u3001\u4e0d\u518d\u6709\u56fa\u5b9a\u4f4d\u7f6e\u8f93\u5165\u6846**\uff08\u89c1\u4e0b\u65b9\u300c\u6309\u4f5c\u7528\u57df\u5206\u7ec4\u300d\u4e13\u9879\uff09\u3002\n\n- \u5728\u679a\u4e3e\u503c\u5217\u8868\u7684\u300c**\u56fa\u5b9a\u4f4d\u7f6e**\u300d\u5217\u8f93\u5165\u5e8f\u53f7\uff0c\u53ef\u628a\u67d0\u503c**\u56fa\u5b9a\u5230\u540c\u7ef4\u5ea6\u5185\u7684\u7edd\u5bf9\u4f4d\u7f6e**\uff08\u7ed1\u503c key\u3001\u4e0d\u7ed1\u4e0b\u6807\uff09\uff1b\u672a\u56fa\u5b9a\u7684\u503c\u6309\u5f53\u524d\u6392\u5e8f\u7b56\u7565\u81ea\u52a8\u586b\u5145\u5269\u4f59\u4f4d\u3002\n- \u540c\u4e00\u5e8f\u53f7\u88ab\u5360\u7528\u65f6\uff0c\u65b0\u503c**\u9876\u66ff**\u539f\u56fa\u5b9a\u503c\uff0c\u539f\u503c\u6062\u590d\u6309\u7b56\u7565\u81ea\u52a8\u6392\u5e8f\uff0c\u5e76 Toast \u63d0\u793a\u300c\u4f4d\u7f6e N \u539f\u4e3a\u300c{\u65e7\u503c}\u300d\uff0c\u5df2\u88ab\u300c{\u65b0\u503c}\u300d\u9876\u66ff\uff0c\u300c{\u65e7\u503c}\u300d\u6062\u590d\u81ea\u52a8\u6392\u5e8f\u300d\u3002\n- \u5e8f\u53f7\u8d8a\u754c\u81ea\u52a8\u6536\u655b\u5230 [1, \u603b\u6570]\uff1b\u6e05\u7a7a\u56fa\u5b9a\u4f4d\u7f6e\u6846\u5373\u53d6\u6d88\u56fa\u5b9a\u3002\n- \u5df2\u56fa\u5b9a\u7684\u503c\u5728\u5217\u8868\u4e2d\u4ee5\u300c\u56fa\u5b9a N\u300d\u6807\u8bb0\u6807\u8bc6\u3002\n\n> \u300c\u6309\u70b9\u51fb\u91cf / \u70b9\u51fb\u7387 / \u9500\u91cf\u7b49\u6307\u6807\u6392\u5e8f\u300d\u4e3a\u4e8c\u671f\u89c4\u5212\uff08\u9700\u524d\u53f0\u57cb\u70b9\u7edf\u8ba1\uff09\uff0c\u672c\u671f\u4e0d\u63d0\u4f9b\u3002\n\n**\u5c5e\u6027\uff08attribute\uff09\u6570\u636e\u6e90\u4e13\u9879\u7ea6\u5b9a\uff1a\u6309\u4f5c\u7528\u57df\u5206\u7ec4**\n\n\u90e8\u5206\u5c5e\u6027\u7684\u540c\u540d\u679a\u4e3e\u503c\u5728\u4e0d\u540c\u7c7b\u76ee\u4e0b\u8bed\u4e49\u5e76\u4e0d\u4e00\u81f4\uff08\u5178\u578b\u5982 `size`\uff1a\u670d\u88c5\u7684 S/M/L \u4e0e\u978b\u7c7b\u7684 36/37/38\uff09\uff0c\u82e5\u5168\u7ad9\u6253\u5e73\u5c55\u793a\u4f1a\u9020\u6210\u8de8\u7c7b\u76ee\u6df7\u6392\u3001\u8bed\u4e49\u9519\u4e71\u3002\u4e3a\u6b64 attribute \u7ef4\u5ea6\u63d0\u4f9b\u300c\u6309\u4f5c\u7528\u57df\u5206\u7ec4\u300d\u5f00\u5173\u3002\n\n- **\u5f00\u5173\u4f4d\u7f6e\u4e0e\u663e\u793a\u6761\u4ef6**\uff1a\u7ef4\u5ea6\u7f16\u8f91\u9875\uff0c\u6570\u636e\u6e90\u9009\u62e9\u300c\u5c5e\u6027(attribute)\u300d\u65f6\u5373\u663e\u793a\u8be5\u5f00\u5173\uff1b\u5728\u672a\u9009\u5b9a\u5177\u4f53\u300c\u5173\u8054\u5c5e\u6027\u300d\u524d\uff0c\u5f00\u5173\u7f6e\u7070\u5e76\u63d0\u793a\u300c\u8bf7\u5148\u9009\u62e9\u5173\u8054\u5c5e\u6027\u300d\uff0c\u9009\u5b9a\u540e\u53ef\u7528\u3002\n- **\u9ed8\u8ba4\u503c**\uff1a\u5f00\u5173**\u9ed8\u8ba4\u4e00\u5f8b\u4e0d\u542f\u7528\uff08\u5173\u95ed\uff09**\uff0c\u7531\u8fd0\u8425\u6309\u9700\u624b\u52a8\u5f00\u542f\u3002\u5bf9\u540c\u540d\u503c\u8de8\u7c7b\u76ee\u8bed\u4e49\u4e0d\u540c\u7684\u5c5e\u6027\uff08\u5982 `size`\u3001`bag_size`\uff09\u5728\u5f00\u5173\u65c1\u7ed9\u51fa\u300c\u5efa\u8bae\u5f00\u542f\u300d\u6587\u6848\u63d0\u793a\uff0c\u4f46**\u4e0d\u6539\u53d8\u9ed8\u8ba4\u6001**\uff08\u4ecd\u9ed8\u8ba4\u5173\u95ed\uff09\uff1b\u5168\u7ad9\u8bed\u4e49\u4e00\u81f4\u7684\u5c5e\u6027\uff08\u5982 `color`\u3001`material`\uff09\u65e0\u63d0\u793a\u3002\u8fd0\u8425\u5f00\u542f\u540e\u4ee5\u7ef4\u5ea6\u914d\u7f6e\u4e3a\u51c6\u3002\n- **\u5c55\u793a\u6837\u5f0f\u4e0e\u5f00\u5173\u8054\u52a8**\uff1a**\u5173\u95ed**\u300c\u6309\u4f5c\u7528\u57df\u5206\u7ec4\u300d\u65f6\uff0c\u5c55\u793a\u7c7b\u578b**\u4e0d\u51fa\u73b0\u300c\u5206\u7ec4\u300d\u9009\u9879**\uff08\u65e0\u5206\u7ec4\u7ed3\u6784\u53ef\u4e0b\u53d1\uff0c\u53ea\u80fd\u9009\u53cc\u5217\u5361\u7247/\u5355\u5217\u6587\u672c/\u989c\u8272\u5361\u7247/\u5c3a\u7801\u901a\u7528\u6837\u5f0f\uff09\uff1b**\u5f00\u542f**\u540e\u53ef\u5728**\u300c\u5206\u7ec4\u300d\u6216\u300c\u5c3a\u7801\u901a\u7528\u6837\u5f0f\uff08size_grid\uff09\u300d\u95f4\u4e8c\u9009\u4e00**\uff08\u5404\u7b5b\u9009\u6a21\u5757\u5206\u522b\u914d\u7f6e\uff09\u2014\u2014v0.18 \u8d77\u4e0d\u518d\u56fa\u5b9a\u4e3a\u300c\u5206\u7ec4\u300d\uff1b\u4e24\u8005\u5747\u57fa\u4e8e\u540c\u4e00\u5957\u4f5c\u7528\u57df\u5206\u7ec4\u6570\u636e\u7ed3\u6784\uff08\u7ec4\u6807\u9898+\u7ec4\u5185\u503c\uff09\uff0c\u5dee\u5f02\u4ec5\u5728\u7ec4\u5185\u503c\u7684\u524d\u53f0\u5448\u73b0\uff08\u5206\u7ec4=\u7ad6\u6392\u3001size_grid=\u4e00\u884c\u591a\u5217\u5e73\u94fa\uff09\u3002\n- **\u5f00\u542f\u540e\u7684\u5c55\u793a**\uff1a\u679a\u4e3e\u503c\u6309\u5546\u54c1\u547d\u4e2d\u7684\u300c\u7c7b\u76ee / \u54c1\u724c / \u7cfb\u5217\u300d\u4f5c\u7528\u57df\u89c4\u5219**\u81ea\u7136\u5f52\u7ec4**\uff1b\u5404\u7ec4\u7ec4\u5185**\u53ea\u8bfb\u9884\u89c8\u3001\u4e0d\u53ef\u7f16\u8f91**\uff0c\u987a\u5e8f\u4e00\u5f8b\u8ddf\u968f\u300c\u5168\u5c40\u6392\u5e8f\u8868\u300d\u7684\u7edd\u5bf9\u5e8f\u6e32\u67d3\uff08\u89c1\u4e0b\u6761\uff09\uff0c**\u4e0d\u5c55\u793a\u6392\u5e8f\u7b56\u7565\u4e0b\u62c9\u3001\u4e0d\u63d0\u4f9b\u9010\u7ec4\u56fa\u5b9a\u4f4d\u7f6e**\uff1b\u7ec4\u95f4\u4e0d\u5408\u5e76\u3002\n- **\u7ec4\u5185\u6392\u5e8f\uff1a\u5168\u5c40\u6392\u5e8f\u8868\uff08\u552f\u4e00\u7f16\u8f91\u9762\uff0c\u62d6\u62fd\u7edd\u5bf9\u5e8f\uff09**\uff08v0.18 \u91cd\u6784\uff0c\u66ff\u4ee3\u539f\u300c\u9010\u7ec4\u56fa\u5b9a\u4f4d\u7f6e\u300d\u6a21\u578b\uff09\uff1a\u5206\u7ec4\u6001\u4e0b\u8fd0\u8425**\u4e0d\u518d\u9010\u7ec4\u914d\u7f6e**\uff0c\u6539\u4e3a\u5728\u7ef4\u5ea6\u7f16\u8f91\u9875\u300c\u5206\u7ec4\u9884\u89c8\u300d\u533a\u7684**\u300c\u8c03\u6574\u679a\u4e3e\u503c\u6392\u5e8f\u300d\u62bd\u5c49**\u91cc\u7ef4\u62a4**\u4e00\u5f20\u5168\u5c40\u6709\u5e8f\u5217\u8868**\u2014\u2014\u62d6\u62fd\u5373\u5b9a\u5e8f\uff0c\u8fd9\u662f**\u552f\u4e00\u7f16\u8f91\u9762**\u3002\u5404\u4f5c\u7528\u57df\u7ec4\u4e0d\u53c2\u4e0e\u6392\u5e8f\u3001\u7ec4\u5185\u4e3a**\u53ea\u8bfb\u9884\u89c8**\uff1a\u67d0\u503c\u5728\u5168\u5c40\u8868\u79fb\u52a8\u4e00\u6b21\uff0c**\u6240\u6709\u542b\u8be5\u503c\u7684\u7ec4\u540c\u6b65\u751f\u6548**\uff1b\u5404\u7ec4\u6309\u5168\u5c40\u7edd\u5bf9\u5e8f\u6e32\u67d3\u672c\u7ec4\u62e5\u6709\u7684\u503c\u3001\u672c\u7ec4\u6ca1\u6709\u7684\u503c**\u8df3\u8fc7**\uff08\u7f3a\u503c\u8df3\u8fc7\uff09\uff0c\u56e0\u6b64\u5404\u7ec4\u76f8\u5bf9\u5148\u540e\u4e00\u81f4\uff0c\u4e0d\u4f1a\u51fa\u73b0\u300cA \u7ec4 M \u5728 L \u524d\u3001B \u7ec4 M \u5728 L \u540e\u300d\u7684\u77db\u76fe\u3002\u9ed8\u8ba4\u5e8f\u590d\u7528\u5546\u54c1\u4fa7\u6570\u636e\u6e90\u987a\u5e8f\uff0c\u8fd0\u8425\u53ef\u6574\u8868\u62d6\u62fd\u8986\u76d6\u3002\n  - **\u5165\u53e3\u4f4d\u7f6e**\uff1a\u300c\u8c03\u6574\u679a\u4e3e\u503c\u6392\u5e8f\u300d\u6309\u94ae\u4f4d\u4e8e\u300c\u5206\u7ec4\u9884\u89c8\u300d\u641c\u7d22\u884c\u53f3\u4fa7\u3001\u7d27\u8d34\u300c\u5c55\u5f00\u5168\u90e8/\u6536\u8d77\u5168\u90e8\u300d\uff08\u79bb\u9884\u89c8\u6570\u636e\u8fd1\u3001\u4e1a\u52a1\u6613\u53d1\u73b0\uff09\uff1b\u70b9\u51fb\u6253\u5f00\u53f3\u4fa7\u62bd\u5c49\u3002\u62bd\u5c49\u6253\u5f00\u65f6\u5de6\u4fa7\u5206\u7ec4\u9884\u89c8\u4ecd\u53ef\u5bf9\u7167\u3002\n  - **\u8054\u52a8\u5355\u4f4d\u6309\u5c5e\u6027\u7c7b\u578b\u5206\u4e24\u7c7b**\uff08\u4f9d\u636e\u5546\u54c1\u7cfb\u7edf\u6570\u636e\u7ed3\u6784\uff09\uff1a\n    - **\u666e\u901a\u679a\u4e3e\u5c5e\u6027**\uff08material / color / hardware \u7b49\uff09\uff1a\u5404\u4f5c\u7528\u57df\u7ec4\u7684\u53ef\u7528\u503c\u90fd\u662f\u540c\u4e00\u4efd**\u5168\u5c40\u5019\u9009\u5217\u8868**\uff08`attribute_option`\uff09\u7684\u5b50\u96c6\uff08\u547d\u4e2d\u5373\u7528\u3001\u4e0d\u8de8\u5c42\u5408\u5e76\uff09\uff0c\u6545\u5168\u5c5e\u6027\u5171\u7528**\u4e00\u5f20\u5168\u5c40\u6392\u5e8f\u8868**\uff08\u5355\u4e00\u6709\u5e8f\u6570\u7ec4\uff09\uff1b\u9ed8\u8ba4\u590d\u7528\u5546\u54c1\u4fa7 `attribute_option.sort_order`\uff0c\u8fd0\u8425\u62d6\u62fd\u5373\u8986\u76d6\u3002\u62bd\u5c49\u5185**\u4e0d\u51fa\u73b0\u300c\u4f53\u7cfb\u987a\u5e8f\u300d\u5361\u7247**\u3002\n    - **\u5c3a\u7801\u5c5e\u6027**\uff08\u503c\u7ea6\u675f=size\uff0c\u503c\u6765\u81ea `size_system` / `size_value`\uff09\uff1a\u6309**\u5c3a\u7801\u4f53\u7cfb\u5404\u7ef4\u62a4\u4e00\u5f20\u5168\u5c40\u6392\u5e8f\u8868**\uff08\u9ed8\u8ba4\u590d\u7528\u4f53\u7cfb\u81ea\u5e26\u7684 `size_value` \u987a\u5e8f\uff09\u3002**\u540c\u4e00\u4f53\u7cfb\u7684\u7ec4\u5171\u4eab\u8be5\u4f53\u7cfb\u5e8f\u3001\u8054\u52a8\u4e00\u81f4\uff1b\u4e0d\u540c\u4f53\u7cfb\u4e92\u4e0d\u6df7\u6392\u3001\u4e92\u4e0d\u5f71\u54cd**\uff08\u4e0d\u540c\u4f53\u7cfb\u662f\u4e0d\u540c\u7684 size_value \u96c6\u5408\uff0c\u8de8\u4f53\u7cfb\u8bed\u4e49\u4e0d\u540c\u3001\u672c\u5c31\u4e0d\u5e94\u8054\u52a8\uff09\u3002\n  - **\u4f53\u7cfb\u987a\u5e8f\uff08v0.18 \u65b0\u589e\uff0c\u4ec5\u5c3a\u7801\u5c5e\u6027\uff09**\uff1a\u5f53\u4e00\u4e2a\u4f5c\u7528\u57df\u7ec4**\u540c\u65f6\u547d\u4e2d\u591a\u5957\u5c3a\u7801\u4f53\u7cfb**\uff08\u5982\u300c\u670d\u88c5 \u00b7 Moncler\u300d\u7ec4\u6df7\u5165\u5b57\u6bcd\u7801 S/M/L \u4e0e\u6570\u5b57\u7801 0/1/2/3\uff09\u65f6\uff0c\u7ec4\u5185\u5148\u6309**\u300c\u4f53\u7cfb\u987a\u5e8f\u300d\u5206\u6bb5**\u3001\u6bb5\u5185\u5404\u6309\u8be5\u4f53\u7cfb\u7684\u5168\u5c40\u5e8f\u6e32\u67d3\u3002\u300c\u4f53\u7cfb\u987a\u5e8f\u300d**\u5168\u7ad9\u7edf\u4e00**\uff0c\u8fd0\u8425\u5728\u540c\u4e00\u62bd\u5c49\u91cc**\u62d6\u62fd\u4f53\u7cfb\u5361\u7247**\u51b3\u5b9a\u6bb5\u843d\u5148\u540e\uff1b\u4ec5\u5c3a\u7801\u5c5e\u6027\u3001\u4e14\u5b9e\u9645\u547d\u4e2d \u22652 \u5957\u4f53\u7cfb\u65f6\u51fa\u73b0\uff0c\u5355\u4f53\u7cfb\uff08\u542b\u666e\u901a\u679a\u4e3e\u5c5e\u6027\uff09\u4e0d\u663e\u793a\u8be5\u5361\u7247\u3002\u4f53\u7cfb\u540d\u53ea\u8bfb\uff0c\u76f4\u63a5\u53d6\u5546\u54c1\u6a21\u5757\u300c\u5c3a\u7801\u4f53\u7cfb\u300d\u540d\u79f0\uff0c\u672c\u9875\u4e0d\u7ef4\u62a4\u3002\n  - **\u6253\u5e73\u6001\u4e0e\u5206\u7ec4\u6001\u4e24\u5957\u72ec\u7acb\u5b58\u50a8**\uff1a\u5173\u95ed\u300c\u6309\u4f5c\u7528\u57df\u5206\u7ec4\u300d\uff08\u6253\u5e73\u6001\uff09\u7528\u300c\u6392\u5e8f\u7b56\u7565 + \u56fa\u5b9a\u4f4d\u7f6e\u300d\uff08\u89c1\u4e0a\u6587\u300c\u679a\u4e3e\u503c\u6392\u5e8f\u4e13\u9879\u7ea6\u5b9a\u2460\u2461\u2462\u300d\uff0c\u843d `value_pins`\uff09\uff1b\u5f00\u542f\uff08\u5206\u7ec4\u6001\uff09\u7528\u300c\u5168\u5c40\u6392\u5e8f\u8868\u300d\uff08\u843d `value_order_grouped`\uff1a\u666e\u901a\u5c5e\u6027\u4e00\u5f20\u6709\u5e8f\u8868\u3001\u5c3a\u7801\u5c5e\u6027\u6309\u4f53\u7cfb\u5404\u4e00\u5f20\uff0c\u53e6\u5b58\u4f53\u7cfb\u987a\u5e8f `system_order`\uff09\u3002\u5207\u6362\u5f00\u5173\u53ea\u5207\u6362\u751f\u6548\u54ea\u5957\u914d\u7f6e\uff0c\u4e92\u4e0d\u5171\u4eab\u3001\u4e0d\u4e32\u5473\u3002\n  - **\u5206\u7ec4\u4f9d\u636e**\uff1a\u4ee5\u5546\u54c1\u547d\u4e2d\u7684\u4f5c\u7528\u57df\u89c4\u5219\u5b9e\u4f8b\u4e3a\u7ec4\uff08\u4e09\u5c42\u4f5c\u7528\u57df\u540c\u65f6\u751f\u6548\u3001\u547d\u4e2d\u5373\u505c\u3001\u4e0d\u8de8\u5c42\u5408\u5e76\uff09\u3002\n  - **\u7ec4\u95f4\u6392\u5e8f\uff08\u5d4c\u5957\uff0c\u8fd0\u8425\u4e0d\u624b\u52a8\u8c03\u7ec4\u5e8f\uff0c\u7cfb\u7edf\u81ea\u52a8\u51b3\u5b9a\uff09**\uff1a\u2460 \u5148\u6309**\u4e00\u7ea7\u7c7b\u76ee\u6392\u5e8f**\u2014\u2014**\u8bfb\u7b5b\u9009\u7ef4\u5ea6\u7ba1\u7406\u4e2d `category`\uff08\u540e\u53f0\u7c7b\u76ee\uff09\u7ef4\u5ea6\u91cc\u4e00\u7ea7\u7c7b\u76ee\u7684\u5c55\u793a\u987a\u5e8f**\uff08\u8be5\u7ef4\u5ea6\u300cPin \u533a + \u8ddf\u968f\u533a\u300d\u5408\u5e76\u51fa\u7684\u4e00\u7ea7\u7c7b\u76ee\u6b21\u5e8f\uff09\uff0c\u540c\u7c7b\u76ee\u805a\u4e3a\u4e00\u7247\uff1b**\u515c\u5e95**\uff1a\u82e5 `category` \u7ef4\u5ea6\u4e0d\u5b58\u5728\uff08\u672a\u5efa\u6216\u5df2\u5220\uff09\uff0c\u5219\u9000\u56de\u5546\u54c1\u7aef\u7c7b\u76ee `backend_category.sort_order`\uff08\u5347\u5e8f\u3001\u4e3a\u7a7a/\u5e76\u5217\u6309 category_id \u515c\u5e95\uff09\u3002\u2461 \u540c\u7c7b\u76ee\u5185\u6309**\u54c1\u724c\u540d A\u2192Z**\uff1b\u2462 \u540c\u54c1\u724c\u5185\u6309**\u7cfb\u5217\u540d A\u2192Z**\u3002\u4e2d\u6587\u540d\u6309\u62fc\u97f3 A\u2192Z\u3002\u5c3a\u7801\u6309\u4f53\u7cfb\u5206\u7ec4\u65f6\u7ec4\u95f4\u5e8f\u6cbf\u7528\u6b64\u5d4c\u5957\u89c4\u5219\uff0c\u4f53\u7cfb\u4e0d\u53e6\u4f5c\u4e3a\u6392\u5e8f\u952e\u3002\n  - **\u7ec4\u6807\u9898**\uff1a\u7531**\u540e\u7aef\u7528\u4e2d\u70b9\u76f4\u63a5\u62fc\u63a5\u300c\u4e00\u7ea7\u7c7b\u76ee\u540d \u00b7 \u54c1\u724c\u540d \u00b7 \u7cfb\u5217\u540d\u300d**\uff08\u7a7a\u6bb5\u8df3\u8fc7\uff09\u540e\u4e0b\u53d1\uff0c\u524d\u7aef\u539f\u6837\u5c55\u793a\uff08\u4e0d\u518d\u7531\u524d\u7aef\u62fc\u63a5\uff09\uff1b\u4f5c\u7528\u57df\u7ec4\u5408\u52a8\u6001\u589e\u51cf\u65f6\u65e0\u9700\u8fd0\u8425\u7ef4\u62a4\u3002\n  - **\u7ec4\u6807\u9898\u591a\u8bed\u8a00\u53d6\u6570\uff08\u524d\u53f0\u591a\u8bed\u8a00\u573a\u666f\uff09**\uff1a\u7ec4\u6807\u9898\u5404\u6bb5\u540d\u79f0\u6309**\u524d\u53f0\u5f53\u524d\u8bed\u8a00**\u53d6\uff0c**\u7edf\u4e00\u4f18\u5148\u7ea7\uff1a\u8fd0\u8425\u5728\u7ef4\u5ea6\u914d\u7f6e\u7684\u300c\u524d\u53f0\u5c55\u793a\u540d\u300d\uff08\u6ce8\u518c\u7ffb\u8bd1 key\uff09> \u7ffb\u8bd1\u6a21\u5757\u591a\u8bed\u8a00\u540d > fallback \u9ed8\u8ba4\u8bed\u8a00\u539f\u503c**\u3002\u5404\u6bb5\u6570\u636e\u6765\u6e90\u2014\u2014**\u54c1\u724c\u540d / \u7cfb\u5217\u540d**\uff1a\u5546\u54c1\u7cfb\u7edf\u6709\u82f1\u6587\u4e13\u540d\u5217\uff08`brand_name_en` / `series_name_en`\uff09\uff0c\u6309\u5f53\u524d\u8bed\u8a00\u53d6\u5bf9\u5e94\u4e13\u540d\uff1b**\u4e00\u7ea7\u7c7b\u76ee\u540d**\uff1a**\u4f18\u5148\u8bfb\u7b5b\u9009\u7ef4\u5ea6\u7ba1\u7406 `category` \u7ef4\u5ea6\u4e2d\u8be5\u4e00\u7ea7\u7c7b\u76ee\u914d\u7f6e\u7684\u524d\u53f0\u5c55\u793a\u540d**\uff08\u8fd0\u8425\u5728 category \u7ef4\u5ea6\u914d\u7684\u5c55\u793a\u540d\u3001\u6ce8\u518c\u591a\u8bed\u8a00 key\uff09\uff1b**\u515c\u5e95**\uff1a`category` \u7ef4\u5ea6\u4e0d\u5b58\u5728\u65f6,\u9000\u56de\u7ffb\u8bd1\u6a21\u5757\u5bf9 `category_name` \u7684\u8bd1\u540d > \u5546\u54c1\u7aef `category_name` \u539f\u503c\u3002\u5546\u54c1\u7cfb\u7edf\u4ec5\u5355\u5217 `category_name`\u3001\u65e0\u82f1\u6587\u5217\u3002\u56e0\u6b64\u4e3a\u907f\u514d\u7ec4\u6807\u9898\u4e2d\u82f1\u6df7\u6392\uff0c**\u8fd0\u8425\u53ef\u5728 `category` \u7ef4\u5ea6\u7684\u7c7b\u76ee\u8282\u70b9\u914d\u7f6e\u300c\u524d\u53f0\u5c55\u793a\u540d\u300d**\uff08\u89c1\u4e0b\u65b9\u300c\u540e\u53f0\u7c7b\u76ee\u4e13\u9879\u300d\uff09\uff0c\u7531\u7ffb\u8bd1\u6a21\u5757\u4ea7\u51fa\u5404\u8bed\u8a00\u7248\u672c\u3002\u540e\u7aef**\u6309\u5f53\u524d\u8bed\u8a00\u89e3\u6790\u597d\u6bcf\u6bb5\u540e\u62fc\u6210\u6574\u4e32\u4e0b\u53d1**\uff0c\u524d\u7aef\u539f\u6837\u5c55\u793a\u3001\u4e0d\u53c2\u4e0e\u62fc\u63a5\u4e0e\u7ffb\u8bd1\u3002\n  - **\u7ec4\u5408\u5f02\u6b65\u751f\u6210**\uff1a\u521a\u5f00\u542f\u300c\u6309\u4f5c\u7528\u57df\u5206\u7ec4\u300d\u65f6\uff0c\u540e\u7aef\u9700\u5f02\u6b65\u626b\u63cf\u5168\u7ad9\u5546\u54c1\u5e76\u5f52\u7c7b\uff0c\u4f5c\u7528\u57df\u7ec4\u5408**\u4e0d\u4f1a\u5373\u65f6\u751f\u6210**\uff08\u901a\u5e38\u6570\u5206\u949f\uff0c\u7ec4\u5408\u591a\u65f6\u66f4\u4e45\uff09\u3002**UX \u89c4\u8303**:\u2460\u751f\u6210\u671f\u95f4\u7ef4\u5ea6\u7f16\u8f91\u9875\u663e\u793a\u5360\u4f4d\u63d0\u793a\u300c**\u5206\u7ec4\u6570\u636e\u5f52\u7eb3\u4e2d\u2026**\u300d(loading \u6001,\u4e0d\u663e\u793a\u7a7a\u5217\u8868);\u8fd0\u8425\u53ef\u5148\u4fdd\u5b58\u7ef4\u5ea6\u3001\u7a0d\u540e\u56de\u9875\u9762**\u5237\u65b0**\u67e5\u770b\u5b9e\u9645\u5206\u7ec4\u3002\u2461**\u751f\u6210\u5b8c\u6210\u524d\u524d\u53f0\u6309\u300c\u5e73\u94fa\u300d\u5f62\u6001\u5c55\u793a**(\u5373\u672a\u5206\u7ec4\u7684\u679a\u4e3e\u503c\u6253\u5e73\u5217\u8868),\u5206\u7ec4\u6570\u636e\u751f\u6548\u540e\u81ea\u52a8\u5207\u6362\u4e3a\u5206\u7ec4\u5c55\u793a\u3002\u2462**\u5f02\u6b65 job \u5931\u8d25\u5219\u81ea\u52a8\u91cd\u8dd1**(\u7406\u8bba\u4e0a\u987b\u4fdd\u8bc1\u6700\u7ec8\u8dd1\u51fa);\u515c\u5e95\u673a\u5236:\u6bcf\u5c0f\u65f6\u5b9a\u65f6\u91cd\u8dd1\u4e00\u6b21,\u4e14\u8fd0\u8425\u6bcf\u6b21\u300c\u5173\u95ed\u2192\u91cd\u65b0\u5f00\u542f\u300d\u5206\u7ec4\u5f00\u5173\u5b9e\u65f6\u89e6\u53d1\u4e00\u6b21\u91cd\u8dd1\u3002\u2463\u589e\u91cf\u540c\u6b65:\u6bcf\u5f52\u7eb3\u5b8c\u4e00\u7ec4\u5373\u5c40\u90e8\u66f4\u65b0\u53ef\u89c1,\u4e0d\u5fc5\u7b49\u5168\u90e8\u5b8c\u6210\u3002\n  - **\u4e0e\u7c7b\u76ee\u300c\u5206\u7ec4\u300d\u6837\u5f0f\u6570\u636e\u7ed3\u6784\u4e00\u81f4**\uff1a\u5747\u4e3a\u300c\u6807\u9898 + \u503c\u300d\u7ed3\u6784\u2014\u2014\u5c5e\u6027\u4f5c\u7528\u57df\u5206\u7ec4\u7684\u300c\u6807\u9898=\u7c7b\u76ee\u540d\u00b7\u54c1\u724c\u540d\u00b7\u7cfb\u5217\u540d\u3001\u503c=\u7ec4\u5185\u679a\u4e3e\u503c\u300d\uff0c\u7c7b\u76ee\u7ef4\u5ea6\u7684\u300c\u6807\u9898=\u4e00\u7ea7\u7c7b\u76ee\u540d\u3001\u503c=\u4e09\u7ea7\u7c7b\u76ee\u540d\u300d\uff1b\u524d\u7aef\u7528\u540c\u4e00\u5957\u5206\u7ec4\u7ec4\u4ef6\u6e32\u67d3\u3002\n- **\u5173\u95ed\u540e\u7684\u5c55\u793a**\uff1a\u679a\u4e3e\u503c\u5e73\u94fa\u4e3a\u5355\u4e00\u5217\u8868\uff0c\u6309\u300c\u679a\u4e3e\u503c\u6392\u5e8f\u300d\u914d\u7f6e\u7684\u7b56\u7565\u7edf\u4e00\u6392\u5e8f\u3002\n- **\u843d\u5e93**\uff1a\u7ef4\u5ea6\u914d\u7f6e\u6301\u4e45\u5316 `scope_grouped`\uff08\u5e03\u5c14\uff09\u3002\u5f00\u542f\u65f6 `display_type_*` \u56fa\u5b9a\u4e3a `tree`\uff08\u5206\u7ec4\uff09\u3002\n\n**\u540e\u53f0\u7c7b\u76ee\uff08backend_category\uff09\u6570\u636e\u6e90\u4e13\u9879\u7ea6\u5b9a\uff1a\u5168\u91cf\u7eb3\u5165\u4e0e\u987a\u5e8f\u5408\u5e76**\n\n\u540e\u53f0\u7c7b\u76ee\u6570\u636e\u6e90**\u56fa\u5b9a\u4e09\u7ea7\u7ed3\u6784\u3001\u5168\u91cf\u7eb3\u5165**\uff1a\u7c7b\u76ee\u6a21\u5757\uff08\u5546\u54c1\u4fa7\uff09\u662f\u552f\u4e00\u771f\u76f8\u6e90\uff0c\u7c7b\u76ee\u7684\u589e\u5220\u81ea\u52a8\u540c\u6b65\u8fdb\u672c\u7ef4\u5ea6\uff0c\u8fd0\u8425**\u4e0d\u53ef\u52fe\u9009\u5254\u9664**\uff0c\u4ec5\u53ef\u4e3a\u5404\u7ea7\u8282\u70b9\u914d\u7f6e\u524d\u53f0\u5c55\u793a\u540d\uff08\u7559\u7a7a\u7528\u540e\u53f0\u540d\uff09\u3002\n\n> **\u7c7b\u76ee\u540d\u79f0\u591a\u8bed\u8a00**\uff1a\u5546\u54c1\u7cfb\u7edf\u7684\u7c7b\u76ee\u540d\u4ec5 `category_name` \u5355\u5217\u3001**\u65e0\u82f1\u6587/\u591a\u8bed\u8a00\u5217**\u3002\u524d\u53f0\u5c55\u793a\uff08\u542b\u5206\u7ec4\u6807\u9898\u7684\u4e00\u7ea7\u7c7b\u76ee\u6bb5\u3001\u5206\u7ec4\u6837\u5f0f\u7684\u5404\u7ea7\u8282\u70b9\u540d\uff09\u6309\u5f53\u524d\u8bed\u8a00\u53d6\u6570\uff0c**\u4f18\u5148\u7ea7\uff1a\u8fd0\u8425\u5728\u672c\u7ef4\u5ea6\u914d\u7f6e\u7684\u300c\u524d\u53f0\u5c55\u793a\u540d\u300d\uff08\u7cfb\u7edf\u636e\u6b64\u6ce8\u518c\u591a\u8bed\u8a00 key \u5230\u7ffb\u8bd1\u6a21\u5757\uff09> \u7ffb\u8bd1\u6a21\u5757\u5bf9\u8be5\u7c7b\u76ee\u539f\u540d\u7684\u591a\u8bed\u8a00\u8bd1\u540d > fallback \u9ed8\u8ba4\u8bed\u8a00\u539f\u503c**\u3002MVP \u82f1\u8bed\u4e3a\u4e3b\u65f6\uff0c\u5efa\u8bae\u8fd0\u8425\u4e3a\u9762\u5411\u524d\u53f0\u7684\u4e00\u7ea7\u7c7b\u76ee\u914d\u82f1\u6587\u5c55\u793a\u540d\uff08\u6216\u7531\u7ffb\u8bd1\u6a21\u5757\u8865\u9f50\u7c7b\u76ee\u82f1\u6587\uff09\uff0c\u5426\u5219\u8be5\u6bb5 fallback \u51fa\u9ed8\u8ba4\u8bed\u8a00\u539f\u503c\u3001\u53ef\u80fd\u4e0e\u82f1\u6587\u7684\u54c1\u724c/\u7cfb\u5217\u6bb5\u6df7\u6392\u3002\n\n\u7531\u4e8e\u5168\u91cf\u7eb3\u5165\uff0c\u7c7b\u76ee\u987a\u5e8f\u9700\u5728\u300c\u5546\u54c1\u4fa7\u6e90\u6392\u5e8f\u300d\u4e0e\u300c\u8fd0\u8425\u4eba\u5de5\u8c03\u6574\u300d\u4e4b\u95f4\u5408\u5e76\u3002\u89c4\u5219\u4e0e\u5176\u5b83\u7b5b\u9009\u5668\u7684 Pin \u8303\u5f0f\u4e00\u81f4\uff1a**Pin \u533a + \u8ddf\u968f\u533a**\u3002\n\n- **\u6e90\u6392\u5e8f\u6765\u6e90**\uff1a\u53d6\u5546\u54c1\u7cfb\u7edf\u7c7b\u76ee\u8868 `backend_category` \u7684 `sort_order`\uff08\u975e\u8d1f\u6574\u6570\uff0c\u6570\u5b57\u8d8a\u5c0f\u8d8a\u9760\u524d\uff1b\u8be6\u89c1\u5546\u54c1\u7cfb\u7edf PRD \u4e0e\u5546\u54c1\u4e3b\u6570\u636e ER\uff09\u3002\u8be5\u5b57\u6bb5\u4e3a\u540c\u4e00\u7236\u7c7b\u76ee\uff08`parent_id`\uff09\u4e0b\u5144\u5f1f\u8282\u70b9\u7684\u5c40\u90e8\u5e8f\uff0c\u5f52\u5546\u54c1\u8fd0\u8425\u7ef4\u62a4\uff0c**\u53ef\u4e3a\u7a7a/\u672a\u586b**\u3002\n- **\u8ddf\u968f\u533a**\uff1a\u8fd0\u8425\u672a\u624b\u52a8\u8c03\u6574\u7684\u7c7b\u76ee\uff0c\u6309\u6e90 `sort_order` \u5347\u5e8f\u6392\u5217\uff1b`sort_order` \u4e3a\u7a7a\u6216\u5e76\u5217\u65f6\uff0c\u6309 `category_id` \u5347\u5e8f\u515c\u5e95\uff08\u8fd1\u4f3c\u521b\u5efa\u5148\u540e\uff0c\u4fdd\u8bc1\u6392\u5e8f\u7a33\u5b9a\u3001\u53ef\u9884\u6d4b\uff09\u3002\u6e90\u7aef\u8c03\u6574\u6392\u5e8f\u6216\u65b0\u589e\u7c7b\u76ee\u65f6\uff0c\u8ddf\u968f\u533a\u81ea\u52a8\u91cd\u7b97\uff0c\u5b8c\u6574\u7ee7\u627f\u5546\u54c1\u4fa7\u987a\u5e8f\u3002\n- **Pin \u533a**\uff1a\u8fd0\u8425\u5728\u672c\u7ef4\u5ea6\u62d6\u62fd\u8fc7\u3001\u6216\u5728\u884c\u9996 Pin \u6846\u8f93\u5165\u5e8f\u53f7\u7684\u7c7b\u76ee = **\u663e\u5f0f Pin**\u5230\u540c\u7ea7\u5185\u7684\u7edd\u5bf9\u4f4d\u7f6e\uff08\u4f4d\u7f6e\u8bb0\u5f55**\u7ed1\u7c7b\u76ee key\u3001\u4e0d\u7ed1\u4e0b\u6807**\uff09\uff0c\u59cb\u7ec8\u4fdd\u6301\u4eba\u5de5\u4f4d\uff1b\u5176\u4f59\u8ddf\u968f\u9879\u81ea\u52a8\u586b\u5145\u5269\u4f59\u7a7a\u4f4d\u3002\n  - \u62d6\u62fd\u5230\u3001\u6216\u8f93\u5165\u5230\u5df2\u88ab\u5360\u7528\u7684 Pin \u4f4d\u65f6\uff0c**\u9876\u66ff**\u539f Pin \u9879\uff0c\u539f\u9879\u6062\u590d\u8ddf\u968f\u6e90\u6392\u5e8f\u5e76 Toast \u63d0\u793a\u300c\u4f4d\u7f6e N \u539f Pin \u9879\u5df2\u8ba9\u51fa\uff0c\u6062\u590d\u8ddf\u968f\u6e90\u6392\u5e8f\u300d\u3002\n  - \u8282\u70b9\u884c\u4ee5\u300cPin N\u300d\u6807\u8bb0\uff0c\u63d0\u4f9b\u300c\u53d6\u6d88\u300d\u64cd\u4f5c\u6062\u590d\u8ddf\u968f\u3002\n  - **\u539f\u4f4d\u56fa\u5b9a**\uff08\u5982\u628a\u5f53\u524d\u7b2c 1 \u4f4d Pin \u5230\u7b2c 1 \u4f4d\uff09\u6216**\u957f\u5217\u8868\u8fdc\u8ddd\u79bb\u79fb\u52a8**\uff0c\u53ef\u76f4\u63a5\u5728\u884c\u9996 Pin \u6846\u8f93\u5165\u5e8f\u53f7\uff0c\u65e0\u9700\u62d6\u62fd\u3002\n- **\u65b0\u589e\u7c7b\u76ee\u843d\u4f4d**\uff1a\u65b0\u540c\u6b65\u8fdb\u6765\u7684\u7c7b\u76ee\u5148\u8fdb\u8ddf\u968f\u533a\uff0c\u6309\u5176\u6e90 `sort_order` \u81ea\u7136\u843d\u4f4d\uff08\u649e\u5230 Pin \u4f4d\u5219\u987a\u5ef6\u5176\u540e\uff09\uff0c\u8fd0\u8425\u53ef\u62d6\u62fd/\u8f93\u5165\u5e8f\u53f7\u5f52\u4f4d\u6216\u4fdd\u6301\u8ddf\u968f\u3002\n- **\u5220\u9664\u7c7b\u76ee**\uff1a\u5546\u54c1\u4fa7\u5220\u9664\u67d0\u7c7b\u76ee\u65f6\uff *\u5df2\u9009\u533a**\uff08\u524d\u53f0\u7b5b\u9009\u9879\uff09\u3002\n  - **\u5f85\u9009\u533a\u5df2\u88ab\u9009\u5165\u7684\u6807\u7b7e\u4ece\u5f85\u9009\u5217\u8868\u4e2d\u79fb\u9664\uff0c\u4e0d\u53ef\u91cd\u590d\u9009\u62e9**\uff1b\u4ece\u5df2\u9009\u533a\u79fb\u9664\u540e\u8be5\u6807\u7b7e\u91cd\u65b0\u51fa\u73b0\u5728\u5f85\u9009\u533a\u3002\n  - \u5f85\u9009\u533a\u652f\u6301**\u6a21\u7cca\u641c\u7d22**\u4e0e\u6309**\u9002\u7528\u5bf9\u8c61\uff08\u6e20\u9053\u5546\u54c1 / \u901a\u7528\uff09\u7b5b\u9009**\u67e5\u770b\uff1b\u6bcf\u4e2a\u6807\u7b7e\u5c55\u793a\u5176\u9002\u7528\u5bf9\u8c61\u5fbd\u6807\u3002\n  - **\u5f85\u9009\u533a\u6309\u6807\u7b7e\u540d\u79f0\u300c\u5b57\u6bcd\u5e8f A\u2192Z\u300d\u6392\u5e8f**\uff1a\u82f1\u6587\u6309\u5b57\u6bcd A\u2192Z\uff0c\u4e2d\u6587\u6309\u62fc\u97f3 A\u2192Z\uff1b\u540d\u79f0\u4e3a\u300c\u5b57\u6bcd+\u6570\u5b57\u300d\u300c\u7eaf\u6570\u5b57\u300d\u7b49\u6df7\u5408\u5f62\u6001\u65f6\uff0c\u6cbf\u7528\u679a\u4e3e\u503c\u5b57\u6bcd\u5e8f\u7684\u4e09\u6bb5\u5f0f\u515c\u5e95\uff08\u7eaf\u5b57\u6bcd \u2192 \u5b57\u6bcd+\u6570\u5b57 \u2192 \u7eaf\u6570\u5b57\uff0c\u89c1\u524d\u6587\u300c\u5b57\u6bcd\u5e8f / \u6570\u503c\u5e8f\u7684\u6df7\u5408\u5f62\u6001\u9632\u5446\u300d\uff09\u3002\u6807\u7b7e\u5e93\u65b0\u589e\u6807\u7b7e\u540c\u6b65\u8fdb\u6765\u540e\uff0c\u6309\u6b64\u89c4\u5219\u81ea\u52a8\u843d\u5230\u5f85\u9009\u533a\u7684\u6b63\u786e\u4f4d\u7f6e\uff0c\u65e0\u9700\u4eba\u5de5\u6574\u7406\u3002\u62fc\u97f3\u5e8f\u7531 collation \u5b9e\u73b0\u3001\u65e0\u9700\u5b58\u62fc\u97f3\u5b57\u6bb5\uff0c\u591a\u97f3\u5b57\u5904\u7406\u540c\u524d\u6587\u300c\u5b9e\u73b0\u8bf4\u660e\u300d\u3002\n  - \u5df2\u9009\u533a\u652f\u6301**\u62d6\u62fd\u6392\u5e8f**\uff08\u51b3\u5b9a\u524d\u53f0\u5c55\u793a\u987a\u5e8f\uff09\uff0c\u4e0d\u63d0\u4f9b\u9002\u7528\u5bf9\u8c61\u7b5b\u9009\uff08\u5df2\u9009\u4e3a\u8fd0\u8425\u624b\u5de5\u7b56\u5c55\u7684\u6709\u5e8f\u5c0f\u96c6\u5408\uff0c\u5fbd\u6807\u5df2\u8db3\u591f\u533a\u5206\uff09\u3002\n- **\u524d\u53f0\u5c55\u793a\u540d**\uff1a\u5df2\u9009\u533a\u6bcf\u4e2a\u6807\u7b7e\u53ef\u5355\u72ec\u914d\u7f6e**\u524d\u53f0\u5c55\u793a\u540d**\uff0c\u7559\u7a7a\u5219\u4f7f\u7528\u6807\u7b7e\u539f\u540d\u3002\n- **\u6570\u636e\u843d\u5e93**\uff1a\u4fdd\u5b58\u7ef4\u5ea6\u65f6\u6301\u4e45\u5316\u5df2\u9009\u6807\u7b7e\u7684\u6709\u5e8f\u5217\u8868\uff08tag key + display_name + sort_order\uff09\u3002\u524d\u53f0\u7b5b\u9009\u6309\u8be5\u5217\u8868\u6e32\u67d3\uff0c\u6807\u7b7e\u547d\u4e2d\u5546\u54c1\u6570 `count=0` \u65f6\u5b9e\u65f6\u9690\u85cf\u3002\n\n| \u6807\u7b7e\u6570\u636e\u6e90\u53ef\u7528\u5c55\u793a\u6837\u5f0f | \u53cc\u5217\u5361\u7247 / \u5355\u5217\u6587\u672c |\n|---|---|\n\n**\u6821\u9a8c\u89c4\u5219**\n\n| \u5b57\u6bb5 | \u89c4\u5219 |\n|---|---|\n| \u7ef4\u5ea6\u540d\u79f0\uff08EN\uff09| \u975e\u7a7a\uff1b**\u5168\u5c40\u552f\u4e00\u2014\u2014\u4fdd\u5b58\u65f6\u7528\u672c\u5730 `dimension_name_en`\uff08en \u6e90\u6587\u526f\u672c\uff09\u67e5\u91cd**\uff08\u4e0d\u5b9e\u65f6\u67e5\u7ffb\u8bd1\u670d\u52a1,\u907f\u514d\u5176\u4e0d\u53ef\u7528\u65f6\u65e0\u6cd5\u5224\u91cd\uff1bDB \u552f\u4e00\u7d22\u5f15\u515c\u5e95\u5e76\u53d1\uff09\uff0c\u91cd\u590d\u63d0\u793a\u300c\u8be5\u7ef4\u5ea6\u540d\u79f0\u5df2\u5b58\u5728\u300d|\n| attribute \u7c7b\u578b\uff1a\u5173\u8054\u5c5e\u6027 | \u81f3\u5c11\u9009 1 \u4e2a |\n| backend_category \u7c7b\u578b\uff1a\u5173\u8054\u7c7b\u76ee | \u5168\u91cf\u7eb3\u5165\uff0c\u65e0\u9700\u52fe\u9009\uff0c\u65e0\u6b64\u6821\u9a8c |\n\n**\u505c\u7528\u7ef4\u5ea6\u89c4\u5219**\uff1a\u505c\u7528\u524d\u68c0\u67e5\u5f15\u7528\u3002\u6709\u5f15\u7528\u65f6\u5f39\u7a97\u300c\u8be5\u7ef4\u5ea6\u6b63\u5728\u88ab\u4ee5\u4e0b\u6a21\u5757\u5f15\u7528\uff0c\u505c\u7528\u540e\u8fd9\u4e9b\u6a21\u5757\u5c06\u4e0d\u518d\u5c55\u793a\u8be5\u7b5b\u9009\u9879\uff1a{Collection \u00b7 \u6a21\u5757\u5217\u8868}\u3002\u786e\u8ba4\u505c\u7528\uff1f\u300d\n\n**\u5f02\u5e38\u5904\u7406**\uff1a\u679a\u4e3e\u503c\u626b\u63cf\u8d85\u65f6 \u2192 \u300c\u626b\u63cf\u4e2d\uff0c\u8bf7\u7a0d\u540e\u5237\u65b0\u300d\uff1b\u4fdd\u5b58\u5931\u8d25 \u2192 Toast \u5e76\u4fdd\u7559\u7f16\u8f91\u72b6\u6001\u3002\n\n---\n\n### 2.6 Collection \u7b5b\u9009\u914d\u7f6e\uff08\u79fb\u52a8\u7aef\u56fe\u6587\u7b5b / \u79fb\u52a8\u7aef\u5feb\u7b5b / \u901a\u7528\u7b5b\u9009\u5668\uff09\n\n\u5411\u5bfc Step 3\uff08\u7b5b\u9009\u914d\u7f6e\uff09\uff0c\u4e09\u6a21\u5757\u5e73\u94fa\u3002\u524d\u53f0\u5c55\u793a\u6548\u679c\u53ef\u901a\u8fc7\u300c\u524d\u53f0\u9884\u89c8\u300d\u5f39\u7a97\uff08Mobile/PC \u5207\u6362\uff09\u5b9e\u65f6\u67e5\u770b\u3002**\u9884\u89c8\u5207\u5230 PC \u7aef\u65f6\u4e0d\u6e32\u67d3\u5feb\u7b5b\u680f**\uff08\u5feb\u7b5b\u4e3a\u79fb\u52a8\u7aef\u4e13\u5c5e\uff09\u3002\n\n> **\u79fb\u52a8\u7aef\u56fe\u6587\u7b5b**\uff1aPC \u7aef\u65e0\u56fe\u6587\u7b5b\u680f\u5f62\u6001\uff0c\u56fe\u6587\u7b5b**\u4ec5\u4f5c\u7528\u4e8e\u79fb\u52a8\u7aef**\u3001\u4e0d\u5206\u7aef\u3001\u65e0\u9002\u7528\u7ec8\u7aef\u5b57\u6bb5\uff08\u89c1 \u00a72.6.1\uff09\u3002\n> **\u79fb\u52a8\u7aef\u5feb\u7b5b**\uff1aPC \u7aef\u65e0\u5feb\u7b5b\u680f\u5f62\u6001\uff0c\u5feb\u7b5b**\u4ec5\u4f5c\u7528\u4e8e\u79fb\u52a8\u7aef**\u3001\u4e0d\u5206\u7aef\u3001\u65e0\u9002\u7528\u7ec8\u7aef\u5b57\u6bb5\uff08\u89c1 \u00a72.6.2\uff09\u3002\n> \u901a\u7528\u7b5b\u9009\u5668\u96f6\u914d\u7f6e\u3001\u4e0d\u5206\u7aef\u3002\n\n#### 2.6.1 \u79fb\u52a8\u7aef\u56fe\u6587\u7b5b\n\n**\u4ec5\u79fb\u52a8\u7aef**\u7684\u56fe\u6587/\u7eaf\u6587\u6807\u7b7e\u5217\u8868\uff0c\u7528\u6237\u70b9\u51fb\u5207\u6362\u5b50\u4e3b\u9898\u5546\u54c1\u6c60\u3002PC \u7aef\u5f62\u6001\u65e0\u56fe\u6587\u7b5b\u680f\uff0c\u6545\u56fe\u6587\u7b5b\u4e3a\u79fb\u52a8\u7aef\u4e13\u5c5e\u3001\u4e0d\u5206\u7aef\u3001\u65e0\u9002\u7528\u7ec8\u7aef\u5b57\u6bb5\u3002\n\n**\u6a21\u5757\u914d\u7f6e**\n\n| \u5b57\u6bb5 | \u8bf4\u660e |\n|---|---|\n| `module_enabled` | \u6a21\u5757\u5f00\u5173\uff1b\u5173\u95ed\u65f6\u524d\u53f0\uff08\u79fb\u52a8\u7aef\uff09\u4e0d\u5c55\u793a\u56fe\u6587\ \uff0c\u7c7b\u76ee\u4e0e\u300c\u6309\u4f5c\u7528\u57df\u5206\u7ec4\u300d\u5c5e\u6027**\u7ed3\u6784\u5b8c\u5168\u7b49\u4ef7**\u2014\u2014\u5206\u7ec4\u6807\u9898\u4e0d\u53ef\u52fe\u3001\u503c\u8282\u70b9\u53ef\u52fe\uff08\u591a\u9009\uff09\uff0c\u6bcf\u4e2a\u503c\u8282\u70b9\u5e26 `value` / `display_name` / `count`\uff0c\u5206\u7ec4\u8282\u70b9\u5e26 `group_title`\u3002\u7c7b\u76ee\u7ef4\u5ea6\uff1a\u6807\u9898=\u4e00\u7ea7\u7c7b\u76ee\u540d\uff08\u4e0d\u53ef\u52fe\uff09\u3001\u503c=\u8be5\u8303\u56f4\u5185\u7684\u4e09\u7ea7\uff08\u672b\u7ea7\uff09\u7c7b\u76ee\u540d\uff08\u52fe\u9009\u8bed\u4e49\u89c1\u4e0b\u65b9\u300c\u7c7b\u76ee\uff08\u5206\u7ec4\uff09\u7b5b\u9009\u7684\u5339\u914d\u8bed\u4e49\u300d\uff09\uff1b\u6309\u4f5c\u7528\u57df\u5206\u7ec4\u7684\u5c5e\u6027\uff1a\u6807\u9898=\u300c\u7c7b\u76ee\u540d\u00b7\u54c1\u724c\u540d\u00b7\u7cfb\u5217\u540d\u300d\uff08\u4e0d\u53ef\u52fe\uff09\u3001\u503c=\u7ec4\u5185\u679a\u4e3e\u503c\u3002\u524d\u7aef\u7528\u540c\u4e00\u5957\u5206\u7ec4\u7ec4\u4ef6\u6e32\u67d3\uff0c\u4e0d\u6309\u7ef4\u5ea6\u5206\u53c9\u3002\n\n\u8865\u5145\u89c4\u5219\uff1a\n- \u503c\u7684\u6709\u6548\u6027\u6309 \u00a74.5.2 \u53e3\u5f84\uff1a`count = 0`\uff08\u65e0\u547d\u4e2d\uff09\u6216 `count = N`\uff08\u8986\u76d6\u5168\u57fa\u51c6\u8303\u56f4\u3001\u7b5b\u4e86\u4e0d\u6536\u7a84\uff0cN=\u57fa\u51c6\u8303\u56f4\u5546\u54c1\u603b\u6570\uff09\u7684\u503c\u5747\u4e0d\u4e0b\u53d1\uff08\u524d\u7aef\u7269\u7406\u9690\u85cf\uff09\uff1b\u67d0\u7ef4\u5ea6\u65e0\u4efb\u4f55\u6709\u6548\u503c\uff08`0 < count < N`\uff09\u65f6\u6574\u7ef4\u5ea6\u4e0d\u4e0b\u53d1\u3002\u5206\u7ec4\u4e0b\u82e5\u67d0\u7236\u8282\u70b9/\u67d0\u7ec4\u65e0\u6709\u6548\u503c\uff0c\u5219\u8be5\u7236\u8282\u70b9/\u7ec4\u4e5f\u4e0d\u4e0b\u53d1\u3002\n- \u5206\u7ec4\u7684\u5c42\u7ea7/\u5206\u7ec4\u6df1\u5ea6\u7531\u5f53\u524d\u5546\u54c1\u6c60\u5b9e\u9645\u80fd\u5339\u914d\u5230\u7684\u5185\u5bb9\u52a8\u6001\u51b3\u5b9a\u3002\n- \u524d\u7aef\u4e0d\u4f9d\u636e\u5b57\u6bb5\u540d\u5224\u65a 2\u7ea7\u8282\u70b9\u5747\u53ef\u72ec\u7acb\u52fe\u9009 / \u52fe\u7236\u8282\u70b9\u8986\u76d6\u5373\u5339\u914d / \u5b50\u8282\u70b9 UI \u81ea\u52a8\u5168\u9009\u300d\u53e3\u5f84\u3002\u73b0\u53e3\u5f84\u4e0b\uff0ccategory \u4e00\u7ea7=\u5206\u7ec4\u6807\u9898\uff08\u4e0d\u53ef\u52fe\uff09\u3001\u4e09\u7ea7=\u53ef\u52fe\u503c\uff0c\u524d\u53f0\u5339\u914d\u4ec5\u4ee5\u6240\u52fe\u4e09\u7ea7\u7c7b\u76ee\u7684\u8986\u76d6\u8303\u56f4\u4e3a\u51c6\u3002\n\n\u4e00\u53e5\u8bdd\uff1a\u4e00\u7ea7\u7c7b\u76ee\u53ea\u662f\u5206\u7ec4\u6807\u9898\uff0c\u7528\u6237\u52fe\u54ea\u4e2a\u4e09\u7ea7\u7c7b\u76ee\uff0c\u5c31\u5339\u914d\u8be5\u4e09\u7ea7\u7c7b\u76ee\u8986\u76d6\u7684\u5168\u90e8\u5546\u54c1\u3002\n\n#### 3.2.3 \u7b5b\u9009\u72b6\u6001\u91cd\u7f6e\u89c4\u5219\n\n| \u89e6\u53d1\u52a8\u4f5c | \u91cd\u7f6e\u8303\u56f4 | \u540e\u7eed\u52a8\u4f5c |\n|---|---|---|\n| \u70b9\u51fb / \u5207\u6362\u56fe\u6587\u7b5b\u9879\uff08\u542b\u518d\u6b21\u70b9\u51fb\u53d6\u6d88\u6fc0\u6d3b\u3001\u56de\u5230\u5168\u96c6\uff09| \u6e05\u7a7a\u6240\u6709\u5feb\u7b5b + \u901a\u7528\u7b5b\u9009\u5668\u5df2\u9009\u6761\u4ef6 | \u6309\u65b0\u56fe\u6587\u7b5b\u8303\u56f4\u7684\u5546\u54c1\u96c6\u5408**\u91cd\u65b0\u52a8\u6001\u5339\u914d**\u5feb\u7b5b/\u901a\u7528\u7b5b\u9009\u5668\u5019\u9009\u9879 |\n| \u63d0\u4ea4\u65b0\u641c\u7d22\u8bcd | \u6e05\u7a7a\u6240\u6709\u5feb\u7b5b + \u901a\u7528\u7b5b\u9009\u5668\u5df2\u9009\u6761\u4ef6 | \u6309\u641c\u7d22\u7ed3\u679c\u91cd\u65b0\u5339\u914d\u5019\u9009\u9879 |\n| \u6e05\u7a7a\u641c\u7d22\u8bcd\uff08\u70b9 \u2715\uff09| **\u4e0d\u91cd\u7f6e**\uff0c\u6062\u590d\u641c\u7d22\u524d\u5217\u8868 | \u2014 |\n| \u5feb\u7b5b/\u901a\u7528\u7b5b\u9009\u5668\u5185\u7684\u5e94\u7528\uff08Apply\uff09| **\u4e0d\u6e05\u7a7a**\u5df2\u9009 | \u4ec5\u5237\u65b0\u5546\u54c1\u5217\u8868\u4e0e\u8ba1\u6570\uff1b\u4e0d\u7f29\u51cf\u5176\u4ed6\u7ef4\u5ea6\u5019\u9009\u9879\uff08\u00a73.2.2 \u4e92\u4e0d\u5f71\u54cd\uff09|\n\n> \u5173\u952e\u533a\u5206\uff1a**\u53ea\u6709\u56fe\u6587\u7b5b\u5207\u6362\u548c\u65b0\u641c\u7d22\u8bcd\u4f1a\u6e05\u7a7a\u5feb\u7b5b/\u901a\u7528\u7b5b\u9009\u5668\u5df2\u9009**\uff1b\u5feb\u7b5b/\u901a\u7528\u7b5b\u9009\u5668\u81ea\u8eab\u7684\u7b5b\u9009\u53ea\u5237\u65b0\u5546\u54c1\u5217\u8868\u3001\u4e0d\u4e92\u76f8\u7f29\u51cf\u5019\u9009\u9879\u3001\u4fdd\u7559\u5df2\u9009\u3002\u56fe\u6587\u7b5b\u6e05\u7a7a\u540e\u9700\u6309\u56fe\u6587\u7b5b\u5bf9\u5e94\u5546\u54c1\u5185\u5bb9\u91cd\u65b0\u5339\u914d\u51fa\u53ef\u7528\u7b5b\u9009\u7ef4\u5ea6\u4e0e\u5019\u9009\u503c\u3002\n\n#### 3.2.4 \u7a7a\u6001\u4e0e\u964d\u7ea7\u89c4\u5219\n\n| \u72b6\u6001 | \u89e6\u53d1 | \u5efa\u8bae\u5904\u7406 |\n|---|---|---|\n| Collection \u4e0d\u53ef\u7528 | `status \u2260 active` \u6216 slug \u65e0\u6548 | 404 / \u53cb\u597d\u63d0\u793a\u9875 + \u8df3\u8f6c\u5f15\u5bfc |\n| \u5408\u96c6\u5185\u5546\u54c1\u5168\u90e8\u4e0b\u67b6 | \u5546\u54c1\u6c60\u4e3a\u7a7a\uff0c\u65e0\u7b5b\u9009 | \u7a7a\u5185\u5bb9\u63d0\u793a + \u6d4f\u89c8\u5176\u4ed6\u5408\u96c6\u5165\u53e3 |\n| \u7b5b\u9009\u540e 0 \u4ef6 | \u6709\u6fc0\u6d3b\u6761\u4ef6\u4f46\u4ea4\u96c6\u4e3a\u7a7a | \u7a7a\u7ed3\u679c\u63d0\u793a + \u6e05\u7a7a\u7b5b\u9009\u5165\u53e3 |\n| \u56fe\u6587\u7b5b\u65e0 active \u9879 | \u6a21\u5757\u542f\u7528\u4f46\u65e0 active \u9879 | \u56fe\u6587\u7b5b\u6574\u884c\u9690\u85cf\uff0c\u4e0d\u5360\u4f4d |\n| \u67d0\u7b5b\u9009\u7ef4\u5ea6\u65e0\u5019\u9009\u503c | \u5f53\u524d\u8303\u56f4\u5185\u8be5\u7ef4\u5ea6\u65e0\u503c | \u8be5 Chip / \u7ef4\u5ea6\u8282\u7269\u7406\u9690\u85cf |\n| Banner \u56fe\u52a0\u8f7d\u5931\u8d25 | \u56fe\u7247\u8bf7\u6c42\u5931\u8d25 | \u6574\u533a\u9690\u85cf\uff0c\u4e0d\u5360\u4f4d |\n| \u7f51\u7edc\u5f02\u5e38 | \u8bf7\u6c42\u5931\u8d25 / \u670d\u52a1\u65e0\u54cd\u5e94 | \u9519\u8bef\u63d0\u793a + \u91cd\u8bd5 + \u9aa8\u67b6\u5c4f\u4fdd\u6301 |\n| \u52a0\u8f7d\u4e2d | \u9996\u6b21\u8fdb\u5165/\u5237\u65b0 | \u53cc\u5217\u9aa8\u67b6\u5c4f\u5360\u4f4d |\n\n### 3.3 \u9876\u5bfc\u680f\n\n\u59cb\u7ec8\u56fa\u5b9a\u3002\u5de6\uff1a\u2190 \u8fd4\u56de\uff1b\u4e2d\uff1aCollection \u6807\u9898\uff08\u8bfb `title`\uff0c\u5c45\u4e2d\uff09\uff1b\u53f3\uff1a\u641c\u7d22\u56fe\u6807\uff08V1 \u4ec5\u56fe\u6807\uff0c\u903b\u8f91 V2\uff09+ \u8d2d\u7269\u8f66\u56fe\u6807\u3002V1 \u4e0d\u5c55\u793a\u5206\u4eab\u6309\u94ae\u548c Logo\u3002\n\n**\u80cc\u666f**\uff1a\u672a\u6eda\u8fc7 Banner \u65f6\u900f\u660e + \u767d\u8272\u56fe\u6807\uff1b\u6eda\u8fc7 Banner \u9ad8\u5ea6\u540e\u767d\u5e95 + \u6df1\u8272\u56fe\u6807\u3002\u900f\u660e\u2192\u767d\u6e10\u53d8\u4ece\u6eda\u52a8\u8ddd\u79bb = Banner \u9ad8\u5ea6 \u00d770% \u5f00\u59cb\u3002\n\n### 3.4 Banner \u533a\u57df\n\u5c55\u793a\u5934\u56fe\uff08`banner_image_url`\uff09\u3001\u6807\u9898\uff08`title`\uff09\u3001\u526f\u6807\u9898\uff08`subtitle` \u82e5\u6709\uff09\uff0c\u968f\u9875\u9762\u6eda\u52a8\u3002\u56fe\u7247\u52a0\u8f7d\u5931\u8d25\u65f6\u6574\u533a\u4e0d\u5c55\u793a\u3001\u4e0d\u5360\u4f4d\uff0c\u9875\u9762\u76f4\u63a5\u4ece\u56fe\u6587\u7b5b\u884c\u5f00\u59cb\u3002\n\n### 3.5 \u56fe\u6587\u7b5b\uff08\u79fb\u52a8\u7aef\uff09\n\u6a2a\u5411\u6eda\u52a8\uff0c\u968f\u9875\u9762\u6eda\u52a8\u4e0d\u5438\u9876\u3002**\u56fe\u6587\u7b5b\u4e3a\u79fb\u52a8\u7aef\u4e13\u5c5e\u4ea4\u4e92\uff0cPC \u7aef\u65e0\u6b64\u680f**\u3002\n- \u7531\u6a21\u5757\u7ea7 `display_mode` \u51b3\u5b9a\u5168\u6a21\u5757\u5f62\u6001:\u56fe\u6587\u6a21\u5f0f\uff08`graphic`\uff09= \u56fe\u7247 + \u6587\u5b57\uff08\u6bcf\u9879\u5747\u6709\u56fe\uff09\uff1b\u7eaf\u6587\u672c\u6a21\u5f0f\uff08`text`\uff09= \u4ec5\u6587\u5b57\uff08\u5168\u6a21\u5757\u65e0\u56fe\uff09\u3002\u540c\u4e00\u6a21\u5757\u4e0d\u6df7\u6392\u3002\n- **\u5355\u9009**\uff1a\u540c\u4e00\u65f6\u523b\u6700\u591a\u4e00\u4e2a\u6807\u7b7e\u6fc0\u6d3b\uff1b\u9ed8\u8ba4\u65e0\u6807\u7b7e\u6fc0\u6d3b\uff0c\u5c55\u793a\u5168\u96c6\u3002\n- \u70b9\u51fb\u6807\u7b7e \u2192 \u89e6\u53d1 Auto-Scroll \u2192 \u6e05\u7a7a\u6240\u6709\u5feb\u7b5b/\u901a\u7528\u7b5b\u9009\u5668\u6761\u4ef6 \u2192 \u6309\u65b0\u6807\u7b7e\u8303\u56f4\u5237\u65b0\u3002\n- \u518d\u6b21\u70b9\u51fb\u5df2\u6fc0\u6d3b\u6807\u7b7e \u2192 \u53d6\u6d88\u6fc0\u6d3b\uff0c\u56de\u5230\u5168\u96c6\u3002\n- \u65e0\u7cfb\u7edf\u7ea7\u300cAll\u300d\u9879\uff1b\u6240\u6709\u9879 inactive \u6216\u6a21\u5757\u5173\u95ed\u65f6\u6574\u884c\u9690\u85cf\u3002\n\n### 3.6 \u5feb\u7b5b\u680f\uff08\u79fb\u52a8\u7aef\uff09\n\n\u6a2a\u5411\u6eda\u52a8\uff0c\u8d8a\u8fc7\u56fe\u6587\u7b5b\u5e95\u90e8\u540e\u5438\u9876\u3002**\u5feb\u7b5b\u4e3a\u79fb\u52a8\u7aef\u4e13\u5c5e\u4ea4\u4e92\uff0cPC \u7aef\u65e0\u6b64\u680f**\u3002\n\n**\u6574\u4f53\u5e03\u5c40**\uff1a\u6309 `sort_order` \u4ece\u5de6\u5230\u53f3\u6e32\u67d3 `enabled=TRUE` \u7684\u7ef4\u5ea6 Chip\uff1b\u67d0\u7ef4\u5ea6\u5728\u5f53\u524d\u8303\u56f4\u5185**\u5b58\u5728\u53ef\u6536\u7a84\u5f53\u524d\u6c60\u7684\u6709\u6548\u503c\uff08`0 < count < N`\uff0c\u53e3\u5f84\u89c1 \u00a74.5.2\uff09\u624d\u6e32\u67d3**\uff0c\u5426\u5219\u7269\u7406\u9690\u85cf\u3002\n\n**\u4ea4\u4e92**\uff1a\u70b9\u51fb Chip \u2192 \u5feb\u7b5b\u680f\u7acb\u5373\u5438\u9876 \u2192 \u4e8c\u7ea7\u9762\u677f\u4ece\u5feb\u7b5b\u680f\u4e0b\u7f18\u5411\u4e0b\u6253\u5f00\u3002\u9762\u677f\u5e95\u90e8\u56fa\u5b9a\u4e24\u6309\u94ae\uff1a\n- **Clear**\uff1a\u6e05\u7a7a\u5f53\u524d\u7ef4\u5ea6\u5df2\u9009\u9879\uff0c\u9762\u677f\u4fdd\u6301\u6253\u5f00\u3002\n- **Apply**\uff1a\u63d0\u4ea4\u9009\u4e2d\u9879\uff0c\u5173\u95ed\u9762\u677f\uff0c\u89e6\u53d1 Auto-Scroll\uff0c\u5237\u65b0\u5217\u8868\u3002\n- \u672a\u6539\u52a8\u65f6 Apply \u7b49\u540c\u5173\u95ed\uff0c\u4e0d\u5237\u65b0\uff1bClear \u540e\u76f4\u63a5\u5173\u95ed = \u6062\u590d\u6253\u5f00\u524d\u72b6\u6001\u3002\n\n**Chip \u72b6\u6001**\uff1a\u65e0\u9009\u4e2d\u503c=\u9ed8\u8ba4\u6837\u5f0f\u5c55\u793a\u7ef4\u5ea6\u540d\uff1b\u6709\u9009\u4e2d\u503c=\u9ad8\u4eae + \u53f3\u4fa7\u5df2\u9009\u6570\u91cf\u89d2\u6807\u3002\n\n**View All \u89c4\u5219**\n\n| \u6761\u4ef6 | \u884c\u4e3a |\n|---|---|\n| \u5019\u9009\u9879 \u2264 8 | \u5 884c\u3002\n- \u6392\u5e8f\u9879\u679a\u4e3e\uff1a`recommended` / `newest` / `price_low_to_high` / `price_high_to_low`\u3002**\u4e0d\u542b `manual`\uff08Featured \u624b\u52a8\u6392\u5e8f\uff09\u9879**\uff08v0.14 \u5df2\u79fb\u9664\uff09\u3002\n- **\u5168\u90e8\u6392\u5e8f\u9879\u7531\u641c\u63a8\u670d\u52a1\u6267\u884c**\uff08\u8bfb Collection \u5546\u54c1\u6c60\u3001\u771f\u76f8\u6e90\u4e00\u81f4\uff0c\u89c1\u4e0b\u300c\u7b5b\u9009/\u6392\u5e8f\u4e0e\u641c\u63a8\u670d\u52a1\u7684\u8fb9\u754c\u300d\uff09\uff1a\n  - `recommended`\uff1a\u641c\u63a8\u670d\u52a1\u7684**\u4e2a\u6027\u5316\u6392\u5e8f**\uff08\u6309\u7528\u6237\u753b\u50cf / \u884c\u4e3a / \u8f6c\u5316\u9884\u6d4b\u6253\u5206\uff1b\u51b7\u542f\u52a8\u6216\u533f\u540d\u7528\u6237\u964d\u7ea7\u4e3a\u975e\u4e2a\u6027\u5316\u7684\u7efc\u5408\u542f\u53d1\u5f0f\uff1a\u4e0a\u67b6\u65b0\u8fd1\u5ea6 + \u4ef7\u683c\u5206\u5e03 + \u5e93\u5b58\u70ed\u5ea6\uff09\u3002\n  - `newest`=\u4e0a\u67b6\u65f6\u95f4\u964d\u5e8f\uff1b`price_low_to_high / price_high_to_low`=\u4ef7\u683c\u5347 / \u964d\u5e8f\u3002\u8fd9\u4e09\u9879\u4e3a\u786e\u5b9a\u6027\u6392\u5e8f\uff0c\u641c\u63a8\u6309\u5bf9\u5e94\u5b57\u6bb5\u6267\u884c\u3002\n- \u5ba2\u6237\u7aef\u53ea\u4f20 `sort_key`\uff0c\u6392\u5e8f\u5728\u641c\u63a8\u670d\u52a1\u5185\u5bf9 Collection \u6c60\u6267\u884c\uff1b\u524d\u7aef\u4e0d\u786c\u7f16\u7801\u6392\u5e8f\u903b\u8f91\u3002\n- \u515c\u5e95\uff1aCollection \u672a\u914d\u7f6e\u6392\u5e8f\u65f6\u8fd4\u56de\u5168\u90e8\u6392\u5e8f\u9879\u3001\u9ed8\u8ba4 `recommended`\u3002\n\n**Pin \u56fa\u5b9a\u4f4d\u4e0e\u6392\u5e8f\u89c4\u5219\u7684\u5173\u7cfb\uff08\u81ea\u52a8 / \u624b\u52a8\u9009\u54c1\u7edf\u4e00\uff09**\n\n\u65e0\u8bba\u81ea\u52a8\u9009\u54c1\u8fd8\u662f\u624b\u52a8\u9009\u54c1\uff0c\u524d\u53f0\u5546\u54c1\u5217\u8868\u5747**\u6309\u7528\u6237\u9009\u5b9a\u7684\u6392\u5e8f\u89c4\u5219**\uff08\u9ed8\u8ba4 `recommended`\uff09\u5c55\u793a\uff0c\u4e0d\u518d\u6709\u72ec\u7acb\u7684\u300c\u624b\u52a8\u6392\u5e8f\u300d\u9 0\u8bc4\u4f30\u5168\u7ad9\u5546\u54c1\u547d\u4e2d\u60c5\u51b5\uff1b\u65f6\u95f4\u6eda\u52a8\u7a97\uff08\u300c\u6700\u8fd1 N \u5929\u300d\uff09\u968f\u4e4b\u6bcf\u5c0f\u65f6\u91cd\u7b97\uff08\u539f\u300c\u6bcf\u65e5\u51cc\u6668\u300d\u6539\u4e3a\u6bcf\u5c0f\u65f6\uff0c\u7f29\u77ed\u5ef6\u8fdf\uff09|\n| \u5546\u54c1\u4e0b\u67b6 / \u552e\u51fa\u79fb\u51fa | **\u5b9e\u65f6\uff08\u4e8b\u4ef6\u9a71\u52a8\uff09** | \u5546\u54c1 `off_shelf` / `sold` \u65f6\u5373\u65f6\u79fb\u51fa\u524d\u7aef\u5c55\u793a\uff08\u81ea\u52a8 / \u624b\u52a8\u9009\u54c1\u5747\u4e0d\u7b49\u4e0b\u4e00\u4e2a\u6574\u70b9\uff0c\u89c1 \u00a74.2\uff09|\n| \u81ea\u52a8\u9009\u54c1 Pin \u6e05\u9664 | \u5546\u54c1\u79fb\u51fa\u65f6\u89e6\u53d1 | \u5546\u54c1\u4e0b\u67b6/\u552e\u51fa\u79fb\u51fa\u65f6\u6e05\u9664\u5176 pin \u8bb0\u5f55\uff08\u00a74.2\uff09|\n| \u5546\u54c1\u6570\u7edf\u8ba1 | \u5b9e\u65f6 / \u51c6\u5b9e\u65f6 | \u5217\u8868\u9875\u5546\u54c1\u6570\u3001\u5019\u9009\u503c count |\n\n#### 4.5.6 \u7b5b\u9009 / \u6392\u5e8f\u4e0e\u641c\u63a8\u670d\u52a1\u7684\u8fb9\u754c\n\n\u524d\u53f0**\u7b5b\u9009\u6267\u884c\u3001\u5019\u9009\u503c / count \u8ba1\u7b97\uff08faceting\uff09\u3001\u6392\u5e8f**\u7edf\u4e00**\u4ea4\u7531\u641c\u63a8\u670d\u52a1\u6267\u884c**\uff0c\u641c\u63a8**\u8bfb\u53d6 Collection \u7684\u5546\u54c1\u6c60**\u4f5c\u4e3a\u6570\u636e\u6765\u6e90\u3002\u5177\u4f53\u54ea\u4e9b\u80fd\u529b\u5982\u4f55\u843d\u5230\u641c\u63a8\uff08\u63a5\u53e3\u62c6\u5206\u3001faceting \u662f\u5426\u9884\u8ba1\u7b97\u3001\u6392\u5e8f\u6253\u5206\u7ba1\u9053\u7b49\uff09**\u7531\u5f00\u53d1\u6280\u672f\u65b9\u6848\u786e\u5b9a\uff0c\u672c PRD \u4e0d\u89c4\u5b9a\u5b9e\u73b0\u5206\u5de5**\u3002\n\n**\u771f\u76f8\u6e90\u539f\u5219\uff08\u552f\u4e00\u786c\u7ea6\u675f\uff09**\uff1a\n- **\u5546\u54c1\u6c60\u5b9a\u4e49\u53ea\u6709\u4e00\u5904**\uff1dCollection \u7684\u5546\u54c1\u51c6\u5165\u6761\u4ef6\uff08\u00a74.5.1 / \u00a74.2 / rule_config\uff09\u3002\u641c\u63a8**\u8bfb\u8fd9\u4e2a\u6c60\u3001\u4e0d\u5
