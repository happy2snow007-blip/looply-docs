4\u8ba1\u7b97\uff1a\n\n```\n\u5019\u9009\u503c\u8303\u56f4 = Collection \u5168\u96c6 \u2229 \u5f53\u524d\u56fe\u6587\u7b5b\u9879\u8303\u56f4 \u2229 \u641c\u7d22\u8bcd\u8fc7\u6ee4\u7ed3\u679c\n```\n\n**\u5173\u952e\u89c4\u5219**\uff1a\n- \u5feb\u7b5b\u548c\u62bd\u5c49\u7b5b\u7684\u53ef\u9009\u9879**\u4e92\u4e0d\u5f71\u54cd**\uff1a\u5728\u5feb\u7b5b\u4e2d\u9009\u4e86\u67d0\u4e2a\u54c1\u724c\uff0c\u4e0d\u4f1a\u7f29\u51cf\u62bd\u5c49\u7b5b\u4e2d\u5176\u4ed6\u7ef4\u5ea6\u7684\u53ef\u9009\u8303\u56f4\uff0c\u53cd\u4e4b\u4ea6\u7136\u3002\u907f\u514d\u300c\u8d8a\u7b5b\u8d8a\u5c11\u300d\n- \u56fe\u6587\u7b5b\u9009\u4e2d\u72b6\u6001\u53d8\u5316\u540e\uff0c\u5feb\u7b5b\u548c\u62bd\u5c49\u7b5b\u7684\u5019\u9009\u503c\u968f\u4e4b\u66f4\u65b0\uff08\u670d\u52a1\u7aef\u91cd\u65b0\u8ba1\u7b97\uff09\n- \u540e\u7aef\u4e0d\u4e0b\u53d1\u7684\u5c5e\u6027\u503c\uff0c\u524d\u7aef\u7269\u7406\u9690\u85cf\uff0c\u4e0d\u6e32\u67d3\u3001\u4e0d\u5360\u4f4d\n- \u540e\u7aef\u8fd4\u56de\u5019\u9009\u503c\u65f6\uff0c\u540c\u6b65\u8fd4\u56de\u6bcf\u4e2a\u503c\u7684\u5546\u54c1\u6570\u91cf\n\n\u5feb\u7b5b\u4e0e\u62bd\u5c49\u7b5b\u5171\u4eab\u540c\u4e00\u5957\u7b5b\u9009\u72b6\u6001\uff1a\u5feb\u7b5b\u9009\u4e2d\u7684\u503c\u5728\u62bd\u5c49\u7b5b\u4e2d\u540c\u6b65\u5c55\u793a\u4e3a\u9009\u4e2d\u6001\uff0c\u62bd\u5c49\u7b5b Apply \u540e\u5feb\u7b5b Chip \u89d2\u6807\u540c\u6b65\u66f4\u65b0\uff08\u8be6\u89c1 \u00a74.9.8\uff09\u3002\n\n---\n\n### \u00a73.3 \u7b5b\u9009\u72b6\u6001\u91cd\u7f6e\u89c4\u5219\n\n| \u89e6\u53d1\u52a8\u4f5c | \u91cd\u7f6e\u8303\u56f4 |\n|------|------|\n| \u5207\u6362\u56fe\u6587\u7b5b\u9879\uff08\u542b\u518d\u6b21\u70b9\u51fb\u53d6\u6d88\u6fc0\u6d3b\u3001\u56de\u5230\u5168\u96c6\uff09| \u6e05\u7a7a\u6240\u6709\u5feb\u7b5b\u6761\u4ef6 + \u62bd\u5c49\u7b5b\u6761\u4ef6 |\n| \u63d0\u4ea4\u65b0\u641c\u7d22\u8bcd | \u6e05\u7a7a\u6240\u6709\u5feb\u7b5b\u6761\u4ef6 + \u62bd\u5c49\u7b5b\u6761\u4ef6 |\n| \u6e05\u7a7a\u641c\u7d22\u8bcd\uff08\u70b9 \u2715\uff09| **\u4e0d\u91cd\u7f6e**\uff0 0\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n\n**\u5438\u9876\u89e6\u53d1\u6761\u4ef6**\uff1a\n- \u9875\u9762\u5411\u4e0a\u6eda\u52a8\u8d8a\u8fc7\u56fe\u6587\u7b5b\u5e95\u90e8\u65f6\uff0c\u5feb\u7b5b\u680f\u9501\u5b9a\u5438\u9876\n- \u5de5\u5177\u680f\u7d27\u8d34\u5feb\u7b5b\u680f\u4e0b\u65b9\u4e00\u8d77\u5438\u9876\n- \u5438\u9876\u6837\u5f0f\uff1a\u767d\u8272\u80cc\u666f + \u5e95\u90e8\u5206\u5272\u7ebf\n- \u7528\u6237\u4e3b\u52a8\u5411\u4e0a\u6ed1\u52a8\u56de\u5230\u9875\u9762\u9876\u90e8\u65f6\uff0cBanner \u548c\u56fe\u6587\u7b5b\u533a\u57df\u91cd\u65b0\u5c55\u5f00\uff0c\u5438\u9876\u89e3\u9664\n\n**\u5e95\u5bfc\u6d88\u5931\u89c4\u5219**\uff1a\u5411\u4e0b\u6eda\u52a8\u8fdb\u5165\u5546\u54c1\u7f51\u683c\u533a\u57df\u4e00\u5b9a\u8ddd\u79bb\u540e\uff0c\u5e95\u90e8\u5bfc\u822a\u680f\u6d88\u5931\uff1b\u5411\u4e0a\u6ed1\u52a8\u4e00\u5b9a\u8ddd\u79bb\u540e\u5e95\u5bfc\u91cd\u65b0\u51fa\u73b0\u3002\u5177\u4f53\u89e6\u53d1\u8ddd\u79bb\u7531 UI \u786e\u5b9a\uff08\u89c1 \u00a78\uff09\u3002\n\n---\n\n### \u00a74.2 \u9876\u5bfc\u680f\n\n\u9876\u5bfc\u680f\u59cb\u7ec8\u56fa\u5b9a\u5728\u9875\u9762\u9876\u90e8\u3002\n\n**\u4ece\u5de6\u5230\u53f3**\uff1a\n\n| \u4f4d\u7f6e | \u5143\u7d20 | \u8bf4\u660e |\n|------|------|------|\n| \u5de6\u4fa7 | \u2190 \u8fd4\u56de\u56fe\u6807 | \u8fd4\u56de\u4e0a\u4e00\u9875 |\n| \u4e2d\u95f4 | Collection \u6807\u9898 | \u8bfb\u53d6 `title` \u5b57\u6bb5\uff0c\u5c45\u4e2d\u5c55\u793a |\n| \u53f3\u4fa7 | \u641c\u7d22\u56fe\u6807 | \u5168\u5c40\u641c\u7d22\u5165\u53e3\uff0cV1 \u4ec5\u4fdd\u7559\u56fe\u6807\uff0c\u70b9\u51fb\u903b\u8f91 V2 |\n| \u53f3\u4fa7 | \u8d2d\u7269\u8f66\u56fe\u6807 | \u8df3\u8f6c\u8d2d\u7269\u8f66 |\n\nV1 \u4e0d\u5c55\u793a\u5206\u4eab\u6309\u94ae\u548c\u54c1\u724c Logo\u3002\n\n**\u80cc\u666f\u72b6\u6001**\uff1a\n\n| \u573a\u666f | \u80cc\u666f | \u56fe\u6807\u8272 |\n|------|------|------|\n| \u672a\u6eda\u8fc7 Banner | \u900f\u660e | \u767d\u8272 |\n| \u5df2\u6eda\u8fc7 Banner \u9ad8\u5ea6 | \u767d\u8272 + \u5e95\u90e8\u5206\u5272\u7ebf | \u6df1\u8272 |\n\n\u900f\u660e\u2192\u767d\u8272\u6e10\u53d8\uff1a\u4ece\u6eda\u52a8\u8ddd\u79bb = Banner \u9ad8\u5ea6 \u00d7 70% \u5f00\u59cb\u7ebf\u6027\u6e10\u5165\uff0c\u81f3 100% \u5b8c\u5168\u767d\u8272\u3002\n\n---\n\n### \u00a74.3 Banner \u533a\u57df\n\nBanner \u533a\u57df\u5c55\u793a\u5934\u56fe\u3001\u6807\u9898\u548c\u526f\u6807\u9898\uff0c\u968f\u9875\u9762\u6eda\u52a8\u3002\n\n**\u5c55\u793a\u5143\u7d20**\uff1a\n- \u5934\u56fe\uff08`banner_image_url`\uff09\n- \u6807\u9898\uff08`title` \u5b57\u6bb5\uff09\n- \u526f\u6807\u9898\uff08`subtitle` \u5b57\u6bb5\uff0c\u82e5\u6709\uff09\n\n**\u56fe\u7247\u52a0\u8f7d\u5931\u8d25\u65f6**\uff1a\u6574\u4e2a Banner \u533a\u57df\u4e0d\u5c55\u793a\uff0c\u4e0d\u5360\u4f4d\u3002\u9875\u9762\u76f4\u63a5\u4ece\u56fe\u6587\u7b5b\u884c\u5f00\u59cb\u3002\n\n**\u5177\u4f53\u6837\u5f0f**\uff08\u6587\u5b57\u4f4d\u7f6e\u3001\u6e10\u53d8\u906e\u7f69\u3001\u5b57\u53f7\u7b49\uff09\u7531 UI \u8bbe\u8ba1\u89c4\u8303\u5b9a\u4e49\u3002\n\n---\n\n### \u00a74.4 \u56fe\u6587\u7b5b\n\n\u56fe\u6587\u7b5b\u884c\u6a2a\u5411\u6eda\u52a8\uff0c\u968f\u9875\u9762\u6eda\u52a8\uff0c\u4e0d\u5438\u9876\u3002\n\n**\u5c55\u793a\u5f62\u5f0f**\uff1a\n- \u56fe\u6587\u7b5b\uff08`image_enable = TRUE`\uff09\uff1a\u56fe\u7247 + \u6587\u5b57\u6807\u7b7e\n- \u7eaf\u6587\u5b57\u7b5b\uff08`image_enable = FALSE`\uff09\uff1a\u4ec5\u6587\u5b57\u6807\u7b7e\n\n**\u4ea4\u4e92\u89c4\u5219**\uff1a\n- \u56fe\u6587\u7b5b\u4e3a**\u5355\u9009**\uff1a\u540c\u4e00\u65f6\u523b\u6700\u591a\u4e00\u4e2a\u6807\u7b7e\u6fc0\u6d3b\n- \u9ed8\u8ba4\u65e0\u6807\u7b7e\u6fc0\u6d3b\uff0c\u5c55\u793a Collection \u5168\u96c6\n- \u70b9\u51fb\u6807\u7b7e \u2192 \u89e6\u53d1 Auto-Scroll\uff08\u00a74.10\uff09 \u2192 \u6e05\u7a7a\u6240\u6709\u5feb\u7b5b\u548c\u62bd\u5c49\u7b5b\u6761\u4ef6\uff08\u00a73.3\uff09\u2192 \u540e\u7aef\u6309\u65b0\u6807\u7b7e\u8303\u56f4\u5237\u65b0\u5546\u54c1\u5217\u8868\n- \u518d\u6b21\u70b9\u51fb\u5df2\u6fc0\u6d3b\u6807\u7b7e \u2192 \u53d6\u6d88\u6fc0\u6d3b\uff0c\u56de\u5230 Collection \u5168\u96c6\n- \u65e0\u7cfb\u7edf\u7ea7\u300cAll\u300d\u9879\uff1b\u6240\u6709\u9879 `status = inactive` \u6216 `module_enabled = FALSE` \u65f6\uff0c\u6574\u884c\u9690\u85cf\uff0c\u4e0d\u5360\u4f4d\n\n\u5411\u4e0b\u6eda\u52a8\u65f6\uff0c\u56fe\u6587\u7b5b\u533a\u57df\u6298\u53e0\uff08\u4e0e Banner \u4e00\u8d77\uff09\uff1b\u5411\u4e0a\u6ed1\u52a8\u56de\u5230\u9876\u90e8\u65f6\uff0cBanner \u548c\u56fe\u6587\u7b5b\u91cd\u65b0\u5c55\u5f00\uff08\u8be6\u89c1 \u00a74.1\uff09\u3002\n\n---\n\n### \u00a74.5 \u5feb\u7b5b\u680f\n\n\u5feb\u7b5b\u680f\u6a2a\u5411\u6eda\u52a8\uff0c\u6eda\u52a8\u8d8a\u8fc7\u56fe\u6587\u7b5b\u5e95\u90e8\u540e\u5438\u9876\u3002\n\n#### \u00a74.5.1 \u6574\u4f53\u5e03\u5c40\n\n- \u6a2a\u5411\u53ef\u6eda\u52a8\uff0c\u6309 `sort_order` \u4ece\u5de6\u5230\u53f3\u6e32\u67d3 `enabled = TRUE` \u7684\u7b5b\u9009\u7ef4\u5ea6 Chip\n- \u67d0\u7ef4\u5ea6\u5728\u5f53\u524d Collection \u5168\u96c6 \u2229 \u56fe\u6587\u7b5b \u2229 \u641c\u7d22\u8bcd\u8303\u56f4\u5185\u6709 \u22652 \u4e2a\u4e0d\u540c\u503c\u65f6\u624d\u6e32\u67d3\u8be5 Chip\uff1b\u5426\u5219\u7269\u7406\u9690\u85cf\n\n#### \u00a74.5.2 \u5feb\u7b5b\u4ea4\u4e92\u89c4\u5219\n\n- \u70b9\u51fb\u5feb\u7b5b Chip \u2192 \u5feb\u7b5b\u680f\u7acb\u5373\u5438\u9876 \u2192 \u4e8c\u7ea7\u7b5b\u9009\u9762\u677f\u4ece\u5feb\u7b5b\u680f\u4e0b\u7f18\u5411\u4e0b\u6253\u5f00\n- \u9762\u677f\u5e95\u90e8\u56fa\u5b9a\u4e24\u4e2a\u6309\u94ae\uff1a\n  - **Clear**\uff1a\u6e05\u7a7a\u5f53\u524d\u7ef4\u5ea6\u6240\u6709\u5df2\u9009\u9879\uff0c\u9762\u677f\u4fdd\u6301\u6253\u5f00\n  - **Apply**\uff1a\u63d0\u4ea4\u5f53\u524d\u9009\u4e2d\u9879\uff0c\u5173\u95ed\u9762\u677f\uff0c\u89e6\u53d1 Auto-Scroll\uff0c\u5237\u65b0\u5546\u54c1\u5217\u8868\n- \u672a\u505a\u4efb\u4f55\u6539\u52a8\u65f6 Apply \u7b49\u540c\u5173\u95ed\uff0c\u4e0d\u89e6\u53d1\u5237\u65b0\n- Clear \u540e\u76f4\u63a5\u5173\u95ed\uff08\u975e Apply\uff09\uff1a\u4e0d\u63d0\u4ea4\uff0c\u6062\u590d\u6253\u5f00\u524d\u72b6\u6001\n\n**Chip \u72b6\u6001**\uff1a\n\n| \u72b6\u6001 | \u6837\u5f0f\u8bf4\u660e |\n|------|------|\n| \u65e0\u9009\u4e2d\u503c | \u9ed8\u8ba4\u6837\u5f0f\uff0c\u5c55\u793a\u7ef4\u5ea6\u540d\u79f0 |\n| \u6709\u9009\u4e2d\u503c | \u9ad8\u4eae\u6837\u5f0f\uff0c\u53f3\u4fa7\u663e\u793a\u5df2\u9009\u6570\u91cf\u89d2\u6807 |\n\n#### \u00a74.5.3 View All \u89c4\u5219\n\n| \u6761\u4ef6 | \u884c\u4e3a |\n|------|------|\n| \u5f53\u524d\u7ef4\u5ea6\u5019\u9009\u9879\u603b\u6570 \u2264 8 | \u5168\u90e8\u5c55\u793a\uff0c\u4e0d\u663e\u793a View All |\n| \u5f53\u524d\u7ef4\u5ea6\u5019\u9009\u9879\u603b\u6570 > 8 | \u9ed8\u8ba4\u5c55\u793a\u524d 8 \u9879 + View All \u5165\u53e3 |\n| \u70b9\u51fb View All | \u9762\u677f\u5c55\u5f00\u4e3a\u53ef\u6eda\u52a8\u533a\u57df\uff0c\u5c55\u793a\u5168\u90e8\u5019\u9009\u9879\uff0cView All \u5165\u53e3\u9690\u85cf |\n\n\u82e5\u5f53\u524d\u7ef4\u5ea6\u5b58\u5728\u5206\u7ec4\uff08\u5982 Size \u6309 Category \u5206\u7ec4\uff09\uff0cView All \u7684 8 \u4e2a\u9608\u503c\u6309\u6240\u6709\u5206\u7ec4\u5185\u9009\u9879**\u603b\u6570**\u7edf\u4e00\u8ba1\u7b97\uff0c\u4e0d\u662f\u6bcf\u7ec4\u5404\u8ba1 8\u3002\n\n#### \u00a74.5.4 \u4ef7\u683c\uff08`display_type = slider`\uff09\u4e8c\u7ea7\u9762\u677f\n\nV1 \u53ea\u652f\u6301 Slider\uff08\u6ed1\u5757\uff09\uff0c\u4e0d\u652f\u6301\u4ef7\u683c\u5e26\u3002\n\n- \u8303\u56f4\uff1a\u6700\u5c0f\u56fa\u5b9a **$0**\uff0c\u6700\u5927\u53d6\u5f53\u524d Collection \u5546\u54c1\u6c60\u6700\u9ad8\u4ef7**\u5411\u4e0a\u53d6\u6574\u5230\u767e\u4f4d**\uff08\u4e0d\u8db3 $100 \u6309 $100\uff09\uff0c\u65e0\u5c0f\u6570/\u5341\u4f4d/\u4e2a\u4f4d\n- \u6ed1\u5757\u4e0a\u65b9\u5b9e\u65f6\u663e\u793a\u5f53\u524d\u533a\u95f4\uff0c\u683c\u5f0f\u300c$200 \u2014 $1,000\u300d\n- \u521d\u59cb\u72b6\u6001\uff1a\u533a\u95f4\u4e3a $0 \uff5e \u6700\u5927\u503c\n- \u91cd\u7f6e\uff1a\u62d6\u56de\u4e24\u7aef = \u65e0\u4ef7\u683c\u7b5b\u9009\u6761\u4ef6\n- \u8303\u56f4\u7531\u540e\u7aef\u6309\u5f53\u524d\u5546\u54c1\u6c60\u52a8\u6001\u8fd4\u56de\uff0c\u4e0d\u5165\u5e93\uff0c\u524d\u7aef\u4e0d\u672c\u5730\u8ba1\u7b97\n- \u4e0d\u9002\u7528 View All\n\n#### \u00a74.5.5 \u989c\u8272\uff08`display_type = color_chip`\uff09\u4e8c\u7ea7\u9762\u677f\n\n- \u5c55\u793a\u5f62\u5f0f\uff1a\u8272\u5757\u5706\u5f62\u77e9\u9635\uff0c\u6bcf\u4e2a\u8272\u5757\u65c1\u5c55\u793a\u8272\u7cfb\u540d\u79f0\n- \u989c\u8272\u679a\u4e3e\u4e0e\u5c55\u793a\uff1a\u4ece Color Dictionary \u8bfb\u53d6 `color_code \u2192 display_name + color_hex`\n- \u4e0d\u9002\u7528 View All\n- \u591a\u9009\n\n#### \u00a74.5.6 \u5176\u4ed6\u7ef4\u5ea6\u4e8c\u7ea7\u9762\u677f\n\n- `display_type = text_chip`\uff1a\u5019\u9009\u503c\u644a\u5e73\u5c55\u793a\u4e3a Chip\uff0c\u591a\u9009\uff0c\u9002\u7528 View All\uff08\u00a74.5.3\uff09\n- `display_type = collapse`\uff1a\u591a\u5c42\u6298\u53e0\u5c55\u793a\uff0c\u591a\u9009\uff0c\u5c55\u5f00\u5c42\u7ea7\u7531\u5f53\u524d\u5546\u54c1\u6c60\u5339\u914d\u7ed3\u679c\u51b3\u5b9a\n\n\u7c7b\u76ee\uff08category\uff09\u4f7f\u7528 collapse \u65f6\uff0c\u6298\u53e0\u5c42\u7ea7\u6309\u5f53\u524d\u5546\u54c1\u6c60\u80fd\u5339\u914d\u5230\u7684\u6240\u6709\u5c42\u7ea7\u5c55\u793a\uff08\u6709\u51e0\u7ea7\u5c55\u793a\u51e0\u7ea7\uff09\u3002\u5177\u4f53\u6837\u5f0f\u7531 UI \u8bbe\u8ba1\u786e\u5b9a\u3002\n\n---\n\n### \u00a74.6 \u5de5\u5177\u680f\n\n\u5de5\u5177\u680f\u56fa\u5b9a\u5728\u5feb\u7b5b\u680f\u4e0b\u65b9\uff0c\u5438\u9876\u65f6\u7d27\u8d34\u5feb\u7b5b\u680f\u4e0b\u7f18\u3002\u5305\u542b\u6392\u5e8f\uff08\u5de6\u4fa7\uff09\u548c\u62bd\u5c49\u7b5b\u5165\u53e3\uff08\u53f3\u4fa7\uff09\u3002\n\n#### \u00a74.6.1 \u6392\u5e8f\uff08\u5de6\u4fa7\uff09\n\n- \u70b9\u51fb\u6392\u5e8f Chip \u2192 \u5f39\u51fa\u6392\u5e8f\u5217\u8868\n- \u6392\u5e8f\u5217\u8868\u4e3a\u5355\u9009\uff0c\u9009\u4e2d\u540e\u7acb\u5373\u751f\u6548\uff0c\u9762\u677f\u5173\u95ed\n- \u6392\u5e8f Chip \u9ed8\u8ba4\u5c55\u793a\u5f53\u524d\u6392\u5e8f\u65b9\u5f0f\u540d\u79f0\uff0c\u5207\u6362\u540e\u66f4\u65b0\u4e3a\u65b0\u63 n\n#### \u00a74.9.5 Reset \u6309\u94ae\n\n- \u6e05\u7a7a\u62bd\u5c49\u5185\u90e8\u5f53\u524d\u9009\u4e2d\u72b6\u6001\uff0c**\u4e0d\u5f71\u54cd\u5feb\u7b5b\u6761\u4ef6**\n- Reset \u540e Apply \u6309\u94ae\u9884\u8ba1\u6570\u91cf\u66f4\u65b0\u4e3a\u5f53\u524d\u5feb\u7b5b + \u641c\u7d22\u8bcd\u8303\u56f4\u5185\u7684\u5546\u54c1\u6570\n- \u4e0e\u5de5\u5177\u680f\u300cClear All\u300d\u533a\u522b\uff1aReset \u4e0d\u5173\u95ed\u62bd\u5c49\uff0c\u4e5f\u4e0d\u6e05\u5feb\u7b5b\n\n#### \u00a74.9.6 \u5411\u53f3\u6ed1\u52a8\u5173\u95ed\u624b\u52bf\n\n- \u5728\u62bd\u5c49\u533a\u57df\u5185\u5411\u53f3\u6c34\u5e73\u6ed1\u52a8\n- \u672a\u8fbe\u9608\u503c \u2192 \u5f39\u56de\uff1b\u8d85\u8fc7\u9608\u503c\u6216\u91ca\u653e\u901f\u5ea6\u8d85\u51fa\u9608\u503c \u2192 \u5173\u95ed\n- \u5173\u95ed\u6548\u679c\u540c\u8def\u5f84 A\uff08\u4e0d\u5e94\u7528\u53d8\u66f4\uff09\n- \u5177\u4f53\u9608\u503c\u7531 UI / \u524d\u7aef\u786e\u5b9a\n\n#### \u00a74.9.7 \u7b5b\u9009\u7ef4\u5ea6\u663e\u793a\u89c4\u5219\n\n\u67d0\u7ef4\u5ea6\u5728\u5f53\u524d Collection \u5168\u96c6 \u2229 \u56fe\u6587\u7b5b \u2229 \u641c\u7d22\u8bcd\u8303\u56f4\u5185\u6709 \u22652 \u4e2a\u4e0d\u540c\u503c\u65f6\u624d\u6e32\u67d3\u8be5\u7ef4\u5ea6\u8282\uff1b\u5426\u5219\u6574\u8282\u7269\u7406\u9690\u85cf\uff0c\u4e0d\u5360\u4f4d\u3002\n\n#### \u00a74.9.8 \u5feb\u7b5b\u4e0e\u62bd\u5c49\u53cc\u5411\u72b6\u6001\u540c\u6b65\n\n- \u5feb\u7b5b\u5bf9\u67d0\u5c5e\u6027\u5df2\u9009\u503c \u2192 \u6253\u5f00\u62bd\u5c49\u65f6\uff0c\u8be5\u5c5e\u6027\u8282\u5bf9\u5e94\u9879\u663e\u793a\u4e3a\u9009\u4e2d\u6001\n- \u62bd\u5c49\u5185\u4fee\u6539 \u2192 Apply \u540e\uff0c\u5bf9\u5e94\u5feb\u7b5b Chip \u89d2\u6807\u66f4\u65b0\n- \u62bd\u5c49 Reset \u2192 \u4e0d\u6e05\u5feb\u7b5b\n- \u5df2\u9009\u6761\u4ef6\u533a Clear All \u2192 \u540c\u65f6\u6e05\u5feb\u7b5b\u548c\u62bd\u5c49\u5185\u90e8\u72b6\u6001\n\n---\n\n### \u00a74.10 Auto-Scroll \u884c\u4e3a\n\n#### \u00a74.10.1 \u89e6\u53d1\u4e8b\u4ef6\n\n| \u89e6\u53d1\u52a8\u4f5c | \u884c\u4e3a           toggle.classList.toggle('collapsed', !collapsed);
        });
      }
      ul.appendChild(li);
    });
    return ul;
  }

  var tree = buildTree(items);
  var tocList = document.getElementById('tocList');
  tocList.innerHTML = '';
  var rendered = renderTree(tree);
  while (rendered.firstChild) tocList.appendChild(rendered.firstChild);

  var allLinks = tocList.querySelectorAll('a');
  var headingEls = items.map(function(it) { return it.el; });

  function updateActive() {
    var scrollTop = window.scrollY + 80;
    var current = 0;
    headingEls.forEach(function(h, i) { if (h.offsetTop <= scrollTop) current = i; });
    allLinks.forEach(function(a, i) { a.classList.toggle('active', i === current); });
    var activeLink = allLinks[current];
    if (activeLink) {
      var parent = activeLink.closest('.toc-children');
      while (parent) {
        parent.classList.remove('collapsed');
        parent = parent.parentElement.closest('.toc-children');
      }
    }
  }
  window.removeEventListener('scroll', window._tocScroll);
  window._tocScroll = updateActive;
  window.addEventListener('scroll', updateActive);
  updateActive();

  allLinks.forEach(function(a) {
    a.addEventListener('click', function(e) {
      e.preventDefault();
      var target = document.getElementById(a.getAttribute('href').slice(1));
      if (target) window.scrollTo({ top: target.offsetTop - 60, behavior: 'smooth' });
    });
  });

  tocList.querySelectorAll('.toc-children').forEach(function(ul) {
    var parentLink = ul.previousElementSibling;
    if (parentLink) {
      var a = parentLink.querySelector('a');
      if (a && (a.classList.contains('toc-h2') || a.classList.contains('toc-h3'))) {
        ul.classList.add('collapsed');
        var tog = parentLink.querySelector('.toc-toggle');
        if (tog) tog.classList.add('collapsed');
      }
    }
  });
}

function downloadMD() {
  var md = VERSIONS[currentFile] || '';
  var blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = currentFile;
  a.click();
}

function downloadHTML() {
  var html = document.documentElement.outerHTML;
  var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = currentFile.replace('.md', '.html');
  a.click();
}

loadMD('looply-collection-landing-PRD-v1.6.md');
