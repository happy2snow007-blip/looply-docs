<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
.page{display:none}
.page.active{display:block}
.menu-child{padding:10px;cursor:pointer;border:1px solid #ccc;margin:5px}
.menu-child.active{background:#7C3AED;color:white}
</style>
</head>
<body>
<div class="sidebar">
  <div class="menu-child" tabindex="0" role="menuitem" data-page="test1">Test 1</div>
  <div class="menu-child" tabindex="0" role="menuitem" data-page="price-rule">价格规则配置</div>
</div>

<div class="main">
  <div class="breadcrumb">Breadcrumb</div>
  <div class="page" id="page-test1-list" style="display:none">
    <h1>Test 1 List Page</h1>
  </div>
  <div class="page" id="page-price-rule-list" style="display:none">
    <h1>价格规则配置 List Page</h1>
    <p>This is the price rule list page content.</p>
  </div>
</div>

<script>
function clearAllActive() {
  document.querySelectorAll('.menu-child').forEach(i => i.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
}

function navigateTo(pageId, label) {
  console.log('navigateTo called:', pageId, label);
  clearAllActive();
  var listPage = document.getElementById('page-' + pageId + '-list');
  console.log('Looking for page-' + pageId + '-list:', listPage);
  if (listPage) {
    console.log('Found list page, adding active class');
    listPage.classList.add('active');
  } else {
    var pg = document.getElementById('page-' + pageId);
    console.log('List page not found, looking for page-' + pageId + ':', pg);
    if (pg) pg.classList.add('active');
  }
  document.querySelector('.breadcrumb').textContent = label;
}

document.querySelectorAll('.menu-child').forEach(function(el) {
  el.addEventListener('click', function() {
    console.log('Menu clicked:', el.dataset.page);
    navigateTo(el.dataset.page, el.textContent.trim());
    el.classList.add('active');
  });
});

// Auto-click first menu item
document.querySelector('.menu-child').click();
</script>
</body>
</html>
