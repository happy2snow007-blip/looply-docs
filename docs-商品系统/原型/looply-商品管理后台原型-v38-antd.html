<style>
html,body,#root{height:100%;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F9FAFB;color:#1F2937}
#root::before{content:'正在加载 antd 原型……';position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#9CA3AF;font-size:14px}
#root:not(:empty)::before{display:none}
.lp-kpi{background:linear-gradient(180deg,#FEFCFF 0%,#F3EEFF 100%);border:1px solid #DDD6FE;border-radius:14px;padding:14px 16px}
.lp-kpi .num{font-size:24px;font-weight:700;color:#7C3AED;line-height:1;margin-bottom:6px;font-variant-numeric:tabular-nums}
.lp-kpi .label{font-size:12px;color:#6B7280}
.lp-pagination{display:flex;align-items:center;justify-content:center;gap:24px;padding:12px 16px;font-size:13px;color:#6B7280}
.lp-pagination .divider{width:1px;height:20px;background:#E5E7EB}
.lp-tip-trigger{cursor:help;border-bottom:1px dashed #9CA3AF;padding-bottom:1px}
.lp-editable{cursor:pointer;padding:2px 6px;border-radius:6px;border:1px solid transparent;transition:all .15s;display:inline-block;min-width:40px;text-align:right}
.lp-editable:hover{border-color:#DDD6FE;background:#FAF5FF;color:#7C3AED}
.lp-edit-just-saved{color:#16A34A!important;transition:color 1s}
.lp-note{padding:14px;border-radius:10px;background:#F3EEFF;border:1px solid #DDD6FE;color:#6D28D9;font-size:12px;line-height:1.8}
.lp-note-sm{padding:10px 14px;background:#F3EEFF;border:1px solid #DDD6FE;border-radius:8px;font-size:12px;color:#6D28D9}
.lp-section-purple{font-size:14px;font-weight:700;color:#7C3AED;margin:0 0 12px}
.lp-section{font-size:15px;font-weight:600;color:#1F2937;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid #E5E7EB}
.lp-oplog-title{font-size:14px;font-weight:700;color:#7C3AED;margin:24px 0 12px}
.lp-empty{display:flex;flex-direction:column;align-items:center;padding:60px 20px;text-align:center}
.lp-empty .icon{font-size:48px;margin-bottom:16px;color:#9CA3AF}
.lp-empty .icon.err{color:#DC2626}
.lp-empty .title{font-size:16px;font-weight:600;color:#1F2937;margin-bottom:8px}
.lp-empty .desc{font-size:13px;color:#6B7280;margin-bottom:24px;max-width:360px}
.lp-form-row{display:flex;gap:16px;margin-bottom:12px;align-items:center}
.lp-form-row:first-of-type{margin-top:8px}
.lp-form-row .lp-form-label{width:120px;text-align:right;color:#6B7280;font-size:13px;flex-shrink:0}
.lp-form-row .lp-form-label .req{color:#DC2626;margin-right:4px}
.lp-form-row .lp-form-control{flex:1}
.lp-helper{font-size:12px;color:#9CA3AF;margin:-4px 0 12px 136px}
.lp-readonly{background:#F9FAFB;border:1px solid #F0F1F3;border-radius:8px;padding:7px 12px;color:#6B7280;font-size:14px;min-height:34px;box-sizing:border-box;display:flex;align-items:center}
.lp-radio-card-group{display:flex;gap:12px;margin-bottom:16px}
.lp-radio-card{flex:1;padding:12px 16px;border:2px solid #D1D5DB;border-radius:10px;background:#fff;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .15s}
.lp-radio-card.active{border-color:#7C3AED;background:#FAF5FF}
.lp-radio-card .title{font-weight:600;font-size:13px;color:#1F2937;margin-bottom:2px}
.lp-radio-card .desc{font-size:11px;color:#6B7280}
.lp-code{font-family:Menlo,Monaco,Consolas,monospace;font-size:12px;color:#374151;background:#F3F4F6;padding:1px 6px;border-radius:4px}
.lp-detail{display:grid;grid-template-columns:120px 1fr;gap:10px 16px;font-size:13px;margin-bottom:24px}
.lp-detail .dl{color:#6B7280}
.lp-detail .dv{color:#1F2937}
.lp-preview-line{display:flex;justify-content:space-between;gap:20px;padding:10px 0;border-bottom:1px solid #E5E7EB;font-size:13px}
.lp-preview-line:last-child{border-bottom:none}
.lp-upload-zone{border:2px dashed #D1D5DB;border-radius:14px;padding:28px;text-align:center;background:#FAFAFA;color:#6B7280;font-size:13px;cursor:pointer}
.lp-upload-zone .sub{font-size:12px;color:#9CA3AF;margin-top:6px}
.lp-seo-card{border:1px solid #E5E7EB;border-radius:12px;padding:16px;background:#fff}
.lp-gp-title{color:#1a0dab;font-size:16px;margin-bottom:2px}
.lp-gp-url{color:#006621;font-size:12px;margin-bottom:4px}
.lp-gp-desc{color:#545454;font-size:12px;line-height:1.5}
:focus-visible{outline:none;box-shadow:inset 0 0 0 2px rgba(124,58,237,.4)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

/* ───────── 业务组件 ───────── */
function Kpi({ num, label }) {
  return <div className="lp-kpi"><div className="label" style={{ marginBottom: 6 }}>{label}</div><div className="num">{num}</div></div>;
}
function StatusTag({ variant, children }) {
  const c = TAG_COLORS[variant] || TAG_COLORS.off;
  return <Tag bordered={false} style={{ background:c.bg, color:c.color, borderRadius:999, padding:'2px 10px', fontSize:12, lineHeight:'18px', marginInlineEnd:4 }}>{children}</Tag>;
}
function Pill({ children }) {
  return <Tag bordered={false} style={{ background:'#F3EEFF', color:'#6D28D9', borderRadius:6, fontSize:12, marginInlineEnd:4 }}>{children}</Tag>;
}
function TipText({ label, tip }) {
  return <Tooltip title={<div style={{ whiteSpace:'pre-line', lineHeight:1.6 }}>{tip}</div>} color="#fff" styles={{ body:{ color:'#374151', fontSize:12, padding:'10px 14px' } }}><span className="lp-tip-trigger">{label}</span></Tooltip>;
}
function SectionNote({ children }) {
  return <div style={{ fontSize:12, color:'#6B7280', margin:'-4px 0 12px', lineHeight:1.7 }}>{children}</div>;
}
function Note({ children }) { return <div className="lp-note-sm" style={{ lineHeight:1.8 }}>{children}</div>; }
function ReadField({ children }) { return <div className="lp-readonly">{children}</div>; }
function UploadBox({ text, sub }) {
  return <div className="lp-upload-zone"><div style={{ fontWeight:500 }}>{text || '点击或拖拽上传'}</div>{sub && <div className="sub">{sub}</div>}</div>;
}
function CompactPagination({ total, current=1, pageSize=10, totalPages }) {
  const tp = totalPages || Math.ceil((total||0) / pageSize) || 1;
  const pages = useMemo(() => {
    const out = [{ k:'prev', label:'‹', disabled:current===1, arrow:true }];
    if (tp <= 6) { for (let i=1;i<=tp;i++) out.push({ k:i, label:i }); }
    else { out.push({k:1,label:1}); out.push({k:2,label:2}); out.push({k:3,label:3}); out.push({k:'gap',label:'…',disabled:true}); out.push({k:tp,label:tp}); }
    out.push({ k:'next', label:'›', disabled:current===tp, arrow:true });
    return out;
  }, [current, tp]);
  return (
    <div className="lp-pagination">
      <span>共 {(total||0).toLocaleString()} 条，每页{' '}
        <Select size="small" value={pageSize} style={{ width:72, marginInline:4 }} options={[{value:10,label:10},{value:20,label:20},{value:50,label:50}]} />{' '}条</span>
      <div className="divider" />
      <Space size={2}>{pages.map(p => (
        <span key={p.k} style={{ minWidth:32, height:32, display:'inline-flex', alignItems:'center', justifyContent:'center',
          borderRadius:8, fontSize:13, cursor:p.disabled?'default':'pointer',
          background:p.k===current?'#7C3AED':(p.arrow?'#fff':'transparent'), color:p.k===current?'#fff':'#374151',
          border:p.arrow?'1px solid #E5E7EB':'none', fontWeight:p.k===current?600:400, opacity:p.disabled?0.35:1 }}>{p.label}</span>
      ))}</Space>
      <div className="divider" />
      <span>第 {current}/{tp} 页</span>
    </div>
  );
}
function EmptyZero({ entity, cta, onCta }) {
  return <div className="lp-empty"><InboxOutlined className="icon" /><div className="title">暂无{entity}</div><div className="desc">点击下方按钮创建第一个{entity}</div>{cta && <Button type="primary" onClick={onCta}>{cta}</Button>}</div>;
}
function EmptyNoMatch({ onClear }) {
  return <div className="lp-empty"><SearchOutlined className="icon" /><div className="title">未找到匹配结果</div><div className="desc">请尝试调整搜索关键词或筛选条件</div><Button onClick={onClear}>清除筛选条件</Button></div>;
}
function EmptyError({ onRetry }) {
  return <div className="lp-empty"><ExclamationCircleOutlined className="icon err" /><div className="title">加载失败</div><div className="desc">网络异常，请检查网络连接后重试</div><Button type="primary" onClick={onRetry}>重试</Button></div>;
}
function EmptyStateSwitcher({ mode, setMode }) {
  return <div style={{ marginTop:12, display:'flex', gap:8, justifyContent:'center' }}>
    {[['data','正常数据'],['zero','零数据态'],['no-match','无匹配态'],['error','异常态']].map(([k,label]) =>
      <Button key={k} size="small" type={mode===k?'primary':'default'} onClick={() => setMode(k)}>{label}</Button>)}
  </div>;

function ListPage({ title, desc, headActions, kpis, filters, columns, data, rowKey='id', total, entity, createKey, go, scrollX, note, defaultExpandAllRows, rowSelection, selectedInfo }) {

      <Alert type="info" showIcon={false} message={<div style={{ fontSize:13, lineHeight:1.8 }}><b>导出说明</b><br/>• 按当前筛选条件导出匹配的渠道数据<br/>• 导出文件格式为 Excel (.xlsx)<br/>• 导出结果请前往下载中心查看和下载</div>} />
      <FormRow label="导出范围"><Radio.Group defaultValue="all"><Radio value="all">全部渠道（9 条）</Radio><Radio value="filter">当前筛选结果</Radio></Radio.Group></FormRow>
      <FormRow label="导出字段"><Checkbox.Group defaultValue={['base','market','config','stat']} options={[{value:'base',label:'基础信息（ID/名称/状态）'},{value:'market',label:'Market 信息'},{value:'config',label:'运营配置（同步策略）'},{value:'stat',label:'统计数据（商品数）'}]} /></FormRow>
      <Note>导出任务提交后将在后台异步处理，完成后可在下载中心获取文件</Note>
    </div> };
  if (t === 'batchShelf') return { width:600, title:'批量上架',
    footer:[cancel, <Button key="s" type="primary" onClick={close}>确认上架</Button>],
    content:<>
      <SectionNote>将已下架的渠道商品重新上架。仅「已下架」状态的商品可执行上架操作。</SectionNote>
      <Alert type="warning" showIcon style={{ marginBottom:16 }} message="请先在列表中勾选需要上架的商品，再点击批量上架。" />
      <Table rowKey="id" size="small" pagination={false} styles={TABLE_STYLES}
        dataSource={[{id:'CI003',name:'Rolex Submariner 黑盘',ch:'美国官网商城',price:'$12,800',st:'已下架'}]}
        columns={[{title:'渠道商品 ID',dataIndex:'id'},{title:'商品名称',dataIndex:'name'},{title:'所属渠道',dataIndex:'ch'},{title:'挂牌价',dataIndex:'price'},{title:'当前状态',dataIndex:'st',render:v=><StatusTag variant="off">{v}</StatusTag>}]} />
      <Note>上架后商品状态变为「在售」，将在对应渠道前端展示。</Note>
    </> };
  if (t === 'batchUnshelf') return { width:600, title:'批量下架',
    footer:[cancel, <Button key="s" type="primary" danger onClick={close}>确认下架</Button>],
    content:<>
      <SectionNote>将在售的渠道商品下架。下架后商品不再在渠道前端展示，但数据保留，可随时重新上架。</SectionNote>
      <Alert type="warning" showIcon style={{ marginBottom:16 }} message="请先在列表中勾选需要下架的商品，再点击批量下架。" />
      <Table rowKey="id" size="small" pagination={false} styles={TABLE_STYLES}
        dataSource={[{id:'CI001',name:'Hermes Birkin 25 黑金',ch:'美国官网商城',price:'$74,000',st:'在售'},{id:'CI002',name:'LV Neverfull MM 棕色',ch:'美国官网商城',price:'$10,584',st:'在售'}]}
        columns={[{title:'渠道商品 ID',dataIndex:'id'},{title:'商品名称',dataIndex:'name'},{title:'所属渠道',dataIndex:'ch'},{title:'挂牌价',dataIndex:'price'},{title:'当前状态',dataIndex:'st',render:v=><StatusTag variant="on">{v}</StatusTag>}]} />
      <Note>下架后商品状态变为「已下架」，不影响关联的实物商品状态。</Note>
    </> };
  if (t === 'shelf') return { width:600, title:'上架到渠道',
    footer:[cancel, <Button key="s" type="primary" onClick={close}>确认上架</Button>],
    content:<>
      <SectionNote>选择目标渠道并设置挂牌价，确认后将生成渠道商品记录。挂牌价按渠道单独维护，币种自动跟随对应 Market 的默认货币。</SectionNote>
      <Table rowKey="id" size="small" pagination={false} styles={TABLE_STYLES} rowSelection={{ type:'checkbox', getCheckboxProps:(r) => ({ disabled:r.shelved }) }}
        dataSource={[{id:'CH001',name:'美国官网商城',mk:'US Market',cur:'USD',price:'74000',shelved:false},{id:'CH002',name:'德国旗舰店',mk:'EU Market',cur:'EUR',price:'69999',shelved:false},{id:'CH003',name:'亚马逊美国站',mk:'US Market',cur:'USD',price:'',shelved:true}]}
        columns={[{title:'渠道',dataIndex:'name'},{title:'Market',dataIndex:'mk'},{title:'币种',dataIndex:'cur',width:70},
          {title:'挂牌价',dataIndex:'price',width:150,render:(v,r) => r.shelved ? <span style={{ color:'#9CA3AF' }}>已上架</span> : <Input size="small" defaultValue={v} placeholder="请输入挂牌价" />}]} />
    </> };
  return { width:480, title:'', footer:[cancel], content:null };
}
function GlobalModals({ modal, close }) {
  if (!modal.type) return null;
  const cfg = modalConfig(modal, close);
  return <Modal open title={cfg.title} width={cfg.width} closable={false} maskClosable={false} centered onCancel={close} footer={cfg.footer}>{cfg.content}</Modal>;
}

/* ───────── 菜单 ───────── */
function buildMenu(active) {
  const lab = (text, key) => <span style={{ fontWeight: active===key?600:400 }}>{text}</span>;
  return [
    { key:'category', icon:<AppstoreOutlined />, label:lab('类目管理','category') },
    { key:'brand', icon:<CrownOutlined />, label:lab('品牌管理','brand') },
    { key:'series', icon:<BranchesOutlined />, label:lab('系列管理','series') },
    { type:'divider' },
    { key:'attr', icon:<ProfileOutlined />, label:'属性管理', children:[
      { key:'attr-def', icon:<UnorderedListOutlined />, label:lab('属性定义','attr-def') },
      { key:'attr-option', icon:<OrderedListOutlined />, label:lab('属性选项','attr-option') },
      { key:'measure', icon:<ColumnHeightOutlined />, label:'度量维度', children:[
        { key:'dimension', icon:<ColumnHeightOutlined />, label:lab('维度管理','dimension') },
        { key:'measure-unit', icon:<FontSizeOutlined />, label:lab('单位管理','measure-unit') },
      ]},
      { key:'size', icon:<ColumnWidthOutlined />, label:'尺码管理', children:[
        { key:'size-system', icon:<TableOutlined />, label:lab('尺码体系','size-system') },
        { key:'size-conversion', icon:<SwapOutlined />, label:lab('尺码换算','size-conversion') },
        { key:'brand-size-system', icon:<BlockOutlined />, label:lab('品牌尺码体系','brand-size-system') },
        { key:'brand-size-conversion', icon:<RetweetOutlined />, label:lab('品牌尺码换算','brand-size-conversion') },
      ]},
      { key:'dim-diagram', icon:<ExpandOutlined />, label:lab('尺寸测量方法','dim-diagram') },
    ]},
    { key:'attr-scope', icon:<AimOutlined />, label:lab('属性作用域','attr-scope') },
    { type:'divider' },
    { key:'spu-group', icon:<GoldOutlined />, label:'标品管理', children:[
      { key:'spu', icon:<DatabaseOutlined />, label:lab('SPU 管理','spu') },
      { key:'sku', icon:<BuildOutlined />, label:lab('SKU 管理','sku') },
    ]},
    { key:'product-group', icon:<ShoppingOutlined />, label:'商品管理', children:[
      { key:'product', icon:<ShoppingCartOutlined />, label:lab('实物商品','product') },
      { key:'channel-product', icon:<ShopOutlined />, label:lab('渠道商品','channel-product') },
      { key:'channel', icon:<NodeIndexOutlined />, label:lab('渠道管理','channel') },
    ]},
    { type:'divider' },
    { key:'pricing', icon:<DollarOutlined />, label:'商品定价', children:[
      { key:'price-rule', icon:<PercentageOutlined />, label:lab('尾差规则','price-rule') },
    ]},
    { type:'divider' },
    { key:'tag-list', icon:<TagsOutlined />, label:lab('标签管理','tag-list') },
    { key:'download-center', icon:<CloudDownloadOutlined />, label:lab('下载中心','download-center') },
  ];
}
const LEAF_KEYS = ['category','brand','series','attr-def','attr-option','dimension','measure-unit','size-system','size-conversion','brand-size-system','brand-size-conversion','dim-diagram','attr-scope','spu','sku','product','channel-product','channel','price-rule','tag-list','download-center'];

/* ───────── App ───────── */
function App() {
  const [page, setPage] = useState({ m:'category', s:'list' });
  const [modal, setModal] = useState({ type:null });
  const go = (m, s='list') => { setPage({ m, s }); const el = document.getElementById('lp-content'); if (el) el.scrollTop = 0; };
  const openModal = (type, data) => setModal({ type, ...(data||{}) });
  const closeModal = () => setModal({ type:null });
  const Mod = MODULE_COMPONENTS[page.m] || PlaceholderModule;
  const subName = { list:'列表', create:'新建', edit:'编辑', detail:'详情' }[page.s] || '';
  return (
    <ConfigProvider theme={looplyTheme}>
      <Layout style={{ height:'100vh' }}>
        <Layout.Header style={{ borderBottom:'1px solid #E5E7EB', display:'flex', alignItems:'center' }}>
          <img src={LOGO_SRC} alt="Looply" style={{ height:32, display:'block' }} />
          <div style={{ width:1, height:20, background:'#E5E7EB', margin:'0 16px' }} />
          <span style={{ fontSize:14, fontWeight:500, color:'#6B7280' }}>商品管理后台</span>
          <span style={{ marginLeft:'auto', color:'#9CA3AF', fontSize:13 }}>{MODULE_TITLES[page.m]} / {subName}</span>
        </Layout.Header>
        <Layout>
          <Layout.Sider width={220} theme="light" style={SIDER_STYLE}>
            <Menu mode="inline" items={buildMenu(page.m)} selectedKeys={[page.m]}
              defaultOpenKeys={['attr','measure','size','spu-group','product-group','pricing']}
              style={{ borderInlineEnd:'none' }}
              onClick={({ key }) => { if (LEAF_KEYS.includes(key)) go(key); }} />
          </Layout.Sider>
          <Layout.Content id="lp-content" style={{ padding:28, overflow:'auto' }}>
            <Mod sub={page.s} go={go} openModal={openModal} />
          </Layout.Content>
        </Layout>
      </Layout>
      <GlobalModals modal={modal} close={closeModal} />
    </ConfigProvider>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
