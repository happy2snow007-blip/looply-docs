<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="400" height="450">
  <metadata>
    <template-info>
      <category>手提包</category>
      <version>1.0</version>
      <slots>length,height,width,strap_drop</slots>
    </template-info>
  </metadata>

  <defs>
    <style>
      .bag-body { fill: #F5E6D3; stroke: #8B7355; stroke-width: 2; }
      .bag-strap { fill: none; stroke: #8B7355; stroke-width: 3; stroke-linecap: round; }
      .dim-line { stroke: #E85D04; stroke-width: 1.5; stroke-dasharray: 4 2; }
      .dim-arrow { fill: #E85D04; stroke: #E85D04; stroke-width: 1; }
      .dim-value { font-family: -apple-system, Arial, sans-serif; font-size: 13px; fill: #E85D04; font-weight: 700; }
    </style>
    <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6" class="dim-arrow" fill="none"/>
    </marker>
    <marker id="arrow-end" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" class="dim-arrow" fill="none"/>
    </marker>
  </defs>

  <!-- Bag body -->
  <path class="bag-body" d="M120,180 Q120,170 130,165 L270,165 Q280,170 280,180 L285,350 Q285,365 270,365 L130,365 Q115,365 115,350 Z"/>

  <!-- Bag strap -->
  <path class="bag-strap" d="M155,165 Q155,80 200,75 Q245,80 245,165"/>

  <!-- Bag details: clasp -->
  <rect x="185" y="158" width="30" height="14" rx="3" fill="#C9A96E" stroke="#8B7355" stroke-width="1"/>

  <!-- Bag details: stitching -->
  <line x1="130" y1="220" x2="270" y2="220" stroke="#8B7355" stroke-width="0.8" stroke-dasharray="3 2"/>

  <!-- ==================== DIMENSION ANNOTATIONS ==================== -->

  <!-- LENGTH (horizontal, bottom) -->
  <g data-slot="length">
    <line class="dim-line" x1="115" y1="385" x2="285" y2="385" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <line class="dim-line" x1="115" y1="365" x2="115" y2="392"/>
    <line class="dim-line" x1="285" y1="365" x2="285" y2="392"/>
    <text class="dim-value" x="185" y="402">--</text>
  </g>

  <!-- HEIGHT (vertical, right) -->
  <g data-slot="height">
    <line class="dim-line" x1="305" y1="165" x2="305" y2="365" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <line class="dim-line" x1="280" y1="165" x2="312" y2="165"/>
    <line class="dim-line" x1="285" y1="365" x2="312" y2="365"/>
    <text class="dim-value" x="315" y="270" transform="rotate(90,315,270)">--</text>
  </g>

  <!-- WIDTH (diagonal indicator, lower-left) -->
  <g data-slot="width">
    <line class="dim-line" x1="50" y1="300" x2="50" y2="340" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <line class="dim-line" x1="45" y1="300" x2="115" y2="300"/>
    <line class="dim-line" x1="45" y1="340" x2="115" y2="340"/>
    <text class="dim-value" x="30" y="365">--</text>
  </g>

  <!-- STRAP DROP (vertical, left of strap) -->
  <g data-slot="strap_drop">
    <line class="dim-line" x1="135" y1="75" x2="135" y2="165" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <line class="dim-line" x1="130" y1="75" x2="155" y2="75"/>
    <line class="dim-line" x1="130" y1="165" x2="142" y2="165"/>
    <text class="dim-value" x="90" y="125">--</text>
  </g>

  <!-- Footer hint -->
  <text x="200" y="435" text-anchor="middle" font-family="-apple-system, Arial, sans-serif" font-size="11" fill="#999">
    slots: length | height | width | strap_drop
  </text>
</svg>
