<!-- STRUCTURED DATA :: PRODUCT DEFINITION
  模块: looply 支付打款模块 · 产品架构图
  版本: v1.3
  范围: V1 支付打款层
  业务层: 美国上门回收（买断）[now] / 寄卖结算[plan] / 三方商家货款结算[plan]
  用户层 运营（资金专员）· PC 后台: 余额监控与告警配置 / 打款单录入与发起 / 打款失败处理 / 日终对账
  用户层 运营（上门人员）· 移动端页面（同一套登录鉴权）: 发起打款：录入 + 二次确认
  核心能力 ① 资金供给: 资金账户配置与余额监控[v1] / 余额预警[v1] / 打款前余额校验[v1] / 预充值管理[v2] / 自动补款[v2]
  核心能力 ② 出款执行: 打款单录入（PC / 移动端）[v1] / 收款通道选择[v1] / RTP 可达性校验[v1] / 收款信息加密与脱敏[v1] / 提交前二次确认[v1] / 打款限额控制[v1] / 打款发起与状态跟踪[v1] / 打款失败处理[v1] / 制裁名单筛查（收货环节人工）[v2] / 收款信息复用[v2] / Push to Card 通道[v2] / ACH 兜底通道[v2]
  核心能力 ③ 账目与核对: 出款流水[v1] / 资金操作审计日志（技术侧建模）[v1] / 日终对账[v1] / 出款数据供给[v1] / 差错处理闭环[v2] / 充值流水[v2] / 余额变动明细[v2]
  外围系统 三方外部系统: 摩根 Global Payments API / 飞书开放平台（余额告警推送） / TCH RTP 参与机构目录（可达性）
  外围系统 依赖的平台能力: looply 运营后台（PC 与移动端页面承载 · 登录鉴权 · 权限）
-->
