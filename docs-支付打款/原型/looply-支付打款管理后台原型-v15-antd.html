<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>looply · 支付打款管理后台原型 v15</title>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/dayjs@1.11.21/dayjs.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/antd@6.4.3/dist/antd.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/@ant-design/icons@6.2.1/dist/index.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.28.4/babel.min.js"></script>
<style>
html,body,#root{height:100%;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F9FAFB;color:#1F2937}
#root::before{content:'正在加载 antd 原型……';position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#9CA3AF;font-size:14px}
#root:not(:empty)::before{display:none}
.lp-kpi{background:linear-gradient(180deg,#FEFCFF 0%,#F3EEFF 100%);border:1px solid #DDD6FE;border-radius:14px;padding:14px 16px}
.lp-kpi .num{font-size:24px;font-weight:700;color:#7C3AED;line-height:1;margin-bottom:6px;font-variant-numeric:tabular-nums}
.lp-kpi .label{font-size:12px;color:#6B7280}
.lp-pagination{display:flex;align-items:center;justify-content:center;gap:24px;padding:12px 16px;font-size:13px;color:#6B7280}
.lp-pagination .divider{width:1px;height:20px;background:#E5E7EB}
.lp-tip-trigger{cursor:help;border-bottom:1px dashed #9CA3AF;padding-bottom:1px}
.lp-note{padding:14px;border-radius:10px;background:#F3EEFF;border:1px solid #DDD6FE;color:#6D28D9;font-size:12px;line-height:1.8}
.lp-note-sm{padding:10px 14px;background:#F3EEFF;border:1px solid #DDD6FE;border-radius:8px;font-size:12px;color:#6D28D9}
.lp-section-purple{font-size:14px;font-weight:700;color:#7C3AED;margin:0 0 12px}
.lp-section{font-size:15px;font-weight:600;color:#1F2937;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid #E5E7EB}
.lp-oplog-title{font-size:14px;font-weight:700;color:#7C3AED;margin:24px 0 12px}
/* ===== 移动端发起打款（终端识别后渲染，与 PC 共用同一套登录鉴权）===== */
.lp-mb{width:375px;margin:0 auto;background:#fff;min-height:640px;display:flex;flex-direction:column;
  box-shadow:0 10px 40px rgba(16,24,40,.14);border-radius:20px;overflow:hidden}
.lp-mb-hd{height:52px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid #F3F4F6;flex-shrink:0}
.lp-mb-hd .t{font-size:16px;font-weight:600}
.lp-mb-bd{flex:1;overflow-y:auto;padding:16px}
.lp-mb-ft{padding:12px 16px;border-top:1px solid #F3F4F6;flex-shrink:0}
.lp-mb-lab{font-size:13px;color:#374151;font-weight:500;margin:16px 0 6px}
.lp-mb-lab .req{color:#DC2626;margin-right:3px}
.lp-mb-help{font-size:12px;color:#9CA3AF;margin-top:6px;line-height:1.5}
.lp-mb-err{font-size:12px;color:#DC2626;margin-top:6px;line-height:1.5}
.lp-mb-bal{font-size:12px;color:#6B7280;margin-top:6px}
.lp-mb-cf .row{display:flex;align-items:baseline;gap:10px;padding:11px 0;border-bottom:1px solid #F3F4F6}
.lp-mb-cf .k{width:72px;text-align:right;color:#6B7280;font-size:13px;flex-shrink:0}
.lp-mb-cf .v{font-size:15px;color:#1F2937;word-break:break-all}
.lp-mb-cf .amt{font-size:30px;font-weight:700;color:#7C3AED;line-height:1.1}
/* ===== 小屏适配：Sider 收起后内容占满，手机框还原为全宽页面 ===== */
.lp-content{padding:28px}
.lp-burger{display:none}
@media (max-width:768px){
  .lp-content{padding:12px}
  .lp-burger{display:inline-flex!important}
  .lp-hd-pc{display:none!important}
  /* 手机框在真机上不再是"预览框"，直接铺满 */
  .lp-mb{width:100%;min-height:auto;box-shadow:none;border-radius:12px}
  .lp-kpi{padding:12px}
  .lp-kpi .num{font-size:20px}
}
.lp-empty{display:flex;flex-direction:column;align-items:center;padding:60px 20px;text-align:center}
.lp-empty .icon{font-size:48px;margin-bottom:16px;color:#9CA3AF}
.lp-empty .icon.err{color:#DC2626}
.lp-empty .title{font-size:16px;font-weight:600;color:#1F2937;margin-bottom:8px}
.lp-empty .desc{font-size:13px;color:#6B7280;margin-bottom:24px;max-width:360px}
.lp-form-row{display:flex;gap:16px;margin-bottom:12px;align-items:center}
.lp-form-row:first-of-type{margin-top:8px}
.lp-form-row .lp-form-label{width:96px;text-align:right;color:#6B7280;font-size:13px;flex-shrink:0}
.lp-form-row .lp-form-label .req{color:#DC2626;margin-right:4px}
.lp-form-row .lp-form-control{flex:1}
.lp-helper{font-size:12px;color:#9CA3AF;margin:-4px 0 12px 112px}
.lp-code{font-family:Menlo,Monaco,Consolas,monospace;font-size:12px;color:#374151;background:#F3F4F6;padding:1px 6px;border-radius:4px}
.lp-module{margin-bottom:24px}
.lp-module:last-child{margin-bottom:0}
.lp-module>.lp-detail:last-child,.lp-module>div:last-child>.lp-detail{margin-bottom:0}
.lp-nodata{font-size:13px;color:#9CA3AF;padding:2px 0 10px}
.lp-subtitle{position:relative;font-size:13px;font-weight:700;color:#1F2937;margin:22px 0 10px;padding-left:10px}
.lp-subtitle::before{content:'';position:absolute;left:0;top:2px;bottom:2px;width:3px;border-radius:2px;background:#7C3AED}
.lp-detail{display:grid;grid-template-columns:120px 1fr;gap:10px 16px;font-size:13px;margin-bottom:20px;align-content:start}
.lp-detail .dl{color:#6B7280;text-align:right}
.lp-detail .dv{color:#1F2937}
.lp-detail.lp-flow-row>.dv{padding-right:20px}
.lp-card{border:1px solid #E5E7EB;border-radius:14px;overflow:hidden;margin-bottom:24px}
.lp-card:last-child{margin-bottom:0}
.lp-card-head{padding:14px 20px;background:#FAFAFA;border-bottom:1px solid #E5E7EB;display:flex;justify-content:space-between;align-items:center;gap:16px}
.lp-card-head .main{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:14px;font-weight:600;color:#1F2937;flex-shrink:0}
.lp-card-head .side{font-size:13px;color:#6B7280;text-align:right;min-width:0}
.lp-card-part{padding:16px 20px;border-bottom:1px solid #F3F4F6}
.lp-card-part:last-child{border-bottom:none}
.lp-card-label{font-size:12px;color:#9CA3AF;margin-bottom:12px}
:focus-visible{outline:none;box-shadow:inset 0 0 0 2px rgba(124,58,237,.4)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const TAG_COLORS = {
  on:{bg:'#F0FDF4',color:'#16A34A'}, sale:{bg:'#EFF6FF',color:'#2563EB'},
  pending:{bg:'#FFFBEB',color:'#D97706'}, off:{bg:'#F3F4F6',color:'#6B7280'},
  req:{bg:'#FEF2F2',color:'#DC2626'}, warn:{bg:'#FFF1F2',color:'#E11D48'},
};
function StatusTag({ variant, children }) {
  const c = TAG_COLORS[variant] || TAG_COLORS.off;
  return <Tag bordered={false} style={{ background:c.bg, color:c.color, borderRadius:999,
    padding:'2px 8px', fontSize:12, lineHeight:'18px', marginInlineEnd:4 }}>{children}</Tag>;
}
function TipText({ label, tip }) {

function CompactPagination({ total, current=1, pageSize=10 }) {
  const tp = Math.ceil(total / pageSize) || 1;
  const pages = [{ k:'prev', label:'<', disabled:current===1, arrow:true }];
  if (tp <= 6) { for (let i=1;i<=tp;i++) pages.push({ k:i, label:i }); }
  else { pages.push({k:1,label:1},{k:2,label:2},{k:3,label:3},{k:'gap',label:'…',disabled:true},{k:tp,label:tp}); }
  pages.push({ k:'next', label:'>', disabled:current===tp, arrow:true });
  return <div className="lp-pagination">
    <span>共 {total.toLocaleString()} 条，每页{' '}
      <Select size="small" value={pageSize} style={{ width:72, marginInline:4 }}
        options={[{value:10,label:10},{value:20,label:20},{value:50,label:50}]} />{' '}条</span>
    <div className="divider" />
    <Space size={2}>{pages.map(p => <span key={p.k} style={{
      minWidth:32, height:32, display:'inline-flex', alignItems:'center', justifyContent:'center',
      borderRadius:8, fontSize:13, cursor:p.disabled?'default':'pointer',
      background:p.k===current?'#7C3AED':(p.arrow?'#fff':'transparent'),
      color:p.k===current?'#fff':'#374151', border:p.arrow?'1px solid #E5E7EB':'none',
      fontWeight:p.k===current?600:400, opacity:p.disabled?0.35:1 }}>{p.label}</span>)}</Space>
    <div className="divider" /><span>第 {current}/{tp} 页</span></div>;
}

function DetailGrid({ rows, cols, labelWidth, flow, groups }) {
  const list = (rows || []).filter(Boolean);
  const n = groups ? groups.length : (cols || 1);
  const lw = (labelWidth || (n === 1 ? 132 : 104)) + 'px 1fr';
  const cell = (x, i) => <React.Fragment key={x.rk || i}>
    <div className="dl">{x.k}</div><div className="dv">{x.v}</div></React.Fragment>;
  if (!groups && n === 1) return <div className="lp-detail" style={{ gridTemplateColumns:lw }}>{list.map(cell)}</div>;
  if (!groups && flow === 'row') return <div className="lp-detail lp-flow-row"
    style={{ gridTemplateColumns:(labelWidth||104)+'px 1fr '+((labelWidth||104)+'px 1fr ').repeat(n-1) }}>
    {list.map(cell)}</div>;
  let cg;
  if (groups) { cg = groups.map(g => (g || []).filter(Boolean)); }
  else { const per = Math.ceil(list.length / n); cg = []; for (let i=0;i<n;i++) cg.push(list.slice(i*per,(i+1)*per)); }
  return <div style={{ display:'grid', gridTemplateColumns:'repeat('+n+',1fr)', gap:0 }}>
    {cg.map((g, gi) => <div className="lp-detail" key={'g'+gi}
      style={{ gridTemplateColumns:lw, paddingRight: gi < n-1 ? 20 : 0 }}>{g.map(cell)}</div>)}</div>;
}

/* ============ 对账与差错 ============ */
/* ⚠️ 出款场景没有「结算状态」，只有「对账状态」——这一点与订单支付（收款）不同：
   收款：买家付钱 → 渠道代收 → 渠道 T+N 结算给商户，「结算」是真实的资金动作，所以订单对账页有结算状态；
   出款：钱从 looply 自己的摩根账户直接出去，不存在「渠道结算给我们」这一步，摩根给的是账户账单而非结算。
   若强行保留，它会与对账状态说同一件事（摩根账单里有没有这笔），恒等冗余。 */
const RECON_RESULT = { unreconciled:{label:'未对账',variant:'pending'}, reconciled:{label:'已对账',variant:'on'},
                       diff:{label:'有差异',variant:'req'} };
/* date = 打款日期，即创建打款单的日期（我方数据）；渠道单边账我方无此笔，故为空。
   对账两侧都要有数：ourAmount/ourFee 来自 payout_transaction，channelAmount/channelFee 来自摩根结算数据。
   isOrphan = 渠道单边账：摩根账单有这笔出款、我方无对应流水。
   ⚠️ 「孤儿打款」不是行业术语（订单支付侧的「孤儿扣款」是自造词），中文支付对账的标准说法是
   长款 / 短款 / 单边账，此处用「渠道单边账」。 */
const SETTLEMENTS = [
  { id:'S001', date:'2026-09-01', channel:'jpmorgan', payoutNo:'PO2026090106', txnNo:'PT2026090106B', channelTxnId:'JPM-PW-9b02f899',
    ourAmount:4600.00, channelAmount:4600.00, ourFee:1.70, channelFee:1.70, reconStatus:'reconciled', reconciledAt:'2026-09-02 02:15', isOrphan:false },
  { id:'S002', date:'', channel:'jpmorgan', payoutNo:'', txnNo:'', channelTxnId:'JPM-ZL-7d11a002',
    ourAmount:null, channelAmount:2100.00, ourFee:null, channelFee:0.85, reconStatus:'diff', reconciledAt:'2026-09-02 02:15', isOrphan:true },
  { id:'S003', date:'2026-09-01', channel:'jpmorgan', payoutNo:'PO2026083101', txnNo:'PT2026083101A', channelTxnId:'JPM-ZL-5e88c410',
    ourAmount:1850.00, channelAmount:1855.00, ourFee:0.85, channelFee:0.85, reconStatus:'diff', reconciledAt:'2026-09-02 02:15', isOrphan:false },
  { id:'S004', date:'2026-08-31', channel:'jpmorgan', payoutNo:'PO2026083102', txnNo:'PT2026083102A', channelTxnId:'JPM-RTP-2f90d115',
    ourAmount:7300.00, channelAmount:7300.00, ourFee:2.40, channelFee:2.40, reconStatus:'reconciled', reconciledAt:'2026-09-01 02:15', isOrphan:false },
  { id:'S005', date:'2026-08-31', channel:'jpmorgan', payoutNo:'PO2026083103', txnNo:'PT2026083103A', channelTxnId:'JPM-PW-4a22b708',
    ourAmount:980.00, channelAmount:980.00, ourFee:0.40, channelFee:0.55, reconStatus:'diff', reconciledAt:'2026-09-01 02:15', isOrphan:false },
  { id:'S006', date:'2026-09-02', channel:'jpmorgan', payoutNo:'PO2026090201', txnNo:'PT2026090201A', channelTxnId:'JPM-ZL-8f21c904',
    ourAmount:1850.00, channelAmount:null, ourFee:null, channelFee:null, reconStatus:'unreconciled', reconciledAt:'', isOrphan:false },
];
/* 两侧数值比对：不一致标红。null（我方无此笔）不参与比对，显示 — */
function CmpCell({ mine, theirs, isMine }) {
  const v = isMine ? mine : theirs;
  if (v == null) return <span style={{ color:'#9CA3AF' }}>—</span>;
  const diff = mine != null && theirs != null && mine !== theirs;
  return <span style={diff ? { color:'#DC2626', fontWeight:600 } : null}>{money(v)}</span>;
}

/* ============ 共享弹窗（列表页与详情页共用同一实现，A.19） ============ */
function ResendModal({ open, onClose, row }) {
  if (!row) return null;
  const txns = TXN_MAP[row.no] || [];
  const last = txns[txns.length - 1];
  const fr = last && last.failureReason ? FAIL_REASON[last.failureReason] : null;
  const insufficient = last && last.failureReason === 'insufficient_balance';
  return <Modal title="重发打款" open={open} onCancel={onClose} closable={false} maskClosable={false}
    centered={true} width={560} footer={[
      <Button key="c" onClick={onClose}>取消</Button>,
      <Button key="s" type="primary" danger onClick={onClose}>确认重发</Button>,
    ]}>
    <Alert type="warning" showIcon style={{ marginBottom:16 }}
      message="重发即再次向摩根发起打款，到账后不可撤销" />
    <DetailGrid labelWidth={MODAL_LABEL_W} rows={[
      { rk:'no',  k:'打款单号',   v:<span className="lp-code">{row.no}</span> },
      { rk:'pe',  k:'收款人',     v:row.payeeName },
      { rk:'ma',  k:'收款账号',   v:<span className="lp-code">{row.masked}</span> },
      { rk:'am',  k:'打款金额',   v:money(row.amount) },
      { rk:'fr',  k:'上次失败原因', v:fr ? fr.label : '—' },

          onResend={setResendRow} onRepayee={setRepayeeRow} onViewPlain={setPlainRow} />}
        {page === 'funding' && <FundingAccountPage />}
        {page === 'recon' && <ReconciliationPage go={go} />}
        {page === 'limit' && <LimitConfigPage onEdit={r => { setLimitRow(r); setLimitOpen(true); }} />}
      </Layout.Content>
    </Layout>
    <ResendModal  key={'rs' + (resendRow  ? resendRow.no  : '')} open={!!resendRow}  row={resendRow}  onClose={() => setResendRow(null)} />
    <RepayeeModal key={'rp' + (repayeeRow ? repayeeRow.no : '')} open={!!repayeeRow} row={repayeeRow} onClose={() => setRepayeeRow(null)} />
    <ViewPlainModal open={!!plainRow} row={plainRow} onClose={() => setPlainRow(null)} />
    <LimitEditModal key={'le' + (limitRow ? limitRow.id : 'new')} open={limitOpen} row={limitRow}
      onClose={() => { setLimitOpen(false); setLimitRow(null); }} />
  </Layout>;
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <ConfigProvider theme={looplyTheme} button={{ autoInsertSpace:false }}><AntApp><App /></AntApp></ConfigProvider>);
</script>
</body>
</html>
