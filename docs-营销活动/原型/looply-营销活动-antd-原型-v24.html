<title>Looply 营销活动后台原型 v24</title>

<style>
html,body,#root{height:100%;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F9FAFB;color:#1F2937}
#root::before{content:'正在加载 antd 原型……';position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#9CA3AF;font-size:14px}
#root:not(:empty)::before{display:none}
.lp-kpi{background:linear-gradient(180deg,#FEFCFF 0%,#F3EEFF 100%);border:1px solid #DDD6FE;border-radius:14px;padding:14px 16px}
.lp-kpi .num{font-size:24px;font-weight:700;color:#7C3AED;line-height:1;margin-bottom:6px;font-variant-numeric:tabular-nums}
.lp-kpi .label{font-size:12px;color:#6B7280}
.lp-pagination{display:flex;align-items:center;justify-content:center;gap:24px;padding:12px 16px;font-size:13px;color:#6B7280}
.lp-pagination .divider{width:1px;height:20px;background:#E5E7EB}
.lp-tip-trigger{cursor:help;border-bottom:1px dashed #9CA3AF;padding-bottom:1px}
.lp-note{padding:14px;border-radius:10px;background:#F3EEFF;border:1px solid #DDD6FE;color:#6D28D9;font-size:12px;line-height:1.8}
.lp-note-sm{padding:10px 14px;background:#F3EEFF;border:1px solid #DDD6FE;border-radius:8px;font-size:12px;color:#6D28D9}
.lp-section-purple{font-size:14px;font-weight:700;color:#7C3AED;margin:0 0 12px}
.lp-section{font-size:15px;font-weight:600;color:#1F2937;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid #E5E7EB}
.lp-oplog-title{font-size:14px;font-weight:700;color:#7C3AED;margin:24px 0 12px}
.lp-empty{display:flex;flex-direction:column;align-items:center;padding:60px 20px;text-align:center}
.lp-empty .icon{font-size:48px;margin-bottom:16px;color:#9CA3AF}
.lp-empty .icon.err{color:#DC2626}
.lp-empty .title{font-size:16px;font-weight:600;color:#1F2937;margin-bottom:8px}
.lp-empty .desc{font-size:13px;color:#6B7280;margin-bottom:24px;max-width:360px}
.lp-form-row{display:flex;gap:16px;margin-bottom:12px;align-items:center}
.lp-form-row:first-of-type{margin-top:8px}
.lp-form-row .lp-form-label{width:110px;text-align:right;color:#6B7280;font-size:13px;flex-shrink:0}
.lp-form-row .lp-form-label .req{color:#DC2626;margin-right:4px}
.lp-form-row .lp-form-control{flex:1}
.lp-helper{font-size:12px;color:#9CA3AF;margin:-4px 0 12px 126px}
.lp-detail{display:grid;grid-template-columns:130px 1fr;gap:10px 16px;font-size:13px;margin-bottom:24px;align-content:start}
.lp-detail .dl{color:#6B7280}
.lp-detail .dv{color:#1F2937}
.lp-code{font-family:Menlo,Monaco,Consolas,monospace;font-size:12px;color:#374151;background:#F3F4F6;padding:1px 6px;border-radius:4px}
/* v23:指定买家邮箱清单。数量多时内部滚动,避免撑爆详情页;每行一个便于逐个核对 */
.lp-maillist{margin-top:6px;max-height:150px;overflow-y:auto;display:flex;flex-direction:column;
gap:4px;align-items:flex-start}
.lp-maillist .lp-code{word-break:break-all}
/* 只读链接展示块:刻意不用 Input,避免运营以为可以手改(链接由落地页自动生成) */
.lp-linkbox{flex:1;min-width:0;font-family:Menlo,Monaco,Consolas,monospace;font-size:12px;color:#374151;
background:#F3F4F6;border:1px solid #E5E7EB;border-radius:6px;padding:5px 10px;line-height:20px;
word-break:break-all;user-select:all}
:focus-visible{outline:none;box-shadow:inset 0 0 0 2px rgba(124,58,237,.4)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const TAG_COLORS = {

function StatusTag({ variant, children }) {
  const c = TAG_COLORS[variant] || TAG_COLORS.off;
  return <Tag bordered={false} style={{ background: c.bg, color: c.color, borderRadius: 999,
    padding: '2px 8px', fontSize: 12, lineHeight: '18px', marginInlineEnd: 4 }}>{children}</Tag>;
}
function Kpi({ num, label }) {
  return <div className="lp-kpi"><div className="label" style={{ marginBottom: 6 }}>{label}</div>
    <div className="num">{num}</div></div>;
}
function TipText({ label, tip }) {
  return <Tooltip title={<div style={{ whiteSpace: 'pre-line', lineHeight: 1.6 }}>{tip}</div>}
    color="#fff" styles={{ body: { color: '#374151', fontSize: 12, padding: '10px 14px' } }}>
    <span className="lp-tip-trigger">{label}</span></Tooltip>;
}
function CompactPagination({ total, current = 1, pageSize = 10 }) {
  const tp = Math.ceil(total / pageSize) || 1;
  const pages = [];
  pages.push({ k: 'prev', label: '<', arrow: true, disabled: current === 1 });
  for (let i = 1; i <= tp; i++) pages.push({ k: i, label: i });
  pages.push({ k: 'next', label: '>', arrow: true, disabled: current === tp });
  return <div className="lp-pagination">
    <span>共 {total.toLocaleString()} 条,每页{' '}
      <Select size="small" value={pageSize} style={{ width: 72, marginInline: 4 }}
        options={[{ value: 10, label: 10 }, { value: 20, label: 20 }, { value: 50, label: 50 }]} />{' '}条</span>
    <div className="divider" />
    <Space size={2}>{pages.map(p => <span key={p.k} style={{ minWidth: 32, height: 32, display: 'inline-flex',
      alignItems: 'center', justifyContent: 'center', borderRadius: 8, fontSize: 13,
      cursor: p.disabled ? 'default' : 'pointer', background: p.k === current ? '#7C3AED' : (p.arrow ? '#fff' : 'transparent'),
      color: p.k === current ? '#fff' : '#374151', border: p.arrow ? '1px solid #E5E7EB' : 'none',
      fontWeight: p.k === current ? 600 : 400, opacity: p.disabled ? 0.35 : 1 }}>{p.label}</span>)}</Space>
    <div className="divider" /><span>第 {current}/{tp} 页</span></div>;
}

/* v20 本期范围(2026-08-25 拍板):**只有 Collection 活动可选 Collection 落地页,其余一律首页**。
   「指定商品」「搜索结果页」两个落地页本期不做。

   其余活动落首页、根本没有目标。故「落地目标」输入框整个删除。 */
const LANDING_HOME = { value: 'home', label: '首页' };
const LANDING_COLLECTION = { value: 'collection', label: '该活动的 Collection' };
/* 市场 → 域名。V1 统一域名,国家级独立域名是 market V1.1 后续迭代 */
const MARKET_HOST = { '美国': 'https://looply.com', '香港': 'https://looply.com' };

/* v24(评审 E-8):买家邮箱解析回显。规则与「按商品 ID 导入」一致——
   换行/逗号/空格切分 → trim → 转小写 → 去重 → 格式校验 → 有效/无效分组 */
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
const EMAIL_MAX = 500;
function parseEmails(raw) {
  const parts = String(raw || '').split(/[\n,，;；\s]+/).map(x => x.trim().toLowerCase()).filter(Boolean);
  const seen = {}, valid = [], invalid = [], dup = [];
  parts.forEach(x => {
    if (seen[x]) { dup.push(x); return; }
    seen[x] = 1;
    if (EMAIL_RE.test(x)) valid.push(x); else invalid.push(x);
  });
  return { total: parts.length, valid: valid, invalid: invalid, dup: dup };
}
function EmailParseResult({ raw }) {
  const r = parseEmails(raw);
  if (!r.total) return null;
  const over = r.valid.length > EMAIL_MAX;
  return <div className="lp-helper" style={{ marginTop: -4 }}>
    识别 {r.total} 个:有效 <b>{r.valid.length}</b> 个
    {r.dup.length > 0 && <>,重复已去重 {r.dup.length} 个</>}
    {r.invalid.length > 0 && <>,<span style={{ color: '#DC2626' }}>格式不正确 {r.invalid.length} 个</span></>}
    {over && <span style={{ color: '#DC2626' }}>;超出上限 {EMAIL_MAX} 个,请拆分活动</span>}
    {r.invalid.length > 0 && <div className="lp-maillist" style={{ marginTop: 4 }}>
      {r.invalid.map(m => <span key={m} className="lp-code" style={{ color: '#DC2626' }}>{m}</span>)}</div>}
  </div>;
}

    { title: <TipText label="降幅" tip={'较原价(原「累计超阈」):到手价相对商品原价的累计降幅\n较上次(原「环比突变」):到手价相对上一次扫描的单次降幅\n超过各自阈值即触发告警'} />,
      key: 'drop', width: 160, align: 'right',
      render: (_, r) => r.type === 'sudden_drop'
        ? <div><div style={{ color: '#E11D48', fontWeight: 700 }}>较上次 -{r.changePct}%
            <span style={{ color: '#9CA3AF', fontWeight: 400, fontSize: 12 }}> /阈值{r.changeThreshold}%</span></div>
            <div style={{ fontSize: 12, color: '#6B7280', marginTop: 2 }}>较原价 -{r.drop}%</div></div>
        : <div><div style={{ color: '#DC2626', fontWeight: 700 }}>较原价 -{r.drop}%
            <span style={{ color: '#9CA3AF', fontWeight: 400, fontSize: 12 }}> /阈值{r.threshold}%</span></div></div> },
    { title: '状态', dataIndex: 'status', width: 90,
      render: v => <StatusTag variant={ALERT_STATUS[v].v}>{ALERT_STATUS[v].t}</StatusTag> },
    { title: '操作', key: 'op', width: 130, fixed: 'right', render: (_, r) => <Space size={6}>
      <Button size="small" type="primary" onClick={() => setRec(r)}>排查</Button>
      {r.status === 'pending' && <Button size="small" onClick={() => setAct({ type: 'ignore', rec: r })}>忽略</Button>}
    </Space> },
  ];
  return <Card style={CARD_STYLE}>
    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 16, marginBottom: 18 }}>
      <div><div style={{ fontSize: 20, fontWeight: 700, marginBottom: 6 }}>价格监控</div>
        <div style={{ color: '#6B7280', fontSize: 13 }}>到手价双阈值监控(比原价降太多 + 比上次降太多)——发现 → 排查 → 处置,资损事中防线</div></div>
      <Space><Button icon={<SettingOutlined />} onClick={() => setSettingsOpen(true)}>监控设置</Button>
        <Button icon={<DownloadOutlined />}>导出</Button></Space></div>
    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4,1fr)', gap: 12, marginBottom: 18 }}>
      <Kpi num={3} label="今日新增告警" /><Kpi num={3} label="待处理" />
      <Kpi num={2} label="本周已处置" /><Kpi num={2} label="监控中活动" /></div>
    <Space size={12} wrap style={{ marginBottom: 16 }}>
      <Select defaultValue="" style={{ width: 120 }} options={[
        { value: '', label: '全部类型' }, { value: 'cumulative', label: '比原价降太多' },
        { value: 'sudden_drop', label: '比上次降太多' }]} />
      <Select defaultValue="" style={{ width: 130 }} options={[
        { value: '', label: '全部状态' }, { value: 'pending', label: '待处理' },
        { value: 'resolved', label: '已处理' }, { value: 'ignored', label: '已忽略' }]} />
      <Select defaultValue="" style={{ width: 130 }} options={[
        { value: '', label: '全部成因' }, { value: 'discount', label: '折扣配置' },
        { value: 'listing_price', label: '挂牌价下调' }, { value: 'both', label: '两者叠加' }]} />
      <Select defaultValue="" style={{ width: 200 }} options={[
        { value: '', label: '全部活动' }, { value: 'a', label: '夏季大促 · 箱包 8 折' },
        { value: 'b', label: '618 返场 · 全场 95 折' }]} />
      <Select defaultValue="" style={{ width: 120 }} options={[
        { value: '', label: '全部市场' }, { value: 'US', label: '美国' }, { value: 'HK', label: '香港' }]} />
      <Select defaultValue="" style={{ width: 140 }} options={[
        { value: '', label: '全部降幅' }, { value: '50', label: '50%~60%' }, { value: '60', label: '>60%' }]} />
      <DatePicker.RangePicker placeholder={['开始日期', '结束日期']} />
      <Button type="primary" icon={<SearchOutlined />}>查询</Button>
      <Button icon={<ReloadOutlined />}>重置</Button></Space>
    {mode === 'data' && <><Table rowKey="id" columns={columns} dataSource={ALERTS} pagination={false}
      styles={TABLE_STYLES} scroll={{ x: 'max-content' }} />
      <CompactPagination total={ALERTS.length} pageSize={10} /></>}
    {mode === 'zero' && <div className="lp-empty"><InboxOutlined className="icon" />
      <div className="title">暂无告警</div>
      <div className="desc">监控运行中,进行中活动命中的在售商品到手价降幅未超过阈值</div></div>}
    {mode === 'no-match' && <EmptyNoMatch onClear={() => setMode('data')} />}
    {mode === 'error' && <EmptyError onRetry={() => setMode('data')} />}
    <EmptyStateSwitcher mode={mode} setMode={setMode} />
    <AlertDrawer rec={rec} onClose={() => setRec(null)} />
    <AlertActionModal payload={act} onClose={() => setAct(null)} />
    <MonitorSettingsModal open={settingsOpen} onClose={() => setSettingsOpen(false)} />
  </Card>;
}

/* ===== 列表页 ===== */
function PromotionListPage({ go }) {
  const [mode, setMode] = useState('data');
  const [endRec, setEndRec] = useState(null);
  const [delRec, setDelRec] = useState(null);
  const [confirm, setConfirm] = useState(null);   // A6:暂停/恢复/发布/复制 的二次确认
  const [shareRec, setShareRec] = useState(null); // 优惠码链接弹窗(与详情页共用 ShareLinkModal)
  /* v19:前两项改为按 DISCOUNTS 实时统计,原为硬编码、增删示例数据后会与列表条数对不上。
     后两项依赖核销流水与当前日期,原型阶段维持示例值 */
  const kpis = [
    { num: DISCOUNTS.filter(d => d.status === 'active').length, label: '进行中活动' },
    { num: DISCOUNTS.filter(d => d.status === 'draft').length, label: '草稿' },
    { num: '3,719', label: '本月累计核销次数' }, { num: 1, label: '7 天内即将结束' },
  ];
  const filters = [
    <Input key="kw" placeholder="搜索活动名称 / ID / 优惠码" prefix={<SearchOutlined style={{ color: '#9CA3AF' }} />}
      allowClear style={{ width: 260 }} />,
    <Select key="st" defaultValue="" style={{ width: 130 }} options={[
      { value: '', label: '全部状态' }, { value: 'draft', label: '草稿' },
      { value: 'scheduled', label: '未开始' }, { value: 'active', label: '进行中' },
      { value: 'paused', label: '已暂停' }, { value: 'ended', label: '已结束' }]} />,
    <Select key="tg" defaultValue="" style={{ width: 140 }} options={[
      { value: '', label: '全部触发方式' }, { value: 'auto', label: '自动折扣' }, { value: 'code', label: '优惠码' }]} />,
    <DatePicker.RangePicker key="dt" placeholder={['起始日', '结束日']} />,
    <Button key="q" type="primary" icon={<SearchOutlined />}>查询</Button>,
    <Button key="r" icon={<ReloadOutlined />}>重置</Button>,
  ];
  const columns = [
    { title: '活动名称', dataIndex: 'name', width: 220,
      render: (v, r) => <div><div style={{ fontWeight: 600 }}>{v}</div>
        <div style={{ fontSize: 12, color: '#9CA3AF', marginTop: 2 }}><span className="lp-code">{r.id}</span></div></div> },
    { title: '触发方式', dataIndex: 'trigger', width: 130,
      render: (v, r) => v === 'code'
        ? <div><StatusTag variant="sale">优惠码</StatusTag><div style={{ fontSize: 12, marginTop: 2 }}><span className="lp-code">{r.code}</span></div></div>
        : <StatusTag variant="off">自动折扣</StatusTag> },
    { title: '折扣内容', dataIndex: 'valueText', width: 150,
      render: (v, r) => <div>{v}{r.cap !== '—' && <div style={{ fontSize: 12, color: '#D97706', marginTop: 2 }}>{r.cap}</div>}</div> },
    { title: '适用商品', dataIndex: 'scope', width: 130 },
    { title: '市场', dataIndex: 'market', width: 84,
      render: v => <StatusTag variant="off">{v}</StatusTag> },
    { title: '状态', dataIndex: 'status', width: 100,
      render: v => v === 'paused'
        ? <TipText label={<StatusTag variant="pending">已暂停</StatusTag>} tip={PAUSED_TIP} />
        : <StatusTag variant={STATUS_MAP[v].variant}>{STATUS_MAP[v].label}</StatusTag> },
    { title: <TipText label="已核销" tip={'该折扣有效核销次数(整单退款回滚后自动核减;部分退款不回滚)'} />, dataIndex: 'used', width: 90,
      align: 'right', render: v => v.toLocaleString() },
    { title: '生效时间', dataIndex: 'start', width: 160,
      render: (v, r) => <div style={{ fontSize: 12 }}><div>{v}</div><div style={{ color: '#9CA3AF' }}>至 {r.end}</div></div> },
    { title: '创建信息', key: 'created', width: 150,
      render: (_, r) => <div style={{ fontSize: 12 }}><div>{r.createdBy}</div>
        <div style={{ color: '#9CA3AF' }}>{r.createdAt}</div></div> },
    /* 操作列(规范 A.1.1):按该行自身的操作数逐行判定——
       ≤4 个 → 全部平铺;>4 个 → 前 3 个平铺、第 4 个起全部收进「更多」(可见元素恒为 4:3 按钮 + ⋯)。
       排序优先级:详情 > 编辑 > 状态主操作(发布/暂停/恢复/结束) > 复制/操作日志 > 删除 */
    { title: '操作', key: 'op', width: 260, fixed: 'right', render: (_, r) => {
      const ops = [{ key: 'detail', label: '详情', onClick: () => go('promo-detail', r) }];
      /* A5:进行中(active)不可直接编辑——须先暂停;ended 亦不可编辑 */
      if (r.status !== 'ended' && r.status !== 'active') ops.push({ key: 'edit', label: '编辑', onClick: () => go('promo-edit', r) });
      if (r.status === 'draft') ops.push({ key: 'start', label: '发布生效', onClick: () => setConfirm({ type: 'publish', rec: r }) });
      if (r.status === 'active') ops.push({ key: 'pause', label: '暂停', onClick: () => setConfirm({ type: 'pause', rec: r }) });
      if (r.status === 'paused') ops.push({ key: 'resume', label: '恢复上线', onClick: () => setConfirm({ type: 'resume', rec: r }) });
      if (r.status === 'scheduled' || r.status === 'active' || r.status === 'paused')
        ops.push({ key: 'end', label: '结束活动', onClick: () => setEndRec(r) });
      /* 优惠码链接:仅优惠码触发的活动;草稿未发布、码尚未生效,投出去必然失效,故不提供 */
      if (r.trigger === 'code' && r.status !== 'draft')
        ops.push({ key: 'share', label: '优惠码链接', onClick: () => setShareRec(r) });
      /* A7:列表不再提供「操作日志」入口(详情页/编辑页仍有操作记录区) */
      ops.push({ key: 'copy', label: '复制', onClick: () => setConfirm({ type: 'copy', rec: r }) });
      /* A4:删除仅草稿可用——已结束活动挂着核销记录,不可删除 */
      if (r.status === 'draft')
        ops.push({ key: 'del', label: '删除', danger: true, onClick: () => setDelRec(r) });
      const flat = ops.length <= 4 ? ops : ops.slice(0, 3);
      const more = ops.length <= 4 ? [] : ops.slice(3);
      const moreItems = [];
      more.forEach(o => {
        if (o.danger && moreItems.length) moreItems.push({ type: 'divider' });
        moreItems.push({ key: o.key, label: o.label, danger: o.danger });
      });
      return <Space size={6}>
        {flat.map(o => <Button key={o.key} size="small" danger={o.danger}
          onClick={o.onClick || noop}>{o.label}</Button>)}
        {more.length > 0 && <Dropdown trigger={['click']} menu={{ items: moreItems,
          onClick: ({ key }) => { const o = more.find(x => x.key === key); if (o && o.onClick) o.onClick(); } }}>
          <Button size="small" icon={<EllipsisOutlined />} /></Dropdown>}</Space>;
    } },
  ];
  return <Card style={CARD_STYLE}>
    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 16, marginBottom: 18 }}>
      <div><div style={{ fontSize: 20, fontWeight: 700, marginBottom: 6 }}>促销活动</div>
        <div style={{ color: '#6B7280', fontSize: 13 }}>Amount off products —— 一个活动属于一个市场(A6);按商品/品类/品牌减价,支持自动折扣与优惠码</div></div>
      <Space><Button icon={<DownloadOutlined />}>导出</Button>
        <Button type="primary" icon={<PlusOutlined />} onClick={() => go('promo-create')}>新建折扣</Button></Space></div>
    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4,1fr)', gap: 12, marginBottom: 18 }}>
      {kpis.map((k, i) => <Kpi key={i} num={k.num} label={k.label} />)}</div>
    <Space size={12} wrap style={{ marginBottom: 16 }}>{filters}</Space>
    {mode === 'data' && <><Table rowKey="id" columns={columns} dataSource={DISCOUNTS} pagination={false}
      styles={TABLE_STYLES} scroll={{ x: 'max-content' }} />
      <CompactPagination total={DISCOUNTS.length} pageSize={10} /></>}
    {mode === 'zero' && <EmptyZero onCta={() => go('promo-create')} />}
    {mode === 'no-match' && <EmptyNoMatch onClear={() => setMode('data')} />}
    {mode === 'error' && <EmptyError onRetry={() => setMode('data')} />}
    <EmptyStateSwitcher mode={mode} setMode={setMode} />
    <EndPromotionModal open={!!endRec} onClose={() => setEndRec(null)} record={endRec} />
    <DeletePromotionModal open={!!delRec} onClose={() => setDelRec(null)} record={delRec} />
    <ActionConfirmModal payload={confirm} onClose={() => setConfirm(null)} />
    {/* A.19:与详情页共用同一组件;key 强制重挂,换活动时重置弹窗内部状态 */}
    {shareRec && <ShareLinkModal key={shareRec.id} open={!!shareRec}
      record={shareRec} onClose={() => setShareRec(null)} />}
  </Card>;
}

      <h4 className="lp-section">使用条件</h4>
      <div className="lp-note-sm" style={{ marginBottom: 12, marginLeft: 126 }}>
        满额 / 满件是<strong>门槛</strong>,不是减免方式：达标后命中的<strong>每件</strong>商品各按折扣值减免。
        「整单只减一次」属订单级折扣,本期不做。
      </div>
      <FormRow label="使用门槛" required>
        <Radio.Group value={minType} onChange={e => setMinType(e.target.value)} options={[
          { value: 'none', label: '无门槛' }, { value: 'amount', label: '满额可用' },
          { value: 'quantity', label: '满件可用' }]} /></FormRow>
      {minType === 'quantity' && <FormRow label="满件数量" required helper="全部市场统一件数门槛;**最小 2 件**——满 1 件等同无门槛,不符合业务预期;达标后命中的每件商品各减,非整单减一次">
        <InputNumber min={2} step={1} addonAfter="件" placeholder="如 2" style={{ width: 200 }} /></FormRow>}
      {minType === 'amount' && <FormRow label="满额门槛" required helper={'按所属市场币种(' + mkt.cur + ');达标后命中的每件商品各减,非整单减一次'}>
        <InputNumber prefix={mkt.sym} min={0} placeholder="0.00" style={{ width: 200 }} /></FormRow>}
      <Divider style={{ margin: '4px 0 16px' }} dashed />
      <FormRow label="总使用次数" helper="所有买家累计可核销次数,达上限自动停止。留空=不限(资损防控)">
        <InputNumber min={1} step={1} addonAfter="次" placeholder="不限" style={{ width: 200 }} /></FormRow>
      <FormRow label="每人使用次数" helper="单个买家可核销次数,防多账号薅羊毛。留空=不限(资损防控)">
        <InputNumber min={1} step={1} addonAfter="次/人" placeholder="不限" style={{ width: 200 }}
          defaultValue={1} /></FormRow>
    </div>

    {/* 生效时间 */}
    <div style={{ marginBottom: 24 }}>
      <h4 className="lp-section">生效时间</h4>
      <FormRow label="起止时间" required helper="按所属市场本地时区判定生效/失效">
        <DatePicker.RangePicker showTime placeholder={['开始时间', '结束时间']} style={{ width: 380 }} /></FormRow>
    </div>

    {/* 适用用户(v22:全部 / 指定用户标签 / 指定买家——三选一互斥,不可组合) */}
    <div style={{ marginBottom: 24 }}>
      <h4 className="lp-section">适用用户</h4>
      <FormRow label="适用用户" required helper={'限定哪些用户可享本折扣(自动折扣与优惠码均受约束);标签由用户管理模块维护(含"新客"等),营销侧仅引用不定义'}>
        <Radio.Group value={eligType} onChange={e => setEligType(e.target.value)} options={[
          { value: 'all', label: '全部用户(默认)' }, { value: 'tag', label: '指定用户标签' },
          { value: 'email', label: '指定买家' }]} /></FormRow>
      {eligType === 'tag' && <FormRow label="用户标签" required helper="引用用户管理模块已有标签,可多选(命中任一标签即适用);标签的定义与打标规则由用户管理模块负责">
        <Select mode="multiple" placeholder="选择用户标签" value={eligTags} onChange={setEligTags}
          style={{ width: '100%', maxWidth: 560 }} options={USER_TAGS} /></FormRow>}
      {/* v22:按邮箱指定专属买家。存邮箱不存账号ID——未注册邮箱也能先配,
          且与 checkout 未登录场景的邮箱识别口径统一(PRD v2.4 §2.13.5) */}
      {eligType === 'email' && <><FormRow label="买家邮箱" required
        helper={'一行一个,也支持用逗号分隔;不区分大小写。未注册的邮箱也可以填——买家用该邮箱结算时即可享受,无需先注册'}>
        <Input.TextArea rows={4} value={eligEmails} onChange={e => setEligEmails(e.target.value)}
          placeholder={'vip.buyer@example.com\nlong.term@example.com'}
          style={{ width: '100%', maxWidth: 560 }} /></FormRow>
        {/* v24(评审 E-8):比照同页「按商品 ID 导入」的解析回显——切分去重、逐条校验、
            有效/无效分组、无效逐条给原因。此前是个裸 TextArea,运营从 Excel 粘一列进来,
            拼错域名的邮箱会被静默存下,该买家永远享受不到,详情页也看不出来 */}
        <EmailParseResult raw={eligEmails} /></>}
    </div>

    {/* 操作栏紧跟它作用的表单,不被只读的操作记录隔开 */}
    <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 12, padding: '16px 0',
      borderTop: '1px solid #E5E7EB', marginTop: 8 }}>
      <Button onClick={() => go('promo-list')}>取消</Button>
      {!isEdit && <Button>存为草稿</Button>}
      <Button type="primary" onClick={() => setPrecheckOpen(true)}>{isEdit ? '保存' : '保存并发布'}</Button></div>

    {isEdit && <OpLog />}
    <PriceCheckModal open={precheckOpen} onClose={() => setPrecheckOpen(false)}
      onConfirm={() => { setPrecheckOpen(false); go('promo-list'); }} />
  </Card>;
}

/* ===== 详情页 ===== */
function PromotionDetailPage({ go, record }) {
  const r = record || DISCOUNTS[0];
  const [endOpen, setEndOpen] = useState(false);
  const [delOpen, setDelOpen] = useState(false);
  const [shareOpen, setShareOpen] = useState(false); // 优惠码链接(与列表页共用 ShareLinkModal)
  const redemptionCols = [
    { title: '核销时间', dataIndex: 'at', width: 160 },
    { title: '用户', dataIndex: 'user', width: 120, render: v => <span className="lp-code">{v}</span> },
    { title: '订单号', dataIndex: 'order', width: 190, render: v => <span className="lp-code">{v}</span> },
    { title: '优惠金额', dataIndex: 'amount', width: 110, align: 'right',
      render: (v, row) => <span style={{ color: row.state === 'reverted' ? '#9CA3AF' : '#DC2626',
        textDecoration: row.state === 'reverted' ? 'line-through' : 'none' }}>{v}</span> },
    { title: <TipText label="状态" tip={'整单退款后核销自动回滚(次数-1、限次释放);部分退款不回滚不重算(D3 口径)'} />,
      dataIndex: 'state', width: 100,
      render: v => v === 'valid' ? <StatusTag variant="on">有效</StatusTag> : <StatusTag variant="off">已回滚</StatusTag> },
  ];
  const basicTab = <div>
    <div className="lp-detail">
      <span className="dl">活动 ID</span><span className="dv"><span className="lp-code">{r.id}</span></span>
      <span className="dl">活动名称</span><span className="dv">{r.name}</span>
      <span className="dl">触发方式</span><span className="dv">{r.trigger === 'code'
        ? <>优惠码 <span className="lp-code">{r.code}</span></> : '自动折扣'}</span>
      {/* 草稿不展示——码未生效,链接放出来会被误投 */}
      {r.trigger === 'code' && r.status !== 'draft' && <><span className="dl">优惠码链接</span>
        <span className="dv" style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
          <span className="lp-code">
            {(MARKET_HOST[r.market] || 'https://looply.com') + '/discount/' + r.code}</span>
          <Button size="small" icon={<CopyOutlined />}>复制</Button>
          {/* v24(评审 F-4):此处是不带落地页参数的基础链接,与弹窗生成的可能不同,需标明避免运营复制错 */}
          <span style={{ fontSize: 12, color: '#9CA3AF' }}>基础链接(不含落地页参数)</span></span></>}
      <span className="dl">状态</span><span className="dv"><StatusTag variant={STATUS_MAP[r.status].variant}>{STATUS_MAP[r.status].label}</StatusTag></span>
      <span className="dl">折扣类型</span><span className="dv">{r.valueType === 'percentage' ? '按百分比' : '固定金额'}</span>
      <span className="dl">折扣内容</span><span className="dv">{r.valueText}</span>
      {/* v24(评审 A-3):PRD §2.2.4 承诺"当时的门槛/折扣值/封顶都要能查到",此前详情页无门槛与总量,
          而进行中活动不可编辑,运营在后台任何页面都查不到门槛配的是多少 */}
      <span className="dl">使用门槛</span><span className="dv">{r.minText || '无门槛'}</span>
      <span className="dl">总使用次数</span><span className="dv">{r.totalLimit || '不限'}</span>
      <span className="dl">最大优惠封顶</span><span className="dv" style={{ color: r.cap !== '—' ? '#D97706' : '#9CA3AF' }}>{r.cap}</span>
      <span className="dl">适用用户</span><span className="dv">
        {r.eligType === 'email' && r.eligEmails
          ? <>指定买家({r.eligEmails.length} 个)
              <div className="lp-maillist">
                {r.eligEmails.map(m => <span key={m} className="lp-code">{m}</span>)}</div></>
          : (r.eligText || '全部用户')}</span>
      <span className="dl">适用商品</span><span className="dv">{r.scope}</span>
      <span className="dl">所属市场</span><span className="dv"><StatusTag variant="off">{r.market}</StatusTag></span>
      <span className="dl">每人限用</span><span className="dv">{r.perUser}</span>
      <span className="dl">已核销次数</span><span className="dv">{r.used.toLocaleString()} 次</span>
      <span className="dl">生效时间</span><span className="dv">{r.start} 至 {r.end}</span>
      <span className="dl">创建信息</span><span className="dv">{r.createdBy} · {r.createdAt}</span>
    </div>
    <OpLog />
  </div>;
  const redemptionTab = <div>
    <div style={{ display: 'flex', gap: 12, marginBottom: 16 }}>
      <Kpi num={r.used.toLocaleString()} label="累计有效核销" />
      <Kpi num="1" label="已回滚(退款)" />
      <Kpi num="$1,247.50" label="累计优惠金额(数据来自订单)" />
    </div>
    <Space size={8} wrap style={{ marginBottom: 12 }}>
      <Select size="small" defaultValue="" style={{ width: 130 }} options={[
        { value: '', label: '全部状态' }, { value: 'valid', label: '有效' }, { value: 'reverted', label: '已回滚' }]} />
      <DatePicker.RangePicker size="small" placeholder={['开始日期', '结束日期']} />
      <Button size="small" icon={<SearchOutlined />}>查询</Button>
      <Button size="small" icon={<DownloadOutlined />}>导出</Button></Space>
    <Table rowKey="i" size="small" pagination={false} styles={TABLE_STYLES}
      columns={redemptionCols} dataSource={REDEMPTIONS} />
    <CompactPagination total={REDEMPTIONS.length} pageSize={10} />
    <div className="lp-note-sm" style={{ marginTop: 12 }}>
      核销层仅计数;分摊金额由营销计算、随订单落 order_discount。整单退款触发核销回滚(次数-1、限次释放),部分退款不回滚不重算。</div>
  </div>;
  return <Card style={CARD_STYLE}>
    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 16, marginBottom: 18 }}>
      <div><Breadcrumb items={[{ title: <a onClick={() => go('promo-list')}>促销活动</a> }, { title: '活动详情' }]}
        style={{ marginBottom: 8 }} />
        <div style={{ fontSize: 20, fontWeight: 700 }}>{r.name}</div>
        <div style={{ color: '#6B7280', fontSize: 13, marginTop: 4 }}>
          <span className="lp-code">{r.id}</span> · Amount off products</div></div>
      <Space>
        {r.trigger === 'code' && r.status !== 'draft' &&
          <Button onClick={() => setShareOpen(true)}>优惠码链接</Button>}
        {r.status !== 'ended' && r.status !== 'active' && <Button onClick={() => go('promo-edit', r)}>编辑</Button>}
        {(r.status === 'active' || r.status === 'paused') && <Button danger onClick={() => setEndOpen(true)}>结束活动</Button>}
        {r.status === 'draft' && <Button danger onClick={() => setDelOpen(true)}>删除</Button>}
        <Button onClick={() => go('promo-list')}>返回列表</Button></Space></div>
    <Tabs defaultActiveKey="basic" items={[
      { key: 'basic', label: '基本信息', children: basicTab },
      { key: 'redemption', label: '核销记录', children: redemptionTab }]} />
    <EndPromotionModal open={endOpen} onClose={() => setEndOpen(false)} record={r} />
    <DeletePromotionModal open={delOpen} onClose={() => setDelOpen(false)} record={r} />
    {/* A.19:与列表页共用同一组件 */}
    {shareOpen && <ShareLinkModal key={r.id} open={shareOpen}
      record={r} onClose={() => setShareOpen(false)} />}
  </Card>;
}

/* ===== App ===== */
/* v15 新增:促销打标设置(PRD v2.2 §2.11.6)。
   刻意不并入价格监控的「监控设置」弹窗——价格监控是「发现异常降价并告警给运营」,
   促销打标是「标记降价商品供买家筛选」,两件事,只是恰好都以降幅为输入。 */
const SALETAG_OPLOG = [
  { i: 1, at: '2026-08-06 10:12', who: 'Lily', type: '编辑', detail: '修改字段:Sale 保持天数 14 → 30' },
  { i: 2, at: '2026-08-05 17:40', who: 'Lucy', type: '编辑', detail: '修改字段:最小降幅门槛 3% → 5%' },
  { i: 3, at: '2026-08-05 09:05', who: 'Lily', type: '创建', detail: '初始化促销打标参数' },
];
function SaleTagSettingsPage() {
  return <Card style={CARD_STYLE}>
    <div className="lp-section">判定参数</div>
    <FormRow label="最小降幅门槛" required helper="挂牌价降幅低于该值不打 Sale 标签;取值 1-50">
      <InputNumber min={1} max={50} defaultValue={5} addonAfter="%" style={{ width: 180 }} /></FormRow>
    <FormRow label="Sale 保持天数" required helper={'挂牌价下调后 Sale 标签保留的天数;期间再次降价则重新计时。取值 1-180'}>
      <InputNumber min={1} max={180} defaultValue={30} addonAfter="天" style={{ width: 180 }} /></FormRow>
    <FormRow label="生效范围">
      <Input value="全部市场;按市场/品类分别配置 V2" disabled /></FormRow>
    <FormRow label="生效时点">
      <Input value="保存后于下一轮判定生效,不追溯已打标商品" disabled /></FormRow>
    {/* 操作栏紧跟它作用的表单,不被只读的操作记录隔开 */}
    <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 12, padding: '16px 0',
      borderTop: '1px solid #E5E7EB', marginTop: 8 }}>
      <Button>取消</Button>
      <Button type="primary">保存</Button></div>
    <OpLog data={SALETAG_OPLOG} />
  </Card>;
}
function App() {
  const [currentPage, setCurrentPage] = useState('promo-list');
  const [record, setRecord] = useState(null);
  const go = (key, rec) => { if (rec !== undefined) setRecord(rec); setCurrentPage(key); window.scrollTo(0, 0); };
  const activeKey = currentPage.startsWith('monitor') ? 'monitor' : (currentPage === 'saletag' ? 'saletag' : 'promo');
  const subLabel = (text, key) => <span style={{ fontWeight: activeKey === key ? 600 : 400 }}>{text}</span>;
  /* 待处理告警从列表页 Alert 条改为菜单角标引导(角标为 0 时不显示)
     价格监控提为一级菜单(与「营销中心」分组平级)
     v15:营销中心分组新增二级菜单「促销打标设置」,与「促销活动」并列 */
  const pendingAlerts = ALERTS.filter(a => a.status === 'pending').length;
  const menuItems = [
    { key: 'marketing', icon: <GiftOutlined />, label: '营销中心',
      children: [
        { key: 'promo', icon: <TagsOutlined />, label: subLabel('促销活动', 'promo') },
        { key: 'saletag', icon: <PercentageOutlined />, label: subLabel('促销打标设置', 'saletag') },
      ] },
    { key: 'monitor', icon: <AlertOutlined />,
      label: <span style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', paddingRight: 4 }}>
        {subLabel('价格监控', 'monitor')}
        <Badge count={pendingAlerts} style={{ backgroundColor: '#DC2626' }} /></span> },
  ];
  const crumbMap = {
    'promo-list': '促销活动', 'promo-create': '促销活动 / 新建折扣',
    'promo-edit': '促销活动 / 编辑折扣', 'promo-detail': '促销活动 / 活动详情',
    'monitor-list': '价格监控', 'saletag': '促销打标设置',
  };
  return <ConfigProvider theme={looplyTheme}>
    <Layout style={{ height: '100vh' }}>
      <Layout.Header style={{ borderBottom: '1px solid #E5E7EB', display: 'flex', alignItems: 'center' }}>
        <img src={LOGO_SRC} alt="Looply" style={{ height: 32, display: 'block' }} />
        <div style={{ width: 1, height: 20, background: '#E5E7EB', margin: '0 16px' }} />
        <span style={{ fontSize: 14, fontWeight: 500, color: '#6B7280' }}>营销管理后台</span>
        <span style={{ marginLeft: 'auto', color: '#9CA3AF', fontSize: 13 }}>{crumbMap[currentPage]}</span>
      </Layout.Header>
      <Layout>
        <Layout.Sider width={220} theme="light" style={SIDER_STYLE}>
          <Menu mode="inline" items={menuItems} selectedKeys={[activeKey]} defaultOpenKeys={['marketing']}
            style={{ borderInlineEnd: 'none' }}
            onClick={({ key }) => go({ monitor: 'monitor-list', saletag: 'saletag' }[key] || 'promo-list')} /></Layout.Sider>
        <Layout.Content style={{ padding: 28, overflow: 'auto' }}>
          {currentPage === 'promo-list' && <PromotionListPage go={go} />}
          {currentPage === 'promo-create' && <DiscountFormPage go={go} isEdit={false} record={null} />}
          {currentPage === 'promo-edit' && <DiscountFormPage go={go} isEdit={true} record={record} />}
          {currentPage === 'promo-detail' && <PromotionDetailPage go={go} record={record} />}
          {currentPage === 'monitor-list' && <MonitorListPage go={go} />}
          {currentPage === 'saletag' && <SaleTagSettingsPage />}
        </Layout.Content>
      </Layout>
    </Layout>
  </ConfigProvider>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
