html,body,#root{height:100%;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F9FAFB;color:#1F2937}
#root::before{content:'正在加载 antd 原型……';position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#9CA3AF;font-size:14px}
#root:not(:empty)::before{display:none}
.lp-page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px}
.lp-page-title{font-size:20px;font-weight:700;color:#1F2937;margin:0 0 5px}
.lp-page-desc{font-size:13px;color:#6B7280;margin:0}
.lp-section{font-size:15px;font-weight:600;color:#1F2937;margin:0 0 16px;padding-bottom:9px;border-bottom:1px solid #E5E7EB}

.lp-form-label{width:105px;flex:0 0 105px;text-align:right;font-size:13px;color:#6B7280;line-height:34px}
.lp-form-label .req{color:#DC2626;margin-right:4px}
.lp-form-control{flex:1;min-width:0}
.lp-helper{font-size:12px;color:#9CA3AF;margin:6px 0 0;line-height:1.5}
.lp-editor-grid{display:grid;grid-template-columns:minmax(560px,1fr) 380px;gap:22px;align-items:start}
.lp-editor-main{min-width:0}
.lp-preview-side{position:sticky;top:12px;border:1px solid #E5E7EB;border-radius:12px;padding:18px;background:#fff}
.lp-content-item{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.lp-content-index{width:24px;flex:0 0 24px;text-align:center;color:#9CA3AF;font-size:12px}
.lp-action-bar{display:flex;justify-content:flex-end;gap:10px;padding:18px 0;border-top:1px solid #E5E7EB;margin-top:18px}
.lp-oplog-title{font-size:14px;font-weight:700;color:#A4002A;margin:24px 0 12px}
.lp-kpi{background:linear-gradient(180deg,#FEFCFF 0%,#FCEEEF 100%);border:1px solid #F3C7CF;border-radius:14px;padding:14px 16px}
.lp-kpi .num{font-size:24px;font-weight:700;color:#A4002A;line-height:1;margin-bottom:6px;font-variant-numeric:tabular-nums}
.lp-kpi .label{font-size:12px;color:#6B7280}
.lp-tip-trigger{cursor:help;border-bottom:1px dashed #9CA3AF;padding-bottom:1px}
.lp-preview-phone{width:100%;max-width:345px;margin:12px auto 0;background:#fff;border:1px solid #E5E7EB;border-radius:12px;overflow:hidden;min-height:195px}
.lp-preview-top{height:30px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;border-bottom:1px solid #F3F4F6}
.lp-benefit-bar{background:#111;color:#fff;min-height:30px;display:flex;align-items:center;justify-content:center;gap:0;padding:4px 11px;box-sizing:border-box;font-size:9px;line-height:1.35;overflow:hidden}
.lp-benefit-full{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.lp-benefit-sep{height:10px;width:1px;background:rgba(255,255,255,.48);margin:0 6px;flex:0 0 1px}
.lp-benefit-arrow{margin-left:5px;flex:0 0 auto}
.lp-preview-body{padding:16px;color:#9CA3AF;font-size:12px}
.lp-preview-skeleton{height:12px;border-radius:4px;background:#F3F4F6;margin:0 0 10px}
.lp-preview-skeleton.short{width:55%}.lp-preview-skeleton.med{width:78%}
.lp-empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:52px 16px}
.lp-empty .icon{font-size:40px;color:#9CA3AF;margin-bottom:13px}
.lp-empty .icon.err{color:#DC2626}
.lp-empty .title{font-size:16px;font-weight:600;margin-bottom:8px}
.lp-empty .desc{font-size:13px;color:#6B7280;margin-bottom:18px}
.lp-pagination{text-align:center;font-size:12px;color:#6B7280;padding:14px}
@media(max-width:1200px){.lp-editor-grid{grid-template-columns:1fr}.lp-preview-side{position:static}}
@media(max-width:800px){.lp-form-row{display:block}.lp-form-label{width:auto;text-align:left;line-height:1.5;margin-bottom:6px}.lp-page-head{flex-direction:column}}
:focus-visible{outline:none;box-shadow:inset 0 0 0 2px rgba(164,0,42,.4)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function EmptyState({mode,onCreate,onReset}){const cfg={zero:[<InboxOutlined className="icon"/>,'暂无利益点条','创建第一份内容后，可发布给商详、购物车和 Checkout 共用。'],match:[<SearchOutlined className="icon"/>,'未找到匹配结果','请调整搜索词或筛选条件。'],error:[<ExclamationCircleOutlined className="icon err"/>,'加载失败','请重试。']}[mode];return<div className="lp-empty">{cfg[0]}<div className="title">{cfg[1]}</div><div className="desc">{cfg[2]}</div><Button type={mode==='zero'?'primary':'default'} onClick={mode==='zero'?onCreate:onReset}>{mode==='zero'?'新增利益点条':mode==='error'?'重试':'清除筛选'}</Button></div>}

  const set=(key,value)=>setRecord(old=>({...old,[key]:value}));
  return<Card style={CARD_STYLE}><div className="lp-page-head"><div><Breadcrumb items={[{title:<a onClick={onBack}>顶部公告条</a>},{title:isNew?'新建配置':'编辑配置'}]}/><h1 className="lp-page-title" style={{marginTop:12}}>{isNew?'新建顶部公告条':'编辑顶部公告条'}</h1><p className="lp-page-desc">内容发布后，商详、购物车和 Checkout 共用同一版本。</p></div><Button onClick={onBack}>返回列表</Button></div><div className="lp-editor-grid"><div className="lp-editor-main"><h3 className="lp-section">基本信息</h3><FormRow label="配置名称" required><Input value={record.name} onChange={e=>set('name',e.target.value)} placeholder="如：美国站黑五顶部公告条" style={{maxWidth:560}}/></FormRow><FormRow label="所属市场" required><Select value={record.market} onChange={v=>set('market',v)} options={MARKET_OPTIONS} style={{width:280}}/></FormRow><FormRow label="生效时间" required helper="按所选 Market 当地时区填写；同一市场可配置多个不重叠时段，已发布时段不能重叠。"><DatePicker.RangePicker showTime format="YYYY-MM-DD HH:mm" value={record.start&&record.end?[dayjs(record.start),dayjs(record.end)]:null} onChange={v=>setRecord(old=>({...old,start:v?.[0]?.format('YYYY-MM-DD HH:mm')||null,end:v?.[1]?.format('YYYY-MM-DD HH:mm')||null}))} style={{width:420,maxWidth:'100%'}}/></FormRow><h3 className="lp-section" style={{marginTop:25}}>展示内容</h3><FormRow label="展示文案（英文）" required helper="直接输入整段前台文案，分隔符也写在文案里；移动端单行溢出显示省略号，完整内容仍在 CMS 可查。其他语言在多语言模块维护。"><Input.TextArea value={record.content} onChange={e=>set('content',e.target.value)} placeholder="如：Black Friday Deal | 30 Day Returns — 3X Money Back Guarantee" autoSize={{minRows:2,maxRows:4}} style={{maxWidth:620}}/></FormRow><h3 className="lp-section" style={{marginTop:25}}>点击后前往</h3><FormRow label={<TipText label="跳转目标" tip="可留空。留空时仍展示文案，不出现可点击箭头。"/>}><Space size={10} wrap><Select value={record.targetType} onChange={v=>setRecord(old=>({...old,targetType:v,target:''}))} options={[{value:'none',label:'不跳转'},{value:'collection',label:'选择 Collection'},{value:'url',label:'填写链接'}]} style={{width:175}}/>{record.targetType==='collection'&&<Select value={record.target||undefined} onChange={v=>set('target',v)} placeholder="选择目标" options={COLLECTIONS} style={{width:280}}/>}{record.targetType==='url'&&<Input value={record.target} onChange={e=>set('target',e.target.value)} placeholder="/campaign/black-friday 或 https://..." style={{width:360}}/>}</Space></FormRow><div className="lp-action-bar"><Button onClick={onBack}>取消</Button><Button onClick={()=>onSave(false)}>保存草稿</Button><Button type="primary" onClick={onPublish}>检查并发布</Button></div>{!isNew&&<OpLog record={record}/>}</div><PreviewPanel record={record}/></div></Card>
}
function ListPage({records,onCreate,onEdit,onPreview,onPublish,onUnpublish}){
  const[query,setQuery]=useState('');const[market,setMarket]=useState('');const[status,setStatus]=useState('');const[mode,setMode]=useState('data');
  const filtered=useMemo(()=>records.filter(r=>(!query||r.name.toLowerCase().includes(query.toLowerCase()))&&(!market||r.market===market)&&(!status||statusOf(r)===status)),[records,query,market,status]);
  const actualMode=mode==='data'?(records.length===0?'zero':filtered.length===0?'match':'data'):mode;
  const clear=()=>{setQuery('');setMarket('');setStatus('');setMode('data')};
  const columns=[{title:'配置名称',dataIndex:'name',width:220},{title:'市场',dataIndex:'market',width:150,render:v=>marketText(v)},{title:'展示文案（英文）',dataIndex:'content',render:v=><span title={v} style={{display:'block',maxWidth:360,overflow:'hidden',whiteSpace:'nowrap',textOverflow:'ellipsis'}}>{v||'—'}</span>},{title:'生效时间',width:245,render:(_,r)=><span>{r.start||'—'}<br/>至 {r.end||'—'}</span>},{title:'状态',width:100,render:(_,r)=><StatusTag value={statusOf(r)}/>},{title:'操作',width:245,render:(_,r)=><Space size={6}><Button size="small" onClick={()=>onPreview(r)}>预览</Button>{!r.disabled&&<Button size="small" onClick={()=>onEdit(r)}>编辑</Button>}{r.disabled?null:r.published?<Button size="small" danger onClick={()=>onUnpublish(r)}>停用</Button>:<Button size="small" type="primary" onClick={()=>onPublish(r)}>发布</Button>}</Space>}];
  return<Card style={CARD_STYLE}><div className="lp-page-head"><div><h1 className="lp-page-title">顶部公告条</h1><p className="lp-page-desc">管理商详、购物车和 Checkout 共用的顶部文案与跳转。</p></div><Button type="primary" icon={<PlusOutlined/>} onClick={onCreate}>新建配置</Button></div><div style={{display:'grid',gridTemplateColumns:'repeat(3,minmax(0,1fr))',gap:12,marginBottom:18,maxWidth:720}}><Kpi num={records.filter(r=>statusOf(r)==='生效中').length} label="生效中"/><Kpi num={records.filter(r=>statusOf(r)==='待生效').length} label="待生效"/><Kpi num={records.filter(r=>statusOf(r)==='草稿').length} label="草稿"/></div>{actualMode!=='zero'&&<Space size={10} wrap style={{marginBottom:16}}><Input value={query} onChange={e=>setQuery(e.target.value)} placeholder="搜索配置名称" prefix={<SearchOutlined style={{color:'#9CA3AF'}}/>} allowClear style={{width:240}}/><Select value={market} onChange={setMarket} options={[{value:'',label:'全部市场'},...MARKET_OPTIONS]} style={{width:150}}/><Select value={status} onChange={setStatus} options={[{value:'',label:'全部状态'},...['草稿','待生效','生效中','已结束','已停用'].map(x=>({value:x,label:x}))]} style={{width:140}}/><Button icon={<ReloadOutlined/>} onClick={clear}>重置</Button></Space>}{actualMode==='data'?<><Table rowKey="id" columns={columns} dataSource={filtered} pagination={false} styles={TABLE_STYLES}/><div className="lp-pagination">共 {filtered.length} 条</div></>:<EmptyState mode={actualMode} onCreate={onCreate} onReset={clear}/>}<Space size={6} style={{marginTop:14}}>{[['data','正常数据'],['zero','零数据'],['match','无匹配'],['error','网络异常']].map(([key,label])=><Button key={key} size="small" type={mode===key?'primary':'default'} onClick={()=>setMode(key)}>{label}</Button>)}</Space></Card>
}
function App(){
  const[records,setRecords]=useState(seed),[page,setPage]=useState('list'),[editing,setEditing]=useState(makeDraft()),[preview,setPreview]=useState(null),[confirm,setConfirm]=useState(null);
  const isNew=!editing.id;
  const save=(publish)=>{
    const r=editing;
    if(!r.name.trim()){antd.message.error('请填写配置名称');return false}
    if(publish&&!r.market){antd.message.error('请选择市场');return false}
    if(publish&&(!r.start||!r.end||!dayjs(r.end).isAfter(dayjs(r.start)))){antd.message.error('请设置有效的生效时间');return false}
    if(publish&&!r.content.trim()){antd.message.error('请填写展示文案');return false}
    if(publish&&r.targetType!=='none'&&!r.target.trim()){antd.message.error('请选择或填写跳转目标');return false}
    if(publish&&r.targetType==='url'&&!(/^(https:\/\/[^\s]+|\/[^\s]+)$/.test(r.target))){antd.message.error('请输入站内路径或 HTTPS 链接');return false}
    const replacingId=r.published?r.id:r.baseId;
    const base=records.find(x=>x.id===replacingId);
    const replacesBase=!!publish&&!!base&&r.start===base.start&&r.end===base.end;
    const conflict=publish?records.find(x=>x.id!==r.id&&(!replacesBase||x.id!==replacingId)&&x.published&&x.market===r.market&&dayjs(r.start).isBefore(dayjs(x.end))&&dayjs(r.end).isAfter(dayjs(x.start))):null;
    if(conflict){antd.message.error('与「'+conflict.name+'」的已发布时段重叠，请调整时间');return false}
    const newId=(r.published||!r.id)?'CMS-BAR-'+String(Date.now()).slice(-8):r.id;
    const updated={...r,id:newId,baseId:r.published?r.id:r.baseId,disabled:false,content:r.content.trim(),published:!!publish,updated:dayjs().format('YYYY-MM-DD HH:mm')};
    setRecords(old=>[updated,...old.filter(x=>x.id!==updated.id).map(x=>replacesBase&&x.id===replacingId?{...x,published:false,disabled:true}:x)]);
    setPage('list');antd.message.success(publish?'发布成功':'草稿已保存');return true;
  };
  const publishExisting=r=>setConfirm({type:'publish',record:r});
  const unpublishExisting=r=>setConfirm({type:'unpublish',record:r});
  const handleConfirm=()=>{
    const c=confirm;if(!c)return;
    if(c.type==='publish'){
      const r=c.record;
      if(!r.content.trim()||!r.start||!r.end||!dayjs(r.end).isAfter(dayjs(r.start))){antd.message.error('内容和生效时间不完整，请先编辑');setConfirm(null);return}
      if(r.targetType!=='none'&&!r.target){antd.message.error('跳转目标未填写，请先编辑');setConfirm(null);return}
      const base=records.find(x=>x.id===r.baseId);
      const replacesBase=!!base&&r.start===base.start&&r.end===base.end;
      const conflict=records.find(x=>x.id!==r.id&&(!replacesBase||x.id!==r.baseId)&&x.published&&x.market===r.market&&dayjs(r.start).isBefore(dayjs(x.end))&&dayjs(r.end).isAfter(dayjs(x.start)));
      if(conflict){antd.message.error('与「'+conflict.name+'」的已发布时段重叠，请先调整时间');setConfirm(null);return}
    }
    const base=records.find(x=>x.id===c.record.baseId);
    const replacesBase=c.type==='publish'&&!!base&&c.record.start===base.start&&c.record.end===base.end;
    setRecords(old=>old.map(x=>x.id===c.record.id?{...x,published:c.type==='publish',disabled:c.type==='unpublish',updated:dayjs().format('YYYY-MM-DD HH:mm')}:replacesBase&&x.id===c.record.baseId?{...x,published:false,disabled:true}:x));
    antd.message.success(c.type==='publish'?'发布成功':'已停用');setConfirm(null);
  };
  const activeKey='bar';const menuItems=[{key:'cms',icon:<AppstoreOutlined/>,label:'CMS 管理系统',children:[{key:'bar',icon:<FileTextOutlined/>,label:<span style={{fontWeight:600}}>顶部公告条</span>}]}];
  return<ConfigProvider theme={looplyTheme}><Layout style={{height:'100vh'}}><Layout.Header style={{borderBottom:'1px solid #E5E7EB',display:'flex',alignItems:'center'}}><img src={LOGO_SRC} alt="Looply" style={{width:118,height:'auto',display:'block'}}/><div style={{width:1,height:20,background:'#E5E7EB',margin:'0 16px'}}/><span style={{fontSize:14,fontWeight:500,color:'#6B7280'}}>CMS 管理系统</span><span style={{marginLeft:'auto',color:'#9CA3AF',fontSize:13}}>CMS 管理系统 / 顶部公告条</span></Layout.Header><Layout><Layout.Sider width={220} theme="light" style={SIDER_STYLE}><Menu mode="inline" items={menuItems} selectedKeys={[activeKey]} defaultOpenKeys={['cms']} style={{borderInlineEnd:'none'}} onClick={()=>setPage('list')}/></Layout.Sider><Layout.Content style={{padding:28,overflow:'auto'}}>{page==='list'?<ListPage records={records} onCreate={()=>{setEditing(makeDraft());setPage('edit')}} onEdit={r=>{setEditing({...r});setPage('edit')}} onPreview={setPreview} onPublish={publishExisting} onUnpublish={unpublishExisting}/>:<EditorPage record={editing} setRecord={setEditing} onBack={()=>setPage('list')} onSave={save} onPublish={()=>save(true)} isNew={isNew}/>}</Layout.Content></Layout></Layout><Modal title={confirm?.type==='publish'?'确认发布':'确认停用'} open={!!confirm} closable={false} maskClosable={false} centered onCancel={()=>setConfirm(null)} footer={[<Button key="c" onClick={()=>setConfirm(null)}>取消</Button>,<Button key="s" type="primary" danger={confirm?.type==='unpublish'} onClick={handleConfirm}>{confirm?.type==='publish'?'确认发布':'确认停用'}</Button>]}>{confirm?.type==='publish'?'发布后将在所选市场和生效时间内展示；其他语种由多语言模块维护。':'停用后，三个页面都不再展示这份内容。'}</Modal><Modal title="三页共用内容预览" open={!!preview} closable={false} maskClosable={false} centered width={470} onCancel={()=>setPreview(null)} footer={[<Button key="c" onClick={()=>setPreview(null)}>关闭</Button>]}>{preview&&<PreviewPanel record={preview}/>}</Modal></ConfigProvider>
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
