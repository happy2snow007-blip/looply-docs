<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Looply 营销中心后台原型 v6</title>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/dayjs@1.11.21/dayjs.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/antd@6.4.3/dist/antd.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/@ant-design/icons@6.2.1/dist/index.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.28.4/babel.min.js"></script>
<style>
html,body,#root{height:100%;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F9FAFB;color:#1F2937}
#root::before{content:'正在加载 antd 原型……';position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#9CA3AF;font-size:14px}
#root:not(:empty)::before{display:none}
.lp-kpi{background:linear-gradient(180deg,#FEFCFF 0%,#FCEEEF 100%);border:1px solid #F3C7CF;border-radius:14px;padding:14px 16px}
.lp-kpi .num{font-size:24px;font-weight:700;color:#A4002A;line-height:1;margin-bottom:6px;font-variant-numeric:tabular-nums}
.lp-kpi .label{font-size:12px;color:#6B7280}
.lp-pagination{display:flex;align-items:center;justify-content:center;gap:24px;padding:12px 16px;font-size:13px;color:#6B7280}
.lp-pagination .divider{width:1px;height:20px;background:#E5E7EB}
.lp-tip-trigger{cursor:help;border-bottom:1px dashed #9CA3AF;padding-bottom:1px}
.lp-note{padding:14px;border-radius:10px;background:#FCEEEF;border:1px solid #F3C7CF;color:#A4002A;font-size:12px;line-height:1.8}
.lp-note-sm{padding:10px 14px;background:#FCEEEF;border:1px solid #F3C7CF;border-radius:8px;font-size:12px;color:#A4002A}
.lp-section{font-size:15px;font-weight:600;color:#1F2937;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid #E5E7EB}
.lp-oplog-title{font-size:14px;font-weight:700;color:#A4002A;margin:24px 0 12px}
.lp-empty{display:flex;flex-direction:column;align-items:center;padding:60px 20px;text-align:center}
.lp-empty .icon{font-size:48px;margin-bottom:16px;color:#9CA3AF}
.lp-empty .icon.err{color:#DC2626}
.lp-empty .title{font-size:16px;font-weight:600;color:#1F2937;margin-bottom:8px}
.lp-empty .desc{font-size:13px;color:#6B7280;margin-bottom:24px;max-width:360px}
.lp-form-row{display:flex;gap:16px;margin-bottom:12px;align-items:center}
.lp-form-row:first-of-type{margin-top:8px}
.lp-form-row .lp-form-label{width:96px;text-align:right;color:#6B7280;font-size:13px;flex-shrink:0}
.lp-form-row .lp-form-label .req{color:#DC2626;margin-right:4px}
.lp-form-row .lp-form-control{flex:1}
.lp-helper{font-size:12px;color:#9CA3AF;margin:-4px 0 12px 112px}
.lp-module{margin-bottom:24px}
.lp-module:last-child{margin-bottom:0}
.lp-detail{display:grid;grid-template-columns:120px 1fr;gap:10px 16px;font-size:13px;margin-bottom:20px;align-content:start}
.lp-detail .dl{color:#6B7280;text-align:right}
.lp-detail .dv{color:#1F2937}
.lp-offer-detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin:12px 0 22px}
.lp-offer-detail-head h2{font-size:20px;line-height:28px;margin:0 0 5px;font-weight:600}
@media(max-width:800px){.lp-offer-detail-head{display:block}.lp-offer-detail-actions{margin-top:16px}}
.lp-code{font-family:Menlo,Monaco,Consolas,monospace;font-size:12px;color:#374151;background:#F3F4F6;padding:1px 6px;border-radius:4px}
/* v23:指定买家邮箱清单。数量多时内部滚动,避免撑爆详情页;每行一个便于逐个核对 */
.lp-maillist{margin-top:6px;max-height:150px;overflow-y:auto;display:flex;flex-direction:column;
gap:4px;align-items:flex-start}
.lp-maillist .lp-code{word-break:break-all}
/* 只读链接展示块:刻意不用 Input,避免运营以为可以手改(链接由落地页自动生成) */
.lp-linkbox{flex:1;min-width:0;font-family:Menlo,Monaco,Consolas,monospace;font-size:12px;color:#374151;
background:#F3F4F6;border:1px solid #E5E7EB;border-radius:6px;padding:5px 10px;line-height:20px;
word-break:break-all;user-select:all}
.lp-display-workspace{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,430px);gap:20px;align-items:start}
.lp-display-editor{min-width:0}
.lp-scope-grid{display:flex;flex-direction:column;gap:12px;margin:12px 0 24px}
.lp-scope-source{display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px;align-items:start;border:1px solid #E5E7EB;border-radius:8px;padding:20px 24px;min-width:0;background:#F9FAFB}
.lp-scope-source.is-active{border-color:#D1D5DB;background:#fff}
.lp-scope-source-head{display:flex;align-items:center;min-height:24px;font-weight:600}
.lp-scope-source-desc{font-size:12px;color:#6B7280;line-height:1.5;margin:8px 0 0 24px}
.lp-scope-source-body{display:flex;flex-direction:column;gap:8px;min-width:0}
.lp-scope-field-label{font-size:13px;color:#374151;font-weight:500}
.lp-scope-field-label .req{color:#DC2626;margin-right:4px}
@media(max-width:980px){.lp-scope-source{grid-template-columns:1fr;gap:12px}}
@media(max-width:700px){.lp-scope-source{padding:16px}}
.lp-display-editor .lp-display-period{border:1px solid #E5E7EB;border-radius:8px;padding:18px;margin:12px 0 16px;min-width:0;cursor:default}
.lp-display-period.is-active{border-color:#A4002A}
.lp-display-editor .lp-display-period .lp-form-control{min-width:0}
.lp-display-subtitle{font-size:13px;font-weight:600;color:#374151;margin:18px 0 12px 112px}
.lp-display-asset-note{font-size:12px;color:#6B7280;margin:-4px 0 14px 112px}
.lp-display-assets{display:grid;grid-template-columns:repeat(2,minmax(180px,1fr));gap:12px;min-width:400px;width:100%}
.lp-display-assets-wrap{max-width:100%;overflow-x:auto;padding-bottom:4px}
.lp-display-preview-panel{border:1px solid #E5E7EB;border-radius:10px;padding:18px;background:#fff;min-width:0;margin:12px 0 0;position:sticky;top:12px;max-height:calc(100vh - 96px);overflow-y:auto}
.lp-display-preview-panel .lp-preview-controls{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin:14px 0 16px}
.lp-preview-scenes{display:grid;grid-template-columns:1fr;gap:12px;align-items:start}
.lp-preview-scenes.mobile{grid-template-columns:1fr}
.lp-preview-scene{min-width:0;border:1px solid #E5E7EB;border-radius:8px;padding:14px;background:#FAFAFA}
.lp-preview-scene-title{font-size:13px;font-weight:600;color:#1F2937;margin-bottom:12px}
.lp-preview-product-card{background:#fff;border:1px solid #E5E7EB;max-width:270px}
.lp-preview-product-media{height:245px;position:relative;background:#F7F7F7;overflow:hidden}
.lp-preview-product-media img{width:100%;height:100%;object-fit:contain}
.lp-preview-card-badge{position:absolute;left:0;top:0;max-width:150px;min-height:20px;background:#fff;color:#A4002A;font-size:10px;font-weight:700;letter-spacing:.02em;padding:3px 7px;text-align:left;box-sizing:border-box}
.lp-preview-card-badge img{max-width:140px;max-height:28px;display:block;object-fit:contain}
.lp-preview-product-copy{padding:11px;font-size:11px;line-height:1.45}
.lp-preview-pdp{background:#fff;border:1px solid #E5E7EB;padding:14px;min-height:250px}
.lp-preview-scenes.mobile .lp-preview-pdp{width:390px;max-width:100%;box-sizing:border-box}
.lp-preview-pdp-heading{font-size:13px;font-weight:600;line-height:1.4;margin:5px 0 12px}
.lp-preview-campaign-belt{display:flex;align-items:stretch;justify-content:space-between;gap:12px;min-height:62px;padding:10px;background:linear-gradient(105deg,#111 5%,#21050c 54%,#A4002A 100%);color:#fff;background-size:cover;background-position:center;border:2px solid #A4002A;border-radius:5px}
.lp-preview-belt-price{font-size:11px;line-height:1.5;align-self:center;max-width:48%}
.lp-preview-belt-entry{border:0;border-left:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;padding:0 0 0 14px;text-align:right;min-width:125px;max-width:48%;font-size:12px;font-weight:700;overflow-wrap:anywhere;cursor:pointer}
.lp-preview-belt-entry:disabled{opacity:1;cursor:default}
.lp-preview-belt-entry.icon-only{min-width:36px;max-width:36px;display:flex;align-items:center;justify-content:flex-end;font-size:16px}
.lp-preview-belt-entry small{display:block;font-size:10px;font-weight:500;margin-top:7px;line-height:1.35}
.lp-preview-belt-label-img{display:block;max-width:120px;max-height:28px;object-fit:contain;margin:0 0 4px auto}
.lp-preview-price-details{background:#fff;border:1px solid #E5E7EB;border-radius:8px;overflow:hidden;margin-top:10px}
.lp-preview-price-details-header{background:linear-gradient(105deg,#111 5%,#21050c 52%,#A4002A 100%);color:#fff;padding:14px 12px}
.lp-preview-price-details-title{font-size:16px;font-weight:700;margin-bottom:13px}
.lp-preview-price-details-breakdown{display:flex;justify-content:space-between;gap:4px;font-size:10px;line-height:1.3}
.lp-preview-price-details-breakdown span{display:flex;flex-direction:column;min-width:0;white-space:nowrap}
.lp-preview-price-details-breakdown b{font-size:11px}
.lp-preview-price-details-note{font-size:11px;color:#6B7280;padding:9px 12px}
@media(max-width:1180px){.lp-display-workspace{grid-template-columns:1fr}.lp-display-preview-panel{position:static;max-height:none;overflow:visible;order:-1}.lp-preview-scenes,.lp-preview-scenes.mobile{grid-template-columns:minmax(230px,310px) minmax(350px,1fr)}}
@media(max-width:980px){.lp-preview-scenes,.lp-preview-scenes.mobile{grid-template-columns:1fr}.lp-preview-product-card{max-width:310px}}
@media(max-width:700px){.lp-display-editor .lp-form-row{align-items:flex-start}.lp-display-editor .lp-form-row .lp-form-label{width:72px}.lp-display-editor .lp-form-row .lp-form-control{min-width:0}.lp-display-editor .lp-helper,.lp-display-editor .lp-display-subtitle,.lp-display-editor .lp-display-asset-note{margin-left:88px}}
:focus-visible{outline:none;box-shadow:inset 0 0 0 2px rgba(164,0,42,.4)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const TAG_COLORS = {
  on: { bg: '#F0FDF4', color: '#16A34A' }, sale: { bg: '#EFF6FF', color: '#2563EB' },
  pending: { bg: '#FFFBEB', color: '#D97706' }, off: { bg: '#F3F4F6', color: '#6B7280' },
  req: { bg: '#FEF2F2', color: '#DC2626' }, warn: { bg: '#FFF1F2', color: '#E11D48' },
};
function StatusTag({ variant, children }) {
  const c = TAG_COLORS[variant] || TAG_COLORS.off;
  return <Tag bordered={false} style={{ background: c.bg, color: c.color, borderRadius: 999,
    padding: '2px 8px', fontSize: 12, lineHeight: '18px', marginInlineEnd: 4 }}>{children}</Tag>;
}
function Kpi({ num, label }) {
  return <div className="lp-kpi"><div className="label" style={{ marginBottom: 6 }}>{label}</div>
    <div className="num">{num}</div></div>;
}
function TipText({ label, tip }) {
  return <Tooltip title={<div style={{ whiteSpace: 'pre-line', lineHeight: 1.6 }}>{tip}</div>}
    color="#fff" styles={{ body: { color: '#374151', fontSize: 12, padding: '10px 14px' } }}>
    <span className="lp-tip-trigger">{label}</span></Tooltip>;
}
function CompactPagination({ total, current = 1, pageSize = 10, onChange, onPageSizeChange }) {
  const tp = Math.ceil(total / pageSize) || 1;
  const pages = [];
  pages.push({ k: 'prev', label: '<', arrow: true, disabled: current === 1 });
  for (let i = 1; i <= tp; i++) pages.push({ k: i, label: i });
  pages.push({ k: 'next', label: '>', arrow: true, disabled: current === tp });
  return <div className="lp-pagination">
    <span>共 {total.toLocaleString()} 条,每页{' '}
      <Select size="small" value={pageSize} onChange={onPageSizeChange} style={{ width: 72, marginInline: 4 }}
        options={[{ value: 10, label: 10 }, { value: 20, label: 20 }, { value: 50, label: 50 }]} />{' '}条</span>
    <div className="divider" />
    <Space size={2}>{pages.map(p => <span key={p.k} onClick={() => !p.disabled && onChange?.(p.k === 'prev' ? current - 1 : p.k === 'next' ? current + 1 : p.k)} style={{ minWidth: 32, height: 32, display: 'inline-flex',
      alignItems: 'center', justifyContent: 'center', borderRadius: 8, fontSize: 13,
      cursor: p.disabled ? 'default' : 'pointer', background: p.k === current ? '#A4002A' : (p.arrow ? '#fff' : 'transparent'),
      color: p.k === current ? '#fff' : '#374151', border: p.arrow ? '1px solid #E5E7EB' : 'none',
      fontWeight: p.k === current ? 600 : 400, opacity: p.disabled ? 0.35 : 1 }}>{p.label}</span>)}</Space>
    <div className="divider" /><span>第 {current}/{tp} 页</span></div>;
}
function EmptyZero({ onCta }) {
  return <div className="lp-empty"><InboxOutlined className="icon" />
    <div className="title">暂无促销活动</div>
    <div className="desc">点击下方按钮创建第一个 Amount off products 折扣</div>
    <Button type="primary" onClick={onCta}>新建折扣</Button></div>;
}
function EmptyNoMatch({ onClear }) {
  return <div className="lp-empty"><SearchOutlined className="icon" />
    <div className="title">未找到匹配结果</div>
    <div className="desc">请尝试调整搜索关键词或筛选条件</div>
    <Button onClick={onClear}>清除筛选条件</Button></div>;
}
function EmptyError({ onRetry }) {
  return <div className="lp-empty"><ExclamationCircleOutlined className="icon err" />
    <div className="title">加载失败</div>
    <div className="desc">网络异常,请检查网络连接后重试</div>
    <Button type="primary" onClick={onRetry}>重试</Button></div>;
}
function EmptyStateSwitcher({ mode, setMode }) {
  return <div style={{ marginTop: 12, display: 'flex', gap: 8, justifyContent: 'center' }}>
    {[['data', '正常数据'], ['zero', '零数据态'], ['no-match', '无匹配态'], ['error', '异常态']].map(([k, label]) =>
      <Button key={k} type={mode === k ? 'primary' : 'default'} onClick={() => setMode(k)}>{label}</Button>)}</div>;
}
function FormRow({ label, required, children, helper }) {
  return <><div className="lp-form-row">
    <div className="lp-form-label">{required && <span className="req">*</span>}{label}</div>
    <div className="lp-form-control">{children}</div></div>
    {helper && <div className="lp-helper">{helper}</div>}</>;
}
/* 通用列表页：统一活动列表与后续聚合列表的导航、空态和分页行为。 */
function ListPage({ title, desc, headActions, kpis, filters, columns, data, total,
                    entity, createKey, go, scrollX, pagination }) {
  const [mode, setMode] = useState('data');
  return <Card style={CARD_STYLE}>
    <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:16, marginBottom:18 }}>
      <div><div style={{ fontSize:20, fontWeight:700, marginBottom:6 }}>{title}</div>
        {desc && <div style={{ color:'#6B7280', fontSize:13 }}>{desc}</div>}</div>
      <div>{headActions}</div></div>
    {kpis && <div style={{ display:'grid', gridTemplateColumns:'repeat(' + kpis.length + ',1fr)', gap:12, marginBottom:18 }}>
      {kpis.map(k => <Kpi key={k.label} num={k.num} label={k.label} />)}</div>}
    {filters && <Space size={12} wrap style={{ marginBottom:16 }}>{filters}</Space>}
    {mode === 'data' && <><Table rowKey={r => r.id || r.code || r.key} columns={columns} dataSource={data}
      pagination={false} styles={TABLE_STYLES} scroll={scrollX ? { x:scrollX } : undefined} />
      <CompactPagination total={total ?? data.length} current={pagination?.current || 1}
        pageSize={pagination?.pageSize || 10} onChange={pagination?.onChange}
        onPageSizeChange={pagination?.onPageSizeChange} /></>}
    {mode === 'zero' && <div className="lp-empty"><InboxOutlined className="icon" />
      <div className="title">暂无{entity}</div><div className="desc">点击下方按钮创建第一个{entity}</div>
      {createKey && <Button type="primary" onClick={() => go(createKey)}>新增{entity}</Button>}</div>}
    {mode === 'no-match' && <EmptyNoMatch onClear={() => setMode('data')} />}
    {mode === 'error' && <EmptyError onRetry={() => setMode('data')} />}
    <EmptyStateSwitcher mode={mode} setMode={setMode} />
  </Card>;
}

function normalizeOfferCodes(rule, values) {
  if(rule.trigger!=='code') return [];
  if(!values?.length) throw new Error('请至少填写一个优惠码');
  const normalized=values.map(value=>String(value||'').trim().toUpperCase());

  normalized.forEach(code=>{

function getEligibleOrderPartners(rule, rules=OFFER_RULES) {
  return rules.filter(other=>other.id!==rule.id&&other.level==='order'&&other.market===rule.market
    &&other.currency===rule.currency&&other.status!=='ended'
    &&(!rule.start||!rule.end||(!other.start||!other.end||(rule.start<=other.end&&other.start<=rule.end))));
}
function setOrderStackPartners(ruleId, partnerIds, rules=OFFER_RULES) {
  const rule=rules.find(item=>item.id===ruleId);
  if(!rule) throw new Error('优惠不存在');
  const selected=[...new Set(partnerIds||[])];
  const eligible=new Set(getEligibleOrderPartners(rule,rules).map(item=>item.id));
  if((rule.level!=='order'&&selected.length)||selected.some(id=>!eligible.has(id))) throw new Error('存在不可叠加的订单优惠');
  rules.forEach(other=>{
    if(other.id===ruleId||other.level!=='order') return;
    const links=new Set(other.stackPartnerIds||[]);
    links.delete(ruleId);
    if(selected.includes(other.id)) links.add(ruleId);
    other.stackPartnerIds=[...links];
    other.stackPolicy=links.size?'order_stackable':'order_exclusive';
  });
  rule.stackPartnerIds=rule.level==='order'?selected:[];
  if(rule.level==='order') rule.stackPolicy=selected.length?'order_stackable':'order_exclusive';
  return rule;
}

function displayCountdownTarget(period,periods) {
  return period.end||null;
}
function validateDisplayCountdown(period,periods) {
  if(!period.countdownEnabled) return '';
  if(!period.start||!period.end||!dayjs(period.start).isValid()||!dayjs(period.end).isValid()) return '请先填写本段起止时间';
  if(!period.countdownStart||!dayjs(period.countdownStart).isValid()) return '请填写倒计时开始展示时间';
  const start=dayjs(period.countdownStart),periodStart=dayjs(period.start),periodEnd=dayjs(period.end);
  if(start.isBefore(periodStart)||!start.isBefore(periodEnd)) return '倒计时开始展示时间须在本段内';
  const target=displayCountdownTarget(period,periods);
  if(!target) return '请先填写本段结束时间';
  if(!dayjs(target).isValid()||!dayjs(target).isAfter(start)) return '倒计时目标时间须晚于开始展示时间';
  return '';
}
function resolveDisplayCountdown(period,periods,at) {
  const target=displayCountdownTarget(period,periods);
  const inactive={visible:false,target,secondsLeft:0};
  if(!period.countdownEnabled||validateDisplayCountdown(period,periods)||!at||!dayjs(at).isValid()) return inactive;
  const now=dayjs(at);
  if(now.isBefore(dayjs(period.start))||!now.isBefore(dayjs(period.end))||now.isBefore(dayjs(period.countdownStart))||!now.isBefore(dayjs(target))) return inactive;
  return {visible:true,target,secondsLeft:Math.max(0,dayjs(target).diff(now,'second'))};
}

      ['创建人',rule.createdBy||'—'],['创建时间',rule.createdAt||'—']
    ])}
    <OpLog data={OFFER_OPLOGS[rule.id]||[]}/>
  </>;
  return <Card style={{borderRadius:16}} styles={{body:{padding:28}}}>
    <Breadcrumb items={[{title:<a onClick={()=>go('offer-list')}>优惠活动</a>},{title:'活动详情'}]}/>
    <div className="lp-offer-detail-head">
      <div><h2>{rule.name}</h2></div>
      <Space wrap className="lp-offer-detail-actions">
        <Button onClick={()=>go('offer-edit',rule)}>编辑优惠</Button>
        <Button onClick={()=>go('offer-list')}>返回列表</Button>
      </Space>
    </div>
    <Tabs defaultActiveKey="detail" items={[
      {key:'detail',label:'优惠详情',children:basic},
      {key:'redemptions',label:'核销记录',children:<OfferRedemptionPanel rule={rule}/>}
    ]}/>
  </Card>;
}

function OfferRedemptionPanel({rule}) {
  const [status,setStatus]=useState('');
  const [range,setRange]=useState(null);
  const all=offerRedemptionRows(rule);
  const filtered=all.filter(row=>(!status||row.status===status)&&(!range||(
    row.at>=range[0].startOf('day').format('YYYY-MM-DD HH:mm')&&row.at<=range[1].endOf('day').format('YYYY-MM-DD HH:mm'))));
  const effective=all.filter(row=>row.status==='effective');
  const exportRows=()=>{
    const header=['核销时间','用户','订单号','优惠码','优惠金额','状态'];
    const values=filtered.map(row=>[row.at,row.buyer,row.order,row.code||'',row.discount,row.status==='effective'?'有效':'已撤回']);
    const csv='\uFEFF'+[header,...values].map(cells=>cells.map(value=>'"'+String(value??'').replaceAll('"','""')+'"').join(',')).join('\r\n');
    const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
    const link=document.createElement('a');link.href=url;link.download=rule.id+'-核销记录.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
  };
  return <>
    <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12,marginBottom:20}}>
      <Kpi num={effective.length} label="有效核销"/><Kpi num={all.length-effective.length} label="已撤回"/>
      <Kpi num={(rule.currency==='HKD'?'HK$':'$')+effective.reduce((sum,row)=>sum+row.discount,0).toFixed(2)} label="累计优惠金额"/>
    </div>
    <Space size={8} wrap style={{marginBottom:12}}>
      <Select value={status} onChange={setStatus} style={{width:140}} options={[{value:'',label:'全部状态'},{value:'effective',label:'有效'},{value:'reverted',label:'已撤回'}]}/>
      <DatePicker.RangePicker value={range} onChange={setRange} style={{width:250}} placeholder={['开始日期','结束日期']}/>
      <Button icon={<ReloadOutlined/>} onClick={()=>{setStatus('');setRange(null);}}>重置</Button>
      <Button icon={<DownloadOutlined/>} onClick={exportRows}>导出</Button>
    </Space>
    <Table rowKey="id" size="small" pagination={{pageSize:10}} dataSource={filtered} styles={TABLE_STYLES}
      columns={[{title:'核销时间',dataIndex:'at',width:150},{title:'用户',dataIndex:'buyer',width:150},
        {title:'订单号',dataIndex:'order',width:165},{title:'优惠码',dataIndex:'code',width:105,render:v=>v||'—'},
        {title:'优惠金额',dataIndex:'discount',width:100,render:v=>(rule.currency==='HKD'?'HK$':'$')+Number(v).toFixed(2)},
        {title:'状态',dataIndex:'status',width:90,render:v=><StatusTag variant={v==='effective'?'on':'off'}>{v==='effective'?'有效':'已撤回'}</StatusTag>}]} scroll={{x:'max-content'}}/>
  </>;
}

function OfferRuleListPage({go}) {

  const [draft,setDraft]=useState(initialFilters);
  const [applied,setApplied]=useState(initialFilters);
  const [page,setPage]=useState(1);
  const [pageSize,setPageSize]=useState(10);
  const [revision,setRevision]=useState(0);
  const [pendingChange,setPendingChange]=useState(null);
  const updateDraft=(key,value)=>setDraft(prev=>({...prev,[key]:value}));
  const rows=OFFER_RULES.filter(x=>{
    const keyword=applied.keyword.trim().toLowerCase();
    return (!keyword||[x.name,x.id,...(x.codes||[])].some(v=>String(v||'').toLowerCase().includes(keyword)))
      &&(!applied.status||x.status===applied.status)
      &&(!applied.trigger||x.trigger===applied.trigger)
      &&(!applied.level||x.level===applied.level)
      &&(!applied.audience||x.audience===applied.audience)
      &&(!applied.range||(x.start<=applied.range[1].endOf('day').format('YYYY-MM-DD HH:mm')
        &&x.end>=applied.range[0].startOf('day').format('YYYY-MM-DD HH:mm')));
  });

  const resetFilters=()=>{setDraft(initialFilters);setApplied(initialFilters);setPage(1);};
  const setStatus=(rule,status)=>setPendingChange({rule,status});
  const confirmStatus=()=>{
    if(!pendingChange)return;
    pendingChange.rule.status=pendingChange.status;
    offerLog(pendingChange.rule,pendingChange.status==='paused'?'暂停':pendingChange.status==='ended'?'结束':'恢复','状态变更为'+STATUS_MAP[pendingChange.status].label);
    setRevision(v=>v+1);setPendingChange(null);message.success('状态已更新');

  const exportRows=()=>{
    const fields=['优惠名称','优惠ID','优惠层级','触发方式','优惠码','优惠内容','适用商品','适用用户','叠加方式','市场','状态','已核销','开始时间','结束时间','时区','创建人','创建时间'];
    const values=rows.map(r=>[r.name,r.id,OFFER_LEVELS[r.level],r.trigger==='code'?'优惠码':'自动触发',(r.codes||[]).join('、'),

      r.level==='order'?(r.stackWithProduct===false?'商品互斥':'商品可叠加')+'；'+(r.stackPartnerIds?.length?'指定订单叠加':'订单互斥'):(r.stackPolicy==='standalone'?'不与订单优惠叠加':'可与订单优惠叠加'),r.market,
      STATUS_MAP[r.status]?.label||r.status,offerRedemptionTotal(r),r.start,r.end,r.timezone||offerTimezone(r.market),r.createdBy||'',r.createdAt||'']);
    const csv='\uFEFF'+[fields,...values].map(row=>row.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n');
    const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
    link.download='优惠活动列表.csv';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);
  };
  const copyCodes=rule=>{
    if(!rule.codes?.length)return;
    if(!navigator.clipboard?.writeText){message.warning('当前环境不支持复制，请在详情中查看优惠码');return;}
    navigator.clipboard.writeText(rule.codes.join('、')).then(()=>message.success('优惠码已复制')).catch(()=>message.warning('复制失败，请在详情中查看优惠码'));
  };
  const today=dayjs();
  const endingSoon=OFFER_RULES.filter(x=>x.status==='active'&&dayjs(x.end).isAfter(today)&&dayjs(x.end).isBefore(today.add(7,'day'))).length;
  const monthlyRedemptions=OFFER_REDEMPTIONS.filter(row=>row.status==='effective'&&dayjs(row.at).isSame(today,'month')).length;
  const columns=[
    {title:'活动名称 / ID',dataIndex:'name',width:250,render:(v,r)=><div>{v}<div className="lp-code">{r.id}</div></div>},
    {title:'优惠层级',dataIndex:'level',width:105,render:v=><StatusTag variant={v==='product'?'sale':'warn'}>{OFFER_LEVELS[v]}</StatusTag>},
    {title:'触发方式 / Code',dataIndex:'trigger',width:190,render:(v,r)=>v==='code'?<div>优惠码<div className="lp-code">{(r.codes||[]).length>1?`${r.codes.length} 个 · ${r.codes[0]} 等`:r.codes?.[0]||'—'}</div></div>:'自动触发'},
    {title:'优惠内容',dataIndex:'discountValue',width:115,render:(v,r)=>r.discountType==='percent'?v+'%':r.currency+' -'+Number(v).toFixed(2)},
    {title:'适用商品 / 用户',dataIndex:'scope',width:190,render:(v,r)=><div>{v}<div className="lp-code">{r.audience}</div></div>},
    {title:'叠加',dataIndex:'stackPolicy',width:165,render:(v,r)=>r.level==='order'
      ? <span>{r.stackWithProduct===false?'商品互斥':'商品可叠加'}<br/>{r.stackPartnerIds?.length?`指定订单叠加（${r.stackPartnerIds.length}）`:'订单互斥'}</span>
      : v==='standalone'?'不与订单优惠叠加':'可与订单优惠叠加'},
    {title:'市场',dataIndex:'market',width:90},
    {title:'状态',dataIndex:'status',width:90,render:v=><StatusTag variant={STATUS_MAP[v].variant}>{STATUS_MAP[v].label}</StatusTag>},
    {title:'已核销',dataIndex:'redemptions',width:80,render:(_,r)=>offerRedemptionTotal(r)},
    {title:'生效时间',dataIndex:'start',width:190,render:(v,r)=><span style={{fontSize:12}}>{v}<br/>至 {r.end}<br/>{r.timezone||(r.market==='香港'?'Asia/Hong_Kong':'America/New_York')}</span>},
    {title:'创建信息',dataIndex:'createdBy',width:135,render:(v,r)=><span>{v||'—'}<br/>{r.createdAt||'—'}</span>},
    {title:'操作',key:'op',width:295,fixed:'right',render:(_,r)=>{
      const ops=[{key:'detail',label:'详情',onClick:()=>go('offer-detail',r)},
        {key:'edit',label:'编辑',onClick:()=>go('offer-edit',r)}];
      if(r.status==='active')ops.push({key:'pause',label:'暂停',onClick:()=>setStatus(r,'paused')});
      if(r.status==='paused')ops.push({key:'resume',label:'恢复',onClick:()=>setStatus(r,'active')});
      if(!['ended','draft'].includes(r.status))ops.push({key:'end',label:'结束活动',danger:true,onClick:()=>setStatus(r,'ended')});
      if(r.codes?.length)ops.push({key:'copy',label:'复制优惠码',onClick:()=>copyCodes(r)});
      const flat=ops.length<=4?ops:ops.slice(0,3);
      const more=ops.length<=4?[]:ops.slice(3);
      return <Space size={4}>{flat.map(op=><Button key={op.key} size="small" danger={op.danger} onClick={op.onClick}>{op.label}</Button>)}
        {more.length>0&&<Dropdown trigger={['click']} menu={{items:more.map(op=>({key:op.key,label:op.label,danger:op.danger,onClick:op.onClick}))}}>
          <Button size="small" icon={<EllipsisOutlined/>} aria-label={'更多操作：'+r.name}/></Dropdown>}</Space>;
    }}
  ];
  return <><ListPage title="优惠活动"
    headActions={<Space><Button icon={<DownloadOutlined/>} onClick={exportRows}>导出</Button><Button type="primary" icon={<PlusOutlined/>} onClick={()=>go('offer-create')}>新建优惠</Button></Space>}
    kpis={[{num:String(OFFER_RULES.filter(x=>x.status==='active').length),label:'进行中活动'},
      {num:String(OFFER_RULES.filter(x=>x.status==='draft').length),label:'草稿'},
      {num:String(monthlyRedemptions),label:'本月累计核销次数'},
      {num:String(endingSoon),label:'7 天内即将结束'}]}
    filters={<><Input value={draft.keyword} onChange={e=>updateDraft('keyword',e.target.value)} onPressEnter={applyFilters} placeholder="搜索活动名称 / ID / 优惠码" prefix={<SearchOutlined/>} style={{width:250}}/>
      <Select value={draft.status} onChange={v=>updateDraft('status',v)} style={{width:125}} options={[{value:'',label:'全部状态'},...Object.entries(STATUS_MAP).map(([value,info])=>({value,label:info.label}))]}/>
      <Select value={draft.trigger} onChange={v=>updateDraft('trigger',v)} style={{width:135}} options={[{value:'',label:'全部触发方式'},{value:'auto',label:'自动触发'},{value:'code',label:'优惠码触发'}]}/>
      <Select value={draft.level} onChange={v=>updateDraft('level',v)} style={{width:125}} options={[{value:'',label:'全部优惠层级'},{value:'product',label:'商品优惠'},{value:'order',label:'订单优惠'}]}/>
      <Select value={draft.audience} onChange={v=>updateDraft('audience',v)} style={{width:130}} options={[{value:'',label:'全部适用用户'},{value:'全部用户',label:'全部用户'},{value:'新人',label:'新人'},{value:'老用户',label:'老用户'}]}/>
      <DatePicker.RangePicker value={draft.range} onChange={v=>updateDraft('range',v)} placeholder={['起始日','结束日']} style={{width:240}}/>
      <Button type="primary" icon={<SearchOutlined/>} onClick={applyFilters}>查询</Button>
      <Button icon={<ReloadOutlined/>} onClick={resetFilters}>重置</Button></>}
    columns={columns} data={rows.slice((page-1)*pageSize,page*pageSize)} total={rows.length}
    pagination={{current:page,pageSize,onChange:setPage,onPageSizeChange:v=>{setPageSize(v);setPage(1);}}}
    entity="优惠活动" createKey="offer-create" go={go} scrollX="max-content"/>
    <Modal title={pendingChange?.status==='ended'?'结束这条优惠活动？':pendingChange?.status==='paused'?'暂停这条优惠活动？':'恢复这条优惠活动？'}
      open={!!pendingChange} onCancel={()=>setPendingChange(null)} closable={false} maskClosable={false} centered={true}
      footer={[<Button key="cancel" onClick={()=>setPendingChange(null)}>取消</Button>,
        <Button key="confirm" type="primary" danger={pendingChange?.status==='ended'} onClick={confirmStatus}>
          {pendingChange?.status==='ended'?'确认结束':pendingChange?.status==='paused'?'确认暂停':'确认恢复'}</Button>]}>
      {pendingChange?.status==='ended'?'结束后不能恢复。':'状态变更后将影响该优惠的可用性。'}
    </Modal></>;
}

function OfferRuleFormPage({go,record}) {
  const r=record||{}; const isEdit=!!record;
  const [name,setName]=useState(r.name||'');
  const [market,setMarket]=useState(r.market==='香港'?'HK':'US');
  const [level,setLevel]=useState(r.level||'product');
  const [stackPolicy,setStackPolicy]=useState(r.stackPolicy||(r.level==='order'?'order_exclusive':'cross'));
  const [stackWithProduct,setStackWithProduct]=useState(r.stackWithProduct!==false);
  const [stackPartnerIds,setStackPartnerIds]=useState(r.stackPartnerIds||[]);
  const [channel,setChannel]=useState(r.channel||'public');
  const [trigger,setTrigger]=useState(r.trigger||'auto');
  const [codes,setCodes]=useState(r.codes||(isEdit?[]:['alice','lili']));
  const [range,setRange]=useState(r.start&&r.end?[dayjs(r.start),dayjs(r.end)]:null);
  const [discountType,setDiscountType]=useState(r.discountType||'fixed');
  const [discountValue,setDiscountValue]=useState(r.discountValue);
  const [maxDiscount,setMaxDiscount]=useState(r.maxDiscount);
  const [totalUsageLimit,setTotalUsageLimit]=useState(r.totalUsageLimit);
  const [perBuyerUsageLimit,setPerBuyerUsageLimit]=useState(r.perBuyerUsageLimit);
  const [scope,setScope]=useState(r.scopeType||'all');
  const [scopeValues,setScopeValues]=useState(r.scopeValues||[]);
  const [thresholdType,setThresholdType]=useState(r.threshold?.includes('件')?'quantity':r.threshold?.startsWith('满')?'amount':'none');
  const [thresholdValue,setThresholdValue]=useState(Number(String(r.threshold||'').replace(/[^0-9.]/g,''))||undefined);
  const [audience,setAudience]=useState(r.audience==='新人'?'new':r.audience==='老用户'?'old':r.audience==='指定用户标签'?'tag':r.audience==='指定邮箱'?'email':'all');
  const [userTags,setUserTags]=useState(r.userTags||[]);
  const [buyerEmails,setBuyerEmails]=useState((r.buyerEmails||[]).join('\n'));
  const [pdpInlineVisible,setPdpInlineVisible]=useState(r.pdpInlineVisible!==false);
  const [offerLandingType,setOfferLandingType]=useState(r.offerLandingType==='collection'?'collection':'topic');
  const [offerLandingUrl,setOfferLandingUrl]=useState(r.offerLandingUrl||'');
  const [offerLandingCollectionId,setOfferLandingCollectionId]=useState(r.offerLandingCollectionId||'');
  const marketName=market==='HK'?'香港':'美国';
  const currency=market==='HK'?'HKD':'USD';
  const options=BENEFIT_MARKET_OPTIONS[marketName];
  const partnerOptions=level==='order'?getEligibleOrderPartners({id:r.id,level,market:marketName,currency,
    start:range?.[0]?.format('YYYY-MM-DD HH:mm'),end:range?.[1]?.format('YYYY-MM-DD HH:mm')}).map(x=>({value:x.id,label:x.name+'（'+x.id+'）'})):[];
  const save=(action)=>{
    const publish=action==='publish';
    const requireComplete=publish||(isEdit&&r.status!=='draft');
    if(!name.trim()){message.warning('请填写优惠名称');return;}
    if(requireComplete&&(!range?.[0]||!range?.[1]||discountValue===undefined||discountValue===null)){message.warning('请填写生效时间和优惠金额');return;}
    if(range?.[0]&&range?.[1]&&!range[1].isAfter(range[0])){message.warning('结束时间必须晚于开始时间');return;}
    if(publish&&range[1].isBefore(dayjs())){message.warning('生效时间已结束，不能发布');return;}
    if(discountValue!==undefined&&discountValue!==null&&(Number(discountValue)<=0||(discountType==='percent'&&Number(discountValue)>100))){message.warning('请填写有效的优惠金额或百分比');return;}
    if(maxDiscount!==undefined&&maxDiscount!==null&&Number(maxDiscount)<=0){message.warning('最大优惠封顶须大于 0');return;}
    if([totalUsageLimit,perBuyerUsageLimit].some(value=>value!==undefined&&value!==null&&(!Number.isInteger(Number(value))||Number(value)<=0))){message.warning('使用上限须为正整数');return;}
    if(totalUsageLimit&&perBuyerUsageLimit&&Number(perBuyerUsageLimit)>Number(totalUsageLimit)){message.warning('每人使用上限不能超过总使用上限');return;}
    if(totalUsageLimit&&Number(totalUsageLimit)<offerRedemptionTotal(r)){message.warning('总使用上限不能低于已有有效核销次数');return;}
    if(requireComplete&&scope!=='all'&&!scopeValues.length){message.warning('请选择适用商品范围');return;}
    if(requireComplete&&audience==='tag'&&!userTags.length){message.warning('请选择用户标签');return;}
    if(requireComplete&&audience==='email'&&!buyerEmails.trim()){message.warning('请填写买家邮箱');return;}
    if(audience==='email'&&buyerEmails.trim()&&buyerEmails.split(/[\n,，]+/).map(x=>x.trim()).filter(Boolean).some(email=>!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))){message.warning('买家邮箱格式不正确');return;}
    if(requireComplete&&thresholdType!=='none'&&(!Number.isFinite(Number(thresholdValue))||Number(thresholdValue)<=0)){message.warning('请填写使用门槛');return;}
    if(requireComplete&&level==='order'&&stackPolicy==='order_stackable'&&!stackPartnerIds.length){message.warning('请选择可叠加的订单优惠');return;}
    let presentation;
    try {presentation=normalizeOfferPresentation({pdpInlineVisible,offerLandingType,offerLandingUrl,offerLandingCollectionId,market:marketName});}
    catch(error) {message.warning(error.message);return;}
    const now=dayjs();
    const nextStatus=publish?(range[0].isAfter(now)?'scheduled':'active'):(r.status&&r.status!=='draft'?r.status:'draft');
    const next=normalizeOfferChannel({...r,id:r.id||'OFR-DEMO-'+Date.now(),name:name.trim(),level,market:marketName,currency,
      start:range?.[0]?.format('YYYY-MM-DD HH:mm')||'',end:range?.[1]?.format('YYYY-MM-DD HH:mm')||'',channel,trigger,
      discountType,discountValue,maxDiscount:discountType==='percent'?maxDiscount:undefined,
      totalUsageLimit,perBuyerUsageLimit,timezone:offerTimezone(marketName),
      scope:scope==='all'?'全部商品':scopeValues.length+' 个'+({category:'品类',brand:'品牌',tag:'商品标签',collection:'Collection',listing:'商品'}[scope]),
      scopeType:scope,scopeValues:[...scopeValues],qualifyingScope:level==='order'?'eligible_items':undefined,
      allocationScope:level==='order'?'eligible_items':undefined,thresholdType,thresholdValue:thresholdType==='none'?undefined:thresholdValue,
      threshold:thresholdType==='none'?'无门槛':thresholdType==='quantity'?'满 '+thresholdValue+' 件':'满 '+(market==='HK'?'HK$':'$')+thresholdValue,
      audience:({all:'全部用户',new:'新人',old:'老用户',tag:'指定用户标签',email:'指定邮箱'})[audience],
      userTags:audience==='tag'?[...userTags]:[],buyerEmails:audience==='email'?buyerEmails.split(/[\n,，]+/).map(x=>x.trim()).filter(Boolean):[],stackPolicy,
      stackWithProduct:level==='order'?stackWithProduct:undefined,
      ...presentation,status:nextStatus,
      createdBy:r.createdBy||'当前运营',createdAt:r.createdAt||now.format('YYYY-MM-DD HH:mm')});
    try {next.codes=trigger==='code'&&(!requireComplete&&!codes.length)?[]:normalizeOfferCodes(next,codes);} catch(error) {message.warning(error.message);return;}
    const partners=level==='order'&&stackPolicy==='order_stackable'?stackPartnerIds:[];
    if(requireComplete&&partners.some(id=>!getEligibleOrderPartners(next).some(x=>x.id===id))){message.warning('所选订单优惠不在同一市场或时间不重叠');return;}
    const i=OFFER_RULES.findIndex(x=>x.id===next.id);if(i>=0)OFFER_RULES[i]=next;else OFFER_RULES.unshift(next);
    if(publish||r.status==='active'||r.status==='scheduled')setOrderStackPartners(next.id,partners);
    offerLog(next,isEdit?'编辑':publish?'发布':'创建',isEdit?'更新优惠配置':publish?'保存并发布优惠':'保存优惠草稿');
    message.success(publish?'优惠活动已发布':'优惠活动已保存');go('offer-list');
  };
  return <Card style={CARD_STYLE}>
    <Breadcrumb items={[{title:<a onClick={()=>go('offer-list')}>优惠活动</a>},{title:isEdit?'编辑优惠':'新建优惠'}]} style={{marginBottom:8}}/>
    <div style={{fontSize:20,fontWeight:700,marginBottom:20}}>{isEdit?'编辑优惠':'新建优惠'}</div>
    <h4 className="lp-section">基本信息</h4>

function DisplayAssetUpload({value,onChange,label}) {

    const reader=new FileReader();reader.onload=()=>onChange(reader.result);reader.onerror=()=>message.error('图片读取失败');reader.readAsDataURL(file);
    return false;
  };
  return <div style={{width:'100%',minWidth:180}}>
    <div style={{fontSize:12,color:'#6B7280',marginBottom:6}}>{label}</div>

}

    if(invalidCountdown){message.warning('第 '+(invalidCountdown.i+1)+' 段：'+invalidCountdown.error);return;}
    const next=buildPlan(d.status==='active'?'active':'scheduled',valid);
    setPendingPlan(next);setCheckReport(null);setCheckError('');setCheckState('checking');setCheckOpen(true);
    Promise.resolve().then(()=>{
      if(typeof window.looplyCheckDisplayConflicts!=='function') throw new Error('尚未接入完整商品索引，无法完成发布检查');
      return window.looplyCheckDisplayConflicts(next,DISPLAY_CHECK_POLICY);
    }).then(result=>{
      const fields=['totalSlots','effectiveSlots','overriddenSlots','suppressedSlots','partialSlots'];
      if(result?.source!=='full-product-index'||!fields.every(k=>Number.isInteger(result[k])&&result[k]>=0)||!Array.isArray(result.conflicts)) throw new Error('冲突检查结果不完整，无法发布');
      setCheckReport(result);setCheckState(result.effectiveSlots===0?'blocked':'ready');
    }).catch(error=>{setCheckError(error.message||'冲突检查失败，请稍后重试');setCheckState('error');});
  };
  const confirmPublish=()=>{if(checkState!=='ready'||!pendingPlan)return;persistPlan(pendingPlan,'发布');setCheckOpen(false);};
  return <Card style={CARD_STYLE}>
    <Breadcrumb items={[{title:<a onClick={()=>go('display-list')}>营销氛围</a>},{title:isEdit?'编辑氛围方案':'新建氛围方案'}]} style={{marginBottom:8}}/>
    <div style={{fontSize:20,fontWeight:700,marginBottom:20}}>{isEdit?'编辑氛围方案':'新建氛围方案'}</div>
    <h4 className="lp-section">基本信息</h4>
    {isEdit&&<FormRow label="展示 ID"><Input value={d.id} disabled style={{width:280}}/></FormRow>}
    <FormRow label="方案名称" required><Input value={name} onChange={e=>setName(e.target.value)} placeholder="如：Black Friday 2026" style={{width:'100%',maxWidth:560}}/></FormRow>
    <FormRow label="所属市场" required><Select value={market} onChange={v=>{setMarket(v);setScopeValues([]);setLinkedOfferIds([]);setPeriods(items=>items.map(p=>({...p,landing:''})));}} disabled={isEdit} style={{width:280}} options={[{value:'US',label:'美国 / USD'},{value:'HK',label:'香港 / HKD'}]}/></FormRow>
    <FormRow label="优先级" required helper="数值越小越优先；同级保留先发布方案"><InputNumber value={priority} onChange={setPriority} min={1} max={100} precision={0} style={{width:180}}/></FormRow>
    <h4 className="lp-section" style={{marginTop:24}}>适用商品</h4>
    <div style={{fontSize:12,color:'#6B7280',margin:'0 0 12px'}}>仅选择需要展示大促氛围的商品；同时使用两种来源时取并集。</div>
    <div className="lp-scope-grid">
      <div className={'lp-scope-source'+(scopeSources.includes('offer')?' is-active':'')}>
        <div><div className="lp-scope-source-head"><Checkbox checked={scopeSources.includes('offer')} onChange={e=>setScopeSources(current=>toggleDisplayScopeSource(current,'offer',e.target.checked))}>引用商品优惠</Checkbox></div><div className="lp-scope-source-desc">商品范围随所选优惠变化。</div></div>
        {scopeSources.includes('offer')&&<div className="lp-scope-source-body"><div className="lp-scope-field-label"><span className="req">*</span>选择商品优惠</div><Select aria-label="选择商品优惠" mode="multiple" value={linkedOfferIds} onChange={setLinkedOfferIds} showSearch optionFilterProp="label" placeholder="选择同市场、已发布的商品优惠" style={{width:'100%'}} options={offerOptions}/></div>}
      </div>
      <div className={'lp-scope-source'+(scopeSources.includes('manual')?' is-active':'')}>
        <div><div className="lp-scope-source-head"><Checkbox checked={scopeSources.includes('manual')} onChange={e=>setScopeSources(current=>toggleDisplayScopeSource(current,'manual',e.target.checked))}>按范围圈选商品</Checkbox></div><div className="lp-scope-source-desc">可纳入未参加优惠的商品。</div></div>
        {scopeSources.includes('manual')&&<div className="lp-scope-source-body"><div className="lp-scope-field-label"><span className="req">*</span>圈选依据</div><Select aria-label="圈选依据" value={scope} onChange={v=>{setScope(v);setScopeValues([]);}} style={{width:'100%'}} options={[{value:'category',label:'指定品类'},{value:'brand',label:'指定品牌'},{value:'tag',label:'指定标签'},{value:'collection',label:'指定 Collection'},{value:'listing',label:'指定商品'}]}/><div className="lp-scope-field-label"><span className="req">*</span>选择范围</div><Select aria-label="选择商品范围" mode="multiple" value={scopeValues} onChange={setScopeValues} style={{width:'100%'}} options={scope==='brand'?options.brands:scope==='tag'?options.tags:scope==='collection'?COLLECTIONS.filter(x=>x.market===marketName).map(x=>({value:x.value,label:x.label})):scope==='category'?options.categories:options.listings}/></div>}
      </div>
    </div>
    <h4 className="lp-section" style={{marginTop:24}}>展示时段与内容</h4>
    <FormRow label="时间设置" required><Radio.Group value={periodMode} onChange={e=>{const v=e.target.value;setPeriodMode(v);if(v==='single'){setPeriods([periods[0]]);setPreviewKey(periods[0].key);setPreviewAt(null);}else if(periods.length===1)setPeriods([periods[0],{key:Date.now(),range:null,landingType:periods[0].landingType,landing:periods[0].landing,countdownEnabled:false,countdownStart:null,assets:{}}]);}} options={[{value:'single',label:'单时段'},{value:'split',label:'分段设置'}]}/></FormRow>
    <div className="lp-display-workspace">
    <div className="lp-display-editor">
    {periods.map((p,i)=><div key={p.key} className={'lp-display-period'+(periodMode==='split'&&selectedPreview?.key===p.key?' is-active':'')} onClick={()=>selectPreviewPeriod(p.key)} onFocusCapture={()=>selectPreviewPeriod(p.key)}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}><strong>{periodMode==='single'?'单时段配置':`第 ${i+1} 时段`}</strong>{periodMode==='split'&&<Button size="small" disabled={periods.length<=2} onClick={e=>{e.stopPropagation();const next=periods.filter(x=>x.key!==p.key);setPeriods(next);if(previewKey===p.key){setPreviewKey(next[0].key);setPreviewAt(null);}}}>删除时段</Button>}</div>
      <FormRow label="起止时间" required><DatePicker.RangePicker showTime value={p.range} onChange={range=>updatePeriod(p.key,{range})} style={{width:'100%',maxWidth:380}}/></FormRow>
      <FormRow label="倒计时展示" helper="开启后倒数至本时段结束；关闭不影响氛围展示"><Radio.Group value={p.countdownEnabled?'on':'off'} onChange={e=>updatePeriod(p.key,{countdownEnabled:e.target.value==='on'})} options={[{value:'off',label:'关闭'},{value:'on',label:'开启'}]}/></FormRow>
      {p.countdownEnabled&&<>
        <FormRow label="开始展示时间" required helper="请选择本时段内的时间"><DatePicker showTime value={p.countdownStart} onChange={v=>updatePeriod(p.key,{countdownStart:v})} style={{width:250}}/></FormRow>
      </>}
      <div className="lp-display-subtitle">展示内容</div>
      <div className="lp-display-asset-note">支持 PNG/JPG/WebP，单张不超过 5 MB；图片勿含固定售价、划线价、Save 或 Code 金额。</div>
      <FormRow label="标签素材" helper="可选；商品卡与商详使用不同图片，未上传的标签不展示"><div className="lp-display-assets-wrap"><div className="lp-display-assets">{DISPLAY_ASSET_SLOTS.slice(0,4).map(slot=><DisplayAssetUpload key={slot.key} label={slot.label} value={p.assets?.[slot.key]} onChange={src=>updatePeriod(p.key,{assets:{...p.assets,[slot.key]:src}})}/>)}</div></div></FormRow>
      <FormRow label="商详腰带背景" helper="可选；不上传则使用默认背景"><div className="lp-display-assets-wrap"><div className="lp-display-assets">{DISPLAY_ASSET_SLOTS.slice(4,6).map(slot=><DisplayAssetUpload key={slot.key} label={slot.label} value={p.assets?.[slot.key]} onChange={src=>updatePeriod(p.key,{assets:{...p.assets,[slot.key]:src}})}/>)}</div></div></FormRow>
      <FormRow label="Price Details 图片" helper="可选；与商详腰带尺寸不同，未上传时使用系统默认样式"><div className="lp-display-assets-wrap"><div className="lp-display-assets">{DISPLAY_ASSET_SLOTS.slice(6).map(slot=><DisplayAssetUpload key={slot.key} label={slot.label} value={p.assets?.[slot.key]} onChange={src=>updatePeriod(p.key,{assets:{...p.assets,[slot.key]:src}})}/>)}</div></div></FormRow>
      <FormRow label="点击后前往" helper="可选；未配置时不显示商详腰带跳转箭头，商品卡仍进入商详"><div style={{display:'flex',alignItems:'center',flexWrap:'wrap',gap:12}}><Radio.Group value={p.landingType} onChange={e=>updatePeriod(p.key,{landingType:e.target.value,landing:''})} options={[{value:'collection',label:'选择 Collection'},{value:'url',label:'填写链接'}]}/>{p.landingType==='collection'?<Select aria-label="选择跳转 Collection" value={p.landing?.split('/').pop()||undefined} onChange={v=>updatePeriod(p.key,{landing:'/collections/'+v})} style={{width:'100%',maxWidth:400}} options={COLLECTIONS.filter(x=>x.market===marketName)}/>:<Input aria-label="填写跳转链接" value={p.landing} onChange={e=>updatePeriod(p.key,{landing:e.target.value})} style={{width:'100%',maxWidth:560}} placeholder="/campaign/black-friday 或 https://..."/>}</div></FormRow>
    </div>)}
    {periodMode==='split'&&<Button type="dashed" icon={<PlusOutlined/>} onClick={()=>{const key=Date.now();setPeriods([...periods,{key,range:null,landingType:'collection',landing:'',countdownEnabled:false,countdownStart:null,assets:{}}]);setPreviewKey(key);setPreviewAt(null);}}>新增展示时段</Button>}
    </div>
    <aside className="lp-display-preview-panel" aria-label="前台效果预览">
      <div style={{fontSize:15,fontWeight:600}}>前台效果预览{periodMode==='split'&&<span style={{fontSize:12,fontWeight:400,color:'#A4002A',marginLeft:8}}>第 {periods.findIndex(p=>p.key===selectedPreview?.key)+1} 时段</span>}</div>
      <div className="lp-preview-controls">
        {periodMode==='split'&&<Select aria-label="预览时段" value={selectedPreview?.key} onChange={selectPreviewPeriod} style={{width:160}} options={periods.map((p,i)=>({value:p.key,label:'第 '+(i+1)+' 时段'}))}/>}
        <Radio.Group aria-label="预览设备" value={previewDevice} onChange={e=>setPreviewDevice(e.target.value)} options={[{value:'pc',label:'PC'},{value:'h5',label:'移动端'}]}/>
        <span style={{fontSize:12,color:'#6B7280'}}>预览时间</span><DatePicker aria-label="预览时间" showTime value={previewTime} onChange={setPreviewAt} style={{width:250}}/>
      </div>
      <div style={{fontSize:12,color:'#6B7280',marginBottom:14}}>金额为示意，实际优惠按规则计算。{selectedPreview?.countdownEnabled?'可调整预览时间核对倒计时。':''}</div>
      <DisplayPreview period={selectedPreview} device={previewDevice} countdown={previewCountdown}/>
    </aside>
    </div>
    {hasImages&&<FormRow label="素材声明" required><Checkbox checked={claimConfirmed} onChange={e=>setClaimConfirmed(e.target.checked)}>确认图片不包含固定售价、划线价、Save 或 Code 金额</Checkbox></FormRow>}
    <div style={{display:'flex',justifyContent:'flex-end',gap:12,padding:'16px 0',borderTop:'1px solid #E5E7EB'}}><Button onClick={()=>go('display-list')}>取消</Button>{(!isEdit||d.status==='draft')&&<Button onClick={saveDraft}>保存草稿</Button>}<Button type="primary" onClick={preparePublish}>{isEdit&&d.status!=='draft'?'检查并重新发布':'检查并发布'}</Button></div>
    {isEdit&&<OpLog data={DISPLAY_OPLOGS[d.id]||[]}/>}
    <Modal open={checkOpen} title="发布前冲突检查" closable={false} maskClosable={false} centered={true} width={760}
      footer={<><Button onClick={()=>setCheckOpen(false)}>返回修改</Button>{(!isEdit||d.status==='draft')&&<Button onClick={saveDraft}>保存草稿</Button>}<Button type="primary" disabled={checkState!=='ready'} onClick={confirmPublish}>确认发布</Button></>}>
      {checkState==='checking'&&<Alert type="info" showIcon message="正在检查商品和时段冲突…"/>}
      {checkState==='error'&&<><Alert type="error" showIcon message={checkError} description="检查未完成，不能发布；请重试或保存草稿。" style={{marginBottom:16}}/><Space size={8} wrap><StatusTag variant="off">范围内 —</StatusTag><StatusTag variant="off">本方案生效 —</StatusTag><StatusTag variant="off">覆盖旧方案 —</StatusTag><StatusTag variant="off">被其他方案压制 —</StatusTag></Space></>}
      {checkReport&&<>
        {checkState==='blocked'&&<Alert type="error" showIcon message="当前方案没有展示机会" description="请调整优先级、展示时段或商品范围后重新检查；可以先保存草稿。" style={{marginBottom:16}}/>}
        {checkState==='ready'&&checkReport.conflicts.length===0&&<Alert type="success" showIcon message="未发现冲突，可以发布" style={{marginBottom:16}}/>}
        {checkState==='ready'&&checkReport.conflicts.length>0&&<Alert type="warning" showIcon message="存在重叠氛围，请确认下方展示结果" style={{marginBottom:16}}/>}
        <Space size={8} wrap style={{marginBottom:16}}><StatusTag variant="sale">范围内 {checkReport.totalSlots} 个展示位</StatusTag><StatusTag variant="on">本方案生效 {checkReport.effectiveSlots} 个</StatusTag><StatusTag variant="warn">覆盖旧方案 {checkReport.overriddenSlots} 个</StatusTag><StatusTag variant="pending">被其他方案压制 {checkReport.suppressedSlots} 个</StatusTag><StatusTag variant="pending">部分时段生效 {checkReport.partialSlots} 个</StatusTag></Space>
        {checkReport.conflicts.length>0&&<Table size="small" rowKey={(r,i)=>r.key||r.productId+'-'+r.placement+'-'+i} dataSource={checkReport.conflicts} styles={TABLE_STYLES} pagination={{pageSize:5}} columns={[{title:'商品',dataIndex:'productName'},{title:'位置',dataIndex:'placement',width:85,render:v=>v==='card'?'商品卡':v==='pdp'?'商详':v},{title:'重叠时段',dataIndex:'period',width:165},{title:'重叠方案',dataIndex:'rivalName'},{title:'生效方案',dataIndex:'winnerName'}]}/>}
      </>}
    </Modal>
  </Card>;
}




function App() {
  const requestedPage=new URLSearchParams(location.search).get('page');
  const offerPages=['offer-list','offer-create','offer-edit','offer-detail'];
  const displayPages=['display-list','display-create','display-edit'];
  const allowedPages=[...offerPages,...displayPages];
  const [currentPage, setCurrentPage] = useState(['offer-list','offer-create','display-list','display-create'].includes(requestedPage)?requestedPage:'offer-list');
  const [record, setRecord] = useState(null);
  const go = (key, rec) => {
    if (!allowedPages.includes(key)) return;
    if (rec !== undefined) setRecord(rec);
    else if (key === 'offer-create' || key === 'offer-list' || key === 'display-create' || key === 'display-list') setRecord(null);
    setCurrentPage(key);
    window.scrollTo(0, 0);
  };
  const activeKey = currentPage.startsWith('display-') ? 'display' : 'promo';
  const subLabel = (text, key) => <span style={{ fontWeight: activeKey === key ? 600 : 400 }}>{text}</span>;
  const menuItems = [
    { key: 'marketing', icon: <GiftOutlined />, label: '营销中心',
      children: [
        { key: 'promo', icon: <TagsOutlined />, label: subLabel('优惠活动', 'promo') },
        { key: 'display', icon: <GiftOutlined />, label: subLabel('营销氛围', 'display') },
      ] },
  ];
  const crumbMap = {
    'offer-list': '优惠活动', 'offer-create': '优惠活动 / 新建优惠', 'offer-edit': '优惠活动 / 编辑优惠', 'offer-detail': '优惠活动 / 活动详情',
    'display-list': '营销氛围', 'display-create': '营销氛围 / 新建氛围方案', 'display-edit': '营销氛围 / 编辑氛围方案',
  };
  return <ConfigProvider theme={looplyTheme}>
    <Layout style={{ height: '100vh' }}>
      <Layout.Header style={{ borderBottom: '1px solid #E5E7EB', display: 'flex', alignItems: 'center' }}>
        <img src={LOGO_SRC} alt="Looply" style={{ width: 118, height: 'auto', display: 'block' }} />
        <div style={{ width: 1, height: 20, background: '#E5E7EB', margin: '0 16px' }} />
        <span style={{ fontSize: 14, fontWeight: 500, color: '#6B7280' }}>营销管理后台</span>
        <span style={{ marginLeft: 'auto', color: '#9CA3AF', fontSize: 13 }}>{crumbMap[currentPage]}</span>
      </Layout.Header>
      <Layout>
        <Layout.Sider width={220} theme="light" style={SIDER_STYLE}>
          <Menu mode="inline" items={menuItems} selectedKeys={[activeKey]} defaultOpenKeys={['marketing']}
            style={{ borderInlineEnd: 'none' }}
            onClick={({key}) => {
              if (key === 'promo') go('offer-list');
              if (key === 'display') go('display-list');
            }} /></Layout.Sider>
        <Layout.Content style={{ padding: 28, overflow: 'auto' }}>
          {currentPage === 'offer-list' && <OfferRuleListPage go={go} />}
          {currentPage === 'offer-create' && <OfferRuleFormPage go={go} />}
          {currentPage === 'offer-edit' && <OfferRuleFormPage go={go} record={record} />}
          {currentPage === 'offer-detail' && <OfferDetailPanel rule={record||OFFER_RULES[0]} go={go} />}
          {currentPage === 'display-list' && <FrontDisplayListPage go={go} />}
          {currentPage === 'display-create' && <FrontDisplayFormPage go={go} />}
          {currentPage === 'display-edit' && <FrontDisplayFormPage go={go} record={record} />}
        </Layout.Content>
      </Layout>
    </Layout>
  </ConfigProvider>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
