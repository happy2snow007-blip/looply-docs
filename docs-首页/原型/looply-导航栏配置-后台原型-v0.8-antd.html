<style>
html,body,#root{height:100%;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F9FAFB;color:#1F2937}
#root::before{content:'Loading...';position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#9CA3AF;font-size:14px}
#root:not(:empty)::before{display:none}
.lp-form-row{display:flex;gap:16px;margin-bottom:14px;align-items:flex-start}
.lp-form-row .lp-form-label{width:130px;text-align:right;color:#6B7280;font-size:13px;flex-shrink:0;padding-top:6px}
.lp-form-row .lp-form-control{flex:1}
.dim-badge{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:3px 12px;border-radius:999px;letter-spacing:0.2px;white-space:nowrap}
.dim-badge-web{background:#2563EB;color:#fff}
.pc-shell{width:560px;min-width:560px;border-radius:12px;background:#E5E7EB;padding:6px;box-shadow:0 12px 40px rgba(0,0,0,.15);position:sticky;top:24px;align-self:flex-start}
.pc-screen{border-radius:8px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.pc-topbar{height:28px;background:#F3F4F6;display:flex;align-items:center;padding:0 10px;gap:6px}
.pc-dot{width:9px;height:9px;border-radius:50%}
.pc-url-bar{flex:1;background:#fff;border-radius:4px;height:16px;margin:0 8px;font-size:10px;color:#9CA3AF;display:flex;align-items:center;padding:0 6px}
.pc-header{padding:10px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #F3F4F6}
.pc-nav{display:flex;align-items:center;border-bottom:1px solid #F3F4F6;padding:0 16px;position:relative}
.pc-nav-item{padding:8px 12px;font-size:12px;cursor:pointer;color:#374151;border-bottom:2px solid transparent;white-space:nowrap}
.pc-nav-item:hover,.pc-nav-item.active{color:#7C3AED;border-bottom-color:#7C3AED}
.pc-dropdown{position:absolute;top:100%;left:0;background:#fff;border:1px solid #E5E7EB;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:10;min-width:180px;padding:8px 0}
.pc-dropdown-item{padding:7px 16px;font-size:12px;color:#374151;cursor:pointer}
.pc-dropdown-item:hover{background:#F5F3FF;color:#7C3AED}
.pc-mega{display:flex;gap:0;padding:12px}
.pc-mega-col{min-width:120px;padding:0 12px}
.pc-mega-col-title{font-size:11px;font-weight:600;color:#7C3AED;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid #EDE9FE}
.pc-mega-col-item{padding:4px 0;font-size:12px;color:#374151;cursor:pointer}
.pc-mega-col-item:hover{color:#7C3AED}
.pc-content{flex:1;background:#F9FAFB;min-height:160px;display:flex;align-items:center;justify-content:center;color:#D1D5DB;font-size:12px}
.nav-expand-wrap{background:#F8F7FF;border-radius:10px;padding:16px 20px;margin:2px 0}
.nav-expand-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.nav-expand-title{font-size:13px;font-weight:600;color:#7C3AED}
.l2-indent{display:flex;align-items:center;gap:6px;padding-left:12px;border-left:2px solid #C4B5FD}
.items-count-link{background:rgba(124,58,237,.08);border:none;padding:2px 10px;border-radius:999px;color:#7C3AED;font-size:11px;cursor:pointer;white-space:nowrap;transition:background .15s}
.items-count-link:hover{background:rgba(124,58,237,.18)}
:focus-visible{outline:none;box-shadow:inset 0 0 0 2px rgba(124,58,237,.4)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

/* ── MenuItemsExpanded ── */
function MenuItemsExpanded({ navId, navName, globalMarket, globalChannel, navItems, menuItems, setMenuItems, onDrillL1 }) {
  const [menuDrawerOpen, setMenuDrawerOpen] = React.useState(false);
  const [editingItem, setEditingItem] = React.useState(null);
  const [drawerParentId, setDrawerParentId] = React.useState(null);
  const [dragId, setDragId] = React.useState(null);

  const l1Items = menuItems.filter(m => m.nav_id === navId && m.parent_id === null);
  const parentNav = navItems.find(n => n.id === navId);
  const navLevels = parentNav ? levelsFromNav(parentNav) : '2';

  function openAdd(pid) { setDrawerParentId(pid || null); setEditingItem(null); setMenuDrawerOpen(true); }
  function openEdit(it) { setDrawerParentId(it.parentId || null); setEditingItem(it); setMenuDrawerOpen(true); }

  function handleSaveItem(form) {
    const targetNavId = form.navId || navId;
    if (editingItem) {
      setMenuItems(prev => prev.map(m => m.id === editingItem.id ? { ...m, ...form, nav_id:targetNavId } : m));
      message.success('已保存');
    } else {
      setMenuItems(prev => [...prev, { id:genId('mi'), nav_id:targetNavId, parent_id:drawerParentId||null,
        name:form.name, collection_id:form.collection_id||'', target_url:form.target_url||'',
        target_type:form.target_type||'collection', is_leaf:form.is_leaf, enabled:form.enabled, order:999,
        created_at:new Date().toISOString(), updated_at:new Date().toISOString() }]);
      message.success('已添加');
    }
    setMenuDrawerOpen(false);
  }

  function handleToggle(id, v) { setMenuItems(prev => prev.map(m => m.id===id ? { ...m, enabled:v } : m)); }
  function handleDelete(id) { setMenuItems(prev => prev.filter(m => m.id !== id && m.parentId !== id)); message.success('已删除'); }

  function reorderL2(fromId, toId) {
    setMenuItems(prev => {
      const sibs = prev.filter(m => m.navId === navId && m.parentId === null);
      const fi = sibs.findIndex(m => m.id === fromId);
      const ti = sibs.findIndex(m => m.id === toId);
      if (fi < 0 || ti < 0 || fi === ti) return prev;
      const arr = [...sibs];
      const [moved] = arr.splice(fi, 1);
      arr.splice(ti, 0, moved);
      const sibIds = new Set(arr.map(m => m.id));
      return prev.filter(m => !sibIds.has(m.id)).concat(arr);
    });
  }

  const thS = { background:'#EDE9FE', color:'#6B7280', fontWeight:600, padding:'7px 10px', textAlign:'left', borderBottom:'1px solid #DDD6FE' };
  const tdS = { padding:'8px 10px', borderBottom:'1px solid #EDE9FE' };

  return (
    <div className="nav-expand-wrap">
      <div className="nav-expand-header">
        <span className="nav-expand-title">
          {navName} — 二级导航
          <span style={{ marginLeft:8, fontSize:12, color:'#9CA3AF', fontWeight:400 }}>共 {l1Items.length} 项</span>
        </span>
        <Button size="small" type="primary" icon={<PlusOutlined />} onClick={() => openAdd(null)}>新增二级导航</Button>
      </div>

      {l1Items.length === 0 && (
        <div style={{ textAlign:'center', padding:'20px', color:'#9CA3AF', fontSize:13 }}>暂无二级导航</div>
      )}

      {l1Items.length > 0 && (
        <table style={{ width:'100%', borderCollapse:'collapse', fontSize:12 }}>
          <thead>
            <tr>
              <th style={{ ...thS, width:40 }}>排序</th>
              <th style={thS}>名称</th>
              <th style={{ ...thS, width:100 }}>状态</th>
              <th style={{ ...thS, width:160 }}>操作</th>
            </tr>
          </thead>
          <tbody>
            {l1Items.map((l1, idx) => {
              return (
                <React.Fragment key={l1.id}>
                  <tr style={{ background: dragId===l1.id ? '#FAF5FF' : '#fff', cursor:'default' }}
                    draggable={true}
                    onDragStart={() => setDragId(l1.id)}
                    onDragOver={e => e.preventDefault()}
                    onDrop={() => { if (dragId && dragId !== l1.id) reorderL2(dragId, l1.id); setDragId(null); }}
                    onDragEnd={() => setDragId(null)}
                  >
                    <td style={{ ...tdS, width:40, textAlign:'center' }}>
                      <HolderOutlined style={{ cursor:'grab', color:'#9CA3AF', fontSize:13 }} />
                    </td>
                    <td style={tdS}>
                      <div style={{ display:'flex', alignItems:'center', gap:6 }}>
                        {!l1.is_leaf && onDrillL1
                          ? <a style={{ fontWeight:600, color:'#7C3AED', cursor:'pointer' }} onClick={() => onDrillL1(l1)}>{l1.name} <RightOutlined style={{ fontSize:10 }} /></a>
                          : <span style={{ fontWeight:500 }}>{l1.name}</span>
                        }
                        {l1.is_leaf && <Tag color="blue" style={{ fontSize:10, padding:'0 4px' }}>直跳</Tag>}
                      </div>
                    </td>
                    <td style={tdS}>
                      <Switch size="small" checked={l1.enabled} onChange={v => handleToggle(l1.id,v)} checkedChildren="启用" unCheckedChildren="停用" />
                    </td>
                    <td style={tdS}>
                      <Space size={4}>
                        <Button size="small" icon={<EditOutlined />} onClick={() => openEdit(l1)}>编辑</Button>
                        {l1.enabled ? (
                          <Tooltip title="请先停用再删除">
                            <Button size="small" danger icon={<DeleteOutlined />} disabled />
                          </Tooltip>
                        ) : (
                          <Popconfirm title={'删除 "'+l1.name+'"？'} description={!l1.is_leaf ? '同步删除其下三级导航' : undefined}
                            onConfirm={() => handleDelete(l1.id)} okText="删除" okButtonProps={{ danger:true }} cancelText="取消">
                            <Button size="small" danger icon={<DeleteOutlined />} />
                          </Popconfirm>
                        )}
                      </Space>
                    </td>
                  </tr>

                </React.Fragment>
              );
            })}
          </tbody>
        </table>
      )}

      <MenuItemDrawer open={menuDrawerOpen} item={editingItem} navId={navId} navLevels={navLevels} navItems={navItems}
        globalMarket={globalMarket} globalChannel={globalChannel} menuItems={menuItems}
        parentId={drawerParentId} onClose={() => setMenuDrawerOpen(false)} onSave={handleSaveItem} />
    </div>
  );
}

/* ── NavigationPage ── */
function NavigationPage() {
  const [market, setMarket] = React.useState('US');
  const [channel, setChannel] = React.useState('official');
  const globalMarket = market;
  const globalChannel = channel;
  const [navItems, setNavItems] = React.useState(INIT_NAVS);
  const [menuItems, setMenuItems] = React.useState(() => buildInitMenuItems());
  const [drawerOpen, setDrawerOpen] = React.useState(false);
  const [editingNav, setEditingNav] = React.useState(null);
  const [previewNavId, setPreviewNavId] = React.useState(null);
  const [drillNav, setDrillNav] = React.useState(null);
  const [drillL1, setDrillL1] = React.useState(null);
  const [drillL1DrawerOpen, setDrillL1DrawerOpen] = React.useState(false);
  const [drillL1EditItem, setDrillL1EditItem] = React.useState(null);
  const [dragNavKey, setDragNavKey] = React.useState(null);
  const [dragL3Id, setDragL3Id] = React.useState(null);

  const displayedNavs = navItems.filter(n => n.market === globalMarket && n.channel === globalChannel && n.terminal === 'web');  const enabledNavs = displayedNavs.filter(n => n.enabled);

  React.useEffect(() => {
    const first = enabledNavs[0];
    setPreviewNavId(first ? first.id : null);
    setDrillNav(null);
    setDrillL1(null);
  }, [globalMarket, globalChannel]);

  function handleAddNav() { setEditingNav(null); setDrawerOpen(true); }
  function handleEditNav(nav) { setEditingNav(nav); setDrawerOpen(true); }

  function handleSaveNav(form) {
    if (editingNav) {
      setNavItems(prev => prev.map(n => n.id === editingNav.id ? { ...n, ...form } : n));
      message.success('导航已更新');
    } else {
      setNavItems(prev => [...prev, { id:genId('nav'), market:globalMarket, channel:globalChannel, terminal:'web', order:displayedNavs.length+1, created_at:new Date().toISOString(), ...form }]);
      message.success('导航已添加');
    }
    setDrawerOpen(false);
  }

  function handleDeleteNav(navId) {
    setNavItems(prev => prev.filter(n => n.id !== navId));
    setMenuItems(prev => prev.filter(m => m.navId !== navId));
    message.success('导航已删除');
  }

  function handleToggleNav(navId, enabled) { setNavItems(prev => prev.map(n => n.id === navId ? { ...n, enabled } : n)); }

  function reorderNavs(fromId, toId) {
    setNavItems(prev => {
      const filtered = prev.filter(n => n.market===globalMarket && n.channel===globalChannel && n.terminal==='web');
      const others = prev.filter(n => !(n.market===globalMarket && n.channel===globalChannel && n.terminal==='web'));
      const fi = filtered.findIndex(n => n.id === fromId);
      const ti = filtered.findIndex(n => n.id === toId);
      if (fi < 0 || ti < 0 || fi === ti) return prev;
      const arr = [...filtered];
      const [moved] = arr.splice(fi, 1);
      arr.splice(ti, 0, moved);
      return [...others, ...arr.map((n, i) => ({ ...n, order:i+1 }))];
    });
  }

  function reorderL3(fromId, toId, parentId, navId) {
    setMenuItems(prev => {
      const sibs = prev.filter(m => m.navId === navId && m.parentId === parentId);
      const fi = sibs.findIndex(m => m.id === fromId);
      const ti = sibs.findIndex(m => m.id === toId);
      if (fi < 0 || ti < 0 || fi === ti) return prev;
      const arr = [...sibs];
      const [moved] = arr.splice(fi, 1);
      arr.splice(ti, 0, moved);
      const sibIds = new Set(arr.map(m => m.id));
      return prev.filter(m => !sibIds.has(m.id)).concat(arr);
    });
  }



  const LEVEL_TAG = { '1': ['blue','直跳'], '2': ['purple','两级'], '3': ['volcano','三级'] };

  const columns = [
    {
      title: '', key:'order', width:40,
      render: () => <HolderOutlined style={{ cursor:'grab', color:'#9CA3AF', fontSize:14 }} />,
    },
    {
      title: '名称 (Name)', key:'name',
      render: (_, record) => (
        <div style={{ display:'flex', alignItems:'center', gap:6 }}>
          {!record.is_leaf
            ? <a style={{ fontWeight:600, fontSize:13, color:'#7C3AED', cursor:'pointer' }} draggable={false} onDragStart={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); setDrillNav(record); }}>{record.name}</a>
            : <span style={{ fontWeight:500, fontSize:13, color:'#1F2937' }}>{record.name}</span>
          }
          {!record.is_leaf && <RightOutlined style={{ fontSize:10, color:'#C4B5FD' }} />}
        </div>
      ),
    },
    {
      title: '层级', key:'levels', width:80,
      render: (_, record) => {
        const lv = levelsFromNav(record);
        const [color, text] = LEVEL_TAG[lv] || ['default', lv];
        return <Tag color={color} style={{ fontSize:11 }}>{text}</Tag>;
      },
    },

    {
      title: '状态', key:'status', width:110,
      render: (_, record) => (
        <Switch size="small" checked={record.enabled} onChange={v => handleToggleNav(record.id,v)} checkedChildren="启用" unCheckedChildren="停用" />
      ),
    },
    {
      title: '操作', key:'actions', width:120,
      render: (_, record) => (
        <Space size={6}>
          <Button size="small" icon={<EditOutlined />} onClick={() => handleEditNav(record)}>编辑</Button>
          {record.enabled ? (
            <Tooltip title="请先停用再删除">
              <Button size="small" danger icon={<DeleteOutlined />} disabled />
            </Tooltip>
          ) : (
            <Popconfirm title={'删除 "'+record.name+'"？'} description="将同步删除该导航下所有二级/三级项。"
              onConfirm={() => handleDeleteNav(record.id)} okText="删除" okButtonProps={{ danger:true }} cancelText="取消">
              <Button size="small" danger icon={<DeleteOutlined />} />
            </Popconfirm>
          )}
        </Space>
      ),
    },
  ];

  /* ── L3 drill view ── */
  if (drillNav && drillL1) {
    const l2Items = menuItems.filter(m => m.nav_id === drillNav.id && m.parent_id === drillL1.id);
    return (
      <div>
        <div style={{ display:'flex', alignItems:'center', gap:6, marginBottom:20 }}>
          <a style={{ color:'#7C3AED', cursor:'pointer', fontSize:13 }} onClick={() => { setDrillNav(null); setDrillL1(null); }}>导航配置</a>
          <span style={{ color:'#9CA3AF', fontSize:13 }}>/</span>
          <a style={{ color:'#7C3AED', cursor:'pointer', fontSize:13 }} onClick={() => setDrillL1(null)}>{drillNav.name}</a>
          <span style={{ color:'#9CA3AF', fontSize:13 }}>/</span>
          <span style={{ fontSize:13, fontWeight:600, color:'#1F2937' }}>{drillL1.name}</span>
          <DimBadge market={globalMarket} channel={globalChannel} />
        </div>
        <div style={{ display:'flex', flexDirection:'row', gap:24, alignItems:'flex-start' }}>
          <div style={{ flex:1, minWidth:0 }}>
            <div className="nav-expand-wrap">
              <div className="nav-expand-header">
                <span className="nav-expand-title">
                  {drillL1.name} — 三级导航
                  <span style={{ marginLeft:8, fontSize:12, color:'#9CA3AF', fontWeight:400 }}>共 {l2Items.length} 项</span>
                </span>
                <Button size="small" type="primary" icon={<PlusOutlined />} onClick={() => { setDrillL1EditItem(null); setDrillL1DrawerOpen(true); }}>新增三级导航</Button>
              </div>
              {l2Items.length === 0 && (
                <div style={{ textAlign:'center', padding:'20px', color:'#9CA3AF', fontSize:13 }}>暂无三级导航，点击「新增三级导航」添加</div>
              )}
              {l2Items.length > 0 && (
                <table style={{ width:'100%', borderCollapse:'collapse', fontSize:12 }}>
                  <thead>
                    <tr>
                      {['排序','三级导航名称','状态','操作'].map((t, i) => (
                        <th key={t} style={{ background:'#EDE9FE', color:'#6B7280', fontWeight:600, padding:'7px 10px', textAlign:'left', borderBottom:'1px solid #DDD6FE', width:i===0?80:i===2?100:i===3?110:undefined }}>{t}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {l2Items.map((l2, idx) => (
                      <tr key={l2.id}
                        style={{ background: dragL3Id===l2.id ? '#FAF5FF' : '#fff', cursor:'default' }}
                        draggable={true}
                        onDragStart={() => setDragL3Id(l2.id)}
                        onDragOver={e => e.preventDefault()}
                        onDrop={() => { if (dragL3Id && dragL3Id !== l2.id) reorderL3(dragL3Id, l2.id, drillL1.id, drillNav.id); setDragL3Id(null); }}
                        onDragEnd={() => setDragL3Id(null)}
                      >
                        <td style={{ padding:'8px 10px', borderBottom:'1px solid #EDE9FE', width:40, textAlign:'center' }}>
                          <HolderOutlined style={{ cursor:'grab', color:'#9CA3AF', fontSize:13 }} />
                        </td>
                        <td style={{ padding:'8px 10px', borderBottom:'1px solid #EDE9FE' }}>
                          <div className="l2-indent">
                            <span style={{ fontWeight:500 }}>{l2.name}</span>
                            {l2.targetUrl && <span style={{ fontSize:10, color:'#9CA3AF', marginLeft:4 }}>{l2.targetUrl}</span>}
                          </div>
                        </td>
                        <td style={{ padding:'8px 10px', borderBottom:'1px solid #EDE9FE' }}>
                          <Switch size="small" checked={l2.enabled}
                            onChange={v => setMenuItems(prev => prev.map(m => m.id===l2.id ? {...m,enabled:v} : m))}
                            checkedChildren="启用" unCheckedChildren="停用" />
                        </td>
                        <td style={{ padding:'8px 10px', borderBottom:'1px solid #EDE9FE' }}>
                          <Space size={4}>
                            <Button size="small" icon={<EditOutlined />} onClick={() => { setDrillL1EditItem(l2); setDrillL1DrawerOpen(true); }}>编辑</Button>
                            {l2.enabled ? (
                              <Tooltip title="请先停用再删除">
                                <Button size="small" danger icon={<DeleteOutlined />} disabled />
                              </Tooltip>
                            ) : (
                              <Popconfirm title={'删除 "'+l2.name+'"？'} onConfirm={() => setMenuItems(prev=>prev.filter(m=>m.id!==l2.id))} okText="删除" okButtonProps={{ danger:true }} cancelText="取消">
                                <Button size="small" danger icon={<DeleteOutlined />} />
                              </Popconfirm>
                            )}
                          </Space>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              )}
            </div>
            <MenuItemDrawer open={drillL1DrawerOpen} item={drillL1EditItem} navId={drillNav.id} navLevels='3'
              navItems={navItems} globalMarket={globalMarket} globalChannel={globalChannel}
              menuItems={menuItems} parentId={drillL1.id}
              onClose={() => { setDrillL1DrawerOpen(false); setDrillL1EditItem(null); }}
              onSave={form => {
                const targetNavId = form.navId || drillNav.id;
                if (drillL1EditItem) {
                  setMenuItems(prev => prev.map(m => m.id===drillL1EditItem.id ? {...m,...form,nav_id:targetNavId} : m));
                  message.success('已更新');
                } else {
                  setMenuItems(prev => [...prev, { id:genId('mi'), nav_id:targetNavId, parent_id:drillL1.id,
                    name:form.name, collection_id:form.collection_id||'', target_url:form.target_url||'',
                    target_type:form.target_type||'collection', is_leaf:true, enabled:form.enabled, order:999,
                    created_at:new Date().toISOString(), updated_at:new Date().toISOString() }]);
                  message.success('已添加');
                }
                setDrillL1DrawerOpen(false); setDrillL1EditItem(null);
              }}
            />
          </div>
          <div style={{ flexShrink:0 }}>
            <PCPreview enabledNavs={enabledNavs} menuItems={menuItems} previewNavId={drillNav.id} setPreviewNavId={setPreviewNavId} />
          </div>
        </div>
      </div>
    );
  }

  /* ── L2 drill view ── */
  if (drillNav) {
    return (
      <div>
        <div style={{ display:'flex', alignItems:'center', gap:6, marginBottom:20 }}>
          <a style={{ color:'#7C3AED', cursor:'pointer', fontSize:13 }} onClick={() => setDrillNav(null)}>导航配置</a>
          <span style={{ color:'#9CA3AF', fontSize:13 }}>/</span>
          <span style={{ fontSize:13, fontWeight:600, color:'#1F2937' }}>{drillNav.name}</span>
          <DimBadge market={globalMarket} channel={globalChannel} />
        </div>
        <div style={{ display:'flex', flexDirection:'row', gap:24, alignItems:'flex-start' }}>
          <div style={{ flex:1, minWidth:0 }}>
            <MenuItemsExpanded navId={drillNav.id} navName={drillNav.name}
              globalMarket={globalMarket} globalChannel={globalChannel}
              navItems={navItems} menuItems={menuItems} setMenuItems={setMenuItems}
              onDrillL1={l1 => setDrillL1(l1)}
            />
          </div>
          <div style={{ flexShrink:0 }}>
            <PCPreview enabledNavs={enabledNavs} menuItems={menuItems} previewNavId={drillNav.id} setPreviewNavId={setPreviewNavId} />
          </div>
        </div>
      </div>
    );
  }

  /* ── L1 list view ── */
  return (
    <div>
      <div style={{ display:'flex', alignItems:'center', gap:20, padding:'12px 0 20px', borderBottom:'1px solid #E5E7EB', marginBottom:24 }}>
        <div style={{ display:'flex', alignItems:'center', gap:6 }}>
          <span style={{ fontSize:12, color:'#6B7280', whiteSpace:'nowrap' }}>市场</span>
          <Select value={market} options={MARKETS} onChange={setMarket} style={{ width:100 }} size="small" />
        </div>
        <div style={{ display:'flex', alignItems:'center', gap:6 }}>
          <span style={{ fontSize:12, color:'#6B7280', whiteSpace:'nowrap' }}>渠道</span>
          <Select value={channel} options={CHANNELS} onChange={setChannel} style={{ width:100 }} size="small" />
        </div>
        <div style={{ display:'flex', alignItems:'center', gap:6 }}>
          <span style={{ fontSize:12, color:'#6B7280', whiteSpace:'nowrap' }}>终端</span>
          <span style={{ display:'inline-flex', alignItems:'center', padding:'1px 10px', background:'#f5f5f5', border:'1px solid #d9d9d9', borderRadius:6, color:'#595959', fontSize:13, height:24 }}>🖥 PC</span>
        </div>
      </div>
      <div style={{ marginBottom:20 }}>
        <div style={{ fontSize:20, fontWeight:700, color:'#1F2937', marginBottom:4 }}>导航配置 (Navigation Config)</div>
        <div style={{ display:'flex', alignItems:'center', gap:8 }}>
          <span style={{ fontSize:13, color:'#6B7280' }}>PC 端顶部导航，点击名称进入二级配置</span>
          <DimBadge market={globalMarket} channel={globalChannel} />
        </div>
      </div>

      <div style={{ display:'flex', flexDirection:'row', gap:24, alignItems:'flex-start' }}>
        <div style={{ flex:1, minWidth:0 }}>
          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:12 }}>
            <span style={{ fontSize:14, fontWeight:600, color:'#374151' }}>顶部导航 ({displayedNavs.length})</span>
            <Button type="primary" icon={<PlusOutlined />} onClick={handleAddNav}>新增一级导航</Button>
          </div>
          <Card style={CARD_STYLE} styles={{ body:{ padding:0 } }}>
            <Table
              rowKey="id"
              dataSource={displayedNavs}
              columns={columns}
              pagination={false}
              styles={TABLE_STYLES}
              onRow={record => ({
              draggable: true,
              onDragStart: () => setDragNavKey(record.id),
              onDragOver: e => e.preventDefault(),
              onDrop: () => { if (dragNavKey && dragNavKey !== record.id) reorderNavs(dragNavKey, record.id); setDragNavKey(null); },
              onDragEnd: () => setDragNavKey(null),
              onMouseEnter: () => setPreviewNavId(record.id),
            })}

              locale={{ emptyText: (
                <div style={{ padding:'40px 20px', textAlign:'center' }}>
                  <GlobalOutlined style={{ fontSize:32, color:'#D1D5DB', marginBottom:12, display:'block' }} />
                  <div style={{ fontSize:14, fontWeight:600, color:'#1F2937', marginBottom:6 }}>暂无导航</div>
                  <div style={{ fontSize:13, color:'#6B7280' }}>当前维度下尚未添加导航。</div>
                </div>
              ) }}
            />
          </Card>
          <NavDrawer open={drawerOpen} nav={editingNav} navItems={navItems}
            globalMarket={globalMarket} globalChannel={globalChannel}
            onClose={() => setDrawerOpen(false)} onSave={handleSaveNav}
          />
        </div>
        <div style={{ flexShrink:0 }}>
          <div style={{ fontSize:11, color:'#9CA3AF', marginBottom:6, textAlign:'center' }}>PC 预览 — 悬停行更新</div>
          <PCPreview enabledNavs={enabledNavs} menuItems={menuItems} previewNavId={previewNavId} setPreviewNavId={setPreviewNavId} />
        </div>
      </div>
    </div>
  );
}

          display:'flex', alignItems:'center', justifyContent:'space-between',
          position:'sticky', top:0, zIndex:100, padding:'0 24px',
        }}>
          <div style={{ display:'flex', alignItems:'center', gap:12 }}>
            <img src={LOGO_SRC} alt="Looply" style={{ height:28, display:'block' }} onError={e => { e.target.style.display='none'; }} />
            <span style={{ fontSize:12, color:'#9CA3AF', borderLeft:'1px solid #E5E7EB', paddingLeft:12 }}>CMS 后台</span>
          </div>
        </Layout.Header>

        <Layout style={{ flex:1, overflow:'hidden' }}>
          <Layout.Sider width={220} style={{ background:'#fff', borderRight:'1px solid #E5E7EB', overflow:'auto' }}>
            <Menu
              mode="inline"
              selectedKeys={['nav-config']}
              items={[
                { key:'nav-config', icon: React.createElement(GlobalOutlined), label: '导航配置' },
                { key:'collections', icon: React.createElement(TagsOutlined), label: React.createElement('span', null, '合集管理', React.createElement(Tag, {color:'warning', style:{marginLeft:6,fontSize:10,padding:'0 4px',lineHeight:'16px',verticalAlign:'middle'}}, '待上线')), disabled:true },
                { key:'global-config', icon: React.createElement(SettingOutlined), label: React.createElement('span', null, '全局配置', React.createElement(Tag, {color:'warning', style:{marginLeft:6,fontSize:10,padding:'0 4px',lineHeight:'16px',verticalAlign:'middle'}}, '待上线')), disabled:true },
                { key:'search-config', icon: React.createElement(SearchOutlined), label: React.createElement('span', null, '搜索配置', React.createElement(Tag, {color:'warning', style:{marginLeft:6,fontSize:10,padding:'0 4px',lineHeight:'16px',verticalAlign:'middle'}}, '待上线')), disabled:true },
              ]}
              style={{ border:'none', paddingTop:8 }}

          </Layout.Sider>
          <Layout.Content style={{ background:'#F9FAFB', display:'flex', flexDirection:'column', overflow:'auto' }}>

              <Breadcrumb items={[
                { title: React.createElement(HomeOutlined) },
                { title: '导航配置' },
              ]} style={{ fontSize:13 }} />
            </div>
            <div style={{ flex:1, overflowY:'auto', padding:28 }}>
              <NavigationPage />
            </div>
          </Layout.Content>
        </Layout>
      </Layout>
    </ConfigProvider>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
