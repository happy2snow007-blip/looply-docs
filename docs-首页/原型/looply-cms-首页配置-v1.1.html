<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Looply CMS · 首页配置 v1.1</title>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/dayjs@1.11.21/dayjs.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/antd@6.4.3/dist/antd.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/@ant-design/icons@6.2.1/dist/index.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.28.4/babel.min.js"></script>
<style>
html,body,#root{height:100%;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F9FAFB;color:#1F2937}
#root::before{content:'正在加载…';position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#9CA3AF;font-size:14px}
#root:not(:empty)::before{display:none}

.lp-kpi{background:linear-gradient(180deg,#FEFCFF 0%,#F3EEFF 100%);border:1px solid #DDD6FE;border-radius:14px;padding:14px 16px}
.lp-kpi .num{font-size:24px;font-weight:700;color:#7C3AED;line-height:1;margin-bottom:6px;font-variant-numeric:tabular-nums}
.lp-kpi .label{font-size:12px;color:#6B7280}

.lp-form-row{display:flex;gap:16px;margin-bottom:12px;align-items:flex-start}
.lp-form-row .lp-form-label{width:96px;text-align:right;color:#6B7280;font-size:13px;flex-shrink:0;padding-top:6px}
.lp-form-row .lp-form-label .req{color:#DC2626;margin-right:4px}
.lp-form-row .lp-form-control{flex:1}
.lp-helper{font-size:12px;color:#9CA3AF;margin:-4px 0 12px 112px}

.lp-section{font-size:14px;font-weight:600;color:#1F2937;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid #E5E7EB}
.lp-note-sm{padding:10px 14px;background:#F3EEFF;border:1px solid #DDD6FE;border-radius:8px;font-size:12px;color:#6D28D9}
.lp-code{font-family:Menlo,Monaco,Consolas,monospace;font-size:12px;color:#374151;background:#F3F4F6;padding:1px 6px;border-radius:4px}
.lp-upload-zone{border:2px dashed #D1D5DB;border-radius:10px;padding:20px;text-align:center;background:#FAFAFA;cursor:pointer;transition:all .15s}
.lp-upload-zone:hover{border-color:#7C3AED;background:#FAF5FF}
.lp-upload-zone .hint{font-size:13px;color:#6B7280;margin-bottom:4px}
.lp-upload-zone .sub{font-size:12px;color:#9CA3AF}
.placeholder-section{background:#F9FAFB;border:1px dashed #D1D5DB;border-radius:10px;padding:40px;text-align:center;color:#9CA3AF;font-size:13px}
.st-tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:500}

/* ── Editor split layout ── */
.editor-wrap{display:flex;height:100%;min-height:0}
.editor-left{width:52%;min-width:340px;max-width:660px;display:flex;flex-direction:column;overflow:hidden;background:#fff;border-right:1px solid #E5E7EB}
.editor-right{flex:1;display:flex;flex-direction:column;align-items:center;background:#F3F4F6;padding:24px 16px;overflow-y:auto;min-width:400px}

/* ── Zone filter bar (坑位行) ── */
.filter-bar{padding:10px 16px;background:#FAFAFA;border-bottom:1px solid #E5E7EB;flex-shrink:0}
.filter-bar-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.filter-label{font-size:12px;color:#9CA3AF;white-space:nowrap}
.filter-chips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{padding:4px 12px;border-radius:20px;border:1px solid #D1D5DB;font-size:12px;cursor:pointer;font-weight:500;color:#6B7280;background:#fff;transition:all .15s;white-space:nowrap}
.fchip.active{background:#7C3AED;color:#fff;border-color:#7C3AED}

/* ── DimBadge ── */
.dim-badge{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:3px 12px;border-radius:999px;letter-spacing:0.2px;white-space:nowrap}
.dim-badge-blue{background:#2563EB;color:#fff}

/* ── Config list ── */
.config-list-panel{flex:1;overflow-y:auto;padding:14px 16px}
.config-zone-group{margin-bottom:20px}
.config-zone-label{font-size:12px;font-weight:600;color:#7C3AED;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.config-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #E5E7EB;border-radius:10px;margin-bottom:6px;background:#fff;cursor:pointer;transition:all .15s}
.config-row:hover{background:#FAF5FF;border-color:#DDD6FE}
.config-row.active{background:#F3EEFF;border-color:#7C3AED}
.config-thumb{width:44px;height:44px;border-radius:6px;object-fit:cover;background:#E5E7EB;flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.config-thumb img{width:100%;height:100%;object-fit:cover}
.config-name{font-size:13px;font-weight:500;color:#1F2937;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.config-tmpl{font-size:11px;color:#9CA3AF;margin-top:2px}
.config-ops{display:flex;align-items:center;gap:6px;flex-shrink:0}
.order-btn{width:24px;height:24px;border-radius:4px;border:1px solid #E5E7EB;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#6B7280;font-size:10px;transition:all .15s}
.order-btn:hover{border-color:#7C3AED;color:#7C3AED}

/* ── Config editor ── */
.config-editor{flex:1;display:flex;flex-direction:column;overflow:hidden}
.editor-header{padding:12px 16px;border-bottom:1px solid #E5E7EB;display:flex;align-items:center;gap:8px;flex-shrink:0;background:#FAFAFA}
.editor-body{flex:1;overflow-y:auto;padding:16px}
.readonly-badge{background:#F3F4F6;color:#9CA3AF;font-size:11px;padding:2px 8px;border-radius:4px;display:inline-flex;align-items:center;gap:3px}

/* ── Template cards ── */
.tmpl-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.tmpl-card{border:2px solid #E5E7EB;border-radius:10px;padding:10px 12px;cursor:pointer;transition:all .15s;background:#fff}
.tmpl-card:hover{border-color:#DDD6FE;background:#FAF5FF}
.tmpl-card.active{border-color:#7C3AED;background:#FAF5FF}
.tmpl-card .tmpl-name{font-size:12px;font-weight:600;color:#1F2937;margin-bottom:2px}
.tmpl-card .tmpl-desc{font-size:11px;color:#6B7280;line-height:1.4}
.tmpl-badge{display:inline-block;font-size:10px;font-weight:600;padding:1px 6px;border-radius:4px;margin-bottom:4px}
.tmpl-badge-p0{background:#F0FDF4;color:#16A34A;border:1px solid #BBF7D0}
.tmpl-badge-p1{background:#FFFBEB;color:#D97706;border:1px solid #FDE68A}

/* ── Mobile Phone Preview ── */
.phone-frame{width:375px;background:#fff;border-radius:40px;border:8px solid #1F2937;box-shadow:0 20px 60px rgba(0,0,0,.25),inset 0 0 0 2px #374151;overflow:hidden}
.phone-notch{height:28px;background:#1F2937;display:flex;align-items:flex-end;justify-content:center;padding-bottom:2px}
.phone-notch-pill{width:80px;height:18px;background:#000;border-radius:9px}
.phone-screen{height:620px;overflow-y:auto;background:#fff}
.phone-screen::-webkit-scrollbar{display:none}

/* ── PC Browser Preview ── */
.browser-frame{width:680px;background:#fff;border-radius:10px;border:1px solid #D1D5DB;box-shadow:0 12px 40px rgba(0,0,0,.18);overflow:hidden}
.browser-chrome{height:36px;background:#F3F4F6;border-bottom:1px solid #E5E7EB;display:flex;align-items:center;gap:6px;padding:0 12px;flex-shrink:0}
.browser-dots{display:flex;gap:5px}
.browser-dot{width:10px;height:10px;border-radius:50%}
.browser-dot.red{background:#FF5F57}
.browser-dot.yellow{background:#FFBD2E}
.browser-dot.green{background:#28CA41}
.browser-addressbar{flex:1;background:#fff;border:1px solid #E5E7EB;border-radius:4px;height:22px;display:flex;align-items:center;padding:0 8px;gap:4px;font-size:10px;color:#6B7280;margin:0 8px}
.browser-lock{font-size:9px;color:#16A34A}
.browser-screen{height:560px;overflow-y:auto;background:#fff;transform-origin:top left}
.browser-screen::-webkit-scrollbar{display:none}

/* PC preview inner elements — scaled down via CSS on .browser-screen children */
.pc-anno-bar{background:#6432FC;height:20px;display:flex;align-items:center;justify-content:center}
.pc-anno-bar span{font-size:8px;color:#fff;letter-spacing:0.2px}
.pc-navbar{display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:44px;background:#fff;border-bottom:1px solid #E5E7EB;flex-shrink:0}
.pc-navbar-logo{font-size:13px;font-weight:700;color:#6432FC;font-style:italic;letter-spacing:0.5px}
.pc-navbar-links{display:flex;gap:14px}
.pc-navbar-link{font-size:9px;color:#6B6B6B}
.pc-navbar-link.active{color:#1A1A1A;font-weight:600}
.pc-navbar-right{display:flex;align-items:center;gap:10px}
.pc-hero{position:relative;width:100%;height:220px;overflow:hidden}
.pc-hero img,.pc-hero-placeholder{width:100%;height:220px;object-fit:cover;display:block}
.pc-hero-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 20%,rgba(0,0,0,.6) 100%)}
.pc-hero-content{position:absolute;bottom:0;left:32px;padding-bottom:20px}
.pc-hero-eyebrow{font-size:6px;color:#fff;letter-spacing:2px;font-weight:600;margin-bottom:6px}
.pc-hero-title{font-size:18px;font-weight:700;color:#fff;line-height:1.15;margin-bottom:8px}
.pc-hero-cta{display:inline-flex;align-items:center;background:#fff;color:#1F2937;font-size:8px;font-weight:600;padding:5px 12px;border-radius:2px;gap:3px}
.pc-hero-dots{position:absolute;bottom:10px;left:32px;display:flex;gap:5px}
.pc-hero-dot{width:14px;height:5px;border-radius:3px;background:rgba(255,255,255,.5)}
.pc-hero-dot.on{background:#fff}
.pc-trust{display:flex;background:#FAFAFA;padding:18px 32px;gap:0;border-bottom:1px solid #EBEBEB}
.pc-trust-cell{flex:1;display:flex;align-items:center;gap:8px;border-right:1px solid #EBEBEB;padding-right:12px;margin-right:12px}
.pc-trust-cell:last-child{border-right:none}
.pc-trust-icon{font-size:16px;color:#7C3AED}
.pc-trust-text .main{font-size:9px;font-weight:600;color:#1A1A1A}
.pc-trust-text .sub{font-size:7px;color:#6B7280}
.pc-coll{padding:24px 32px;background:#fff}
.pc-coll-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.pc-coll-title{font-size:13px;font-weight:700;color:#1A1A1A}
.pc-coll-see-all{font-size:8px;color:#7C3AED}
.pc-coll-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pc-coll-card{border-radius:4px;overflow:hidden;position:relative;height:140px;background:#E5E7EB}
.pc-coll-card img{width:100%;height:100%;object-fit:cover;display:block}
.pc-coll-card-overlay{position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.55))}
.pc-coll-card-text{position:absolute;bottom:0;left:0;right:0;padding:6px 8px}
.pc-coll-card-name{font-size:8px;font-weight:700;color:#fff;margin-bottom:2px}
.pc-coll-card-cta{font-size:7px;color:rgba(255,255,255,.85)}
.pc-feed{padding:24px 32px;background:#fff}
.pc-feed-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.pc-feed-title{font-size:13px;font-weight:700;color:#1A1A1A}
.pc-feed-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pc-feed-item{border-radius:6px;overflow:hidden;aspect-ratio:3/4;position:relative}

.preview-navbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 8px;background:#fff}
.preview-nav-logo{font-size:14px;font-weight:700;color:#1F2937;letter-spacing:2px}

.preview-banner-section{position:relative;width:100%;overflow:hidden}
.preview-banner-img{width:100%;height:200px;object-fit:cover;display:block}
.preview-banner-placeholder{width:100%;height:200px;display:flex;align-items:center;justify-content:center}
.preview-banner-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.55) 100%)}
.preview-banner-text{position:absolute;bottom:0;left:0;right:0;padding:16px}
.preview-banner-title{font-size:20px;font-weight:700;color:#fff;margin-bottom:4px;line-height:1.2}
.preview-banner-sub{font-size:12px;color:rgba(255,255,255,.85);margin-bottom:10px}
.preview-banner-cta{display:inline-flex;align-items:center;background:#fff;color:#1F2937;font-size:12px;font-weight:600;padding:7px 16px;border-radius:20px;gap:4px}
.preview-banner-dots{position:absolute;bottom:8px;right:12px;display:flex;gap:4px}
.preview-dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.5)}
.preview-dot.on{background:#fff;width:14px;border-radius:3px}
.preview-zone-ring{box-shadow:0 0 0 2px #7C3AED,0 0 0 4px rgba(124,58,237,.15);border-radius:4px;position:relative}
.preview-zone-label{position:absolute;top:0;left:0;background:#7C3AED;color:#fff;font-size:9px;font-weight:700;padding:2px 7px;border-radius:0 0 6px 0;z-index:5;pointer-events:none}

.preview-trust{display:flex;padding:10px 6px;border-bottom:1px solid #F0F0F0}
.preview-trust-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.preview-trust-icon{font-size:15px;color:#7C3AED}
.preview-trust-main{font-size:9px;font-weight:600;color:#1F2937;text-align:center}
.preview-trust-sub{font-size:8px;color:#6B7280;text-align:center}

.preview-coll-section{padding:12px 0}
.preview-coll-title{font-size:13px;font-weight:700;color:#1F2937;padding:0 14px;margin-bottom:10px}
.preview-coll-slide{display:flex;gap:8px;overflow-x:auto;padding:0 14px 4px;scrollbar-width:none}
.preview-coll-slide::-webkit-scrollbar{display:none}
.preview-coll-card{flex-shrink:0;width:130px;border-radius:12px;overflow:hidden;position:relative;background:#E5E7EB}
.preview-coll-card-img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.preview-coll-card-placeholder{width:100%;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center}
.preview-coll-overlay{position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.55))}
.preview-coll-text{position:absolute;bottom:0;left:0;right:0;padding:8px}
.preview-coll-name{font-size:11px;font-weight:700;color:#fff;margin-bottom:3px;line-height:1.2}
.preview-coll-cta{font-size:9px;color:rgba(255,255,255,.85)}

.preview-chip-row{display:flex;gap:6px;overflow-x:auto;padding:0 14px 6px;scrollbar-width:none}
.preview-chip-row::-webkit-scrollbar{display:none}
.preview-chip{background:#F3EEFF;color:#7C3AED;font-size:11px;font-weight:500;padding:5px 12px;border-radius:20px;white-space:nowrap;flex-shrink:0;border:1px solid #DDD6FE}

.preview-feed{padding:12px 14px}
.preview-feed-title{font-size:13px;font-weight:700;color:#1F2937;margin-bottom:10px}
.preview-feed-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.preview-feed-item{border-radius:8px;overflow:hidden;aspect-ratio:3/4;position:relative}

.preview-device-label{font-size:11px;color:#9CA3AF;text-align:center;margin-bottom:10px;font-weight:500}
.preview-zone-pill{background:#7C3AED;color:#fff;font-size:10px;font-weight:600;padding:3px 10px;border-radius:0 0 8px 8px;display:inline-block;margin-bottom:12px}

.thumb-clickable{cursor:zoom-in}
:focus-visible{outline:none;box-shadow:inset 0 0 0 2px rgba(124,58,237,.4)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

function PreviewBannerSection({ configs, activeZone, editingCfg }) {

  const coll = cfg.collId ? MOCK_COLLECTIONS.find(c=>c.id===cfg.collId) : null;

// CONFIG EDITOR
// ══════════════════════════════════════════════════════════════
function ConfigEditor({ cfg, market, channel, terminal, onSave, onCancel, onLiveUpdate }) {
  const [form, setForm] = useState({ ...cfg });
  const [tmplConfirm, setTmplConfirm] = useState({open:false,pending:null});
  const zoneObj = ZONES.find(z=>z.key===cfg.zone)||{};
  const allowedTmpls = TEMPLATES.filter(t=>t.zone.includes(cfg.zone));
  const isVideo = form.template==='banner_video';
  const isChip  = form.template==='collection_chip';
  const up = (k,v) => { const next={...form,[k]:v}; setForm(next); onLiveUpdate && onLiveUpdate(next); };
  const coll = form.collId ? MOCK_COLLECTIONS.find(c=>c.id===form.collId) : null;

  useEffect(() => { onLiveUpdate && onLiveUpdate(form); }, []);

  function selectTemplate(tkey) {
    if (form.template && form.template!==tkey && (form.img||form.title||form.collId)) {
      setTmplConfirm({open:true,pending:tkey});
    } else {
      up('template',tkey);
    }
  }

  return (
    <div className="config-editor">
      <div className="editor-header">
        <div style={{flex:1,minWidth:0}}>
          <div style={{marginBottom:4}}>
            <DimBadge market={market} channel={channel} terminal={terminal} />
          </div>
          <Input
            value={form.name||''}
            onChange={e=>up('name',e.target.value)}
            placeholder="配置名称（内部备注）"
            bordered={false}
            style={{padding:0,fontSize:14,fontWeight:600,color:'#1F2937'}}
          />
        </div>
        <StatusTag status={computeStatus(form)} />
        <Button size="small" onClick={onCancel}>取消</Button>
        <Button type="primary" size="small" icon={<CheckOutlined />} onClick={()=>onSave(form)}>保存</Button>
      </div>

      <div className="editor-body">
        <SectionTitle>基本信息（已锁定）</SectionTitle>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr 1fr',gap:8,marginBottom:16}}>
          <div>
            <div style={{fontSize:11,color:'#9CA3AF',marginBottom:4}}>市场 (Market)</div>
            <Select value={market} options={MARKETS} disabled style={{width:'100%'}} size="small" />
          </div>
          <div>
            <div style={{fontSize:11,color:'#9CA3AF',marginBottom:4}}>渠道 (Channel)</div>
            <Select value={channel} options={CHANNELS} disabled style={{width:'100%'}} size="small" />
          </div>
          <div>
            <div style={{fontSize:11,color:'#9CA3AF',marginBottom:4}}>终端 (Terminal)</div>
            <span style={{display:'inline-flex',alignItems:'center',padding:'1px 10px',background:'#f5f5f5',border:'1px solid #d9d9d9',borderRadius:6,color:'#595959',fontSize:13,height:24}}>{terminal==='pc'?'🖥 PC':'📱 App'}</span>
          </div>
          <div>
            <div style={{fontSize:11,color:'#9CA3AF',marginBottom:4}}>坑位</div>
            <ReadonlyField value={zoneObj.name} />
          </div>
        </div>

        <SectionTitle>模板样式</SectionTitle>
        <div className="tmpl-grid">
          {allowedTmpls.map(t=>(
            <div key={t.key} className={`tmpl-card${form.template===t.key?' active':''}`} onClick={()=>selectTemplate(t.key)}>
              <span className={`tmpl-badge ${t.mvp==='P0'?'tmpl-badge-p0':'tmpl-badge-p1'}`}>{t.mvp}</span>
              <div className="tmpl-name">{t.name}</div>
              <div className="tmpl-desc">{t.desc}</div>
            </div>
          ))}
        </div>

        {form.template && (<>
          <SectionTitle>素材与内容</SectionTitle>

          {isVideo ? (<>
            <FormRow label="视频素材" required>
              <UploadZone label="上传视频" sub="MP4，建议 ≤ 20MB" />
            </FormRow>
            <FormRow label="封面帧" required>
              {form.img
                ? <div style={{position:'relative',display:'inline-block'}}>
                    <img src={form.img} alt="" style={{width:80,height:50,borderRadius:6,objectFit:'cover',border:'1px solid #E5E7EB'}} />
                    <Button size="small" type="text" danger style={{position:'absolute',top:1,right:1,padding:2,height:'auto',minWidth:'auto'}} onClick={()=>up('img','')}>✕</Button>
                  </div>
                : <UploadZone label="上传封面帧" sub="视频加载前展示" />
              }
            </FormRow>
          </>) : !isChip ? (
            <FormRow label="素材图片" required>
              {form.img
                ? <div style={{position:'relative',display:'inline-block'}}>
                    <img src={form.img} alt="" style={{width:80,height:80,borderRadius:6,objectFit:'cover',border:'1px solid #E5E7EB'}} />
                    <Button size="small" type="text" danger style={{position:'absolute',top:1,right:1,padding:2,height:'auto',minWidth:'auto'}} onClick={()=>up('img','')}>✕</Button>
                  </div>
                : <UploadZone label="上传图片" sub="JPG/PNG/WebP，规格见 §6.1" />
              }
            </FormRow>
          ) : null}

          <FormRow label="关联合集" required>
            <Select
              style={{width:'100%'}}
              placeholder="选择合集（按市场过滤）…"
              value={form.collId||undefined}
              onChange={v=>{ up('collId',v); }}
              options={MOCK_COLLECTIONS.filter(c=>c.market===market).map(c=>({value:c.id,label:c.title}))}
            />
          </FormRow>
          {coll && (
            <FormRow label="落地页">
              <ReadonlyField value={coll.page} href={coll.pageUrl} />
              <div className="lp-helper" style={{margin:'4px 0 0'}}>自动从合集读取，点击名称可预览跳转</div>
            </FormRow>
          )}

          <FormRow label="标题">
            <Input value={form.title||''} placeholder="标题文案（字符数限制待定）" onChange={e=>up('title',e.target.value)} />
          </FormRow>
          {!isChip && (
            <FormRow label="副标题">
              <Input value={form.subtitle||''} placeholder="副标题（字符数限制待定）" onChange={e=>up('subtitle',e.target.value)} />
            </FormRow>
          )}
          {!isChip && (
            <FormRow label="按钮文案" help="留空不渲染按钮">
              <Input value={form.cta||''} placeholder="留空不显示" onChange={e=>up('cta',e.target.value)} />
            </FormRow>
          )}
          {!isChip && (
            <FormRow label="文字颜色">
              <Radio.Group value={form.textColor||'light'} onChange={e=>up('textColor',e.target.value)} size="small" buttonStyle="solid">
                <Radio.Button value="light">浅色（白）</Radio.Button>
                <Radio.Button value="dark">深色（黑）</Radio.Button>
              </Radio.Group>
            </FormRow>
          )}

          <SectionTitle>生效时间</SectionTitle>
          <FormRow label="开始时间" help="留空 = 上线开关打开即生效">
            <DatePicker showTime style={{width:'100%'}} placeholder="留空立即生效" />
          </FormRow>
          <FormRow label="结束时间" help="留空 = 永久有效">
            <DatePicker showTime style={{width:'100%'}} placeholder="留空永久有效" />
          </FormRow>
          <div className="lp-note-sm">保存后需在配置列表手动打开上线开关，配置才会在 C 端展示。</div>
        </>)}
      </div>

      <Modal open={tmplConfirm.open} title="切换模板" closable={false} maskClosable={false} centered={true}
        footer={[
          <Button key="c" onClick={()=>setTmplConfirm({open:false,pending:null})}>取消</Button>,
          <Button key="ok" type="primary" danger onClick={()=>{
            const next={...form,template:tmplConfirm.pending,img:'',title:'',subtitle:'',cta:'',collId:''};
            setForm(next); onLiveUpdate&&onLiveUpdate(next);
            setTmplConfirm({open:false,pending:null});
          }}>确认切换</Button>,
        ]}>
        <p>切换模板将<strong>清空</strong>已填参数，确认继续？</p>
      </Modal>
    </div>
  );
}

// ZONE EDITOR PAGE — filter bar + config list + editor + preview
// ══════════════════════════════════════════════════════════════
function ZoneEditorPage({ globalMarket, globalChannel, globalTerminal }) {
  const market   = globalMarket;
  const channel  = globalChannel;
  const terminal = globalTerminal;
  const [selZone,  setSelZone]  = useState('home_banner');
  const [configs, setConfigs]   = useState(()=>{
    const src = INIT_CONFIGS['US:official:app'] || {};
    return {
      home_banner:     (src.home_banner||[]).map(c=>({...c})),
      home_collection: (src.home_collection||[]).map(c=>({...c})),
    };
  });
  const [editingId,   setEditingId]   = useState(null);
  const [editingZone, setEditingZone] = useState(null);
  const [livePreview, setLivePreview] = useState(null);
  const [deleteModal, setDeleteModal] = useState({open:false,id:null,zone:null});
  const [imgPreview,  setImgPreview]  = useState(null);

  useEffect(()=>{
    const src = INIT_CONFIGS[`${market}:${channel}:${terminal}`]||{};
    setConfigs({
      home_banner:     (src.home_banner||[]).map(c=>({...c})),
      home_collection: (src.home_collection||[]).map(c=>({...c})),
    });
    setEditingId(null); setEditingZone(null); setLivePreview(null);
  }, [market, channel, terminal]);

  const allConfigs = Object.values(configs).flat();
  const onlineCount = allConfigs.filter(c=>computeStatus(c)==='active').length;

  function startEdit(id, zone) {
    const cfg = (configs[zone]||[]).find(c=>c.id===id);
    if (!cfg) return;
    setEditingId(id); setEditingZone(zone); setLivePreview({...cfg});
  }
  function startNew(zone) {
    const newId = 'new_'+Date.now();
    const newCfg = { id:newId, zone, template:'', name:'', img:'', collId:'', online:false,
      startTime:'', endTime:'', title:'', subtitle:'', cta:'', textColor:'light',
      order:(configs[zone]||[]).length+1 };
    setConfigs(p=>({...p,[zone]:[...(p[zone]||[]),newCfg]}));
    setEditingId(newId); setEditingZone(zone); setLivePreview({...newCfg});
  }
  function handleSave(updated) {
    setConfigs(p=>({...p,[updated.zone]:(p[updated.zone]||[]).map(c=>c.id===updated.id?{...updated}:c)}));
    setEditingId(null); setEditingZone(null); setLivePreview(null);
    message.success('保存成功');
  }
  function handleCancel() {
    if (editingId&&editingId.startsWith('new_')) {
      setConfigs(p=>({...p,[editingZone]:(p[editingZone]||[]).filter(c=>c.id!==editingId)}));
    }
    setEditingId(null); setEditingZone(null); setLivePreview(null);
  }
  function toggleOnline(id, zone) {
    setConfigs(p=>({...p,[zone]:(p[zone]||[]).map(c=>c.id===id?{...c,online:!c.online}:c)}));
  }
  function moveOrder(id, zone, dir) {
    setConfigs(p=>{
      const arr=[...(p[zone]||[])];
      const idx=arr.findIndex(c=>c.id===id);
      if(idx<0) return p;
      if(dir==='up'&&idx===0) return p;
      if(dir==='down'&&idx===arr.length-1) return p;
      const swap=dir==='up'?idx-1:idx+1;
      [arr[idx],arr[swap]]=[arr[swap],arr[idx]];
      return {...p,[zone]:arr};
    });
  }
  function handleDelete(id, zone) {
    setConfigs(p=>({...p,[zone]:(p[zone]||[]).filter(c=>c.id!==id)}));
    setDeleteModal({open:false,id:null,zone:null});
    message.success('已删除');
  }

  const editingCfgForPreview = editingId&&livePreview ? livePreview : null;
  const previewActiveZone = editingZone || selZone || null;
  const zone = ZONES.find(z=>z.key===selZone);
  const zoneCfgs = configs[selZone]||[];
  const maxReached = zoneCfgs.length >= (zone?.maxConfigs||999);

  return (
    <div className="editor-wrap" style={{height:'100%'}}>
      {/* ── Left ── */}
      <div className="editor-left">
        {/* 坑位选择 */}
        <div className="filter-bar">
          <div className="filter-bar-row">
            <span className="filter-label">坑位</span>
            <div className="filter-chips">
              {ZONES.map(z=>(
                <div key={z.key}
                  className={`fchip${selZone===z.key?' active':''}`}
                  onClick={()=>{ setSelZone(z.key); setEditingId(null); setEditingZone(null); setLivePreview(null); }}>
                  {z.name}
                  <span style={{marginLeft:3,opacity:.7,fontSize:10}}>
                    ({(configs[z.key]||[]).filter(c=>computeStatus(c)==='active').length})
                  </span>
                </div>
              ))}
            </div>
          </div>
        </div>

        {/* Config list or editor */}
        {editingId && editingZone
          ? <ConfigEditor
              cfg={(configs[editingZone]||[]).find(c=>c.id===editingId)||{id:editingId,zone:editingZone}}
              market={market} channel={channel} terminal={terminal}
              onSave={handleSave} onCancel={handleCancel}
              onLiveUpdate={(upd)=>setLivePreview(upd)}
            />
          : <div className="config-list-panel">
              {/* KPI row */}
              <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8,marginBottom:14}}>
                <Kpi num={onlineCount} label="生效中" />
                <Kpi num={allConfigs.filter(c=>computeStatus(c)==='paused').length} label="已暂停" />
                <Kpi num={allConfigs.length} label="配置总数" />
              </div>

              {zone && (
                <div className="config-zone-group">
                  <div className="config-zone-label">
                    <AppstoreOutlined />
                    {zone.name}
                    <span style={{color:'#9CA3AF',fontWeight:400,fontSize:11}}>
                      · {zoneCfgs.filter(c=>computeStatus(c)==='active').length} 生效 / 上限 {zone.maxConfigs}
                    </span>
                    <Button
                      type="primary" size="small" icon={<PlusOutlined />}
                      disabled={maxReached}
                      title={maxReached?'已达配置上限，需先下线一个现有配置':''}
                      onClick={()=>startNew(zone.key)}
                      style={{marginLeft:'auto'}}>
                      新建配置
                    </Button>
                  </div>
                  {zoneCfgs.length===0
                    ? <div style={{padding:'20px 0',textAlign:'center',color:'#9CA3AF',fontSize:12,border:'1px dashed #E5E7EB',borderRadius:8}}>
                        暂无配置 · 点击「新建配置」开始
                      </div>
                    : zoneCfgs.map((cfg)=>{
                        const status=computeStatus(cfg);
                        const coll=MOCK_COLLECTIONS.find(c=>c.id===cfg.collId);
                        const tmplObj=TEMPLATES.find(t=>t.key===cfg.template);
                        return (
                          <div key={cfg.id} className={`config-row${editingId===cfg.id?' active':''}`}
                            onClick={()=>startEdit(cfg.id,zone.key)}>
                            <div className="config-thumb" onClick={e=>{
                              if(cfg.img){e.stopPropagation();setImgPreview(cfg.img);}
                            }}>
                              {cfg.img
                                ? <img src={cfg.img} alt="" className={cfg.img?'thumb-clickable':''} />
                                : <FileImageOutlined style={{color:'#D1D5DB',fontSize:16}} />
                              }
                            </div>
                            <div style={{flex:1,minWidth:0}}>
                              <div className="config-name">{cfg.name||'(未命名)'}</div>
                              <div className="config-tmpl">{tmplObj?tmplObj.name:'未选模板'}{coll?' · '+coll.title:''}</div>
                            </div>
                            <StatusTag status={status} />
                            <div className="config-ops" onClick={e=>e.stopPropagation()}>
                              <Tooltip title={cfg.online?'点击下线':'点击上线'}>
                                <Switch size="small" checked={cfg.online} onChange={()=>toggleOnline(cfg.id,zone.key)} />
                              </Tooltip>
                              <Tooltip title="上移"><div className="order-btn" onClick={()=>moveOrder(cfg.id,zone.key,'up')}><UpOutlined /></div></Tooltip>
                              <Tooltip title="下移"><div className="order-btn" onClick={()=>moveOrder(cfg.id,zone.key,'down')}><DownOutlined /></div></Tooltip>
                              {status !== 'active' && (
                                <Tooltip title="删除">
                                  <Button size="small" danger icon={<DeleteOutlined />}
                                    onClick={()=>setDeleteModal({open:true,id:cfg.id,zone:zone.key})} />
                                </Tooltip>
                              )}
                              <Tooltip title="编辑">
                                <Button size="small" icon={<EditOutlined />} onClick={()=>startEdit(cfg.id,zone.key)} />
                              </Tooltip>
                            </div>
                          </div>
                        );
                      })
                  }
                </div>
              )}
            </div>
        }
      </div>

      {/* ── Right: preview ── */}
      <div className="editor-right">
        <PreviewPanel
          terminal={terminal}
          activeZone={previewActiveZone}
          configs={configs}
          editingCfg={editingCfgForPreview}
        />
      </div>

      {/* Modals */}
      <Modal open={deleteModal.open} title="删除配置" closable={false} maskClosable={false} centered={true}
        footer={[
          <Button key="c" onClick={()=>setDeleteModal({open:false,id:null,zone:null})}>取消</Button>,
          <Button key="ok" danger type="primary" onClick={()=>handleDelete(deleteModal.id,deleteModal.zone)}>确认删除</Button>,
        ]}>
        <p>删除后<strong>不可恢复</strong>，确认删除该配置？</p>
      </Modal>
      <Modal open={!!imgPreview} title="素材预览" closable={false} maskClosable={false} centered={true}
        onCancel={()=>setImgPreview(null)}
        footer={[<Button key="c" onClick={()=>setImgPreview(null)}>关闭</Button>]}
        width={600}>
        {imgPreview && <img src={imgPreview} alt="" style={{width:'100%',borderRadius:8}} />}
      </Modal>
    </div>
  );
}
