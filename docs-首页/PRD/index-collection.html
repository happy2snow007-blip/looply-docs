<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Looply Collection 落地页 PRD</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f7fa;
    color: #333;
    line-height: 1.8;
  }
  .topbar {
    position: sticky; top: 0; z-index: 20;
    background: #fff; border-bottom: 1px solid #e5e7eb;
    padding: 0 24px;
    height: 48px;
    display: flex; align-items: center; gap: 12px;
  }
  .topbar .brand {
    display: flex; align-items: center; gap: 8px;
    text-decoration: none;
  }
  .topbar .logo {
    width: 28px; height: 28px; border-radius: 6px;
    background: #1a1a2e;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 800; color: #4b4acf;
    font-family: Georgia, serif; font-style: italic;
  }
  .topbar .brand-name {
    font-size: 14px; font-weight: 700; color: #1e1e2e;
  }
  .topbar .sep { color: #d1d5db; font-size: 16px; }
  .topbar .title { font-size: 14px; font-weight: 600; color: #1e1e2e; }
  .topbar .vtag {
    background: #ede9fe; color: #6332fb;
    font-size: 11px; padding: 2px 10px; border-radius: 20px; font-weight: 600;
  }
  .topbar .actions { margin-left: auto; display: flex; gap: 6px; }
  .topbar button {
    border: 1px solid #d1d5db; background: #fff; color: #555;
    font-size: 12px; padding: 4px 12px; border-radius: 5px;
    cursor: pointer; transition: .12s; text-decoration: none;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .topbar button:hover { background: #f0f0ff; border-color: #6332fb; color: #6332fb; }
  .layout {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    gap: 0;
  }
  .toc {
    position: sticky;
    top: 48px;
    width: 260px;
    height: calc(100vh - 48px);
    overflow-y: auto;
    padding: 24px 16px;
    flex-shrink: 0;
    border-right: 1px solid #e5e7eb;
    background: #fff;
  }
  .toc-title {
    font-size: 11px; font-weight: 700; color: #aaa;
    text-transform: uppercase; letter-spacing: 1px;
    margin-bottom: 12px;
  }
  .toc ul { list-style: none; }
  .toc li { margin: 0; }
  .toc a {
    display: block;
    padding: 4px 8px;
    font-size: 13px;
    color: #555;
    text-decoration: none;
    border-radius: 4px;
    transition: all 0.15s;
    line-height: 1.5;
  }
  .toc a:hover { background: #f0f0ff; color: #6332fb; }
  .toc a.active { background: #ede9fe; color: #6332fb; font-weight: 500; }
  .toc .toc-h1 { padding-left: 8px; font-weight: 600; font-size: 13px; }
  .toc .toc-h2 { padding-left: 8px; }
  .toc .toc-h3 { padding-left: 24px; font-size: 12px; color: #888; }
  .toc .toc-h4 { padding-left: 40px; font-size: 12px; color: #aaa; }
  .toc .toc-toggle {
    display: inline-block; width: 16px; font-size: 10px; color: #aaa;
    cursor: pointer; text-align: center; flex-shrink: 0;
    transition: transform 0.2s; user-select: none;
  }
  .toc .toc-toggle.collapsed { transform: rotate(-90deg); }
  .toc .toc-link-row { display: flex; align-items: center; }
  .toc .toc-link-row a { flex: 1; }
  .toc .toc-children { overflow: hidden; transition: max-height 0.25s ease; }
  .toc .toc-children.collapsed { max-height: 0 !important; }
  .article {
    flex: 1;
    min-width: 0;
    margin: 32px auto;
    padding: 40px 48px;
    max-width: 860px;
  }
  .article h1 { font-size: 26px; margin: 32px 0 16px; color: #1e1e2e; border-bottom: 2px solid #6332fb; padding-bottom: 8px; }
  .article h2 { font-size: 22px; margin: 28px 0 12px; color: #1e1e2e; }
  .article h3 { font-size: 18px; margin: 24px 0 10px; color: #333; }
  .article h4 { font-size: 16px; margin: 20px 0 8px; color: #444; }
  .article p { margin: 8px 0; font-size: 15px; }
  .article ul, .article ol { margin: 8px 0 8px 24px; font-size: 15px; }
  .article li { margin: 4px 0; }
  .article table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 14px; }
  .article th, .article td { border: 1px solid #e5e7eb; padding: 8px 12px; text-align: left; }
  .article th { background: #f8f9fb; font-weight: 600; }
  .article code { background: #f1f5f9; padding: 2px 6px; border-radius: 4px; font-size: 13px; font-family: "SF Mono", Monaco, Consolas, monospace; }
  .article pre { background: #1e1e2e; padding: 16px; border-radius: 8px; overflow-x: auto; margin: 12px 0; }
  .article pre code { background: none; padding: 0; color: #e2e8f0; }
  .article blockquote { border-left: 3px solid #6332fb; padding: 8px 16px; margin: 12px 0; background: #f8f7ff; color: #555; border-radius: 0 6px 6px 0; }
  .article hr { border: none; border-top: 1px solid #e5e7eb; margin: 24px 0; }
  .article strong { font-weight: 600; }
  .article a { color: #6332fb; text-decoration: none; }
  .article a:hover { text-decoration: underline; }
  .loading { text-align: center; padding: 60px; color: #aaa; font-size: 15px; }
  @media (max-width: 768px) {
    .toc { display: none; }
    .article { padding: 20px 16px; margin: 16px; }
    .topbar .actions { display: none; }
  }
</style>
</head>
<body>

<div class="topbar">
  <a class="brand" href="../../index.html">
    <div class="logo">L</div>
    <span class="brand-name">Looply</span>
  </a>
  <span class="sep">/</span>
  <span class="title">Collection 落地页 PRD</span>
  <span class="vtag" id="vtag">v1.5</span>
  <div class="actions">
    <button id="btn-dl-html" onclick="downloadHTML()">⬇ 下载 HTML</button>
    <button id="btn-dl-md" onclick="downloadMD()">⬇ 下载 Markdown</button>
  </div>
</div>

<div class="layout">
  <nav class="toc" id="toc">
    <div class="toc-title">目录</div>
    <ul id="tocList"></ul>
  </nav>
  <div class="article" id="article">
    <div class="loading">加载中…</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
var mdContent = '';
var mdFilename = 'looply-collection-landing-PRD-v1.5.md';

fetch('latest-collection.md?t=' + Date.now())
  .then(function(r) { return r.text(); })
  .then(function(md) {
    mdContent = md;

    var firstLine = md.split('\n')[0] || '';
    var vMatch = firstLine.match(/v(\d+\.\d+)/i);
    if (vMatch) {
      document.getElementById('vtag').textContent = 'v' + vMatch[1];
      mdFilename = 'looply-collection-landing-PRD-v' + vMatch[1] + '.md';
    }

    var article = document.getElementById('article');
    article.innerHTML = marked.parse(md);

    var headings = article.querySelectorAll('h1, h2, h3, h4');
    var items = [];
    headings.forEach(function(h, i) {
      var id = 'heading-' + i;
      h.id = id;
      items.push({ level: parseInt(h.tagName[1]), text: h.textContent, id: id, el: h });
    });

    function buildTree(items) {
      var root = { children: [], level: 0 };
      var stack = [root];
      items.forEach(function(item) {
        var node = { item: item, children: [] };
        while (stack.length > 1 && stack[stack.length - 1].level >= item.level) stack.pop();
        stack[stack.length - 1].children.push(node);
        node.level = item.level;
        stack.push(node);
      });
      return root.children;
    }

    function renderTree(nodes) {
      var ul = document.createElement('ul');
      nodes.forEach(function(node) {
        var li = document.createElement('li');
        var row = document.createElement('div');
        row.className = 'toc-link-row';
        var hasChildren = node.children.length > 0;
        if (hasChildren) {
          var toggle = document.createElement('span');
          toggle.className = 'toc-toggle';
          toggle.textContent = '▼';
          row.appendChild(toggle);
        } else {
          var spacer = document.createElement('span');
          spacer.style.cssText = 'width:16px;display:inline-block;flex-shrink:0';
          row.appendChild(spacer);
        }
        var a = document.createElement('a');
        a.className = 'toc-h' + node.item.level;
        a.href = '#' + node.item.id;
        a.textContent = node.item.text;
        row.appendChild(a);
        li.appendChild(row);
        if (hasChildren) {
          var childUl = renderTree(node.children);
          childUl.className = 'toc-children';
          li.appendChild(childUl);
          toggle.addEventListener('click', function(e) {
            e.stopPropagation();
            var collapsed = childUl.classList.contains('collapsed');
            childUl.classList.toggle('collapsed', !collapsed);
            toggle.classList.toggle('collapsed', !collapsed);
          });
        }
        ul.appendChild(li);
      });
      return ul;
    }

    var tree = buildTree(items);
    var tocList = document.getElementById('tocList');
    tocList.innerHTML = '';
    var rendered = renderTree(tree);
    while (rendered.firstChild) tocList.appendChild(rendered.firstChild);

    var allLinks = tocList.querySelectorAll('a');
    var headingEls = items.map(function(it) { return it.el; });

    function updateActive() {
      var scrollTop = window.scrollY + 80;
      var current = 0;
      headingEls.forEach(function(h, i) { if (h.offsetTop <= scrollTop) current = i; });
      allLinks.forEach(function(a, i) { a.classList.toggle('active', i === current); });
      var activeLink = allLinks[current];
      if (activeLink) {
        var parent = activeLink.closest('.toc-children');
        while (parent) {
          parent.classList.remove('collapsed');
          var tog = parent.previousElementSibling;
          if (tog) { var btn = tog.querySelector('.toc-toggle'); if (btn) btn.classList.remove('collapsed'); }
          parent = parent.parentElement.closest('.toc-children');
        }
      }
    }
    window.addEventListener('scroll', updateActive);
    updateActive();

    allLinks.forEach(function(a) {
      a.addEventListener('click', function(e) {
        e.preventDefault();
        var target = document.getElementById(a.getAttribute('href').slice(1));
        if (target) window.scrollTo({ top: target.offsetTop - 60, behavior: 'smooth' });
      });
    });

    tocList.querySelectorAll('.toc-children').forEach(function(ul) {
      var parentLink = ul.previousElementSibling;
      if (parentLink) {
        var a = parentLink.querySelector('a');
        if (a && (a.classList.contains('toc-h2') || a.classList.contains('toc-h3'))) {
          ul.classList.add('collapsed');
          var tog = parentLink.querySelector('.toc-toggle');
          if (tog) tog.classList.add('collapsed');
        }
      }
    });
  })
  .catch(function() {
    document.getElementById('article').innerHTML = '<div class="loading">文档加载失败，请刷新重试</div>';
  });

function downloadMD() {
  if (!mdContent) return;
  var blob = new Blob([mdContent], { type: 'text/markdown;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = mdFilename;
  a.click();
}

function downloadHTML() {
  var html = document.documentElement.outerHTML;
  var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'looply-collection-landing-PRD-v1.5.html';
  a.click();
}
</script>
</body>
</html>
