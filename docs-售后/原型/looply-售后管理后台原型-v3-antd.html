<head>

<title>Looply 售后管理后台原型 v3</title>

<script crossorigin src="https://cdn.jsdelivr.net/npm/antd@6.4.3/dist/antd.min.js"></script>

<style>
html,body,#root{height:100%;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F9FAFB;color:#1F2937}
#root::before{content:'正在加载 antd 原型……';position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#9CA3AF;font-size:14px}
#root:not(:empty)::before{display:none}
.lp-kpi{background:linear-gradient(180deg,#FEFCFF 0%,#F3EEFF 100%);border:1px solid #DDD6FE;border-radius:14px;padding:14px 16px}
.lp-kpi .num{font-size:24px;font-weight:700;color:#7C3AED;line-height:1;margin-bottom:6px;font-variant-numeric:tabular-nums}
.lp-kpi .label{font-size:12px;color:#6B7280}
.lp-pagination{display:flex;align-items:center;justify-content:center;gap:24px;padding:12px 16px;font-size:13px;color:#6B7280}
.lp-pagination .divider{width:1px;height:20px;background:#E5E7EB}
.lp-tip-trigger{cursor:help;border-bottom:1px dashed #9CA3AF;padding-bottom:1px}
.lp-note{padding:14px;border-radius:10px;background:#F3EEFF;border:1px solid #DDD6FE;color:#6D28D9;font-size:12px;line-height:1.8}
.lp-note-sm{padding:10px 14px;background:#F3EEFF;border:1px solid #DDD6FE;border-radius:8px;font-size:12px;color:#6D28D9;line-height:1.7}
.lp-section-purple{font-size:14px;font-weight:700;color:#7C3AED;margin:0 0 12px}
.lp-section{font-size:15px;font-weight:600;color:#1F2937;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid #E5E7EB}
.lp-oplog-title{font-size:14px;font-weight:700;color:#7C3AED;margin:24px 0 12px}
.lp-empty{display:flex;flex-direction:column;align-items:center;padding:60px 20px;text-align:center}
.lp-empty .icon{font-size:48px;margin-bottom:16px;color:#9CA3AF}
.lp-empty .icon.err{color:#DC2626}
.lp-empty .title{font-size:16px;font-weight:600;color:#1F2937;margin-bottom:8px}
.lp-empty .desc{font-size:13px;color:#6B7280;margin-bottom:24px;max-width:360px}
.lp-form-row{display:flex;gap:16px;margin-bottom:12px;align-items:center}
.lp-form-row:first-of-type{margin-top:8px}
.lp-form-row .lp-form-label{width:112px;text-align:right;color:#6B7280;font-size:13px;flex-shrink:0}
.lp-form-row .lp-form-label .req{color:#DC2626;margin-right:4px}
.lp-form-row .lp-form-control{flex:1}
.lp-helper{font-size:12px;color:#9CA3AF;margin:-4px 0 12px 128px}
.lp-detail{display:grid;grid-template-columns:132px 1fr;gap:10px 16px;font-size:13px;margin-bottom:20px}
.lp-detail .dl{color:#6B7280}
.lp-detail .dv{color:#1F2937}
.lp-code{font-family:Menlo,Monaco,Consolas,monospace;font-size:12px;color:#374151;background:#F3F4F6;padding:1px 6px;border-radius:4px}
.lp-preview{border:1px solid #E5E7EB;border-radius:14px;padding:16px;background:#fff}
.lp-preview-line{display:flex;justify-content:space-between;gap:20px;padding:10px 0;border-bottom:1px solid #E5E7EB;font-size:13px}
.lp-preview-line:last-child{border-bottom:none}
.lp-preview-line .muted{color:#6B7280}
.lp-preview-line .total{font-size:15px;font-weight:700;color:#7C3AED}
.lp-thumb-grid{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:12px}
.lp-thumb-wrap{width:104px;display:flex;flex-direction:column;gap:6px;align-items:center}
.lp-thumb{width:104px;height:104px;border-radius:10px;background:#F3F4F6;border:1px solid #E5E7EB;display:flex;align-items:center;justify-content:center;color:#9CA3AF;font-size:30px;cursor:pointer}
.lp-thumb:hover{border-color:#DDD6FE;background:#FAF5FF;color:#7C3AED}
.lp-thumb-cap{font-size:11px;color:#6B7280;text-align:center;line-height:1.4;word-break:break-all}
.lp-blank{border:1px dashed #D1D5DB;border-radius:12px;padding:22px;background:#FAFAFA;color:#6B7280;font-size:13px;text-align:center}
.lp-sub{border-radius:12px;background:#FAFAFA;padding:16px 18px;margin-bottom:16px}
:focus-visible{outline:none;box-shadow:inset 0 0 0 2px rgba(124,58,237,.4)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const TAG_COLORS = {
  on: { bg: '#F0FDF4', color: '#16A34A' }, sale: { bg: '#EFF6FF', color: '#2563EB' },
  pending: { bg: '#FFFBEB', color: '#D97706' }, off: { bg: '#F3F4F6', color: '#6B7280' },
  req: { bg: '#FEF2F2', color: '#DC2626' }, warn: { bg: '#FFF1F2', color: '#E11D48' },
};
function StatusTag({ variant, children }) {
  const c = TAG_COLORS[variant] || TAG_COLORS.off;
  return <Tag bordered={false} style={{ background: c.bg, color: c.color, borderRadius: 999,
    padding: '2px 8px', fontSize: 12, lineHeight: '18px', marginInlineEnd: 4 }}>{children}</Tag>;
}
function Kpi({ num, label, onClick }) {
  return <div className="lp-kpi" style={onClick ? { cursor: 'pointer' } : null} onClick={onClick}>
    <div className="label" style={{ marginBottom: 6 }}>{label}</div>
    <div className="num">{num}</div></div>;
}
function TipText({ label, tip }) {
  return <Tooltip title={<div style={{ whiteSpace: 'pre-line', lineHeight: 1.6 }}>{tip}</div>}
    color="#fff" styles={{ body: { color: '#374151', fontSize: 12, padding: '10px 14px' } }}>
    <span className="lp-tip-trigger">{label}</span></Tooltip>;
}
function CompactPagination({ total, current = 1, pageSize = 10 }) {
  const tp = Math.ceil(total / pageSize) || 1;
  const pages = [];
  pages.push({ k: 'prev', label: '<', arrow: true, disabled: current === 1 });
  for (let i = 1; i <= tp; i++) pages.push({ k: i, label: i });
  pages.push({ k: 'next', label: '>', arrow: true, disabled: current === tp });
  return <div className="lp-pagination">
    <span>共 {total.toLocaleString()} 条,每页{' '}
      <Select size="small" value={pageSize} style={{ width: 72, marginInline: 4 }}
        options={[{ value: 10, label: 10 }, { value: 20, label: 20 }, { value: 50, label: 50 }]} />{' '}条</span>
    <div className="divider" />
    <Space size={2}>{pages.map(p => <span key={p.k} style={{ minWidth: 32, height: 32, display: 'inline-flex',
      alignItems: 'center', justifyContent: 'center', borderRadius: 8, fontSize: 13,
      cursor: p.disabled ? 'default' : 'pointer', background: p.k === current ? '#7C3AED' : (p.arrow ? '#fff' : 'transparent'),
      color: p.k === current ? '#fff' : '#374151', border: p.arrow ? '1px solid #E5E7EB' : 'none',
      fontWeight: p.k === current ? 600 : 400, opacity: p.disabled ? 0.35 : 1 }}>{p.label}</span>)}</Space>
    <div className="divider" /><span>第 {current}/{tp} 页</span></div>;
}

/* ===== 工具 ===== */
const money = (sym, n) => sym + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const reasonOf = (code) => { const x = REASONS.find(r => r.code === code); return x ? x : null; };
const reasonLabel = (code) => { const x = reasonOf(code); return x ? x.cn + ' / ' + x.text : '—'; };
const policyOf = (id) => { const x = POLICIES.find(p => p.id === id); return x ? x : null; };
const marketOf = (code) => { const x = MARKETS.find(m => m.value === code); return x ? x : MARKETS[0]; };
const dash = (v) => (v === undefined || v === null || v === '') ? <span style={{ color: '#9CA3AF' }}>—</span> : v;
/* G3 决策 1.1/1.4/1.5 + 9.6:退货服务费实扣仍由运营决定,系统不按责任自动豁免、不按包裹分摊;
   9.6 改为【按政策快照值预填、可手动修改】(推翻上一轮「留空 + 不填不许提交」的做法)。
   本函数只做四则运算,fee 一律取当前输入框的值 */
const refundPreview = (r, fee, deduct, tax) => {
  const base = r.item.paid;
  const f = Number(fee || 0);
  return { base, fee: f, deduct: Number(deduct || 0), tax: Number(tax || 0),
    amount: Math.max(0, base - f - Number(deduct || 0) + Number(tax || 0)) };
};
/* G3 决策 2.1:政策快照 = 建单时对命中政策整条留档(after_sale_order.policy_snapshot)。
   原型用 policySnapDiff 模拟「快照值与当前政策已不同」的情形 */
const snapOf = (r) => {
  const p = policyOf(r.policyId);
  if (!p) return null;
  return { ...p, ...(r.policySnapDiff || {}), snapAt: r.appliedAt };
};
const snapDiffKeys = (r) => Object.keys(r.policySnapDiff || {});
/* G3 决策 9.6:退款弹窗服务费的【预填值】唯一来源 = 建单时的政策快照 policy_snapshot.service_fee_amount。
   ⚠ 仅退款分支预填 0 —— 依据补充口径「补 2」(仅退款货没到、无退货动作、不产生退货物流成本)。
   用户 9.6 结论只说「按 market 政策值预填」,未区分分支,此处 0 是【按补 2 推断】,已在 UI 上标注待确认。
   两种情况都只是【默认值】,运营均可手动改写(不做只读、不做任何按责任的自动置 0 / 豁免联动) */
const snapFee = (r) => {
  if (r.asType === 'refund_only') return 0;
  const s = snapOf(r);
  return s ? Number(s.fee || 0) : 0;
};
/* SLA:交寄时限自「运单号告知买家」起算,审核通过到回填运单之间的等待时间会吃掉买家的交寄时间 */
const hoursSince = (t) => (!t ? null : Math.max(0, Math.round(dayjs(NOW).diff(dayjs(t), 'hour'))));

/* ===== 时间线(after_sale_log 中 is_customer_visible=1 的投影)===== */
function buildTimeline(r) {
  const t = [];
  t.push({ at: r.appliedAt, text: '买家提交售后申请(' + AS_TYPE[r.asType] + ' · ' + reasonLabel(r.reasonCode) + ')' });
  if (r.audit) t.push({ at: r.audit.at, text: '平台审核' + r.audit.result });
  if (r.ship) {
    t.push({ at: r.ship.regAt, text: '已告知退货运单号 ' + r.ship.no + '(' + r.ship.carrier + '),交寄时限自本条起算,请按时交寄' });
    (r.ship.track || []).slice().reverse().forEach(k => t.push({ at: k.at, text: '物流:' + k.st + ' — ' + k.desc }));
  }
  if (r.inspect) t.push({ at: r.inspect.at, text: '验货完成,结论:' + r.inspect.result +
    (r.liability ? ',责任归属:' + LIABILITY[r.liability] : '') +
    (r.inspect.deduct > 0 ? ',扣减 ' + money(r.sym, r.inspect.deduct) : '') });
  if (r.refund && r.refund.refNo) t.push({ at: r.refund.at, text: '退款' +
    (r.refund.status === 'failed' ? '发起' : REFUND_STATUS[r.refund.status].label) +
    ',金额 ' + money(r.sym, r.refund.amount) + ',支付域退款单 ' + r.refund.refNo });
  if (r.refund && r.refund.status === 'failed') t.push({ at: r.refund.failAt,
    text: '支付域回传退款失败,平台正在重新处理(售后单仍为待退款)' });
  if (r.closedAt) t.push({ at: r.closedAt, text: r.closeReason + '。' + REAPPLY_NOTE });
  return t.filter(x => x.at).sort((a, b) => (a.at < b.at ? 1 : -1));
}

    money(r.sym, r.feeQuoted) + '(最终实扣以审核结果为准)', true);

  if (r.audit) add(r.audit.at, r.audit.by, r.audit.result === '通过' ? '审核通过' : '审核驳回',
    '审核意见:' + r.audit.note +

      : ''), true);
  if (r.ship) add(r.ship.regAt, r.operator || 'Lily', '回填运单', '运单号 ' + r.ship.no + ' / ' + r.ship.carrier +

  if (r.ship && (r.ship.track || []).some(k => k.st === '已送达'))
    add(r.ship.track.find(k => k.st === '已送达').at, '系统', '状态推进', '物流已送达,售后单自动推进至待验货', true);
  if (r.inspect) add(r.inspect.at, r.inspect.by, '录入验货', '结论:' + r.inspect.result +

    money(r.sym, r.inspect.deduct) + (r.inspect.deductReason ? '(' + r.inspect.deductReason + ')' : '') +
    ' | 备注:' + r.inspect.note, false);
  if (r.refund && r.refund.refNo) add(r.refund.at, r.refund.by, '发起退款',
    '基准 ' + money(r.sym, r.refund.base) + ' - 服务费(政策快照预填 ' + money(r.sym, snapFee(r)) +
    ',运营可改,本单实扣)' + money(r.sym, r.refund.fee) + ' - 验货扣减 ' +
    money(r.sym, r.refund.deduct) + ' + 退还税费 ' + money(r.sym, r.refund.tax) + ' = ' +
    money(r.sym, r.refund.amount) + ',支付域退款单 ' + r.refund.refNo, true);
  if (r.refund && r.refund.status === 'failed') add(r.refund.failAt, '系统', '退款失败回传',
    '支付域退款单 ' + r.refund.refNo + ' 执行失败:' + r.refund.failReason + '。售后单主状态维持「待退款」,不新增售后单状态', true);
  if (r.closedAt) add(r.closedAt, r.operatorType === '买家' ? '买家' : '系统', '关单',
    '关闭原因:' + (r.closeCode ? CLOSE_REASONS[r.closeCode].label : '') + ' — ' + r.closeReason + '。' + REAPPLY_NOTE, true);
  return out.sort((a, b) => (a.at < b.at ? 1 : -1)).map((x, k) => ({ ...x, i: k + 1 }));
}

/* 1. 审核弹窗
   G3 决策 9.1(推翻上一轮「审核区一律删掉责任判定」的做法):判责时点【按 as_type 动态区分】——
   · 诉求类型 = 退货退款 → 本弹窗【无】责任判定控件(留到验货区);
   · 诉求类型 = 仅退款   → 本弹窗【有】责任判定控件(必填、不预选),且为终判 */
function AuditModal({ open, onClose, record }) {
  const r = record || AS_ORDERS[0];
  const [result, setResult] = useState('pass');
  const [note, setNote] = useState('');
  const [liab, setLiab] = useState(r.liability || undefined);
  const isReturn = r.asType === 'return_refund';
  /* 仅退款分支、且审核通过时才需要落责任判定(驳回单不进入退款链路,无判责对象) */
  const needLiab = !isReturn && result === 'pass';
  return <Modal title="审核售后申请" open={open} onCancel={onClose} closable={false} maskClosable={false} centered width={640}
    footer={[<Button key="c" onClick={onClose}>取消</Button>,
      <Button key="s" type="primary" disabled={needLiab && !liab} onClick={onClose}>提交审核结论</Button>]}>
    <div className="lp-detail" style={{ marginBottom: 12 }}>
      <div className="dl">售后单号</div><div className="dv"><span className="lp-code">{r.id}</span></div>
      <div className="dl">诉求类型</div><div className="dv">{AS_TYPE[r.asType]}
        <span style={{ color: '#6B7280', fontSize: 12, marginLeft: 8 }}>
          判责时点:{LIABILITY_STAGE[r.asType]}(9.1 按分支二分)</span></div>
      <div className="dl">原因码</div><div className="dv">{reasonLabel(r.reasonCode)}</div>
      <div className="dl">买家说明</div><div className="dv">{dash(r.note)}</div>
    </div>
    <FormRow label="审核结论" required>
      <Radio.Group value={result} onChange={e => setResult(e.target.value)}
        options={[{ value: 'pass', label: '通过' }, { value: 'reject', label: '驳回' }]} /></FormRow>
    <FormRow label={result === 'reject' ? '驳回原因' : '审核意见'} required={result === 'reject'}>
      <Input.TextArea rows={3} value={note} onChange={e => setNote(e.target.value)}
        placeholder={result === 'reject' ? '驳回原因将通过邮件与 C 端时间线告知买家' : '审核意见,记入操作日志'} /></FormRow>
    {needLiab && <FormRow label="责任归属" required
      helper={'决策 9.1 分支②:仅退款天然不走验货,责任归属【在本环节落定且为终判】。' +
        '只有平台责任 / 买家责任两类,无预填、无默认值(原因码字典已无 default_liability 字段)。' +
        '判定结果写入 after_sale_order.liability_party'}>
      <Radio.Group value={liab} onChange={e => setLiab(e.target.value)} options={LIABILITY_OPTIONS} /></FormRow>}
    {needLiab && !liab && <Alert style={{ marginBottom: 12 }} type="warning" showIcon
      message="责任归属未选择,无法提交审核结论(仅退款分支后续无验货环节可补判)" />}
    {result === 'pass' && isReturn && <Alert style={{ marginTop: 8 }} type="info" showIcon
      message="退货退款分支:审核只做通过 / 驳回,本环节不落责任判定(决策 9.1 分支①)"
      description={'责任归属留到【验货】环节与验货结论一起录入并终判(1.3:原因码不能直接确定判责,必须验货后决定);' +
        '退货服务费实扣在退款方案上填写,预填建单时的政策快照值、运营可改(决策 9.6),' +
        '系统不按责任推算或豁免(决策 1.1 / 1.5)。两者互相独立 —— liability_party 在 V1 为纯留痕字段,不驱动任何金额。' +
        '申请时已按政策配置值告知买家参考金额 ' + money(r.sym, r.feeQuoted) + '。'} />}
    {result === 'pass' && !isReturn && <Alert style={{ marginTop: 8 }} type="info" showIcon
      message="仅退款分支:责任归属在本环节终判(决策 9.1 分支②)"
      description={'本分支货没到、天然无验货,不存在「验货后再判」的机会,故审核即为唯一且最终的判责时点。' +
        '判定结果不联动任何金额:补 2 已定仅退款不产生退货物流成本,退款方案的服务费预填 0(仍可手填)。'} />}
  </Modal>;
}

    <FormRow label="承运商" required>
      <Select value={carrier} onChange={setCarrier} style={{ width: 260 }} placeholder="选择承运商"

          { value: 'SF Express', label: 'SF Express(顺丰)' }, { value: 'Hongkong Post', label: 'Hongkong Post' }]} /></FormRow>
    <FormRow label="退货地址" helper="取建单时的政策快照(policy_snapshot),不取政策当前值,随邮件与 C 端一并告知买家">
      <Input.TextArea rows={2} value={s ? s.addr : ''} disabled /></FormRow>
    <FormRow label="交寄时限" helper="取政策快照值;起算点 = 本次保存并告知买家运单号的时刻,逾期未交寄系统自动关单">
      <Input value={s ? s.shipDays + ' 天(政策快照 ' + s.id + ',快照于 ' + s.snapAt + ')' : '—'} disabled /></FormRow>
    <Alert style={{ marginTop: 8 }} type="info" showIcon
      message="保存后系统发送邮件告知买家运单号,买家同时可在 C 端自助查看(两个渠道并行);交寄时限自这一刻起算"
      description={REAPPLY_NOTE} />

    <Alert style={{ marginTop: 8 }} type="info" showIcon
      message="责任归属:既不由原因码带出,也不联动任何金额(后果2)"
      description={'1.2 定「扣除金额不和原因码挂钩」+ 9.1 把退货退款分支的判责放在验货 + 1.1 让服务费实扣由运营决定,三者叠加后:' +

    <Alert style={{ marginTop: 8 }} type="warning" showIcon

  </Modal>;
}

/* 4. 退款方案与发起退款弹窗 */
function RefundModal({ open, onClose, record }) {
  const r = record || AS_ORDERS[0];
  /* G3 决策 9.6(推翻上一轮「留空 + 不填不许提交」的自主设计):
     服务费【按 policy_snapshot.service_fee_amount 预填、可手动修改】。
     仍不是只读、仍【不按责任归属推算】、无豁免开关、不按包裹分摊(1.1 / 1.5 未变)。
     ⚠ 仅退款分支预填 0 系按补 2 推断(用户 9.6 结论未区分分支),下方 Alert 已标注待确认 */
  const feeOnly = r.asType === 'refund_only';
  const prefill = snapFee(r);
  const [fee, setFee] = useState(r.refund && r.refund.refNo ? r.refund.fee : prefill);
  const [deduct, setDeduct] = useState(r.inspect ? r.inspect.deduct : 0);
  const [tax, setTax] = useState(Math.max(0, (r.taxOrigin || 0) - (r.taxRefunded || 0)));
  const feeEdited = Number(fee || 0) !== Number(prefill || 0);
  const c = refundPreview(r, fee, deduct, tax);
  const sp = snapOf(r);
  const retry = r.refund && r.refund.status === 'failed';
  return <Modal title={retry ? '重新发起退款' : '退款方案与发起退款'} open={open} onCancel={onClose}
    closable={false} maskClosable={false} centered width={720}
    footer={[<Button key="c" onClick={onClose}>取消</Button>,
      <Button key="s" type="primary" onClick={onClose}>{retry ? '重新发起退款' : '发起退款'}</Button>]}>
    {retry && <Alert style={{ marginBottom: 14 }} type="error" showIcon
      message={'上一次退款执行失败:' + r.refund.failReason}
      description={'支付域退款单 ' + r.refund.refNo + ' 于 ' + r.refund.failAt +
        ' 回传失败。按决策 4.1,售后单主状态不新增「退款失败」,本单仍为「待退款」,可直接重新发起。'} />}
    <FormRow label="退款基准" helper="商品行实付金额(已扣优惠分摊,不含销售税);优惠不追回">
      <Input value={money(r.sym, c.base)} disabled /></FormRow>
    <FormRow label="退货服务费" required
      helper={feeOnly
        ? '决策 9.6 + 补2:预填 0 并可手动修改。仅退款货没到、无退货动作、不产生退货物流成本,故预填值取 0 而非政策值'
        : '决策 9.6:按建单时的政策快照 policy_snapshot.service_fee_amount 预填,运营可手动修改。' +
          '系统仍不计算、不按责任归属推算或豁免、不按包裹分摊(决策 1.1 / 1.5)'}>
      <Space size={12} wrap>
        <InputNumber value={fee} onChange={setFee} min={0} precision={2} prefix={r.sym}
          placeholder="实扣金额" style={{ width: 200 }} />
        <Button size="small" disabled={!feeEdited} onClick={() => setFee(prefill)}>恢复预填值</Button>
        <span style={{ fontSize: 12, color: '#6B7280' }}>
          {feeOnly
            ? '预填 0(补2);本分支不向买家告知服务费'
            : '预填值 = 政策快照 ' + (sp ? sp.id : '—') + ' 的服务费 ' + money(r.sym, prefill) +
              ';申请时告知买家的参考金额 ' + money(r.sym, r.feeQuoted)}
          {feeEdited && <span style={{ color: '#D97706' }}>　已被运营改写(原预填 {money(r.sym, prefill)})</span>}</span>
      </Space></FormRow>
    {feeOnly && <Alert style={{ marginBottom: 12 }} type="warning" showIcon
      message="⚠ 此处为推断,待确认:仅退款分支预填 0"
      description={'用户 9.6 结论原文是「按照 market 配置的政策退货服务费金额预填,但是可以手动修改」,' +

/* ============================================================
   页面 1:售后工单列表
   ============================================================ */
function AfterSaleListPage({ go }) {
  const [mode, setMode] = useState('data');
  const [kw, setKw] = useState('');
  const [orderKw, setOrderKw] = useState('');
  const [typeF, setTypeF] = useState('');
  const [statusF, setStatusF] = useState('');
  const [liabF, setLiabF] = useState('');
  const [marketF, setMarketF] = useState('');
  const [cur, setCur] = useState(null);
  const [auditOpen, setAuditOpen] = useState(false);
  const [shipOpen, setShipOpen] = useState(false);
  const [inspOpen, setInspOpen] = useState(false);
  const [refundOpen, setRefundOpen] = useState(false);
  const [lostOpen, setLostOpen] = useState(false);
  const [overdueOpen, setOverdueOpen] = useState(false);

  const rows = AS_ORDERS.filter(r => {
    if (kw && r.id.toLowerCase().indexOf(kw.toLowerCase()) < 0) return false;
    if (orderKw && r.orderNo.toLowerCase().indexOf(orderKw.toLowerCase()) < 0) return false;
    if (typeF && r.asType !== typeF) return false;
    if (statusF === '__active' && ACTIVE_STATUS.indexOf(r.status) < 0) return false;
    if (statusF && statusF !== '__active' && r.status !== statusF) return false;
    if (liabF && r.liability !== liabF) return false;
    if (marketF && r.market !== marketF) return false;
    return true;
  });
  const cnt = (s) => AS_ORDERS.filter(r => r.status === s).length;
  const activeCnt = AS_ORDERS.filter(r => ACTIVE_STATUS.indexOf(r.status) >= 0).length;
  const openWith = (rec, setter) => { setCur(rec); setter(true); };
  const reset = () => { setKw(''); setOrderKw(''); setTypeF(''); setStatusF(''); setLiabF(''); setMarketF(''); };

  const columns = [
    { title: '售后单号', dataIndex: 'id', width: 155, render: v => <span className="lp-code">{v}</span> },
    { title: '订单号', dataIndex: 'orderNo', width: 155, render: v => <span className="lp-code">{v}</span> },
    { title: '商品行', key: 'item', width: 260, render: (_, r) => <div>
      <div>{r.item.name}</div>
      <div style={{ fontSize: 12, color: '#6B7280', marginTop: 2 }}>{r.item.pid} · 成色快照 {r.item.grade} · 实付 {money(r.sym, r.item.paid)}</div></div> },
    { title: '诉求类型', dataIndex: 'asType', width: 100, render: v => <StatusTag variant={v === 'refund_only' ? 'pending' : 'sale'}>{AS_TYPE[v]}</StatusTag> },
    { title: '原因', dataIndex: 'reasonCode', width: 190, render: v => { const x = reasonOf(v); return x ? <div><div>{x.cn}</div><div style={{ fontSize: 12, color: '#6B7280' }}>{x.text}</div></div> : dash(''); } },
    { title: '状态', dataIndex: 'status', width: 110, render: (v, r) => <div>
      <StatusTag variant={AS_STATUS[v].variant}>{AS_STATUS[v].label}</StatusTag>
      {r.closeCode && <div style={{ fontSize: 12, color: '#6B7280', marginTop: 2 }}>{CLOSE_REASONS[r.closeCode].label}</div>}</div> },
    { title: <TipText label="责任归属" tip={'决策 9.1:判责时点按分支二分。\n· 退货退款 → 审核时不落,验货时判定;\n· 仅退款 → 审核时判定(不走验货);\n· 退回途中丢件 → 标记丢件时判定。\n未到判责节点的单据本列为空是正常的。'} />,
      dataIndex: 'liability', width: 120,
      render: (v, r) => v ? <StatusTag variant={v === 'platform' ? 'req' : 'off'}>{LIABILITY[v]}</StatusTag>
        : <span style={{ color: '#9CA3AF', fontSize: 12 }}>{LIABILITY_STAGE[r.asType]}</span> },
    { title: 'Market', dataIndex: 'market', width: 110, render: v => marketOf(v).label },
    { title: <TipText label="退款金额 / 支付结果" tip={'决策 4.1:售后单主状态机不加「退款失败」。\n支付域退款单失败时在本列展示失败态,主状态仍停在待退款。'} />,
      key: 'amt', width: 165, align: 'right',
      render: (_, r) => r.refund && r.refund.refNo ? <div>
        <div>{money(r.sym, r.refund.amount)}</div>
        <div style={{ marginTop: 2 }}><StatusTag variant={REFUND_STATUS[r.refund.status].variant}>{REFUND_STATUS[r.refund.status].label}</StatusTag></div>
      </div> : dash('') },
    { title: '申请时间', dataIndex: 'appliedAt', width: 155 },
    { title: '操作', key: 'op', width: 200, fixed: 'right', render: (_, r) => {
      const ops = [{ key: 'detail', label: '详情', onClick: () => go('as-detail', r) }];
      if (r.status === 'pending_audit') ops.push({ key: 'audit', label: '审核', onClick: () => openWith(r, setAuditOpen) });
      if (r.status === 'to_ship' || r.status === 'in_transit') ops.push({ key: 'ship', label: '运单', onClick: () => openWith(r, setShipOpen) });
      /* 决策 4.2:退货在途 → 直达待退款(跳过验货),归平台责任 */
      if (r.status === 'in_transit') ops.push({ key: 'lost', label: '标记丢件', onClick: () => openWith(r, setLostOpen) });
      if (r.status === 'to_inspect') ops.push({ key: 'insp', label: '录入验货', onClick: () => openWith(r, setInspOpen) });
      /* 9.2:本期不做拒退 —— 待退款一律走「发起退款」,不再按验货结论分流出拒退入口 */
      const rFailed = r.refund && r.refund.status === 'failed';
      if (r.status === 'to_refund') ops.push({ key: 'refund',
        label: rFailed ? '重新退款' : '发起退款', onClick: () => openWith(r, setRefundOpen) });
      ops.push({ key: 'log', label: '操作日志', onClick: () => go('as-detail', r) });
      const flat = ops.length <= 4 ? ops : ops.slice(0, 3);
      const more = ops.length <= 4 ? [] : ops.slice(3);
      const moreItems = [];
      more.forEach(o => { if (o.danger && moreItems.length) moreItems.push({ type: 'divider' });
        moreItems.push({ key: o.key, label: o.label, danger: o.danger }); });
      return <Space size={6}>
        {flat.map(o => <Button key={o.key} size="small" danger={o.danger} onClick={o.onClick}>{o.label}</Button>)}
        {more.length > 0 && <Dropdown trigger={['click']} menu={{ items: moreItems,
          onClick: ({ key }) => { const t = more.find(o => o.key === key); if (t && t.onClick) t.onClick(); } }}>
          <Button size="small" icon={<EllipsisOutlined />} /></Dropdown>}</Space>;
    } },
  ];

  return <Card style={CARD_STYLE}>
    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 16, marginBottom: 18 }}>
      <div>

            : (r.inspect.result === '与申请一致' ? 'on' : 'pending')}>{r.inspect.result}</StatusTag>

          { k: <TipText label="责任归属(本环节终判)" tip={'决策 9.1 分支①:退货退款在审核时不落判责,\n验货时判定且为终判。\n' +
            '上游:原因码不带出、不预填责任(字典已无该字段)。\n' +
            '下游:本字段不联动任何金额 —— 服务费按政策快照预填后由运营决定(决策 9.6)。\n' +
            '落点:写入 after_sale_order.liability_party,验货表不存该字段。'} />,
            v: r.liability
              ? <span><StatusTag variant={r.liability === 'platform' ? 'req' : 'off'}>{LIABILITY[r.liability]}</StatusTag>
                <span style={{ color: '#6B7280', fontSize: 12 }}>与验货结论一起录入,存于售后单单头</span></span>
              : dash('') },
          { k: '验货备注', v: dash(r.inspect.note) },
          { k: '验货扣减金额', v: r.inspect.deduct > 0 ? money(r.sym, r.inspect.deduct) + ' ' + r.cur : money(r.sym, 0) },
          { k: '扣减原因', v: dash(r.inspect.deductReason) },
          { k: '录入人 / 时间', v: r.inspect.by + '(' + r.inspect.byType + ') · ' + r.inspect.at },
        ]} />
      </div>
      {noOutlet && <Alert style={{ marginBottom: 12 }} type="warning" showIcon
        message={NO_OUTLET_TIP}
        description={'本单验货结论为「' + r.inspect.result + '」。该结论原本的出路是【拒退并把商品退回买家】,' +
          '而 9.2 已定本期不考虑拒退 —— 拒退操作、已拒退状态、拒退原因字段均已删除。' +
          '验货是客观记录、事实已如实录入;但录完之后走什么流程(退不退款、退多少、货怎么处理),当前【无任何承接】。' +
          '已提交用户决策,原型不自行定为「照常退款」。'} />}
      <div style={{ fontSize: 13, color: '#6B7280', marginBottom: 8 }}>验货取证照片({(r.inspect.photos || []).length} 张)</div>
      <div className="lp-thumb-grid">
        {(r.inspect.photos || []).map(x => <div className="lp-thumb-wrap" key={x.i}>
          <div className="lp-thumb" onClick={() => setEvOpen(true)}><PictureOutlined /></div>
          <div className="lp-thumb-cap">{x.name}<br />{x.by} · {x.at.slice(5)}</div></div>)}
      </div>
      <Button icon={<AuditOutlined />} onClick={() => setInspOpen(true)}>修改验货结论</Button>
    </> : <>
      <div className="lp-note-sm" style={{ marginBottom: 12 }}>
        验货在线下当地仓完成并回传在线表格,运营核对表格后在此录入。系统只承接结论,不承接仓库作业。
        V1 不对接在线表格,录入表单已按其字段设计。<b>责任归属与验货结论一起录入并终判</b>(决策 9.1 分支①),
        退货退款分支的审核环节不判责。
      </div>
      <div className="lp-blank">
        {r.status === 'to_inspect' ? '货已到仓,等待运营核对在线表格后录入验货结论' : '货未到仓,尚不能录入验货结论'}</div>
      <Button type="primary" disabled={r.status !== 'to_inspect'} style={{ marginTop: 12 }}
        icon={<AuditOutlined />} onClick={() => setInspOpen(true)}>录入验货结论</Button>
    </>)}
  </div>;

  /* --- 退款方案区 --- */
  const rf = r.refund;
  /* 决策 9.6:服务费按建单时的政策快照值预填(仅退款分支按补 2 预填 0),运营在退款弹窗内可改。
     未发起退款时,本区按预填值试算;已发起的展示实际成交值 */
  const settled = !!(rf && rf.refNo);
  const feePre = snapFee(r);
  const preview = refundPreview(r, feePre, r.inspect ? r.inspect.deduct : 0,
    Math.max(0, (r.taxOrigin || 0) - (r.taxRefunded || 0)));
  const shown = settled ? rf : preview;
  const refundSection = <div style={{ marginBottom: 24 }}>
    <h4 className="lp-section">退款方案与执行</h4>
    <div className="lp-preview" style={{ marginBottom: 12 }}>
      <div className="lp-preview-line"><span className="muted">退款基准(商品行实付,已扣优惠分摊)</span><span>{money(r.sym, shown.base)}</span></div>
      <div className="lp-preview-line">
        <span className="muted">退货服务费{settled ? '实扣(成交值)'
          : '(政策快照预填' + (isReturn ? '' : ' 0,补 2') + ',运营可改)'}</span>
        <span>- {money(r.sym, shown.fee)}</span></div>
      <div className="lp-preview-line"><span className="muted">验货扣减</span><span>- {money(r.sym, shown.deduct)}</span></div>
      <div className="lp-preview-line"><span className="muted">退还税费(按订单号累计校验)</span><span>+ {money(r.sym, shown.tax)}</span></div>
      <div className="lp-preview-line"><span className="muted">
        {settled ? '最终退款金额' : '试算金额(服务费按预填值试算,以退款弹窗内实际填写为准)'}({r.cur})</span>
        <span className="total">{money(r.sym, shown.amount)}</span></div>
    </div>
    {noOutlet && r.status === 'to_refund' && <Alert style={{ marginBottom: 12 }} type="warning" showIcon
      message={NO_OUTLET_TIP}
      description={'本单验货结论为「' + r.inspect.result + '」。9.2 已定本期不做拒退,原「不予退款 + 退回买家」的出口已删除;' +
        '本单是否照常退款、退多少、货怎么处理,当前无定论。已提交用户决策 —— 原型保留「发起退款」按钮只是不阻断流程,' +
        '不代表已定为照常退款。'} />}
    {refundFailed && <Alert style={{ marginBottom: 12 }} type="error" showIcon
      message={'支付域退款单执行失败:' + rf.failReason}
      description={'失败回传时间 ' + rf.failAt + '。按决策 4.1,售后单主状态机不增加「退款失败」状态 —— ' +
        '本单主状态仍为「' + AS_STATUS[r.status].label + '」,失败信息只作为支付域退款单结果展示,可直接重新发起。'} />}
    <div className="lp-sub">
      <DetailGrid rows={[
        { k: '售后单主状态', v: <span><StatusTag variant={st.variant}>{st.label}</StatusTag>
          <span style={{ color: '#6B7280', fontSize: 12 }}>不随支付域退款结果变化(决策 4.1)</span></span> },
        { k: <TipText label="支付域退款单状态" tip={'展示的是支付域 refund_order 的执行状态,\n不是售后单状态。含失败态与失败原因。'} />,
          v: rf ? <StatusTag variant={REFUND_STATUS[rf.status].variant}>{REFUND_STATUS[rf.status].label}</StatusTag>
            : <StatusTag variant="off">待发起</StatusTag> },
        { k: '支付域退款单号', v: rf && rf.refNo ? <span className="lp-code">{rf.refNo}</span> : dash('') },
        { k: '失败原因', v: refundFailed ? <span style={{ color: '#DC2626' }}>{rf.failReason}</span> : dash('') },
        { k: '退款到账时间', v: rf && rf.status === 'done' && rf.at ? rf.at : dash('') },
        { k: '定案人', v: rf && rf.by ? rf.by + '(' + rf.byType + ')' : dash('') },
        { k: '本订单税费', v: '原销售税 ' + money(r.sym, r.taxOrigin) + ' / 已退 ' + money(r.sym, r.taxRefunded) +
          ' / 剩余可退 ' + money(r.sym, Math.max(0, (r.taxOrigin || 0) - (r.taxRefunded || 0))) },
      ]} />
    </div>
    <div className="lp-note-sm" style={{ marginBottom: 12 }}>
      发起退款直连支付域退款单原路退回,不走订单域退款申请单。退款单号与执行状态由支付域回调写回;
      走到退款环节时才向订单商品行反写「退款中」,到账后置「已退款」。
    </div>
    <Space size={12}>
      {r.status === 'to_refund' && !refundFailed &&
        <Button type="primary" icon={<DollarOutlined />} onClick={() => setRefundOpen(true)}>发起退款</Button>}
      {refundFailed && <Button type="primary" icon={<ReloadOutlined />} onClick={() => setRefundOpen(true)}>重新发起退款</Button>}
    </Space>
  </div>;

  const basicTab = <div>
    <h4 className="lp-section">基本信息</h4>
    <DetailGrid rows={baseRows} />
    <h4 className="lp-section">命中政策快照(policy_snapshot)</h4>
    <div className="lp-note-sm" style={{ marginBottom: 12 }}>
      决策 2.1:建单时对命中的<b>整条政策</b>做快照留档,不是只存服务费一项。政策后续被运营改动或停用,均不回溯已建单据 ——
      避免改政策把在途单的关单时点改掉,也避免邮件里已告知买家的退货地址与系统新值对不上。
      {diffKeys.length > 0 && <span style={{ color: '#D97706' }}>　本单快照中有 {diffKeys.length} 项已与政策当前值不同,下方已标注。</span>}
    </div>
    {s ? <div className="lp-sub"><DetailGrid rows={policyRows} /></div>
      : <div className="lp-blank">未命中政策快照</div>}
    {evSection}{auditSection}{shipSection}{inspSection}{refundSection}
  </div>;

  const timelineTab = <div>
    <div className="lp-note-sm" style={{ marginBottom: 16 }}>
      时间线与操作日志同一张表(after_sale_log),靠「买家可见」标记区分。本页仅展示买家可见条目,与 C 端进度页一致。
    </div>
    <Timeline items={tl.map((x, i) => ({
      key: i, color: i === 0 ? '#7C3AED' : '#9CA3AF',
      children: <div><div style={{ fontSize: 12, color: '#6B7280' }}>{x.at}</div>
        <div style={{ marginTop: 2 }}>{x.text}</div></div>,
    }))} />
  </div>;

  const logTab = <OpLog data={logs} types={['创建', '审核通过', '审核驳回', '回填运单', '状态推进', '录入验货', '发起退款', '退款失败回传', '关单']} />;

  return <Card style={CARD_STYLE}>
    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 16, marginBottom: 18 }}>
      <div>
        <Breadcrumb items={[{ title: <a onClick={() => go('as-list')}>售后工单</a> }, { title: '售后单详情' }]}
          style={{ marginBottom: 8 }} />
        <div style={{ fontSize: 20, fontWeight: 700 }}>
          <span className="lp-code">{r.id}</span>
          <span style={{ marginLeft: 10 }}><StatusTag variant={st.variant}>{st.label}</StatusTag></span></div>
        <div style={{ color: '#6B7280', fontSize: 13, marginTop: 4 }}>
          {AS_TYPE[r.asType]} · {m.label} · 订单 {r.orderNo} · 申请于 {r.appliedAt}</div>
      </div>
      <Space>
        {r.status === 'pending_audit' && <Button type="primary" icon={<AuditOutlined />} onClick={() => setAuditOpen(true)}>审核</Button>}
        {(r.status === 'to_ship' || r.status === 'in_transit') && <Button type="primary" icon={<CarOutlined />} onClick={() => setShipOpen(true)}>回填运单</Button>}
        {r.status === 'in_transit' && <Button icon={<ExclamationCircleOutlined />}
          style={{ borderColor: '#D97706', color: '#D97706' }} onClick={() => setLostOpen(true)}>标记退回丢件</Button>}
        {r.status === 'to_inspect' && <Button type="primary" icon={<AuditOutlined />} onClick={() => setInspOpen(true)}>录入验货</Button>}
        {r.status === 'to_refund' && !refundFailed && <Button type="primary" icon={<DollarOutlined />} onClick={() => setRefundOpen(true)}>发起退款</Button>}
        {r.status === 'to_refund' && refundFailed && <Button type="primary" icon={<ReloadOutlined />} onClick={() => setRefundOpen(true)}>重新发起退款</Button>}
        <Button icon={<EyeOutlined />} onClick={() => setEvOpen(true)}>附件</Button>
        <Button onClick={() => go('as-list')}>返回列表</Button>
      </Space>
    </div>
    <Tabs defaultActiveKey="basic" items={[
      { key: 'basic', label: '处理详情', children: basicTab },
      { key: 'timeline', label: '时间线(买家可见)', children: timelineTab },
      { key: 'log', label: '操作日志', children: logTab },
    ]} />
    <AuditModal key={'da' + r.id} open={auditOpen} onClose={() => setAuditOpen(false)} record={r} />
    <ShipmentModal key={'ds' + r.id} open={shipOpen} onClose={() => setShipOpen(false)} record={r} />
    <InspectionModal key={'di' + r.id} open={inspOpen} onClose={() => setInspOpen(false)} record={r} />
    <RefundModal key={'dr' + r.id} open={refundOpen} onClose={() => setRefundOpen(false)} record={r} />
    <LostInTransitModal key={'dl' + r.id} open={lostOpen} onClose={() => setLostOpen(false)} record={r} />
    <EvidenceModal key={'de' + r.id} open={evOpen} onClose={() => setEvOpen(false)} record={r} />
  </Card>;
}

/* ============================================================
   页面 3:售后政策配置
   ============================================================ */
function PolicyListPage({ go }) {
  const [mode, setMode] = useState('data');
  const [marketF, setMarketF] = useState('');
  const [cur, setCur] = useState(null);
  const [toggleOpen, setToggleOpen] = useState(false);
  const rows = POLICIES.filter(p => !marketF || p.market === marketF);
  const columns = [
    { title: '政策编号', dataIndex: 'id', width: 165, render: v => <span className="lp-code">{v}</span> },
    { title: '适用市场', dataIndex: 'market', width: 120, render: v => marketOf(v).label },
    { title: '适用范围', key: 'scope', width: 210, render: (_, r) => <div>
      <StatusTag variant="sale">{SCOPE_TYPE[r.scopeType]}</StatusTag>
      <span>{r.scopeValue ? r.scopeValue : '全部商品'}</span></div> },
    { title: <TipText label="优先级" tip={'多条政策同时命中时,priority 越大越优先。\n建议:全市场 10 / 品类 50 / 商品 90'} />,
      dataIndex: 'priority', width: 90, align: 'center' },
    { title: '是否支持退货', dataIndex: 'returnable', width: 120, align: 'center',
      render: v => <StatusTag variant={v ? 'on' : 'req'}>{v ? '支持' : '不支持'}</StatusTag> },
    { title: <TipText label="售后时效" tip={'valid_days。决策 9.3:未签收期间【不启动计时】,\n发货后买家随时可申请;签收后才开始算 N 天。\n签收时间取订单域 order_package.received_at(8.1)。'} />,
      dataIndex: 'validDays', width: 130, align: 'center',
      render: (v, r) => r.returnable ? '签收后 ' + v + ' 天' : dash('') },
    { title: <TipText label="交寄时限" tip={'return_ship_days。决策 3.1:自「运单号告知买家」起算,\n不自审核通过起算;逾期未交寄系统自动关单。'} />,
      dataIndex: 'shipDays', width: 120, align: 'center',
      render: (v, r) => r.returnable ? v + ' 天未交寄' : dash('') },
    { title: <TipText label="退货服务费" tip={'决策 1.4:作申请时告知买家的参考值。\n决策 9.6:建单时快照为 policy_snapshot.service_fee_amount,\n退款方案按该快照值预填、运营可手动修改;\n系统仍不按责任自动豁免、不按包裹分摊。'} />,
      key: 'fee', width: 140, align: 'right',
      render: (_, r) => r.returnable ? money(marketOf(r.market).sym, r.fee) + ' ' + r.cur : dash('') },
    { title: '退货地址', dataIndex: 'addr', width: 260, render: v => v ? <span style={{ fontSize: 12, color: '#4B5563' }}>{v}</span> : dash('') },
    { title: '状态', dataIndex: 'status', width: 90, render: v => <StatusTag variant={v === 'on' ? 'on' : 'off'}>{v === 'on' ? '启用' : '停用'}</StatusTag> },
    { title: '更新时间', dataIndex: 'at', width: 155 },
    { title: '操作', key: 'op', width: 170, fixed: 'right', render: (_, r) => <Space size={6}>
      <Button size="small" onClick={() => go('policy-edit', r)}>编辑</Button>
      <Button size="small" onClick={() => go('policy-create', null)}>复制新建</Button>
      <Button size="small" danger={r.status === 'on'} onClick={() => { setCur(r); setToggleOpen(true); }}>
        {r.status === 'on' ? '停用' : '启用'}</Button></Space> },
  ];
  return <Card style={CARD_STYLE}>
    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 16, marginBottom: 18 }}>
      <div>
        <div style={{ fontSize: 20, fontWeight: 700, marginBottom: 6 }}>售后政策</div>
        <div style={{ color: '#6B7280', fontSize: 13 }}>按 Market / 品类 / 商品三级配置,多条命中时按优先级覆盖</div>
      </div>
      <Button type="primary" icon={<PlusOutlined />} onClick={() => go('policy-create', null)}>新增政策</Button>
    </div>
    <Space size={12} wrap style={{ marginBottom: 12 }}>
      <Input placeholder="政策编号 / 范围值" prefix={<SearchOutlined style={{ color: '#9CA3AF' }} />} allowClear style={{ width: 220 }} />
      <Select value={marketF} onChange={setMarketF} style={{ width: 150 }} options={[{ value: '', label: '全部 Market' },
        ...MARKETS.map(m => ({ value: m.value, label: m.label }))]} />
      <Select defaultValue="" style={{ width: 150 }} options={[{ value: '', label: '全部范围类型' },
        ...Object.keys(SCOPE_TYPE).map(k => ({ value: k, label: SCOPE_TYPE[k] }))]} />
      <Select defaultValue="" style={{ width: 130 }} options={[{ value: '', label: '全部状态' },
        { value: 'on', label: '启用' }, { value: 'off', label: '停用' }]} />
      <Button type="primary" icon={<SearchOutlined />}>查询</Button>
      <Button icon={<ReloadOutlined />} onClick={() => setMarketF('')}>重置</Button>
    </Space>
    <div className="lp-note-sm" style={{ marginBottom: 16 }}>
      时效天数、服务费金额、交寄时限天数均为运营配置项,示例数值不代表最终规则。
      <b>退货服务费金额有两个用途</b>:① 申请时向买家告知参考值(决策 1.4);② <b>建单时随整条政策快照留档,
      作为退款方案上服务费实扣的预填默认值,运营可手动修改</b>(决策 9.6)。系统仍不按责任自动豁免、不按包裹分摊;
      本期已删除豁免字段(决策 1.5)。
      政策改动<b>不回溯已建单据</b> —— 在途单沿用建单时的整条政策快照(决策 2.1)。
    </div>
    {mode === 'data' && <>
      <Table rowKey="id" columns={columns} dataSource={rows} pagination={false} styles={TABLE_STYLES}
        scroll={{ x: 'max-content' }} />
      <CompactPagination total={rows.length} pageSize={10} /></>}
    {mode === 'zero' && <EmptyZero entity="售后政策" cta="新增政策" onCta={() => go('policy-create', null)} />}
    {mode === 'no-match' && <EmptyNoMatch onClear={() => { setMarketF(''); setMode('data'); }} />}
    {mode === 'error' && <EmptyError onRetry={() => setMode('data')} />}
    <EmptyStateSwitcher mode={mode} setMode={setMode} />
    <PolicyToggleModal key={'pt' + (cur ? cur.id : '0')} open={toggleOpen} onClose={() => setToggleOpen(false)} record={cur} />
  </Card>;
}

function PolicyFormPage({ go, isEdit, record }) {
  const r = record || {};
  const [market, setMarket] = useState(r.market || 'US');
  const [scopeType, setScopeType] = useState(r.scopeType || 'market');
  const [returnable, setReturnable] = useState(r.returnable === undefined ? true : r.returnable);
  const m = marketOf(market);
  return <Card style={CARD_STYLE}>
    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 16, marginBottom: 18 }}>
      <div>
        <Breadcrumb items={[{ title: <a onClick={() => go('policy-list')}>售后政策</a> }, { title: isEdit ? '编辑政策' : '新增政策' }]}
          style={{ marginBottom: 8 }} />
        <div style={{ fontSize: 20, fontWeight: 700 }}>{isEdit ? '编辑售后政策' : '新增售后政策'}</div>
        <div style={{ color: '#6B7280', fontSize: 13, marginTop: 4 }}>
          {isEdit ? <span className="lp-code">{r.id}</span> : '保存后即对新申请生效;在途售后单沿用建单时的政策快照'}</div>
      </div>
      <Button onClick={() => go('policy-list')}>返回列表</Button>
    </div>

    <div style={{ marginBottom: 24 }}>
      <h4 className="lp-section">适用范围</h4>
      <FormRow label="适用市场" required helper="时效、服务费、退货地址三项按 market 独立配置;各 market 内闭环,不做跨境退回">
        <Select value={market} onChange={setMarket} style={{ width: 260 }}
          options={MARKETS.map(x => ({ value: x.value, label: x.label }))} /></FormRow>
      <FormRow label="范围类型" required>
        <Radio.Group value={scopeType} onChange={e => setScopeType(e.target.value)}
          options={Object.keys(SCOPE_TYPE).map(k => ({ value: k, label: SCOPE_TYPE[k] }))} /></FormRow>
      {scopeType === 'category' && <FormRow label="适用品类" required>
        <Select style={{ width: '100%', maxWidth: 460 }} defaultValue={r.scopeValue} placeholder="选择品类"
          options={[{ value: '手袋(CAT1002)', label: '手袋(CAT1002)' }, { value: '腕表(CAT1005)', label: '腕表(CAT1005)' },
            { value: '特价清仓(CAT1099)', label: '特价清仓(CAT1099)' }]} /></FormRow>}
      {scopeType === 'product' && <FormRow label="适用商品" required helper="定制件、特价清仓件等可单独配为不支持退货">
        <Select mode="tags" style={{ width: '100%', maxWidth: 560 }} defaultValue={r.scopeValue ? [r.scopeValue] : []}
          placeholder="输入商品 ID 后回车,支持粘贴多个" /></FormRow>}
      <FormRow label="优先级" required helper="多条政策同时命中时数值越大越优先。建议:全市场 10 / 品类 50 / 商品 90">
        <InputNumber defaultValue={r.priority || 10} min={1} max={999} style={{ width: 160 }} /></FormRow>
    </div>

    <div style={{ marginBottom: 24 }}>
      <h4 className="lp-section">售后规则</h4>
      <FormRow label="是否支持退货" required>
        <Radio.Group value={returnable} onChange={e => setReturnable(e.target.value)}
          options={[{ value: true, label: '支持退货' }, { value: false, label: '不支持退货' }]} /></FormRow>
      {returnable && <>
        <FormRow label="售后时效" required
          helper="决策 9.3:未签收期间不启动计时 —— 发货后买家随时可申请,签收后才开始算 N 天;签收时间取订单域 order_package.received_at(决策 8.1)。时效严格按窗口判断、与申请次数无关(决策 3.2)">
          <InputNumber defaultValue={r.validDays || 14} min={1} max={365} addonAfter="天" style={{ width: 180 }} /></FormRow>
        <Alert style={{ margin: '0 0 16px 128px' }} type="info" showIcon
          message="决策 9.3:valid_days 在未签收期间不计时"
          description={'原口径待确认③(7.1 定发货后即可申请、8.1 定起算取 received_at,未签收时 received_at 为空无取数源)' +
            '已由 9.3 闭环:未签收期间【不启动计时】,买家随时可申请;签收后才开始算 N 天,取数源仍是 received_at。' +
            'C 端未签收态因此不显示倒计时/剩余天数,改提示「签收后开始计算 N 天」。'} />
        <FormRow label="交寄时限天数" required
          helper="决策 3.1:自「运单号告知买家」起算(不自审核通过起算),买家 N 天未交寄则系统自动关单;关单后仍在售后时效内可重新申请">
          <InputNumber defaultValue={r.shipDays || 7} min={1} max={90} addonAfter="天" style={{ width: 180 }} /></FormRow>
      </>}
      {!returnable && <Alert type="warning" showIcon
        message="不支持退货 ≠ 不能申请售后"
        description={'决策 7.3:is_returnable=false 只约束「退货退款」,不约束「仅退款」—— 货没收到时该约束不适用,' +
          '买家仍可就丢件 / 空包等原因发起仅退款。故本范围只是不配时效与服务费,C 端仅退款入口照常开放。'} />}
    </div>

    {returnable && <div style={{ marginBottom: 24 }}>
      <h4 className="lp-section">退货服务费(告知参考值 + 实扣预填值)</h4>
      <FormRow label="服务费金额" required
        helper="正逆向均不向买家收运费。本金额:① 用于买家申请时的费用告知;② 随政策快照留档,作为运营在退款方案上填写实扣金额的预填默认值(决策 9.6),运营可改">
        <Space size={12}>
          <InputNumber defaultValue={r.fee === undefined ? 15 : r.fee} min={0} precision={2} prefix={m.sym} style={{ width: 180 }} />
          <Select value={m.cur} disabled style={{ width: 120 }} options={[{ value: m.cur, label: m.cur }]} />
        </Space></FormRow>
      <Alert style={{ marginBottom: 16 }} type="info" showIcon
        message="本期系统不自动计算服务费,但会按本配置值预填(决策 1.1 / 1.2 / 1.5 / 9.6)"
        description={'① 本配置值 = 建单时写入政策快照(policy_snapshot.service_fee_amount),既用于向买家告知,' +
          '也用于退款方案上服务费的【预填默认值】;不与原因码挂钩、不做豁免推算;' +
          '② 每张售后单实际扣多少,由运营在该单的退款方案上确认或改写,不按包裹分摊、不按责任自动豁免、不做只读联动;' +
          '③ 豁免字段 is_service_fee_waived 已从 ER 删除,系统内不再有「豁免」这个独立状态;' +
          '④ ⚠ 仅退款分支的预填值按补 2 推断为 0(9.6 结论未区分分支),已提交用户确认。'} />
      <h4 className="lp-section">退货地址</h4>
      <FormRow label="退货地址" required helper="完整文本快照,随邮件与 C 端一并告知买家;不引用地址库(仓库地址需随 market 配)">
        <Input.TextArea rows={3} defaultValue={r.addr} placeholder="收件人 / 门牌 / 街道 / 城市 / 州省 / 邮编 / 国家 / 联系电话" /></FormRow>
    </div>}

    <div style={{ marginBottom: 24 }}>
      <h4 className="lp-section">状态</h4>
      <FormRow label="政策状态" required>
        <Select defaultValue={r.status || 'on'} style={{ width: 180 }}
          options={[{ value: 'on', label: '启用' }, { value: 'off', label: '停用' }]} /></FormRow>
    </div>

    {isEdit && <OpLog types={['创建', '编辑', '启用', '停用']} />}

    <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 12, padding: '16px 0', borderTop: '1px solid #E5E7EB', marginTop: 8 }}>
      <Button onClick={() => go('policy-list')}>取消</Button>
      <Button type="primary" onClick={() => go('policy-list')}>{isEdit ? '保存' : '保存并创建'}</Button>
    </div>
  </Card>;
}

/* ============================================================
   页面 4:售后原因码字典
   ============================================================ */
function ReasonListPage({ go }) {
  const [mode, setMode] = useState('data');
  const [typeF, setTypeF] = useState('');
  const [cur, setCur] = useState(null);
  const [toggleOpen, setToggleOpen] = useState(false);
  const rows = REASONS.filter(x => !typeF || x.type === typeF);
  const columns = [
    { title: '原因码', dataIndex: 'code', width: 260, render: v => <span className="lp-code">{v}</span> },
    { title: <TipText label="展示文案" tip={'C 端展示的英文文案。\nPRD 定义的英文即最终展示文案,不再另给语言包 key'} />,
      dataIndex: 'text', width: 240 },
    { title: '中文备注', dataIndex: 'cn', width: 150 },
    { title: '适用诉求类型', dataIndex: 'type', width: 130,
      render: v => <StatusTag variant={v === 'refund_only' ? 'pending' : 'sale'}>{AS_TYPE[v]}</StatusTag> },
    { title: '必传举证', dataIndex: 'ev', width: 100, align: 'center',
      render: v => <StatusTag variant={v ? 'req' : 'off'}>{v ? '必传' : '选传'}</StatusTag> },
    { title: '排序', dataIndex: 'sort', width: 80, align: 'center' },
    { title: '状态', dataIndex: 'status', width: 90, render: v => <StatusTag variant={v === 'on' ? 'on' : 'off'}>{v === 'on' ? '启用' : '停用'}</StatusTag> },
    { title: '更新时间', dataIndex: 'at', width: 155 },
    { title: '操作', key: 'op', width: 150, fixed: 'right', render: (_, r) => <Space size={6}>
      <Button size="small" onClick={() => go('reason-edit', r)}>编辑</Button>
      <Button size="small" danger={r.status === 'on'} onClick={() => { setCur(r); setToggleOpen(true); }}>
        {r.status === 'on' ? '停用' : '启用'}</Button></Space> },
  ];
  return <Card style={CARD_STYLE}>
    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 16, marginBottom: 18 }}>
      <div>
        <div style={{ fontSize: 20, fontWeight: 700, marginBottom: 6 }}>售后原因码字典</div>
        <div style={{ color: '#6B7280', fontSize: 13 }}>原因码只记「为什么」,不带任何责任信息;「谁承担」由运营在验货环节单独判定</div>
      </div>
      <Button type="primary" icon={<PlusOutlined />} onClick={() => go('reason-create', null)}>新增原因码</Button>
    </div>
    <Space size={12} wrap style={{ marginBottom: 12 }}>
      <Input placeholder="原因码 / 展示文案" prefix={<SearchOutlined style={{ color: '#9CA3AF' }} />} allowClear style={{ width: 240 }} />
      <Select value={typeF} onChange={setTypeF} style={{ width: 150 }} options={[{ value: '', label: '全部诉求类型' },
        { value: 'return_refund', label: '退货退款' }, { value: 'refund_only', label: '仅退款' }]} />
      <Select defaultValue="" style={{ width: 130 }} options={[{ value: '', label: '全部举证要求' },
        { value: '1', label: '必传' }, { value: '0', label: '选传' }]} />
      <Select defaultValue="" style={{ width: 130 }} options={[{ value: '', label: '全部状态' },
        { value: 'on', label: '启用' }, { value: 'off', label: '停用' }]} />
      <Button type="primary" icon={<SearchOutlined />}>查询</Button>
      <Button icon={<ReloadOutlined />} onClick={() => setTypeF('')}>重置</Button>
    </Space>
    <div className="lp-note-sm" style={{ marginBottom: 16 }}>
      {DRAFT}。当前 14 条为草案:退货退款 9 条 + 仅退款 5 条。
      <b>本字典已不含「默认责任方」字段</b>:决策 1.2 定「扣除金额不和原因码挂钩」+ 决策 1.3 定「原因码不能直接确定判责」,
      该字段唯一用途(预填责任方)已被废除、无任何消费方,故 <span className="lp-code">after_sale_reason.default_liability</span> 已从 ER v1.1 整个删除
      (不是改注释)。原因码只回答「为什么退」,责任归属由运营在验货环节独立判定。
    </div>
    {mode === 'data' && <>
      <Table rowKey="id" columns={columns} dataSource={rows} pagination={false} styles={TABLE_STYLES}
        scroll={{ x: 'max-content' }} />
      <CompactPagination total={rows.length} pageSize={20} /></>}
    {mode === 'zero' && <EmptyZero entity="原因码" cta="新增原因码" onCta={() => go('reason-create', null)} />}
    {mode === 'no-match' && <EmptyNoMatch onClear={() => { setTypeF(''); setMode('data'); }} />}
    {mode === 'error' && <EmptyError onRetry={() => setMode('data')} />}
    <EmptyStateSwitcher mode={mode} setMode={setMode} />
    <ReasonToggleModal key={'rt' + (cur ? cur.id : '0')} open={toggleOpen} onClose={() => setToggleOpen(false)} record={cur} />
  </Card>;
}

function ReasonFormPage({ go, isEdit, record }) {
  const r = record || {};
  return <Card style={CARD_STYLE}>
    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 16, marginBottom: 18 }}>
      <div>
        <Breadcrumb items={[{ title: <a onClick={() => go('reason-list')}>售后原因码字典</a> }, { title: isEdit ? '编辑原因码' : '新增原因码' }]}
          style={{ marginBottom: 8 }} />
        <div style={{ fontSize: 20, fontWeight: 700 }}>{isEdit ? '编辑原因码' : '新增原因码'}</div>
        <div style={{ color: '#6B7280', fontSize: 13, marginTop: 4 }}>
          {isEdit ? <span className="lp-code">{r.code}</span> : '原因码全局唯一,创建后不可修改'}</div>
      </div>
      <Button onClick={() => go('reason-list')}>返回列表</Button>
    </div>
    <div style={{ marginBottom: 24 }}>
      <h4 className="lp-section">基本信息</h4>
      <FormRow label="原因码" required helper="全局唯一,建议前缀区分诉求类型:RR_ 退货退款 / RO_ 仅退款">
        <Input defaultValue={r.code} disabled={isEdit} placeholder="如 RR_NOT_AS_DESCRIBED" style={{ maxWidth: 460 }} /></FormRow>
      <FormRow label="展示文案" required helper="C 端展示的英文文案,PRD 定义的英文即最终展示文案">
        <Input defaultValue={r.text} placeholder="如 Item not as described" style={{ maxWidth: 460 }} /></FormRow>
      <FormRow label="中文备注" helper="仅后台内部识别用,不对买家展示">
        <Input defaultValue={r.cn} placeholder="如 描述不符" style={{ maxWidth: 460 }} /></FormRow>
    </div>
    <div style={{ marginBottom: 24 }}>
      <h4 className="lp-section">适用与判定</h4>
      <FormRow label="适用诉求类型" required
        helper="当前为单选。同一原因需同时适用两类诉求时须拆成两条码(如 RR_OTHER / RO_OTHER)">
        <Radio.Group defaultValue={r.type || 'return_refund'}
          options={[{ value: 'return_refund', label: '退货退款' }, { value: 'refund_only', label: '仅退款' }]} /></FormRow>
      <FormRow label="是否必传举证" required helper="必传时 C 端提交申请前须上传至少一张图片/视频;数量与格式限制 →G3">
        <Radio.Group defaultValue={r.ev === undefined ? true : r.ev}
          options={[{ value: true, label: '必传' }, { value: false, label: '选传' }]} /></FormRow>
    </div>
    <div style={{ marginBottom: 24 }}>
      <h4 className="lp-section">展示与状态</h4>
      <FormRow label="排序" required helper="数值越小越靠前,C 端原因下拉按此排序">
        <InputNumber defaultValue={r.sort || 100} min={1} max={999} style={{ width: 160 }} /></FormRow>
      <FormRow label="启用状态" required>
        <Select defaultValue={r.status || 'on'} style={{ width: 180 }}
          options={[{ value: 'on', label: '启用' }, { value: 'off', label: '停用' }]} /></FormRow>
    </div>
    {isEdit && <OpLog types={['创建', '编辑', '启用', '停用']} />}
    <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 12, padding: '16px 0', borderTop: '1px solid #E5E7EB', marginTop: 8 }}>
      <Button onClick={() => go('reason-list')}>取消</Button>
      <Button type="primary" onClick={() => go('reason-list')}>{isEdit ? '保存' : '保存并创建'}</Button>
    </div>
  </Card>;
}

/* ===== App ===== */
function App() {
  const [currentPage, setCurrentPage] = useState('as-list');
  const [record, setRecord] = useState(null);
  const go = (key, rec) => { if (rec !== undefined) setRecord(rec); setCurrentPage(key); window.scrollTo(0, 0); };
  const activeKey = currentPage.indexOf('policy') === 0 ? 'policy' : (currentPage.indexOf('reason') === 0 ? 'reason' : 'as');
  const subLabel = (text, key) => <span style={{ fontWeight: activeKey === key ? 600 : 400 }}>{text}</span>;
  const menuItems = [
    { key: 'workbench', icon: <CustomerServiceOutlined />, label: '售后处理',
      children: [{ key: 'as', icon: <ProfileOutlined />, label: subLabel('售后工单', 'as') }] },
    { key: 'config', icon: <SettingOutlined />, label: '售后配置',
      children: [
        { key: 'policy', icon: <FileProtectOutlined />, label: subLabel('售后政策', 'policy') },
        { key: 'reason', icon: <BookOutlined />, label: subLabel('原因码字典', 'reason') },
      ] },
  ];
  const crumbMap = {
    'as-list': '售后工单', 'as-detail': '售后工单 / 售后单详情',
    'policy-list': '售后配置 / 售后政策', 'policy-create': '售后配置 / 售后政策 / 新增政策',
    'policy-edit': '售后配置 / 售后政策 / 编辑政策',
    'reason-list': '售后配置 / 原因码字典', 'reason-create': '售后配置 / 原因码字典 / 新增原因码',
    'reason-edit': '售后配置 / 原因码字典 / 编辑原因码',
  };
  const onMenu = ({ key }) => {
    if (key === 'as') go('as-list', null);
    if (key === 'policy') go('policy-list', null);
    if (key === 'reason') go('reason-list', null);
  };
  return <ConfigProvider theme={looplyTheme}>
    <Layout style={{ height: '100vh' }}>
      <Layout.Header style={{ borderBottom: '1px solid #E5E7EB', display: 'flex', alignItems: 'center' }}>
        <img src={LOGO_SRC} alt="Looply" style={{ height: 32, display: 'block' }} />
        <div style={{ width: 1, height: 20, background: '#E5E7EB', margin: '0 16px' }} />
        <span style={{ fontSize: 14, fontWeight: 500, color: '#6B7280' }}>售后管理后台</span>
        <span style={{ marginLeft: 'auto', color: '#9CA3AF', fontSize: 13 }}>{crumbMap[currentPage]}</span>
      </Layout.Header>
      <Layout>
        <Layout.Sider width={220} theme="light" style={SIDER_STYLE}>
          <Menu mode="inline" items={menuItems} selectedKeys={[activeKey]} defaultOpenKeys={['workbench', 'config']}
            style={{ borderInlineEnd: 'none' }} onClick={onMenu} /></Layout.Sider>
        <Layout.Content style={{ padding: 28, overflow: 'auto' }}>
          {currentPage === 'as-list' && <AfterSaleListPage go={go} />}
          {currentPage === 'as-detail' && <AfterSaleDetailPage go={go} record={record} />}
          {currentPage === 'policy-list' && <PolicyListPage go={go} />}
          {currentPage === 'policy-create' && <PolicyFormPage go={go} isEdit={false} record={null} />}
          {currentPage === 'policy-edit' && <PolicyFormPage go={go} isEdit={true} record={record} />}
          {currentPage === 'reason-list' && <ReasonListPage go={go} />}
          {currentPage === 'reason-create' && <ReasonFormPage go={go} isEdit={false} record={null} />}
          {currentPage === 'reason-edit' && <ReasonFormPage go={go} isEdit={true} record={record} />}
        </Layout.Content>
      </Layout>
    </Layout>
  </ConfigProvider>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
