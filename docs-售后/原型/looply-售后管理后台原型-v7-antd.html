<title>Looply 售后管理后台原型 v7</title>

<style>
html,body,#root{height:100%;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F9FAFB;color:#1F2937}
#root::before{content:'正在加载 antd 原型……';position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#9CA3AF;font-size:14px}
#root:not(:empty)::before{display:none}
.lp-kpi{background:linear-gradient(180deg,#FEFCFF 0%,#F3EEFF 100%);border:1px solid #DDD6FE;border-radius:14px;padding:14px 16px}
.lp-kpi .num{font-size:24px;font-weight:700;color:#7C3AED;line-height:1;margin-bottom:6px;font-variant-numeric:tabular-nums}
.lp-kpi .label{font-size:12px;color:#6B7280}
.lp-pagination{display:flex;align-items:center;justify-content:center;gap:24px;padding:12px 16px;font-size:13px;color:#6B7280}
.lp-pagination .divider{width:1px;height:20px;background:#E5E7EB}
.lp-tip-trigger{cursor:help;border-bottom:1px dashed #9CA3AF;padding-bottom:1px}
.lp-note{padding:14px;border-radius:10px;background:#F3EEFF;border:1px solid #DDD6FE;color:#6D28D9;font-size:12px;line-height:1.8}
.lp-note-sm{padding:10px 14px;background:#F3EEFF;border:1px solid #DDD6FE;border-radius:8px;font-size:12px;color:#6D28D9;line-height:1.7}
.lp-section-purple{font-size:14px;font-weight:700;color:#7C3AED;margin:0 0 12px}
.lp-section{font-size:15px;font-weight:600;color:#1F2937;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid #E5E7EB}
.lp-oplog-title{font-size:14px;font-weight:700;color:#7C3AED;margin:24px 0 12px}
.lp-empty{display:flex;flex-direction:column;align-items:center;padding:60px 20px;text-align:center}
.lp-empty .icon{font-size:48px;margin-bottom:16px;color:#9CA3AF}
.lp-empty .icon.err{color:#DC2626}
.lp-empty .title{font-size:16px;font-weight:600;color:#1F2937;margin-bottom:8px}
.lp-empty .desc{font-size:13px;color:#6B7280;margin-bottom:24px;max-width:360px}
.lp-form-row{display:flex;gap:16px;margin-bottom:12px;align-items:center}
.lp-form-row:first-of-type{margin-top:8px}
.lp-form-row .lp-form-label{width:112px;text-align:right;color:#6B7280;font-size:13px;flex-shrink:0}
.lp-form-row .lp-form-label .req{color:#DC2626;margin-right:4px}
.lp-form-row .lp-form-control{flex:1}
.lp-helper{font-size:12px;color:#9CA3AF;margin:-4px 0 12px 128px}
.lp-detail{display:grid;grid-template-columns:132px 1fr;gap:10px 16px;font-size:13px;margin-bottom:20px}
.lp-detail .dl{color:#6B7280}
.lp-detail .dv{color:#1F2937}
.lp-code{font-family:Menlo,Monaco,Consolas,monospace;font-size:12px;color:#374151;background:#F3F4F6;padding:1px 6px;border-radius:4px}
.lp-preview{border:1px solid #E5E7EB;border-radius:14px;padding:16px;background:#fff}
.lp-preview-line{display:flex;justify-content:space-between;gap:20px;padding:10px 0;border-bottom:1px solid #E5E7EB;font-size:13px}
.lp-preview-line:last-child{border-bottom:none}
.lp-preview-line .muted{color:#6B7280}
.lp-preview-line .total{font-size:15px;font-weight:700;color:#7C3AED}
.lp-thumb-grid{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:12px}
.lp-thumb-wrap{width:104px;display:flex;flex-direction:column;gap:6px;align-items:center}
.lp-thumb{width:104px;height:104px;border-radius:10px;background:#F3F4F6;border:1px solid #E5E7EB;display:flex;align-items:center;justify-content:center;color:#9CA3AF;font-size:30px;cursor:pointer}
.lp-thumb:hover{border-color:#DDD6FE;background:#FAF5FF;color:#7C3AED}
.lp-thumb-cap{font-size:11px;color:#6B7280;text-align:center;line-height:1.4;word-break:break-all}
.lp-blank{border:1px dashed #D1D5DB;border-radius:12px;padding:22px;background:#FAFAFA;color:#6B7280;font-size:13px;text-align:center}
.lp-sub{border-radius:12px;background:#FAFAFA;padding:16px 18px;margin-bottom:16px}
:focus-visible{outline:none;box-shadow:inset 0 0 0 2px rgba(124,58,237,.4)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const TAG_COLORS = {
  on: { bg: '#F0FDF4', color: '#16A34A' }, sale: { bg: '#EFF6FF', color: '#2563EB' },
  pending: { bg: '#FFFBEB', color: '#D97706' }, off: { bg: '#F3F4F6', color: '#6B7280' },

function StatusTag({ variant, children }) {
  const c = TAG_COLORS[variant] || TAG_COLORS.off;
  return <Tag bordered={false} style={{ background: c.bg, color: c.color, borderRadius: 999,
    padding: '2px 8px', fontSize: 12, lineHeight: '18px', marginInlineEnd: 4 }}>{children}</Tag>;
}
function Kpi({ num, label, onClick }) {
  return <div className="lp-kpi" style={onClick ? { cursor: 'pointer' } : null} onClick={onClick}>
    <div className="label" style={{ marginBottom: 6 }}>{label}</div>
    <div className="num">{num}</div></div>;
}
function TipText({ label, tip }) {
  return <Tooltip title={<div style={{ whiteSpace: 'pre-line', lineHeight: 1.6 }}>{tip}</div>}
    color="#fff" styles={{ body: { color: '#374151', fontSize: 12, padding: '10px 14px' } }}>
    <span className="lp-tip-trigger">{label}</span></Tooltip>;
}
function CompactPagination({ total, current = 1, pageSize = 10 }) {
  const tp = Math.ceil(total / pageSize) || 1;
  const pages = [];
  pages.push({ k: 'prev', label: '<', arrow: true, disabled: current === 1 });
  for (let i = 1; i <= tp; i++) pages.push({ k: i, label: i });
  pages.push({ k: 'next', label: '>', arrow: true, disabled: current === tp });
  return <div className="lp-pagination">
    <span>共 {total.toLocaleString()} 条,每页{' '}
      <Select size="small" value={pageSize} style={{ width: 72, marginInline: 4 }}
        options={[{ value: 10, label: 10 }, { value: 20, label: 20 }, { value: 50, label: 50 }]} />{' '}条</span>
    <div className="divider" />
    <Space size={2}>{pages.map(p => <span key={p.k} style={{ minWidth: 32, height: 32, display: 'inline-flex',
      alignItems: 'center', justifyContent: 'center', borderRadius: 8, fontSize: 13,
      cursor: p.disabled ? 'default' : 'pointer', background: p.k === current ? '#7C3AED' : (p.arrow ? '#fff' : 'transparent'),
      color: p.k === current ? '#fff' : '#374151', border: p.arrow ? '1px solid #E5E7EB' : 'none',
      fontWeight: p.k === current ? 600 : 400, opacity: p.disabled ? 0.35 : 1 }}>{p.label}</span>)}</Space>
    <div className="divider" /><span>第 {current}/{tp} 页</span></div>;
}

function FormRow({ label, required, children, helper }) {

    <div className="lp-form-label">{required && <span className="req">*</span>}{label}</div>

}
/* 信息类区块默认多列排布(cols),避免几十行标签值竖排成一条长队。
   rows 里的 key 用显式 rk(有 JSX 标签时 k 不能当 key) */
function DetailGrid({ rows, cols }) {
  const list = (rows || []).filter(Boolean);
  const n = cols || 1;
  const cell = (x, i) => <React.Fragment key={x.rk || i}>
    <div className="dl">{x.k}</div><div className="dv">{x.v}</div></React.Fragment>;
  if (n === 1) return <div className="lp-detail">{list.map(cell)}</div>;
  const per = Math.ceil(list.length / n);
  const groups = [];
  for (let i = 0; i < n; i++) groups.push(list.slice(i * per, (i + 1) * per));
  return <div style={{ display: 'grid', gridTemplateColumns: 'repeat(' + n + ',1fr)', gap: 0 }}>
    {groups.map((g, gi) => <div className="lp-detail" key={'g' + gi}
      style={{ gridTemplateColumns: '104px 1fr', paddingRight: gi < n - 1 ? 20 : 0 }}>
      {g.map(cell)}</div>)}</div>;
}

    asType: 'return_refund', reasonCode: 'RR_NOT_AS_DESCRIBED', note: '第三次补充:已按客服要求补拍铆钉特写与内标照片。',
    status: 'pending_audit', liability: '', feeQuoted: 15, policyId: 'POL-US-BAG',
    taxOrigin: 0, taxRefunded: 0, overdue: false, overdueNote: '',
    /* 两条驳回记录各自留原文:拆表前主表只存得下最近一次,第一次驳回说了什么会被覆盖掉。
       原文案里手写的「第二次驳回:」前缀已删 —— 次序由记录条数得出,不再靠人工写进原因里 */
    audits: [
      { result: '驳回', note: '举证只有整体外观照,看不出与商详描述不符;请补拍铆钉特写与内标照片',
        by: 'Ken', byType: '运营', at: '2026-07-29 17:40' },
      { result: '驳回', note: '补传的照片仍看不清铆钉与内标,请在自然光下重拍并对准细节',
        by: 'Ken', byType: '运营', at: '2026-07-30 16:12' },
    ],
    resubmittedAt: '2026-07-31 10:22',
    ship: null, inspect: null, refund: null,
    ev: [{ i: 1, name: 'IMG_7701.jpg 铆钉特写', by: '买家', at: '2026-07-31 10:20' },
      { i: 2, name: 'IMG_7702.jpg 内标', by: '买家', at: '2026-07-31 10:21' }],
    appliedAt: '2026-07-29 14:05', completedAt: '', closedAt: '', closeReason: '',
    operator: 'Ken', operatorType: '运营',
  },
];

/* ===== 工具 ===== */
const money = (sym, n) => sym + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const reasonOf = (code) => { const x = REASONS.find(r => r.code === code); return x ? x : null; };
const reasonLabel = (code) => { const x = reasonOf(code); return x ? x.cn + ' / ' + x.text : '—'; };
const policyOf = (id) => { const x = POLICIES.find(p => p.id === id); return x ? x : null; };
const marketOf = (code) => { const x = MARKETS.find(m => m.value === code); return x ? x : MARKETS[0]; };
const dash = (v) => (v === undefined || v === null || v === '') ? <span style={{ color: '#9CA3AF' }}>—</span> : v;
/* 退货服务费实扣由运营决定,系统不按责任自动豁免、不按包裹分摊;预填取政策快照值、可手动修改。
   本函数只做四则运算,fee 一律取当前输入框的值。
   ⚠ tax 形参保留:退还税费在 ER 中仍是字段(refund_tax_amount),只是本期界面不出、恒传 0 */
const refundPreview = (r, fee, deduct, tax) => {
  const base = r.item.paid;
  const f = Number(fee || 0);
  return { base, fee: f, deduct: Number(deduct || 0), tax: Number(tax || 0),
    amount: Math.max(0, base - f - Number(deduct || 0) + Number(tax || 0)) };
};
/* 政策快照 = 建单时对命中政策整条留档(after_sale_order.policy_snapshot)。
   原型用 policySnapDiff 模拟「快照值与当前政策已不同」的情形 */
const snapOf = (r) => {
  const p = policyOf(r.policyId);
  if (!p) return null;
  return { ...p, ...(r.policySnapDiff || {}), snapAt: r.appliedAt };
};
const snapDiffKeys = (r) => Object.keys(r.policySnapDiff || {});
/* 退款方案上「退货服务费」的【预填值】——
   唯一取 policy_snapshot.service_fee_amount(建单时冻结的整条政策快照);
   after_sale_order.service_fee_quoted 只作申请时告知值与对账展示,不作为预填来源。
   仅退款分支返回 null(预填为【空】,不是 0),由运营手动填写;退货退款分支预填政策快照的服务费金额。
   两种情况都只是默认值,运营均可手动改写(不做只读、不做任何按责任的自动置 0 / 豁免联动) */
const snapFee = (r) => {
  if (r.asType === 'refund_only') return null;
  const s = snapOf(r);
  return s ? Number(s.fee || 0) : null;
};
/* 预填值有没有、从哪来 —— 列表/详情/弹窗/日志共用一句话,避免四处写法分叉 */
const feeSourceText = (r) => {
  const p = snapFee(r);
  if (p === null) return '仅退款分支无预填值,由运营手动填写';
  const s = snapOf(r);
  return '预填 ' + money(r.sym, p) + ',取自政策快照 ' + (s ? s.id : '—') + ' 的 service_fee_amount,运营可改';
};
const feeCell = (r, v) => (v === null || v === undefined || v === '')
  ? <span style={{ color: '#D97706' }}>未填写(预填为空,须运营手填)</span> : money(r.sym, v);

/* ===== 审核记录派生口径(after_sale_audit:一次审核一条记录,1:N)=====
   主表已删「审核结论 / 审核意见 / 审核时间 / 驳回次数」四个字段,下列口径全部从子表推导:
   · 历次审核记录         = 该单 after_sale_audit,按 audited_at 升序
   · 「这单被驳回过」     = 结论为驳回的记录【条数 ≥ 1】(不再看主表的驳回次数字段)
   · 「最近审核时间」     = 最近一条记录的 audited_at
   · 「当前正等待买家修改」= as_status=待审核 且 最近一条记录结论为驳回
                            且(resubmitted_at 为空 或 早于该条记录的 audited_at)
   ⚠ 列表页要显示「已驳回 N 次」,N 由接口 count 子表后聚合返回;
     不允许为前端取数方便把驳回次数字段加回主表 —— 它能从子表推出来,冗余就会出现两份不一致的真相 */
const auditsOf = (r) => r.audits || [];
const lastAudit = (r) => { const a = auditsOf(r); return a.length ? a[a.length - 1] : null; };
const lastAuditAt = (r) => { const a = lastAudit(r); return a ? a.at : ''; };
const rejectTimes = (r) => auditsOf(r).filter(x => x.result === '驳回').length;
const wasRejected = (r) => rejectTimes(r) > 0;
const waitingBuyerFix = (r) => {
  if (r.status !== 'pending_audit') return false;
  const a = lastAudit(r);
  if (!a || a.result !== '驳回') return false;
  return !r.resubmittedAt || r.resubmittedAt < a.at;
};
/* 待审核单的副标记:被驳回过才出,再按买家有没有在最近一次驳回之后重新提交分两种形态 */
const rejectMark = (r) => (r.status === 'pending_audit' && wasRejected(r))
  ? '已驳回 ' + rejectTimes(r) + ' 次 · ' + (waitingBuyerFix(r) ? '等买家修改' : '买家已重新提交,等运营审核')
  : '';
const COUNT_FROM_AUDIT_TIP = '「已驳回 N 次」不是主表字段 —— 主表已删驳回次数字段。\n' +
  'N = count(after_sale_audit where audit_result = 驳回),由列表接口聚合返回。\n' +
  '「等买家修改 / 等运营审核」再比对 after_sale_order.resubmitted_at\n' +
  '与最近一条驳回记录的 audited_at 得出。';

/* ===== 时间线(after_sale_log 中 is_customer_visible=1 的投影)===== */
function buildTimeline(r) {
  const t = [];
  t.push({ at: r.appliedAt, text: '买家提交售后申请(' + AS_TYPE[r.asType] + ' · ' + reasonLabel(r.reasonCode) + ')' });
  /* 历次审核各出一条:驳回原因取【当条记录】的 audit_note,不再是主表被覆盖过的最近一次值 */
  let rejSeq = 0;
  auditsOf(r).forEach(a => {
    if (a.result === '驳回') {
      rejSeq += 1;
      t.push({ at: a.at, text: '平台审核未通过(第 ' + rejSeq + ' 次):' + a.note + ' 请修改申请后重新提交。' });
    } else t.push({ at: a.at, text: '平台审核通过' });
  });
  /* resubmitted_at 只保留最近一次取值,故买家重新提交在时间线上最多出现一条 */
  if (r.resubmittedAt) t.push({ at: r.resubmittedAt, text: '买家已修改申请并重新提交,等待平台重新审核' });
  if (r.ship) {
    /* 告知买家的是售后单上的【登记值】,不是物流侧的实时值 */
    t.push({ at: r.ship.regAt, text: '已告知退货运单号 ' + r.returnTrackingNo +
      '(' + carrierName(r.returnCarrierCode) + '),请按退货地址交寄' });
    (r.ship.track || []).slice().reverse().forEach(k => t.push({ at: k.at, text: '物流:' + k.st + ' — ' + k.desc }));
  }
  if (r.inspect) t.push({ at: r.inspect.at, text: '平台判责完成,结论:' + r.inspect.result +
    (r.liability ? ',责任归属:' + LIABILITY[r.liability] : '') +
    (r.inspect.deduct > 0 ? ',扣减 ' + money(r.sym, r.inspect.deduct) : '') +
    (r.inspect.outlet ? ',处理出口:' + OUTLETS[r.inspect.outlet].label : '') });
  if (r.refund && r.refund.refNo) t.push({ at: r.refund.at,
    text: '已发起退款,金额 ' + money(r.sym, r.refund.amount) + ',退款单 ' + r.refund.refNo + ',请留意到账' });
  if (r.refund && r.refund.status === 'failed') t.push({ at: r.refund.failAt,
    text: '退款执行失败,平台正在重新处理,本单仍为退款中' });
  if (r.refund && r.refund.status === 'done') t.push({ at: r.completedAt || r.refund.at,
    text: '退款已到账,售后单完成' });
  /* 关单条目按 close_reason 三种来源分别成文(状态机只有一个 closed,差异全靠 close_reason):
     · 拒退关单 —— 判责说明是内部字段,本时间线是买家可见投影,不拼接原文;
       买家只看到「不予退款 + 商品回寄」这个客观结果,以及仍可重新申请
     · 运营关闭 —— 必须让买家看到「可以重新申请」,否则关了单买家仍以为被卡住
     · 买家撤销 */
  if (r.closedAt) t.push({ at: r.closedAt, text: r.closeCode === 'deny_close'
    ? r.closeReason + '。经线下人工核实后不予退款,商品将按线下方式回寄,本期不进系统跟踪。' + REAPPLY_NOTE
    : r.closeReason + '。' + (r.closeCode === 'ops_close' ? OPS_CLOSE_RELEASE_TIP : '') + REAPPLY_NOTE });
  return t.filter(x => x.at).sort((a, b) => (a.at < b.at ? 1 : -1));
}
function buildLogs(r) {
  const out = [];
  let i = 0;
  const add = (at, who, type, detail, vis) => { if (at) out.push({ i: ++i, at, who, type, detail, vis }); };
  add(r.appliedAt, '买家', '创建', r.asType === 'refund_only'
    ? '买家在 C 端提交售后申请。本单为仅退款分支:service_fee_quoted 建单时存 0,' +
      'C 端不展示退货服务费告知(货没到就没有退货物流成本),实扣同样预填为空由运营手填'
    : '买家在 C 端提交售后申请,申请时按政策快照值告知退货服务费参考金额 ' +
      money(r.sym, r.feeQuoted) + '(最终实扣以退款方案上的填写值为准)', true);
  /* 仅退款在审核环节先行落责任判定,操作日志需体现该输入项;退货退款分支审核不判责 */
  let logRejSeq = 0;
  auditsOf(r).forEach(a => {
    const passed = a.result === '通过';
    if (!passed) logRejSeq += 1;
    add(a.at, a.by, passed ? '审核通过' : '审核驳回',
      passed
        ? '审核意见:' + a.note +
          (r.asType === 'refund_only'
            ? ' | 责任归属判定(本分支不走验货,审核先行判定,判责环节可复核):' + (r.liability ? LIABILITY[r.liability] : '未录入')
            : '')
        : '驳回原因:' + a.note + ' | 售后单回到「待审核」等买家修改后重新提交(不落独立状态);' +
          '本条为该单第 ' + logRejSeq + ' 次驳回 —— 审核结论落 after_sale_audit,一次审核一条记录,' +
          '历次驳回原因互不覆盖;累计次数由该表结论为驳回的记录条数 count 得出,主表不存驳回次数字段。' +
          '已发送驳回通知邮件(固定发,驳回原因作为邮件正文)', true);
  });
  if (r.resubmittedAt) add(r.resubmittedAt, '买家', '重新提交',
    '买家在 C 端修改申请后重新提交,更新 after_sale_order.resubmitted_at;' +
    '本时间晚于最近一条驳回记录的审核时间后,单据不再判为「等买家修改」,转为等运营再审。' +
    '买家动作不写 after_sale_audit —— 该表只记运营的审核动作', true);
  if (r.ship) add(r.ship.regAt, r.operator || 'Lily', '回填运单',
    '登记退货运单号 ' + r.returnTrackingNo + ' / 承运商 ' + carrierName(r.returnCarrierCode) +
    '(code ' + r.returnCarrierCode + ')→ 落库到售后单 return_tracking_no / return_carrier_code;' +
    '同时已向物流信息服务注册运单追踪,并已告知买家退货地址', true);
  if (r.ship && (r.ship.track || []).some(k => k.st === '已送达'))
    add(r.ship.track.find(k => k.st === '已送达').at, '系统', '状态推进', '物流已送达,售后单自动推进至待判责', true);
  if (r.inspect) add(r.inspect.at, r.inspect.by, '判责并退款', '结论:' + r.inspect.result +
    ' | 责任归属(本环节终判):' + (r.liability ? LIABILITY[r.liability] : '未录入') + ' | 扣减:' +
    money(r.sym, r.inspect.deduct) + (r.inspect.deductReason ? '(' + r.inspect.deductReason + ')' : '') +
    (r.inspect.outlet ? ' | 处理出口:' + OUTLETS[r.inspect.outlet].label : '') +
    ' | 判责说明:' + r.inspect.note, false);
  if (r.refund && r.refund.refNo) add(r.refund.at, r.refund.by, '发起退款',
    '提交判责即调支付域退款接口:基准 ' + money(r.sym, r.refund.base) + ' - 服务费(' + feeSourceText(r) + ',本单实扣 ' +
    money(r.sym, r.refund.fee) + ') - 判责扣减 ' + money(r.sym, r.refund.deduct) + ' = ' +
    money(r.sym, r.refund.amount) + ',支付域退款单 ' + r.refund.refNo + ';售后单进入「退款中」', true);
  if (r.refund && r.refund.status === 'failed') add(r.refund.failAt, '系统', '退款失败回传',
    '支付域退款单 ' + r.refund.refNo + ' 执行失败:' + r.refund.failReason +
    '。售后单主状态维持「退款中」,不新增售后单状态,等运营重新发起', true);
  if (r.refund && r.refund.status === 'done') add(r.completedAt || r.refund.at, '系统', '状态推进',
    '支付域回传退款成功(退款单 ' + r.refund.refNo + '),售后单自动推进至终态「已完成」', true);
  /* 关单日志按 close_reason 三种来源分流(状态机只有一个 closed):
     · 拒退关单 → 日志类型单列「拒退关单」,便于筛;操作人是判责录入的运营
     · 运营关闭 → 操作人是运营本人(本期没有任何自动关单来源)
     · 买家撤销 → 操作人是买家
     拒退关单拆成两条日志:买家可见条只写客观结果 + 可重新申请;内部条承载判责说明原文,不外露 */
  if (r.closedAt && r.closeCode === 'deny_close') {
    add(r.closedAt, r.operator || 'Lily', '拒退关单',
      '判责结论「' + (r.inspect ? r.inspect.result : '') + '」经线下人工核实后选择出口「' + OUTLETS.deny.label +
      '」:不调退款接口、不产生退款单,售后单落终态「已关闭」且 close_reason =「' + CLOSE_REASONS.deny_close.label +
      '」。商品按线下方式回寄买家,本期不进系统。' + DENY_REAPPLY_NOTE, true);
    if (r.inspect && r.inspect.note) add(r.closedAt, r.operator || 'Lily', '拒退关单',
      '判责说明(inspection_note · 内部字段,不在 C 端展示,买家看不到本条):' + r.inspect.note, false);
  }
  if (r.closedAt && r.closeCode !== 'deny_close') add(r.closedAt,
    r.operatorType === '买家' ? '买家' : (r.closeCode === 'ops_close' ? (r.operator || '运营') : '系统'), '关单',
    '关闭原因:' + (r.closeCode ? CLOSE_REASONS[r.closeCode].label : '') + ' — ' + r.closeReason + '。' +
    (r.closeCode === 'ops_close'
      ? '邮件告知买家:' + (r.closeNotify ? '是(运营已勾选,关单邮件已发出)' : '否(运营未勾选,不发关单邮件)') +
        '(发不发由运营在关闭弹窗手动勾选,系统不代为决定)。' + OPS_CLOSE_RELEASE_TIP
      : '') + REAPPLY_NOTE, true);
  return out.sort((a, b) => (a.at < b.at ? 1 : -1)).map((x, k) => ({ ...x, i: k + 1 }));
}

/* ============================================================
   共享弹窗(规则 A.19:列表页 + 详情页同一操作复用同一组件)
   ============================================================ */

/* 1. 审核弹窗
   · 售后类型 = 退货退款 → 本弹窗【无】责任判定控件(留到判责环节);
   · 售后类型 = 仅退款   → 本弹窗【有】责任判定控件(必填、不预选),判责环节可复核
   · 驳回 → 不落责任归属,售后单回到「待审核」等买家修改后重新提交 */
function AuditModal({ open, onClose, record }) {
  const r = record || AS_ORDERS[0];
  const [result, setResult] = useState('pass');
  const [note, setNote] = useState('');
  const [liab, setLiab] = useState(r.liability || undefined);
  const isReturn = r.asType === 'return_refund';
  const needLiab = !isReturn && result === 'pass';
  const nextTo = isReturn ? '待寄回' : '待判责';
  return <Modal title="审核售后申请" open={open} onCancel={onClose} closable={false} maskClosable={false} centered width={660}
    footer={[<Button key="c" onClick={onClose}>取消</Button>,
      <Button key="s" type="primary" disabled={needLiab && !liab} onClick={onClose}>提交审核结论</Button>]}>
    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 0 }}>
      <div className="lp-detail" style={{ marginBottom: 12 }}>
        <div className="dl">售后单号</div><div className="dv"><span className="lp-code">{r.id}</span></div>
        <div className="dl">售后类型</div><div className="dv">{AS_TYPE[r.asType]}</div>
      </div>
      <div className="lp-detail" style={{ marginBottom: 12 }}>
        <div className="dl">原因码</div><div className="dv">{reasonLabel(r.reasonCode)}</div>
        <div className="dl">判责时点</div><div className="dv">{LIABILITY_STAGE[r.asType]}</div>
      </div>
    </div>
    <div className="lp-detail" style={{ gridTemplateColumns: '112px 1fr', marginBottom: 12 }}>
      <div className="dl">买家说明</div><div className="dv">{dash(r.note)}</div>
      {/* 拆表后历次驳回原因都在,弹窗里直接列全 —— 运营再审时要看得到前几次已经要求过买家补什么 */}
      {wasRejected(r) ? <><div className="dl">历次审核记录</div><div className="dv">
        <StatusTag variant="req">已驳回 {rejectTimes(r)} 次</StatusTag>
        <span style={{ color: '#6B7280', fontSize: 12 }}>
          {waitingBuyerFix(r) ? '最近一次驳回后买家尚未重新提交'
            : (r.resubmittedAt ? '买家已于 ' + r.resubmittedAt + ' 重新提交,本次为再审' : '')}</span>
        <div style={{ marginTop: 6 }}>{auditsOf(r).map((a, i) => <div key={'am' + i}
          style={{ fontSize: 12, color: a.result === '驳回' ? '#DC2626' : '#6B7280', marginBottom: 2 }}>
          {a.at} · {a.result} · {a.by} — {a.note}</div>)}</div></div></> : null}
    </div>
    <FormRow label="审核结论" required
      helper={result === 'pass' ? '通过后售后单推进至「' + nextTo + '」' : REJECT_MARK_TIP}>
      <Radio.Group value={result} onChange={e => setResult(e.target.value)}
        options={[{ value: 'pass', label: '通过' }, { value: 'reject', label: '驳回(回到待审核,等买家修改)' }]} /></FormRow>
    <FormRow label={result === 'reject' ? '驳回原因(会发给买家)' : '审核意见'} required={result === 'reject'}
      helper={result === 'reject' ? REJECT_MAIL_TIP : '仅记入操作日志,不对买家展示'}>
      <Input.TextArea rows={3} value={note} onChange={e => setNote(e.target.value)}
        placeholder={result === 'reject' ? '会原样作为驳回通知邮件正文发给买家,请写清要买家补什么、怎么改' : '审核意见,记入操作日志'} /></FormRow>
    {needLiab && <FormRow label="责任归属" required
      helper={'仅退款分支不走验货,责任归属在本环节先行判定(判责环节可复核改写)。' +
        '只有平台责任 / 买家责任两类,无预填、无默认值;判定结果写入 after_sale_order.liability_party。' +
        '驳回单不写责任归属 —— 驳回 = 未受理,无责任可分,理由由驳回原因承载。'}>
      <Radio.Group value={liab} onChange={e => setLiab(e.target.value)} options={LIABILITY_OPTIONS} /></FormRow>}
    {needLiab && !liab && <Alert style={{ marginBottom: 12 }} type="warning" showIcon
      message="责任归属未选择,无法提交审核结论" />}
    {result === 'pass' && <Alert style={{ marginTop: 8 }} type="info" showIcon
      message={'提交后售后单推进至「' + nextTo + '」,并立即发出「审核通过」邮件'}
      description={MAIL_NO_MERGE_TIP + (isReturn
        ? ' 退货服务费实扣在判责环节填写(' + feeSourceText(r) + '),系统不按责任推算或豁免;申请时已告知买家参考金额 ' +
          money(r.sym, r.feeQuoted) + '。'
        : ' ' + QUOTED_ZERO_TIP)} />}
    {result === 'reject' && <Alert style={{ marginTop: 8 }} type="warning" showIcon
      message="提交驳回会立即给买家发一封驳回通知邮件;本单回到「待审核」,等买家修改申请后重新提交"
      description={REJECT_MAIL_TIP + ' ' + REJECT_MARK_TIP +
        '提交后新增一条 after_sale_audit 记录(结论 / 驳回原因 / 审核人 / 审核时间),' +
        '该单累计驳回次数将变为 ' + (rejectTimes(r) + 1) + ' 次 —— 次数由 count 结论为驳回的审核记录得出,主表不存计数字段。' +
        '若买家迟迟不修改也不撤销,可用「关闭售后单」把单子终结并释放该商品行的互斥占用。'} />}
  </Modal>;
}

/* 2. 回填退货运单弹窗
   运营在本弹窗输入的运单号与承运商,落库到售后单自己的两个字段
   (after_sale_order.return_tracking_no / return_carrier_code),不只是传给物流服务注册追踪 ——
   目的是让售后单自身可读、可线下追查,不依赖实时调物流服务。
   承运商存 code(与物流模块 carrier_code 对齐),展示名由 CARRIERS 字典映射。
   轨迹与实时状态只从物流服务取,本域不冗余 */
function ShipmentModal({ open, onClose, record }) {
  const r = record || AS_ORDERS[0];
  const s = snapOf(r);
  const [no, setNo] = useState(r.returnTrackingNo || '');
  const [carrier, setCarrier] = useState(r.returnCarrierCode || undefined);
  return <Modal title="回填退货运单并注册物流追踪" open={open} onCancel={onClose} closable={false} maskClosable={false} centered width={640}
    footer={[<Button key="c" onClick={onClose}>取消</Button>,
      <Button key="s" type="primary" onClick={onClose}>保存并注册追踪</Button>]}>
    <div className="lp-note-sm" style={{ marginBottom: 14 }}>
      面单由运营线下预约,拿到单号后在此回填。保存时做<b>两件事</b>:
      ① 落库到售后单自己的字段(<span className="lp-code">return_tracking_no</span> /
      <span className="lp-code">return_carrier_code</span>);
      ② 调物流信息服务注册运单,业务单号传<b>订单号</b>({r.orderNo}),只保留物流服务返回的运单追踪引用。
      同一订单的多张售后单可共用一个退货运单号。<b>轨迹与实时物流状态不在本域冗余</b>,仍从物流服务取。
    </div>
    <FormRow label="退货运单号" required
      helper="落库到 after_sale_order.return_tracking_no:售后单自身留痕,便于线下追查,不依赖实时调物流服务">
      <Input value={no} onChange={e => setNo(e.target.value)} placeholder="线下预约面单拿到的承运商运单号" /></FormRow>
    <FormRow label="承运商" required
      helper="落库到 after_sale_order.return_carrier_code。库里存【编码】(与物流模块 carrier_code 对齐),展示名由承运商字典映射,不存展示名">
      <Select value={carrier} onChange={setCarrier} style={{ width: 300 }} placeholder="选择承运商(存 code)"
        options={CARRIER_OPTIONS} /></FormRow>
    <FormRow label="退货地址" helper="取建单时的政策快照(policy_snapshot),不取政策当前值,随邮件与 C 端一并告知买家">
      <Input.TextArea rows={2} value={s ? s.addr : ''} disabled /></FormRow>
    <Alert style={{ marginTop: 8 }} type="warning" showIcon
      message="⚠ 本域登记值不自动同步物流侧的后续修正"
      description={REG_VS_LIVE_TIP} />
    <Alert style={{ marginTop: 8 }} type="info" showIcon
      message="保存后发出「退货运单号」邮件,买家同时可在 C 端自助查看(两个渠道并行)"
      description={MAIL_NO_MERGE_TIP + ' ' + SHIP_SLA_OFF_TIP} />
  </Modal>;
}

/* 3-A. 【共享子组件】退款方案字段组(规则 A.19 第一层)
   退款金额字段同时出现在:
   ① AdjudicateModal(判责并发起退款,两个分支共用)
   ② RetryRefundModal(支付域回传失败后重新发起)
   两处必须共用同一份实现,否则迭代时会分叉。本组件为纯受控组件、内部不调用任何 Hook(规则 A.13)
   ⚠ 退还税费在 ER 中仍是字段(refund_tax_amount),本期界面不出、恒按 0 参与计算 */
function RefundPlanFields({ r, fee, setFee, deduct, setDeduct, deductEditable, locked, lockNote }) {
  const prefill = snapFee(r);
  const effFee = locked ? 0 : fee;
  const effDeduct = locked ? 0 : deduct;
  const c = refundPreview(r, effFee, effDeduct, 0);
  const feeEdited = !locked && Number(fee || 0) !== Number(prefill || 0);
  return <>
    <FormRow label="退款基准" helper="商品行实付金额(已扣优惠分摊,不含销售税);优惠不追回">
      <Input value={money(r.sym, c.base)} disabled /></FormRow>
    <FormRow label="退货服务费" required={!locked}
      helper={FEE_SOURCE_TIP + '。' + (prefill === null
        ? '仅退款的服务费扣除一样由运营手动填写,预填值为空(不是预填 0)。' + QUOTED_ZERO_TIP
        : '按建单时的政策快照预填,运营可手动修改;系统不计算、不按责任归属推算或豁免、不按包裹分摊。' +
          '预填值不由原因码带出、也不由责任归属推算 —— liability_party 是纯留痕字段,不会因判成平台责任就自动置 0 或变只读') +
        ' ' + FEE_NO_BLOCK_TIP}>
      <Space size={12} wrap>
        <InputNumber value={effFee} onChange={setFee} min={0} precision={2} prefix={r.sym}
          disabled={locked} placeholder={prefill === null ? '预填为空,请手动填写' : '实扣金额'} style={{ width: 200 }} />
        {!locked && prefill !== null && <Button size="small" disabled={!feeEdited}
          onClick={() => setFee(prefill)}>恢复预填值</Button>}
        <span style={{ fontSize: 12, color: '#6B7280' }}>
          {locked ? lockNote : feeSourceText(r)}
          {!locked && (r.asType === 'refund_only'
            ? <span>　申请时告知值 service_fee_quoted = <b>{money(r.sym, 0)}</b>(仅退款单一律存 0)</span>
            : <span>　申请时告知买家的参考金额 {money(r.sym, r.feeQuoted)}(仅对账展示)</span>)}
          {feeEdited && <span style={{ color: '#D97706' }}>　已被运营改写(原预填 {money(r.sym, prefill)})</span>}</span>
      </Space>
      {/* 不填 = 按 0 退,系统有意不拦 —— 只提示,不加阻断 */}
      {!locked && (fee === null || fee === undefined || fee === '') && <div
        style={{ color: '#D97706', fontSize: 12, marginTop: 6 }}>
        服务费未填写:提交后按 <b>{money(r.sym, 0)}</b> 计。<b>系统不拦</b>,请确认这是本单的实扣意图。
      </div>}</FormRow>
    <FormRow label="判责扣减"
      helper={deductEditable ? '来自判责记录,可在此复核调整;调整需在操作日志留痕' : '同步自上方「判责扣减金额」,同一步内改上面即可'}>
      <InputNumber value={effDeduct} onChange={setDeduct} min={0} precision={2} prefix={r.sym}
        disabled={locked || !deductEditable || r.asType === 'refund_only'} style={{ width: 180 }} /></FormRow>
    <div className="lp-preview" style={{ marginTop: 14 }}>
      <div className="lp-preview-line"><span className="muted">退款基准(商品行实付)</span><span>{money(r.sym, c.base)}</span></div>
      <div className="lp-preview-line">
        <span className="muted">退货服务费实扣{locked ? '(全额退款出口:不扣)' : ''}</span>
        <span>- {money(r.sym, c.fee)}</span></div>
      <div className="lp-preview-line"><span className="muted">判责扣减{locked ? '(全额退款出口:不扣)' : ''}</span>
        <span>- {money(r.sym, c.deduct)}</span></div>
      <div className="lp-preview-line"><span className="muted">最终退款金额({r.cur})</span><span className="total">{money(r.sym, c.amount)}</span></div>
    </div>
  </>;
}

/* 3-B. 判责弹窗:判责结论 + 责任判定 + 退款金额【同一步完成】,提交即调支付域退款接口
   入口开放在两个状态:退货在途 / 待判责。
   · 退货退款分支:录判责结论(含「退回途中丢件」)+ 责任归属 + 扣减 + 退款方案
   · 仅退款分支:货没到、无实物可验,不录判责结论;责任在审核时已判定,本步带出可复核
   · 异常结论(退回件与订单不符 / 空包或无实物):经线下人工核实后在同一步内三选一出口,
     选「不退并关闭」则不调退款接口,直接落已关闭 · 拒退关单
   不设「判责异常·待人工处理」挂起态:人工核实是线下动作,核实完再回系统录入即可。
   丢件不设独立动作:它是判责结论的一个取值,选中后必须写明认定依据 */
function AdjudicateModal({ open, onClose, record }) {
  const r = record || AS_ORDERS[0];
  const isReturn = r.asType === 'return_refund';
  const arriveAt = r.ship && (r.ship.track || []).find(k => k.st === '已送达');
  const [result, setResult] = useState(r.inspect ? r.inspect.result : undefined);
  const [note, setNote] = useState(r.inspect ? r.inspect.note : '');
  const [deduct, setDeduct] = useState(r.inspect ? r.inspect.deduct : 0);
  const [dReason, setDReason] = useState(r.inspect ? r.inspect.deductReason : '');
  const [liab, setLiab] = useState(r.liability || undefined);
  const [outlet, setOutlet] = useState(r.inspect && r.inspect.outlet ? r.inspect.outlet : undefined);
  const [fee, setFee] = useState(r.refund && r.refund.refNo ? r.refund.fee : snapFee(r));
  /* 选中「退回途中丢件」时把责任归属默认置为平台责任(常规口径),运营仍可改判买家责任 */
  const onResult = (v) => { setResult(v); if (v === LOST_RESULT && !liab) setLiab('platform'); };
  const abnormal = ABNORMAL_RESULTS.indexOf(result) >= 0;
  const lost = result === LOST_RESULT;
  const deny = abnormal && outlet === 'deny';
  const full = abnormal && outlet === 'full';
  const noteMissing = lost && !(note || '').trim();
  const blocked = (isReturn && !result) || (abnormal && !outlet) || !liab || noteMissing;
  const sysRows = isReturn
    ? [['售后单号', r.id], ['订单号 / 商品行', r.orderNo + '  ·  ' + r.item.pid], ['商品名称', r.item.name],
      ['到仓日期', arriveAt ? arriveAt.at : '尚未送达(退货在途,可直接判丢件)'],
      ['订单成色快照', r.item.grade], ['当前状态', AS_STATUS[r.status].label]]
    : [['售后单号', r.id], ['订单号 / 商品行', r.orderNo + '  ·  ' + r.item.pid], ['商品名称', r.item.name],
      ['售后类型', AS_TYPE[r.asType] + '(货未到,无实物可验)'],
      ['最近审核结论', lastAudit(r) ? lastAudit(r).result : '—'],
      ['审核时已判责任', r.liability ? LIABILITY[r.liability] : '未录入']];
  return <Modal title="判责" open={open} onCancel={onClose}
    closable={false} maskClosable={false} centered width={780}
    footer={[<Button key="c" onClick={onClose}>取消</Button>,
      <Button key="s" type="primary" danger={deny} disabled={blocked} onClick={onClose}>
        {deny ? '判责并关闭售后单(拒退关单)' : '判责并发起退款'}</Button>]}>
    <Alert style={{ marginBottom: 14 }} type={deny ? 'error' : 'warning'} showIcon
      message={deny ? '本次提交不调退款接口:售后单直接落「已关闭 · 拒退关单」' : '本次提交会立即调用支付域退款接口,售后单随即进入「退款中」'}
      description={ADJUDICATE_SUBMIT_TIP} />
    <h4 className="lp-section-purple">一、系统带出(只读核对项)</h4>
    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 0, marginBottom: 4 }}>
      <div className="lp-detail" style={{ marginBottom: 12 }}>
        {sysRows.slice(0, 3).map(x => <React.Fragment key={x[0]}>
          <div className="dl">{x[0]}</div><div className="dv">{x[1]}</div></React.Fragment>)}
      </div>
      <div className="lp-detail" style={{ marginBottom: 12 }}>
        {sysRows.slice(3).map(x => <React.Fragment key={x[0]}>
          <div className="dl">{x[0]}</div><div className="dv">{x[1]}</div></React.Fragment>)}
      </div>
    </div>
    {isReturn && <div className="lp-note-sm" style={{ marginBottom: 14 }}>
      验货在线下当地仓完成(收货 → 拍照 → 验瑕疵 → 回传在线表格),looply 系统不承接仓库作业;
      运营核对在线表格后在此录入结论。V1 不对接在线表格,本表单按其列设计。
    </div>}
    <h4 className="lp-section-purple" style={{ marginTop: 16 }}>二、判责录入</h4>
    {isReturn && <FormRow label="判责结论" required
      helper={DRAFT + ';V1 不设「真伪存疑」结论值与挂起态,可疑情况只写判责说明。' +
        '「' + LOST_RESULT + '」也在本下拉里 —— 不设独立的「标记丢件」动作'}>
      <Select value={result} onChange={onResult} style={{ width: 300 }} placeholder="选择判责结论"
        options={INSPECT_RESULTS.map(x => ({ value: x, label: x }))} /></FormRow>}
    <FormRow label="责任归属" required
      helper={(isReturn
        ? '退货退款分支在审核环节不落责任判定,本控件是其唯一落点且为终判。'
        : '仅退款分支在审核环节已先行判定,此处带出可复核改写,以本步为终判。') +
        '只有平台责任 / 买家责任两类,不由原因码带出、不预填(「售后原因」字典无默认责任方字段);' +
        '判定结果写入 after_sale_order.liability_party(单头唯一落点)。' +
        '责任归属不联动任何金额:它是留痕字段,不会触发服务费置 0 / 只读 / 自动豁免。' +
        (lost ? ' ' + LOST_LIAB_TIP : '')}>
      <Radio.Group value={liab} onChange={e => setLiab(e.target.value)} options={LIABILITY_OPTIONS} /></FormRow>
    <FormRow label="判责说明" required={lost} helper={NOTE_INTERNAL_TIP}>
      <Input.TextArea rows={3} value={note} onChange={e => setNote(e.target.value)}
        placeholder={lost
          ? '丢件必填认定依据。例:轨迹停留在中转仓 12 天,承运商查件确认丢失,案号 UPS-CL-88210'
          : '例:外观无新增瑕疵,配件齐全,成色与订单快照一致;内部研判可照常写(如「内标做工与正品不符,疑似调包,已同步风控」)'} /></FormRow>
    {noteMissing && <Alert style={{ marginBottom: 12 }} type="warning" showIcon
      message={'结论为「' + LOST_RESULT + '」时必须写明认定依据,否则无法提交'} />}
    {isReturn && !lost && <>
      <FormRow label="判责扣减金额" helper="缺件 / 成色下降时填写;金额币种随订单,不单独存币种。本值直接带入下方退款方案">
        <InputNumber value={deduct} onChange={setDeduct} min={0} precision={2} prefix={r.sym}
          disabled={deny || full} style={{ width: 200 }} /></FormRow>
      <FormRow label="扣减原因" required={Number(deduct) > 0}>
        <Input value={dReason} onChange={e => setDReason(e.target.value)} disabled={deny || full}
          placeholder="扣减金额 > 0 时必填,随退款方案一并留痕" /></FormRow>
      <FormRow label="瑕疵照片" helper="从在线表格取图上传,存为售后附件(来源=验货取证),挂当次判责记录">
        <Upload listType="picture-card" maxCount={8} beforeUpload={() => false}>
          <div><PlusOutlined /><div style={{ marginTop: 8, fontSize: 12 }}>上传</div></div></Upload></FormRow>
      <Alert style={{ marginBottom: 8 }} type="warning" showIcon
        message="ER 缺口:线下验货人姓名当前无字段承载(operator_id 记的是录入运营),暂只能写进判责说明" />
    </>}

    {abnormal && <>
      <h4 className="lp-section-purple" style={{ marginTop: 20 }}>三、异常结论的处理出口(必选)</h4>
      <Alert style={{ marginBottom: 12 }} type="warning" showIcon message={ABNORMAL_TIP}
        description={'不符 / 空包经线下人工核实后有三个出口:全额退给买家、部分退给买家、不退并关闭售后单。' +
          '前两个出口提交时调支付域退款接口,售后单进入「退款中」;第三个出口不调退款接口,直接落「已关闭 · 拒退关单」。'} />
      <FormRow label="处理出口" required
        helper={'三选一:' + Object.keys(OUTLETS).map(k => OUTLETS[k].label + ' = ' + OUTLETS[k].desc).join(';')}>
        <Radio.Group value={outlet} onChange={e => setOutlet(e.target.value)} options={OUTLET_OPTIONS} /></FormRow>
      {abnormal && !outlet && <Alert style={{ marginBottom: 12 }} type="warning" showIcon
        message="处理出口未选择,无法提交(异常判责结论必须选出口才能决定退不退、退多少)" />}
      {outlet && <div className="lp-note-sm" style={{ marginBottom: 12 }}>
        已选<b>{OUTLETS[outlet].label}</b>:{OUTLETS[outlet].desc}</div>}
    </>}

    {!deny && <>
      <h4 className="lp-section-purple" style={{ marginTop: 20 }}>{abnormal ? '四' : '三'}、退款方案(与判责同一步填写,提交即发起)</h4>
      <RefundPlanFields r={r} fee={fee} setFee={setFee} deduct={deduct} setDeduct={setDeduct}
        deductEditable={!isReturn || lost} locked={full}
        lockNote="全额退款出口:按退款基准全额退还,服务费与判责扣减均不扣(不可编辑)" />
      <Alert style={{ marginTop: 12 }} type="info" showIcon
        message="提交后直连支付域创建退款单原路退回(不走订单域退款申请单),售后单推进至「退款中」"
        description={REFUNDING_TIP} />
    </>}
    {deny && <Alert style={{ marginTop: 16 }} type="error" showIcon
      message="已选「不退并关闭(拒退关单)」:本单不调退款接口、不产生任何退款单"
      description={'提交后售后单落终态【已关闭】且 close_reason =【拒退关单】—— 不为这一个场景新增状态枚举值,' +
        '差异由 close_reason 承载。不调支付域、不生成退款单、不向订单商品行反写退款状态。' +
        '商品按线下方式回寄买家,本期回寄这一程不进系统。' +
        '上方「判责说明」是内部字段,不外露给买家;本期也不单设 deny_reason 字段,买家侧只看到「不予退款 + 商品回寄」这个结果。' +
        DENY_REAPPLY_NOTE} />}
  </Modal>;
}

/* 4. 重新发起退款弹窗
   判责已经把退款接口调过一次了,本弹窗只服务【支付域回传失败】的单:金额沿用成交值,不重新判责。

/* ============================================================
   页面 1:售后工单列表
   ============================================================ */
function AfterSaleListPage({ go }) {
  const [mode, setMode] = useState('data');
  const [kw, setKw] = useState('');
  const [orderKw, setOrderKw] = useState('');
  const [typeF, setTypeF] = useState('');
  /* 状态由 Tab 承载主视图,不再另设状态筛选下拉;
     下拉位留给状态之下的细分维度 = 关闭原因(「已关闭」一个状态下有三种来源,Tab 表达不了) */
  const [statusTab, setStatusTab] = useState('all');
  /* 「退款中」Tab 内的细分:全部 / 退款处理中 / 退款失败待重试。
     它只在该 Tab 下出现,不做成全局筛选器 —— 失败与否是支付域退款单的状态,不是售后单主状态 */
  const [payF, setPayF] = useState('all');
  const [closeF, setCloseF] = useState('');
  const [liabF, setLiabF] = useState('');
  const [marketF, setMarketF] = useState('');
  const [cur, setCur] = useState(null);
  const [auditOpen, setAuditOpen] = useState(false);
  const [shipOpen, setShipOpen] = useState(false);
  const [adjOpen, setAdjOpen] = useState(false);
  const [retryOpen, setRetryOpen] = useState(false);
  const [closeOpen, setCloseOpen] = useState(false);
  const [overdueOpen, setOverdueOpen] = useState(false);

  const rows = AS_ORDERS.filter(r => {
    if (kw && r.id.toLowerCase().indexOf(kw.toLowerCase()) < 0) return false;
    if (orderKw && r.orderNo.toLowerCase().indexOf(orderKw.toLowerCase()) < 0) return false;
    if (typeF && r.asType !== typeF) return false;
    if (statusTab !== 'all' && r.status !== statusTab) return false;
    if (statusTab === 'refunding' && payF === 'failed' && !isRetry(r)) return false;
    if (statusTab === 'refunding' && payF === 'processing' && isRetry(r)) return false;
    if (closeF && r.closeCode !== closeF) return false;
    if (liabF && r.liability !== liabF) return false;
    if (marketF && r.market !== marketF) return false;
    return true;
  });
  const cnt = (s) => AS_ORDERS.filter(r => r.status === s).length;
  const retryCnt = AS_ORDERS.filter(isRetry).length;
  const openWith = (rec, setter) => { setCur(rec); setter(true); };
  const reset = () => { setKw(''); setOrderKw(''); setTypeF(''); setStatusTab('all'); setPayF('all');
    setCloseF(''); setLiabF(''); setMarketF(''); };
  /* 角标只挂【运营待办】:待审核 / 待判责 —— 这两个状态运营不动手就推不动。
     待寄回、退货在途在等买家交寄与等物流;退款中在等支付域回调,都不是运营待办,故不挂角标。
     退款中 Tab 例外:失败待重试的那部分是运营待办,故角标只计失败数,不计全部退款中。 */
  const PENDING_TABS = ['pending_audit', 'to_adjudicate'];
  const tabLabel = (key, text) => {
    const n = key === 'all' ? AS_ORDERS.length : cnt(key);
    if (PENDING_TABS.indexOf(key) >= 0)
      return <Badge count={n} size="small" offset={[10, -2]}><span style={{ paddingRight: 4 }}>{text}</span></Badge>;
    if (key === 'refunding' && retryCnt > 0)
      return <Badge count={retryCnt} size="small" offset={[10, -2]} title="退款失败待重试">
        <span style={{ paddingRight: 4 }}>{text}({n})</span></Badge>;
    return <span>{text}({n})</span>;
  };
  const tabItems = [{ key: 'all', label: tabLabel('all', '全部') }]
    .concat(STATUS_ORDER.map(k => ({ key: k, label: tabLabel(k, AS_STATUS[k].label) })));

  const columns = [
    { title: '售后单号', dataIndex: 'id', width: 155, render: v => <span className="lp-code">{v}</span> },
    { title: '订单号', dataIndex: 'orderNo', width: 155, render: v => <span className="lp-code">{v}</span> },
    { title: '商品行', key: 'item', width: 260, render: (_, r) => <div>
      <div>{r.item.name}</div>
      <div style={{ fontSize: 12, color: '#6B7280', marginTop: 2 }}>{r.item.pid} · 成色快照 {r.item.grade} · 实付 {money(r.sym, r.item.paid)}</div></div> },
    { title: '售后类型', dataIndex: 'asType', width: 100, render: v => <StatusTag variant={v === 'refund_only' ? 'pending' : 'sale'}>{AS_TYPE[v]}</StatusTag> },
    { title: '原因', dataIndex: 'reasonCode', width: 190, render: v => { const x = reasonOf(v); return x ? <div><div>{x.cn}</div><div style={{ fontSize: 12, color: '#6B7280' }}>{x.text}</div></div> : dash(''); } },
    { title: <TipText label="状态" tip={COUNT_FROM_AUDIT_TIP} />, dataIndex: 'status', width: 130, render: (v, r) => <div>
      <StatusTag variant={AS_STATUS[v].variant}>{AS_STATUS[v].label}</StatusTag>
      {r.closeCode && <div style={{ fontSize: 12, color: '#6B7280', marginTop: 2 }}>{CLOSE_REASONS[r.closeCode].label}</div>}
      {/* 驳回不是独立状态:回到待审核,靠本标记区分「新提交」「等买家修改」「已重新提交待再审」三种情形。
          次数 = count(结论为驳回的审核记录),由接口聚合返回,主表已无驳回次数字段可取 */}
      {rejectMark(r) ? <div style={{ fontSize: 12, color: '#DC2626', marginTop: 2 }}>{rejectMark(r)}</div> : null}
      {isRetry(r) && <div style={{ fontSize: 12, color: '#DC2626', marginTop: 2 }}>退款失败待重试</div>}</div> },
    { title: <TipText label="责任归属" tip={'退货退款 → 判责环节判定(终判);\n仅退款 → 审核环节先行判定,判责环节可复核。\n未到判责节点的单据本列为空是正常的。'} />,
      dataIndex: 'liability', width: 120,
      render: (v, r) => v ? <StatusTag variant={v === 'platform' ? 'req' : 'off'}>{LIABILITY[v]}</StatusTag>
        : <span style={{ color: '#9CA3AF', fontSize: 12 }}>{LIABILITY_STAGE[r.asType]}</span> },
    { title: 'Market', dataIndex: 'market', width: 110, render: v => marketOf(v).label },
    { title: <TipText label="退款金额 / 支付结果" tip={'售后单主状态机不含「退款失败」。\n支付域退款单失败时在本列展示失败态,主状态仍停在「退款中」。'} />,
      key: 'amt', width: 165, align: 'right',
      render: (_, r) => r.refund && r.refund.refNo ? <div>
        <div>{money(r.sym, r.refund.amount)}</div>
        <div style={{ marginTop: 2 }}><StatusTag variant={REFUND_STATUS[r.refund.status].variant}>{REFUND_STATUS[r.refund.status].label}</StatusTag></div>
      </div> : dash('') },
    { title: '申请时间', dataIndex: 'appliedAt', width: 155 },
    { title: '操作', key: 'op', width: 250, fixed: 'right', render: (_, r) => {
      const ops = [{ key: 'detail', label: '详情', onClick: () => go('as-detail', r) }];
      if (r.status === 'pending_audit') ops.push({ key: 'audit', label: '审核', onClick: () => openWith(r, setAuditOpen) });
      /* 运单登记发生在待寄回阶段:退货在途已经寄出,无登记场景,故本入口只对待寄回开放 */
      if (r.status === 'to_ship') ops.push({ key: 'ship', label: '运单', onClick: () => openWith(r, setShipOpen) });
      /* 判责入口开放在两个状态:退货在途(可直接判丢件)+ 待判责。丢件是判责结论的一个取值,无独立按钮 */
      if (ADJUDICATE_STATUS.indexOf(r.status) >= 0) ops.push({ key: 'adj', label: '判责', onClick: () => openWith(r, setAdjOpen) });
      if (isRetry(r)) ops.push({ key: 'retry', label: '重新退款', onClick: () => openWith(r, setRetryOpen) });
      /* 待寄回 / 退货在途 两个阶段给运营一个手动关单出口(必填原因、留痕、释放商品行互斥占用)。
         按 A.1.1 排序规则,危险操作放最后;本页操作数最多的行为 3 个,不触发 >4 收纳规则,
         Dropdown 分支保留以防后续再加操作 */
      if (OPS_CLOSE_STATUS.indexOf(r.status) >= 0) ops.push({ key: 'close', label: '关闭售后单',
        danger: true, onClick: () => openWith(r, setCloseOpen) });
      const flat = ops.length <= 4 ? ops : ops.slice(0, 3);
      const more = ops.length <= 4 ? [] : ops.slice(3);
      const moreItems = [];
      more.forEach(o => { if (o.danger && moreItems.length) moreItems.push({ type: 'divider' });
        moreItems.push({ key: o.key, label: o.label, danger: o.danger }); });
      return <Space size={6}>
        {flat.map(o => <Button key={o.key} size="small" danger={o.danger} onClick={o.onClick}>{o.label}</Button>)}
        {more.length > 0 && <Dropdown trigger={['click']} menu={{ items: moreItems,
          onClick: ({ key }) => { const t = more.find(o => o.key === key); if (t && t.onClick) t.onClick(); } }}>
          <Button size="small" icon={<EllipsisOutlined />} /></Dropdown>}</Space>;
    } },
  ];

  return <Card style={CARD_STYLE}>
    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 16, marginBottom: 18 }}>
      <div>
        <div style={{ fontSize: 20, fontWeight: 700, marginBottom: 6 }}>售后工单</div>
        <div style={{ color: '#6B7280', fontSize: 13 }}>发货后的全部逆向申请。一个商品行一张售后单,一次退多件 = 多张单</div>
      </div>
      <Space>
        <Button icon={<ClockCircleOutlined />} onClick={() => setOverdueOpen(true)}>超期特批建单</Button>
        <Button icon={<DownloadOutlined />}>导出</Button>
      </Space>
    </div>

    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4,1fr)', gap: 12, marginBottom: 18 }}>
      <Kpi num={cnt('pending_audit')} label="待审核" onClick={() => { setStatusTab('pending_audit'); setPayF('all'); }} />
      <Kpi num={cnt('to_adjudicate')} label="待判责" onClick={() => { setStatusTab('to_adjudicate'); setPayF('all'); }} />
      <Kpi num={cnt('refunding')} label="退款中(等支付域回调)" onClick={() => { setStatusTab('refunding'); setPayF('all'); }} />
      <Kpi num={retryCnt} label="退款失败待重试" onClick={() => { setStatusTab('refunding'); setPayF('failed'); }} />
    </div>

    <Space size={12} wrap style={{ marginBottom: 12 }}>
      <Input placeholder="售后单号" prefix={<SearchOutlined style={{ color: '#9CA3AF' }} />} allowClear
        value={kw} onChange={e => setKw(e.target.value)} style={{ width: 190 }} />
      <Input placeholder="订单号" prefix={<SearchOutlined style={{ color: '#9CA3AF' }} />} allowClear
        value={orderKw} onChange={e => setOrderKw(e.target.value)} style={{ width: 190 }} />
      <Select value={typeF} onChange={setTypeF} style={{ width: 140 }} options={[{ value: '', label: '全部售后类型' },
        { value: 'return_refund', label: '退货退款' }, { value: 'refund_only', label: '仅退款' }]} />
      {/* 状态由 Tab 承载,此位放状态之下的细分维度 —— 关闭原因,仅在「全部 / 已关闭」两个 Tab 下可用 */}
      <Select value={closeF} onChange={setCloseF} style={{ width: 190 }}
        disabled={statusTab !== 'all' && statusTab !== 'closed'}
        placeholder="关闭原因(细分)"
        options={[{ value: '', label: '全部关闭原因' },
          ...Object.keys(CLOSE_REASONS).map(k => ({ value: k, label: CLOSE_REASONS[k].label }))]} />
      <Select value={liabF} onChange={setLiabF} style={{ width: 140 }} options={[{ value: '', label: '全部责任归属' },
        ...LIABILITY_OPTIONS]} />
      <Select value={marketF} onChange={setMarketF} style={{ width: 150 }} options={[{ value: '', label: '全部 Market' },
        ...MARKETS.map(m => ({ value: m.value, label: m.label }))]} />
      <DatePicker.RangePicker placeholder={['申请开始日期', '申请结束日期']} />
      <Button type="primary" icon={<SearchOutlined />}>查询</Button>
      <Button icon={<ReloadOutlined />} onClick={reset}>重置</Button>
    </Space>
    <Tabs activeKey={statusTab} items={tabItems} style={{ marginBottom: 0 }}
      onChange={k => { setStatusTab(k); setPayF('all'); if (k !== 'all' && k !== 'closed') setCloseF(''); }} />

    {/* 「退款中」Tab 内的支付结果细分:失败待重试的单要能被单独捞出来 */}
    {statusTab === 'refunding' && <div style={{ display: 'flex', alignItems: 'center', gap: 12, margin: '12px 0 4px' }}>
      <span style={{ fontSize: 13, color: '#6B7280' }}>支付域退款结果</span>
      <Radio.Group value={payF} onChange={e => setPayF(e.target.value)} optionType="button" buttonStyle="solid"
        options={[{ value: 'all', label: '全部(' + cnt('refunding') + ')' },
          { value: 'processing', label: '退款处理中(' + (cnt('refunding') - retryCnt) + ')' },
          { value: 'failed', label: '退款失败待重试(' + retryCnt + ')' }]} />
      <span style={{ fontSize: 12, color: '#9CA3AF' }}>失败与否是支付域退款单的状态,不是售后单主状态,故只在本 Tab 内细分</span>
    </div>}

    <div className="lp-note-sm" style={{ marginTop: 12, marginBottom: 16 }}>
      <b>状态机(7 个取值,终态 2 个)</b>:{statusLabels(ACTIVE_STATUS)} 为非终态;{statusLabels(TERMINAL_STATUS)} 为终态。
      <br /><b>主流程</b>:待审核 →(通过 · 退货退款)待寄回 →(揽收)退货在途 →(判责)退款中 →(退款成功回调)已完成;
      待审核 →(通过 · 仅退款)待判责 →(判责)退款中 → 已完成;退货在途 →(已送达)待判责。
      <br /><b>判责</b>是验货结论、责任判定与退款金额的<b>同一步</b>:入口开放在<b>退货在途 / 待判责</b>两个状态,
      <b>提交即调用支付域退款接口</b>,单子随即进入「退款中」,钱在那一刻就走了。
      「退回途中丢件」是判责结论的一个取值(必须写明认定依据),<b>没有独立的「标记丢件」动作</b>。
      <br /><b>退款中</b>是系统等待态,正常情况运营不用动手 —— 只有支付域回传失败的单需要重新发起,
      故 Tab 角标只计<b>失败待重试</b>的条数,Tab 内也可按支付结果细分。
      <br /><b>驳回不是独立状态</b>:审核驳回后单子回到「待审核」等买家修改后重新提交,状态列上标「已驳回 N 次 · 等买家修改」;
      买家改完重新提交后,同一行的标记转为「已驳回 N 次 · 买家已重新提交,等运营审核」。
      <b>审核结论不落主表</b>:一次审核一条 <span className="lp-code">after_sale_audit</span> 记录
      (结论 / 意见即驳回原因 / 审核人 / 审核时间),历次驳回原因互不覆盖、完整可查;主表不存审核结论、审核意见、审核时间,
      也<b>不存驳回次数字段</b> —— <b>「已驳回 N 次」的 N 由列表接口 count 该单结论为驳回的审核记录后聚合返回</b>,
      不要为前端取数方便把计数字段加回主表;「是否仍在等买家修改」再比对
      <span className="lp-code">resubmitted_at</span> 与最近一条驳回记录的审核时间得出。
      驳回<b>固定发一封通知邮件</b>给买家(驳回原因即邮件正文),不给运营勾选 —— 驳回是要求买家行动,不通知就断链。
      买家迟迟不改也不撤销时,用「关闭售后单」终结。
      <br /><b>判责异常三出口</b>:结论为「退回件与订单不符 / 空包或无实物」时,经线下人工核实后三选一 ——
      全额退 / 部分退(调退款接口,进退款中)/ <b>不退并关闭 → 已关闭 · 拒退关单</b>(不调退款接口)。
      拒退是判责的一个出口,<b>不是独立按钮、也不占独立状态</b>。
      <br /><b>「已关闭」有三种来源</b>(状态机只有一个 closed,差异靠 close_reason 区分,可用上方「关闭原因」下拉细分):
      ① <b>买家撤销</b>(待审核阶段买家自行在 C 端撤销);② <b>运营关闭</b>(<b>待审核 / 待寄回 / 退货在途</b>三个阶段运营手动关单
      —— 这三个阶段的推进权都在买家手上;<b>待判责 / 退款中不开放</b>,货已在平台手上或钱已在退,该走判责与重试。
      必填原因、全程留痕,<b>关闭即释放该商品行的互斥占用</b>,买家可重新申请;是否邮件告知买家由运营在关闭弹窗勾选);
      ③ <b>拒退关单</b>(判责异常经人工核实后选择不退并关闭,同样允许买家重新申请)。
      系统内不存在任何<b>自动</b>关单 —— 本期不做「交寄时限」与「超时关单」判定。
      <br /><b>操作日志</b>固定在详情页底部,不进列表行操作;政策 / 售后原因的编辑页同样在页面底部挂操作记录。
      <br /><b>责任归属</b>:退货退款在判责环节判定(终判);仅退款在审核环节先行判定、判责环节可复核;
      驳回单不写责任归属。<b>退货服务费</b>实扣:退货退款按政策快照值预填、<b>仅退款预填为空由运营手填</b>;
      预填唯一取数源 = policy_snapshot.service_fee_amount;仅退款单的告知值 service_fee_quoted 存 0;
      服务费<b>按 0 退不加阻断</b>,只做橙字提示。
      <br /><b>邮件不合并</b>:审核通过与运单号两封邮件各发一封 —— 中间隔着运营线下预约面单,间隔时间较长。
      <br /><b>订单侧「售后中」</b>= 本域全部非终态售后单的实时聚合,订单表不为售后新增状态字段;
      订单详情页按商品行实时查本域聚合(需 order_id、order_item_id 建索引)。该口径对订单域仍然成立。
    </div>

    {mode === 'data' && <>
      <Table rowKey="id" columns={columns} dataSource={rows} pagination={false} styles={TABLE_STYLES}
        scroll={{ x: 'max-content' }} />
      <CompactPagination total={rows.length} pageSize={10} /></>}
    {mode === 'zero' && <EmptyZero entity="售后工单" />}
    {mode === 'no-match' && <EmptyNoMatch onClear={() => { reset(); setMode('data'); }} />}
    {mode === 'error' && <EmptyError onRetry={() => setMode('data')} />}
    <EmptyStateSwitcher mode={mode} setMode={setMode} />

    <AuditModal key={'a' + (cur ? cur.id : '0')} open={auditOpen} onClose={() => setAuditOpen(false)} record={cur} />
    <ShipmentModal key={'s' + (cur ? cur.id : '0')} open={shipOpen} onClose={() => setShipOpen(false)} record={cur} />
    <AdjudicateModal key={'i' + (cur ? cur.id : '0')} open={adjOpen} onClose={() => setAdjOpen(false)} record={cur} />
    <RetryRefundModal key={'r' + (cur ? cur.id : '0')} open={retryOpen} onClose={() => setRetryOpen(false)} record={cur} />
    <CloseOrderModal key={'c' + (cur ? cur.id : '0')} open={closeOpen} onClose={() => setCloseOpen(false)} record={cur} />
    <OverdueCreateModal open={overdueOpen} onClose={() => setOverdueOpen(false)} />
  </Card>;
}

/* ============================================================
   页面 2:售后单详情(运营端主界面)
   ============================================================ */

  const [shipOpen, setShipOpen] = useState(false);

  const [retryOpen, setRetryOpen] = useState(false);
  const [evOpen, setEvOpen] = useState(false);
  const [closeOpen, setCloseOpen] = useState(false);
  const s = snapOf(r);
  const diffKeys = snapDiffKeys(r);
  const m = marketOf(r.market);
  const isReturn = r.asType === 'return_refund';
  const abnormal = r.inspect && ABNORMAL_RESULTS.indexOf(r.inspect.result) >= 0;
  const denied = r.closeCode === 'deny_close';
  /* 本域登记值与物流侧当前值可能不一致 —— 这是预期行为,不是错误 */
  const trackingDrift = !!(r.ship && r.returnTrackingNo && r.ship.no !== r.returnTrackingNo);
  const rf = r.refund;
  const retry = isRetry(r);
  const st = AS_STATUS[r.status];
  const tl = buildTimeline(r);
  const logs = buildLogs(r);
  /* 「被驳回过」与「当前等买家修改」是两个口径:前者只看记录条数(不限状态),后者还要看 resubmitted_at */
  const rejected = wasRejected(r);
  const waitFix = waitingBuyerFix(r);
  const rMark = rejectMark(r);
  const canAdjudicate = ADJUDICATE_STATUS.indexOf(r.status) >= 0;

  /* --- 基本信息:短字段走三列,长字段单独一列全宽(避免几十行竖排) --- */
  const baseRows = [
    { rk: 'id', k: '售后单号', v: <span className="lp-code">{r.id}</span> },
    { rk: 'type', k: '售后类型', v: <StatusTag variant={isReturn ? 'sale' : 'pending'}>{AS_TYPE[r.asType]}</StatusTag> },
    { rk: 'ord', k: '所属订单', v: <span className="lp-code">{r.orderNo}</span> },
    { rk: 'oi', k: '商品行 ID', v: <span className="lp-code">{r.orderItemId}</span> },
    { rk: 'user', k: '申请人', v: r.user },
    { rk: 'st', k: '售后单状态', v: <div><StatusTag variant={st.variant}>{st.label}</StatusTag>
      {rMark ? <div style={{ fontSize: 12, color: '#DC2626', marginTop: 2 }}>{rMark}</div> : null}
      {retry && <div style={{ fontSize: 12, color: '#DC2626', marginTop: 2 }}>退款失败待重试</div>}</div> },
    { rk: 'liab', k: <TipText label="责任归属" tip={'退货退款 → 判责环节判定(终判)。\n仅退款 → 审核环节先行判定,判责环节可复核。\n落点:after_sale_order.liability_party。\n驳回单不写责任归属。'} />,
      v: r.liability ? <StatusTag variant={r.liability === 'platform' ? 'req' : 'off'}>{LIABILITY[r.liability]}</StatusTag>
        : <span style={{ color: '#9CA3AF', fontSize: 12 }}>{LIABILITY_STAGE[r.asType]},尚未录入</span> },
    { rk: 'mk', k: <TipText label="所属市场" tip="V1 由用户信息判定,订单域暂无 market 维度" />, v: m.label },
    { rk: 'quoted', k: <TipText label="申请时告知服务费" tip={'service_fee_quoted:建单时按政策快照值告知买家的参考金额。\n只作对账展示,不是预填取数源。\n仅退款单本字段一律存 0。'} />,
      v: <span>{money(r.sym, isReturn ? r.feeQuoted : 0)} {r.cur}</span> },
    { rk: 'ovd', k: '超期人工特批', v: r.overdue ? <span><StatusTag variant="pending">是</StatusTag>{r.overdueNote}</span> : '否' },
    { rk: 't1', k: '申请时间', v: dash(r.appliedAt) },
    { rk: 't2', k: <TipText label="最近审核时间" tip={'主表已删 audited_at —— 本行取【最近一条 after_sale_audit 记录】的 audited_at。\n历次审核时间在下方「历次审核记录」区完整可查。'} />,
      v: dash(lastAuditAt(r)) },
    { rk: 'trs', k: <TipText label="最近重新提交时间" tip={'after_sale_order.resubmitted_at:买家最近一次重新提交申请的时间。\n首次提交不写;只保留最近一次取值,更早几次不留痕。\n与最近一条驳回记录的 audited_at 比对,得出是否仍在等买家修改。'} />,
      v: dash(r.resubmittedAt) },
    { rk: 't3', k: '完成时间', v: dash(r.completedAt) },
    { rk: 'op', k: '最近处理人', v: r.operator ? r.operator + '(' + r.operatorType + ')' : dash('') },
  ];
  const baseWideRows = [
    { rk: 'item', k: '订单商品行', v: <span>{r.item.name}
      <span style={{ color: '#6B7280', fontSize: 12, marginLeft: 8 }}>
        商品 ID {r.item.pid} · 成色等级快照 {r.item.grade} · 商品行实付 {money(r.sym, r.item.paid)} {r.cur}</span></span> },
    { rk: 'reason', k: <TipText label="原因码" tip="原因码只记「为什么退」,不携带任何责任信息(字典无默认责任方字段)" />,
      v: <span>{reasonLabel(r.reasonCode)}
        <span className="lp-code" style={{ marginLeft: 8 }}>{r.reasonCode}</span></span> },
    { rk: 'note', k: '买家补充说明', v: dash(r.note) },
    waitFix ? { rk: 'rej', k: '当前待买家修改(最近一次驳回原因)',
      v: <span style={{ color: '#DC2626' }}>{lastAudit(r).at} · {lastAudit(r).note}</span> } : null,
  ];

  /* --- 关闭信息(仅已关闭单展示)--- */
  const closeRows = r.closedAt ? [
    { rk: 'ct', k: '关闭时间', v: r.closedAt },
    { rk: 'cr', k: '关闭原因', v: r.closeCode
      ? <StatusTag variant={CLOSE_REASONS[r.closeCode].variant}>{CLOSE_REASONS[r.closeCode].label}</StatusTag> : dash('') },
    r.closeCode === 'ops_close' ? { rk: 'cn', k: '邮件告知买家',
      v: <span style={{ color: r.closeNotify ? '#1F2937' : '#D97706' }}>{r.closeNotify ? '是' : '否'}</span> } : null,
    { rk: 'cd', k: '关闭说明', v: <span style={{ color: '#DC2626' }}>{r.closeReason}</span> },
    { rk: 'cq', k: '可否重新申请', v: <span style={{ fontSize: 12, color: '#6B7280' }}>
      {denied ? DENY_REAPPLY_NOTE : REAPPLY_NOTE}{r.closeCode === 'ops_close' ? ' ' + OPS_CLOSE_RELEASE_TIP : ''}</span> },
  ] : [];

  /* --- 政策快照:建单时对命中政策整条留档,政策后续变更不回溯本单 --- */
  const snapMark = (key) => diffKeys.indexOf(key) >= 0
    ? <StatusTag variant="pending">与政策当前值不同</StatusTag> : null;
  const policyRows = s ? [
    { rk: 'pid', k: '快照来源政策', v: <span className="lp-code">{s.id}</span> },
    { rk: 'pat', k: '快照时间', v: s.snapAt },
    { rk: 'pmk', k: '适用市场', v: marketOf(s.market).label },
    { rk: 'psc', k: '适用范围', v: <span><StatusTag variant="sale">{SCOPE_TYPE[s.scopeType]}</StatusTag>
      {s.scopeValue ? s.scopeValue : '全部商品'}</span> },
    { rk: 'ppr', k: <TipText label="同层优先级" tip={PRIORITY_TIP} />, v: s.priority },
    { rk: 'prt', k: '是否支持退货', v: <StatusTag variant={s.returnable ? 'on' : 'req'}>{s.returnable ? '支持' : '不支持'}</StatusTag> },
    { rk: 'pvd', k: <TipText label="售后时效天数" tip={'未签收期间不启动计时:发货后买家随时可申请,\n签收后才开始算 N 天;\n签收时间取订单域 order_package.received_at。'} />,
      v: <span>签收后 {s.validDays} 天 {snapMark('validDays')}</span> },
    { rk: 'pfee', k: <TipText label="退货服务费" tip={'policy_snapshot.service_fee_amount —— 退款方案上服务费预填值的唯一取数源。\nservice_fee_quoted 只作对账展示。\n仅退款分支预填为空、由运营手填,不取本值。'} />,
      v: <span>{money(marketOf(s.market).sym, s.fee)} {s.cur} {snapMark('fee')}</span> },
    { rk: 'pcur', k: '币种', v: s.cur },
    { rk: 'pst', k: '快照时政策状态', v: <StatusTag variant={s.status === 'on' ? 'on' : 'off'}>{s.status === 'on' ? '启用' : '停用'}</StatusTag> },
  ] : [];

  /* --- 举证附件 --- */
  const evSection = <div style={{ marginBottom: 20 }}>
    <h4 className="lp-section">买家举证附件</h4>
    {(r.ev || []).length > 0 ? <div className="lp-thumb-grid">
      {r.ev.map(x => <div className="lp-thumb-wrap" key={x.i}>
        <div className="lp-thumb" onClick={() => setEvOpen(true)}><PictureOutlined /></div>
        <div className="lp-thumb-cap">{x.name}<br />{x.by} · {x.at.slice(5)}</div></div>)}
    </div> : <div className="lp-blank">买家未上传举证材料(该原因码不要求必传)</div>}
    <Space size={12} style={{ marginTop: 4 }}>
      <Button icon={<EyeOutlined />} onClick={() => setEvOpen(true)}>查看全部附件</Button>
      <Button icon={<UploadOutlined />} onClick={() => setEvOpen(true)}>运营补传</Button>
    </Space>
  </div>;

  /* --- 审核区:一次审核一条记录,历次全列(拆表前只留得下最近一次,前几次驳回原因会被覆盖掉)--- */
  const auditList = auditsOf(r).map((a, i) => ({ ...a, i: i + 1,
    rejSeq: auditsOf(r).slice(0, i + 1).filter(x => x.result === '驳回').length }));
  const auditCols = [
    { title: '序号', dataIndex: 'i', width: 60 },
    { title: '审核结论', dataIndex: 'result', width: 110,
      render: v => <StatusTag variant={v === '通过' ? 'on' : 'req'}>{v}</StatusTag> },
    { title: '审核人 / 类型', key: 'by', width: 130, render: (_, x) => x.by + '(' + x.byType + ')' },
    { title: '审核时间', dataIndex: 'at', width: 150 },
    { title: <TipText label="审核意见 / 驳回原因" tip={'after_sale_audit.audit_note:通过时是内部审核意见,\n驳回时是发给买家的驳回原因(邮件正文)。\n每条记录各自留原文,历次互不覆盖。'} />,
      dataIndex: 'note',
      render: (v, x) => x.result === '驳回'
        ? <span><StatusTag variant="req">第 {x.rejSeq} 次驳回</StatusTag>
          <span style={{ color: '#DC2626' }}>{v}</span></span>
        : v },
  ];
  const auditSection = <div style={{ marginBottom: 20 }}>
    <h4 className="lp-section">{isReturn ? '历次审核记录' : '历次审核记录与责任判定'}</h4>
    <div className="lp-note-sm" style={{ marginBottom: 12 }}>
      审核结论不落主表:一次审核一条 <span className="lp-code">after_sale_audit</span> 记录。
      驳回后单子回到「待审核」,买家修改重新提交、运营再审即再写一条,<b>历次驳回原因完整可查、互不覆盖</b>
      (chargeback 抗辩需要证明平台第几次要求买家补了什么材料)。
      「已驳回 N 次」由本表结论为驳回的<b>记录条数</b>得出,主表不存驳回次数字段。
    </div>
    {auditList.length > 0 ? <>
      <Table size="small" rowKey="i" pagination={false} styles={TABLE_STYLES}
        columns={auditCols} dataSource={auditList} />
      {rejected && <div className="lp-note-sm" style={{ marginTop: 12 }}>
        买家最近一次重新提交(<span className="lp-code">after_sale_order.resubmitted_at</span>):
        <b>{r.resubmittedAt ? r.resubmittedAt : '尚未重新提交'}</b>。
        「当前正等待买家修改」= 售后单为待审核 且 最近一条审核记录结论为驳回 且(本时间为空 或 早于该条记录的审核时间);
        本单判定:<b>{waitFix ? '是 —— 等买家修改' : '否'}</b>。
        该字段只保留最近一次取值,更早几次重新提交的时间不留痕。
      </div>}
      {!isReturn && <DetailGrid rows={[{ rk: 'al',
        k: <TipText label="责任归属(审核先行判定)" tip={'仅退款不走验货,责任归属在审核环节先行判定,\n判责环节可复核改写,以判责为终判。\n落点:after_sale_order.liability_party,不入 after_sale_audit。'} />,
        v: r.liability ? <StatusTag variant={r.liability === 'platform' ? 'req' : 'off'}>{LIABILITY[r.liability]}</StatusTag>
          : <span style={{ color: '#9CA3AF', fontSize: 12 }}>审核时必填</span> }]} />}
    </> : <div className="lp-blank">尚未审核。审核需给出结论(通过 / 驳回)与意见,驳回时必须写明驳回原因
      {!isReturn && ';仅退款分支还需在审核时先行判定责任归属'}</div>}
    {r.status === 'pending_audit' && <Button type="primary" icon={<AuditOutlined />} onClick={() => setAuditOpen(true)}>审核</Button>}
  </div>;

  /* --- 退货运单区:登记值与物流侧实时值合并为一张多列表,不再分两块单列 --- */
  const shipRows = r.ship ? [
    { rk: 's1', k: <TipText label="退货运单号(登记值)" tip={'after_sale_order.return_tracking_no。\n运营回填面单时登记,售后单自身留痕,\n不依赖实时调物流服务即可读、可线下追查。'} />,
      v: <span><span className="lp-code">{r.returnTrackingNo}</span>
        {trackingDrift && <StatusTag variant="pending">与物流侧不同</StatusTag>}</span> },
    { rk: 's2', k: <TipText label="退货承运商(登记值)" tip={'after_sale_order.return_carrier_code。\n库里存编码(与物流模块 carrier_code 对齐),\n展示名由承运商字典映射。'} />,
      v: <span>{carrierName(r.returnCarrierCode)}
        <span className="lp-code" style={{ marginLeft: 6 }}>{r.returnCarrierCode}</span></span> },
    { rk: 's3', k: '注册业务单号', v: <span className="lp-code">{r.ship.bizNo}</span> },
    { rk: 's4', k: <TipText label="运单号(物流侧当前值)" tip="来自物流信息服务实时数据,售后侧不冗余存储" />,
      v: <span className="lp-code">{r.ship.no}</span> },
    { rk: 's5', k: '承运商(物流侧)', v: carrierName(r.ship.carrierCode) },
    { rk: 's6', k: '标准化物流状态', v: <StatusTag variant={r.ship.internal === '已送达' ? 'on' : 'sale'}>{r.ship.internal}</StatusTag> },
    { rk: 's7', k: '注册时间', v: r.ship.regAt },
    { rk: 's8', k: '退货地址', v: <span style={{ fontSize: 12, color: '#4B5563' }}>{s ? s.addr : '—'}</span> },
  ] : [];
  const shipSection = <div style={{ marginBottom: 20 }}>
    <h4 className="lp-section">退货运单与物流轨迹</h4>
    {!isReturn ? <div className="lp-blank">仅退款场景无逆向物流,本区不适用</div> : (r.ship ? <>
      <div className="lp-sub"><DetailGrid rows={shipRows} cols={2} /></div>
      {trackingDrift && <Alert style={{ marginBottom: 12 }} type="warning" showIcon
        message="本单登记值与物流侧当前值已不一致 —— 这是预期行为,不是数据错误"
        description={REG_VS_LIVE_TIP + ' 本单:登记值 ' + r.returnTrackingNo + ',物流侧当前值 ' + r.ship.no + '。'} />}
      {(r.ship.track || []).length > 0 ? <Table size="small" rowKey="i" pagination={false} styles={TABLE_STYLES}
        columns={[{ title: '轨迹时间', dataIndex: 'at', width: 170 },
          { title: '标准化状态', dataIndex: 'st', width: 130, render: v => <StatusTag variant={v === '已送达' ? 'on' : 'sale'}>{v}</StatusTag> },
          { title: '轨迹描述', dataIndex: 'desc' }]} dataSource={r.ship.track} />
        : <div className="lp-blank">运单已注册,承运商尚未产生揽收轨迹。{SHIP_SLA_OFF_TIP}</div>}
      <div className="lp-note-sm" style={{ marginTop: 12 }}>
        轨迹由物流信息服务实时提供,售后侧不冗余存储。「已送达」是到仓时点的唯一来源,系统据此自动把售后单推到<b>待判责</b>,无人工签收登记。
        运单登记发生在<b>待寄回</b>阶段,退货在途起本入口不再开放。
      </div>
      {r.status === 'to_ship' && <Space size={12} style={{ marginTop: 12 }}>
        <Button icon={<CarOutlined />} onClick={() => setShipOpen(true)}>修改运单信息</Button>
        <Button icon={<ReloadOutlined />}>刷新轨迹</Button>
      </Space>}
      {r.status !== 'to_ship' && <Button style={{ marginTop: 12 }} icon={<ReloadOutlined />}>刷新轨迹</Button>}
    </> : <>
      <div className="lp-blank">尚未回填退货运单。面单由运营线下预约,拿到单号后在此回填并注册物流追踪。{SHIP_SLA_OFF_TIP}</div>
      <Button type="primary" icon={<CarOutlined />} style={{ marginTop: 12 }} onClick={() => setShipOpen(true)}>回填退货运单</Button>
    </>)}
  </div>;

  /* --- 判责区(验货结论 + 责任判定 + 退款金额同一步)--- */
  const adjRows = r.inspect ? [
    { rk: 'i1', k: '判责结论', v: <span><StatusTag variant={abnormal ? 'req'
      : (r.inspect.result === '与申请一致' ? 'on' : 'pending')}>{r.inspect.result}</StatusTag></span> },
    { rk: 'i2', k: <TipText label="责任归属(终判)" tip={'退货退款在判责环节判定且为终判。\n上游:原因码不带出、不预填责任。\n下游:本字段不联动任何金额。\n落点:after_sale_order.liability_party。'} />,
      v: r.liability ? <StatusTag variant={r.liability === 'platform' ? 'req' : 'off'}>{LIABILITY[r.liability]}</StatusTag> : dash('') },
    { rk: 'i3', k: '判责扣减金额', v: r.inspect.deduct > 0 ? money(r.sym, r.inspect.deduct) + ' ' + r.cur : money(r.sym, 0) },
    { rk: 'i4', k: '扣减原因', v: dash(r.inspect.deductReason) },
    r.inspect.outlet ? { rk: 'i5', k: <TipText label="异常结论处理出口"
      tip={'不符 / 空包经线下人工核实后三选一:\n' + Object.keys(OUTLETS).map(k => '· ' + OUTLETS[k].label).join('\n')} />,
      v: <StatusTag variant={r.inspect.outlet === 'deny' ? 'req' : 'sale'}>{OUTLETS[r.inspect.outlet].label}</StatusTag> } : null,
    { rk: 'i6', k: '录入人 / 时间', v: r.inspect.by + '(' + r.inspect.byType + ') · ' + r.inspect.at },
  ] : [];
  const adjSection = <div style={{ marginBottom: 20 }}>
    <h4 className="lp-section">判责结论、责任判定与退款金额</h4>
    {!isReturn && !r.inspect ? <>
      <div className="lp-blank">仅退款场景无实物回流,不做验货;本单在判责环节复核责任并确认退款金额,提交即发起退款</div>
      {canAdjudicate && <Button type="primary" style={{ marginTop: 12 }} icon={<AuditOutlined />}
        onClick={() => setAdjOpen(true)}>判责</Button>}
    </> : (r.inspect ? <>
      <div className="lp-sub">
        <DetailGrid rows={adjRows} cols={3} />
        <DetailGrid rows={[{ rk: 'inote', k: <TipText label="判责说明(内部)" tip={NOTE_INTERNAL_TIP} />,
          v: <span>{dash(r.inspect.note)}
            <span style={{ marginLeft: 8, fontSize: 12, color: '#6B7280' }}>内部字段,不对买家展示</span></span> }]} />
      </div>
      {(r.inspect.photos || []).length > 0 && <>
        <div style={{ fontSize: 13, color: '#6B7280', marginBottom: 8 }}>判责取证照片({(r.inspect.photos || []).length} 张)</div>
        <div className="lp-thumb-grid">
          {(r.inspect.photos || []).map(x => <div className="lp-thumb-wrap" key={x.i}>
            <div className="lp-thumb" onClick={() => setEvOpen(true)}><PictureOutlined /></div>
            <div className="lp-thumb-cap">{x.name}<br />{x.by} · {x.at.slice(5)}</div></div>)}
        </div></>}
      {denied && <Alert style={{ marginBottom: 12 }} type="error" showIcon
        message={'本单按「' + OUTLETS.deny.label + '」出口落终态「已关闭 · 拒退关单」,不产生任何退款单'}
        description={'判责结论为「' + r.inspect.result + '」,经线下人工核实后运营选择不退并关闭:不调支付域、不生成退款单、' +
          '不向订单商品行反写退款状态。商品按线下方式回寄买家,本期回寄这一程不进系统。' +
          '上方「判责说明」是内部字段,不外露给买家。' + DENY_REAPPLY_NOTE} />}
      {canAdjudicate && <Button icon={<AuditOutlined />} onClick={() => setAdjOpen(true)}>修改判责结论与退款金额</Button>}
    </> : <>
      <div className="lp-note-sm" style={{ marginBottom: 12 }}>
        验货在线下当地仓完成并回传在线表格,运营核对表格后在此录入。系统只承接结论,不承接仓库作业。
        <b>判责一步完成三件事</b>:录判责结论、定责任归属、填退款金额;<b>提交即调支付域退款接口</b>,单子进入「退款中」。
        结论为「退回件与订单不符 / 空包或无实物」时,同一步内还需选处理出口:全额退 / 部分退 / 不退并关闭(已关闭 · 拒退关单)。
        「{LOST_RESULT}」也是判责结论的一个取值,选中后必须写明认定依据 —— <b>没有独立的「标记丢件」动作</b>。
      </div>
      <div className="lp-blank">
        {canAdjudicate ? '本单已可判责:退货在途可直接判丢件,货已到仓则核对在线表格后录入结论' : '尚未到判责节点'}</div>
      <Button type="primary" disabled={!canAdjudicate} style={{ marginTop: 12 }}
        icon={<AuditOutlined />} onClick={() => setAdjOpen(true)}>判责</Button>
    </>)}
  </div>;

  /* --- 退款方案区:未发起时按预填值试算,已发起的展示成交值 --- */
  const settled = !!(rf && rf.refNo);
  const feePre = snapFee(r);
  const preview = refundPreview(r, feePre, r.inspect ? r.inspect.deduct : 0, 0);
  const shown = settled ? rf : preview;
  const refundRows = [
    { rk: 'r1', k: <TipText label="售后单主状态" tip="不随支付域退款结果变化:主状态机不含「退款失败」" />,
      v: <StatusTag variant={st.variant}>{st.label}</StatusTag> },
    { rk: 'r2', k: <TipText label="支付域退款单状态" tip={'展示的是支付域 refund_order 的执行状态,\n不是售后单状态。含失败态与失败原因。'} />,
      v: rf ? <StatusTag variant={REFUND_STATUS[rf.status].variant}>{REFUND_STATUS[rf.status].label}</StatusTag>
        : <StatusTag variant="off">待发起</StatusTag> },
    { rk: 'r3', k: '支付域退款单号', v: rf && rf.refNo ? <span className="lp-code">{rf.refNo}</span> : dash('') },
    { rk: 'r4', k: '失败原因', v: retry ? <span style={{ color: '#DC2626' }}>{rf.failReason}</span> : dash('') },
    { rk: 'r5', k: '退款到账时间', v: rf && rf.status === 'done' && rf.at ? rf.at : dash('') },
    { rk: 'r6', k: '定案人', v: rf && rf.by ? rf.by + '(' + rf.byType + ')' : dash('') },
  ];
  const refundSection = <div style={{ marginBottom: 20 }}>
    <h4 className="lp-section">退款方案与执行</h4>
    {denied ? <Alert type="error" showIcon
      message="本单为「已关闭 · 拒退关单」终态:不产生任何退款单"
      description="判责异常结论经线下人工核实后选择了「不退并关闭」出口 —— 不调支付域、不生成退款单、不向订单商品行反写退款状态。本区不展示金额试算,也没有发起退款入口。" /> : <>
    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 20, alignItems: 'start' }}>
      <div className="lp-preview">
        <div className="lp-preview-line"><span className="muted">退款基准(商品行实付,已扣优惠分摊)</span><span>{money(r.sym, shown.base)}</span></div>
        <div className="lp-preview-line">
          <span className="muted">退货服务费{settled ? '实扣(成交值)' : (feePre === null ? '(仅退款:预填为空,须手填)' : '(政策快照预填,可改)')}</span>
          <span>- {settled ? money(r.sym, shown.fee) : feeCell(r, feePre)}</span></div>
        <div className="lp-preview-line"><span className="muted">判责扣减</span><span>- {money(r.sym, shown.deduct)}</span></div>
        <div className="lp-preview-line"><span className="muted">
          {settled ? '最终退款金额' : '试算金额(以判责时填写值为准)'}({r.cur})</span>
          <span className="total">{money(r.sym, shown.amount)}</span></div>
      </div>
      <div className="lp-sub" style={{ marginBottom: 0 }}><DetailGrid rows={refundRows} cols={2} /></div>
    </div>
    {retry && <Alert style={{ marginTop: 12 }} type="error" showIcon
      message={'支付域退款单执行失败:' + rf.failReason}
      description={'失败回传时间 ' + rf.failAt + '。' + REFUNDING_TIP + ' 本单主状态仍为「' + st.label + '」,可直接重新发起。'} />}
    <div className="lp-note-sm" style={{ marginTop: 12 }}>
      判责提交时直连支付域创建退款单原路退回(不走订单域退款申请单),同时向订单商品行反写「退款中」,到账后置「已退款」。
      退款单号与执行状态由支付域回调写回;回调成功后售后单自动落「已完成」。<b>{FEE_SOURCE_TIP}</b>。本单:{feeSourceText(r)}。
    </div>
    {retry && <Button type="primary" style={{ marginTop: 12 }} icon={<ReloadOutlined />}
      onClick={() => setRetryOpen(true)}>重新发起退款</Button>}</>}
  </div>;

  const basicTab = <div>
    <h4 className="lp-section">基本信息</h4>
    <DetailGrid rows={baseRows} cols={3} />
    <DetailGrid rows={baseWideRows} />
    {r.closedAt && <>
      <h4 className="lp-section">关闭信息</h4>
      <div className="lp-sub"><DetailGrid rows={closeRows} cols={2} /></div>
    </>}
    <h4 className="lp-section">命中政策快照(policy_snapshot)</h4>
    <div className="lp-note-sm" style={{ marginBottom: 12 }}>
      建单时对命中的<b>整条政策</b>做快照留档,不是只存服务费一项。政策后续被运营改动或停用,均不回溯已建单据。
      {diffKeys.length > 0 && <span style={{ color: '#D97706' }}>　本单快照中有 {diffKeys.length} 项已与政策当前值不同,下方已标注。</span>}
    </div>
    {s ? <div className="lp-sub">
      <DetailGrid rows={policyRows} cols={3} />
      <DetailGrid rows={[{ rk: 'paddr', k: '退货地址', v: dash(s.addr) }]} />
    </div> : <div className="lp-blank">未命中政策快照</div>}
    {evSection}{auditSection}{shipSection}{adjSection}{refundSection}
  </div>;

  const timelineTab = <div>
    <div className="lp-note-sm" style={{ marginBottom: 16 }}>
      时间线与操作日志同一张表(after_sale_log),靠「买家可见」标记区分。本页仅展示买家可见条目,与 C 端进度页一致。
    </div>
    <Timeline items={tl.map((x, i) => ({
      key: i, color: i === 0 ? '#7C3AED' : '#9CA3AF',
      children: <div><div style={{ fontSize: 12, color: '#6B7280' }}>{x.at}</div>
        <div style={{ marginTop: 2 }}>{x.text}</div></div>,
    }))} />
  </div>;

  /* 操作日志固定在详情页底部常驻区(skill 规则 A.8),不做 Tab、也不从列表页行操作进入 */
  const logSection = <div style={{ marginTop: 8 }}>
    <OpLog data={logs} types={['创建', '审核通过', '审核驳回', '重新提交', '回填运单', '状态推进',
      '判责并退款', '发起退款', '退款失败回传', '拒退关单', '关单']} /></div>;

  return <Card style={CARD_STYLE}>
    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 16, marginBottom: 18 }}>
      <div>
        <Breadcrumb items={[{ title: <a onClick={() => go('as-list')}>售后工单</a> }, { title: '售后单详情' }]}
          style={{ marginBottom: 8 }} />
        <div style={{ fontSize: 20, fontWeight: 700 }}>
          <span className="lp-code">{r.id}</span>
          <span style={{ marginLeft: 10 }}><StatusTag variant={st.variant}>{st.label}</StatusTag></span>
          {rMark ? <span style={{ marginLeft: 4 }}><StatusTag variant="req">{rMark}</StatusTag></span> : null}
          {retry && <span style={{ marginLeft: 4 }}><StatusTag variant="req">退款失败待重试</StatusTag></span>}</div>
        <div style={{ color: '#6B7280', fontSize: 13, marginTop: 4 }}>
          {AS_TYPE[r.asType]} · {m.label} · 订单 {r.orderNo} · 申请于 {r.appliedAt}</div>
      </div>
      <Space>
        {r.status === 'pending_audit' && <Button type="primary" icon={<AuditOutlined />} onClick={() => setAuditOpen(true)}>审核</Button>}
        {/* 运单登记发生在待寄回阶段;退货在途已寄出,本入口不再开放 */}
        {r.status === 'to_ship' && <Button type="primary" icon={<CarOutlined />} onClick={() => setShipOpen(true)}>回填运单</Button>}
        {canAdjudicate && <Button type="primary" icon={<AuditOutlined />} onClick={() => setAdjOpen(true)}>判责</Button>}
        {retry && <Button type="primary" icon={<ReloadOutlined />} onClick={() => setRetryOpen(true)}>重新发起退款</Button>}
        {OPS_CLOSE_STATUS.indexOf(r.status) >= 0 && <Button danger icon={<CloseCircleOutlined />}
          onClick={() => setCloseOpen(true)}>关闭售后单</Button>}
        <Button icon={<EyeOutlined />} onClick={() => setEvOpen(true)}>附件</Button>
        <Button onClick={() => go('as-list')}>返回列表</Button>
      </Space>
    </div>
    <Tabs defaultActiveKey="basic" items={[
      { key: 'basic', label: '处理详情', children: basicTab },
      { key: 'timeline', label: '时间线(买家可见)', children: timelineTab },
    ]} />
    {logSection}
    <AuditModal key={'da' + r.id} open={auditOpen} onClose={() => setAuditOpen(false)} record={r} />
    <ShipmentModal key={'ds' + r.id} open={shipOpen} onClose={() => setShipOpen(false)} record={r} />
    <AdjudicateModal key={'di' + r.id} open={adjOpen} onClose={() => setAdjOpen(false)} record={r} />
    <RetryRefundModal key={'dr' + r.id} open={retryOpen} onClose={() => setRetryOpen(false)} record={r} />
    <CloseOrderModal key={'dc' + r.id} open={closeOpen} onClose={() => setCloseOpen(false)} record={r} />
    <EvidenceModal key={'de' + r.id} open={evOpen} onClose={() => setEvOpen(false)} record={r} />
  </Card>;
}
