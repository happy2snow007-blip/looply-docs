<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Looply 售后管理后台原型 v14</title>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/dayjs@1.11.21/dayjs.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/antd@6.4.3/dist/antd.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/@ant-design/icons@6.2.1/dist/index.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.28.4/babel.min.js"></script>
<style>
html,body,#root{height:100%;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F9FAFB;color:#1F2937}
#root::before{content:'正在加载 antd 原型……';position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#9CA3AF;font-size:14px}
#root:not(:empty)::before{display:none}
.lp-kpi{background:linear-gradient(180deg,#FEFCFF 0%,#F3EEFF 100%);border:1px solid #DDD6FE;border-radius:14px;padding:14px 16px}
.lp-kpi .num{font-size:24px;font-weight:700;color:#7C3AED;line-height:1;margin-bottom:6px;font-variant-numeric:tabular-nums}
.lp-kpi .label{font-size:12px;color:#6B7280}
.lp-pagination{display:flex;align-items:center;justify-content:center;gap:24px;padding:12px 16px;font-size:13px;color:#6B7280}
.lp-pagination .divider{width:1px;height:20px;background:#E5E7EB}
.lp-tip-trigger{cursor:help;border-bottom:1px dashed #9CA3AF;padding-bottom:1px}
.lp-note{padding:14px;border-radius:10px;background:#F3EEFF;border:1px solid #DDD6FE;color:#6D28D9;font-size:12px;line-height:1.8}
.lp-note-sm{padding:10px 14px;background:#F3EEFF;border:1px solid #DDD6FE;border-radius:8px;font-size:12px;color:#6D28D9;line-height:1.7}
.lp-section{font-size:15px;font-weight:600;color:#1F2937;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid #E5E7EB}
.lp-empty{display:flex;flex-direction:column;align-items:center;padding:60px 20px;text-align:center}
.lp-empty .icon{font-size:48px;margin-bottom:16px;color:#9CA3AF}
.lp-empty .icon.err{color:#DC2626}
.lp-empty .title{font-size:16px;font-weight:600;color:#1F2937;margin-bottom:8px}
.lp-empty .desc{font-size:13px;color:#6B7280;margin-bottom:24px;max-width:360px}
.lp-form-row{display:flex;gap:16px;margin-bottom:12px;align-items:center}
.lp-form-row:first-of-type{margin-top:8px}
.lp-form-row .lp-form-label{width:112px;text-align:right;color:#6B7280;font-size:13px;flex-shrink:0}
.lp-form-row .lp-form-label .req{color:#DC2626;margin-right:4px}
.lp-form-row .lp-form-control{flex:1}
.lp-helper{font-size:12px;color:#9CA3AF;margin:-4px 0 12px 128px}
.lp-detail{display:grid;grid-template-columns:132px 1fr;gap:10px 16px;font-size:13px;margin-bottom:20px}
/* 标签列右对齐(与 .lp-form-label 同一口径):标签右边缘与值左边缘各成一条竖线,
   同一区块里长短不一的标签不会把值挤成锯齿 */
.lp-detail .dl{color:#6B7280;text-align:right}
.lp-detail .dv{color:#1F2937}
/* 按行铺的两栏栅格:值与右邻标签之间只有 16px gap 会挤在一起,给值补一段右内边距 */
.lp-detail.lp-flow-row>.dv{padding-right:20px}
.lp-code{font-family:Menlo,Monaco,Consolas,monospace;font-size:12px;color:#374151;background:#F3F4F6;padding:1px 6px;border-radius:4px}
.lp-thumb-grid{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:12px}
.lp-thumb-wrap{width:104px;display:flex;flex-direction:column;gap:6px;align-items:center}
/* 缩略图底色用白 —— 它现在既出现在白底上，也出现在 .lp-sub 灰底块里，灰底上再套灰块会糊成一片 */
.lp-thumb{width:104px;height:104px;border-radius:10px;background:#FFFFFF;border:1px solid #E5E7EB;display:flex;align-items:center;justify-content:center;color:#9CA3AF;font-size:30px;cursor:pointer}
.lp-thumb:hover{border-color:#DDD6FE;background:#FAF5FF;color:#7C3AED}
.lp-thumb-cap{font-size:11px;color:#6B7280;text-align:center;line-height:1.4;word-break:break-all}
.lp-bigshot{height:320px;border-radius:12px;background:#F3F4F6;border:1px solid #E5E7EB;display:flex;align-items:center;justify-content:center;color:#9CA3AF;font-size:64px;margin-bottom:14px}
/* ===== 详情页统一模块语言(v14)==========================================
   一个模块 = 一种骨架，五个模块共用，不再一个模块一套排版：
     ① 模块标题 = .lp-section（黑 15/600 + 底线），全页只此一种标题层级
     ② 只读字段 = 一律装进 .lp-sub 灰底块，块内走 DetailGrid，标签列宽全页同一个值
     ③ 子区标题 = .lp-subtitle，只用于灰底块【外】的表格 / 图片组
     ④ 空态     = 字段级用 dash() 的「—」；模块或子区级用 .lp-nodata 一行灰字
   ====================================================================== */
/* 只读字段组容器：详情页与弹窗共用同一种灰底块 */
.lp-sub{border-radius:12px;background:#FAFAFA;padding:16px 18px;margin-bottom:16px}
.lp-sub>.lp-detail:last-child,.lp-sub>div:last-child .lp-detail{margin-bottom:0}
/* 子区标题：比 .lp-section 低一级，无底线，只给灰底块外的表格 / 图片组点名 */
.lp-subtitle{font-size:13px;font-weight:600;color:#374151;margin:0 0 10px}
/* 模块 / 子区级空态：一行灰字。不再用虚线空框 —— 空框比它要说的那句话占的地方还大 */
.lp-nodata{font-size:13px;color:#9CA3AF;padding:2px 0 10px}
/* 判责说明这一行专用：值本身是内部原文，值尾再挂一句灰字提醒它不对买家展示。
   与标签里的「(内部)」是双重标注 —— 标签说明字段属性，尾注说明外露边界，两处都要 */
.lp-inner-flag{margin-left:10px;font-size:12px;color:#9CA3AF;white-space:nowrap}
/* 金额值：只有「最终退款金额」这一个数用强调色；扣减用红色负数。都走等宽数字 */
.lp-amt{font-size:15px;font-weight:700;color:#7C3AED;font-variant-numeric:tabular-nums}
.lp-minus{color:#E11D48;font-variant-numeric:tabular-nums}
.lp-num{font-variant-numeric:tabular-nums}
:focus-visible{outline:none;box-shadow:inset 0 0 0 2px rgba(124,58,237,.4)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const TAG_COLORS = {
  on: { bg: '#F0FDF4', color: '#16A34A' }, sale: { bg: '#EFF6FF', color: '#2563EB' },
  pending: { bg: '#FFFBEB', color: '#D97706' }, off: { bg: '#F3F4F6', color: '#6B7280' },
  req: { bg: '#FEF2F2', color: '#DC2626' }, warn: { bg: '#FFF1F2', color: '#E11D48' },
};
function StatusTag({ variant, children }) {
  const c = TAG_COLORS[variant] || TAG_COLORS.off;
  return <Tag bordered={false} style={{ background: c.bg, color: c.color, borderRadius: 999,
    padding: '2px 8px', fontSize: 12, lineHeight: '18px', marginInlineEnd: 4 }}>{children}</Tag>;
}
function Kpi({ num, label, onClick }) {
  return <div className="lp-kpi" style={onClick ? { cursor: 'pointer' } : null} onClick={onClick}>
    <div className="label" style={{ marginBottom: 6 }}>{label}</div>
    <div className="num">{num}</div></div>;
}
function TipText({ label, tip }) {
  return <Tooltip title={<div style={{ whiteSpace: 'pre-line', lineHeight: 1.6 }}>{tip}</div>}
    color="#fff" styles={{ body: { color: '#374151', fontSize: 12, padding: '10px 14px' } }}>
    <span className="lp-tip-trigger">{label}</span></Tooltip>;
}
function CompactPagination({ total, current = 1, pageSize = 10 }) {
  const tp = Math.ceil(total / pageSize) || 1;
  const pages = [];

/* 信息类区块默认多列排布(cols),避免几十行标签值竖排成一条长队。
   rows 里的 key 用显式 rk(有 JSX 标签时 k 不能当 key)。
   labelWidth:标签列宽,不传时按列数取默认值。上下堆叠的两个 DetailGrid 若列数不同,
   必须显式传同一个 labelWidth,否则两块的「值」左边缘会差出 28px(默认 132 与 104 之差) */
function DetailGrid({ rows, cols, labelWidth, flow }) {
  const list = (rows || []).filter(Boolean);
  const n = cols || 1;
  const lw = (labelWidth || (n === 1 ? 132 : 104)) + 'px 1fr';
  const cell = (x, i) => <React.Fragment key={x.rk || i}>
    <div className="dl">{x.k}</div><div className="dv">{x.v}</div></React.Fragment>;
  if (n === 1) return <div className="lp-detail" style={{ gridTemplateColumns: lw }}>{list.map(cell)}</div>;
  /* flow='row':一张真正的两栏栅格,字段按「左 → 右 → 换行」铺(详情页统一用它)。
     默认的分组切法是「先竖着切成 n 段,再左右并排」,同一行的左右两项其实相隔 per 个位置 ——
     判责结论与责任归属这种「必须并排的一对」用默认切法会被竖着切开,落到同一列的上下两行。
     反过来,想让左栏整列是一组、右栏整列是另一组时(退款金额 vs 退款执行),
     把两组【交错】写进 rows 即可,不必再回到分组切法 */
  if (flow === 'row') return <div className="lp-detail lp-flow-row"
    style={{ gridTemplateColumns: (labelWidth || 104) + 'px 1fr ' + ((labelWidth || 104) + 'px 1fr ').repeat(n - 1) }}>
    {list.map(cell)}</div>;
  const per = Math.ceil(list.length / n);
  const groups = [];
  for (let i = 0; i < n; i++) groups.push(list.slice(i * per, (i + 1) * per));
  return <div style={{ display: 'grid', gridTemplateColumns: 'repeat(' + n + ',1fr)', gap: 0 }}>
    {groups.map((g, gi) => <div className="lp-detail" key={'g' + gi}
      style={{ gridTemplateColumns: lw, paddingRight: gi < n - 1 ? 20 : 0 }}>
      {g.map(cell)}</div>)}</div>;
}

    /* 两条驳回记录各自留原文:拆表前主表只存得下最近一次,第一次驳回说了什么会被覆盖掉。
       原文案里手写的「第二次驳回:」前缀已删 —— 次序由记录条数得出,不再靠人工写进原因里 */
    audits: [
      { result: '驳回', note: '举证只有整体外观照,看不出与商详描述不符;请补拍铆钉特写与内标照片',
        by: 'Ken', byType: '运营', at: '2026-07-29 17:40' },
      { result: '驳回', note: '补传的照片仍看不清铆钉与内标,请在自然光下重拍并对准细节',
        innerNote: '已电话联系买家指导拍摄角度,本次仍不清晰;下一次仍无法辨识则转线下鉴定',
        by: 'Ken', byType: '运营', at: '2026-07-30 16:12' },
    ],
    resubmittedAt: '2026-07-31 10:22',
    ship: null, inspect: null, refund: null,
    ev: [{ i: 1, name: 'IMG_7701.jpg 铆钉特写', by: '买家', at: '2026-07-31 10:20' },
      { i: 2, name: 'IMG_7702.jpg 内标', by: '买家', at: '2026-07-31 10:21' }],
    appliedAt: '2026-07-29 14:05', completedAt: '', closedAt: '', closeReason: '',
    operator: 'Ken', operatorType: '运营',
  },
];

/* ===== 工具 ===== */
const money = (sym, n) => sym + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const reasonOf = (code) => { const x = REASONS.find(r => r.code === code); return x ? x : null; };
/* 原因码快照 = 建单时对选中的那条原因码整条留档(after_sale_order.reason_snapshot),
   与政策快照【同一套机制】。原因码字典是运营随时可改的配置,改动不能把在途单带偏 ——
   一张已经在「待判责」的单,如果因为字典被改就变成「要寄回」,它已经跳过待寄回状态,回不去了。
   所以流程判据一律读本快照,不读字典当前值。
   原型用 reasonSnapDiff 模拟「快照值与字典当前值已不同」的情形 */
const reasonSnapOf = (r) => {
  const x = reasonOf(r.reasonCode);
  if (!x) return null;
  return { ...x, ...(r.reasonSnapDiff || {}), snapAt: r.appliedAt };
};
const reasonSnapDiffKeys = (r) => Object.keys(r.reasonSnapDiff || {});
/* 售后单上展示的原因文案同样取快照:字典改了措辞,历史单仍显示建单当时的那一份 */
const reasonLabelOf = (r) => { const x = reasonSnapOf(r); return x ? x.cn + ' / ' + x.text : '—'; };
/* 【本期流程分岔的唯一判据】要不要走「待寄回 → 退货在途」这两步,
   看【建单时留档的原因码快照】属于哪一组 —— 不看售后类型(类型本期恒为「退货」),
   也不实时查原因码字典。全文所有分支判断一律调本函数 */
const receivedOf = (r) => { const x = reasonSnapOf(r); return (x && x.received) ? x.received : 'received'; };
const needReturn = (r) => receivedOf(r) === 'received';
const policyOf = (id) => { const x = POLICIES.find(p => p.id === id); return x ? x : null; };
const marketOf = (code) => { const x = MARKETS.find(m => m.value === code); return x ? x : MARKETS[0]; };
const dash = (v) => (v === undefined || v === null || v === '') ? <span style={{ color: '#9CA3AF' }}>—</span> : v;
/* 退货扣减(界面展示名;ER 字段仍为 service_fee_amount)由运营决定,系统不按责任自动豁免、不按包裹分摊;
   预填取政策配置的退货服务费(政策快照值)、可手动修改 —— 该预填只发生在【判责弹窗】里,
   详情页不做任何试算展示(v14:详情页只展示已经发生的金额)。
   ⚠ 退还税费在 ER 中仍是字段(refund_tax_amount),本期界面不出 */
/* 政策快照 = 建单时对命中政策整条留档(after_sale_order.policy_snapshot)。
   原型用 policySnapDiff 模拟「快照值与当前政策已不同」的情形 */
const snapOf = (r) => {
  const p = policyOf(r.policyId);
  if (!p) return null;
  return { ...p, ...(r.policySnapDiff || {}), snapAt: r.appliedAt };
};
const snapDiffKeys = (r) => Object.keys(r.policySnapDiff || {});
/* 退款方案上「退货扣减」的【预填值】——
   唯一取 policy_snapshot.service_fee_amount(建单时冻结的整条政策快照里的退货服务费);
   after_sale_order.service_fee_quoted 只作申请时告知值与对账展示,不作为预填来源。
   不寄回的单返回 null(预填为【空】,不是 0),由运营手动填写;需寄回的单预填政策快照的退货服务费金额。
   两种情况都只是默认值,运营均可手动改写(不做只读、不做任何按责任的自动置 0 / 豁免联动) */
const snapFee = (r) => {
  if (!needReturn(r)) return null;
  const s = snapOf(r);
  return s ? Number(s.fee || 0) : null;
};

/* ===== 审核记录派生口径(after_sale_audit:一次审核一条记录,1:N)=====
   主表已删「审核结论 / 审核意见 / 审核时间 / 驳回次数」四个字段,下列口径全部从子表推导:
   · 历次审核记录         = 该单 after_sale_audit,按 audited_at 升序
   · 「这单被驳回过」     = 结论为驳回的记录【条数 ≥ 1】(不再看主表的驳回次数字段)
   · 「最近审核时间」     = 最近一条记录的 audited_at
   · 「当前正等待买家修改」= as_status=待审核 且 最近一条记录结论为驳回
                            且(resubmitted_at 为空 或 早于该条记录的 audited_at)
   ⚠ 列表页要显示「已驳回 N 次」,N 由接口 count 子表后聚合返回;
     不允许为前端取数方便把驳回次数字段加回主表 —— 它能从子表推出来,冗余就会出现两份不一致的真相 */
const auditsOf = (r) => r.audits || [];
const lastAudit = (r) => { const a = auditsOf(r); return a.length ? a[a.length - 1] : null; };
const lastAuditAt = (r) => { const a = lastAudit(r); return a ? a.at : ''; };
const rejectTimes = (r) => auditsOf(r).filter(x => x.result === '驳回').length;
const wasRejected = (r) => rejectTimes(r) > 0;
const waitingBuyerFix = (r) => {
  if (r.status !== 'pending_audit') return false;
  const a = lastAudit(r);
  if (!a || a.result !== '驳回') return false;
  return !r.resubmittedAt || r.resubmittedAt < a.at;
};
/* 待审核单的副标记:被驳回过才出,再按买家有没有在最近一次驳回之后重新提交分两种形态 */
const rejectMark = (r) => (r.status === 'pending_audit' && wasRejected(r))
  ? '已驳回 ' + rejectTimes(r) + ' 次 · ' + (waitingBuyerFix(r) ? '等买家修改' : '买家已重新提交,等运营审核')
  : '';

/* ===== 时间线(after_sale_log 中 is_customer_visible=1 的投影)===== */
function buildTimeline(r) {
  const t = [];
  t.push({ at: r.appliedAt, text: '买家提交售后申请(' + AS_TYPE[r.asType] + ' · ' + reasonLabelOf(r) + ')' });
  /* 历次审核各出一条:驳回原因取【当条记录】的 audit_note,不再是主表被覆盖过的最近一次值 */
  let rejSeq = 0;
  auditsOf(r).forEach(a => {
    if (a.result === '驳回') {
      rejSeq += 1;
      t.push({ at: a.at, text: '平台审核未通过(第 ' + rejSeq + ' 次):' + a.note + ' 请修改申请后重新提交。' });
    } else t.push({ at: a.at, text: '平台审核通过' });
  });
  /* resubmitted_at 只保留最近一次取值,故买家重新提交在时间线上最多出现一条 */
  if (r.resubmittedAt) t.push({ at: r.resubmittedAt, text: '买家已修改申请并重新提交,等待平台重新审核' });
  if (r.ship) {
    /* 告知买家的是售后单上的【登记值】,不是物流侧的实时值 */
    t.push({ at: r.ship.regAt, text: '已告知退货运单号 ' + r.returnTrackingNo +
      '(' + carrierName(r.returnCarrierCode) + '),请按退货地址交寄' });
    (r.ship.track || []).slice().reverse().forEach(k => t.push({ at: k.at, text: '物流:' + k.st + ' — ' + k.desc }));
  }
  /* 到仓检查完成条 —— 买家可见投影,写法与 C 端一致:
     只说【检查已完成】+【这对你的钱有什么影响】,一律【不拼】以下四样内部定性:
       · inspect.result(验货结论枚举,如「退回件与订单不符」「与申请一致」)
       · inspect.outlet(处理出口)
       · inspect.note(验货备注,内部研判字段)
       · liability(责任归属)
     C 端对照(UI/looply-售后C端-PC-v9.html):无扣减 = Everything checked out.;
     有扣减 = The dust bag was missing, so your return deduction came to $40.00.
     —— 后者报的是【退货扣减这一个总数】,不报拆分、不报定性。
     拒退关单的单没有退款,金额影响由紧随其后的关单条统一说,本条只报「检查已完成」 */
  if (r.inspect) {
    const ded = r.refund ? Number(r.refund.fee || 0) + Number(r.refund.deduct || 0) : 0;
    t.push({ at: r.inspect.at, text: '平台已完成退货商品的检查' + (!r.refund ? '。'
      : (ded > 0
        ? ',本次退货扣减 ' + money(r.sym, ded) + ',其余款项将退还给你。'
        : ',本次不产生退货扣减,商品行实付款项将全额退还给你。')) });
  }
  if (r.refund && r.refund.refNo) t.push({ at: r.refund.at,
    text: '已发起退款,金额 ' + money(r.sym, r.refund.amount) + ',退款单 ' + r.refund.refNo + ',请留意到账' });
  if (r.refund && r.refund.status === 'failed') t.push({ at: r.refund.failAt,
    text: '退款执行失败,平台正在重新处理,本单仍为退款中' });
  if (r.refund && r.refund.status === 'done') t.push({ at: r.completedAt || r.refund.at,
    text: '退款已到账,售后单完成' });
  /* 关单条目按 close_reason 三种来源分别成文(状态机只有一个 closed,差异全靠 close_reason):
     · 拒退关单 —— 本时间线是买家可见投影,【不拼 closeReason】:该字段在拒退单里含验货结论
       (如「退回件与订单不符」),拼进来等于把验货结论泄露给买家;买家只看到
       「不予退款 + 商品回寄」这个固定的客观结果,以及仍可重新申请
     · 运营关闭 —— 必须让买家看到「可以重新申请」,否则关了单买家仍以为被卡住
     · 买家撤销 */
  if (r.closedAt) t.push({ at: r.closedAt, text: r.closeCode === 'deny_close'
    ? '经线下人工核实后不予退款,商品将按线下方式回寄给你。' + REAPPLY_NOTE
    : r.closeReason + '。' + (r.closeCode === 'ops_close' ? OPS_CLOSE_RELEASE_TIP : '') + REAPPLY_NOTE });
  return t.filter(x => x.at).sort((a, b) => (a.at < b.at ? 1 : -1));
}
function buildLogs(r) {
  const out = [];
  let i = 0;
  const add = (at, who, type, detail, vis) => { if (at) out.push({ i: ++i, at, who, type, detail, vis }); };
  /* 不寄回的单建单时不报退货服务费,故这条日志不带金额;不在日志里复述分岔依据 */
  add(r.appliedAt, '买家', '创建', !needReturn(r)
    ? '买家在 C 端提交售后申请'
    : '买家在 C 端提交售后申请,申请时已告知退货服务费参考金额 ' + money(r.sym, r.feeQuoted), true);
  /* 每次审核最多出两条日志,按对外性拆开 —— 与拒退关单同一处理:
     · 买家可见条:通过只写结果;驳回只写【驳回原因】,该原文会原样进驳回邮件
     · 内部条:【审核意见】只在后台留痕,买家看不到,故单独成条且 vis=false
     绝不把审核意见拼进买家可见那条 */
  auditsOf(r).forEach(a => {
    const passed = a.result === '通过';
    add(a.at, a.by, passed ? '审核通过' : '审核驳回',
      passed
        ? '审核通过,售后单继续推进'
        : '驳回原因:' + a.note + ' | 已发送驳回通知邮件,等买家修改后重新提交', true);
    if (a.innerNote) add(a.at, a.by, passed ? '审核通过' : '审核驳回',
      '审核意见(内部,买家看不到本条):' + a.innerNote, false);
  });
  if (r.resubmittedAt) add(r.resubmittedAt, '买家', '重新提交',
    '买家在 C 端修改申请后重新提交,等待重新审核', true);
  if (r.ship) add(r.ship.regAt, r.operator || 'Lily', '回填运单',
    '登记退货运单号 ' + r.returnTrackingNo + ' / 承运商 ' + carrierName(r.returnCarrierCode) +
    ',已注册物流追踪并向买家告知退货地址', true);
  if (r.ship && (r.ship.track || []).some(k => k.st === '已送达'))
    add(r.ship.track.find(k => k.st === '已送达').at, '系统', '状态推进', '物流已送达,售后单自动推进至待判责', true);
  if (r.inspect) add(r.inspect.at, r.inspect.by, '判责并退款', '结论:' + r.inspect.result +
    ' | 责任归属:' + (r.liability ? LIABILITY[r.liability] : '未录入') +
    (r.inspect.outlet ? ' | 处理出口:' + OUTLETS[r.inspect.outlet].label : '') +
    ' | 判责说明:' + r.inspect.note, false);
  if (r.refund && r.refund.refNo) add(r.refund.at, r.refund.by, '发起退款',
    '退款基准 ' + money(r.sym, r.refund.base) + ' - 退货扣减 ' + money(r.sym, r.refund.fee) +
    ' = ' + money(r.sym, r.refund.amount) + ',退款单 ' + r.refund.refNo + ';售后单进入「退款中」', true);
  if (r.refund && r.refund.status === 'failed') add(r.refund.failAt, '系统', '退款失败回传',
    '退款单 ' + r.refund.refNo + ' 执行失败:' + r.refund.failReason + '。本单仍为「退款中」,需重新发起', true);
  if (r.refund && r.refund.status === 'done') add(r.completedAt || r.refund.at, '系统', '状态推进',
    '退款成功(退款单 ' + r.refund.refNo + '),售后单推进至「已完成」', true);
  /* 拒退关单拆成两条日志:买家可见条只写客观结果;内部条承载判责说明原文,不外露。
     ⚠ 买家可见那条【不拼】验货结论 inspect.result、也【不拼】处理出口名 —— 与买家可见时间线同一口径。
     运营要看结论 / 出口 / 责任归属,上面「判责并退款」那条(vis=false)已经全量承载,不会因此丢信息 */
  if (r.closedAt && r.closeCode === 'deny_close') {
    add(r.closedAt, r.operator || 'Lily', '拒退关单',
      '经线下人工核实后不予退款:不产生退款单,售后单关闭,商品按线下方式回寄买家。' + DENY_REAPPLY_NOTE, true);
    if (r.inspect && r.inspect.note) add(r.closedAt, r.operator || 'Lily', '拒退关单',
      '判责说明(内部,买家看不到本条):' + r.inspect.note, false);
  }
  if (r.closedAt && r.closeCode !== 'deny_close') add(r.closedAt,
    r.operatorType === '买家' ? '买家' : (r.closeCode === 'ops_close' ? (r.operator || '运营') : '系统'), '关单',
    '关闭原因:' + (r.closeCode ? CLOSE_REASONS[r.closeCode].label : '') + ' — ' + r.closeReason + '。' +
    (r.closeCode === 'ops_close'
      ? '邮件告知买家:' + (r.closeNotify ? '是,关单邮件已发出' : '否,未发关单邮件') + '。' + OPS_CLOSE_RELEASE_TIP
      : REAPPLY_NOTE), true);
  return out.sort((a, b) => (a.at < b.at ? 1 : -1)).map((x, k) => ({ ...x, i: k + 1 }));
}

/* ============================================================
   共享弹窗(规则 A.19:列表页 + 详情页同一操作复用同一组件)
   ============================================================ */

/* 1. 审核弹窗
   审核【不再判责任归属】—— 两条流程分支都没有该控件,
   责任归属统一留到判责环节录入(判责弹窗对两个分支都开着该控件)。
   审核只做三件事:定结论(通过 / 驳回)、写意见 / 驳回原因、推进状态。
   · 驳回 → 售后单回到「待审核」等买家修改后重新提交 */
function AuditModal({ open, onClose, record }) {
  const r = record || AS_ORDERS[0];
  const [result, setResult] = useState('pass');
  /* 两个输入框对应两个字段,不共用一个 state:
     · note      = 驳回原因,【买家可见】,原样进驳回邮件正文,仅驳回时出现
     · innerNote = 审核意见,【仅内部】,通过 / 驳回都可写,只进操作日志的内部条 */
  const [note, setNote] = useState('');
  const [innerNote, setInnerNote] = useState('');
  /* 提交成功 toast 里报下一站;界面上不再常驻「通过后进入」行 */
  const nextTo = needReturn(r) ? '待寄回' : '待判责';
  return <Modal title="审核售后申请" open={open} onCancel={onClose} closable={false} maskClosable={false} centered width={660}
    footer={[<Button key="c" onClick={onClose}>取消</Button>,
      <Button key="s" type="primary"
        onClick={() => { toast(result === 'pass' ? '审核已通过,售后单推进至「' + nextTo + '」' : '已驳回,驳回通知邮件已发出'); onClose(); }}>
        提交审核结论</Button>]}>
    {/* 只读核对区统一收进一个灰底容器,与下方输入区拉开层级;长文本(买家说明 / 历次审核)独占整行。
       两个 DetailGrid 列数不同,必须同传 SUB_LABEL_W,否则售后单号与售后原因 / 买家说明的值对不齐 */}
    <div className="lp-sub">
      <DetailGrid cols={2} labelWidth={SUB_LABEL_W} rows={[
        { rk: 'id', k: '售后单号', v: <span className="lp-code">{r.id}</span> },
        { rk: 'type', k: '售后类型', v: AS_TYPE[r.asType] },
      ]} />
      <DetailGrid labelWidth={SUB_LABEL_W} rows={[
        { rk: 'reason', k: '售后原因', v: reasonLabelOf(r) },
        { rk: 'note', k: '买家说明', v: dash(r.note) },
        /* 拆表后历次驳回原因都在,弹窗里直接列全 —— 运营再审时要看得到前几次已经要求过买家补什么 */
        wasRejected(r) ? { rk: 'aud', k: '历次审核记录', v: <div>
          <div><StatusTag variant="req">已驳回 {rejectTimes(r)} 次</StatusTag>
            <span style={{ color: '#6B7280', fontSize: 12 }}>
              {waitingBuyerFix(r) ? '最近一次驳回后买家尚未重新提交'
                : (r.resubmittedAt ? '买家已于 ' + r.resubmittedAt + ' 重新提交,本次为再审' : '')}</span></div>
          <div style={{ marginTop: 6 }}>{auditsOf(r).map((a, i) => <div key={'am' + i}
            style={{ fontSize: 12, marginBottom: 6 }}>
            <div style={{ color: '#6B7280' }}>{a.at} · {a.result} · {a.by}</div>
            {a.note ? <div style={{ color: '#DC2626' }}>驳回原因(已发给买家):{a.note}</div> : null}
            {a.innerNote ? <div style={{ color: '#6B7280' }}>审核意见(仅内部):{a.innerNote}</div> : null}
          </div>)}</div></div> } : null,
      ]} />
    </div>
    <FormRow label="审核结论" required>
      <Radio.Group value={result} onChange={e => setResult(e.target.value)}
        options={[{ value: 'pass', label: '通过' }, { value: 'reject', label: '驳回' }]} /></FormRow>
    {/* 驳回时两个框同时出现,驳回原因在上、审核意见在下。
       两者对外性完全不同,差异写进各自的 placeholder(不靠灰字 helper 说明) */}
    {result === 'reject' && <FormRow label="驳回原因" required>
      <Input.TextArea rows={3} value={note} onChange={e => setNote(e.target.value)}
        placeholder="写清要买家补什么、怎么改 —— 本内容会原样发送给买家" /></FormRow>}
    <FormRow label="审核意见">
      <Input.TextArea rows={3} value={innerNote} onChange={e => setInnerNote(e.target.value)}
        placeholder={result === 'reject'
          ? '内部判断记这里,买家看不到 —— 例:该买家本月第 2 次以「与描述不符」发起售后,举证疑似二次拍摄'
          : '内部判断记这里,买家看不到 —— 例:成色快照与举证一致,先受理,到仓再核'} /></FormRow>
  </Modal>;
}

/* 2. 回填退货运单弹窗
   运营在本弹窗输入的运单号与承运商,落库到售后单自己的两个字段
   (after_sale_order.return_tracking_no / return_carrier_code),不只是传给物流服务注册追踪 ——
   目的是让售后单自身可读、可线下追查,不依赖实时调物流服务。
   承运商存 code(与物流模块 carrier_code 对齐),展示名由 CARRIERS 字典映射。
   轨迹与实时状态只从物流服务取,本域不冗余 */
function ShipmentModal({ open, onClose, record }) {
  const r = record || AS_ORDERS[0];
  const s = snapOf(r);
  const [no, setNo] = useState(r.returnTrackingNo || '');
  const [carrier, setCarrier] = useState(r.returnCarrierCode || undefined);
  return <Modal title="回填退货运单并注册物流追踪" open={open} onCancel={onClose} closable={false} maskClosable={false} centered width={640}
    footer={[<Button key="c" onClick={onClose}>取消</Button>,
      <Button key="s" type="primary" onClick={() => { toast('运单已保存并注册追踪,退货运单号邮件已发出'); onClose(); }}>
        保存并注册追踪</Button>]}>
    <FormRow label="退货运单号" required>
      <Input value={no} onChange={e => setNo(e.target.value)} placeholder="线下预约面单拿到的承运商运单号" /></FormRow>
    <FormRow label="承运商" required>
      <Select value={carrier} onChange={setCarrier} style={{ width: 300 }} placeholder="选择承运商"
        options={CARRIER_OPTIONS} /></FormRow>
    <FormRow label="退货地址" helper="不可在此修改">
      <Input.TextArea rows={2} value={s ? s.addr : ''} disabled /></FormRow>
    <Alert style={{ marginTop: 8 }} type="info" showIcon
      message="保存后向买家发出「退货运单号」邮件" />
  </Modal>;
}

/* 3-A. 【共享子组件】退款方案字段组(规则 A.19 第一层)
   只三行:退款基准(只读)/ 退货扣减(可改,有预填)/ 最终退款金额(可改,有预填),不出明细表。
   「退货扣减」是这笔钱在运营端与 C 端统一的展示名(C 端 Return deduction),ER 字段名仍为 service_fee_amount。
   退货扣减与退款金额双向联动,两者之和恒等于退款基准,联动在父组件的 setter 里完成。
   本组件为纯受控组件、内部不调用任何 Hook(规则 A.13) */
function RefundPlanFields({ r, fee, setFee, amount, setAmount, locked }) {
  const prefill = snapFee(r);
  const base = r.item.paid;
  const effFee = locked ? 0 : fee;
  const effAmount = locked ? base : amount;
  const feeEdited = !locked && Number(fee || 0) !== Number(prefill || 0);
  return <>
    <FormRow label="退款基准">
      <Input value={money(r.sym, base)} disabled /></FormRow>
    <FormRow label="退货扣减" required={!locked}>
      <Space size={12} wrap>
        <InputNumber value={effFee} onChange={setFee} min={0} max={base} precision={2} prefix={r.sym}
          disabled={locked} placeholder={prefill === null ? '请手动填写' : '扣减总额'} style={{ width: 200 }} />
        {!locked && prefill !== null && <Button size="small" disabled={!feeEdited}
          onClick={() => setFee(prefill)}>恢复默认值</Button>}
        {feeEdited && <span style={{ fontSize: 12, color: '#D97706' }}>
          已改写,默认值为 {money(r.sym, prefill)}</span>}
      </Space>
      {/* 不填 = 按 0 退,系统有意不拦 —— 只提示,不加阻断 */}
      {!locked && (fee === null || fee === undefined || fee === '') && <div
        style={{ color: '#D97706', fontSize: 12, marginTop: 6 }}>
        退货扣减未填写:提交后按 <b>{money(r.sym, 0)}</b> 计,请确认这是本单的扣减意图。
      </div>}</FormRow>
    <FormRow label="最终退款金额" required={!locked}>
      <Space size={12} wrap>
        <InputNumber value={effAmount} onChange={setAmount} min={0} max={base} precision={2} prefix={r.sym}
          disabled={locked} style={{ width: 200 }} />
        <span style={{ fontSize: 13, color: '#7C3AED', fontWeight: 700 }}>
          实退给买家 {money(r.sym, effAmount)} {r.cur}</span>
      </Space></FormRow>
  </>;
}

/* 3-B. 判责弹窗:判责结论 + 责任判定 + 退款金额【同一步完成】,提交即调支付域退款接口
   入口开放在两个状态:退货在途 / 待判责。
   · 需寄回的单:录判责结论(含「退回途中丢件」)+ 责任归属 + 退款方案
   · 不寄回的单(原因属「未收到货」):货没到、无实物可验,不录判责结论;
     责任归属在本步录入(审核环节已不再判责任)
   · 异常结论(退回件与订单不符 / 空包或无实物):经线下人工核实后在同一步内三选一出口,
     选「不退并关闭」则不调退款接口,直接落已关闭 · 拒退关单
   不设「判责异常·待人工处理」挂起态:人工核实是线下动作,核实完再回系统录入即可。
   丢件不设独立动作:它是判责结论的一个取值,选中后必须写明认定依据 */
function AdjudicateModal({ open, onClose, record }) {
  const r = record || AS_ORDERS[0];
  /* 本单走不走寄回 —— 判据是售后原因所属分组,不是售后类型 */
  const needShip = needReturn(r);
  const arriveAt = r.ship && (r.ship.track || []).find(k => k.st === '已送达');
  const [result, setResult] = useState(r.inspect ? r.inspect.result : undefined);
  const [note, setNote] = useState(r.inspect ? r.inspect.note : '');
  const [liab, setLiab] = useState(r.liability || undefined);
  const [outlet, setOutlet] = useState(r.inspect && r.inspect.outlet ? r.inspect.outlet : undefined);
  const initFee = r.refund && r.refund.refNo ? r.refund.fee : snapFee(r);
  const [fee, setFeeRaw] = useState(initFee);
  const [amount, setAmountRaw] = useState(Math.max(0, r.item.paid - Number(initFee || 0)));
  /* 退货扣减与最终退款金额双向联动:两者之和恒等于退款基准,改哪一个另一个跟着反算 */
  const onFee = (v) => { setFeeRaw(v); setAmountRaw(Math.max(0, r.item.paid - Number(v || 0))); };
  const onAmount = (v) => { setAmountRaw(v); setFeeRaw(Math.max(0, r.item.paid - Number(v || 0))); };
  /* 选中「退回途中丢件」时把责任归属默认置为平台责任(常规口径),运营仍可改判买家责任 */
  const onResult = (v) => { setResult(v); if (v === LOST_RESULT && !liab) setLiab('platform'); };
  const abnormal = ABNORMAL_RESULTS.indexOf(result) >= 0;
  const deny = abnormal && outlet === 'deny';
  const full = abnormal && outlet === 'full';
  /* 字段构成按两个维度收敛,不存在第三种形态:
     ① 要不要寄回(看售后原因)—— 需寄回的单比不寄回的单多【判责结论】
                    (货没收到就没有实物回流,没有验货结论可录)与【瑕疵照片】(同理无实物可拍)
     ② 入口状态 —— 退货在途货还没到、拿不到照片 → 不出【瑕疵照片】;待判责货已到仓 → 出该项
     责任归属 / 判责说明 / 退款方案 三项在所有形态下都出,不寄回的单责任归属在本弹窗首次录入 */
  const canPhoto = needShip && r.status === 'to_adjudicate';
  const blocked = (needShip && !result) || (abnormal && !outlet) || !liab;
  const sysRows = needShip
    ? [['售后单号', r.id], ['订单号 / 商品行', r.orderNo + '  ·  ' + r.item.pid], ['商品名称', r.item.name],
      ['到仓日期', arriveAt ? arriveAt.at : '尚未送达(退货在途,可直接判丢件)'],
      ['订单成色快照', r.item.grade], ['当前状态', AS_STATUS[r.status].label]]
    : [['售后单号', r.id], ['订单号 / 商品行', r.orderNo + '  ·  ' + r.item.pid], ['商品名称', r.item.name],
      ['售后原因', reasonLabelOf(r)],
      ['最近审核结论', lastAudit(r) ? lastAudit(r).result : '—'],
      ['最近审核时间', lastAudit(r) ? lastAudit(r).at : '—']];
  return <Modal title="判责" open={open} onCancel={onClose}
    closable={false} maskClosable={false} centered width={780}
    footer={[<Button key="c" onClick={onClose}>取消</Button>,
      <Button key="s" type="primary" danger={deny} disabled={blocked}
        onClick={() => { toast(deny ? '已关闭售后单(拒退关单),未产生退款单' : '判责已提交,退款已发起,售后单进入「退款中」'); onClose(); }}>
        {deny ? '判责并关闭售后单(拒退关单)' : '判责并发起退款'}</Button>]}>
    {/* 只读核对项收进灰底容器,不再用「一、二、三」分步标题,字段平铺;
       标签列与下方表单区同宽(见 SUB_LABEL_W),两区的值落在同一条竖线上 */}
    <div className="lp-sub">
      <DetailGrid cols={2} labelWidth={SUB_LABEL_W} rows={sysRows.map((x, i) => ({ rk: 'sr' + i, k: x[0], v: x[1] }))} />
    </div>
    {needShip && <FormRow label="判责结论" required>
      <Select value={result} onChange={onResult} style={{ width: 300 }} placeholder="选择判责结论"
        options={INSPECT_RESULTS.map(x => ({ value: x, label: x }))} /></FormRow>}
    <FormRow label="责任归属" required>
      <Radio.Group value={liab} onChange={e => setLiab(e.target.value)} options={LIABILITY_OPTIONS} /></FormRow>
    <FormRow label="判责说明">
      <Input.TextArea rows={3} value={note} onChange={e => setNote(e.target.value)}
        placeholder="例:外观无新增瑕疵,配件齐全,成色与订单快照一致;判丢件时请写明认定依据(承运商查件案号、轨迹停留天数等)" /></FormRow>
    {canPhoto && <FormRow label="瑕疵照片">
      <Upload listType="picture-card" maxCount={8} beforeUpload={() => false}>
        <div><PlusOutlined /><div style={{ marginTop: 8, fontSize: 12 }}>上传</div></div></Upload></FormRow>}

    {abnormal && <>
      <Alert style={{ margin: '4px 0 12px' }} type="warning" showIcon message={ABNORMAL_TIP} />
      <FormRow label="处理出口" required>
        <Radio.Group value={outlet} onChange={e => setOutlet(e.target.value)} options={OUTLET_OPTIONS} /></FormRow>
      {!outlet && <Alert style={{ marginBottom: 12 }} type="warning" showIcon
        message="处理出口未选择,无法提交" />}
      {outlet && <div className="lp-note-sm" style={{ marginBottom: 12 }}>
        已选<b>{OUTLETS[outlet].label}</b>:{OUTLETS[outlet].desc}</div>}
    </>}

    {!deny && <RefundPlanFields r={r} fee={fee} setFee={onFee} amount={amount} setAmount={onAmount} locked={full} />}
    {deny && <Alert style={{ marginTop: 16 }} type="error" showIcon
      message="已选「不退并关闭(拒退关单)」:本单不退款、不产生退款单"
      description="提交后售后单直接关闭,商品按线下方式回寄买家。" />}
  </Modal>;
}

/* 4. 重新发起退款弹窗
   判责时金额已经定过了,本弹窗只服务【退款执行失败】的单:金额沿用成交值、【不可修改】,
   运营核对「退款基准 / 扣了多少 / 实付 / 实退」四个数字后点确定即可 */
function RetryRefundModal({ open, onClose, record }) {
  const r = record || AS_ORDERS[0];
  const rf = r.refund || {};
  const rows = [
    { rk: 'paid', k: '商品行实付', v: money(r.sym, r.item.paid) + ' ' + r.cur },
    { rk: 'base', k: '退款基准', v: money(r.sym, rf.base === undefined ? r.item.paid : rf.base) + ' ' + r.cur },
    { rk: 'fee', k: '退货扣减', v: '- ' + money(r.sym, rf.fee || 0) + ' ' + r.cur },
    { rk: 'amt', k: '实退金额', v: <span style={{ fontSize: 15, fontWeight: 700, color: '#7C3AED' }}>
      {money(r.sym, rf.amount || 0)} {r.cur}</span> },
  ];
  return <Modal title="重新发起退款" open={open} onCancel={onClose}
    closable={false} maskClosable={false} centered width={620}
    footer={[<Button key="c" onClick={onClose}>取消</Button>,
      <Button key="s" type="primary" onClick={() => { toast('已重新发起退款,售后单仍为「退款中」'); onClose(); }}>
        确定</Button>]}>
    <div className="lp-note" style={{ marginBottom: 14 }}>
      退款单 {rf.refNo || ''} 于 {rf.failAt || ''} 回传失败
    </div>
    <div className="lp-sub" style={{ marginBottom: 0 }}><DetailGrid rows={rows} cols={2} /></div>
  </Modal>;
}

/* 5. 关闭售后单弹窗
   规则 A.19:列表页行操作与详情页页头是同一个操作的两个入口 → 只此一份实现,两处 <CloseOrderModal> 引用。
   ⚠ 关闭必须释放该商品行的互斥占用,否则买家仍然无法重新申请 ——
      界面上必须把这句话明确说给运营看,它是运营敢不敢按这个按钮的决定性信息 */
function CloseOrderModal({ open, onClose, record }) {
  const r = record || AS_ORDERS[0];
  const [note, setNote] = useState('');
  /* 是否邮件告知买家由运营手动勾选。默认勾选 —— 运营关闭时买家不是发起方,不通知他会一直等;
     但保留取消勾选的能力(如客服已在电话里当场答复完)。两种取值都进操作日志留痕 */
  const [notify, setNotify] = useState(true);
  return <Modal title="关闭售后单" open={open} onCancel={onClose} closable={false} maskClosable={false} centered width={680}
    footer={[<Button key="c" onClick={onClose}>取消</Button>,
      <Button key="s" type="primary" danger
        onClick={() => { toast(notify ? '售后单已关闭,关单邮件已发给买家' : '售后单已关闭,未发关单邮件'); onClose(); }}>
        确认关闭售后单</Button>]}>
    {/* 三个只读项与下方「关闭说明」「关闭后通知」两个表单项同走 MODAL_LABEL_W:
       标签右对齐、右边缘对齐,四项的值左边缘落在同一条竖线上 */}
    <DetailGrid labelWidth={MODAL_LABEL_W} rows={[
      { rk: 'id', k: '售后单号', v: <span className="lp-code">{r.id}</span> },
      { rk: 'st', k: '当前状态', v: <span>
        <StatusTag variant={AS_STATUS[r.status].variant}>{AS_STATUS[r.status].label}</StatusTag>
        <span style={{ color: '#6B7280', fontSize: 12, marginLeft: 8 }}>非终态,关闭后落终态「已关闭」</span></span> },
      { rk: 'oi', k: '订单 / 商品行', v: <span>
        <span className="lp-code">{r.orderNo}</span>
        <span style={{ color: '#6B7280', fontSize: 12, marginLeft: 8 }}>{r.orderItemId} · {r.item.name}</span></span> },
    ]} />

    <FormRow label="关闭说明" helper="选填。填了的话,买家在 C 端进度页会看到这段说明">
      <Input.TextArea rows={3} value={note} onChange={e => setNote(e.target.value)} /></FormRow>

    {/* 是否邮件告知买家 —— 运营手动勾选,勾选状态进操作日志。
       勾选与否的后果由 helper(CLOSE_NOTIFY_TIP)一句话讲完,控件下方不再跟一条随勾选状态变化的复述 */}
    <FormRow label="关闭后通知" helper={CLOSE_NOTIFY_TIP}>
      <Checkbox checked={notify} onChange={e => setNotify(e.target.checked)}>
        邮件告知买家本单已关闭</Checkbox></FormRow>
  </Modal>;
}

/* 6. 超期特批建单弹窗
   特批【只免时效校验】,其他校验照常执行 —— 命中下列任一即建单失败:
   ① 该商品行已有进行中的售后单
   ② 该商品行已退成钱(存在已完成的售后单) —— 走没走寄回都算,判据是钱有没有退出去 */
const OVERDUE_ITEMS = [
  { value: 'OI7823001', label: 'OI7823001 · P1002381 CHANEL Classic Flap 中号', block: '' },
  { value: 'OI7823002', label: 'OI7823002 · P1005520 CELINE Triomphe 太阳镜', block: '' },
  { value: 'OI7823003', label: 'OI7823003 · P1004417 LOUIS VUITTON Neverfull MM',
    block: '已有进行中的售后单 AS20260728006(退货在途)' },
  { value: 'OI7823004', label: 'OI7823004 · P1006612 PRADA Re-Edition 2005 尼龙包',
    block: '该商品行已退成钱 —— 退货已完成(售后单 AS20260722011)' },
  { value: 'OI7823005', label: 'OI7823005 · P1007244 GUCCI Marmont 链条包',
    block: '该商品行已退成钱 —— 售后单 AS20260710002 已完成' },
];
function OverdueCreateModal({ open, onClose }) {
  const [note, setNote] = useState('');
  const [items, setItems] = useState([]);
  const blockedItems = OVERDUE_ITEMS.filter(x => items.indexOf(x.value) >= 0 && x.block);
  const canSubmit = items.length > 0 && blockedItems.length === 0;
  return <Modal title="超期特批建单" open={open} onCancel={onClose} closable={false} maskClosable={false} centered width={680}
    footer={[<Button key="c" onClick={onClose}>取消</Button>,
      <Button key="s" type="primary" disabled={!canSubmit}
        onClick={() => { toast('已为 ' + items.length + ' 个商品行特批建单'); setItems([]); setNote(''); onClose(); }}>
        确认建单</Button>]}>
    <div className="lp-note-sm" style={{ marginBottom: 14 }}>
      仅用于<b>已超出政策时效窗口</b>的订单。
    </div>
    <FormRow label="订单号" required>
      <Input defaultValue="ORD20260714029" placeholder="输入订单号,如 ORD20260714029" /></FormRow>
    <FormRow label="商品行" required helper="可多选。已有进行中或已完成售后单的商品行不可选">
      <Select mode="multiple" value={items} onChange={setItems} allowClear
        style={{ width: '100%', maxWidth: 560 }} placeholder="选择要发起售后的商品行(可多选)"
        options={OVERDUE_ITEMS.map(x => ({ value: x.value,
          label: x.label + (x.block ? '　—— ' + x.block : '') }))} /></FormRow>
    {blockedItems.length > 0 && <Alert style={{ marginBottom: 12 }} type="error" showIcon
      message="以下商品行不能建单,请先取消选择"
      description={<div>{blockedItems.map(b => <div key={b.value}>{b.value}:{b.block}</div>)}</div>} />}
    <FormRow label="售后类型" required>
      <Radio.Group defaultValue="return_refund"
        options={Object.keys(AS_TYPE).map(k => ({ value: k, label: AS_TYPE[k] }))} /></FormRow>
    <FormRow label="选择售后原因" required>

/* 10. 建单快照弹窗(详情页右上角入口)

   「这单建的时候,规则长什么样」;拆成两个入口,反而要先想该点哪一个。

function SnapshotModal({ open, onClose, record }) {
  const r = record || AS_ORDERS[0];

  const diffKeys = snapDiffKeys(r);

  const reasonRows = rs ? [

    { rk: 'rtx', k: '展示文案', v: <span>{rs.text} {rMark('text')}</span> },
    { rk: 'rcn', k: '中文备注', v: <span>{rs.cn} {rMark('cn')}</span> },
    { rk: 'rev', k: '举证要求', v: <span>
      <StatusTag variant={rs.ev ? 'req' : 'off'}>{rs.ev ? '必传' : '选传'}</StatusTag> {rMark('ev')}</span> },
  ] : [];
  const mark = (key) => diffKeys.indexOf(key) >= 0
    ? <StatusTag variant="pending">与政策当前值不同</StatusTag> : null;
  const rows = s ? [
    { rk: 'pid', k: '快照来源政策', v: <span className="lp-code">{s.id}</span> },
    { rk: 'pat', k: '快照时间', v: s.snapAt },
    { rk: 'pmk', k: '适用市场', v: marketOf(s.market).label },
    { rk: 'psc', k: '适用范围', v: <span><StatusTag variant="sale">{SCOPE_TYPE[s.scopeType]}</StatusTag>
      {s.scopeValue ? s.scopeValue : '全部商品'}</span> },
    { rk: 'ppr', k: '同层优先级', v: s.priority },
    { rk: 'prt', k: '是否支持退货', v: <StatusTag variant={s.returnable ? 'on' : 'req'}>{s.returnable ? '支持' : '不支持'}</StatusTag> },
    { rk: 'pvd', k: '售后时效天数', v: <span>签收后 {s.validDays} 天 {mark('validDays')}</span> },
    { rk: 'pfee', k: '退货服务费',
      v: <span>{money(marketOf(s.market).sym, s.fee)} {s.cur} {mark('fee')}</span> },
    { rk: 'pcur', k: '币种', v: s.cur },
    { rk: 'pst', k: '快照时政策状态', v: <StatusTag variant={s.status === 'on' ? 'on' : 'off'}>{s.status === 'on' ? '启用' : '停用'}</StatusTag> },
  ] : [];
  return <Modal title="建单快照" open={open} onCancel={onClose} closable={false} maskClosable={false} centered width={760}
    footer={[<Button key="c" onClick={onClose}>关闭</Button>]}>
    <h4 className="lp-section">售后原因快照</h4>
    {rDiffKeys.length > 0 && <div className="lp-note-sm" style={{ marginBottom: 12, color: '#D97706' }}>
      本单有 {rDiffKeys.length} 项已与字典当前值不同,下方已标注。
    </div>}
    {rs ? <div className="lp-sub"><DetailGrid rows={reasonRows} cols={2} /></div>
      : <div className="lp-nodata">未留存原因码快照</div>}
    <h4 className="lp-section">售后政策快照</h4>
    {diffKeys.length > 0 && <div className="lp-note-sm" style={{ marginBottom: 12 }}>
      <span style={{ color: '#D97706' }}>本单快照中有 {diffKeys.length} 项已与政策当前值不同,下方已标注。</span>
    </div>}
    {s ? <div className="lp-sub" style={{ marginBottom: 0 }}>
      <DetailGrid rows={rows} cols={2} />
      <DetailGrid rows={[{ rk: 'paddr', k: '退货地址', v: dash(s.addr) }]} />
    </div> : <div className="lp-nodata">未命中政策快照</div>}
  </Modal>;
}

/* ============================================================
   页面 1:售后工单列表
   ============================================================ */
function AfterSaleListPage({ go }) {
  const [mode, setMode] = useState('data');
  /* 单号只留一个输入框:运营手上拿到的往往就是「一串号」,先分清它是售后单号 / 订单号 / 物流单号
     再挑输入框是多余的一步。一个框同时匹配三个字段,三种号的编码规则本身互不重叠 */
  const [kw, setKw] = useState('');
  /* 状态由 Tab 承载主视图,不再另设状态筛选下拉 */
  const [statusTab, setStatusTab] = useState('all');
  const [liabF, setLiabF] = useState('');
  const [marketF, setMarketF] = useState('');
  const [cur, setCur] = useState(null);
  const [auditOpen, setAuditOpen] = useState(false);
  const [shipOpen, setShipOpen] = useState(false);
  const [adjOpen, setAdjOpen] = useState(false);
  const [retryOpen, setRetryOpen] = useState(false);
  const [closeOpen, setCloseOpen] = useState(false);
  const [overdueOpen, setOverdueOpen] = useState(false);

  /* 一个关键词命中三个字段中的任意一个即算匹配:售后单号 / 订单号 / 物流单号(return_tracking_no) */
  const hitNo = (r, k) => {
    const q = k.trim().toLowerCase();
    return [r.id, r.orderNo, r.returnTrackingNo].some(x => (x || '').toLowerCase().indexOf(q) >= 0);
  };
  const rows = AS_ORDERS.filter(r => {
    if (kw && !hitNo(r, kw)) return false;
    if (statusTab !== 'all' && r.status !== statusTab) return false;
    if (liabF && r.liability !== liabF) return false;
    if (marketF && r.market !== marketF) return false;
    return true;
  });
  const cnt = (s) => AS_ORDERS.filter(r => r.status === s).length;
  const retryCnt = AS_ORDERS.filter(isRetry).length;
  const openWith = (rec, setter) => { setCur(rec); setter(true); };
  const reset = () => { setKw(''); setStatusTab('all'); setLiabF(''); setMarketF(''); };
  /* 角标只挂【运营待办】:待审核 / 待判责 —— 这两个状态运营不动手就推不动。
     待寄回、退货在途在等买家交寄与等物流;退款中在等支付域回调,都不是运营待办,故不挂角标。
     退款中 Tab 例外:失败待重试的那部分是运营待办,故角标只计失败数,不计全部退款中。 */
  const PENDING_TABS = ['pending_audit', 'to_adjudicate'];
  const tabLabel = (key, text) => {
    const n = key === 'all' ? AS_ORDERS.length : cnt(key);
    if (PENDING_TABS.indexOf(key) >= 0)
      return <Badge count={n} size="small" offset={[10, -2]}><span style={{ paddingRight: 4 }}>{text}</span></Badge>;
    if (key === 'refunding' && retryCnt > 0)
      return <Badge count={retryCnt} size="small" offset={[10, -2]} title="退款失败待重试">
        <span style={{ paddingRight: 4 }}>{text}({n})</span></Badge>;
    return <span>{text}({n})</span>;
  };
  const tabItems = [{ key: 'all', label: tabLabel('all', '全部') }]
    .concat(STATUS_ORDER.map(k => ({ key: k, label: tabLabel(k, AS_STATUS[k].label) })));

  const columns = [
    { title: '售后单号', dataIndex: 'id', width: 155, render: v => <span className="lp-code">{v}</span> },
    { title: '订单号', dataIndex: 'orderNo', width: 155, render: v => <span className="lp-code">{v}</span> },
    { title: '商品行', key: 'item', width: 260, render: (_, r) => <div>
      <div>{r.item.name}</div>
      <div style={{ fontSize: 12, color: '#6B7280', marginTop: 2 }}>{r.item.pid} · 成色快照 {r.item.grade} · 实付 {money(r.sym, r.item.paid)}</div></div> },
    /* 售后类型本期恒为「退货」,只出这一个 tag。
       ⚠「需寄回 / 不用寄回」「已收到货 / 未收到货」这类分岔标注,
       运营端界面【全部不出】—— 列表、详情、审核弹窗、快照弹窗、启停弹窗一处都没有。
       售后原因文案本身已经说清(「显示已送达但未收到」「运输中丢件」「包裹为空」「投递失败退回」),
       再挂 tag 是冗余。分岔逻辑仍由 receivedOf / needReturn 照常执行,只是不上屏。
       唯一仍展示 received 的地方 = 原因码编辑表单(那是配置来源,不是单据标注)*/
    { title: '售后类型', dataIndex: 'asType', width: 110,
      render: v => <StatusTag variant="sale">{AS_TYPE[v]}</StatusTag> },
    /* 原因列展示的是【建单时留档的那一份】,不是字典当前值 —— 字典改了,历史单照旧显示原样 */
    { title: '原因', dataIndex: 'reasonCode', width: 210, render: (v, r) => { const x = reasonSnapOf(r); return x ? <div>
      <div>{x.cn}</div>
      <div style={{ fontSize: 12, color: '#6B7280' }}>{x.text}</div></div> : dash(''); } },
    /* 状态列只显示状态本身:驳回次数、退款失败、买家撤销等补充信息一律在详情页查 */
    { title: '状态', dataIndex: 'status', width: 110,
      render: v => <StatusTag variant={AS_STATUS[v].variant}>{AS_STATUS[v].label}</StatusTag> },
    { title: '责任归属', dataIndex: 'liability', width: 120,
      render: (v, r) => v ? <StatusTag variant={v === 'platform' ? 'req' : 'off'}>{LIABILITY[v]}</StatusTag>
        : (liabNeverJudged(r) ? dash('')
          : <span style={{ color: '#9CA3AF', fontSize: 12 }}>{LIABILITY_STAGE_TIP}</span>) },
    { title: 'Market', dataIndex: 'market', width: 110, render: v => marketOf(v).label },
    /* 退款失败待重试的单靠本列的支付结果标记被看见(不做筛选器) */
    { title: '退款金额 / 支付结果', key: 'amt', width: 165, align: 'right',
      render: (_, r) => r.refund && r.refund.refNo ? <div>
        <div>{money(r.sym, r.refund.amount)}</div>
        <div style={{ marginTop: 2 }}><StatusTag variant={REFUND_STATUS[r.refund.status].variant}>{REFUND_STATUS[r.refund.status].label}</StatusTag></div>
      </div> : dash('') },
    { title: '申请时间', dataIndex: 'appliedAt', width: 155 },
    { title: '操作', key: 'op', width: 250, fixed: 'right', render: (_, r) => {
      const ops = [{ key: 'detail', label: '详情', onClick: () => go('as-detail', r) }];
      if (r.status === 'pending_audit') ops.push({ key: 'audit', label: '审核', onClick: () => openWith(r, setAuditOpen) });
      /* 运单登记发生在待寄回阶段:退货在途已经寄出,无登记场景,故本入口只对待寄回开放 */
      if (r.status === 'to_ship') ops.push({ key: 'ship', label: '运单', onClick: () => openWith(r, setShipOpen) });
      /* 判责入口开放在两个状态:退货在途(可直接判丢件)+ 待判责。丢件是判责结论的一个取值,无独立按钮 */
      if (ADJUDICATE_STATUS.indexOf(r.status) >= 0) ops.push({ key: 'adj', label: '判责', onClick: () => openWith(r, setAdjOpen) });
      if (isRetry(r)) ops.push({ key: 'retry', label: '重新退款', onClick: () => openWith(r, setRetryOpen) });
      /* 待寄回 / 退货在途 两个阶段给运营一个手动关单出口(必填原因、留痕、释放商品行互斥占用)。
         按 A.1.1 排序规则,危险操作放最后;本页操作数最多的行为 3 个,不触发 >4 收纳规则,
         Dropdown 分支保留以防后续再加操作 */
      if (OPS_CLOSE_STATUS.indexOf(r.status) >= 0) ops.push({ key: 'close', label: '关闭售后单',
        danger: true, onClick: () => openWith(r, setCloseOpen) });
      const flat = ops.length <= 4 ? ops : ops.slice(0, 3);
      const more = ops.length <= 4 ? [] : ops.slice(3);
      const moreItems = [];
      more.forEach(o => { if (o.danger && moreItems.length) moreItems.push({ type: 'divider' });
        moreItems.push({ key: o.key, label: o.label, danger: o.danger }); });
      return <Space size={6}>
        {flat.map(o => <Button key={o.key} size="small" danger={o.danger} onClick={o.onClick}>{o.label}</Button>)}
        {more.length > 0 && <Dropdown trigger={['click']} menu={{ items: moreItems,
          onClick: ({ key }) => { const t = more.find(o => o.key === key); if (t && t.onClick) t.onClick(); } }}>
          <Button size="small" icon={<EllipsisOutlined />} /></Dropdown>}</Space>;
    } },
  ];

  return <Card style={CARD_STYLE}>
    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 16, marginBottom: 18 }}>
      <div>
        <div style={{ fontSize: 20, fontWeight: 700, marginBottom: 6 }}>售后工单</div>
        <div style={{ color: '#6B7280', fontSize: 13 }}>发货后的全部逆向申请</div>
      </div>
      <Space>
        <Button icon={<ClockCircleOutlined />} onClick={() => setOverdueOpen(true)}>超期特批建单</Button>
        <Button icon={<DownloadOutlined />}
          onClick={() => toast('已生成导出文件(' + rows.length + ' 条),稍后可在浏览器下载列表查看')}>导出</Button>
      </Space>
    </div>

    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4,1fr)', gap: 12, marginBottom: 18 }}>
      <Kpi num={cnt('pending_audit')} label="待审核" onClick={() => setStatusTab('pending_audit')} />
      <Kpi num={cnt('to_adjudicate')} label="待判责" onClick={() => setStatusTab('to_adjudicate')} />
      <Kpi num={cnt('refunding')} label="退款中" onClick={() => setStatusTab('refunding')} />
      <Kpi num={retryCnt} label="退款失败待重试" onClick={() => setStatusTab('refunding')} />
    </div>

    <Space size={12} wrap style={{ marginBottom: 12 }}>
      <Input placeholder="售后单号 / 订单号 / 物流单号" prefix={<SearchOutlined style={{ color: '#9CA3AF' }} />} allowClear
        value={kw} onChange={e => setKw(e.target.value)} style={{ width: 300 }} />
      <Select value={liabF} onChange={setLiabF} style={{ width: 140 }} options={[{ value: '', label: '全部责任归属' },
        ...LIABILITY_OPTIONS]} />
      <Select value={marketF} onChange={setMarketF} style={{ width: 150 }} options={[{ value: '', label: '全部 Market' },
        ...MARKETS.map(m => ({ value: m.value, label: m.label }))]} />
      <DatePicker.RangePicker placeholder={['申请开始日期', '申请结束日期']} />
      <Button type="primary" icon={<SearchOutlined />}
        onClick={() => toast('已按当前条件查询,共 ' + rows.length + ' 条')}>查询</Button>
      <Button icon={<ReloadOutlined />} onClick={reset}>重置</Button>
    </Space>
    <Tabs activeKey={statusTab} items={tabItems} style={{ marginBottom: 16 }}
      onChange={setStatusTab} />

    {mode === 'data' && <>
      <Table rowKey="id" columns={columns} dataSource={rows} pagination={false} styles={TABLE_STYLES}
        scroll={{ x: 'max-content' }} />
      <CompactPagination total={rows.length} pageSize={10} /></>}
    {mode === 'zero' && <EmptyZero entity="售后工单" />}
    {mode === 'no-match' && <EmptyNoMatch onClear={() => { reset(); setMode('data'); }} />}
    {mode === 'error' && <EmptyError onRetry={() => setMode('data')} />}
    <EmptyStateSwitcher mode={mode} setMode={setMode} />

    <AuditModal key={'a' + (cur ? cur.id : '0')} open={auditOpen} onClose={() => setAuditOpen(false)} record={cur} />
    <ShipmentModal key={'s' + (cur ? cur.id : '0')} open={shipOpen} onClose={() => setShipOpen(false)} record={cur} />
    <AdjudicateModal key={'i' + (cur ? cur.id : '0')} open={adjOpen} onClose={() => setAdjOpen(false)} record={cur} />
    <RetryRefundModal key={'r' + (cur ? cur.id : '0')} open={retryOpen} onClose={() => setRetryOpen(false)} record={cur} />
    <CloseOrderModal key={'c' + (cur ? cur.id : '0')} open={closeOpen} onClose={() => setCloseOpen(false)} record={cur} />
    <OverdueCreateModal open={overdueOpen} onClose={() => setOverdueOpen(false)} />
  </Card>;
}

/* ============================================================
   页面 2:售后单详情(运营端主界面)

   【统一模块语言】全页 4 个模块(基本信息 / 退货信息 / 判责信息 / 操作记录)共用同一副骨架,
   不再一个模块一套排版:
     · 模块标题 = <h4 className="lp-section">(黑 15/600 + 底线),全页只此一种标题层级
     · 只读字段 = 一律装进 .lp-sub 灰底块,块内走 DetailGrid,标签列宽一律 DETAIL_LABEL_W
     · 子区标题 = .lp-subtitle,只用于灰底块【外】的表格 / 图片组
     · 空态     = 字段级用 dash() 的「—」;模块 / 子区级用 .lp-nodata 一行灰字
     · 按钮     = 推进状态的动作只在页头;模块内只留作用于本模块内容的按钮(刷新轨迹)

   【展示口径】本页只展示这单【已经发生】的事实。尚未产生的数据一律留空,
   不出试算值 / 预填值 / 默认值 —— 金额尤其:未判责前退款基准、退货扣减、最终退款金额
   一个数字都不出。判责弹窗按政策快照预填退货扣减是【运营填表】用的,与本页展示是两回事,
   照旧保留。
   ============================================================ */
function AfterSaleDetailPage({ go, record }) {
  const r = record || AS_ORDERS[0];
  const [auditOpen, setAuditOpen] = useState(false);
  const [shipOpen, setShipOpen] = useState(false);
  const [adjOpen, setAdjOpen] = useState(false);
  const [retryOpen, setRetryOpen] = useState(false);
  const [evOpen, setEvOpen] = useState(false);
  /* 大图查看:pv = { list, i } —— list 是本组缩略图的完整数组,i 是点中的那一张。
     买家举证与判责取证是两组独立的图,各自翻页,不混在一起 */
  const [pv, setPv] = useState(null);
  const [closeOpen, setCloseOpen] = useState(false);
  const [snapOpen, setSnapOpen] = useState(false);
  const [tlOpen, setTlOpen] = useState(false);
  const s = snapOf(r);
  const m = marketOf(r.market);
  /* 本单走不走寄回 —— 判据是售后原因所属分组,不是售后类型(类型本期恒为「退货」) */
  const needShip = needReturn(r);
  const closed = !!r.closedAt;
  const denied = r.closeCode === 'deny_close';
  /* 本域登记值与物流侧当前值可能不一致 —— 这是预期行为,不是错误 */
  const trackingDrift = !!(r.ship && r.returnTrackingNo && r.ship.no !== r.returnTrackingNo);
  const rf = r.refund;
  const retry = isRetry(r);
  const st = AS_STATUS[r.status];
  const logs = buildLogs(r);
  /* 「被驳回过」与「当前等买家修改」是两个口径:前者只看记录条数(不限状态),后者还要看 resubmitted_at */
  const waitFix = waitingBuyerFix(r);
  const rMark = rejectMark(r);
  const canAdjudicate = ADJUDICATE_STATUS.indexOf(r.status) >= 0;
  /* 判责 / 退款的三个判据,页头按钮与判责信息模块共用同一套,避免两处各判一次判出两个结果 */
  const settled = !!(rf && rf.refNo);                                    // 退款单已产生
  const judged = !!r.inspect || settled;                                 // 判过责(不寄回的单没有验货结论,退款已发起即判过)
  const neverJudged = !judged && TERMINAL_STATUS.indexOf(r.status) >= 0;  // 终态却从未判责:买家撤销 / 运营关闭
  const abnormal = !!(r.inspect && ABNORMAL_RESULTS.indexOf(r.inspect.result) >= 0);

  /* --- 基本信息 --------------------------------------------------------------
     阅读顺序 = 这单是什么 → 谁的 → 走到哪 → 怎么结束的。两栏按行铺,相邻两项自然成对:
       (单号,类型)(订单,买家)(市场,状态)(申请时间,超期特批)(最近审核时间,完成 / 关闭时间)…
     已关闭单把关闭时间 / 关闭原因 / 邮件告知接在时间之后 —— 「怎么结束的」本来就是这条
     时间线的最后一段,不再单开一个「关闭信息」模块。
     ⚠ 责任归属【不在本模块】:它是判责结论,归判责信息。摆两处会出现两个真相,
       而且未判责的单在这里只能写「尚未录入」,那正是本版要清掉的预填式占位。
     ⚠ 售后单状态只出状态本身:驳回次数 / 退款失败待重试已由页头标签承载,此处不复述 --- */
  const baseRows = [
    { rk: 'id', k: '售后单号', v: <span className="lp-code">{r.id}</span> },
    { rk: 'type', k: '售后类型', v: <StatusTag variant="sale">{AS_TYPE[r.asType]}</StatusTag> },
    { rk: 'ord', k: '所属订单', v: <span className="lp-code">{r.orderNo}</span> },
    { rk: 'user', k: '买家', v: r.user },
    { rk: 'mk', k: '所属市场', v: m.label },
    { rk: 'st', k: '售后单状态', v: <StatusTag variant={st.variant}>{st.label}</StatusTag> },
    { rk: 't1', k: '申请时间', v: dash(r.appliedAt) },
    { rk: 'ovd', k: '超期人工特批', v: r.overdue
      ? <span><StatusTag variant="pending">是</StatusTag>{r.overdueNote}</span> : '否' },
    { rk: 't2', k: '最近审核时间', v: dash(lastAuditAt(r)) },
    /* 完成时间与关闭时间互斥:一张单要么走到已完成,要么走到已关闭,不会两个都有。
       没关闭的单出完成时间(未完成时为「—」),关闭的单出关闭三项 */
    closed ? null : { rk: 't3', k: '完成时间', v: dash(r.completedAt) },
    closed ? { rk: 'ct', k: '关闭时间', v: r.closedAt } : null,
    closed ? { rk: 'cr', k: '关闭原因', v: r.closeCode
      ? <StatusTag variant={CLOSE_REASONS[r.closeCode].variant}>{CLOSE_REASONS[r.closeCode].label}</StatusTag>
      : dash('') } : null,
    /* 邮件告知这个开关只有「运营关闭」这一种来源才有,买家撤销 / 拒退关单没有,故不出该行 */
    (closed && r.closeCode === 'ops_close') ? { rk: 'cn', k: '邮件告知买家',
      v: <span style={{ color: r.closeNotify ? '#1F2937' : '#D97706' }}>{r.closeNotify ? '是' : '否'}</span> } : null,
  ];
  /* 长字段(整行)顺序同理:商品行 → 原因 → 买家说的 → 买家给的材料 → 被驳回过说了什么 → 怎么关的 */
  const baseWideRows = [
    { rk: 'item', k: '订单商品行', v: <span>{r.item.name}
      <span style={{ color: '#6B7280', fontSize: 12, marginLeft: 8 }}>
        商品 ID {r.item.pid} · 成色等级快照 {r.item.grade} · 商品行实付 {money(r.sym, r.item.paid)} {r.cur}</span></span> },
    { rk: 'reason', k: '售后原因',
      v: <span>{reasonLabelOf(r)}
        <span className="lp-code" style={{ marginLeft: 8 }}>{r.reasonCode}</span></span> },
    { rk: 'note', k: '买家补充说明', v: dash(r.note) },
    /* 缩略图已经把图都铺出来了,点缩略图即看大图;附件清单与运营补传在同一个弹窗里,入口是「运营补传」 */
    { rk: 'ev', k: '买家举证附件', v: <div>
      {(r.ev || []).length > 0 ? <div className="lp-thumb-grid">
        {r.ev.map((x, xi) => <div className="lp-thumb-wrap" key={x.i}>
          <div className="lp-thumb" title="点击查看大图"
            onClick={() => setPv({ list: r.ev, i: xi })}><PictureOutlined /></div>
          <div className="lp-thumb-cap">{x.name}<br />{x.by} · {x.at.slice(5)}</div></div>)}
      </div> : <div style={{ color: '#9CA3AF', marginBottom: 8 }}>买家未上传举证材料</div>}
      <Button size="small" icon={<UploadOutlined />} onClick={() => setEvOpen(true)}>运营补传</Button>
      </div> },
    /* 「当前正等买家修改」这一状态由页头的 rejectMark 标签承载,此处只放原文 */
    waitFix ? { rk: 'rej', k: '最近一次驳回原因',
      v: <span style={{ color: '#DC2626' }}>{lastAudit(r).at} · {lastAudit(r).note}</span> } : null,
    closed ? { rk: 'cd', k: '关闭说明', v: <span style={{ color: '#DC2626' }}>{dash(r.closeReason)}</span> } : null,
  ];
  const basicSection = <div style={{ marginBottom: 24 }}>
    <h4 className="lp-section">基本信息</h4>
    <div className="lp-sub">
      <DetailGrid rows={baseRows} cols={2} flow="row" labelWidth={DETAIL_LABEL_W} />
      <DetailGrid rows={baseWideRows} labelWidth={DETAIL_LABEL_W} />
    </div>
  </div>;

  /* --- 退货信息 --------------------------------------------------------------
     运单号 / 承运商只展示售后单登记值一份;少数被物流侧改过号的单靠 trackingDrift 标记 + 告警条
     把物流侧当前值带出来,不常驻两套字段。
     轨迹表在灰底块外,由 .lp-subtitle 点名 —— 表格自带边框容器,再套一层灰底就是两层框 --- */
  const shipRows = r.ship ? [
    { rk: 's1', k: '退货运单号',
      v: <span><span className="lp-code">{r.returnTrackingNo}</span>
        {trackingDrift && <StatusTag variant="pending">与物流侧不同</StatusTag>}</span> },
    { rk: 's2', k: '退货承运商',
      v: <span>{carrierName(r.returnCarrierCode)}
        <span className="lp-code" style={{ marginLeft: 6 }}>{r.returnCarrierCode}</span></span> },
    { rk: 's6', k: '物流状态', v: <StatusTag variant={r.ship.internal === '已送达' ? 'on' : 'sale'}>{r.ship.internal}</StatusTag> },
  ] : [];
  const shipAddrRows = r.ship ? [{ rk: 's8', k: '退货地址', v: dash(s ? s.addr : '') }] : [];
  const shipSection = <div style={{ marginBottom: 24 }}>
    <h4 className="lp-section">退货信息</h4>
    {!needShip ? <div className="lp-nodata">本单无需退货寄回</div> : (r.ship ? <>
      <div className="lp-sub">
        <DetailGrid rows={shipRows} cols={2} flow="row" labelWidth={DETAIL_LABEL_W} />
        <DetailGrid rows={shipAddrRows} labelWidth={DETAIL_LABEL_W} />
      </div>
      {trackingDrift && <Alert style={{ marginBottom: 16 }} type="warning" showIcon
        message={REG_VS_LIVE_TIP + '(登记值 ' + r.returnTrackingNo + ',物流侧当前值 ' + r.ship.no + ')'} />}
      <div className="lp-subtitle">退货轨迹</div>
      {(r.ship.track || []).length > 0 ? <Table size="small" rowKey="i" pagination={false} styles={TABLE_STYLES}
        columns={[{ title: '轨迹时间', dataIndex: 'at', width: 170 },
          { title: '物流状态', dataIndex: 'st', width: 130, render: v => <StatusTag variant={v === '已送达' ? 'on' : 'sale'}>{v}</StatusTag> },
          { title: '轨迹描述', dataIndex: 'desc' }]} dataSource={r.ship.track} />
        : <div className="lp-nodata">承运商尚未产生揽收轨迹</div>}
      {/* 刷新轨迹作用于本模块自己的内容,故留在模块内;回填 / 修改运单会推进状态,只在页头 */}
      <Button style={{ marginTop: 12 }} icon={<ReloadOutlined />}
        onClick={() => toast('轨迹已刷新')}>刷新轨迹</Button>
    </> : <div className="lp-nodata">尚未回填退货运单</div>)}
  </div>;

  /* --- 判责信息 --------------------------------------------------------------
     判责与退款【合并为一个模块】。模块内三组,顺序按「判了什么 → 凭什么判 → 钱怎么走」:
       ① 灰底块:判责结论 / 责任归属(两栏、标签右边缘对齐、值用 tag)
                 + 判责说明(内部)另起整行,值尾挂灰字「不对买家展示」
       ② 灰底块【外】:判责取证照片,子区标题带张数 —— 图要点开看,与一眼扫完的结论读法不同
       ③ 灰底块:退款六项。左三行是钱怎么算的(基准 / 扣减 / 最终),右三行是钱走到哪了
                 (退款单号 / 执行状态 / 到账时间),由同一个 cols=2 栅格切出来,不另造并排布局

     ⚠ 没有内容就不占位置:
       · 未判责的单 —— 不摆试算金额、不摆「待发起 / — / —」占位,整个模块只留一行「尚未判责」
       · 已关闭且从未判责(买家撤销 / 运营关闭)—— 只留一行「暂无判责信息」
       · 拒退关单判过责,骨架照出,只是把退款那一组换成一行说明(它真的没有退款单)
     删掉的四项不回来:录入人与时间 / 定案人 → 操作记录;失败原因 → 下方红色告警条 --- */
  const verdictRows = [
    (needShip && r.inspect) ? { rk: 'i1', k: '判责结论', v: <StatusTag variant={abnormal ? 'req'
      : (r.inspect.result === '与申请一致' ? 'on' : 'pending')}>{r.inspect.result}</StatusTag> } : null,
    r.liability ? { rk: 'i2', k: '责任归属',
      v: <StatusTag variant={r.liability === 'platform' ? 'req' : 'off'}>{LIABILITY[r.liability]}</StatusTag> } : null,
    (r.inspect && r.inspect.outlet) ? { rk: 'i5', k: '异常结论处理出口',
      v: <StatusTag variant={r.inspect.outlet === 'deny' ? 'req' : 'sale'}>{OUTLETS[r.inspect.outlet].label}</StatusTag> } : null,
  ].filter(Boolean);
  /* 判责说明与上面几项同属「判了什么」,故同在这个灰底块内,但占整行(自由文本,两栏挤不下)。
     标签带「(内部)」+ 值尾挂灰字「不对买家展示」—— 两处标注各说一件事,都要留 */
  const verdictNoteRows = (r.inspect && r.inspect.note)
    ? [{ rk: 'i4', k: '判责说明(内部)', v: <span style={{ lineHeight: 1.75 }}>{r.inspect.note}
        <span className="lp-inner-flag">不对买家展示</span></span> }]
    : [];
  const inspectPhotos = (r.inspect && r.inspect.photos) ? r.inspect.photos : [];
  /* 退款六项【只在退款单已产生时】才组装 —— settled 为假就是一行都没有,而不是一排破折号。
     栅格按行铺,所以这里【交错】写:左栏落下三行金额(基准 → 扣减 → 最终,竖着能对账),
     右栏落下三行执行(单号 → 状态 → 到账,竖着能查进度)。左右各成一列,一行一对 */
  const refundRows = settled ? [
    { rk: 'm1', k: '退款基准', v: <span className="lp-num">{money(r.sym, rf.base)}</span> },
    { rk: 'r1', k: '退款单号', v: <span className="lp-code">{rf.refNo}</span> },
    /* 扣减为 0 时不加负号、不上红:那是「没扣」,不是一笔扣款 */
    { rk: 'm2', k: '退货扣减', v: Number(rf.fee) > 0
      ? <span className="lp-minus">- {money(r.sym, rf.fee)}</span>
      : <span className="lp-num">{money(r.sym, 0)}</span> },
    { rk: 'r2', k: '执行状态',
      v: <StatusTag variant={REFUND_STATUS[rf.status].variant}>{REFUND_STATUS[rf.status].label}</StatusTag> },
    { rk: 'm3', k: '最终退款金额', v: <span className="lp-amt">{money(r.sym, rf.amount)} {r.cur}</span> },
    { rk: 'r3', k: '到账时间', v: dash(rf.status === 'done' ? rf.at : '') },
  ] : [];
  const adjSection = <div style={{ marginBottom: 24 }}>
    <h4 className="lp-section">判责信息</h4>
    {neverJudged ? <div className="lp-nodata">暂无判责信息</div>
      : (!judged ? <div className="lp-nodata">尚未判责</div> : <>
        {(verdictRows.length > 0 || verdictNoteRows.length > 0) && <div className="lp-sub">
          {verdictRows.length > 0 && <DetailGrid rows={verdictRows} labelWidth={DETAIL_LABEL_W}
            cols={Math.min(verdictRows.length, 2)} flow="row" />}
          {verdictNoteRows.length > 0 && <DetailGrid rows={verdictNoteRows} labelWidth={DETAIL_LABEL_W} />}
        </div>}
        {inspectPhotos.length > 0 && <>
          <div className="lp-subtitle">判责取证照片({inspectPhotos.length} 张)</div>
          <div className="lp-thumb-grid">
            {inspectPhotos.map((x, xi) => <div className="lp-thumb-wrap" key={x.i}>
              <div className="lp-thumb" title="点击查看大图"
                onClick={() => setPv({ list: inspectPhotos, i: xi })}><PictureOutlined /></div>
              <div className="lp-thumb-cap">{x.name}<br />{x.by} · {x.at.slice(5)}</div></div>)}
          </div>
        </>}
        {denied
          ? <div className="lp-nodata">本单按「{OUTLETS.deny.label}」出口关闭,未产生退款单</div>
          : (settled && <>
            <div className="lp-sub"><DetailGrid rows={refundRows} cols={2} flow="row" labelWidth={DETAIL_LABEL_W} /></div>
            {retry && <Alert type="error" showIcon
              message={'退款执行失败:' + rf.failReason}
              description={'失败回传时间 ' + rf.failAt + '。本单仍为「' + st.label + '」,可直接重新发起。'} />}
          </>)}
      </>)}
  </div>;

  /* 买家时间线在页头右上角按钮 → TimelineModal;下方常驻的操作记录是内部全量,两者不合并。
     操作记录固定在详情页底部常驻区(skill 规则 A.8),标题由 OpLog 自己出 .lp-section */
  const logSection = <OpLog data={logs} types={['创建', '审核通过', '审核驳回', '重新提交', '回填运单', '状态推进',
    '判责并退款', '发起退款', '退款失败回传', '拒退关单', '关单']} />;

  return <Card style={CARD_STYLE}>
    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 16, marginBottom: 18 }}>
      <div>
        <Breadcrumb items={[{ title: <a onClick={() => go('as-list')}>售后工单</a> }, { title: '售后单详情' }]}
          style={{ marginBottom: 8 }} />
        <div style={{ fontSize: 20, fontWeight: 700 }}>
          <span className="lp-code">{r.id}</span>
          <span style={{ marginLeft: 10 }}><StatusTag variant={st.variant}>{st.label}</StatusTag></span>
          {rMark ? <span style={{ marginLeft: 4 }}><StatusTag variant="req">{rMark}</StatusTag></span> : null}
          {retry && <span style={{ marginLeft: 4 }}><StatusTag variant="req">退款失败待重试</StatusTag></span>}</div>
        <div style={{ color: '#6B7280', fontSize: 13, marginTop: 4 }}>
          {AS_TYPE[r.asType]} · {m.label} · 订单 {r.orderNo} · 申请于 {r.appliedAt}</div>
      </div>
      {/* 推进状态的动作【全部】收在这一排,模块正文里不再各放一份 */}
      <Space>
        {r.status === 'pending_audit' && <Button type="primary" icon={<AuditOutlined />} onClick={() => setAuditOpen(true)}>审核</Button>}
        {/* 运单登记发生在待寄回阶段;退货在途已寄出,本入口不再开放 */}
        {r.status === 'to_ship' && <Button type="primary" icon={<CarOutlined />} onClick={() => setShipOpen(true)}>回填运单</Button>}
        {/* 判责入口只此一个:没判过是「判责」,判过了是「修改判责结论与退款金额」,进的是同一个弹窗 */}
        {canAdjudicate && <Button type="primary" icon={<AuditOutlined />} onClick={() => setAdjOpen(true)}>
          {judged ? '修改判责结论与退款金额' : '判责'}</Button>}
        {retry && <Button type="primary" icon={<ReloadOutlined />} onClick={() => setRetryOpen(true)}>重新发起退款</Button>}
        {OPS_CLOSE_STATUS.indexOf(r.status) >= 0 && <Button danger icon={<CloseCircleOutlined />}
          onClick={() => setCloseOpen(true)}>关闭售后单</Button>}
        {/* 买家时间线 / 建单快照:都是「偶尔查一次」的核对信息,同一排、同一风格,收进弹窗不占正文版面 */}
        <Button icon={<ClockCircleOutlined />} onClick={() => setTlOpen(true)}>买家时间线</Button>
        <Button icon={<FileProtectOutlined />} onClick={() => setSnapOpen(true)}>建单快照</Button>
        <Button onClick={() => go('as-list')}>返回列表</Button>
      </Space>
    </div>
    {basicSection}
    {shipSection}
    {adjSection}
    {logSection}
    <AuditModal key={'da' + r.id} open={auditOpen} onClose={() => setAuditOpen(false)} record={r} />
    <ShipmentModal key={'ds' + r.id} open={shipOpen} onClose={() => setShipOpen(false)} record={r} />
    <AdjudicateModal key={'di' + r.id} open={adjOpen} onClose={() => setAdjOpen(false)} record={r} />
    <RetryRefundModal key={'dr' + r.id} open={retryOpen} onClose={() => setRetryOpen(false)} record={r} />
    <CloseOrderModal key={'dc' + r.id} open={closeOpen} onClose={() => setCloseOpen(false)} record={r} />
    <EvidenceModal key={'de' + r.id} open={evOpen} onClose={() => setEvOpen(false)} record={r} />
    <PhotoViewModal open={!!pv} onClose={() => setPv(null)}
      list={pv ? pv.list : []} index={pv ? pv.i : 0}
      onIndex={(n) => setPv({ list: pv.list, i: n })} />
    <SnapshotModal key={'dp' + r.id} open={snapOpen} onClose={() => setSnapOpen(false)} record={r} />
    <TimelineModal key={'dt' + r.id} open={tlOpen} onClose={() => setTlOpen(false)} record={r} />
  </Card>;
}

        <div style={{ width: 1, height: 20, background: '#E5E7EB', margin: '0 16px' }} />
        <span style={{ fontSize: 14, fontWeight: 500, color: '#6B7280' }}>售后管理后台</span>
        <span style={{ marginLeft: 'auto', color: '#9CA3AF', fontSize: 13 }}>{crumbMap[currentPage]}</span>
      </Layout.Header>
      <Layout>
        <Layout.Sider width={220} theme="light" style={SIDER_STYLE}>
          <Menu mode="inline" items={menuItems} selectedKeys={[activeKey]} defaultOpenKeys={['workbench', 'config']}
            style={{ borderInlineEnd: 'none' }} onClick={onMenu} /></Layout.Sider>
        <Layout.Content style={{ padding: 28, overflow: 'auto' }}>
          {currentPage === 'as-list' && <AfterSaleListPage go={go} />}
          {currentPage === 'as-detail' && <AfterSaleDetailPage go={go} record={record} />}
          {currentPage === 'policy-list' && <PolicyListPage go={go} />}
          {currentPage === 'policy-create' && <PolicyFormPage go={go} isEdit={false} record={null} />}
          {currentPage === 'policy-edit' && <PolicyFormPage go={go} isEdit={true} record={record} />}
          {currentPage === 'reason-list' && <ReasonListPage go={go} />}
          {currentPage === 'reason-create' && <ReasonFormPage go={go} isEdit={false} record={null} />}
          {currentPage === 'reason-edit' && <ReasonFormPage go={go} isEdit={true} record={record} />}
        </Layout.Content>
      </Layout>
    </Layout>
  </ConfigProvider>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
