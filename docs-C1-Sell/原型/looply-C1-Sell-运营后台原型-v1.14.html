function dropCategory(to){if(catQuery)return alert('Clear search before sorting.');if(dragIndex<0||dragIndex===to)return;let x=cats.splice(dragIndex,1)[0];cats.splice(to,0,x);x.u=now();dragIndex=-1;render();setTimeout(()=>alert('Category order saved'),0)}function dropBrand(to){if(brandQuery)return alert('Clear search before sorting.');if(dragBrand<0||dragBrand===to)return;let b=cats[detail].b.splice(dragBrand,1)[0];cats[detail].b.splice(to,0,b);b[2]=now();dragBrand=-1;render();setTimeout(()=>alert('Brand order saved'),0)}function brands(q){let c=cats[detail],r=c.b.filter(x=>x[0].toLowerCase().includes(q)).map(x=>{let i=c.b.indexOf(x);return [`<span class=drag draggable=true ondragstart="dragBrand=${i};event.dataTransfer.setData('text/plain',String(${i}))" ondragover="event.preventDefault()" ondrop="dropBrand(${i})">⠿</span>`,x[0],`<span class=switch-wrap><label class=switch><input type=checkbox ${x[1]==='Active'?'checked':''} onchange="cats[detail].b[${i}][1]=this.checked?'Active':'Inactive';cats[detail].b[${i}][2]=now();render()"><span class=slider></span></label><span class=switch-label>${x[1]=='Active'?'启用':'停用'}</span></span>`,x[2],`<button class=small onclick="openBrandEdit(${i})">编辑</button> <button class="small danger" onclick="deleteBrand(${i})">删除</button>`]});r=applyMode('brand',r);main.innerHTML=`<p><button class=small onclick="detail=-1;render()">← Categories</button></p><h1>${c.n} · Brands</h1><div class="notice"><b>Brands</b> · Total ${c.b.length} · Active ${c.b.filter(x=>x[1]==="Active").length} · Inactive ${c.b.filter(x=>x[1]==="Inactive").length}</div><div class=card><div class=toolbar><input id=q placeholder="Search brands" value="${brandQuery}" oninput="brandQuery=this.value" onkeydown="if(event.key==='Enter')render()"><button class=small onclick=render()>Search</button><button class=small onclick="openImport('brand')">Import</button><button class="small danger" onclick="bulkDelete('brand')">Delete selected</button><button class=primary onclick=op function configCountryBar(){let c=sellCountryByCode(currentConfigCountry);return `<div class=country-context><label>当前国家</label><select onchange="switchConfigCountry(this.value)">${configCountryOptions()}</select><span class="country-badge ${c&&c.active?'on':''}">${c&&c.active?'Sell 已开放':'Sell 未开放'}</span><span class=context-note>本页新增、编辑、排序和启停仅影响当前国家。</span></div>`}

function deleteCategory(index){let category=cats[index];if(!category)return;let brandCount=category.b.length;if(!confirm(`确认删除 Category「${category.n}」吗？删除后，其下 ${brandCount} 个 Brand 也会一并删除。`))return;cats.splice(index,1);render()}

function visibleZips(){let query=zipQuery.toLowerCase();return zips.filter(row=>row.join('').toLowerCase().includes(query))}

function openDeleteZips(){let selected=zips.filter(row=>selectedZipCodes.has(row[0]));if(!selected.length)return;let active=selected.filter(row=>row[3]==='Active').length,inactive=selected.length-active,isCA=currentConfigCountry==='CA',label=isCA?'postal codes':'ZIP codes';openD(`<h2>Delete ${label}</h2><div class=notice>即将删除 <b>${countryName(currentConfigCountry)}</b> 下选中的 <b>${selected.length}</b> 条${isCA?'邮编':' ZIP code'} 配置。</div><div class=field><label>Selected</label><div class=inline-status>${selected.length} total · ${active} Active · ${inactive} Inactive</div></div>${active?`<div class="inline-status error">其中 ${active} 条当前为 Active，删除后对应区域将不再支持上门服务。</div>`:''}<div class=drawer-actions><button class=small onclick="closeD()">Cancel</button><button class="primary danger" onclick="confirmDeleteZips()">Delete</button></div>`)}
function confirmDeleteZips(){let count=selectedZipCodes.size;zips.splice(0,zips.length,...zips.filter(row=>!selectedZipCodes.has(row[0])));selectedZipCodes.clear();closeD();render();alert(`${count} ${currentConfigCountry==='CA'?'postal codes':'ZIP codes'} deleted.`)}
function enhanceZipSelection(){let table=main.querySelector('table');if(!table)return;let rows=visibleZips(),selectedVisible=rows.filter(row=>selectedZipCodes.has(row[0])).length,headRow=table.querySelector('thead tr');let selectHead=document.createElement('th'),all=document.createElement('input');all.type='checkbox';all.checked=rows.length>0&&selectedVisible===rows.length;all.indeterminate=selectedVisible>0&&selectedVisible<rows.length;all.disabled=!rows.length;all.onchange=()=>toggleVisibleZips(all.checked);selectHead.appendChild(all);headRow.insertBefore(selectHead,headRow.firstChild);let operationHead=document.createElement('th');operationHead.textContent='Operation';headRow.appendChild(operationHead);table.querySelectorAll('tbody tr').forEach((tr,index)=>{if(index>=rows.length)return;let selectCell=document.createElement('td'),checkbox=document.createElement('input'),code=rows[index][0];checkbox.type='checkbox';checkbox.checked=selectedZipCodes.has(code);checkbox.onchange=()=>toggleZipSelection(code,checkbox.checked);selectCell.appendChild(checkbox);tr.insertBefore(selectCell,tr.firstChild);let statusCell=tr.children[4],editButton=statusCell.querySelector('button.small'),operationCell=document.createElement('td');if(editButton){editButton.classList.add('zip-edit-button');operationCell.appendChild(editButton)}tr.appendChild(operationCell)});let toolbar=main.querySelector('.toolbar'),searchInput=main.querySelector('input#q'),searchButton=[...toolbar.querySelectorAll('button')].find(button=>button.textContent.trim()==='Search'),deleteButton=[...toolbar.querySelectorAll('button')].find(button=>button.textContent.trim()==='Delete selected');if(deleteButton){deleteButton.textContent=selectedZipCodes.size?`Delete (${selectedZipCodes.size})`:'Delete';deleteButton.disabled=!selectedZipCodes.size;deleteButton.onclick=openDeleteZips}if(searchButton)searchButton.onclick=()=>{selectedZipCodes.clear();render()};if(searchInput)searchInput.onkeydown=event=>{if(event.key==='Enter'){selectedZipCodes.clear();render()}};let controls=[...toolbar.children],searchGroup=document.createElement('div'),actionGroup=document.createElement('div');searchGroup.className='zip-toolbar-search';actionGroup.className='zip-toolbar-actions';if(searchInput)searchGroup.appendChild(searchInput);if(searchButton)searchGroup.appendChild(searchButton);controls.filter(control=>control!==searchInput&&control!==searchButton).forEach(control=>actionGroup.appendChild(control));toolbar.append(searchGroup,actionGroup)}

<script>
// v1.14: align the multi-country demo with the reviewed incremental PRD.
document.title='Looply C1 Sell Operations v1.14';

// The current release only demonstrates US ZIP rules. Other countries may be
// added for advance configuration, but their address rules are defined later.
marketCountries=[{name:'United States',code:'US',enabled:true},{name:'Canada',code:'CA',enabled:false},{name:'France',code:'FR',enabled:false}];
sellCountries=[{name:'United States',code:'US',c2Enabled:true,active:true}];
delete countryStores.CA;
apps=apps.filter(a=>a.countryCode==='US');
zips=countryStores.US.zips;
cats=countryStores.US.cats;
currentConfigCountry='US';
appointmentCountry='ALL';

const openZipV114=openZip;
openZip=function(){
  if(currentConfigCountry!=='US'){
    openD(`<h2>Address rule pending</h2><div class=notice>This country can be prepared in advance, but its service-area fields and validation rules are not defined in the current release.</div><div class=drawer-actions><button class=primary onclick=closeD()>Close</button></div>`);
    return;
  }
  openZipV114();
};

const lookupZipV114=lookupZip;
lookupZip=function(){
  if(currentConfigCountry!=='US')return;
  lookupZipV114();
};

function switchConfigCountryV114(code){
  if(drawer&&!drawer.hidden&&!confirm('Switching countries will discard unsaved changes. Continue?'))return render();
  if(!countryStores[code])countryStores[code]={zips:[],cats:[]};
  currentConfigCountry=code;
  zips=countryStores[code].zips;
  cats=countryStores[code].cats;
  zipQuery='';catQuery='';brandQuery='';
  selectedZipCodes.clear();
  selectedBrandIndexes.clear();
  detail=-1;expandedApp=-1;
  closeD();render();
}
switchConfigCountry=switchConfigCountryV114;

const toggleZipSelectionV114=toggleZipSelection;
toggleZipSelection=function(code,checked){
  if(checked&&selectedZipCodes.size>=500&&!selectedZipCodes.has(code)){
    alert('You can delete up to 500 ZIP codes at a time.');render();return;
  }
  toggleZipSelectionV114(code,checked);
};
toggleVisibleZips=function(checked){
  let rows=visibleZips();
  if(checked&&rows.length>500){alert('You can select up to 500 ZIP codes at a time.');return;}
  rows.forEach(row=>checked?selectedZipCodes.add(row[0]):selectedZipCodes.delete(row[0]));render();
};
openDeleteZips=function(){
  let selected=zips.filter(row=>selectedZipCodes.has(row[0]));
  if(!selected.length)return;
  if(selected.length>500){alert('You can delete up to 500 ZIP codes at a time.');return;}
  let active=selected.filter(row=>row[3]==='Active').length,inactive=selected.length-active;
  openD(`<h2>Delete ZIP codes</h2><div class=notice>Target country: <b>${countryName(currentConfigCountry)}</b><br>Selected records: <b>${selected.length}</b> (maximum 500)</div><div class=field><label>Selected</label><div class=inline-status>${selected.length} total · ${active} Active · ${inactive} Inactive</div></div>${active?`<div class="inline-status error">${active} Active ZIP codes will stop supporting In-Home Service.</div>`:''}<div class=drawer-actions><button class=small onclick=closeD()>Cancel</button><button class="primary danger" onclick=confirmDeleteZips()>Delete</button></div>`);
};
confirmDeleteZips=function(){
  let targetCountry=currentConfigCountry,count=selectedZipCodes.size;
  countryStores[targetCountry].zips.splice(0,countryStores[targetCountry].zips.length,...countryStores[targetCountry].zips.filter(row=>!selectedZipCodes.has(row[0])));
  selectedZipCodes.clear();closeD();render();alert(`${count} ZIP codes deleted from ${countryName(targetCountry)}.`);
};

let selectedBrandIndexes=new Set(),selectedBrandContext='';
function toggleBrandSelection(index,checked){checked?selectedBrandIndexes.add(index):selectedBrandIndexes.delete(index);render()}
function enhanceBrandSelectionV114(){
  if(page!=='cat'||detail<0)return;
  let context=`${currentConfigCountry}:${detail}:${brandQuery}`;
  if(context!==selectedBrandContext){selectedBrandIndexes.clear();selectedBrandContext=context}
  let table=main.querySelector('table'),toolbar=main.querySelector('.toolbar');if(!table||!toolbar)return;
  let head=table.querySelector('thead tr'),th=document.createElement('th');th.textContent='Select';head.insertBefore(th,head.firstChild);
  let visibleBrands=cats[detail].b.filter(x=>x[0].toLowerCase().includes(brandQuery.toLowerCase()));
  table.querySelectorAll('tbody tr').forEach((tr,index)=>{if(index>=visibleBrands.length)return;let originalIndex=cats[detail].b.indexOf(visibleBrands[index]),td=document.createElement('td'),cb=document.createElement('input');cb.type='checkbox';cb.checked=selectedBrandIndexes.has(originalIndex);cb.onchange=()=>toggleBrandSelection(originalIndex,cb.checked);td.appendChild(cb);tr.insertBefore(td,tr.firstChild)});
  let button=[...toolbar.querySelectorAll('button')].find(b=>b.textContent.trim()==='Delete selected');
  if(button){button.textContent=selectedBrandIndexes.size?`Delete (${selectedBrandIndexes.size})`:'Delete';button.disabled=!selectedBrandIndexes.size;button.onclick=openDeleteBrandsV114}
}
function openDeleteBrandsV114(){
  let count=selectedBrandIndexes.size;if(!count)return;
  let targetCountry=currentConfigCountry,targetCategory=detail;
  openD(`<h2>Delete selected brands</h2><div class=notice>Target: <b>${countryName(targetCountry)} · ${cats[targetCategory].n}</b><br>Selected records: <b>${count}</b></div><div class=field><label>Type <b>DELETE</b> to confirm</label><input id=deleteConfirm placeholder=DELETE></div><button class="primary danger" onclick="confirmDeleteBrandsV114('${targetCountry}',${targetCategory})">Confirm delete</button>`);
}
function confirmDeleteBrandsV114(targetCountry,targetCategory){
  if(byId('deleteConfirm').value!=='DELETE'){alert('Type DELETE to confirm.');return}
  let indexes=[...selectedBrandIndexes],count=indexes.length;
  countryStores[targetCountry].cats[targetCategory].b=countryStores[targetCountry].cats[targetCategory].b.filter((_,i)=>!selectedBrandIndexes.has(i));
  if(currentConfigCountry===targetCountry)cats=countryStores[targetCountry].cats;
  selectedBrandIndexes.clear();closeD();render();alert(`${count} brands deleted from ${countryName(targetCountry)}.`);
}

downloadApps=function(){
  let rows=filteredApps();if(!rows.length)return;
  let csv=['Request ID,Country,Submitted at,First name,Last name,Email,Phone,Contact authorization,Contact authorization accepted at,Selling method,Categories,Brands,Total pieces,Additional notes,Step 3 ZIP,In-Home coverage,Street address,Apartment,City,State,ZIP,Looply address,Preferred date,Referral code,Seller Agreement acceptance,Seller Agreement version,Seller Agreement accepted at,Confirmation email status,Last attempted at,Failure reason,Internal note,Internal note created at,Internal note updated at,Internal note operator'];
  rows.forEach(x=>csv.push([x.id,countryName(x.countryCode),x.submitted,x.name.split(' ')[0],x.name.split(' ').slice(1).join(' '),x.email,x.phone,'Accepted',x.submitted,x.method,x.cat,x.brand,x.pieces,x.notes||'',x.stepZip,x.coverage,x.method==='Visit Looply'?'':x.street,x.method==='Visit Looply'?'':x.apartment,x.method==='Visit Looply'?'':x.city,x.state,x.zip,x.method==='Visit Looply'?'6300 Wilshire Blvd, Los Angeles, CA 90048':'',x.date,x.ref,x.agreementResult,x.agreementVersion,x.agreementAt,x.mail,x.mailAttempt,x.mail==='Failed'?x.mailError:'',x.internal,x.noteCreated,x.noteUpdated,x.noteOperator].map(v=>'"'+String(v||'').replaceAll('"','""')+'"').join(',')));
  let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv.join('\n')],{type:'text/csv;charset=utf-8'}));a.download='appointments.csv';a.click();
};

const openImportV114=openImport;
openImport=function(kind){
  let targetCountry=currentConfigCountry;
  if(kind==='zip'&&targetCountry!=='US'){
    openD(`<h2>Address rule pending</h2><div class=notice>This country can be prepared in advance, but its service-area template and validation rules are not defined in the current release.</div><div class=drawer-actions><button class=primary onclick=closeD()>Close</button></div>`);
    return;
  }
  openImportV114(kind);
  let notice=db.querySelector('.notice');if(notice)notice.innerHTML=`Target country: <b>${countryName(targetCountry)}</b><br><a href="#" onclick="alert('Template downloaded for ${countryName(targetCountry)}.');return false">Download current-country template</a> · UTF-8 CSV · maximum 5,000 rows / 10 MB.`;
};

function viewCountryConfigV114(code){
  if(!countryStores[code])countryStores[code]={zips:[],cats:[]};
  currentConfigCountry=code;zips=countryStores[code].zips;cats=countryStores[code].cats;
  zipQuery='';catQuery='';brandQuery='';selectedZipCodes.clear();selectedBrandIndexes.clear();
  page='zip';detail=-1;render();
}
function enhanceServiceActionsV114(){
  if(page!=='service')return;
  main.querySelectorAll('tbody tr').forEach((tr,index)=>{
    let country=sellCountries[index],cell=tr.lastElementChild;if(!country||!cell)return;
    let button=document.createElement('button');button.className='small';button.textContent='查看配置';button.style.marginLeft='8px';button.onclick=()=>viewCountryConfigV114(country.code);cell.appendChild(button);
  });
}

const renderV114Base=render;
render=function(){renderV114Base();enhanceBrandSelectionV114();enhanceServiceActionsV114()};
render();
</script></body></html>
