<title>Looply 库存管理后台原型 v7（antd）</title>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/dayjs@1.11.21/dayjs.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/antd@6.4.3/dist/antd.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/@ant-design/icons@6.2.1/dist/index.umd.min.js"></script>

<style>
html,body,#root{height:100%;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F9FAFB;color:#1F2937}
#root::before{content:'正在加载 antd 原型……';position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#9CA3AF;font-size:14px}
#root:not(:empty)::before{display:none}

/* KPI 卡片 */
.lp-kpi{background:linear-gradient(180deg,#FEFCFF 0%,#F3EEFF 100%);border:1px solid #DDD6FE;border-radius:14px;padding:14px 16px}
.lp-kpi .num{font-size:24px;font-weight:700;color:#7C3AED;line-height:1;margin-bottom:6px;font-variant-numeric:tabular-nums}
.lp-kpi .label{font-size:12px;color:#6B7280}

/* 紧凑分页器 */
.lp-pagination{display:flex;align-items:center;justify-content:center;gap:24px;padding:12px 16px;font-size:13px;color:#6B7280}
.lp-pagination .divider{width:1px;height:20px;background:#E5E7EB}

/* 字段提示:虚线下划线 */
.lp-tip-trigger{cursor:help;border-bottom:1px dashed #9CA3AF;padding-bottom:1px}

/* 行内编辑 */
.lp-editable{cursor:pointer;padding:2px 6px;border-radius:6px;border:1px solid transparent;transition:all .15s;display:inline-block;min-width:40px;text-align:center}
.lp-editable:hover{border-color:#DDD6FE;background:#FAF5FF;color:#7C3AED}
.lp-edit-just-saved{color:#16A34A!important;transition:color 1s}

/* 区块小节标题 */
.lp-section{font-size:15px;font-weight:600;color:#1F2937;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid #E5E7EB}

/* 空态 */
.lp-empty{display:flex;flex-direction:column;align-items:center;padding:60px 20px;text-align:center}
.lp-empty .icon{font-size:48px;margin-bottom:16px;color:#9CA3AF}
.lp-empty .icon.err{color:#DC2626}
.lp-empty .title{font-size:16px;font-weight:600;color:#1F2937;margin-bottom:8px}
.lp-empty .desc{font-size:13px;color:#6B7280;margin-bottom:24px;max-width:360px}

/* 涨跌色 */
.rate-up{color:#16A34A;font-weight:600;font-variant-numeric:tabular-nums}
.rate-down{color:#DC2626;font-weight:600;font-variant-numeric:tabular-nums}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

/* ============ 业务组件 ============ */
const TAG_COLORS = {
  on: {bg:'#F0FDF4',color:'#16A34A'}, sale: {bg:'#EFF6FF',color:'#2563EB'},
  pending: {bg:'#FFFBEB',color:'#D97706'}, off: {bg:'#F3F4F6',color:'#6B7280'},
  req: {bg:'#FEF2F2',color:'#DC2626'}, warn: {bg:'#FFF1F2',color:'#E11D48'},
};
function StatusTag({ variant, children }) {
  const c = TAG_COLORS[variant] || TAG_COLORS.off;
  return (
    <Tag bordered={false} style={{ background:c.bg, color:c.color, borderRadius:999,
      padding:'2px 8px', fontSize:12, lineHeight:'18px', marginInlineEnd:0 }}>{children}</Tag>
  );
}
function TipText({ label, tip }) {
  return (
    <Tooltip title={<div style={{ whiteSpace:'pre-line', lineHeight:1.6 }}>{tip}</div>} color="#fff"
      styles={{ body: { color:'#374151', fontSize:12, padding:'10px 14px' } }}>
      <span className="lp-tip-trigger">{label}</span>
    </Tooltip>
  );
}
function Kpi({ num, label }) {
  return <div className="lp-kpi"><div className="num">{num}</div><div className="label">{label}</div></div>;
}
function CompactPagination({ total, current=1, pageSize=20 }) {
  const tp = Math.ceil(total / pageSize) || 1;
  const pages = useMemo(() => {
    const out = [{ k:'prev', label:'<', disabled:current===1, arrow:true }];
    if (tp <= 6) for (let i=1;i<=tp;i++) out.push({ k:i, label:i });
    else { out.push({k:1,label:1}); out.push({k:2,label:2}); out.push({k:3,label:3}); out.push({k:'gap',label:'…',disabled:true}); out.push({k:tp,label:tp}); }
    out.push({ k:'next', label:'>', disabled:current===tp, arrow:true });
    return out;
  }, [current, tp]);
  return (
    <div className="lp-pagination">
      <span>共 {total.toLocaleString()} 条,每页{' '}
        <Select size="small" value={pageSize} style={{ width:72, marginInline:4 }}
          options={[{value:20,label:20},{value:50,label:50},{value:100,label:100}]} />{' '}条</span>
      <div className="divider" />
      <Space size={2}>
        {pages.map(p => (
          <span key={p.k} style={{ minWidth:32, height:32, display:'inline-flex', alignItems:'center', justifyContent:'center',
            borderRadius:8, fontSize:13, cursor:p.disabled?'default':'pointer',
            background:p.k===current?'#7C3AED':(p.arrow?'#fff':'transparent'),
            color:p.k===current?'#fff':'#374151', border:p.arrow?'1px solid #E5E7EB':'none',
            fontWeight:p.k===current?600:400, opacity:p.disabled?0.35:1 }}>{p.label}</span>
        ))}
      </Space>
      <div className="divider" />
      <span>第 {current}/{tp} 页</span>
    </div>
  );
}
function EmptyZero({ entity, cta, onCta }) {
  return <div className="lp-empty"><InboxOutlined className="icon" />
    <div className="title">暂无{entity}</div>
    <div className="desc">点击下方按钮创建第一条{entity}</div>
    {cta && <Button type="primary" onClick={onCta}>{cta}</Button>}</div>;
}
function EmptyNoMatch({ onClear }) {
  return <div className="lp-empty"><SearchOutlined className="icon" />
    <div className="title">未找到匹配结果</div>
    <div className="desc">请尝试调整搜索关键词或筛选条件</div>
    <Button onClick={onClear}>清除筛选条件</Button></div>;
}
function EmptyError({ onRetry }) {
  return <div className="lp-empty"><ExclamationCircleOutlined className="icon err" />
    <div className="title">加载失败</div>
    <div className="desc">网络异常,请检查网络连接后重试</div>
    <Button type="primary" onClick={onRetry}>重试</Button></div>;
}
function EmptyStateSwitcher({ mode, setMode }) {
  return (
    <div style={{ marginTop:12, display:'flex', gap:8, justifyContent:'center' }}>
      {[['data','正常数据'],['zero','零数据态'],['no-match','无匹配态'],['error','异常态']].map(([k,label]) =>
        <Button key={k} type={mode===k?'primary':'default'} onClick={() => setMode(k)}>{label}</Button>)}
    </div>
  );
}
function EditableNumber({ value, onChange, width = 90 }) {
  const [editing, setEditing] = useState(false);
  const [val, setVal] = useState(value);
  const [justSaved, setJustSaved] = useState(false);
  const wrap = { display:'inline-block', width, textAlign:'center' };
  if (editing) {
    return (
      <span style={wrap}>
        <antd.InputNumber autoFocus size="small" value={val} min={0} style={{ width:'100%' }}
          onChange={(v) => setVal(v)}
          onBlur={() => { setEditing(false); onChange && onChange(val); setJustSaved(true); setTimeout(() => setJustSaved(false), 1000); }}
          onPressEnter={(e) => e.target.blur()} />
      </span>
    );
  }
  return (
    <span style={wrap}>
      <span className={'lp-editable' + (justSaved ? ' lp-edit-just-saved' : '')}
        onClick={() => setEditing(true)}>{(val ?? 0).toLocaleString()}</span>
    </span>
  );
}

  event: '入库：商品入库，实物数量增加\n出库：订单发货，实物数量减少\n预占：买家下单冻结库存，可售减少\n释放：订单取消/超时，预占库存恢复可售\n调整：盘点差异/损坏报废，人工修正数量\n锁定：人工锁定库存，不参与可售计算\n解锁：解除锁定，恢复可售状态',
  qty: '实物库存的增减数量\n正数(+)：库存增加（入库/释放/解锁）\n负数(-)：库存减少（出库/预占/锁定/调整减少）',
  before: `变动发生前的库存状态\n"-" 表示新建库存（首次入库）`,
  after: '变动完成后的库存状态\n在库 / 已损 等',
  doc: `触发本次变动的业务单据\nORD- 开头为销售订单（出库/预占）\n"-" 表示无关联单据`,
};

/* ============ 库存总览 ============ */
const OVERVIEW_ROWS = [
  { id:'PRD-10234', name:'iPhone 14 Pro 128GB 深紫色', onhand:1, reserved:0, locked:0, inAt:'2026-04-15', lastAt:'2026-04-15' },
  { id:'PRD-20056', name:'Apple 20W USB-C 充电器', onhand:350, reserved:20, locked:5, inAt:'2026-03-20', lastAt:'2026-04-28' },
  { id:'PRD-20078', name:'AirPods Pro 2nd Gen', onhand:1, reserved:0, locked:0, inAt:'2026-04-10', lastAt:'2026-04-10' },
  { id:'PRD-10301', name:'Samsung Galaxy S24 Ultra', onhand:1, reserved:0, locked:0, inAt:'2026-04-05', lastAt:'2026-04-05' },
  { id:'PRD-20089', name:'Anker 65W GaN 充电器', onhand:520, reserved:30, locked:10, inAt:'2026-03-15', lastAt:'2026-04-27' },
  { id:'PRD-10412', name:'MacBook Air M2 256GB', onhand:1, reserved:1, locked:0, inAt:'2026-04-20', lastAt:'2026-04-20' },
  { id:'PRD-20102', name:'USB-C to Lightning 线缆 1m', onhand:1200, reserved:60, locked:40, inAt:'2026-02-28', lastAt:'2026-04-26' },
];

function OverviewPage({ onBatchImport, onViewLedger }) {
  const [mode, setMode] = useState('data');
  const [rows, setRows] = useState(OVERVIEW_ROWS);

  const setField = (id, field, v) =>
    setRows(rs => rs.map(r => r.id === id ? { ...r, [field]: (v ?? 0) } : r));

  const columns = [
    { title:'商品ID', dataIndex:'id', width:110, render:v => <span style={{ fontFamily:'Menlo,monospace', fontSize:12 }}>{v}</span> },
    { title:'商品名称', dataIndex:'name', width:240 },
    { title:<TipText label="可售库存" tip={TIP.sellable} />, key:'sellable', width:110, align:'right',
      render:(_, r) => Math.max(0, r.onhand - r.reserved - r.locked).toLocaleString() },
    { title:<TipText label="在库" tip={TIP.onhand} />, dataIndex:'onhand', width:110, align:'center',
      render:(v, r) => <EditableNumber value={v} onChange={nv => setField(r.id, 'onhand', nv)} /> },
    { title:<TipText label="预占" tip={TIP.reserved} />, dataIndex:'reserved', width:90, align:'right',
      render:v => v.toLocaleString() },
    { title:<TipText label="锁定" tip={TIP.locked} />, dataIndex:'locked', width:100, align:'center',
      render:(v, r) => <EditableNumber value={v} onChange={nv => setField(r.id, 'locked', nv)} /> },
    { title:'入库时间', dataIndex:'inAt', width:120 },
    { title:'最近变动时间', dataIndex:'lastAt', width:130 },
    { title:'操作', key:'op', width:150, fixed:'right',
      render:(_, r) => <Button size="small" onClick={() => onViewLedger(r.id)}>查看库存流水</Button> },
  ];

  return (
    <Card style={CARD_STYLE}>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:16, marginBottom:18 }}>
        <div>
          <div style={{ fontSize:20, fontWeight:700, marginBottom:6 }}>库存总览</div>
          <div style={{ color:'#6B7280', fontSize:13 }}>管理所有库存主体，直接在行内修改库存数量</div>
        </div>
        <Button type="primary" icon={<ImportOutlined />} onClick={onBatchImport}>批量导入</Button>
      </div>

      <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:12, marginBottom:18 }}>
        <Kpi num="892" label="商品总库存" />
        <Kpi num="156" label="预占中" />
        <Kpi num="55" label="锁定中" />
      </div>

      <Space size={12} wrap style={{ marginBottom:16 }}>
        <Input placeholder="搜索商品名称/商品ID" prefix={<SearchOutlined style={{ color:'#9CA3AF' }} />} allowClear style={{ width:220 }} />
        <Button type="primary" icon={<SearchOutlined />}>查询</Button>
        <Button icon={<ReloadOutlined />}>重置</Button>
      </Space>

      {mode === 'data' && (
        <>
          <Table rowKey="id" columns={columns} dataSource={rows} pagination={false}
            styles={TABLE_STYLES} scroll={{ x: 'max-content' }} />
          <CompactPagination total={1286} pageSize={20} />
        </>
      )}
      {mode === 'zero' && <EmptyZero entity="库存" />}
      {mode === 'no-match' && <EmptyNoMatch onClear={() => setMode('data')} />}
      {mode === 'error' && <EmptyError onRetry={() => setMode('data')} />}
      <EmptyStateSwitcher mode={mode} setMode={setMode} />
    </Card>
  );
}

/* ============ 库存流水 ============ */
const EVENT_VARIANT = { 入库:'on', 释放:'on', 解锁:'on', 出库:'req', 预占:'req', 锁定:'req', 调整:'sale' };
const LEDGER_ROWS = [
  { id:'LDG-8642', pid:'PRD-20056', name:'Apple 20W USB-C 充电器', event:'入库', delta:200, before:'—', after:'在库', doc:'—', by:'李四', at:'2026-04-28 14:20' },
  { id:'LDG-8641', pid:'PRD-10234', name:'iPhone 14 Pro 128GB 深紫色', event:'预占', delta:-1, before:'在库', after:'预占', doc:'ORD-5525', by:'系统', at:'2026-04-28 10:15' },
  { id:'LDG-8640', pid:'PRD-20089', name:'Anker 65W GaN 充电器', event:'调整', delta:-3, before:'在库', after:'在库', doc:'—', by:'张三', at:'2026-04-27 16:00' },
  { id:'LDG-8639', pid:'PRD-20056', name:'Apple 20W USB-C 充电器', event:'出库', delta:-50, before:'预占', after:'已出库', doc:'ORD-4421', by:'系统', at:'2026-04-27 09:30' },
  { id:'LDG-8638', pid:'PRD-20102', name:'USB-C to Lightning 线缆 1m', event:'入库', delta:500, before:'—', after:'在库', doc:'—', by:'李四', at:'2026-04-26 11:00' },
  { id:'LDG-8637', pid:'PRD-20056', name:'Apple 20W USB-C 充电器', event:'锁定', delta:-5, before:'在库', after:'锁定', doc:'—', by:'张三', at:'2026-04-25 15:30' },
  { id:'LDG-8636', pid:'PRD-20089', name:'Anker 65W GaN 充电器', event:'解锁', delta:3, before:'锁定', after:'在库', doc:'—', by:'张三', at:'2026-04-25 10:00' },
  { id:'LDG-8635', pid:'PRD-20089', name:'Anker 65W GaN 充电器', event:'预占', delta:-10, before:'在库', after:'预占', doc:'ORD-5520', by:'系统', at:'2026-04-24 14:20' },
  { id:'LDG-8634', pid:'PRD-10234', name:'iPhone 14 Pro 128GB 深紫色', event:'释放', delta:1, before:'预占', after:'在库', doc:'ORD-5525', by:'系统', at:'2026-04-24 09:00' },
  { id:'LDG-8633', pid:'PRD-20102', name:'USB-C to Lightning 线缆 1m', event:'调整', delta:-8, before:'在库', after:'在库', doc:'—', by:'张三', at:'2026-04-23 16:30' },
];

function LedgerPage({ initialSearch }) {
  const [mode, setMode] = useState('data');
  const [q, setQ] = useState(initialSearch || '');

  const filtered = useMemo(() => {
    const kw = (q || '').trim().toLowerCase();
    if (!kw) return LEDGER_ROWS;
    return LEDGER_ROWS.filter(r =>
      r.pid.toLowerCase().includes(kw) || r.name.toLowerCase().includes(kw) || r.doc.toLowerCase().includes(kw));
  }, [q]);

  const columns = [
    { title:'流水ID', dataIndex:'id', width:110, render:v => <span style={{ fontFamily:'Menlo,monospace', fontSize:12 }}>{v}</span> },
    { title:'商品ID', dataIndex:'pid', width:110, render:v => <span style={{ fontFamily:'Menlo,monospace', fontSize:12 }}>{v}</span> },
    { title:'商品名称', dataIndex:'name', width:200 },
    { title:<TipText label="事件类型" tip={TIP.event} />, dataIndex:'event', width:100,
      render:v => <StatusTag variant={EVENT_VARIANT[v]}>{v}</StatusTag> },
    { title:<TipText label="数量变化" tip={TIP.qty} />, dataIndex:'delta', width:110, align:'right',
      render:v => <span className={v >= 0 ? 'rate-up' : 'rate-down'}>{v >= 0 ? '+' : ''}{v}</span> },
    { title:<TipText label="变动前状态" tip={TIP.before} />, dataIndex:'before', width:110 },
    { title:<TipText label="变动后状态" tip={TIP.after} />, dataIndex:'after', width:110 },
    { title:<TipText label="关联单据" tip={TIP.doc} />, dataIndex:'doc', width:120,
      render:v => v === '—' ? '—' : <span style={{ fontFamily:'Menlo,monospace', fontSize:12 }}>{v}</span> },
    { title:'操作人', dataIndex:'by', width:90 },
    { title:'操作时间', dataIndex:'at', width:150 },
  ];

  return (
    <Card style={CARD_STYLE}>
      <div style={{ marginBottom:18 }}>
        <div style={{ fontSize:20, fontWeight:700, marginBottom:6 }}>库存流水</div>
        <div style={{ color:'#6B7280', fontSize:13 }}>记录所有实物库存的数量变动流水，支持追溯和对账</div>
      </div>

      <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:12, marginBottom:18 }}>
        <Kpi num="8,642" label="流水总数" />
        <Kpi num="2,130" label="入库记录" />
        <Kpi num="1,856" label="出库记录" />
        <Kpi num="4,656" label="其他变动" />
      </div>

      <Space size={12} wrap style={{ marginBottom:16 }}>
        <Input placeholder="搜索商品ID/商品名称/关联单号" prefix={<SearchOutlined style={{ color:'#9CA3AF' }} />}
          allowClear value={q} onChange={e => setQ(e.target.value)} style={{ width:240 }} />
        <Select defaultValue="" style={{ width:140 }} options={[
          { value:'', label:'全部事件类型' }, { value:'入库', label:'入库' }, { value:'出库', label:'出库' },
          { value:'调整', label:'调整' }, { value:'预占', label:'预占' }, { value:'释放', label:'释放' },
          { value:'锁定', label:'锁定' }, { value:'解锁', label:'解锁' } ]} />
        <Select defaultValue="" style={{ width:150 }} options={[
          { value:'', label:'全部操作人类型' }, { value:'op', label:'运营人员' }, { value:'sys', label:'系统自动' } ]} />
        <DatePicker.RangePicker placeholder={['开始日期','结束日期']} />
        <Button type="primary" icon={<SearchOutlined />}>查询</Button>
        <Button icon={<ReloadOutlined />} onClick={() => setQ('')}>重置</Button>
      </Space>

      {mode === 'data' && (filtered.length > 0 ? (
        <>
          <Table rowKey="id" columns={columns} dataSource={filtered} pagination={false}
            styles={TABLE_STYLES} scroll={{ x: 'max-content' }} />
          <CompactPagination total={q ? filtered.length : 8642} pageSize={20} />
        </>
      ) : <EmptyNoMatch onClear={() => setQ('')} />)}
      {mode === 'zero' && <EmptyZero entity="流水记录" />}
      {mode === 'no-match' && <EmptyNoMatch onClear={() => setMode('data')} />}
      {mode === 'error' && <EmptyError onRetry={() => setMode('data')} />}
      <EmptyStateSwitcher mode={mode} setMode={setMode} />
    </Card>
  );
}

/* ============ 批量导入弹窗 ============ */
const IMPORT_PREVIEW = [
  { row:1, name:'iPhone 15 Pro 256GB', qty:1, ok:true },
  { row:2, name:'AirPods Max', qty:1, ok:true },
  { row:3, name:'USB-C 数据线 2m', qty:500, ok:true },
  { row:4, name:'（商品不存在）', qty:10, ok:false, msg:'失败：商品ID无效' },
];

function BatchImportModal({ open, onClose }) {
  const cols = [
    { title:'行号', dataIndex:'row', width:70 },
    { title:'商品名称', dataIndex:'name' },
    { title:'数量', dataIndex:'qty', width:90, align:'right' },
    { title:'校验结果', dataIndex:'ok', width:160,
      render:(ok, r) => ok ? <StatusTag variant="on">通过</StatusTag> : <StatusTag variant="req">{r.msg}</StatusTag> },
  ];
  return (
    <Modal title="批量导入" open={open} onCancel={onClose} closable={false} maskClosable={false}
      centered={true} width={620}
      footer={[
        <Button key="c" onClick={onClose}>取消</Button>,
        <Button key="s" type="primary" onClick={onClose}>确认导入（3 条）</Button>,
      ]}>
      <Alert type="info" showIcon={false} style={{ marginBottom:18 }}
        message={<div style={{ fontWeight:600 }}>操作步骤</div>}
        description={<div style={{ fontSize:12, lineHeight:1.8 }}>
          1. 下载导入模板，按格式填写商品入库信息<br />
          2. 上传填写好的文件（支持 .xlsx / .csv）<br />
          3. 系统校验数据，预览导入结果后确认执行
        </div>} />

      <div style={{ marginBottom:20 }}>
        <h4 className="lp-section">第 1 步:下载模板</h4>
        <Button icon={<DownloadOutlined />}>下载入库模板（.xlsx）</Button>
      </div>

      <div style={{ marginBottom:20 }}>
        <h4 className="lp-section">第 2 步:上传文件</h4>
        <Upload.Dragger name="file" multiple={false} accept=".xlsx,.csv" beforeUpload={() => false}>
          <p className="ant-upload-drag-icon"><InboxOutlined style={{ color:'#7C3AED' }} /></p>
          <p className="ant-upload-text">点击或拖拽文件到此处上传</p>
          <p className="ant-upload-hint">支持 .xlsx / .csv，单次最多 500 条</p>
        </Upload.Dragger>
      </div>

      <div>
        <h4 className="lp-section">第 3 步:导入预览</h4>
        <Table rowKey="row" size="small" columns={cols} dataSource={IMPORT_PREVIEW} pagination={false}
          styles={TABLE_STYLES}
          summary={() => (
            <Table.Summary fixed>
              <Table.Summary.Row>
                <Table.Summary.Cell index={0} colSpan={4}>
                  共 4 条，<span style={{ color:'#16A34A', fontWeight:600 }}>3 条通过</span>，
                  <span style={{ color:'#DC2626', fontWeight:600 }}>1 条失败</span>（失败项将跳过）
                </Table.Summary.Cell>
              </Table.Summary.Row>
            </Table.Summary>
          )} />
      </div>
    </Modal>
  );
}

/* ============ App ============ */
const MENU_ITEMS = [
  { key:'inventory', icon:<ShopOutlined />, label:'库存管理', children:[
    { key:'inventory-overview', icon:<AppstoreOutlined />, label:'库存总览' },
    { key:'inventory-ledger', icon:<FileTextOutlined />, label:'库存流水' },
  ]},
];
const PAGE_LABEL = { 'inventory-overview':'库存总览', 'inventory-ledger':'库存流水' };

function App() {
  const [currentPage, setCurrentPage] = useState('inventory-overview');
  const [ledgerSearch, setLedgerSearch] = useState('');
  const [batchOpen, setBatchOpen] = useState(false);

  const go = (key) => { setLedgerSearch(''); setCurrentPage(key); };
  const viewLedger = (pid) => { setLedgerSearch(pid); setCurrentPage('inventory-ledger'); };

  return (
    <ConfigProvider theme={looplyTheme}>
      <Layout style={{ height:'100vh' }}>
        <Layout.Header style={{ borderBottom:'1px solid #E5E7EB', display:'flex', alignItems:'center' }}>
          <img src={LOGO_SRC} alt="Looply" style={{ height:32, display:'block' }} />
          <div style={{ width:1, height:20, background:'#E5E7EB', margin:'0 16px' }} />
          <span style={{ fontSize:14, fontWeight:500, color:'#6B7280' }}>库存管理系统</span>
          <span style={{ marginLeft:'auto', color:'#9CA3AF', fontSize:13 }}>{PAGE_LABEL[currentPage]}</span>
        </Layout.Header>
        <Layout>
          <Layout.Sider width={220} theme="light" style={SIDER_STYLE}>
            <Menu mode="inline" items={MENU_ITEMS} selectedKeys={[currentPage]}
              defaultOpenKeys={['inventory']} style={{ borderInlineEnd:'none' }}
              onClick={({ key }) => go(key)} />
          </Layout.Sider>
          <Layout.Content style={{ padding:28, overflow:'auto' }}>
            {currentPage === 'inventory-overview' &&
              <OverviewPage onBatchImport={() => setBatchOpen(true)} onViewLedger={viewLedger} />}
            {currentPage === 'inventory-ledger' &&
              <LedgerPage initialSearch={ledgerSearch} />}
          </Layout.Content>
        </Layout>
      </Layout>
      <BatchImportModal open={batchOpen} onClose={() => setBatchOpen(false)} />
    </ConfigProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
