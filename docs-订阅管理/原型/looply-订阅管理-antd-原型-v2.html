<title>Looply 订阅管理后台</title>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/dayjs@1.11.21/dayjs.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/antd@6.4.3/dist/antd.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/@ant-design/icons@6.2.1/dist/index.umd.min.js"></script>

<style>
html,body,#root{height:100%;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F9FAFB;color:#1F2937}
#root::before{content:'正在加载 antd 原型……';position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#9CA3AF;font-size:14px}
#root:not(:empty)::before{display:none}
.lp-kpi{background:linear-gradient(180deg,#FEFCFF 0%,#F3EEFF 100%);border:1px solid #DDD6FE;border-radius:14px;padding:14px 16px}
.lp-kpi .num{font-size:24px;font-weight:700;color:#7C3AED;line-height:1;margin-bottom:6px;font-variant-numeric:tabular-nums}
.lp-kpi .label{font-size:12px;color:#6B7280}
.lp-pagination{display:flex;align-items:center;justify-content:center;gap:24px;padding:12px 16px;font-size:13px;color:#6B7280}
.lp-pagination .divider{width:1px;height:20px;background:#E5E7EB}
.lp-tip-trigger{cursor:help;border-bottom:1px dashed #9CA3AF;padding-bottom:1px}
.lp-note{padding:14px;border-radius:10px;background:#F3EEFF;border:1px solid #DDD6FE;color:#6D28D9;font-size:12px;line-height:1.8}
.lp-note-sm{padding:10px 14px;background:#F3EEFF;border:1px solid #DDD6FE;border-radius:8px;font-size:12px;color:#6D28D9}
.lp-section{font-size:15px;font-weight:600;color:#1F2937;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid #E5E7EB}
.lp-section-purple{font-size:14px;font-weight:700;color:#7C3AED;margin:0 0 12px}
.lp-empty{display:flex;flex-direction:column;align-items:center;padding:60px 20px;text-align:center}
.lp-empty .icon{font-size:48px;margin-bottom:16px;color:#9CA3AF}
.lp-empty .icon.err{color:#DC2626}
.lp-empty .title{font-size:16px;font-weight:600;color:#1F2937;margin-bottom:8px}
.lp-empty .desc{font-size:13px;color:#6B7280;margin-bottom:24px;max-width:360px}
.lp-detail{display:grid;grid-template-columns:120px 1fr;gap:10px 16px;font-size:13px;margin-bottom:24px}
.lp-detail .dl{color:#6B7280}
.lp-detail .dv{color:#1F2937}
.lp-code{font-family:Menlo,Monaco,Consolas,monospace;font-size:12px;color:#374151;background:#F3F4F6;padding:1px 6px;border-radius:4px}
:focus-visible{outline:none;box-shadow:inset 0 0 0 2px rgba(124,58,237,.4)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function Kpi({ num, label, numStyle }) {
  return (
    <div className="lp-kpi">
      <div className="label" style={{ marginBottom: 6 }}>{label}</div>
      <div className="num" style={numStyle}>{num}</div>

function StatusTag({ variant, children }) {
  const c = TAG_COLORS[variant] || TAG_COLORS.off;
  return (
    <Tag bordered={false} style={{ background:c.bg, color:c.color, borderRadius:999,
      padding:'2px 8px', fontSize:12, lineHeight:'18px', marginInlineEnd:4 }}>{children}</Tag>
  );
}
function TipText({ label, tip }) {
  return (
    <Tooltip title={<div style={{ whiteSpace:'pre-line', lineHeight:1.6 }}>{tip}</div>} color="#fff"
      styles={{ body: { color:'#374151', fontSize:12, padding:'10px 14px' } }}>
      <span className="lp-tip-trigger">{label}</span>
    </Tooltip>
  );
}
function CompactPagination({ total, current=1, pageSize=10, totalPages }) {
  const pages = useMemo(() => {
    const tp = totalPages || Math.ceil(total / pageSize) || 1;
    const out = [{ k:'prev', label:'<', disabled:current===1, arrow:true }];
    if (tp <= 6) for (let i=1; i<=tp; i++) out.push({ k:i, label:i });
    else { out.push({k:1,label:1}); out.push({k:2,label:2}); out.push({k:3,label:3}); out.push({k:'gap',label:'…',disabled:true}); out.push({k:tp,label:tp}); }
    out.push({ k:'next', label:'>', disabled:current===tp, arrow:true });
    return out;
  }, [current, totalPages, total, pageSize]);
  const tp = totalPages || Math.ceil(total / pageSize) || 1;
  return (
    <div className="lp-pagination">
      <span>共 {total.toLocaleString()} 条,每页{' '}
        <Select size="small" value={pageSize} style={{ width:72, marginInline:4 }}
          options={[{value:10,label:10},{value:20,label:20},{value:50,label:50}]} />{' '}条</span>
      <div className="divider" />
      <Space size={2}>
        {pages.map(p => (
          <span key={p.k} style={{ minWidth:32, height:32, display:'inline-flex', alignItems:'center', justifyContent:'center',
            borderRadius:8, fontSize:13, cursor:p.disabled?'default':'pointer',
            background:p.k===current?'#7C3AED':(p.arrow?'#fff':'transparent'),
            color:p.k===current?'#fff':'#374151', border:p.arrow?'1px solid #E5E7EB':'none',
            fontWeight:p.k===current?600:400, opacity:p.disabled?0.35:1 }}>{p.label}</span>
        ))}
      </Space>
      <div className="divider" />
      <span>第 {current}/{tp} 页</span>
    </div>
  );
}

  { id:'u1001', uid:'U-100231', name:'Sarah Johnson', email:'sarah.j@example.com', registered:true,  subscribed:true,  source:'preference',  changedAt:'2026-06-09 14:32' },

const ACTION_TAG = { subscribe: { variant:'on', label:'订阅' }, unsubscribe: { variant:'req', label:'退订' } };
// 抽屉:单个用户的订阅状态 + 同意凭证时间线(UC-26 合规调取)
function UserDrawer({ user, open, onClose }) {
  const records = user ? (CONSENT_RECORDS[user.id] || []) : [];
  return (
    <Drawer title={user ? '订阅用户详情' : ''} width={520} open={open} onClose={onClose}
      destroyOnHidden>
      {user && (
        <>
          <h4 className="lp-section-purple">基本信息</h4>
          <div className="lp-detail">
            <div className="dl">用户 ID</div>
            <div className="dv">{user.uid
              ? <span className="lp-code">{user.uid}</span>
              : <StatusTag variant="pending">未注册</StatusTag>}</div>
            <div className="dl">订阅邮箱</div><div className="dv">{user.email}</div>
          </div>

          <h4 className="lp-section-purple">当前订阅状态</h4>
          <div className="lp-detail">
            <div className="dl"><MailOutlined style={{ marginRight:6, color:'#7C3AED' }} />Email 营销</div>
            <div className="dv">
              {user.subscribed
                ? <StatusTag variant="on">已订阅</StatusTag>
                : <StatusTag variant="req">已退订</StatusTag>}
            </div>
            <div className="dl">最近来源</div><div className="dv">{SOURCE_LABEL[user.source] || '—'}</div>
            <div className="dl">最近变更</div><div className="dv">{user.changedAt}</div>
          </div>

          <h4 className="lp-section-purple">
            <SafetyCertificateOutlined style={{ marginRight:6 }} />同意凭证时间线(合规审计)
          </h4>
          <Timeline
            items={records.map(r => ({
              color: r.action === 'subscribe' ? '#16A34A' : '#DC2626',
              children: (
                <div>
                  <div style={{ marginBottom:4 }}>
                    <StatusTag variant={ACTION_TAG[r.action].variant}>{ACTION_TAG[r.action].label}</StatusTag>
                    <span style={{ color:'#6B7280', fontSize:12, marginLeft:4 }}>{r.at}</span>
                  </div>
                  <div style={{ fontSize:13, marginBottom:4 }}>
                    {r.from} <span style={{ color:'#9CA3AF' }}>→</span> <strong>{r.to}</strong>
                    <span style={{ marginLeft:8, color:'#6B7280' }}>来源:{CONSENT_SOURCE_LABEL[r.source] || '—'}</span>
                  </div>
                  <div style={{ fontSize:12, color:'#9CA3AF' }}>
                    <GlobalOutlined style={{ marginRight:4 }} /><span className="lp-code">{r.ip}</span>
                    <DesktopOutlined style={{ margin:'0 4px 0 12px' }} />{r.device}

              ),

}

function SubscriptionPage() {
  const [mode, setMode] = useState('data');
  const [drawerOpen, setDrawerOpen] = useState(false);
  const [active, setActive] = useState(null);
  const [kw, setKw] = useState('');
  const [statusFilter, setStatusFilter] = useState('');
  const [sourceFilter, setSourceFilter] = useState('');
  const [regFilter, setRegFilter] = useState('');

  const openUser = (u) => { setActive(u); setDrawerOpen(true); };

  const filtered = useMemo(() => USERS.filter(u => {
    if (kw) {
      const hay = [u.email, u.name || '', u.uid || ''].join(' ').toLowerCase();
      if (!hay.includes(kw.toLowerCase())) return false;
    }
    if (statusFilter === 'on' && !u.subscribed) return false;
    if (statusFilter === 'off' && u.subscribed) return false;
    if (sourceFilter && u.source !== sourceFilter) return false;
    if (regFilter === 'reg' && !u.registered) return false;
    if (regFilter === 'unreg' && u.registered) return false;
    return true;
  }), [kw, statusFilter, sourceFilter, regFilter]);

  const subCount = USERS.filter(u => u.subscribed).length;
  const unsubCount = USERS.length - subCount;
  const unregCount = USERS.filter(u => !u.registered).length;
  const rate = USERS.length ? Math.round(subCount / USERS.length * 100) : 0;

  const columns = [
    { title: '订阅邮箱', dataIndex: 'email', render: v => <span style={{ fontWeight:500 }}>{v}</span> },
    { title: '用户 ID', dataIndex: 'uid', render: v => v
      ? <span className="lp-code">{v}</span>
      : <StatusTag variant="pending">未注册</StatusTag> },
    { title: <TipText label="Email 营销订阅" tip={'已订阅 = 允许发送营销邮件\n已退订 = 仅发送订单履约等事务邮件'} />,
      dataIndex: 'subscribed', render: v => v
        ? <StatusTag variant="on">已订阅</StatusTag>
        : <StatusTag variant="req">已退订</StatusTag> },
    { title: '最近来源', dataIndex: 'source', render: v => SOURCE_LABEL[v] || '—' },
    { title: '最近变更时间', dataIndex: 'changedAt' },
    { title: '操作', key: 'op', render: (_, r) => (
      <Space size={6}>
        <Button size="small" onClick={() => openUser(r)}>查看 / 调取凭证</Button>
      </Space>
    ) },
  ];

  const clearFilter = () => { setKw(''); setStatusFilter(''); setSourceFilter(''); setRegFilter(''); setMode('data'); };

  return (
    <Card style={CARD_STYLE}>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:16, marginBottom:18 }}>
        <div>
          <div style={{ fontSize:20, fontWeight:700, marginBottom:6 }}>订阅用户</div>
          <div style={{ color:'#6B7280', fontSize:13 }}>查询 Email 营销订阅状态(以邮箱为主体,含未注册访客),点击行调取该邮箱的同意凭证(合规审计)</div>
        </div>
      </div>

      <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:12, marginBottom:18 }}>
        <Kpi num={USERS.length} label="订阅记录总数" />
        <Kpi num={subCount} label="已订阅" numStyle={{ color:'#16A34A' }} />
        <Kpi num={unsubCount} label="已退订" numStyle={{ color:'#DC2626' }} />
        <Kpi num={unregCount} label="未注册订阅" />
      </div>

      <Space size={12} wrap style={{ marginBottom:16 }}>
        <Input placeholder="搜索 邮箱 / 姓名 / 用户ID" prefix={<SearchOutlined style={{ color:'#9CA3AF' }} />}
          allowClear style={{ width:220 }} value={kw} onChange={e => setKw(e.target.value)} />
        <Select value={statusFilter} style={{ width:130 }} onChange={setStatusFilter}
          options={[{value:'',label:'全部状态'},{value:'on',label:'已订阅'},{value:'off',label:'已退订'}]} />
        <Select value={regFilter} style={{ width:130 }} onChange={setRegFilter}
          options={[{value:'',label:'全部注册状态'},{value:'reg',label:'已注册'},{value:'unreg',label:'未注册'}]} />
        <Select value={sourceFilter} style={{ width:150 }} onChange={setSourceFilter}
          options={[{value:'',label:'全部来源'},{value:'footer',label:'页脚订阅框'},{value:'popup',label:'订阅弹窗'},{value:'preference',label:'偏好中心'}]} />
        <Button type="primary" icon={<SearchOutlined />}>查询</Button>
        <Button icon={<ReloadOutlined />} onClick={clearFilter}>重置</Button>
      </Space>

      {mode === 'data' && (
        <>
          <Table rowKey="id" columns={columns} dataSource={filtered} pagination={false} styles={TABLE_STYLES}
            onRow={r => ({ onClick: () => openUser(r), style: { cursor:'pointer' } })} />
          <CompactPagination total={filtered.length} pageSize={10} />
        </>
      )}
      {mode === 'zero' && <EmptyZero />}
      {mode === 'no-match' && <EmptyNoMatch onClear={clearFilter} />}
      {mode === 'error' && <EmptyError onRetry={() => setMode('data')} />}

      <EmptyStateSwitcher mode={mode} setMode={setMode} />

      <UserDrawer user={active} open={drawerOpen} onClose={() => setDrawerOpen(false)} />
    </Card>
  );
}

function App() {
  const [activeKey, setActiveKey] = useState('sub-users');
  const menuItems = [
    { key: 'sub-users', icon: <UserOutlined />, label: '订阅用户' },
  ];
  return (
    <Layout style={{ height: '100vh' }}>
      <Layout.Header style={{ borderBottom: '1px solid #E5E7EB', display:'flex', alignItems:'center' }}>
        <img src={LOGO_SRC} alt="Looply" style={{ height: 32, display: 'block' }} />
        <div style={{ width:1, height:20, background:'#E5E7EB', margin:'0 16px' }} />
        <span style={{ fontSize:14, fontWeight:500, color:'#6B7280' }}>订阅管理后台</span>
        <span style={{ marginLeft:'auto', color:'#9CA3AF', fontSize:13 }}>订阅管理 / 订阅用户</span>
      </Layout.Header>
      <Layout>
        <Layout.Sider width={220} theme="light" style={SIDER_STYLE}>
          <Menu mode="inline" items={menuItems} selectedKeys={[activeKey]}
            style={{ borderInlineEnd: 'none' }} onClick={({ key }) => setActiveKey(key)} />
        </Layout.Sider>
        <Layout.Content style={{ padding:28, overflow:'auto' }}>
          <SubscriptionPage />
        </Layout.Content>
      </Layout>
    </Layout>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <ConfigProvider theme={looplyTheme}><App /></ConfigProvider>
);
</script>
