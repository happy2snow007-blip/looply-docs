html,body,#root{height:100%;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F9FAFB;color:#1F2937}
#root::before{content:'正在加载 antd 原型……';position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#9CA3AF;font-size:14px}
#root:not(:empty)::before{display:none}
.lp-kpi{background:linear-gradient(180deg,#FEFCFF 0%,#F3EEFF 100%);border:1px solid #DDD6FE;border-radius:14px;padding:14px 16px}
.lp-kpi .num{font-size:24px;font-weight:700;color:#7C3AED;line-height:1;margin-bottom:6px;font-variant-numeric:tabular-nums}
.lp-kpi .label{font-size:12px;color:#6B7280}
.lp-pagination{display:flex;align-items:center;justify-content:center;gap:24px;padding:12px 16px;font-size:13px;color:#6B7280}
.lp-pagination .divider{width:1px;height:20px;background:#E5E7EB}
.lp-tip-trigger{cursor:help;border-bottom:1px dashed #9CA3AF;padding-bottom:1px}
.lp-section{font-size:15px;font-weight:600;color:#1F2937;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid #E5E7EB}
.lp-section-purple{font-size:14px;font-weight:700;color:#7C3AED;margin:0 0 12px}
.lp-oplog-title{font-size:14px;font-weight:700;color:#7C3AED;margin:24px 0 12px}
.lp-empty{display:flex;flex-direction:column;align-items:center;padding:60px 20px;text-align:center}
.lp-empty .icon{font-size:48px;margin-bottom:16px;color:#9CA3AF}
.lp-empty .icon.err{color:#DC2626}
.lp-empty .title{font-size:16px;font-weight:600;color:#1F2937;margin-bottom:8px}
.lp-empty .desc{font-size:13px;color:#6B7280;margin-bottom:24px;max-width:360px}
.lp-form-row{display:flex;gap:16px;margin-bottom:12px;align-items:center}
.lp-form-row:first-of-type{margin-top:8px}
.lp-form-row .lp-form-label{width:96px;text-align:right;color:#6B7280;font-size:13px;flex-shrink:0}
.lp-form-row .lp-form-label .req{color:#DC2626;margin-right:4px}
.lp-form-row .lp-form-control{flex:1}
.lp-helper{font-size:12px;color:#9CA3AF;margin:-4px 0 12px 112px}
.lp-note{padding:14px;border-radius:10px;background:#F3EEFF;border:1px solid #DDD6FE;color:#6D28D9;font-size:12px;line-height:1.8}
.lp-note-sm{padding:10px 14px;background:#F3EEFF;border:1px solid #DDD6FE;border-radius:8px;font-size:12px;color:#6D28D9}
.lp-upload-zone{border:2px dashed #D1D5DB;border-radius:14px;padding:32px;text-align:center;background:#FAFAFA}
.lp-upload-zone .hint{font-size:13px;color:#6B7280;margin-bottom:8px}
.lp-upload-zone .sub{font-size:12px;color:#9CA3AF;margin-top:8px}
.lp-code{font-family:Menlo,Monaco,Consolas,monospace;font-size:12px;color:#374151;background:#F3F4F6;padding:1px 6px;border-radius:4px}
:focus-visible{outline:none;box-shadow:inset 0 0 0 2px rgba(124,58,237,.4)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

const CARD_STYLE = { boxShadow:'0 10px 24px rgba(16,24,40,.06)', marginBottom:20 };
const TABLE_STYLES = { root:{ borderRadius:14, border:'1px solid #E5E7EB', overflow:'hidden' } };
const SIDER_STYLE = { boxShadow:'3px 0 12px rgba(0,0,0,0.06)', padding:'8px 0', overflowY:'auto', height:'100%' };

function demoAction(label) { antd.message.info({ content: label + ' (原型演示)', duration: 1.5 }); }
function demoConfirm(label, cb) { Modal.confirm({ title: '确认操作', content: '确定要' + label + '吗？', centered: true, closable: false, maskClosable: false, onOk: cb || (() => antd.message.success(label + ' 已执行 (原型演示)')) }); }
function DemoSkip({ onClick, label }) { return <div style={{textAlign:'center',marginTop:12,marginBottom:20}}><Button type="link" onClick={onClick}>{label || '跳过上传，直接查看预览效果 →'}</Button></div>; }

const TAG_COLORS = {
  on:{bg:'#F0FDF4',color:'#16A34A'}, sale:{bg:'#EFF6FF',color:'#2563EB'},
  pending:{bg:'#FFFBEB',color:'#D97706'}, off:{bg:'#F3F4F6',color:'#6B7280'},
  req:{bg:'#FEF2F2',color:'#DC2626'}, warn:{bg:'#FFF1F2',color:'#E11D48'},
};

function StatusTag({ variant, children }) {
  const c = TAG_COLORS[variant] || TAG_COLORS.off;
  return <Tag bordered={false} style={{ background:c.bg, color:c.color, borderRadius:999, padding:'2px 8px', fontSize:12, lineHeight:'18px', marginInlineEnd:4 }}>{children}</Tag>;
}
function TipText({ label, tip }) {
  return <Tooltip title={<div style={{ whiteSpace:'pre-line', lineHeight:1.6 }}>{tip}</div>} color="#fff" styles={{ body:{color:'#374151',fontSize:12,padding:'10px 14px'} }}><span className="lp-tip-trigger">{label}</span></Tooltip>;
}
function Kpi({ num, label, numStyle, onClick }) {
  return <div className="lp-kpi" style={onClick?{cursor:'pointer'}:null} onClick={onClick}><div className="label" style={{marginBottom:6}}>{label}</div><div className="num" style={numStyle}>{num}</div></div>;
}
function FormRow({ label, required, children, helper }) {
  return <><div className="lp-form-row"><div className="lp-form-label">{required && <span className="req">*</span>}{label}</div><div className="lp-form-control">{children}</div></div>{helper && <div className="lp-helper">{helper}</div>}</>;
}
function CompactPagination({ total, current=1, pageSize=10 }) {
  const tp = Math.ceil(total / pageSize) || 1;
  return <div className="lp-pagination"><span>{'共 '}{total.toLocaleString()}{' 条'}</span><div className="divider" /><span>{'第 '}{current}/{tp}{' 页'}</span></div>;
}
function EmptyZero({ entity, cta, onCta }) {
  return <div className="lp-empty"><InboxOutlined className="icon" /><div className="title">{'暂无'}{entity}</div><div className="desc">{'点击下方按钮创建第一条'}{entity}{'记录'}</div>{cta && <Button type="primary" onClick={onCta}>{cta}</Button>}</div>;
}
function EmptyNoMatch({ onClear }) {
  return <div className="lp-empty"><SearchOutlined className="icon" /><div className="title">未找到匹配结果</div><div className="desc">请尝试调整搜索关键词或筛选条件</div><Button onClick={onClear}>清除筛选条件</Button></div>;
}
function EmptyError({ onRetry }) {
  return <div className="lp-empty"><ExclamationCircleOutlined className="icon err" /><div className="title">加载失败</div><div className="desc">网络异常，请检查网络连接后重试</div><Button type="primary" onClick={onRetry}>重试</Button></div>;
}
function EmptyStateSwitcher({ mode, setMode }) {
  return <div style={{marginTop:12,display:'flex',gap:8,justifyContent:'center'}}>{[['data','正常数据'],['zero','零数据态'],['no-match','无匹配态'],['error','异常态']].map(([k,l])=><Button key={k} type={mode===k?'primary':'default'} onClick={()=>setMode(k)}>{l}</Button>)}</div>;
}

function ListPage({ title, desc, headActions, kpis, filters, columns, data, total, entity, scrollX, extraBeforeTable, extraAfterTable }) {
  const [mode, setMode] = useState('data');
  return (
    <Card style={CARD_STYLE}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:16,marginBottom:18}}>
        <div><div style={{fontSize:20,fontWeight:700,marginBottom:6}}>{title}</div>{desc && <div style={{color:'#6B7280',fontSize:13}}>{desc}</div>}</div>
        <div>{headActions}</div>
      </div>
      {kpis && <div style={{display:'grid',gridTemplateColumns:`repeat(${kpis.length},1fr)`,gap:12,marginBottom:18}}>{kpis.map((k,i)=><Kpi key={i} num={k.num} label={k.label} numStyle={k.numStyle} />)}</div>}
      {filters && <Space size={12} wrap style={{marginBottom:16}}>{filters}</Space>}
      {extraBeforeTable}
      {mode==='data' && <>
        <Table rowKey={r=>r.id||r.key} columns={columns} dataSource={data} pagination={false} styles={TABLE_STYLES} scroll={scrollX?{x:scrollX}:undefined} />
        <CompactPagination total={total||data.length} pageSize={10} />
      </>}
      {mode==='zero' && <EmptyZero entity={entity} />}
      {mode==='no-match' && <EmptyNoMatch onClear={()=>setMode('data')} />}
      {mode==='error' && <EmptyError onRetry={()=>setMode('data')} />}
      <EmptyStateSwitcher mode={mode} setMode={setMode} />
      {extraAfterTable}
    </Card>
  );
}

function TaskHistory({ tasks }) {
  return (
    <div style={{marginTop:24}}>
      <h4 className="lp-section">任务历史</h4>
      <Table rowKey="id" size="small" pagination={false} styles={TABLE_STYLES}
        columns={[
          { title:'任务ID', dataIndex:'id', width:100, render:v=><span className="lp-code">{v}</span> },
          { title:'创建时间', dataIndex:'createdAt', width:160 },
          { title:'状态', dataIndex:'status', width:100,
            render:v=>({ done:<StatusTag variant="on">已完成</StatusTag>, running:<StatusTag variant="sale">执行中</StatusTag>,
                         failed:<StatusTag variant="req">失败</StatusTag>, queued:<StatusTag variant="off">排队中</StatusTag> })[v] },
