.lp-kpi .num{font-size:24px;font-weight:700;color:#7C3AED;line-height:1;margin-bottom:6px;font-variant-numeric:tabular-nums}
.lp-kpi .label{font-size:12px;color:#6B7280}
.lp-pagination{display:flex;align-items:center;justify-content:center;gap:24px;padding:12px 16px;font-size:13px;color:#6B7280}

.lp-tip-trigger{cursor:help;border-bottom:1px dashed #9CA3AF;padding-bottom:1px}
.lp-section{font-size:15px;font-weight:600;color:#1F2937;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid #E5E7EB}
.lp-section-purple{font-size:14px;font-weight:700;color:#7C3AED;margin:0 0 12px}
.lp-oplog-title{font-size:14px;font-weight:700;color:#7C3AED;margin:24px 0 12px}
.lp-empty{display:flex;flex-direction:column;align-items:center;padding:60px 20px;text-align:center}
.lp-empty .icon{font-size:48px;margin-bottom:16px;color:#9CA3AF}
.lp-empty .icon.err{color:#DC2626}
.lp-empty .title{font-size:16px;font-weight:600;color:#1F2937;margin-bottom:8px}

.lp-form-row{display:flex;gap:16px;margin-bottom:12px;align-items:center}
.lp-form-row:first-of-type{margin-top:8px}

.lp-form-row .lp-form-label .req{color:#DC2626;margin-right:4px}
.lp-form-row .lp-form-control{flex:1}
.lp-helper{font-size:12px;color:#9CA3AF;margin:-4px 0 12px 112px}
.lp-note{padding:14px;border-radius:10px;background:#F3EEFF;border:1px solid #DDD6FE;color:#6D28D9;font-size:12px;line-height:1.8}
.lp-note-sm{padding:10px 14px;background:#F3EEFF;border:1px solid #DDD6FE;border-radius:8px;font-size:12px;color:#6D28D9}
.lp-upload-zone{border:2px dashed #D1D5DB;border-radius:14px;padding:32px;text-align:center;background:#FAFAFA}
.lp-upload-zone .hint{font-size:13px;color:#6B7280;margin-bottom:8px}

const CARD_STYLE = { boxShadow:'0 10px 24px rgba(16,24,40,.06)', marginBottom:20 };
const TABLE_STYLES = { root:{ borderRadius:14, border:'1px solid #E5E7EB', overflow:'hidden' } };
const SIDER_STYLE = { boxShadow:'3px 0 12px rgba(0,0,0,0.06)', padding:'8px 0', overflowY:'auto', height:'100%' };

function demoAction(label) { antd.message.info({ content: label + ' (原型演示)', duration: 1.5 }); }
function demoConfirm(label, cb) { Modal.confirm({ title: '确认操作', content: '确定要' + label + '吗？', centered: true, closable: false, maskClosable: false, onOk: cb || (() => antd.message.success(label + ' 已执行 (原型演示)')) }); }
function DemoSkip({ onClick, label }) { return <div style={{textAlign:'center',marginTop:12,marginBottom:20}}><Button type="link" onClick={onClick}>{label || '跳过上传，直接查看预览效果 →'}</Button></div>; }

const TAG_COLORS = {
  on:{bg:'#F0FDF4',color:'#16A34A'}, sale:{bg:'#EFF6FF',color:'#2563EB'},
  pending:{bg:'#FFFBEB',color:'#D97706'}, off:{bg:'#F3F4F6',color:'#6B7280'},
  req:{bg:'#FEF2F2',color:'#DC2626'}, warn:{bg:'#FFF1F2',color:'#E11D48'},
};

function StatusTag({ variant, children }) {
  const c = TAG_COLORS[variant] || TAG_COLORS.off;
  return <Tag bordered={false} style={{ background:c.bg, color:c.color, borderRadius:999, padding:'2px 8px', fontSize:12, lineHeight:'18px', marginInlineEnd:4 }}>{children}</Tag>;
}
function TipText({ label, tip }) {
  return <Tooltip title={<div style={{ whiteSpace:'pre-line', lineHeight:1.6 }}>{tip}</div>} color="#fff" styles={{ body:{color:'#374151',fontSize:12,padding:'10px 14px'} }}><span className="lp-tip-trigger">{label}</span></Tooltip>;
}
function Kpi({ num, label, numStyle, onClick }) {
  return <div className="lp-kpi" style={onClick?{cursor:'pointer'}:null} onClick={onClick}><div className="label" style={{marginBottom:6}}>{label}</div><div className="num" style={numStyle}>{num}</div></div>;
}
function FormRow({ label, required, children, helper }) {
  return <><div className="lp-form-row"><div className="lp-form-label">{required && <span className="req">*</span>}{label}</div><div className="lp-form-control">{children}</div></div>{helper && <div className="lp-helper">{helper}</div>}</>;
}
function CompactPagination({ total, current=1, pageSize=10 }) {
  const tp = Math.ceil(total / pageSize) || 1;
  return <div className="lp-pagination"><span>{'共 '}{total.toLocaleString()}{' 条'}</span><div className="divider" /><span>{'第 '}{current}/{tp}{' 页'}</span></div>;
}
function EmptyZero({ entity, cta, onCta }) {
  return <div className="lp-empty"><InboxOutlined className="icon" /><div className="title">{'暂无'}{entity}</div><div className="desc">{'点击下方按钮创建第一条'}{entity}{'记录'}</div>{cta && <Button type="primary" onClick={onCta}>{cta}</Button>}</div>;
}
function EmptyNoMatch({ onClear }) {
  return <div className="lp-empty"><SearchOutlined className="icon" /><div className="title">未找到匹配结果</div><div className="desc">请尝试调整搜索关键词或筛选条件</div><Button onClick={onClear}>清除筛选条件</Button></div>;
}
function EmptyError({ onRetry }) {
  return <div className="lp-empty"><ExclamationCircleOutlined className="icon err" /><div className="title">加载失败</div><div className="desc">网络异常，请检查网络连接后重试</div><Button type="primary" onClick={onRetry}>重试</Button></div>;
}
function EmptyStateSwitcher({ mode, setMode }) {
  return <div style={{marginTop:12,display:'flex',gap:8,justifyContent:'center'}}>{[['data','正常数据'],['zero','零数据态'],['no-match','无匹配态'],['error','异常态']].map(([k,l])=><Button key={k} type={mode===k?'primary':'default'} onClick={()=>setMode(k)}>{l}</Button>)}</div>;
}

/* ========== 业务组件：操作记录区（编辑页/详情页通用，见 components.md B.8）========== */
function OpLog({ data, total, types }) {
  return (
    <div style={{marginTop:24}}>
      <div className="lp-oplog-title">操作记录</div>
      <Space size={8} wrap style={{marginBottom:12}}>
        <Select size="small" defaultValue="" style={{width:150}} options={[{value:'',label:'全部操作类型'},...(types||['新增','编辑','删除']).map(x=>({value:x,label:x}))]} />
        <Select size="small" defaultValue="" style={{width:130}} options={[{value:'',label:'全部操作人'},{value:'a',label:'张运营'},{value:'b',label:'李主管'}]} />
        <DatePicker.RangePicker size="small" placeholder={['开始日期','结束日期']} />
        <Button size="small" icon={<SearchOutlined />}>查询</Button>
      </Space>
      <Table size="small" rowKey="i" pagination={false} styles={TABLE_STYLES} scroll={{x:'max-content'}}
        columns={[
          { title:'操作时间', dataIndex:'at', width:150 },
          { title:'操作人', dataIndex:'who', width:100 },
          { title:'操作类型', dataIndex:'type', width:120, render:v=><StatusTag variant={v.includes('删除')?'req':(v.includes('修改')||v.includes('编辑')||v.includes('调整')?'pending':'on')}>{v}</StatusTag> },
          { title:'操作内容', dataIndex:'detail' },
        ]}
        dataSource={data} />
      <CompactPagination total={total || (data ? data.length : 0)} pageSize={10} />
    </div>
  );
}

function ListPage({ title, desc, headActions, kpis, filters, columns, data, total, entity, scrollX, extraBeforeTable, extraAfterTable }) {
  const [mode, setMode] = useState('data');
  return (
    <Card style={CARD_STYLE}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:16,marginBottom:18}}>
        <div><div style={{fontSize:20,fontWeight:700,marginBottom:6}}>{title}</div>{desc && <div style={{color:'#6B7280',fontSize:13}}>{desc}</div>}</div>
        <div>{headActions}</div>
      </div>
      {kpis && <div style={{display:'grid',gridTemplateColumns:`repeat(${kpis.length},1fr)`,gap:12,marginBottom:18}}>{kpis.map((k,i)=><Kpi key={i} num={k.num} label={k.label} numStyle={k.numStyle} onClick={k.onClick} />)}</div>}
      {filters && <Space size={12} wrap style={{marginBottom:16}}>{filters}</Space>}
      {extraBeforeTable}
      {mode==='data' && <>
        <Table rowKey={r=>r.id||r.key} columns={columns} dataSource={data} pagination={false} styles={TABLE_STYLES} scroll={scrollX?{x:scrollX}:undefined} />
        <CompactPagination total={total||data.length} pageSize={10} />
      </>}
      {mode==='zero' && <EmptyZero entity={entity} />}
      {mode==='no-match' && <EmptyNoMatch onClear={()=>setMode('data')} />}
      {mode==='error' && <EmptyError onRetry={()=>setMode('data')} />}
      <EmptyStateSwitcher mode={mode} setMode={setMode} />
      {extraAfterTable}
    </Card>
  );
}

function TrrEditModal({ open, sheet, row, onClose, onSave }) {
  const [isTop, setIsTop] = useState(true);

  const [avgPrice, setAvgPrice] = useState(0);
  const [sampleCount, setSampleCount] = useState(0);
  const [brandV, setBrandV] = useState(undefined);
  const [seriesV, setSeriesV] = useState('');
  const [sizeV, setSizeV] = useState('');
  const [condV, setCondV] = useState(undefined);
  React.useEffect(() => {
    if (row) {
      setIsTop(!!row.isTop);
      const n = row.avgPrice ? Number(String(row.avgPrice).replace(/[^0-9.]/g,'')) : 0;

      </>}
    </Modal>
  );
}

function GlossaryEditModal({ open, target, onClose, onSave }) {
  const [cn, setCn] = useState('');

    <Modal title={isEdit ? ('编辑术语 — ' + target.record.cn) : '新增术语'} open={open} onCancel={onClose}
      closable={false} maskClosable={false} centered width={520}

/* ========== 共用：翻译术语库 — 拼接规则 新增/编辑 Modal（Category Suffix / Wallet 范围 / 名称拼接）========== */
function GlossaryRuleEditModal({ open, target, onClose, onSave }) {
  const [f1, setF1] = useState('');
  const [f2, setF2] = useState('');
  const [f3, setF3] = useState('');
  const [wallet, setWallet] = useState(true);
  React.useEffect(() => {
    if (target) {
      const r = target.record || {};
      if (target.tab === 'suffix') { setF1(r.category||''); setF2(r.suffix||''); setF3(r.priority||''); }
      else if (target.tab === 'wallet') { setF1(r.l3||''); setWallet(r.isWallet!==false); }
      else if (target.tab === 'order') { setF1(r.category||''); setF2(r.hasSeries||'有系列'); setF3(r.order||''); }
    }
  }, [target]);
  if (!target) return null;
  const isAdd = !!target.add;
  const T = target.tab;
  const titleMap = { suffix:'Category Suffix 规则', wallet:'Wallet 范围规则', order:'名称拼接规则' };
  return (
    <Modal title={(isAdd?'新增 — ':'编辑 — ') + (titleMap[T]||'规则')} open={open} onCancel={onClose}
      closable={false} maskClosable={false} centered width={520}
      footer={[
        <Button key="c" onClick={onClose}>取消</Button>,
        <Button key="s" type="primary" onClick={onSave}>保存</Button>,
      ]}>
      {T === 'suffix' && <>
        <FormRow label="类目" required><Input value={f1} onChange={e=>setF1(e.target.value)} placeholder="如 Handbags / Handbags › Wallet" style={{width:'100%'}} /></FormRow>
        <FormRow label="后缀词" required><Input value={f2} onChange={e=>setF2(e.target.value)} placeholder="如 Bag；无后缀可留空或填说明" style={{width:'100%'}} /></FormRow>
        <FormRow label="优先级" required><InputNumber value={Number(f3)||0} onChange={v=>setF3(v)} min={1} style={{width:'100%'}} /></FormRow>
      </>}
      {T === 'wallet' && <>
        <FormRow label="L3 类目" required><Input value={f1} onChange={e=>setF1(e.target.value)} placeholder="如 Wallet / Card Holder" style={{width:'100%'}} /></FormRow>
        <FormRow label="是否归 Wallet" required><Switch checked={wallet} onChange={setWallet} checkedChildren="归 Wallet" unCheckedChildren="不归" /></FormRow>
      </>}
      {T === 'order' && <>
        <FormRow label="类目" required><Input value={f1} onChange={e=>setF1(e.target.value)} placeholder="如 Handbags（有系列，非 Wallet）" style={{width:'100%'}} /></FormRow>
        <FormRow label="有无系列" required><Select value={f2} onChange={setF2} style={{width:'100%'}} options={[{value:'有系列',label:'有系列'},{value:'无系列',label:'无系列'},{value:'—',label:'不限'}]} /></FormRow>
        <FormRow label="拼接顺序" required><Input.TextArea rows={2} value={f3} onChange={e=>setF3(e.target.value)} placeholder="如 系列 + 尺码 + 设计元素 + 材质 + 颜色" style={{width:'100%'}} /></FormRow>
      </>}
      <div className="lp-note-sm" style={{marginTop:12}}>拼接规则组维护把各字段英文值组装为完整 Product Name 的规则（保存为原型演示）</div>
    </Modal>
  );
}

/* ========== 共用：加工异常处理 Modal（v9 挂到红布林商品库行内使用） ========== */
function ProcessExceptionModal({ open, kind, record, onClose, onSave }) {
  const [brandEn, setBrandEn] = useState('');
  const [productName, setProductName] = useState('');
  const [decision, setDecision] = useState('cap');
  React.useEffect(() => {
    if (record) { setBrandEn(record.brandEn || ''); setProductName(record.productName || ''); setDecision('cap'); }
  }, [record]);
  if (!record) return null;
  const isTrans = kind === 'trans_residual';
  return (
    <Modal title={(isTrans ? '人工修正 — ' : '人工决策 — ') + record.plmId} open={open} onCancel={onClose}
      closable={false} maskClosable={false} centered width={560}
      footer={[
        <Button key="c" onClick={onClose}>取消</Button>,
        <Button key="s" type="primary" onClick={()=>onSave(record.id)}>{isTrans ? '保存并标记通过' : '提交决策'}</Button>,
      ]}>
      {isTrans ? <>
        <div style={{marginBottom:16,color:'#6B7280',fontSize:13}}>系统自动翻译存在中文残留（术语表未覆盖的自由文本片段），请人工补齐英文译文后保存，保存后系统自动重跑加工流程</div>
        <FormRow label="红布林商品ID"><span className="lp-code">{record.plmId}</span></FormRow>
        <FormRow label="翻译后品牌" required><Input value={brandEn} onChange={e=>setBrandEn(e.target.value)} style={{width:'100%'}} /></FormRow>
        <FormRow label="Product Name" required><Input.TextArea rows={3} value={productName} onChange={e=>setProductName(e.target.value)} style={{width:'100%'}} /></FormRow>
      </> : <>
        <div style={{marginBottom:16,color:'#6B7280',fontSize:13}}>该商品定价结果超出 TRR 参考价上限，需人工决策后系统按决策自动重跑</div>
        <FormRow label="红布林商品ID"><span className="lp-code">{record.plmId}</span></FormRow>
        <FormRow label="商品名称"><span>{record.productName}</span></FormRow>
        <FormRow label="异常详情"><span style={{color:'#DC2626'}}>{record.detail}</span></FormRow>
        <FormRow label="处理决策" required>
          <Radio.Group value={decision} onChange={e=>setDecision(e.target.value)}>
            <Space direction="vertical">
              <Radio value="cap">按公式上限价挂牌</Radio>
              <Radio value="keep">维持原价（超上限继续挂牌）</Radio>
              <Radio value="off">暂不上架（保持待销售·可逆，后续可重新上架）</Radio>
            </Space>
          </Radio.Group>
        </FormRow>
      </>}
    </Modal>
  );
}

    { id:'7', plmId:'PLM-023', chId:'CI007', productName:'Pochette Metis Reverse Canvas', brand:'Louis Vuitton', series:'Pochette Metis', category:'包袋', listed:true, curPrice:1980, suggest:1980, costFlow:'成本无变化', costDir:'flat', trr:'B/C 0.92 · 公式4', cls:'nochange' },
    { id:'8', plmId:'PLM-011', chId:'CI008', productName:'Lady Dior Medium Cannage Lambskin', brand:'Dior', series:'Lady Dior', category:'包袋', listed:true, curPrice:4200, suggest:4680, costFlow:'成本涨 $2,900→$3,260', costDir:'up', trr:'B/C 1.08 · 公式7 · 高于市场参考价', cls:'ready' },
    { id:'9', plmId:'PLM-061', chId:'CI009', productName:'Vintage Boston Bag（系列缺失·未匹配TRR）', brand:'Celine', series:'—', category:'包袋', listed:false, curPrice:900, suggest:null, costFlow:'—', costDir:'flat', trr:'TRR 未匹配', cls:'invalid' },
    { id:'10', plmId:'PLM-070', chId:'CI010', productName:'Speedy 25 Monogram Canvas', brand:'Louis Vuitton', series:'Speedy', category:'包袋', listed:true, curPrice:1350, suggest:1350, costFlow:'成本涨 $520→$580（仅Cost变化）', costDir:'up', trr:'B/C 0.75 · 公式2', cls:'ready' },
  ];
  const fmt = (n) => '$' + Number(n).toLocaleString();
  const setF = (k, v) => setFilters(f => ({ ...f, [k]: v }));
  const optLabel = (opts, v) => { const o = opts.find(x=>x.value===v); return o ? o.label : v; };
  const executed = new Set(executedIds);
  const isReady = (r) => r.cls==='ready' && !executed.has(r.id);
  // KPI 统计
  const cnt = (f) => rows.filter(f).length;
  const kTotal   = cnt(r=>!executed.has(r.id));
  const kReady   = cnt(isReady);
  const kNochange= cnt(r=>r.cls==='nochange');
  const kGap     = cnt(r=>r.cls==='gap');
  const kInvalid = cnt(r=>r.cls==='invalid');
  const kUp      = cnt(r=>isReady(r) && r.suggest>r.curPrice);
  const kDown    = cnt(r=>isReady(r) && r.suggest<r.curPrice);
  const selectedReady = selectedKeys.filter(k=>{ const r=rows.find(x=>x.id===k); return r && isReady(r); }).length;
  // 勾选中要执行的行（只有可改价行可勾）：执行即写入系统建议价 B
  const execRows = selectedKeys.filter(id => !executed.has(id)).map(id => rows.find(r=>r.id===id)).filter(r => r && r.cls==='ready');
  const doExecute = () => {
    const ids = execRows.map(r=>r.id);
    setExecutedIds(prev => [...prev, ...ids]);
    const wid = 'PB-' + String(waves.length+1).padStart(3,'0');
    setWaves(w => [{ id:wid, createdAt:'刚刚（本波）', status:'done', total:ids.length, success:ids.length, skipped:0, errors:0 }, ...w]);
    setSelectedKeys(keys => keys.filter(k => !ids.includes(k)));
    setDoneWave(wid);
    antd.message.success('已执行本波 '+ids.length+' 件调价（写入系统建议价），已记入波次历史 (原型演示)');
  };
  const nextWave = () => { setDoneWave(null); setSelectedKeys([]); setFilters({ brand:'', series:'', category:'', dir:'', price:'', listed:'', q:'' }); setCurrentStep(0); };
  // 前序回顾摘要：筛选条件
  const fChips = [];
  if (filters.brand) fChips.push('品牌 = ' + optLabel(PT_BRAND_OPTS, filters.brand));
  if (filters.series) fChips.push('系列 = ' + optLabel(PT_SERIES_OPTS, filters.series));
  if (filters.category) fChips.push('类目 = ' + optLabel(PT_CAT_OPTS, filters.category));
  if (filters.dir) fChips.push('涨跌 = ' + optLabel(PT_DIR_OPTS, filters.dir));
  if (filters.price) fChips.push('价位段 = ' + optLabel(PT_PRICE_OPTS, filters.price));
  if (filters.listed) fChips.push('上架 = ' + optLabel(PT_LISTED_OPTS, filters.listed));
  if (filters.q) fChips.push('搜索 = ' + filters.q);
  const filterRecap = (
    <Alert type="info" showIcon style={{marginBottom:14}} message={
      <span>本波筛选：{fChips.length ? <Space size={[6,6]} wrap style={{marginLeft:4}}>{fChips.map((c,i)=><StatusTag key={i} variant="off">{c}</StatusTag>)}</Space> : <span style={{color:'#6B7280'}}>全部商品（未加筛选）</span>}</span>
    } />
  );
  // 执行预览统计（执行即写入系统建议价 B = suggest）
  const upC = execRows.filter(r=>r.suggest>r.curPrice).length;
  const downC = execRows.filter(r=>r.suggest<r.curPrice).length;
  const flatC = execRows.filter(r=>r.suggest===r.curPrice).length;
  const execBrands = Array.from(new Set(execRows.map(r=>r.brand)));
  const diffTag = (v, cur) => { if (v==null) return <span style={{color:'#9CA3AF'}}>—</span>; const t=v-cur; return <span style={{color:t>0?'#D97706':(t<0?'#16A34A':'#9CA3AF')}}>{(t>0?'+':'')+fmt(t)}</span>; };
  // 商品列（第②步）—— 无处理决定列，只勾选
  const priceColumns = [
    { title:'红布林商品ID', dataIndex:'plmId', width:120, fixed:'left', render:v=><span className="lp-code">{v}</span> },
    { title:<TipText label="渠道商品ID" tip="改价实际写入的对象是渠道商品（listing），红布林商品ID 仅为待办来源标识" />, dataIndex:'chId', width:110, render:v=><span className="lp-code">{v}</span> },
    { title:'商品名', dataIndex:'productName', width:230 },
    { title:'品牌', dataIndex:'brand', width:110 },
    { title:'系列', dataIndex:'series', width:120 },
    { title:'当前挂牌价', dataIndex:'curPrice', width:100, align:'right', render:v=>fmt(v) },
    { title:<TipText label="建议价(B)" tip="系统按新折扣价 + 定价公式算出的目标挂牌价，执行即改到此价" />, dataIndex:'suggest', width:110, align:'right',
      render:(v,r)=> v==null ? <span style={{color:'#9CA3AF'}}>—</span> : <span style={{fontWeight:700,color:v>r.curPrice?'#D97706':(v<r.curPrice?'#16A34A':'#6B7280')}}>{fmt(v)}</span> },
    { title:'价差', key:'diff', width:100, align:'right', render:(_,r)=>diffTag(r.suggest, r.curPrice) },
    { title:'成本变化', dataIndex:'costFlow', width:200, render:(v,r)=><span style={{color:r.costDir==='up'?'#D97706':(r.costDir==='down'?'#16A34A':'#6B7280')}}>{v}</span> },
    { title:<TipText label="TRR 比对" tip="纯信息展示：B 相对 C 的位置 / 命中公式档，不设人工卡口、不阻断" />, dataIndex:'trr', width:210, render:(v,r)=><span style={{color:r.cls==='invalid'?'#DC2626':'#6B7280'}}>{v}</span> },
    { title:'上架状态', dataIndex:'listed', width:90, render:v=>v?<StatusTag variant="on">已上架</StatusTag>:<StatusTag variant="pending">未上架</StatusTag> },
    { title:'分类', key:'cls', width:120, fixed:'right', render:(_,r)=>{ if(executed.has(r.id)) return <StatusTag variant="sale">已改价</StatusTag>; const m=PRICE_CLS_META[r.cls]||PRICE_CLS_META.ready; return <StatusTag variant={m.variant}>{m.label}</StatusTag>; } },
  ];
  // 本波明细列（第③步只读复核）
  const detailColumns = [
    { title:'红布林商品ID', dataIndex:'plmId', width:120, render:v=><span className="lp-code">{v}</span> },
    { title:'商品名', dataIndex:'productName', width:230 },
    { title:'品牌', dataIndex:'brand', width:110 },
    { title:'系列', dataIndex:'series', width:120 },
    { title:'当前价', dataIndex:'curPrice', width:100, align:'right', render:v=>fmt(v) },
    { title:'建议价(B)', dataIndex:'suggest', width:110, align:'right', render:(v,r)=><span style={{fontWeight:700,color:v>r.curPrice?'#D97706':(v<r.curPrice?'#16A34A':'#6B7280')}}>{fmt(v)}</span> },
    { title:'价差', key:'diff', width:100, align:'right', render:(_,r)=>diffTag(r.suggest, r.curPrice) },
    { title:<TipText label="写入后划线价" tip="降价时把原挂牌价作为划线价（compare_at）；涨价 / 仅Cost变化不划线" />, key:'compareAt', width:130, align:'right', render:(_,r)=> r.suggest<r.curPrice ? <span style={{textDecoration:'line-through',color:'#9CA3AF'}}>{fmt(r.curPrice)}</span> : <span style={{color:'#9CA3AF'}}>—</span> },
  ];
  const wavesTable = (
    <div style={{marginTop:24}}>
      <h4 className="lp-section">波次历史（批次）</h4>
      <Table rowKey="id" size="small" pagination={false} styles={TABLE_STYLES} scroll={{x:'max-content'}}
        columns={[
          { title:'批次号', dataIndex:'id', width:120, render:v=><span className="lp-code">{v}</span> },
          { title:'执行时间', dataIndex:'createdAt', width:170 },
          { title:'状态', dataIndex:'status', width:100, render:v=>v==='done'?<StatusTag variant="on">已完成</StatusTag>:<StatusTag variant="sale">执行中</StatusTag> },
          { title:'数量', dataIndex:'total', width:80, align:'right' },
          { title:'成功', dataIndex:'success', width:80, align:'right' },
          { title:'跳过', dataIndex:'skipped', width:80, align:'right' },
          { title:'失败', dataIndex:'errors', width:80, align:'right', render:v=><span style={{color:v?'#DC2626':'#9CA3AF'}}>{v}</span> },
        ]}
        dataSource={waves} />
    </div>
  );
  return (
    <Card style={CARD_STYLE}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:16,marginBottom:18}}>
        <div>
          <div style={{fontSize:20,fontWeight:700,marginBottom:6}}>商品调价处理</div>
          <div style={{color:'#6B7280',fontSize:13}}>向导式三步：<strong>分波筛选 → 勾选本波商品 → 执行本波</strong>。系统算出建议价，运营分波筛选 + 勾选要执行的商品，<strong>执行即把价格改到建议价</strong>；不执行的保持原价。一次只处理一波，避免 C 端大面积变价。</div>
        </div>
        <Space>
          <Button icon={<InfoCircleOutlined />} onClick={()=>Modal.info({title:'改价规则说明',icon:null,width:600,centered:true,content:PRICE_RULE_NOTE})}>改价规则说明</Button>
        </Space>
      </div>

      <Steps current={currentStep} items={PT_STEP_ITEMS} style={{marginBottom:24,maxWidth:760}} />

      {currentStep===0 && <>
        <div className="lp-section">① 分波筛选 · 整体概况</div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12,marginBottom:14}}>
          <Kpi num={String(kTotal)} label="待调价总数" numStyle={{color:'#7C3AED'}} />
          <Kpi num={String(kReady)} label="可改价" numStyle={{color:'#16A34A'}} />
          <Kpi num={String(kNochange)} label="无需改价" numStyle={{color:'#6B7280'}} />
          <Kpi num={String(kInvalid)} label="未匹配无效" numStyle={{color:'#DC2626'}} />
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12,marginBottom:20}}>
          <Kpi num={String(kGap)} label="差价不足$30" numStyle={{color:'#D97706'}} />
          <Kpi num={String(kUp)} label="涨价" numStyle={{color:'#D97706'}} />
          <Kpi num={String(kDown)} label="降价" numStyle={{color:'#16A34A'}} />
        </div>

        <div className="lp-section">筛选条件（圈出本波子集）</div>
        <Space size={12} wrap style={{marginBottom:20}}>
          <Select value={filters.brand} onChange={v=>setF('brand',v)} style={{width:150}} options={PT_BRAND_OPTS} />
          <Select value={filters.series} onChange={v=>setF('series',v)} style={{width:140}} options={PT_SERIES_OPTS} />
          <Select value={filters.category} onChange={v=>setF('category',v)} style={{width:120}} options={PT_CAT_OPTS} />
          <Select value={filters.dir} onChange={v=>setF('dir',v)} style={{width:130}} options={PT_DIR_OPTS} />
          <Select value={filters.price} onChange={v=>setF('price',v)} style={{width:150}} options={PT_PRICE_OPTS} />
          <Select value={filters.listed} onChange={v=>setF('listed',v)} style={{width:120}} options={PT_LISTED_OPTS} />
          <Input value={filters.q} onChange={e=>setF('q',e.target.value)} prefix={<SearchOutlined style={{color:'#9CA3AF'}} />} placeholder="搜索红布林商品ID/渠道商品ID/名称" style={{width:260}} allowClear />
          <Button icon={<ReloadOutlined />} onClick={()=>{setFilters({ brand:'', series:'', category:'', dir:'', price:'', listed:'', q:'' });antd.message.success('已重置筛选 (原型演示)');}}>重置</Button>
        </Space>

        <div style={{display:'flex',justifyContent:'flex-end'}}>
          <Button type="primary" size="large" icon={<SearchOutlined />} onClick={()=>setCurrentStep(1)}>查出本波商品 →</Button>
        </div>
      </>}

      {currentStep===1 && <>
        {filterRecap}
        <Space style={{marginBottom:14}}>
          <Button icon={<ReloadOutlined />} onClick={()=>setCurrentStep(0)}>返回修改筛选</Button>
        </Space>
        <div className="lp-section">② 勾选本波商品</div>
        <div className="lp-note-sm" style={{marginBottom:16}}>勾选要执行的商品（执行即把价格改到系统<strong>建议价 B</strong>）；<strong>无需改价 / 差价不足$30 / 未匹配无效</strong> 行不可勾选（已在「分类」列标注原因）。TRR 比对为纯信息、不阻断。已勾选 <strong style={{color:'#7C3AED'}}>{selectedKeys.length}</strong> 行（均为可改价）。</div>
        <Table rowKey="id" pagination={false} styles={TABLE_STYLES} scroll={{x:'max-content'}}
          rowSelection={{ selectedRowKeys:selectedKeys, onChange:setSelectedKeys, getCheckboxProps:(r)=>({ disabled: executed.has(r.id) || r.cls!=='ready' }) }}
          columns={priceColumns}
          dataSource={rows}
        />
        <CompactPagination total={rows.length} pageSize={10} />
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:20}}>
          <Button onClick={()=>setCurrentStep(0)}>← 上一步</Button>
          <Space>
            {!selectedReady && <span style={{color:'#D97706',fontSize:12}}>请至少勾选 1 件可改价商品</span>}
            <Button type="primary" disabled={!selectedReady} onClick={()=>setCurrentStep(2)}>下一步：执行本波 →</Button>
          </Space>
        </div>
      </>}

      {currentStep===2 && <>
        {filterRecap}
        <div className="lp-section">③ 执行本波 · 复核</div>

        {doneWave ? (
          <Alert type="success" showIcon style={{marginBottom:16}}
            message={'本波 '+doneWave+' 已执行完成'}
            description={<span>已改价商品标记「已改价」并移出可选，已记入波次历史。<Button type="primary" size="small" style={{marginLeft:8}} onClick={nextWave}>处理下一波 →</Button></span>}
          />
        ) : <>
          <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12,marginBottom:14}}>
            <Kpi num={String(execRows.length)} label="本波数量" numStyle={{color:'#7C3AED'}} />
            <Kpi num={String(upC)} label="涨价" numStyle={{color:'#D97706'}} />
            <Kpi num={String(downC)} label="降价" numStyle={{color:'#16A34A'}} />
            <Kpi num={String(flatC)} label="价格不变(仅Cost)" numStyle={{color:'#6B7280'}} />
          </div>
          <div className="lp-note-sm" style={{marginBottom:14}}>覆盖品牌：{execBrands.join(' / ')||'—'}。「确认执行本波」= 对勾选行写入系统建议价 B（走涨价 / 降价≥$30 / 仅Cost变化的写入规则 + 回读验证）；执行后本波标记「已改价」并移出可选，其余留到下一波。</div>
          <div className="lp-section-purple" style={{fontSize:13,marginBottom:8}}>本波商品明细（只读复核 · 当前价 → 建议价 → 写入后划线价）</div>
          {execRows.length ? (
            <Table rowKey="id" size="small" pagination={false} styles={TABLE_STYLES} scroll={{x:'max-content'}} columns={detailColumns} dataSource={execRows} />
          ) : (
            <div className="lp-note-sm" style={{color:'#D97706'}}>本波暂无勾选的可改价商品。请返回第②步勾选要执行的行。</div>
          )}
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:20}}>
            <Button onClick={()=>setCurrentStep(1)}>← 上一步</Button>
            <Button type="primary" size="large" icon={<ThunderboltOutlined />} disabled={!execRows.length} onClick={doExecute}>确认执行本波（{execRows.length}）</Button>
          </div>
        </>}

        {wavesTable}
      </>}
    </Card>
  );
}

      </div>
      {importPreview && <>

function RuleEditModal({ open, rule, onClose, onSave }) {
  const [tmpl, setTmpl] = useState('B146');
  const [coef, setCoef] = useState(1.46);
  const [cons, setCons] = useState(207);
  React.useEffect(() => {
    if (rule) {
      const m = /([\d.]+)A \+ (\d+)/.exec(rule.formula || '');
      setCoef(m?Number(m[1]):1.46); setCons(m?Number(m[2]):207);
      setTmpl(rule.formula&&rule.formula.includes('1.28')?'B128':(rule.formula&&rule.formula.includes('1.22')?'B122':'B146'));
    }
  }, [rule]);
  if (!rule) return null;
  return (
    <Modal title={(rule.id?('编辑规则 — '+rule.id):'新增规则')} open={open} onCancel={onClose}
      closable={false} maskClosable={false} centered width={600}
      footer={[
        <Button key="c" onClick={onClose}>取消</Button>,
        <Button key="s" type="primary" onClick={onSave}>保存</Button>,
      ]}>
      <Alert type="info" showIcon style={{marginBottom:16}} message="规则采用受控条件 + 公式模板，不允许输入任意 JavaScript / SQL / 自由表达式" />
      <FormRow label="规则类型" required>
        <Radio.Group defaultValue={rule.type||'match'} optionType="button"
          options={[{value:'match',label:'命中即停'},{value:'branch',label:'分流'},{value:'fallback',label:'兜底'}]} />
      </FormRow>
      <div className="lp-section-purple" style={{margin:'16px 0 8px'}}>适用条件（受控）</div>
      <FormRow label="类目"><Select style={{width:'100%'}} defaultValue="bag" options={[{value:'bag',label:'包袋'},{value:'nonbag',label:'非包袋'}]} /></FormRow>
      <FormRow label="是否 Top 系列"><Select style={{width:'100%'}} defaultValue="top" options={[{value:'top',label:'Top 系列'},{value:'nontop',label:'非 Top'},{value:'any',label:'不限'}]} /></FormRow>
      <FormRow label="C（TRR）约束"><Select style={{width:'100%'}} defaultValue="haveC" options={[{value:'haveC',label:'有 C'},{value:'noC',label:'无 C'},{value:'any',label:'不限'}]} /></FormRow>
      <FormRow label="B 区间"><Space><Select defaultValue="lte" style={{width:90}} options={[{value:'lte',label:'≤'},{value:'lt',label:'<'}]} /><InputNumber defaultValue={70} addonAfter="%C" style={{width:120}} /><span style={{color:'#9CA3AF',fontSize:12}}>上界含 ≤（命中即停）</span></Space></FormRow>
      <div className="lp-section-purple" style={{margin:'16px 0 8px'}}>B 公式模板</div>
      <FormRow label="快速填充" helper="点击一套标准系数即自动填入下方「参数」的系数与常数，套用后仍可手动微调；最终以「参数」实际值为准">
        <Space wrap>
          <Button size="small" type={tmpl==='B146'?'primary':'default'} onClick={()=>{setTmpl('B146');setCoef(1.46);setCons(207);}}>B146 = ceil(1.46A + 207)</Button>
          <Button size="small" type={tmpl==='B128'?'primary':'default'} onClick={()=>{setTmpl('B128');setCoef(1.28);setCons(181);}}>B128 = ceil(1.28A + 181)</Button>
          <Button size="small" type={tmpl==='B122'?'primary':'default'} onClick={()=>{setTmpl('B122');setCoef(1.22);setCons(172);}}>B122 = ceil(1.22A + 172)</Button>
        </Space>
      </FormRow>
      <FormRow label="参数"><Space>B = ceil( <InputNumber value={coef} step={0.01} style={{width:90}} onChange={v=>setCoef(v)} /> × A + <InputNumber value={cons} style={{width:90}} onChange={v=>setCons(v)} /> )</Space></FormRow>
      <FormRow label="低价修正"><Space><Switch defaultChecked /><span style={{color:'#6B7280',fontSize:12}}>B ≤ 500 改用 B146 = ceil(1.46A+207)</span></Space></FormRow>
      <div className="lp-note-sm" style={{marginTop:12}}>A = 折扣价 / 汇率（可配置，默认 6.86，USD）；成本 A &gt; 挂牌价 B 时阻断并报定价错误</div>
    </Modal>
  );
}

function PricingRulePage({ go }) {
  const [rules, setRules] = useState(PRICING_RULES_SEED);
  const [editRule, setEditRule] = useState(null);
  const [opLog, setOpLog] = useState(PRICING_OPLOG_SEED);
  const logOp = (type, detail) => setOpLog(l => [{ i:l.length?l[0].i+1:1, at:'刚刚', who:'张运营', type, detail }, ...l]);
  const move = (idx, dir) => { const a=[...rules]; const j=idx+dir; if(j<0||j>=a.length)return; const moved=a[idx]; [a[idx],a[j]]=[a[j],a[idx]]; a.forEach((r,i)=>r.order=i+1); setRules(a); logOp('调整顺序', '规则 '+moved.id+'（'+moved.label+'）'+(dir<0?'上移':'下移')+'至第 '+(j+1)+' 位'); };
  const delRule = (r) => demoConfirm('删除规则 '+r.id+'（同一波运营操作，直接生效、无审批）', ()=>{ setRules(rs=>rs.filter(x=>x.id!==r.id)); logOp('删除规则', '删除规则 '+r.id+'（'+r.label+'）'); antd.message.success('已删除 (原型演示)'); });
  const saveRule = () => { if (editRule) { if (editRule.id) logOp('编辑规则', '编辑规则 '+editRule.id+'（'+editRule.label+'）'); else logOp('新增规则', '新增一条定价规则'); } setEditRule(null); antd.message.success('规则已保存并生效，已记录到操作记录 (原型演示)'); };
  return (
    <Card style={CARD_STYLE}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:16,marginBottom:18}}>
        <div>
          <div style={{fontSize:20,fontWeight:700,marginBottom:6}}>定价规则</div>
          <div style={{color:'#6B7280',fontSize:13}}>运营可查看 / 增改定价规则、调整命中顺序。<strong>同一波运营操作、改动直接生效、无审批发布流程</strong>，所有变更留操作记录。规则用于选品定价与「商品调价处理」的建议价计算。</div>
        </div>
        <Space>
          <Button type="primary" icon={<PlusOutlined />} onClick={()=>setEditRule({})}>新增规则</Button>
          <Button onClick={()=>go('trr')}>查看 TRR 参考价</Button>
        </Space>
      </div>

      <div className="lp-section">规则顺序（命中即停 · 从上到下逐条匹配 · 最后一条兜底）</div>
      <div className="lp-note-sm" style={{marginBottom:12}}>
        <strong>规则从上到下逐条匹配、命中即停；行的上下位置即匹配顺序，用「操作」列 ↑ ↓ 调整。</strong><br/>
        <span style={{display:'inline-block',marginTop:6}}><StatusTag variant="off">分流</StatusTag>顶层按 类目 / 是否 Top / 有无 TRR(C) 把商品路由到公式支路（如 包袋·非Top / 无C / 宝格丽 → 公式6，非包袋 → 固定 B146），不参与区间比较</span><br/>
        <span style={{display:'inline-block',marginTop:4}}><StatusTag variant="sale">命中即停</StatusTag>在「包袋 · Top · 有C」支路内，从 公式3 → 1 → 2 → 4 → 5 逐条判断 B 落在哪个 C 区间，命中即停</span><br/>
        <span style={{display:'inline-block',marginTop:4}}><StatusTag variant="pending">兜底</StatusTag>有序序列的最后一条（公式7），前面都不命中时用</span>
      </div>
      <Table rowKey="id" pagination={false} styles={TABLE_STYLES} style={{marginBottom:24}}
        columns={[
          { title:'规则ID', dataIndex:'id', width:90, render:v=><span className="lp-code">{v}</span> },
          { title:'规则名称', dataIndex:'label', width:110, render:v=><strong>{v}</strong> },
          { title:'适用条件', dataIndex:'cond', width:260 },
          { title:'B 表达式', dataIndex:'formula', width:190, render:v=><span className="lp-code">{v}</span> },
          { title:'类型', dataIndex:'type', width:100, render:v=>RULE_TYPE_TAG[v] },
          { title:'操作', key:'op', width:190, fixed:'right', render:(_,r,i)=><Space size={6}><Button size="small" disabled={i===0} onClick={()=>move(i,-1)}>↑</Button><Button size="small" disabled={i===rules.length-1} onClick={()=>move(i,1)}>↓</Button><Button size="small" onClick={()=>setEditRule(r)}>编辑</Button><Button size="small" danger onClick={()=>delRule(r)}>删除</Button></Space> },
        ]}
        dataSource={rules} />

      <div className="lp-note" style={{marginBottom:24}}>
        <strong>全局规则（不随单条规则）：</strong><br/>
        A = 折扣价 / 汇率（可配置，默认 6.86，USD）；B146=ceil(1.46A+207)、B128=ceil(1.28A+181)、B122=ceil(1.22A+172)<br/>
        低价修正：公式 2/4/5/6/7 当 B ≤ 500 改用 B146；<strong>Speedy 低价例外仍不选中</strong><br/>
        成本 A &gt; 挂牌价 B（负毛利）→ 定价错误，阻断成本/价格写入与自动上架
      </div>

      <OpLog data={opLog} types={['新增规则','编辑规则','调整顺序','删除规则']} />

      <RuleEditModal open={!!editRule} rule={editRule} onClose={()=>setEditRule(null)} onSave={saveRule} />
    </Card>
  );
}

    'glossary':'翻译术语库','trr':'TRR 参考价','pricing-rule':'定价规则',
    'price-todo':'商品调价处理',
  };

  return (
    <ConfigProvider theme={looplyTheme}>
      <Layout style={{height:'100vh'}}>
        <Layout.Header style={{borderBottom:'1px solid #E5E7EB',display:'flex',alignItems:'center'}}>
          <img src={LOGO_SRC} alt="Looply" style={{height:32,display:'block'}} />
          <div style={{width:1,height:20,background:'#E5E7EB',margin:'0 16px'}} />
          <span style={{fontSize:14,fontWeight:500,color:'#6B7280'}}>商品系统 · 红布林货源</span>
          <span style={{marginLeft:'auto',color:'#9CA3AF',fontSize:13}}>商品系统 / 红布林货源 / {pageLabels[activeKey]||'—'}</span>
        </Layout.Header>
        <Layout>
          <Layout.Sider width={220} theme="light" style={SIDER_STYLE}>
            <Menu mode="inline" items={menuItems} selectedKeys={[activeKey]}
              defaultOpenKeys={['grp-plm','grp-rule']}
              style={{borderInlineEnd:'none'}}
              onClick={({key})=>{ if(!key.startsWith('grp-')) setActiveKey(key); }} />
          </Layout.Sider>
          <Layout.Content style={{padding:28,overflow:'auto'}}>
            {pages[activeKey] || <Card style={CARD_STYLE}><div>未知页面</div></Card>}
          </Layout.Content>
        </Layout>
      </Layout>
    </ConfigProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
