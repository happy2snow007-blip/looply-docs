html,body,#root{height:100%;margin:0;padding:0}

.lp-kpi .num{font-size:24px;font-weight:700;color:#7C3AED;line-height:1;margin-bottom:6px;font-variant-numeric:tabular-nums}
.lp-kpi .label{font-size:12px;color:#6B7280}
.lp-pagination{display:flex;align-items:center;justify-content:center;gap:24px;padding:12px 16px;font-size:13px;color:#6B7280}
.lp-pagination .divider{width:1px;height:20px;background:#E5E7EB}
.lp-tip-trigger{cursor:help;border-bottom:1px dashed #9CA3AF;padding-bottom:1px}
.lp-section{font-size:15px;font-weight:600;color:#1F2937;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid #E5E7EB}
.lp-section-purple{font-size:14px;font-weight:700;color:#7C3AED;margin:0 0 12px}
.lp-oplog-title{font-size:14px;font-weight:700;color:#7C3AED;margin:24px 0 12px}
.lp-empty{display:flex;flex-direction:column;align-items:center;padding:60px 20px;text-align:center}
.lp-empty .icon{font-size:48px;margin-bottom:16px;color:#9CA3AF}
.lp-empty .icon.err{color:#DC2626}
.lp-empty .title{font-size:16px;font-weight:600;color:#1F2937;margin-bottom:8px}
.lp-empty .desc{font-size:13px;color:#6B7280;margin-bottom:24px;max-width:360px}
.lp-form-row{display:flex;gap:16px;margin-bottom:12px;align-items:center}
.lp-form-row:first-of-type{margin-top:8px}
.lp-form-row .lp-form-label{width:96px;text-align:right;color:#6B7280;font-size:13px;flex-shrink:0}
.lp-form-row .lp-form-label .req{color:#DC2626;margin-right:4px}
.lp-form-row .lp-form-control{flex:1}
.lp-helper{font-size:12px;color:#9CA3AF;margin:-4px 0 12px 112px}
.lp-note{padding:14px;border-radius:10px;background:#F3EEFF;border:1px solid #DDD6FE;color:#6D28D9;font-size:12px;line-height:1.8}
.lp-note-sm{padding:10px 14px;background:#F3EEFF;border:1px solid #DDD6FE;border-radius:8px;font-size:12px;color:#6D28D9}
.lp-upload-zone{border:2px dashed #D1D5DB;border-radius:14px;padding:32px;text-align:center;background:#FAFAFA}
.lp-upload-zone .hint{font-size:13px;color:#6B7280;margin-bottom:8px}

const CARD_STYLE = { boxShadow:'0 10px 24px rgba(16,24,40,.06)', marginBottom:20 };
const TABLE_STYLES = { root:{ borderRadius:14, border:'1px solid #E5E7EB', overflow:'hidden' } };
const SIDER_STYLE = { boxShadow:'3px 0 12px rgba(0,0,0,0.06)', padding:'8px 0', overflowY:'auto', height:'100%' };

function demoAction(label) { antd.message.info({ content: label + ' (原型演示)', duration: 1.5 }); }
function demoConfirm(label, cb) { Modal.confirm({ title: '确认操作', content: '确定要' + label + '吗？', centered: true, closable: false, maskClosable: false, onOk: cb || (() => antd.message.success(label + ' 已执行 (原型演示)')) }); }
function DemoSkip({ onClick, label }) { return <div style={{textAlign:'center',marginTop:12,marginBottom:20}}><Button type="link" onClick={onClick}>{label || '跳过上传，直接查看预览效果 →'}</Button></div>; }

const TAG_COLORS = {
  on:{bg:'#F0FDF4',color:'#16A34A'}, sale:{bg:'#EFF6FF',color:'#2563EB'},
  pending:{bg:'#FFFBEB',color:'#D97706'}, off:{bg:'#F3F4F6',color:'#6B7280'},
  req:{bg:'#FEF2F2',color:'#DC2626'}, warn:{bg:'#FFF1F2',color:'#E11D48'},
};

function StatusTag({ variant, children }) {
  const c = TAG_COLORS[variant] || TAG_COLORS.off;
  return <Tag bordered={false} style={{ background:c.bg, color:c.color, borderRadius:999, padding:'2px 8px', fontSize:12, lineHeight:'18px', marginInlineEnd:4 }}>{children}</Tag>;
}
function TipText({ label, tip }) {
  return <Tooltip title={<div style={{ whiteSpace:'pre-line', lineHeight:1.6 }}>{tip}</div>} color="#fff" styles={{ body:{color:'#374151',fontSize:12,padding:'10px 14px'} }}><span className="lp-tip-trigger">{label}</span></Tooltip>;
}
function Kpi({ num, label, numStyle, onClick }) {
  return <div className="lp-kpi" style={onClick?{cursor:'pointer'}:null} onClick={onClick}><div className="label" style={{marginBottom:6}}>{label}</div><div className="num" style={numStyle}>{num}</div></div>;
}
function FormRow({ label, required, children, helper }) {
  return <><div className="lp-form-row"><div className="lp-form-label">{required && <span className="req">*</span>}{label}</div><div className="lp-form-control">{children}</div></div>{helper && <div className="lp-helper">{helper}</div>}</>;
}
function CompactPagination({ total, current=1, pageSize=10 }) {
  const tp = Math.ceil(total / pageSize) || 1;
  return <div className="lp-pagination"><span>{'共 '}{total.toLocaleString()}{' 条'}</span><div className="divider" /><span>{'第 '}{current}/{tp}{' 页'}</span></div>;
}
function EmptyZero({ entity, cta, onCta }) {
  return <div className="lp-empty"><InboxOutlined className="icon" /><div className="title">{'暂无'}{entity}</div><div className="desc">{'点击下方按钮创建第一条'}{entity}{'记录'}</div>{cta && <Button type="primary" onClick={onCta}>{cta}</Button>}</div>;
}
function EmptyNoMatch({ onClear }) {
  return <div className="lp-empty"><SearchOutlined className="icon" /><div className="title">未找到匹配结果</div><div className="desc">请尝试调整搜索关键词或筛选条件</div><Button onClick={onClear}>清除筛选条件</Button></div>;
}
function EmptyError({ onRetry }) {
  return <div className="lp-empty"><ExclamationCircleOutlined className="icon err" /><div className="title">加载失败</div><div className="desc">网络异常，请检查网络连接后重试</div><Button type="primary" onClick={onRetry}>重试</Button></div>;
}
function EmptyStateSwitcher({ mode, setMode }) {
  return <div style={{marginTop:12,display:'flex',gap:8,justifyContent:'center'}}>{[['data','正常数据'],['zero','零数据态'],['no-match','无匹配态'],['error','异常态']].map(([k,l])=><Button key={k} type={mode===k?'primary':'default'} onClick={()=>setMode(k)}>{l}</Button>)}</div>;
}

function ListPage({ title, desc, headActions, kpis, filters, columns, data, total, entity, scrollX, extraBeforeTable, extraAfterTable }) {
  const [mode, setMode] = useState('data');
  return (
    <Card style={CARD_STYLE}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:16,marginBottom:18}}>
        <div><div style={{fontSize:20,fontWeight:700,marginBottom:6}}>{title}</div>{desc && <div style={{color:'#6B7280',fontSize:13}}>{desc}</div>}</div>
        <div>{headActions}</div>
      </div>
      {kpis && <div style={{display:'grid',gridTemplateColumns:`repeat(${kpis.length},1fr)`,gap:12,marginBottom:18}}>{kpis.map((k,i)=><Kpi key={i} num={k.num} label={k.label} numStyle={k.numStyle} onClick={k.onClick} />)}</div>}
      {filters && <Space size={12} wrap style={{marginBottom:16}}>{filters}</Space>}
      {extraBeforeTable}
      {mode==='data' && <>
        <Table rowKey={r=>r.id||r.key} columns={columns} dataSource={data} pagination={false} styles={TABLE_STYLES} scroll={scrollX?{x:scrollX}:undefined} />
        <CompactPagination total={total||data.length} pageSize={10} />
      </>}
      {mode==='zero' && <EmptyZero entity={entity} />}
      {mode==='no-match' && <EmptyNoMatch onClear={()=>setMode('data')} />}
      {mode==='error' && <EmptyError onRetry={()=>setMode('data')} />}
      <EmptyStateSwitcher mode={mode} setMode={setMode} />
      {extraAfterTable}
    </Card>
  );
}

function TaskHistory({ tasks }) {
  return (
    <div style={{marginTop:24}}>
      <h4 className="lp-section">任务历史</h4>
      <Table rowKey="id" size="small" pagination={false} styles={TABLE_STYLES}
        columns={[
          { title:'任务ID', dataIndex:'id', width:100, render:v=><span className="lp-code">{v}</span> },
          { title:'创建时间', dataIndex:'createdAt', width:160 },
          { title:'状态', dataIndex:'status', width:100,
            render:v=>({ done:<StatusTag variant="on">已完成</StatusTag>, running:<StatusTag variant="sale">执行中</StatusTag>,
                         failed:<StatusTag variant="req">失败</StatusTag>, queued:<StatusTag variant="off">排队中</StatusTag> })[v] },

function FieldMappingEditModal({ open, target, onClose, onSave }) {
  const [brandVal, setBrandVal] = useState(undefined);
  const [seriesVal, setSeriesVal] = useState(undefined);
  const [categoryVal, setCategoryVal] = useState(undefined);
  React.useEffect(() => {
    if (target && target.record) {
      const r = target.record;
      setBrandVal(r.brandId ? r.targetBrand : undefined);
      setSeriesVal(r.seriesId ? r.targetSeries : undefined);
      setCategoryVal(r.categoryId ? ['bag','handbag','tote'] : undefined);

  }, [target]);
  if (!target || !target.record) return null;
  const { kind, record } = target;
  return (
    <Modal title={'编辑映射 — ' + record.sourceValue} open={open} onCancel={onClose}
      closable={false} maskClosable={false} centered width={520}

        <Button key="c" onClick={onClose}>取消</Button>,

        <FormRow label="looply 品牌" required>

/* ========== 共用：TRR 参考价 — 编辑参考价 Modal ========== */
function TrrEditModal({ open, sheet, row, onClose, onSave }) {
  const [isTop, setIsTop] = useState(true);
  const [refAvg, setRefAvg] = useState(0);
  const [avgPrice, setAvgPrice] = useState(0);
  const [sampleCount, setSampleCount] = useState(0);
  React.useEffect(() => {
    if (row) {
      setIsTop(!!row.isTop);
      const n = row.avgPrice ? Number(String(row.avgPrice).replace(/[^0-9.]/g,'')) : 0;
      setRefAvg(n); setAvgPrice(n); setSampleCount(row.sampleCount || 0);
    }
  }, [row]);
  if (!row) return null;
  return (
    <Modal title="编辑参考价" open={open} onCancel={onClose}
      closable={false} maskClosable={false} centered width={480}
      footer={[
        <Button key="c" onClick={onClose}>取消</Button>,
        <Button key="s" type="primary" onClick={onSave}>保存</Button>,
      ]}>
      <FormRow label="品牌"><span style={{fontWeight:500}}>{row.brand}</span></FormRow>
      <FormRow label="系列"><span>{row.series}</span></FormRow>
      {sheet === 'top_series' && <>
        <FormRow label="是否 Top" required>
          <Switch checked={isTop} onChange={setIsTop} checkedChildren="Top" unCheckedChildren="非Top" />
        </FormRow>
        <FormRow label="参考均价(USD)" helper="用于人工核对该系列价格水位，不参与 Top 判定逻辑">
          <InputNumber value={refAvg} onChange={setRefAvg} style={{width:'100%'}} prefix="$" min={0} />
        </FormRow>
      </>}
      {sheet === 'avg_prices' && <>
        <FormRow label="尺码"><span>{row.size}</span></FormRow>
        <FormRow label="成色"><span>{row.condition}</span></FormRow>
        <FormRow label="TRR 均价(USD)" required><InputNumber value={avgPrice} onChange={setAvgPrice} style={{width:'100%'}} prefix="$" min={0} /></FormRow>
        <FormRow label="样本数" required><InputNumber value={sampleCount} onChange={setSampleCount} style={{width:'100%'}} min={0} /></FormRow>
      </>}
    </Modal>
  );
}

            <strong>② 商品状态（自动创建后，商品系统标准态）：</strong>待销售 ⇄ 销售中 → 已售出 / 已失效。listing 创建后自动校验<strong>通过即 Active 上架、product_status 直接为「销售中」</strong>；仅校验不通过时才停留在 listing=未上架、product_status=待销售，等待异常修正<br/>
            <strong>③ 异常处理（加工 / 映射 / 上架校验，均并入本页）：</strong>点异常 KPI 快捷筛出对应商品；加工异常与上架校验异常「去修正」在弹窗补齐英文/术语后系统自动重跑并重新校验，映射异常「去映射」跳转主数据映射补 ID（映射发生在已定价之后、创建 product 之前）<br/>
            <span style={{color:'#6B7280'}}>本页为红布林快照层视图：红布林商品ID为主键、全量留底、后推覆盖。加工完成后系统按红布林<strong>款型ID</strong>对齐商品系统<strong>标品SKU</strong>（1:1，多件商品可共用同一款型ID），款型未命中时<strong>自动创建 SPU + 标品SKU</strong>（数据量大，不设人工维护页）；随后<strong>自动创建</strong> product + SKU + inventory_item(qty=1) + listing，并<strong>自动校验</strong>（中文残留 / url_slug 冲突 / 必填项 / 图片 / 挂牌价），<strong>校验通过即自动上架（listing→Active、product_status→销售中），无人工确认环节</strong>；校验不通过停留未上架 / 待销售走异常处理。原「人工确认上架」及分批上架是 Shopify 上架数量与限流约束的产物，对接自建系统后已取消。product 只存英文，中文靠红布林商品ID回溯。推送接收/幂等/重试/异常恢复由技术方案保证</span>
          </div>
        </div>
      }
    />
    <ProcessExceptionModal open={!!fixTarget} kind={fixTarget && fixTarget.kind} record={fixTarget && fixTarget.record} onClose={()=>setFixTarget(null)} onSave={resolveFix} />
    </>
  );
}

/* ========== 共用：加工异常处理 Modal（v9 挂到红布林商品库行内使用） ========== */
function ProcessExceptionModal({ open, kind, record, onClose, onSave }) {
  const [brandEn, setBrandEn] = useState('');
  const [productName, setProductName] = useState('');
  const [decision, setDecision] = useState('cap');
  React.useEffect(() => {
    if (record) { setBrandEn(record.brandEn || ''); setProductName(record.productName || ''); setDecision('cap'); }
  }, [record]);
  if (!record) return null;
  const isTrans = kind === 'trans_residual';
  return (
    <Modal title={(isTrans ? '人工修正 — ' : '人工决策 — ') + record.plmId} open={open} onCancel={onClose}
      closable={false} maskClosable={false} centered width={560}
      footer={[
        <Button key="c" onClick={onClose}>取消</Button>,
        <Button key="s" type="primary" onClick={()=>onSave(record.id)}>{isTrans ? '保存并标记通过' : '提交决策'}</Button>,
      ]}>
      {isTrans ? <>
        <div style={{marginBottom:16,color:'#6B7280',fontSize:13}}>系统自动翻译存在中文残留（术语表未覆盖的自由文本片段），请人工补齐英文译文后保存，保存后系统自动重跑加工流程</div>
        <FormRow label="红布林商品ID"><span className="lp-code">{record.plmId}</span></FormRow>
        <FormRow label="翻译后品牌" required><Input value={brandEn} onChange={e=>setBrandEn(e.target.value)} style={{width:'100%'}} /></FormRow>
        <FormRow label="Product Name" required><Input.TextArea rows={3} value={productName} onChange={e=>setProductName(e.target.value)} style={{width:'100%'}} /></FormRow>
      </> : <>
        <div style={{marginBottom:16,color:'#6B7280',fontSize:13}}>该商品定价结果超出 TRR 参考价上限，需人工决策后系统按决策自动重跑</div>
        <FormRow label="红布林商品ID"><span className="lp-code">{record.plmId}</span></FormRow>
        <FormRow label="商品名称"><span>{record.productName}</span></FormRow>
        <FormRow label="异常详情"><span style={{color:'#DC2626'}}>{record.detail}</span></FormRow>
        <FormRow label="处理决策" required>
          <Radio.Group value={decision} onChange={e=>setDecision(e.target.value)}>
            <Space direction="vertical">
              <Radio value="cap">按公式上限价挂牌</Radio>
              <Radio value="keep">维持原价（超上限继续挂牌）</Radio>
              <Radio value="off">下架（不进入销售）</Radio>
            </Space>
          </Radio.Group>
        </FormRow>
      </>}
    </Modal>
  );
}

        <strong>实体映射</strong>（品牌/系列/类目 → <strong>SPU</strong> 上的 brand_id/series_id/category_id；product 表本身只挂 standard_sku_id 外键，品牌/系列/类目经 标品SKU → SPU 回溯）与 <strong>属性映射</strong>（颜色/材质/尺码/成色/配件/包型/设计元素 → attribute_option_id/size_value_id）。红布林原始值经翻译得英文后归一到商品系统<strong>英文</strong>标准记录；标准库无对应值时走行内「申请新增标准值」补录后再映射。实体映射当前主要服务于<strong>红布林款型ID 未命中标品SKU、需自动创建 SPU</strong> 的场景：建 SPU 必须落 brand_id/series_id/category_id 三个外键，映射不齐该商品即进入「映射异常」
      </div>
      <Tabs activeKey={activeTab} onChange={t=>{setActiveTab(t);setOnlyPending(false);}} items={[
        { key:'brand', label:'品牌' },
        { key:'series', label:'系列' },
        { key:'category', label:'类目' },
        { key:'color', label:'颜色' },
        { key:'material', label:'材质' },
        { key:'size', label:'尺码' },
        { key:'condition', label:'成色' },
        { key:'accessory', label:'配件' },
        { key:'bagtype', label:'包型' },
        { key:'design', label:'设计元素' },
      ]} />

      {activeTab === 'brand' && <>
        <Space size={12} wrap style={{marginBottom:16}}>
          <Select defaultValue="" style={{width:120}} options={[{value:'',label:'全部状态'},{value:'active',label:'已激活'},{value:'pending',label:'待补充'}]} />
          <Input prefix={<SearchOutlined style={{color:'#9CA3AF'}} />} placeholder="搜索品牌名称" style={{width:200}} allowClear />
          <Button type="primary" icon={<SearchOutlined />} onClick={()=>demoAction('查询')}>查询</Button>
        </Space>
        <Table rowKey="id" pagination={false} styles={TABLE_STYLES} scroll={{x:'max-content'}}
          columns={[
            { title:'红布林原始值', dataIndex:'sourceValue', width:160, render:v=><span style={{fontWeight:500}}>{v}</span> },
            { title:'自建标准品牌', dataIndex:'targetBrand', width:160 },
            { title:<TipText label="品牌实体ID" tip="映射产物:落品牌表外键(如 B003)。英文标准名取自商品系统标准记录" />, dataIndex:'brandId', width:110, render:v=>v?<span className="lp-code">{v}</span>:<StatusTag variant="req">未映射</StatusTag> },
            { title:'状态', dataIndex:'status', width:80,
              render:v=>v==='active'?<StatusTag variant="on">已激活</StatusTag>:<StatusTag variant="pending">待补充</StatusTag> },
            { title:'更新时间', dataIndex:'updatedAt', width:140 },
            { title:'操作', width:100, render:(_,r)=><Space size={8}><a onClick={()=>setEditTarget({kind:'brand',record:r})}>编辑</a><a onClick={()=>demoConfirm('确认删除该映射？')} style={{color:'#DC2626'}}>删除</a></Space> },
          ]}
          dataSource={[
            { id:'1', sourceValue:'路易威登', targetBrand:'Louis Vuitton', brandId:'B001', brandEn:'Louis Vuitton', status:'active', updatedAt:'2026-06-10 14:30' },
            { id:'2', sourceValue:'路易·威登', targetBrand:'Louis Vuitton', brandId:'B001', brandEn:'Louis Vuitton', status:'active', updatedAt:'2026-06-10 14:30' },
            { id:'3', sourceValue:'香奈儿', targetBrand:'Chanel', brandId:'B002', brandEn:'Chanel', status:'active', updatedAt:'2026-06-10 14:30' },
            { id:'4', sourceValue:'迪奥', targetBrand:'Dior', brandId:'B003', brandEn:'Dior', status:'active', updatedAt:'2026-06-10 14:30' },
            { id:'5', sourceValue:'宝格丽', targetBrand:'Bvlgari', brandId:'B008', brandEn:'Bvlgari', status:'active', updatedAt:'2026-06-11 09:15' },
            { id:'6', sourceValue:'赛琳', targetBrand:'—', brandId:null, brandEn:'—', status:'pending', updatedAt:'2026-06-11 16:00' },
            { id:'7', sourceValue:'珑骧', targetBrand:'—', brandId:null, brandEn:'—', status:'pending', updatedAt:'2026-06-11 16:00' },
          ]}
        />
        <CompactPagination total={86} pageSize={10} />
      </>}

      {activeTab === 'category' && <>
        <Table rowKey="id" pagination={false} styles={TABLE_STYLES} scroll={{x:'max-content'}}
          columns={[
            { title:'红布林原始值', dataIndex:'sourceValue', width:180, render:v=><span style={{fontWeight:500}}>{v}</span> },
            { title:'looply 类目(L1)', dataIndex:'l1', width:100 },
            { title:'looply 类目(L2)', dataIndex:'l2', width:120 },
            { title:'looply 类目(L3)', dataIndex:'l3', width:120 },
            { title:<TipText label="类目实体ID" tip="映射产物:落类目表外键(如 C101)。英文标准名取自商品系统标准记录" />, dataIndex:'categoryId', width:110, render:v=>v?<span className="lp-code">{v}</span>:<StatusTag variant="req">未映射</StatusTag> },
            { title:'状态', dataIndex:'status', width:80,
              render:v=>v==='active'?<StatusTag variant="on">已激活</StatusTag>:<StatusTag variant="pending">待补充</StatusTag> },
            { title:'操作', width:100, render:(_,r)=><Space size={8}><a onClick={()=>setEditTarget({kind:'category',record:r})}>编辑</a><a onClick={()=>demoConfirm('确认删除？')} style={{color:'#DC2626'}}>删除</a></Space> },
          ]}
          dataSource={[
            { id:'1', sourceValue:'女包>手提包', l1:'Handbags', l2:'Tote Bag', l3:'Tote', categoryId:'C101', status:'active' },
            { id:'2', sourceValue:'女包>斜挎包', l1:'Handbags', l2:'Crossbody', l3:'Crossbody Bag', categoryId:'C102', status:'active' },
            { id:'3', sourceValue:'配饰>钱包', l1:'Accessories', l2:'Wallet', l3:'Wallet', categoryId:'C201', status:'active' },
            { id:'4', sourceValue:'珠宝>戒指', l1:'Jewelry', l2:'Ring', l3:'Ring', categoryId:'C301', status:'active' },
          ]}
        />
        <CompactPagination total={142} pageSize={10} />
      </>}

      {activeTab === 'series' && <>
        <Table rowKey="id" pagination={false} styles={TABLE_STYLES} scroll={{x:'max-content'}}
          columns={[
            { title:'红布林原始值', dataIndex:'sourceValue', width:160, render:v=><span style={{fontWeight:500}}>{v}</span> },
            { title:'关联品牌', dataIndex:'brand', width:120 },
            { title:'自建标准系列', dataIndex:'targetSeries', width:160 },
            { title:<TipText label="系列实体ID" tip="映射产物:落系列表外键(如 S001)。英文标准名取自商品系统标准记录" />, dataIndex:'seriesId', width:110, render:v=>v?<span className="lp-code">{v}</span>:<StatusTag variant="req">未映射</StatusTag> },
            { title:'状态', dataIndex:'status', width:80,
              render:v=>v==='active'?<StatusTag variant="on">已激活</StatusTag>:<StatusTag variant="pending">待补充</StatusTag> },
            { title:'操作', width:100, render:(_,r)=><Space size={8}><a onClick={()=>setEditTarget({kind:'series',record:r})}>编辑</a><a onClick={()=>demoConfirm('确认删除？')} style={{color:'#DC2626'}}>删除</a></Space> },
          ]}
          dataSource={[
            { id:'1', sourceValue:'Speedy', brand:'Louis Vuitton', targetSeries:'Speedy', seriesId:'S001', status:'active' },
            { id:'2', sourceValue:'经典翻盖包', brand:'Chanel', targetSeries:'Classic Flap', seriesId:'S023', status:'active' },
            { id:'3', sourceValue:'马鞍包', brand:'Dior', targetSeries:'Saddle', seriesId:'S045', status:'active' },
            { id:'4', sourceValue:'LOVE系列', brand:'Cartier', targetSeries:'LOVE', seriesId:'S067', status:'active' },
          ]}
        />
        <CompactPagination total={315} pageSize={10} />
      </>}

      {isAttr && <>
        <Space size={12} wrap style={{marginBottom:16}}>
          <Button type={onlyPending?'primary':'default'} danger={onlyPending} icon={<ExclamationCircleOutlined />} onClick={()=>setOnlyPending(v=>!v)}>{onlyPending?'← 返回全部':'只看未匹配'}</Button>
          <Input prefix={<SearchOutlined style={{color:'#9CA3AF'}} />} placeholder="搜索原始值 / 标准值" style={{width:220}} allowClear />
          <Button type="primary" icon={<SearchOutlined />} onClick={()=>demoAction('查询')}>查询</Button>
          <Button icon={<ReloadOutlined />} onClick={()=>demoAction('重置')}>重置</Button>
        </Space>
        <Table rowKey="id" pagination={false} styles={TABLE_STYLES} scroll={{x:'max-content'}}
          columns={[
            { title:'红布林原始值(中)', dataIndex:'sourceValue', width:160, render:v=><span style={{fontWeight:500}}>{v}</span> },
            { title:'商品系统标准值(英)', dataIndex:'std', width:180, render:v=>v||<StatusTag variant="req">未匹配</StatusTag> },
            { title:<TipText label={isAttr.target==='size_value'?'size_value_id':'attribute_option_id'} tip="映射产物：落属性选项 / 尺码值外键。标准英文值取自商品系统标准选项" />, dataIndex:'optionId', width:170, render:v=>v?<span className="lp-code">{v}</span>:<StatusTag variant="req">待映射</StatusTag> },
            { title:'状态', width:90, render:(_,r)=>r.optionId?<StatusTag variant="on">已归一</StatusTag>:<StatusTag variant="pending">未匹配</StatusTag> },
            { title:'操作', width:180, render:(_,r)=><Space size={8}><a onClick={()=>setEditTarget({kind:'attr',record:r})}>映射</a>{!r.optionId&&<a onClick={()=>demoAction('申请新增标准值')} style={{color:'#D97706'}}>申请新增标准值</a>}<a onClick={()=>demoConfirm('确认删除该映射？')} style={{color:'#DC2626'}}>删除</a></Space> },
          ]}
          dataSource={onlyPending?isAttr.rows.filter(r=>!r.optionId):isAttr.rows}
        />
        <div className="lp-note-sm" style={{marginTop:12}}>
          该字段：红布林原始值 <strong>{isAttr.totalSrc}</strong> 个 → 商品系统标准{isAttr.target==='size_value'?'尺码值':'选项'} <strong>{isAttr.totalStd}</strong> 个（多对一归一）。<span style={{color:'#7C3AED'}}>标准值为英文，映射后 product 直接落英文</span>
        </div>
        <CompactPagination total={isAttr.totalSrc} pageSize={10} />
      </>}

      <div style={{marginTop:24}}>
        <div className="lp-note">
          <strong>主数据映射说明（归一 + 落 ID · 覆盖全部结构化字段）：</strong><br/>
          红布林原始值经翻译得英文后，归一映射到<strong>商品系统标准主数据</strong>并落 ID：实体（品牌→brand_id、系列→series_id、类目→category_id），属性（颜色/材质/成色/配件/包型/设计元素→attribute_option_id、尺码→size_value_id）<br/>
          <span style={{color:'#7C3AED'}}>商品系统标准值为英文，映射后 product 直接落英文（不落中文）</span>；同一标准记录可归多个红布林原始值（深蓝/藏青/宝蓝→Blue、路易威登/路易·威登→Louis Vuitton），属于多对一归一<br/>
          <strong>流程完整性：</strong>① 映射目标依赖商品系统标准库就绪，标准库无对应值时走行内「申请新增标准值」补录后再映射；② 红布林持续推新值，未匹配→信息准备进度「映射异常」，系统定时重试 / 人工补映射；③ 存量已落库商品批量导入初始化映射<br/>
          <span style={{color:'#D97706'}}>待优化：红布林原始值→标准值的映射关系目前落在红布林对接模块；因未来不止红布林一个货源，建议商品系统补通用「来源值映射 / 别名」机制统一承载（跨模块 later）</span>
        </div>
      </div>
    </Card>

    <FieldMappingEditModal open={!!editTarget} target={editTarget} onClose={()=>setEditTarget(null)} onSave={saveMapping} />

    <Modal title="批量导入映射" open={importOpen} onCancel={closeImport}
      closable={false} maskClosable={false} centered width={560}
      footer={[
        <Button key="c" onClick={closeImport}>取消</Button>,
        <Button key="s" type="primary" onClick={()=>{closeImport();antd.message.success('导入成功 (原型演示)');}}>确认导入</Button>,
      ]}>
      <Upload.Dragger name="file" multiple={false} accept=".xlsx,.csv" beforeUpload={()=>{setImportPreview(true);return false;}} style={{marginBottom:16}}>
        <p className="ant-upload-drag-icon"><InboxOutlined style={{color:'#7C3AED'}} /></p>
        <p className="ant-upload-text">点击或拖拽 Excel/CSV 文件到此处</p>
        <p className="ant-upload-hint">支持 .xlsx / .csv 格式，单次最多 5,000 行</p>
      </Upload.Dragger>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
        <span style={{color:'#6B7280',fontSize:12}}>请按模板填写「红布林原始值 → looply 标准值」对应关系</span>
        <Button size="small" icon={<DownloadOutlined />} onClick={()=>demoConfirm('下载映射导入模板')}>下载模板</Button>
      </div>
      <div className="lp-note-sm" style={{marginBottom:16}}>
        导入规则：仅支持「红布林原始值 → looply 标准值」一一对应；相同红布林原始值以导入文件为准覆盖现有映射；looply 标准值在系统中不存在时该行导入失败，需先在对应标准数据表中新增
      </div>
      {importPreview && <>
        <h4 className="lp-section-purple" style={{fontSize:13}}>预览（前 3 行）</h4>
        <Table rowKey="row" size="small" pagination={false} styles={TABLE_STYLES}
          columns={[
            { title:'红布林原始值', dataIndex:'src', width:140 },
            { title:'looply 标准值', dataIndex:'target', width:160 },
            { title:'状态', dataIndex:'status', width:100, render:v=>v==='ok'?<StatusTag variant="on">可导入</StatusTag>:<StatusTag variant="req">未匹配</StatusTag> },
          ]}
          dataSource={[
            { row:'1', src:'圣罗兰', target:'Saint Laurent', status:'ok' },
            { row:'2', src:'思琳', target:'Celine', status:'ok' },
            { row:'3', src:'芬迪', target:'—', status:'fail' },
          ]}
        />
      </>}
    </Modal>
    </>
  );
}


/* ========== APP ========== */
function App() {
  const [activeKey, setActiveKey] = useState('product-pool');
  const go = (key) => setActiveKey(key);
  const subLabel = (text, key) => <span style={{fontWeight:activeKey===key?600:400}}>{text}</span>;

  const menuItems = [
    { key:'product-pool', icon:<DatabaseOutlined />, label:subLabel('红布林商品库','product-pool') },
    { type:'divider' },
    { key:'grp-data', icon:<SettingOutlined />, label:'数据维护', children:[
      { key:'field-mapping', icon:<SwapOutlined />, label:subLabel('主数据映射','field-mapping') },
      { key:'glossary', icon:<TranslationOutlined />, label:subLabel('翻译术语库','glossary') },
      { key:'trr', icon:<BarChartOutlined />, label:subLabel('TRR 参考价','trr') },
    ]},
    { type:'divider' },
    { key:'price-todo', icon:<DollarOutlined />, label:subLabel('价格变更商品列表','price-todo') },
  ];

  const pages = {
    'product-pool': <ProductPoolPage go={go} />,
    'field-mapping': <FieldMappingPage go={go} />,
    'glossary': <GlossaryPage go={go} />,
    'trr': <TrrPage go={go} />,
    'price-todo': <PriceTodoInner go={go} />,
  };

  const pageLabels = {
    'product-pool':'红布林商品库','field-mapping':'主数据映射',
    'glossary':'翻译术语库','trr':'TRR 参考价',
    'price-todo':'价格变更商品列表',
  };

  return (
    <ConfigProvider theme={looplyTheme}>
      <Layout style={{height:'100vh'}}>
        <Layout.Header style={{borderBottom:'1px solid #E5E7EB',display:'flex',alignItems:'center'}}>
          <img src={LOGO_SRC} alt="Looply" style={{height:32,display:'block'}} />
          <div style={{width:1,height:20,background:'#E5E7EB',margin:'0 16px'}} />
          <span style={{fontSize:14,fontWeight:500,color:'#6B7280'}}>红布林商品对接</span>
          <span style={{marginLeft:'auto',color:'#9CA3AF',fontSize:13}}>红布林商品对接 / {pageLabels[activeKey]||'—'}</span>
        </Layout.Header>
        <Layout>
          <Layout.Sider width={220} theme="light" style={SIDER_STYLE}>
            <Menu mode="inline" items={menuItems} selectedKeys={[activeKey]}
              defaultOpenKeys={['grp-data']}
              style={{borderInlineEnd:'none'}}
              onClick={({key})=>{ if(!key.startsWith('grp-')) setActiveKey(key); }} />
          </Layout.Sider>
          <Layout.Content style={{padding:28,overflow:'auto'}}>
            {pages[activeKey] || <Card style={CARD_STYLE}><div>未知页面</div></Card>}
          </Layout.Content>
        </Layout>
      </Layout>
    </ConfigProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
