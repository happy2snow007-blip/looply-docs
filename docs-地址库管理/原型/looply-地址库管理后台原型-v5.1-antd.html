<title>Looply 地址库管理 后台原型 v5.1 (antd)</title>

<style>
html,body,#root{height:100%;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F9FAFB;color:#1F2937}
#root::before{content:'正在加载 antd 原型……';position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#9CA3AF;font-size:14px}
#root:not(:empty)::before{display:none}
.lp-kpi{background:linear-gradient(180deg,#FEFCFF 0%,#F3EEFF 100%);border:1px solid #DDD6FE;border-radius:14px;padding:14px 16px}
.lp-kpi .num{font-size:24px;font-weight:700;color:#7C3AED;line-height:1;margin-bottom:6px;font-variant-numeric:tabular-nums}
.lp-kpi .label{font-size:12px;color:#6B7280}
.lp-pagination{display:flex;align-items:center;justify-content:center;gap:24px;padding:12px 16px;font-size:13px;color:#6B7280}
.lp-pagination .divider{width:1px;height:20px;background:#E5E7EB}
.lp-tip-trigger{cursor:help;border-bottom:1px dashed #9CA3AF;padding-bottom:1px}
.lp-note-sm{padding:10px 14px;background:#F3EEFF;border:1px solid #DDD6FE;border-radius:8px;font-size:12px;color:#6D28D9}
.lp-section{font-size:15px;font-weight:600;color:#1F2937;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid #E5E7EB}
.lp-oplog-title{font-size:14px;font-weight:700;color:#7C3AED;margin:24px 0 12px}
.lp-empty{display:flex;flex-direction:column;align-items:center;padding:60px 20px;text-align:center}
.lp-empty .icon{font-size:48px;margin-bottom:16px;color:#9CA3AF}
.lp-empty .icon.err{color:#DC2626}
.lp-empty .title{font-size:16px;font-weight:600;color:#1F2937;margin-bottom:8px}
.lp-empty .desc{font-size:13px;color:#6B7280;margin-bottom:24px;max-width:360px}
.lp-form-row{display:flex;gap:16px;margin-bottom:12px;align-items:center}
.lp-form-row:first-of-type{margin-top:8px}
.lp-form-row .lp-form-label{width:120px;text-align:right;color:#6B7280;font-size:13px;flex-shrink:0}
.lp-form-row .lp-form-label .req{color:#DC2626;margin-right:4px}
.lp-form-row .lp-form-control{flex:1}
.lp-detail{display:grid;grid-template-columns:120px 1fr;gap:10px 16px;font-size:13px;margin-bottom:24px}
.lp-detail .dl{color:#6B7280}
.lp-detail .dv{color:#1F2937}
.lp-code{font-family:Menlo,Monaco,Consolas,monospace;font-size:12px;color:#374151;background:#F3F4F6;padding:1px 6px;border-radius:4px}
.lp-drag-handle{cursor:grab;color:#BFBFBF;font-size:16px;padding:0 4px;display:inline-flex;align-items:center;transition:color .15s}
.lp-drag-handle:hover{color:#7C3AED}
.lp-drag-handle:active{cursor:grabbing}
.lp-row-dragging td{background:#F3EEFF !important}
.lp-row-dragging{opacity:.55}
.lp-row-drop-before td{box-shadow:inset 0 2px 0 0 #7C3AED}
.lp-row-drop-after td{box-shadow:inset 0 -2px 0 0 #7C3AED}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const TAG_COLORS = {
  on: {bg:'#F0FDF4',color:'#16A34A'}, sale: {bg:'#EFF6FF',color:'#2563EB'},
  pending: {bg:'#FFFBEB',color:'#D97706'}, off: {bg:'#F3F4F6',color:'#6B7280'},

};

/* ───────────── 业务组件 ───────────── */
function Kpi({ num, label }) {
  return <div className="lp-kpi"><div className="label" style={{ marginBottom:6 }}>{label}</div><div className="num">{num}</div></div>;
}
function StatusTag({ variant, children }) {
  const c = TAG_COLORS[variant] || TAG_COLORS.off;
  return <Tag bordered={false} style={{ background:c.bg, color:c.color, borderRadius:999, padding:'2px 8px', fontSize:12, lineHeight:'18px', marginInlineEnd:4 }}>{children}</Tag>;
}
function TipText({ label, tip }) {
  return (
    <Tooltip title={<div style={{ whiteSpace:'pre-line', lineHeight:1.6 }}>{tip}</div>} color="#fff"
      styles={{ body: { color:'#374151', fontSize:12, padding:'10px 14px', maxWidth:280 } }}>
      <span className="lp-tip-trigger">{label}</span>
    </Tooltip>
  );
}
function CompactPagination({ total, current=1, pageSize=10, totalPages }) {
  const pages = useMemo(() => {
    const tp = totalPages || Math.ceil(total / pageSize) || 1;
    const out = [{ k:'prev', label:'<', disabled:current===1, arrow:true }];
    if (tp <= 6) for (let i=1; i<=tp; i++) out.push({ k:i, label:i });
    else { out.push({k:1,label:1}); out.push({k:2,label:2}); out.push({k:3,label:3}); out.push({k:'gap',label:'…',disabled:true}); out.push({k:tp,label:tp}); }
    out.push({ k:'next', label:'>', disabled:current===tp, arrow:true });
    return out;
  }, [current, totalPages, total, pageSize]);
  const tp = totalPages || Math.ceil(total / pageSize) || 1;
  return (
    <div className="lp-pagination">
      <span>共 {total.toLocaleString()} 条,每页{' '}
        <Select size="small" value={pageSize} style={{ width:72, marginInline:4 }}
          options={[{value:10,label:10},{value:20,label:20},{value:50,label:50}]} />{' '}条</span>
      <div className="divider" />
      <Space size={2}>
        {pages.map(p => (
          <span key={p.k} style={{ minWidth:32, height:32, display:'inline-flex', alignItems:'center', justifyContent:'center',
            borderRadius:8, fontSize:13, cursor:p.disabled?'default':'pointer',
            background:p.k===current?'#7C3AED':(p.arrow?'#fff':'transparent'),
            color:p.k===current?'#fff':'#374151', border:p.arrow?'1px solid #E5E7EB':'none',
            fontWeight:p.k===current?600:400, opacity:p.disabled?0.35:1 }}>{p.label}</span>
        ))}
      </Space>
      <div className="divider" />
      <span>第 {current}/{tp.toLocaleString()} 页</span>
    </div>
  );
}
function EmptyZero({ entity, cta, onCta }) {
  return <div className="lp-empty"><InboxOutlined className="icon" /><div className="title">暂无{entity}</div>
    <div className="desc">点击下方按钮创建第一个{entity}</div>{cta && <Button type="primary" onClick={onCta}>{cta}</Button>}</div>;
}
function EmptyNoMatch({ onClear }) {
  return <div className="lp-empty"><SearchOutlined className="icon" /><div className="title">未找到匹配结果</div>
    <div className="desc">请尝试调整搜索关键词或筛选条件</div><Button onClick={onClear}>清除筛选条件</Button></div>;
}
function EmptyError({ onRetry }) {
  return <div className="lp-empty"><ExclamationCircleOutlined className="icon err" /><div className="title">加载失败</div>
    <div className="desc">网络异常,请检查网络连接后重试</div><Button type="primary" onClick={onRetry}>重试</Button></div>;
}
function EmptyStateSwitcher({ mode, setMode }) {
  return (
    <div style={{ marginTop:12, display:'flex', gap:8, justifyContent:'center' }}>
      {[['data','正常数据'],['zero','零数据态'],['no-match','无匹配态'],['error','异常态']].map(([k, label]) =>
        <Button key={k} type={mode===k?'primary':'default'} onClick={() => setMode(k)}>{label}</Button>)}
    </div>
  );
}
function FormRow({ label, required, children, helper }) {
  return (
    <>
      <div className="lp-form-row">
        <div className="lp-form-label">{required && <span className="req">*</span>}{label}</div>
        <div className="lp-form-control">{children}</div>
      </div>
      {helper && <div style={{ fontSize:12, color:'#9CA3AF', margin:'-4px 0 12px 136px' }}>{helper}</div>}
    </>
  );
}
function OpLog({ data, total }) {
  return (
    <>
      <div className="lp-oplog-title">操作记录</div>
      <Space size={8} wrap style={{ marginBottom:12 }}>
        <Select size="small" defaultValue="" style={{ width:130 }} options={[{value:'',label:'全部操作类型'},...['创建','编辑','启用','停用'].map(x=>({value:x,label:x}))]} />
        <Select size="small" defaultValue="" style={{ width:170 }} options={[{value:'',label:'全部操作人'},{value:'a',label:'admin@looply.com'}]} />
        <antd.DatePicker.RangePicker size="small" placeholder={['开始日期','结束日期']} />
        <Button size="small" icon={<SearchOutlined />}>查询</Button>
      </Space>
      <Table size="small" rowKey="i" pagination={false} styles={TABLE_STYLES}
        columns={[
          { title:'操作时间', dataIndex:'at' }, { title:'操作人', dataIndex:'who' },
          { title:'操作类型', dataIndex:'type', render:v => <StatusTag variant={v==='编辑'?'pending':'on'}>{v}</StatusTag> },
          { title:'操作内容', dataIndex:'detail' },
        ]} dataSource={data} />
      <CompactPagination total={total || data.length} pageSize={10} />
    </>
  );
}

function CountryConfigEditPage({ go, onI18n }) {
  const levelOpts = ['L1','L2','L3','L4','L5'].map(x => ({ value:x, label:x }));
  const [fields, setFields] = useState(ADDR_FIELDS);
  const [dragKey, setDragKey] = useState(null);   // 正在拖拽的字段 name
  const [overInfo, setOverInfo] = useState(null);  // { key, pos:'before'|'after' }
  const handlePressed = React.useRef(false);       // 仅允许从手柄发起拖拽

  const moveField = (fromKey, toKey, pos) => {
    if (fromKey === toKey) return;
    setFields(prev => {
      const list = prev.slice();
      const from = list.findIndex(f => f.name === fromKey);
      const [moved] = list.splice(from, 1);
      let to = list.findIndex(f => f.name === toKey);
      if (pos === 'after') to += 1;
      list.splice(to, 0, moved);
      return list;
    });
  };

  const columns = [
    { title:'', dataIndex:'drag', width:44, align:'center',
      render:(_, r) => <span className="lp-drag-handle" title="拖拽调整顺序"
        onMouseDown={() => { handlePressed.current = true; }}><HolderOutlined /></span> },
    { title:'字段名', dataIndex:'name', render:(v, r) => <span><b>{v}</b>{r.reserved && <span style={{ fontSize:11, color:'#9CA3AF', marginLeft:6 }}>{r.reserved}</span>}</span> },
    { title:<TipText label="启用状态" tip="停用后该字段不会出现在前端地址表单中,已保存的历史地址不受影响" />, dataIndex:'on', width:110, align:'center', render:v => <Switch size="small" defaultChecked={v} /> },
    { title:<TipText label="排序" tip="拖拽左侧手柄调整字段在前端地址表单中的展示顺序,序号自动更新" />, dataIndex:'order', width:80, align:'center',
      render:(_, r, idx) => <span style={{ color:'#6B7280', fontVariantNumeric:'tabular-nums' }}>{idx + 1}</span> },
    { title:<TipText label="行政区划层级" tip={'关联行政区划数据层级,仅 state_province/city/district 字段支持配置。\nL1=州/省  L2=市  L3=区/县  L4/L5=更细粒度'} />, dataIndex:'level', width:140,
      render:v => v ? <Select size="small" defaultValue={v} style={{ width:80 }} options={levelOpts} /> : <span style={{ color:'#9CA3AF' }}>—</span> },
    { title:'国际化文案', key:'i18n', width:90, render:(_, r) => <Button size="small" onClick={() => onI18n(r.name)}>查看</Button> },
  ];

  const reset = () => { handlePressed.current = false; setDragKey(null); setOverInfo(null); };

  const onRow = (r) => ({
    draggable: true,
    className: [
      dragKey === r.name ? 'lp-row-dragging' : '',
      overInfo && overInfo.key === r.name && dragKey !== r.name ? ('lp-row-drop-' + overInfo.pos) : '',
    ].filter(Boolean).join(' ') || undefined,
    style: r.reserved ? { background:'#F9FAFB' } : undefined,
    onDragStart: (e) => {
      if (!handlePressed.current) { e.preventDefault(); return; }  // 仅手柄可拖
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', r.name);
      setDragKey(r.name);
    },
    onDragOver: (e) => {
      if (!dragKey) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const rect = e.currentTarget.getBoundingClientRect();
      const pos = (e.clientY - rect.top) < rect.height / 2 ? 'before' : 'after';
      setOverInfo(prev => (prev && prev.key === r.name && prev.pos === pos) ? prev : { key:r.name, pos });
    },
    onDrop: (e) => {
      e.preventDefault();
      if (dragKey && overInfo) moveField(dragKey, overInfo.key, overInfo.pos);
      reset();
    },
    onDragEnd: reset,
  });

  return (
    <Card style={CARD_STYLE}>
      <PageHead title="编辑国家地址配置 — US 美国" desc="配置美国地区的地址表单字段展示规则。" onBack={() => go('country-config')} />
      <h4 className="lp-section">基本配置</h4>
      <FormRow label="国家代码"><Input value="US" disabled style={{ width:200 }} /></FormRow>
      <FormRow label="国家名称"><Input value="美国" disabled style={{ width:200 }} /></FormRow>
      <FormRow label="启用状态"><Select defaultValue="启用" style={{ width:160 }} options={[{value:'启用',label:'启用'},{value:'停用',label:'停用'}]} /></FormRow>

      <h4 className="lp-section" style={{ marginTop:28 }}>前端展示字段</h4>
      <div style={{ fontSize:12, color:'#6B7280', margin:'-4px 0 12px' }}>拖拽左侧 <HolderOutlined style={{ color:'#9CA3AF' }} /> 手柄可调整字段展示顺序。修改后需同步更新前端翻译文件。</div>
      <Table size="small" rowKey="name" pagination={false} styles={TABLE_STYLES} columns={columns} dataSource={fields} onRow={onRow} />

      <div style={{ display:'flex', justifyContent:'flex-end', gap:12, padding:'16px 0', borderTop:'1px solid #E5E7EB', marginTop:24 }}>
        <Button onClick={() => go('country-config')}>取消</Button>
        <Button type="primary" onClick={() => go('country-config')}>保存</Button>
      </div>
      <OpLog total={3} data={[
        { i:1, at:'2026-05-17 10:00', who:'admin@looply.com', type:'编辑', detail:'调整字段顺序:phone 移至最后一位' },
        { i:2, at:'2026-05-17 09:30', who:'admin@looply.com', type:'编辑', detail:'更新 first_name / last_name / address_line1 字段国际化文案(en / es / zh)' },
        { i:3, at:'2026-04-10 16:20', who:'admin@looply.com', type:'创建', detail:'创建美国地址配置,初始化8个展示字段' },
      ]} />

  );

      {isEdit && <OpLog data={[{ i:1, at:'2026-05-03 09:00', who:'admin', type:'创建', detail:'创建配送限制规则 偏远地区 (GU/VI/AS)' }]} />}
    </Card>
  );
}

/* ───────────── i18n 文案弹窗 ───────────── */
const I18N_TRANSLATIONS = {
  first_name:{en:'First Name',es:'Nombre',zh:'名字'}, last_name:{en:'Last Name',es:'Apellido',zh:'姓氏'},
  address_line1:{en:'Street Address',es:'Dirección',zh:'街道地址'}, address_line2:{en:'Apt / Suite',es:'Apto / Suite',zh:'公寓/套房'},
  city:{en:'City',es:'Ciudad',zh:'城市'}, state_province:{en:'State',es:'Estado',zh:'州/省'},
  postal_code:{en:'ZIP Code',es:'Código Postal',zh:'邮政编码'}, phone:{en:'Phone',es:'Teléfono',zh:'电话'},
};
const I18N_LOCALES = [['en','English'],['es','Español'],['zh','中文']];
function I18nModal({ open, field, onClose }) {
  const t = (field && I18N_TRANSLATIONS[field]) || {};
  return (
    <Modal title={field ? `${field} — 国际化文案` : '国际化文案'} open={open} onCancel={onClose}
      closable={false} maskClosable={false} centered width={560}
      footer={[
        <Button key="c" onClick={onClose}>关闭</Button>,
        <Button key="g" type="primary" onClick={onClose}>前往翻译管理</Button>,
      ]}>
      <div className="lp-detail" style={{ gridTemplateColumns:'120px 1fr', marginBottom:14 }}>
        <div className="dl">国际化文案 Key</div><div className="dv"><span className="lp-code">{field ? `address.field.${field}` : '—'}</span></div>
      </div>
      <Alert type="info" showIcon style={{ marginBottom:14 }}
        message={<span>国际化文案统一在<b>翻译管理</b>模块中维护,此处仅供查看。如需修改,请前往翻译管理模块。</span>} />
      <div style={{ fontSize:13, fontWeight:600, color:'#374151', marginBottom:12 }}>当前文案</div>
      <Table size="small" rowKey="lc" pagination={false} styles={TABLE_STYLES}
        columns={[
          { title:'语种', dataIndex:'lc', width:140, render:(v, r) => <span><b>{v}</b> <span style={{ color:'#9CA3AF', fontSize:11 }}>{r.name}</span></span> },
          { title:'翻译文案', dataIndex:'val', render:v => v || <span style={{ color:'#9CA3AF' }}>—</span> },
        ]}
        dataSource={I18N_LOCALES.map(([lc, name]) => ({ lc, name, val: t[lc] }))} />
    </Modal>
  );
}

/* ───────────── 菜单 ───────────── */
const CHILDREN = [
  { key:'country-config', icon:<GlobalOutlined />, label:'国家地址配置' },
  { key:'admin-division', icon:<ApartmentOutlined />, label:'行政区划管理' },
  { key:'data-import', icon:<EnvironmentOutlined />, label:'国家邮编' },
  { key:'delivery-rules', icon:<SafetyCertificateOutlined />, label:'配送限制' },
];
const PAGE_MENU = {
  'country-config':'country-config', 'country-config-edit-us':'country-config',
  'admin-division':'admin-division', 'data-import':'data-import',
  'delivery-rules':'delivery-rules', 'delivery-rules-edit':'delivery-rules', 'delivery-rules-create':'delivery-rules',
};
const CRUMB = {
  'country-config':'地址配置 / 国家地址配置', 'country-config-edit-us':'地址配置 / 国家地址配置 / 编辑',
  'admin-division':'地址配置 / 行政区划管理', 'data-import':'地址配置 / 国家邮编',
  'delivery-rules':'地址配置 / 配送限制', 'delivery-rules-edit':'地址配置 / 配送限制 / 编辑', 'delivery-rules-create':'地址配置 / 配送限制 / 新增',
};

function App() {
  const [currentPage, setCurrentPage] = useState('country-config');
  const [i18n, setI18n] = useState({ open:false, field:null });
  const go = (key) => setCurrentPage(key);
  const onI18n = (field) => setI18n({ open:true, field });
  const activeMenu = PAGE_MENU[currentPage];
  const menuItems = [{
    key:'addr-config', icon:<SettingOutlined />, label:'地址配置',
    children: CHILDREN.map(c => ({ key:c.key, icon:c.icon,
      label:<span style={{ fontWeight: activeMenu===c.key ? 600 : 400 }}>{c.label}</span> })),
  }];

  return (
    <ConfigProvider theme={looplyTheme}>
      <Layout style={{ height:'100vh' }}>
        <Layout.Header style={{ borderBottom:'1px solid #E5E7EB', display:'flex', alignItems:'center' }}>
          <img src={LOGO_SRC} alt="Looply" style={{ height:32, display:'block' }} />
          <div style={{ width:1, height:20, background:'#E5E7EB', margin:'0 16px' }} />
          <span style={{ fontSize:14, fontWeight:500, color:'#6B7280' }}>地址库管理</span>
          <span style={{ marginLeft:'auto', color:'#9CA3AF', fontSize:13 }}>{CRUMB[currentPage]}</span>
        </Layout.Header>
        <Layout>
          <Layout.Sider width={220} theme="light" style={SIDER_STYLE}>
            <Menu mode="inline" items={menuItems} selectedKeys={[activeMenu]} defaultOpenKeys={['addr-config']}
              style={{ borderInlineEnd:'none' }} onClick={({ key }) => go(key)} />
          </Layout.Sider>
          <Layout.Content style={{ padding:28, overflow:'auto' }}>
            {currentPage==='country-config' && <CountryConfigListPage go={go} />}
            {currentPage==='country-config-edit-us' && <CountryConfigEditPage go={go} onI18n={onI18n} />}
            {currentPage==='admin-division' && <AdminDivisionListPage />}
            {currentPage==='data-import' && <DataImportListPage />}
            {currentPage==='delivery-rules' && <DeliveryRulesListPage go={go} />}
            {currentPage==='delivery-rules-edit' && <DeliveryRuleFormPage go={go} isEdit />}
            {currentPage==='delivery-rules-create' && <DeliveryRuleFormPage go={go} isEdit={false} />}
          </Layout.Content>
        </Layout>
      </Layout>
      <I18nModal open={i18n.open} field={i18n.field} onClose={() => setI18n({ open:false, field:null })} />
    </ConfigProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
