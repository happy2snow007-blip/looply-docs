  <style>
    html,body,#root{height:100%;margin:0;padding:0}*{box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F9FAFB;color:#1F2937}
    #root::before{content:'正在加载 antd 原型……';position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#9CA3AF;font-size:14px}
    #root:not(:empty)::before{display:none}
    .lp-page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:18px}
    .lp-kicker{font-size:12px;color:#7C3AED;font-weight:700;margin-bottom:5px}.lp-title{font-size:24px;line-height:1.25;font-weight:700;margin:0 0 7px;color:#111827}.lp-desc{font-size:13px;color:#6B7280;line-height:1.6;max-width:920px}
    .lp-filter{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px;padding:12px 14px;background:#fff;border:1px solid #E5E7EB;border-radius:12px}.lp-filter-label{font-size:12px;color:#6B7280}
    .lp-kpi-groups{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}.lp-kpi-group{padding:14px;background:#fff;border:1px solid #E5E7EB;border-radius:14px}.lp-kpi-group-title{font-size:13px;font-weight:700;color:#374151;margin:0 0 10px}.lp-kpi-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .lp-kpi-group.orders .lp-kpi-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.lp-kpi{background:linear-gradient(180deg,#FEFCFF 0%,#F3EEFF 100%);border:1px solid #DDD6FE;border-radius:14px;padding:14px 16px;min-height:108px}.lp-kpi .label{font-size:12px;color:#6B7280}.lp-kpi .num{font-size:24px;font-weight:700;color:#7C3AED;line-height:1;margin:12px 0 7px;font-variant-numeric:tabular-nums}.lp-kpi .meta{font-size:11px;color:#6B7280;line-height:1.45}.lp-trend{display:block;font-size:11px;font-weight:600;margin-top:5px;font-variant-numeric:tabular-nums}.lp-trend.up{color:#16A34A}.lp-trend.down{color:#DC2626}.lp-trend.flat{color:#9CA3AF}

    .lp-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.lp-chart{height:300px;width:100%}.lp-target-layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:18px}.lp-target-card{border:1px solid #DDD6FE;border-radius:14px;background:#FEFCFF;padding:18px}.lp-target-title{font-size:12px;color:#6B7280}.lp-target-main{font-size:30px;font-weight:700;color:#111827;margin:12px 0 8px;font-variant-numeric:tabular-nums}.lp-target-sub{font-size:12px;color:#6B7280;line-height:1.7}.lp-target-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.lp-target-stat{padding:10px;border-radius:10px;background:#F9FAFB;border:1px solid #E5E7EB}.lp-target-stat b{display:block;font-size:16px;color:#111827;margin-bottom:4px}.lp-target-stat span{font-size:10px;color:#6B7280}
    .lp-note{font-size:11px;color:#6B7280;line-height:1.65;margin-top:12px}.lp-down-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.lp-down-card{border:1px solid #E5E7EB;border-radius:12px;background:#fff;padding:14px}.lp-down-card b{display:block;font-size:12px;color:#111827;margin-bottom:6px}.lp-down-card p{font-size:11px;color:#6B7280;line-height:1.55;min-height:36px;margin:0 0 12px}
    .lp-tip-trigger{cursor:help;border-bottom:1px dashed #9CA3AF;padding-bottom:1px}

    .lp-after-sales .lp-kpi{min-height:96px}
    .lp-after-sales-note{margin-top:10px;font-size:12px;line-height:1.7;color:#6B7280}
    .lp-after-sales-note b{color:#374151}

    .lp-intent-node{min-width:260px;background:#FEFCFF;border-color:#DDD6FE}
    .lp-funnel{min-width:940px;gap:6px}
    .lp-funnel .lp-funnel-node{min-width:125px;padding:14px}
    .lp-funnel .lp-funnel-link{flex-basis:38px}
    .lp-funnel .lp-intent-node{min-width:230px}

    .lp-intent-branch{padding:9px;border:1px solid #E5E7EB;border-radius:9px;background:#fff}

    .lp-intent-branch .value{font-size:16px;font-weight:700;color:#111827;margin:5px 0}
    .lp-intent-branch .meta{font-size:10px;color:#6B7280;line-height:1.4}
    .lp-direction-label{font-size:9px;color:#7C3AED;line-height:1.3;margin-bottom:6px}
    @media(max-width:1000px){.lp-after-sales{grid-template-columns:1fr}.lp-funnel .lp-intent-node{min-width:220px}}

      tooltip:{trigger:'axis'},
      legend:{top:0,left:0,itemWidth:18,itemHeight:9,textStyle:{color:'#6B7280',fontSize:11}},
      grid:{left:54,right:rightYAxisName?58:22,top:48,bottom:34},
      xAxis:{type:'category',data:xAxisData,axisTick:{show:false},axisLine:{lineStyle:{color:'#D1D5DB'}},axisLabel:{color:'#6B7280',fontSize:10}},
      yAxis:rightYAxisName?[
        {type:'value',name:yAxisName,min:0,nameTextStyle:{color:'#7C3AED',fontSize:10},axisLine:{show:true,lineStyle:{color:'#7C3AED'}},axisLabel:{color:'#7C3AED',fontSize:10},splitLine:{lineStyle:{color:'#F3F4F6'}}},
        {type:'value',name:rightYAxisName,min:0,nameTextStyle:{color:'#16A34A',fontSize:10},axisLine:{show:true,lineStyle:{color:'#16A34A'}},axisLabel:{color:'#16A34A',fontSize:10},splitLine:{show:false}},
      ]:{type:'value',name:yAxisName,min:0,nameTextStyle:{color:'#9CA3AF',fontSize:10},splitLine:{lineStyle:{color:'#F3F4F6'}},axisLabel:{color:'#6B7280',fontSize:10,formatter:v=>percent?`${v}%`:v}},
      series:series.map((s,index)=>({name:s.name,type:'line',yAxisIndex:s.axisIndex||0,smooth:false,symbol:'circle',symbolSize:6,lineStyle:{width:2.5},data:s.data,markLine:index===0&&target?{silent:true,symbol:'none',label:{formatter:`目标 ${target} 单`,color:'#DC2626'},lineStyle:{color:'#DC2626',type:'dashed',width:1.5},data:[{yAxis:target}]}:undefined}))
    });
    const resize=()=>chart.resize();window.addEventListener('resize',resize);return()=>{window.removeEventListener('resize',resize);chart.dispose()};
  },[series,yAxisName,rightYAxisName,percent,target,xAxisData]);
  return <div ref={ref} className="lp-chart"/>;
}

function FunnelSection(){const node=step=><div className="lp-funnel-node"><div className="lp-step-name">{step.name}</div><div className="lp-step-value">{step.value.toLocaleString()}</div><Progress percent={summary.visitors?step.value/summary.visitors*100:0} showInfo={false} size="small"/><div className="lp-step-rate">占访问访客 {pct(step.value,summary.visitors)}</div></div>;const arrow=<div className="lp-funnel-link"><span className="lp-direction-label">经营分析方向</span><ArrowRightOutlined/></div>;return <Card style={CARD_STYLE}>
  <div className="lp-section-head"><div><h2 className="lp-section-title"><span className="lp-index">2</span>关键行为覆盖（访客维度）</h2><div className="lp-section-desc">回答“访问、看商品、产生购买意向、进入 Checkout、购买分别覆盖多少访客”；游客和登录用户均纳入统计。</div></div><StatusTag variant="sale">GA4 事件覆盖视图</StatusTag></div>
  <div style={{overflowX:'auto'}}><div className="lp-funnel">{node(funnel[0])}{arrow}{node(funnel[1])}{arrow}<div className="lp-funnel-node lp-intent-node"><div className="lp-step-name">购买意向（收藏｜加购）</div><div className="lp-step-value">{purchaseIntent.unionAvailable?purchaseIntent.unionVisitors.toLocaleString():'—'}</div><div className="lp-step-rate">{purchaseIntent.unionAvailable?`占访问访客 ${pct(purchaseIntent.unionVisitors,summary.visitors)}`:'数据不完整'}</div><div className="lp-intent-branches"><div className="lp-intent-branch"><div className="name">收藏访客</div><div className="value">{purchaseIntent.wishlistAvailable?purchaseIntent.wishlistVisitors.toLocaleString():'—'}</div><div className="meta">{purchaseIntent.wishlistAvailable?`占访问访客 ${pct(purchaseIntent.wishlistVisitors,summary.visitors)}`:'收藏事件待接入'}</div></div><div className="lp-intent-branch"><div className="name">加购访客</div><div className="value">{purchaseIntent.addToCartAvailable?purchaseIntent.addToCartVisitors.toLocaleString():'—'}</div><div className="meta">{purchaseIntent.addToCartAvailable?`占访问访客 ${pct(purchaseIntent.addToCartVisitors,summary.visitors)}`:'add_to_cart 暂无返回'}</div></div></div></div>{arrow}{node(funnel[2])}{arrow}{node(funnel[3])}</div></div>
  <div className="lp-note">箭头仅表达经营分析方向，不代表同一批访客严格按顺序完成全部步骤，不能解释为有序漏斗流失。收藏与加购并列，购买意向访客必须按同一访客标识取并集去重；购买访客不加入购买意向集合。列表页也可直接收藏，因此收藏访客不是商详访客子集，不计算“商详 → 收藏”转化率。</div>
  <div className="lp-note">购买前行为路径构成属于交易转化下钻。没有明确 Buy Now 事件或 Checkout 来源字段时，不把“无收藏／加购记录的购买”称为“商详直接购买”。</div>
  <Space style={{marginTop:14}}><Button size="small">下钻浏览与找货</Button><Button size="small">下钻购买意向</Button><Button size="small">下钻交易转化</Button></Space>
  </Card>}

function TrafficConversionComboChart(){const ref=useRef(null);useEffect(()=>{const chart=echarts.init(ref.current);chart.setOption({color:['#A78BFA','#7C3AED'],tooltip:{trigger:'axis',formatter:items=>{const visit=items.find(item=>item.seriesName==='每日访问访客');const rate=items.find(item=>item.seriesName==='每日购买转化率');return `${items[0]?.axisValue||''}<br/>${visit?.marker||''}每日访问访客　<b>${Number(visit?.value||0).toLocaleString()}</b><br/>${rate?.marker||''}每日购买转化率　<b>${Number(rate?.value||0).toFixed(2)}%</b>`}},legend:{top:0,left:0,itemWidth:18,itemHeight:9,textStyle:{color:'#6B7280',fontSize:11}},grid:{left:58,right:64,top:52,bottom:34},xAxis:{type:'category',data:dates,axisTick:{show:false},axisLine:{lineStyle:{color:'#D1D5DB'}},axisLabel:{color:'#6B7280',fontSize:10}},yAxis:[{type:'value',name:'每日访问访客数',min:0,nameTextStyle:{color:'#6D28D9',fontSize:10},axisLine:{show:true,lineStyle:{color:'#A78BFA'}},axisLabel:{color:'#6D28D9',fontSize:10},splitLine:{lineStyle:{color:'#F3F4F6'}}},{type:'value',name:'每日购买转化率',min:0,nameTextStyle:{color:'#7C3AED',fontSize:10},axisLine:{show:true,lineStyle:{color:'#7C3AED'}},axisLabel:{color:'#7C3AED',fontSize:10,formatter:value=>`${value}%`},splitLine:{show:false}}],series:[{name:'每日访问访客',type:'bar',yAxisIndex:0,data:visitorSeries,barMaxWidth:34,itemStyle:{color:'#C4B5FD',borderRadius:[4,4,0,0]}},{name:'每日购买转化率',type:'line',yAxisIndex:1,data:rateSeries,symbol:'circle',symbolSize:7,lineStyle:{width:2.5,color:'#7C3AED'},itemStyle:{color:'#7C3AED'}}]});const resize=()=>chart.resize();window.addEventListener('resize',resize);return()=>{window.removeEventListener('resize',resize);chart.dispose()}},[]);return <div ref={ref} className="lp-chart"/>}

function TrendSection(){return <Card style={CARD_STYLE}>
  <div className="lp-section-head"><div><h2 className="lp-section-title"><span className="lp-index">3</span>访问与购买转化趋势</h2><div className="lp-section-desc">流量规模发生了什么变化，购买转化效率是否同步改善？</div></div><StatusTag>{dates.length} 天 · 按日</StatusTag></div>
  <TrafficConversionComboChart/>
  <div className="lp-note">左轴柱状为每日访问访客：当日发生 page_view 的去重访客；右轴折线为每日购买转化率：当日购买访客 ÷ 当日访问访客。两轴均从 0 开始，共用日期与 Tooltip。周期购买转化率仍按周期内去重购买访客 ÷ 周期内去重访问访客计算，不能使用每日转化率的算术平均值。</div>
  </Card>}

function AfterSalesSection(){return <Card style={CARD_STYLE}>
  <div className="lp-section-head"><div><h2 className="lp-section-title">售后影响（成交订单 Cohort）</h2><div className="lp-section-desc">观察所选周期内支付成功订单，截至当前查询时间的累计退款结果；不回改上方成交发生时口径指标。</div></div><StatusTag variant="pending">订单级数据待接入</StatusTag></div>
  <div className="lp-after-sales"><Kpi label="成交订单退款数" num="—" meta="订单级支付与退款关联数据待接入" showCompare={false}/><Kpi label="成交订单退款金额" num="—" meta="订单级累计实际退款金额待接入" showCompare={false}/></div>
  <div className="lp-after-sales-note"><b>统计口径：</b>订单按支付成功时间落入所选周期；截至 <b>2026-08-03 18:09（北京时间）</b>，同一订单发生一次或多次已完成退款均只计 1 个退款订单，实际退款金额累计。后续退款会回补对应历史成交订单 Cohort，但不回改访问、购买、成交收入等 7 个核心指标。</div>
  <div className="lp-after-sales-note"><b>对比说明：</b>不同成交订单 Cohort 的退款观察成熟度不同，当前不直接展示上一周期对比；待订单系统接入统一固定观察窗口后再提供可比结果。GA4 refund 事件数与按退款日汇总的 refundAmount 仅作埋点诊断，不代替本模块指标。</div>
  <div className="lp-after-sales-action"><Button size="small" disabled title="售后明细数据暂未接入">查看售后明细</Button></div>
  </Card>}

function TargetSection(){const periodEndPurchase=targetOrderSeries[targetOrderSeries.length-1],previousEndPurchase=targetOrderSeries[targetOrderSeries.length-2]||0,target=100,avg7=(targetOrderSeries.slice(-7).reduce((a,b)=>a+b,0)/7).toFixed(1);return <Card style={CARD_STYLE}>
  <div className="lp-section-head"><div><h2 className="lp-section-title"><span className="lp-index">1</span>订单目标与趋势</h2><div className="lp-section-desc">回答“所选周期结束日的 GA4 Purchase 表现如何，离年底 100 单/天目标还有多远”；目标进度、短期均值与日趋势都以所选周期结束日为锚点。</div></div><StatusTag variant="pending">年底目标：100 单/天</StatusTag></div>
  <div className="lp-target-layout"><div className="lp-target-card"><div className="lp-target-title">周期结束日 GA4 Purchase · 8 月 2 日</div><div className="lp-target-main">{periodEndPurchase} / {target}</div><Progress percent={periodEndPurchase} status="active"/><div className="lp-target-sub">按 ecommercePurchases 计算；退款不冲减，目标完成度 {periodEndPurchase}%，距目标还差 <b>{Math.max(target-periodEndPurchase,0)} 单</b>。较前一日 {periodEndPurchase>=previousEndPurchase?'增加':'减少'} {Math.abs(periodEndPurchase-previousEndPurchase)}（{previousEndPurchase?`${Math.abs((periodEndPurchase/previousEndPurchase-1)*100).toFixed(1)}%`:'—'}）。</div><div className="lp-target-stats"><div className="lp-target-stat"><b>{avg7} 单</b><span>截至 8 月 2 日的近 7 日日均</span></div><div className="lp-target-stat"><b>{avg7}%</b><span>7 日均值目标完成度</span></div></div></div><div><LineChart yAxisName="GA4 Purchase 数" target={100} xAxisData={targetDates} series={[{name:'每日 GA4 Purchase',data:targetOrderSeries}]}/><div className="lp-note">图表以 8 月 2 日为锚点展示近 14 个自然日。8 月 2 日是本次选定周期结束日，不代表数据已经稳定；GA4 仍可能回补。Purchase 按 PRD 应在订单 paid 后触发，但尚未与支付订单逐单对账，暂不直接称为最终成交订单数。</div></div></div>
  </Card>}

function DownstreamSection(){const cards=[{id:'channel',title:'获客与渠道表现',desc:'首次来源、渠道规模、质量与分渠道漏斗'},{id:'discovery',title:'浏览与找货',desc:'推荐、搜索、类目、无结果与商详到达'},{id:'transaction',title:'购买意向与交易',desc:'收藏/加购拆分、Checkout、订单创建与支付失败'},{id:'visitor-product',title:'访客、注册用户与商品分析',desc:'访客留存、复购、登录/注册身份分层及品牌/品类/商品明细'}];return <Card style={CARD_STYLE}><div className="lp-section-head"><div><h2 className="lp-section-title"><span className="lp-index">4</span>关注与下钻</h2><div className="lp-section-desc">总览只说明哪个经营环节值得关注，不自动生成无法解释的数据结论。</div></div></div><div className="lp-down-grid">{cards.map(card=><div className="lp-down-card" key={card.id}><b>{card.title}</b><p>{card.desc}</p><Button size="small">查看详情</Button></div>)}</div></Card>}

function App(){
  const [comparison,setComparison]=useState('previous');
  const [terminalType,setTerminalType]=useState('all');
  const [appPlatform,setAppPlatform]=useState('all-app');
  const showCompare=comparison==='previous';
  const menuItems=[{key:'overview',icon:<DashboardOutlined/>,label:'数据总览'},{key:'visitors',icon:<UserOutlined/>,label:'访客与用户分析'},{key:'traffic',icon:<GlobalOutlined/>,label:'流量分析'},{key:'product',icon:<ShoppingOutlined/>,label:'商品分析'},{key:'transaction',icon:<ShoppingCartOutlined/>,label:'交易转化'}];
  return <ConfigProvider theme={looplyTheme}><Layout style={{height:'100vh'}}>
    <Layout.Header style={{borderBottom:'1px solid #E5E7EB',display:'flex',alignItems:'center'}}><img src={LOGO_SRC} alt="Looply" style={{height:32,display:'block'}}/><div style={{width:1,height:20,background:'#E5E7EB',margin:'0 16px'}}/><span style={{fontSize:14,fontWeight:600,color:'#374151'}}>C 端数据报表</span><div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:9}}><StatusTag variant="pending">GA4 自动更新版</StatusTag><StatusTag>未完成订单 / 财务对账</StatusTag><Avatar size="small" style={{background:'#EDE9FE',color:'#6D28D9'}}>PM</Avatar></div></Layout.Header>
    <Layout><Layout.Sider width={220} style={{borderRight:'1px solid #E5E7EB',paddingTop:12}}><Menu mode="inline" selectedKeys={['overview']} items={menuItems}/></Layout.Sider>
    <Layout.Content style={{padding:28,overflow:'auto'}}><div className="lp-page-head"><div><div className="lp-kicker">V1 · GA4 自动更新版</div><h1 className="lp-title">数据总览 / 经营概览</h1><div className="lp-desc">同步周期：2026-07-27 至 2026-08-02；数据读取日期：2026-08-03。</div></div><Button icon={<DownloadOutlined/>}>导出报表</Button></div>
    <div className="lp-filter"><span className="lp-filter-label">统计周期</span><DatePicker.RangePicker value={[dayjs('2026-07-27'),dayjs('2026-08-02')]} allowClear={false} disabled/><span className="lp-filter-label">对比</span><Select value={comparison} onChange={setComparison} style={{width:210}} options={[{value:'previous',label:'上一等长周期（未载入）',disabled:true},{value:'none',label:'不对比'}]}/><span className="lp-filter-label">市场</span><Select value="all" disabled style={{width:180}} options={[{value:'all',label:'全部市场（未过滤）'}]}/><span className="lp-filter-label">端类型</span><Select value={terminalType} disabled style={{width:170}} options={[{value:'all',label:'全部端（未拆分）'}]}/><Button type="primary" icon={<SearchOutlined/>} disabled>查询</Button><Button icon={<ReloadOutlined/>} onClick={()=>{setComparison('none');setTerminalType('all');setAppPlatform('all-app')}}>重置</Button></div>
    <Alert type="info" showIcon message="数据口径：GA4 Property 531542304，自动同步周期（2026-07-27—2026-08-02），100% 可用数据。访客指标为事件用户总数，包含未登录和已登录身份；GA4 Purchase 与成交收入尚未完成订单系统和财务对账。最近成功同步：2026-08-03 18:09:50（北京时间）｜后台每小时自动取数，页面每 5 分钟自动刷新。" style={{marginBottom:18}}/>
    <div className="lp-kpi-groups"><section className="lp-kpi-group"><h2 className="lp-kpi-group-title">访客规模</h2><div className="lp-kpi-grid"><Kpi label="访问访客数" num={summary.visitors.toLocaleString()} meta="GA4 page_view 用户总数；周期去重" trend={rel(summary.visitors,previous.visitors)} showCompare={showCompare}/><Kpi label="首次访问访客数" num={summary.firstVisitors.toLocaleString()} meta="GA4 first_visit 用户总数；不等于新注册用户" trend={rel(summary.firstVisitors,previous.firstVisitors)} showCompare={showCompare}/><Kpi label="购买访客数" num={summary.buyers.toLocaleString()} meta="GA4 purchase 用户总数；周期去重" trend={rel(summary.buyers,previous.buyers)} showCompare={showCompare}/><Kpi label="购买转化率" num={pct(summary.buyers,summary.visitors)} meta="purchase 用户 ÷ page_view 用户" trend={(summary.buyers/summary.visitors-previous.buyers/previous.visitors)*100} trendUnit="pp" showCompare={showCompare}/></div></section>
    <section className="lp-kpi-group orders"><h2 className="lp-kpi-group-title">交易结果（GA4 口径）</h2><div className="lp-kpi-grid"><Kpi label="GA4 Purchase 数" num={summary.orders.toLocaleString()} meta="ecommercePurchases；退款不冲减，尚未与支付订单对账" trend={rel(summary.orders,previous.orders)} showCompare={showCompare}/><Kpi label="GA4 成交客单价" num={`$${(summary.grossRevenue/summary.orders).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}`} meta="grossPurchaseRevenue ÷ ecommercePurchases；退款不回算" trend={rel(summary.grossRevenue/summary.orders,previous.grossRevenue/previous.orders)} showCompare={showCompare}/><Kpi label="GA4 成交收入" num={money(summary.grossRevenue)} meta="grossPurchaseRevenue；退款前成交金额，不等同财务 GMV" trend={rel(summary.grossRevenue,previous.grossRevenue)} showCompare={showCompare}/></div></section></div>
    <AfterSalesSection/><TargetSection/><FunnelSection/><TrendSection/><DownstreamSection/>
    </Layout.Content></Layout></Layout></ConfigProvider>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
