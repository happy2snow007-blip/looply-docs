<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Looply Shop v0.3</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #E5E7EB; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 20px 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

  .phone-shell {
    width: 390px;
    min-height: 844px;
    background: #fff;
    border-radius: 44px;
    box-shadow: 0 0 0 10px #1a1a1a, 0 30px 80px rgba(0,0,0,0.4);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* Status bar */
  .status-bar {
    height: 44px;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    font-size: 12px;
    font-weight: 600;
    flex-shrink: 0;
  }
  .status-bar .time { font-size: 15px; font-weight: 700; }
  .status-bar .icons { display: flex; gap: 6px; align-items: center; }

  /* TopBar */
  .topbar {
    height: 52px;
    background: #fff;
    border-bottom: 1px solid #F3F4F6;
    display: flex;
    align-items: center;
    padding: 0 14px;
    gap: 10px;
    flex-shrink: 0;
  }
  .topbar .logo {
    font-size: 18px;
    font-weight: 800;
    color: #7C3AED;
    letter-spacing: -0.5px;
    white-space: nowrap;
  }
  .topbar .search-box {
    flex: 1;
    height: 32px;
    background: #F3F4F6;
    border-radius: 999px;
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 6px;
    cursor: pointer;
  }
  .topbar .search-box svg { flex-shrink: 0; }
  .topbar .search-box span { font-size: 12px; color: #9CA3AF; }
  .topbar .icon-btn {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    border: none; background: none; cursor: pointer; position: relative;
  }
  .topbar .icon-btn .badge {
    position: absolute; top: 2px; right: 2px;
    width: 14px; height: 14px;
    background: #7C3AED;
    border-radius: 50%;
    font-size: 9px; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
  }

  /* Main area */
  .main-area {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  /* Left nav */
  .left-nav {
    width: 108px;
    background: #FAFAFA;
    overflow-y: auto;
    flex-shrink: 0;
    border-right: 1px solid #F3F4F6;
  }
  .left-nav::-webkit-scrollbar { display: none; }
  .nav-item {
    padding: 14px 12px;
    cursor: pointer;
    font-size: 13px;
    color: #6B7280;
    border-left: 3px solid transparent;
    transition: all 0.15s;
    line-height: 1.3;
  }
  .nav-item:active { opacity: 0.7; }
  .nav-item.active {
    background: #fff;
    border-left-color: #7C3AED;
    color: #7C3AED;
    font-weight: 700;
  }

  /* Right content */
  .right-content {
    flex: 1;
    overflow-y: auto;
    background: #fff;
  }
  .right-content::-webkit-scrollbar { display: none; }

  /* Circle section */
  .circle-section {
    padding: 10px;
  }
  .circle-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .circle-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    cursor: pointer;
  }
  .circle-item:active .circle-img { transform: scale(0.95); }
  .circle-img {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 50%;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.1s;
    border: 1px solid transparent;
  }
  .circle-img.has-img {
    background: #fff;
    border-color: #E5E7EB;
  }
  .circle-img img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 6%;
  }
  .circle-img .emoji {
    font-size: 22px;
    line-height: 1;
  }
  .circle-label {
    font-size: 11px;
    color: #374151;
    text-align: center;
    line-height: 1.3;
    max-height: 2.6em;
    overflow: hidden;
    width: 100%;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  /* Divider */
  .divider {
    height: 8px;
    background: #F9FAFB;
    flex-shrink: 0;
  }

  /* YMAL Section */
  .ymal-section {
    padding: 12px 10px;
  }
  .ymal-title {
    font-size: 13px;
    font-weight: 700;
    color: #111827;
    margin-bottom: 10px;
    letter-spacing: -0.2px;
  }
  .product-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  .product-card {
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.07);
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.1s;
  }
  .product-card:active { transform: scale(0.97); }
  .product-img-wrap {
    aspect-ratio: 1;
    background: #F8F7F5;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .product-img-wrap img {
    width: 86%;
    height: 86%;
    object-fit: contain;
  }
  .product-img-placeholder {
    width: 86%; height: 86%;
    display: flex; align-items: center; justify-content: center;
    font-size: 40px;
  }
  .product-fav {
    position: absolute;
    top: 6px; right: 6px;
    width: 26px; height: 26px;
    background: rgba(255,255,255,0.9);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
  }
  .sold-out-badge {
    position: absolute;
    top: 6px; left: 6px;
    background: rgba(255,255,255,0.92);
    border-radius: 6px;
    font-size: 9px;
    font-weight: 700;
    color: #374151;
    padding: 3px 6px;
    letter-spacing: 0.3px;
  }
  .product-info {
    padding: 7px 8px 9px;
  }
  .product-brand {
    font-size: 10px;
    font-weight: 700;
    color: #111827;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 2px;
  }
  .product-name {
    font-size: 11px;
    color: #6B7280;
    line-height: 1.3;
    margin-bottom: 5px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .product-price-row {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
  }
  .product-price {
    font-size: 13px;
    font-weight: 700;
    color: #111827;
  }
  .product-orig {
    font-size: 11px;
    color: #9CA3AF;
    text-decoration: line-through;
  }
  .discount-pill {
    background: #EDE9FE;
    color: #7C3AED;
    font-size: 9px;
    font-weight: 700;
    border-radius: 999px;
    padding: 2px 6px;
  }

  /* Bottom TabBar */
  .tabbar {
    height: 70px;
    background: #fff;
    border-top: 1px solid #F3F4F6;
    display: flex;
    align-items: stretch;
    flex-shrink: 0;
  }
  .tab-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    cursor: pointer;
    padding-bottom: 10px;
  }
  .tab-item svg { transition: transform 0.1s; }
  .tab-item:active svg { transform: scale(0.9); }
  .tab-label {
    font-size: 10px;
    color: #9CA3AF;
    font-weight: 500;
  }
  .tab-item.active .tab-label { color: #7C3AED; font-weight: 700; }
</style>
</head>
<body>
<div class="phone-shell">

  <!-- Status Bar -->
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="icons">
      <svg width="17" height="12" viewBox="0 0 17 12"><rect x="0" y="3" width="3" height="9" rx="1" fill="#111"/><rect x="4.5" y="2" width="3" height="10" rx="1" fill="#111"/><rect x="9" y="0" width="3" height="12" rx="1" fill="#111"/><rect x="13.5" y="0" width="3" height="12" rx="1" fill="#D1D5DB"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.5C10.5 2.5 12.8 3.5 14.4 5.2L15.7 3.9C13.8 1.8 11 0.5 8 0.5C5 0.5 2.2 1.8 0.3 3.9L1.6 5.2C3.2 3.5 5.5 2.5 8 2.5Z" fill="#111"/><path d="M8 5.5C9.7 5.5 11.2 6.2 12.3 7.3L13.6 6C12.2 4.6 10.2 3.8 8 3.8C5.8 3.8 3.8 4.6 2.4 6L3.7 7.3C4.8 6.2 6.3 5.5 8 5.5Z" fill="#111"/><circle cx="8" cy="10" r="1.5" fill="#111"/></svg>

  <!-- Main -->
  <div class="main-area">

  </div>

  <!-- TabBar -->
  <div class="tabbar">
    <div class="tab-item" onclick="alert('Home')">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <path d="M3 9.5L11 3l8 6.5V19a1 1 0 0 1-1 1H14v-5h-4v5H4a1 1 0 0 1-1-1V9.5z" stroke="#9CA3AF" stroke-width="1.5" fill="none"/>
      </svg>

    <div class="tab-item active">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <rect x="3" y="3" width="7" height="7" rx="1.5" fill="#7C3AED"/>
        <rect x="12" y="3" width="7" height="7" rx="1.5" stroke="#7C3AED" stroke-width="1.5" fill="none"/>
        <rect x="3" y="12" width="7" height="7" rx="1.5" stroke="#7C3AED" stroke-width="1.5" fill="none"/>
        <rect x="12" y="12" width="7" height="7" rx="1.5" stroke="#7C3AED" stroke-width="1.5" fill="none"/>
      </svg>

    </div>
    <div class="tab-item" onclick="alert('Favourites')">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <path d="M11 18.5S4 14 4 8.5a4.5 4.5 0 0 1 7-3.74A4.5 4.5 0 0 1 18 8.5c0 5.5-7 10-7 10z" stroke="#9CA3AF" stroke-width="1.5" fill="none"/>
      </svg>
      <span class="tab-label">Favourites</span>
    </div>
    <div class="tab-item" onclick="alert('Account')">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <circle cx="11" cy="8" r="3.5" stroke="#9CA3AF" stroke-width="1.5" fill="none"/>
        <path d="M4 19c0-3.31 3.13-6 7-6s7 2.69 7 6" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      </svg>
      <span class="tab-label">Account</span>
    </div>
  </div>

</div>

<script>
const NAV_ITEMS = [
  {
    id: 'bags', label: 'Bags',
    circles: [
      { name:'Shoulder Bags', emoji:'👜', color:'#EDE9FE' },
      { name:'Tote Bags',     emoji:'🛍', color:'#FCE7F3' },
      { name:'Crossbody',     emoji:'⛓', color:'#FEF3C7' },
      { name:'Mini Bags',     emoji:'💛', color:'#D1FAE5' },
      { name:'Clutches',      emoji:'💎', color:'#DBEAFE' },
      { name:'Belt Bags',     emoji:'🟡', color:'#FEE2E2' },
      { name:'Top Handle',    emoji:'🎀', color:'#F3F4F6' },
      { name:'Evening Bags',  emoji:'✨', color:'#FDF4FF' },
      { name:'Backpacks',     emoji:'🎒', color:'#ECFDF5' },
    ]
  },
  {
    id: 'brands', label: 'Brands',
    circles: [
      { name:'Chanel',         emoji:'⬛', color:'#F3F4F6' },
      { name:'Hermès',         emoji:'🟠', color:'#FEF3C7' },
      { name:'Louis Vuitton',  emoji:'🟤', color:'#FEE2E2' },
      { name:'Dior',           emoji:'🪷', color:'#FCE7F3' },
      { name:'Gucci',          emoji:'🔴', color:'#FEE2E2' },
      { name:'Prada',          emoji:'⬛', color:'#F3F4F6' },
      { name:'Bottega',        emoji:'🟫', color:'#FEF3C7' },
      { name:'Loewe',          emoji:'🟡', color:'#D1FAE5' },
    ]
  },
  {
    id: 'jewelry', label: 'Jewelry',
    circles: [
      { name:'Necklaces',  emoji:'📿', color:'#EDE9FE' },
      { name:'Rings',      emoji:'💍', color:'#FCE7F3' },
      { name:'Bracelets',  emoji:'📿', color:'#FEF3C7' },
      { name:'Earrings',   emoji:'✨', color:'#D1FAE5' },
      { name:'Sets',       emoji:'💝', color:'#DBEAFE' },
    ]
  },
  {
    id: 'watches', label: 'Watches',
    circles: [
      { name:"Women's",    emoji:'⌚', color:'#FCE7F3' },
      { name:"Men's",      emoji:'⌚', color:'#DBEAFE' },
      { name:'Rolex',      emoji:'🟢', color:'#D1FAE5' },
      { name:'Omega',      emoji:'🔵', color:'#DBEAFE' },
      { name:'Cartier',    emoji:'❤️', color:'#FEE2E2' },
    ]
  },
  {
    id: 'accessories', label: 'Accessories',
    circles: [
      { name:'Scarves',    emoji:'🧣', color:'#FCE7F3' },
      { name:'Sunglasses', emoji:'🕶', color:'#DBEAFE' },
      { name:'Belts',      emoji:'👔', color:'#FEF3C7' },
      { name:'Wallets',    emoji:'👛', color:'#EDE9FE' },
      { name:'Hats',       emoji:'🎩', color:'#D1FAE5' },
    ]
  },
  {
    id: 'electronics', label: 'Electronics',
    circles: [
      { name:'iPhones',    emoji:'📱', color:'#F3F4F6' },
      { name:'MacBooks',   emoji:'💻', color:'#DBEAFE' },
      { name:'AirPods',    emoji:'🎧', color:'#EDE9FE' },
      { name:'Cameras',    emoji:'📷', color:'#FEF3C7' },
      { name:'Gaming',     emoji:'🎮', color:'#FEE2E2' },
    ]
  },
  {
    id: 'new', label: 'New Arrivals',
    circles: [
      { name:'Shoulder Bags', emoji:'👜', color:'#EDE9FE', img:'product_imgs/c_shoulder.jpg' },
      { name:'Tote Bags',     emoji:'🛍', color:'#FCE7F3', img:'product_imgs/c_tote.jpg' },
      { name:'Crossbody',     emoji:'⛓', color:'#FEF3C7', img:'product_imgs/c_crossbody.jpg' },
      { name:'Mini Bags',     emoji:'💛', color:'#D1FAE5', img:'product_imgs/c_mini.jpg' },
      { name:'Clutches',      emoji:'💎', color:'#DBEAFE', img:'product_imgs/c_clutch.jpg' },
      { name:'Belt Bags',     emoji:'🟡', color:'#FEE2E2', img:'product_imgs/c_belt.jpg' },
      { name:'New Arrivals',  emoji:'✨', color:'#F3F4F6', img:'product_imgs/c_new.jpg' },
      { name:'Under $500',    emoji:'💰', color:'#FDF4FF', img:'product_imgs/c_sale.jpg' },
      { name:'Trending Now',  emoji:'🔥', color:'#ECFDF5', img:'product_imgs/c_trending.jpg' },
    ]
  },
  {
    id: 'under500', label: 'Under $500',
    circles: [
      { name:'Bags',        emoji:'👜', color:'#EDE9FE' },
      { name:'Jewelry',     emoji:'📿', color:'#FCE7F3' },
      { name:'Watches',     emoji:'⌚', color:'#FEF3C7' },
      { name:'Accessories', emoji:'🕶', color:'#D1FAE5' },
      { name:'Electronics', emoji:'📱', color:'#DBEAFE' },
    ]
  },
  {
    id: 'sale', label: 'On Sale',
    circles: [
      { name:'30% Off',  emoji:'🔖', color:'#FEE2E2' },
      { name:'50% Off',  emoji:'🔥', color:'#FCE7F3' },
      { name:'New Sale', emoji:'✨', color:'#EDE9FE' },
    ]
  },
];

const MOCK_PRODUCTS = [
  { brand:'HERMÈS', name:'2024 Clemence Kelly II Retourne', price:'$14,000', fav:true, img:'product_imgs/hermes.jpg' },
  { brand:'CHANEL', name:'Quilted Pearl Pouch Hobo', price:'$3,400', img:'product_imgs/chanel.jpg' },
  { brand:'CHANEL', name:'Large Denim Mood Flap Bag', price:'$4,345', orig:'$5,845', save:'Save $1,500', img:'product_imgs/chanel2.jpg' },
  { brand:'CHRISTIAN DIOR', name:'Shearling Lady Dior Small', price:'$3,300', soldOut:true, img:'product_imgs/dior.jpg' },
];

let activeNavId = NAV_ITEMS[0].id;

function renderNav() {
  const nav = document.getElementById('leftNav');
  nav.innerHTML = NAV_ITEMS.map(item => `
    <div class="nav-item ${item.id === activeNavId ? 'active' : ''}" data-id="${item.id}">
      ${item.label}
    </div>
  `).join('');
  nav.querySelectorAll('.nav-item').forEach(el => {
    el.addEventListener('click', () => {
      activeNavId = el.dataset.id;
      renderNav();
      renderContent();
    });
  });
}

function renderCircle(c) {
  const hasImg = !!c.img;
  const inner = hasImg
    ? `<img src="${c.img}" alt="${c.name}" onerror="this.parentElement.classList.remove('has-img');this.parentElement.style.background='${c.color}';this.outerHTML='<span class=\\'emoji\\'>${c.emoji}</span>'">`
    : `<span class="emoji">${c.emoji}</span>`;
  return `
    <div class="circle-item" onclick="alert('${c.name.replace(/'/g,"\\'")}')">
      <div class="circle-img ${hasImg ? 'has-img' : ''}" style="${hasImg ? '' : 'background:'+c.color}">
        ${inner}
      </div>
      <span class="circle-label">${c.name}</span>
    </div>
  `;
}

function renderProducts() {
  return MOCK_PRODUCTS.map(p => {
    const imgEl = p.img
      ? `<img src="${p.img}" alt="${p.name}">`
      : `<div class="product-img-placeholder">🛍</div>`;
    const favEl = p.fav ? `<div class="product-fav">♥</div>` : '';
    const soldEl = p.soldOut ? `<div class="sold-out-badge">SOLD OUT</div>` : '';
    const origEl = p.orig ? `<span class="product-orig">${p.orig}</span>` : '';
    const saveEl = p.save ? `<span class="discount-pill">${p.save}</span>` : '';
    return `
      <div class="product-card" onclick="alert('${p.brand}: ${p.name.replace(/'/g,"\\'")}')">
        <div class="product-img-wrap">
          ${imgEl}
          ${favEl}
          ${soldEl}
        </div>
        <div class="product-info">
          <div class="product-brand">${p.brand}</div>
          <div class="product-name">${p.name}</div>
          <div class="product-price-row">
            <span class="product-price">${p.price}</span>
            ${origEl}
            ${saveEl}
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function renderContent() {
  const activeNav = NAV_ITEMS.find(n => n.id === activeNavId);
  const rc = document.getElementById('rightContent');
  rc.scrollTop = 0;
  rc.innerHTML = `
    <div class="circle-section">
      <div class="circle-grid">
        ${activeNav.circles.map(renderCircle).join('')}
      </div>
    </div>
    <div class="divider"></div>
    <div class="ymal-section">
      <div class="ymal-title">You May Also Like</div>
      <div class="product-grid">
        ${renderProducts()}
      </div>
    </div>
    <div style="height:20px;"></div>
  `;
}

renderNav();
renderContent();
</script>
</body>
</html>
