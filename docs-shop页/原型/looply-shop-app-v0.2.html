<meta charset="UTF-8">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #E5E7EB; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

.phone {
  max-width: 390px;
  margin: 32px auto;
  background: #fff;
  min-height: 844px;
  border-radius: 44px;
  box-shadow: 0 24px 80px rgba(0,0,0,.22);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* ── Top bar ── */
.topbar {
  display: flex;
  align-items: center;
  padding: 14px 16px 10px;
  gap: 10px;
  border-bottom: 1px solid #F3F4F6;
  background: #fff;
  flex-shrink: 0;
}
.logo { font-size: 20px; font-weight: 800; color: #7C3AED; letter-spacing: -0.5px; flex-shrink: 0; }
.search-bar {
  flex: 1;
  background: #F3F4F6;
  border-radius: 20px;
  height: 36px;
  display: flex;
  align-items: center;
  padding: 0 12px;
  gap: 6px;
  color: #9CA3AF;
  font-size: 13px;
}
.search-icon { font-size: 14px; }
.topbar-icons { display: flex; gap: 14px; flex-shrink: 0; }
.topbar-icons span { font-size: 20px; cursor: pointer; }

/* ── Category tabs (top horizontal) ── */
.cat-tabs {
  display: flex;
  overflow-x: auto;
  scrollbar-width: none;
  border-bottom: 1px solid #F3F4F6;
  background: #fff;
  flex-shrink: 0;
}
.cat-tabs::-webkit-scrollbar { display: none; }
.cat-tab {
  flex-shrink: 0;
  padding: 10px 14px;
  font-size: 14px;
  color: #6B7280;
  cursor: pointer;
  white-space: nowrap;
  border-bottom: 2px solid transparent;
  transition: all .2s;
}
.cat-tab.active {
  color: #7C3AED;
  font-weight: 700;
  border-bottom-color: #7C3AED;
}

/* ── Body: left nav + right content ── */
.body {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── Left nav ── */
.left-nav {
  width: 108px;
  flex-shrink: 0;
  overflow-y: auto;
  scrollbar-width: none;
  background: #FAFAFA;
  border-right: 1px solid #F3F4F6;
}
.left-nav::-webkit-scrollbar { display: none; }
.left-item {
  padding: 13px 10px 13px 14px;
  font-size: 13px;
  color: #374151;
  cursor: pointer;
  border-left: 3px solid transparent;
  line-height: 1.35;
  transition: all .15s;
}
.left-item:hover { background: #F3EEFF; color: #7C3AED; }
.left-item.active {
  background: #fff;
  color: #7C3AED;
  font-weight: 700;
  border-left-color: #7C3AED;
}
.left-group-header {
  padding: 10px 10px 4px 14px;
  font-size: 10px;
  font-weight: 700;
  color: #9CA3AF;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  border-left: 3px solid transparent;
}

/* ── Right content ── */
.right-content {
  flex: 1;
  overflow-y: auto;
  scrollbar-width: none;
  background: #fff;
}
.right-content::-webkit-scrollbar { display: none; }

.section-title {
  font-size: 15px;
  font-weight: 700;
  color: #111827;
  padding: 14px 12px 8px;
}

/* 3-col grid for sub-collection cards */
.grid-3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  padding: 0 10px 12px;
}
.grid-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  cursor: pointer;
}
.grid-card-img {
  width: 100%;
  aspect-ratio: 1;
  border-radius: 50%;
  background: #F3F4F6;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  overflow: hidden;
  position: relative;
  box-sizing: border-box;
}
.grid-card-img.img-circle {
  background: #fff;
  border: 1px solid #E5E7EB;
}
.grid-card-img img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}
.grid-card-label {
  font-size: 11px;
  color: #374151;
  text-align: center;
  line-height: 1.3;
  padding: 0 2px;
}

/* For leaf: product grid */
.grid-product {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  padding: 0 10px 12px;
}
.product-card {
  border-radius: 10px;
  overflow: hidden;
  cursor: pointer;
  background: #fff;
  box-shadow: 0 1px 4px rgba(0,0,0,0.07);
  position: relative;
}
.product-card:active { opacity: 0.9; }
.product-img {
  width: 100%;
  aspect-ratio: 1/1;
  background: #F3F4F6;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  color: #9CA3AF;
  overflow: hidden;
  position: relative;
}
.product-img img {
  width: 86%;
  height: 86%;
  object-fit: contain;
  display: block;
}
.product-sold-out {
  position: absolute;
  top: 8px;
  left: 8px;
  background: rgba(255,255,255,0.92);
  font-size: 10px;
  font-weight: 600;
  color: #374151;
  padding: 2px 7px;
  border-radius: 20px;
}
.product-fav {
  position: absolute;
  top: 8px;
  right: 8px;
  font-size: 16px;
  line-height: 1;
  cursor: pointer;
}
.product-info { padding: 8px 8px 10px; }
.product-brand { font-size: 10px; font-weight: 700; color: #111827; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 2px; }
.product-name { font-size: 11px; color: #6B7280; line-height: 1.3; }
.product-price-row { display: flex; align-items: baseline; gap: 5px; margin-top: 5px; flex-wrap: wrap; }
.product-price { font-size: 13px; font-weight: 700; color: #111827; }
.product-original { font-size: 11px; color: #9CA3AF; text-decoration: line-through; }
.product-save { font-size: 10px; font-weight: 600; color: #7C3AED; background: #EDE9FE; padding: 1px 6px; border-radius: 10px; }

/* Also-like section */
.divider { height: 8px; background: #F9FAFB; margin: 4px 0; }

/* ── Collection list (You May Also Like variant) ── */
.coll-list {
  display: flex;
  flex-direction: column;
  padding: 0 0 16px;
}
.coll-row {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 10px 12px;
  border-bottom: 1px solid #F3F4F6;
  cursor: pointer;
  transition: background 0.15s;
  border-radius: 10px;
  margin: 0 4px;
}
.coll-row:hover { background: #F9FAFB; }
.coll-row:active { background: #F3F4F6; }
.coll-name-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.coll-name {
  font-size: 12px;
  font-weight: 600;
  color: #111827;
  line-height: 1.3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.coll-arrow {
  font-size: 12px;
  color: #9CA3AF;
  flex-shrink: 0;
  margin-left: 4px;
}
.coll-body {
  display: flex;
  gap: 6px;
  align-items: stretch;
  height: 140px;
}
.coll-cover {
  flex: 1;
  height: 100%;
  border-radius: 8px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 42px;
  min-height: 0;
}
.coll-info {
  display: none;
}
.coll-thumbs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 4px;
  flex: 1;
  height: 100%;
  flex-shrink: 0;
}
.coll-thumb {
  border-radius: 4px;
  flex-shrink: 0;
}
.brands-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  padding: 12px 14px 20px;
  gap: 0;
}
.brands-grid-item {
  padding: 10px 6px 10px 0;
  font-size: 13px;
  color: #111827;
  cursor: pointer;
  border-bottom: 1px solid #F3F4F6;
  line-height: 1.4;
}
.brands-grid-item:active { color: #7C3AED; }
.brand-back {
  padding: 12px 14px 8px;
  font-size: 12px;
  color: #7C3AED;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 4px;
}

/* ── Links list (color-coded) ── */
.links-grid {
  display: flex;
  flex-direction: column;
  padding: 8px 0 16px;
}
.links-item {
  padding: 11px 14px;
  font-size: 13px;
  color: #6B7280;
  cursor: pointer;
  border-bottom: 1px solid #F3F4F6;
  line-height: 1.4;
}
.links-item:active { background: #F3EEFF; color: #7C3AED; }

/* ── Bottom tab bar ── */
.tabbar {
  display: flex;
  border-top: 1px solid #F3F4F6;
  background: #fff;
  flex-shrink: 0;
}
.tab-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 8px 0 10px;
  font-size: 10px;
  color: #9CA3AF;
  cursor: pointer;
  gap: 3px;
}
.tab-item.active { color: #7C3AED; }
.tab-item svg { display: block; }
.tab-badge {
  position: relative;
  display: inline-block;
}
.badge {
  position: absolute;
  top: -4px;
  right: -8px;
  background: #EF4444;
  color: #fff;
  font-size: 9px;
  border-radius: 8px;
  padding: 1px 4px;
  font-weight: 700;
}
</style>

var state = {
  activeTab: 'new_arrivals',
  activeNav: 'for_you',
  activeBrand: null,  // set when drilling into a brand from brands_grid
};

// ── Render ────────────────────────────────────────────
function render() {
  var app = document.getElementById('app');
  var tabData = DATA[state.activeTab] || DATA['bags'];
  var navItem = null;
  for (var i = 0; i < tabData.nav.length; i++) {
    if (tabData.nav[i].id === state.activeNav) { navItem = tabData.nav[i]; break; }
  }
  if (!navItem) { navItem = tabData.nav[0]; state.activeNav = tabData.nav[0].id; }

  app.innerHTML = [
    renderTopbar(),
    renderCatTabs(),
    '<div class="body">',
      renderLeftNav(tabData.nav),
      renderRight(navItem, tabData),
    '</div>',
    renderTabbar(),
  ].join('');

  bindEvents();
}

function renderTopbar() {
  return '<div class="topbar">' +
    '<span class="logo">Looply</span>' +
    '<div class="search-bar"><span class="search-icon">🔍</span><span>Search bags, brands, jewelry…</span></div>' +
    '<div class="topbar-icons"><span>♡</span><span>🛍</span></div>' +
    '</div>';
}

function renderCatTabs() {
  var html = '<div class="cat-tabs">';
  for (var i = 0; i < TABS.length; i++) {
    var t = TABS[i];
    var cls = t.id === state.activeTab ? 'cat-tab active' : 'cat-tab';
    html += '<div class="' + cls + '" data-tab="' + t.id + '">' + t.label + '</div>';
  }
  html += '</div>';
  return html;
}

function renderLeftNav(navItems) {
  var html = '<div class="left-nav">';
  for (var i = 0; i < navItems.length; i++) {
    var n = navItems[i];
    var cls = n.id === state.activeNav ? 'left-item active' : 'left-item';
    html += '<div class="' + cls + '" data-nav="' + n.id + '">' + n.label + '</div>';
  }
  html += '</div>';
  return html;
}

function renderRight(navItem, tabData) {
  var html = '<div class="right-content">';

  if (navItem.type === 'brand_circles') {
    if (state.activeBrand) {
      // Level 3: brand's own collections as circles
      var brandData = BRAND_COLLECTIONS[state.activeBrand] || { children: [] };
      html += '<div class="brand-back" data-back="1">← ' + navItem.label + '</div>';
      html += '<div class="section-title">' + state.activeBrand + '</div>';
      html += '<div class="grid-3">';
      for (var bi = 0; bi < brandData.children.length; bi++) {
        var bc = brandData.children[bi];
        var bcCount = bc.count ? '<br><span style="color:#9CA3AF;font-size:10px">' + bc.count + ' items</span>' : '';
        html += '<div class="grid-card">' +
          '<div class="grid-card-img" style="background:' + randomBg(bi) + '">' + bc.emoji + '</div>' +
          '<div class="grid-card-label">' + bc.name + bcCount + '</div>' +
          '</div>';
      }
      html += '</div>';
      html += '<div class="divider"></div>';
      html += '<div class="section-title">You May Also Like</div>';
      html += renderProductGrid();
    } else {
      // Level 2: brand circles
      var brandList = tabData.brands && tabData.brands[navItem.id] ? tabData.brands[navItem.id] : [];
      html += '<div class="section-title">' + navItem.label + '</div>';
      html += '<div class="grid-3">';
      for (var i = 0; i < brandList.length; i++) {
        var br = brandList[i];
        html += '<div class="grid-card" data-brand="' + br.name + '">' +
          '<div class="grid-card-img" style="background:' + randomBg(i) + '">' + br.emoji + '</div>' +
          '<div class="grid-card-label">' + br.name + '</div>' +
          '</div>';
      }
      html += '</div>';
    }

  } else if (navItem.type === 'links') {
    var linkList2 = tabData.links && tabData.links[navItem.id] ? tabData.links[navItem.id] : [];
    html += '<div class="links-grid">';
    for (var j = 0; j < linkList2.length; j++) {
      html += '<div class="links-item">' + linkList2[j] + '</div>';
    }
    html += '</div>';

  } else if (navItem.type === 'reco') {
    // For You / New In: show 3-col sub-collection cards
    html += '<div class="section-title">For You</div>';
    html += '<div class="grid-3">';
    // 只有 New Arrivals tab 的 For You (na_for_you) 用真实包图，其他用 emoji
    var useRealImg = (navItem.id === 'na_for_you');
    var recoItems = [
      { name:'Shoulder Bags', emoji:'👜', img:'product_imgs/c_shoulder.jpg' },
      { name:'Tote Bags',     emoji:'🛍', img:'product_imgs/c_tote.jpg' },
      { name:'Crossbody',     emoji:'⛓', img:'product_imgs/c_crossbody.jpg' },
      { name:'Mini Bags',     emoji:'💛', img:'product_imgs/c_mini.jpg' },
      { name:'Clutches',      emoji:'💎', img:'product_imgs/c_clutch.jpg' },
      { name:'Belt Bags',     emoji:'🟡', img:'product_imgs/c_belt.jpg' },
      { name:'New Arrivals',  emoji:'✨', img:'product_imgs/c_new.jpg' },
      { name:'Under $500',    emoji:'💰', img:'product_imgs/c_sale.jpg' },
      { name:'Trending Now',  emoji:'🔥', img:'product_imgs/c_trending.jpg' },
    ];
    for (var i = 0; i < recoItems.length; i++) {
      var item = recoItems[i];
      var circleInner = useRealImg
        ? '<div class="grid-card-img img-circle"><img src="' + item.img + '" alt="' + item.name + '"></div>'
        : '<div class="grid-card-img" style="background:' + randomBg(i) + '">' + item.emoji + '</div>';
      html += '<div class="grid-card">' +
        circleInner +
        '<div class="grid-card-label">' + item.name + '</div>' +
        '</div>';
    }
    html += '</div>';

    html += '<div class="divider"></div>';
    html += '<div class="section-title">You May Also Like</div>';
    html += renderProductGrid();

  } else if (navItem.type === 'sub') {
    // Has child collections → show sub-collection card grid
    var subData = tabData.sub[navItem.id];
    if (subData) {
      html += '<div class="section-title">' + subData.label + '</div>';
      html += '<div class="grid-3">';
      for (var j = 0; j < subData.children.length; j++) {
        var child = subData.children[j];
        var sub = tabData.sub[child];
        if (sub) {
          html += '<div class="grid-card" data-nav="' + child + '">' +
            '<div class="grid-card-img" style="background:' + randomBg(j) + '">' + (sub.children[0] ? sub.children[0].emoji : '👜') + '</div>' +
            '<div class="grid-card-label">' + sub.label + '</div>' +
            '</div>';
        }
      }
      html += '</div>';
    }

  } else {
    // Leaf: always show circles (sub-collections or fallback "All"), then "You May Also Like"
    // ≤5 circles → collection list below; >5 circles → product grid below
    var leafData = tabData.sub[navItem.id];
    var circles = (leafData && leafData.children && leafData.children.length > 0)
      ? leafData.children
      : [{ id: navItem.id + '_all', name: 'All', emoji: '🔘', count: '' }];
    var label = (leafData && leafData.label) ? leafData.label : navItem.label;
    var useCollList = circles.length <= 5;

    html += '<div class="section-title">' + label + '</div>';
    html += '<div class="grid-3">';
    for (var k = 0; k < circles.length; k++) {
      var lc = circles[k];
      var countHtml = lc.count ? '<br><span style="color:#9CA3AF;font-size:10px">' + lc.count + ' items</span>' : '';
      html += '<div class="grid-card">' +
        '<div class="grid-card-img" style="background:' + randomBg(k) + '">' + lc.emoji + '</div>' +
        '<div class="grid-card-label">' + lc.name + countHtml + '</div>' +
        '</div>';
    }
    html += '</div>';

    html += '<div class="divider"></div>';
    html += '<div class="section-title">You May Also Like</div>';
    html += useCollList ? renderCollectionList() : renderProductGrid();
  }

  html += '</div>';
  return html;
}

function renderProductGrid() {
  var html = '<div class="grid-product">';
  for (var i = 0; i < MOCK_PRODUCTS.length; i++) {
    var p = MOCK_PRODUCTS[i];
    var imgContent = p.img
      ? '<img src="' + p.img + '" alt="' + p.brand + '" style="width:100%;height:100%;object-fit:contain;display:block">'
      : '<span style="font-size:22px;font-weight:300;color:#ccc">' + p.brand.slice(0,2).toUpperCase() + '</span>';
    var soldOutBadge = p.soldOut ? '<div class="product-sold-out">Sold Out</div>' : '';
    var favHtml = '<div class="product-fav">' + (p.fav ? '💜' : '🤍') + '</div>';
    var origHtml = p.orig ? '<span class="product-original">' + p.orig + '</span>' : '';
    var saveHtml = p.save ? '<span class="product-save">' + p.save + '</span>' : '';
    html += '<div class="product-card">' +
      '<div class="product-img" style="background:#F8F7F5">' +
        imgContent + soldOutBadge + favHtml +
      '</div>' +
      '<div class="product-info">' +
        '<div class="product-brand">' + p.brand + '</div>' +
        '<div class="product-name">' + p.name + '</div>' +
        '<div class="product-price-row">' +
          '<span class="product-price">' + p.price + '</span>' +
          origHtml +
        '</div>' +
        (saveHtml ? '<div style="margin-top:4px">' + saveHtml + '</div>' : '') +
      '</div>' +
      '</div>';
  }
  html += '</div>';
  return html;
}

var BG_COLORS = [
  '#EDE9FE','#FCE7F3','#FEF3C7','#D1FAE5','#DBEAFE','#FEE2E2',
  '#F3F4F6','#FDF4FF','#ECFDF5','#FFF7ED',
];
function randomBg(i) { return BG_COLORS[i % BG_COLORS.length]; }

// ── Events ────────────────────────────────────────────
function bindEvents() {
  // Tab clicks — reset brand drill-down
  var tabs = document.querySelectorAll('[data-tab]');
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].addEventListener('click', function(e) {
      var id = e.currentTarget.getAttribute('data-tab');
      state.activeTab = id;
      state.activeBrand = null;
      var d = DATA[id];
      state.activeNav = d && d.nav && d.nav.length > 0 ? d.nav[0].id : 'for_you';
      render();
    });
  }

  // Left nav clicks — reset brand drill-down
  var navItems = document.querySelectorAll('[data-nav]');
  for (var j = 0; j < navItems.length; j++) {
    navItems[j].addEventListener('click', function(e) {
      var id = e.currentTarget.getAttribute('data-nav');
      state.activeNav = id;
      state.activeBrand = null;
      render();
    });
  }

  // Brand name clicks (level 2 → level 3)
  var brandItems = document.querySelectorAll('[data-brand]');
  for (var k = 0; k < brandItems.length; k++) {
    brandItems[k].addEventListener('click', function(e) {
      state.activeBrand = e.currentTarget.getAttribute('data-brand');
      render();
    });
  }

  // Back button in brand drill-down
  var backBtn = document.querySelector('[data-back]');
  if (backBtn) {
    backBtn.addEventListener('click', function() {
      state.activeBrand = null;
      render();
    });
  }
}
