<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Looply · Shop App v0.1</title>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/dayjs.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/antd@6.4.3/dist/antd.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/@ant-design/icons@6.2.1/dist/index.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.28.4/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#E5E7EB;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:24px 0;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
#root{width:390px}
.phone-shell{max-width:390px;margin:0 auto;background:#fff;min-height:100vh;box-shadow:0 0 40px rgba(0,0,0,.12);overflow:hidden}
/* Nav */
.nav-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;background:#fff;position:sticky;top:0;z-index:100;border-bottom:1px solid #F3F4F6}
.logo{font-size:20px;font-weight:700;color:#7C3AED;letter-spacing:-0.5px}
.nav-icon{width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#1F2937;position:relative}
.cart-badge{position:absolute;top:4px;right:4px;width:16px;height:16px;background:#7C3AED;border-radius:50%;font-size:9px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
/* Search */
.search-wrap{padding:10px 16px 12px;background:#fff}
.search-box{display:flex;align-items:center;gap:8px;background:#F3F4F6;border-radius:10px;padding:9px 14px;cursor:text}
.search-box svg{color:#9CA3AF;flex-shrink:0}
.search-placeholder{color:#9CA3AF;font-size:14px}
/* Brand rail */
.section-label{font-size:13px;font-weight:600;color:#1F2937;padding:0 16px 10px;letter-spacing:0.2px}
.brand-rail{overflow-x:auto;padding:0 16px 16px;display:flex;gap:16px;scrollbar-width:none}
.brand-rail::-webkit-scrollbar{display:none}
.brand-item{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;flex-shrink:0}
.brand-avatar{width:64px;height:64px;border-radius:50%;background:#F3F4F6;display:flex;align-items:center;justify-content:center;font-size:11px;color:#9CA3AF;text-align:center;border:1.5px solid transparent;transition:border-color .15s}
.brand-item:active .brand-avatar{border-color:#C4B5FD}
.brand-name{font-size:11px;color:#374151;text-align:center;max-width:64px;line-height:1.3;font-weight:500}
.brand-viewall .brand-avatar{background:#1F2937;color:#fff;font-size:10px;font-weight:600}
/* Category list */
.section-divider{height:8px;background:#F9FAFB}
.cat-section{padding:4px 0 0}
.cat-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #F3F4F6;cursor:pointer;background:#fff;transition:background .1s}
.cat-row:active{background:#FAFAFA}
.cat-thumb{width:56px;height:56px;border-radius:8px;background:#F9FAFB;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#D1D5DB;font-size:20px}
.cat-info{flex:1;min-width:0}
.cat-name{font-size:15px;font-weight:600;color:#1F2937;line-height:1.3}
.cat-sub-hint{font-size:12px;color:#9CA3AF;margin-top:2px}
.cat-arrow{color:#D1D5DB;font-size:14px;transition:color .15s}
.cat-row:active .cat-arrow{color:#7C3AED}
/* Expand arrow rotation */
.cat-arrow-open{color:#7C3AED;transform:rotate(90deg)}
/* Sub categories */
.subcat-wrap{background:#FAFAFA;overflow:hidden;transition:max-height .25s ease}
.subcat-row{display:flex;align-items:center;padding:11px 16px 11px 88px;border-bottom:1px solid #F3F4F6;cursor:pointer;background:#FAFAFA;gap:8px}
.subcat-row:last-child{border-bottom:none}
.subcat-name{font-size:13px;color:#374151;font-weight:400;flex:1}
.subcat-arrow{color:#D1D5DB;font-size:12px}
.subcat-row:active .subcat-name{color:#7C3AED}
/* Bottom spacing */
.bottom-spacer{height:40px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState } = React;

/* Brand data */
const BRANDS = [
  { id: 'chanel',   name: 'Chanel' },
  { id: 'hermes',   name: 'Hermès' },
  { id: 'lv',       name: 'Louis\nVuitton' },
  { id: 'gucci',    name: 'Gucci' },
  { id: 'dior',     name: 'Dior' },
  { id: 'prada',    name: 'Prada' },
  { id: 'loewe',    name: 'Loewe' },
  { id: 'celine',   name: 'Celine' },
];

/* Category data */
const CATEGORIES = [
  { id: 'new',  name: 'New Arrivals',  icon: '✨', subs: [] },
  { id: 'bags', name: 'Bags',          icon: '👜', subs: ['Shoulder Bags','Tote Bags','Crossbody','Clutches','Mini Bags'] },
  { id: 'jwl',  name: 'Jewelry',       icon: '💎', subs: ['Necklaces','Rings','Bracelets','Earrings'] },
  { id: 'acc',  name: 'Accessories',   icon: '🕶️', subs: ['Scarves','Sunglasses','Belts','Wallets'] },
  { id: 'shw',  name: 'Shoes',         icon: '👠', subs: [] },
  { id: 'wtc',  name: 'Watches',       icon: '⌚', subs: [] },
  { id: 'sale', name: 'Sale',          icon: '🏷️', subs: [] },
];

/* Search icon SVG */
function SearchIcon() {
  return (
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <circle cx="11" cy="11" r="8"/>
      <line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
  );
}

/* Bag icon SVG */
function BagIcon() {
  return (
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
      <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
      <line x1="3" y1="6" x2="21" y2="6"/>
      <path d="M16 10a4 4 0 01-8 0"/>
    </svg>
  );
}

/* Chevron right icon */
function ChevronRight({ open }) {
  return (
    <svg
      width="14" height="14"
      viewBox="0 0 24 24" fill="none" stroke="currentColor"
      strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
      style={{ transition: 'transform .2s, color .15s', transform: open ? 'rotate(90deg)' : 'rotate(0deg)', color: open ? '#7C3AED' : '#D1D5DB' }}
    >
      <polyline points="9 18 15 12 9 6"/>
    </svg>
  );
}

/* Brand item */
function BrandItem({ brand }) {
  return (
    <div className="brand-item">
      <div className="brand-avatar">
        <span style={{ fontSize: 9, color: '#C4B5FD', fontWeight: 600, textAlign: 'center', lineHeight: 1.2 }}>
          {brand.name.split('\n')[0].slice(0, 2).toUpperCase()}
        </span>
      </div>
      <span className="brand-name" style={{ whiteSpace: 'pre-line' }}>{brand.name}</span>
    </div>
  );
}

/* Category row with sub-categories */
function CategoryRow({ cat }) {
  const [open, setOpen] = useState(false);
  const hasSubs = cat.subs.length > 0;

  function handleClick() {
    if (hasSubs) setOpen(function(v) { return !v; });
  }

  return (
    <div>
      <div className="cat-row" onClick={handleClick}>
        <div className="cat-thumb">
          <span>{cat.icon}</span>
        </div>
        <div className="cat-info">
          <div className="cat-name">{cat.name}</div>
          {hasSubs && (
            <div className="cat-sub-hint">{cat.subs.length} categories</div>
          )}
        </div>
        <ChevronRight open={open} />
      </div>

      {hasSubs && (
        <div
          className="subcat-wrap"
          style={{ maxHeight: open ? cat.subs.length * 44 + 'px' : '0' }}
        >
          {cat.subs.map(function(sub, i) {
            return (
              <div className="subcat-row" key={i}>
                <span className="subcat-name">{sub}</span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#D1D5DB" strokeWidth="2" strokeLinecap="round">
                  <polyline points="9 18 15 12 9 6"/>
                </svg>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* Main App */
function App() {
  return (
    <div className="phone-shell">
      {/* Nav bar */}
      <div className="nav-bar">
        <div className="logo">Looply</div>
        <div className="nav-icon">
          <BagIcon />
          <div className="cart-badge">2</div>
        </div>
      </div>

      {/* Search bar */}
      <div className="search-wrap">
        <div className="search-box">
          <SearchIcon />
          <span className="search-placeholder">Search bags, brands, jewelry…</span>
        </div>
      </div>

      {/* Brand quick access */}
      <div className="section-label">Shop by Brand</div>
      <div className="brand-rail">
        {BRANDS.map(function(b) {
          return <BrandItem key={b.id} brand={b} />;
        })}
        <div className="brand-item brand-viewall">
          <div className="brand-avatar" style={{ background: '#1F2937' }}>
            <span style={{ fontSize: 9, color: '#fff', fontWeight: 600 }}>View{'\n'}All</span>
          </div>
          <span className="brand-name">View All</span>
        </div>
      </div>

      {/* Divider */}
      <div className="section-divider" />

      {/* Category list */}
      <div className="cat-section">
        {CATEGORIES.map(function(cat) {
          return <CategoryRow key={cat.id} cat={cat} />;
        })}
      </div>

      <div className="bottom-spacer" />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
