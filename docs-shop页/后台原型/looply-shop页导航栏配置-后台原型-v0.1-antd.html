.lp-form-row{display:flex;gap:16px;margin-bottom:14px;align-items:flex-start}

.phone-tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}

/* ── DimBadge ── */
function DimBadge({ market, channel, terminal }) {
  const isWeb = terminal === 'web';
  const termLabel = isWeb ? '🖥 Web' : '📱 App';
  const cls = 'dim-badge ' + (isWeb ? 'dim-badge-web' : 'dim-badge-app');
  return <span className={cls}>{market || 'US'} &middot; {channel || 'official'} &middot; {termLabel}</span>;
}

/* ── PCPreview ── */
function PCPreview({ enabledNavs, menuItems, previewNavId, setPreviewNavId }) {
  const activeNav = enabledNavs.find(n => n.id === previewNavId) || null;
  const l1Items = activeNav ? menuItems.filter(m => m.navId === activeNav.id && m.parentId === null && m.enabled) : [];
  const hasL2 = l1Items.some(l1 => menuItems.some(m => m.parentId === l1.id && m.enabled));

  function renderDropdown() {
    if (!activeNav) return null;
    if (activeNav.isLeaf) return null;
    if (l1Items.length === 0) return null;
    if (hasL2) {
      const cols = l1Items.map(l1 => {
        const l2s = menuItems.filter(m => m.parentId === l1.id && m.enabled);
        return { l1, l2s };
      });
      return (
        <div className="pc-dropdown">
          <div className="pc-mega">
            {cols.map(({ l1, l2s }) => (
              <div key={l1.id} className="pc-mega-col">
                <div className="pc-mega-col-title">{l1.name}</div>
                {l2s.map(l2 => (
                  <div key={l2.id} className="pc-mega-col-item">{l2.name}</div>
                ))}
                {l2s.length === 0 && (
                  <div style={{ fontSize:11, color:'#C4B5FD', padding:'2px 0' }}>no items</div>
                )}
              </div>
            ))}
          </div>
        </div>
      );
    }
    return (
      <div className="pc-dropdown">
        {l1Items.map(l1 => (
          <div key={l1.id} className="pc-dropdown-item">{l1.name}</div>
        ))}
      </div>
    );
  }

  return (
    <div className="pc-shell">
      <div className="pc-screen">
        <div className="pc-topbar">
          <div className="pc-dot" style={{ background:'#EF4444' }} />
          <div className="pc-dot" style={{ background:'#F59E0B' }} />
          <div className="pc-dot" style={{ background:'#10B981' }} />
          <div className="pc-url-bar">
            <GlobalOutlined style={{ fontSize:8, marginRight:4 }} />
            looply.com
          </div>
        </div>
        <div className="pc-header">
          <img src={LOGO_SRC} alt="Looply" style={{ height:16, display:'block' }} onError={e => { e.target.style.display='none'; }} />
          <div style={{ flex:1 }} />
          <div style={{ display:'flex', gap:8, alignItems:'center' }}>
            <EyeOutlined style={{ fontSize:12, color:'#9CA3AF' }} />
            <LinkOutlined style={{ fontSize:12, color:'#9CA3AF' }} />
            <div style={{ width:20, height:20, borderRadius:'50%', background:'#E5E7EB', display:'flex', alignItems:'center', justifyContent:'center' }}>
              <span style={{ fontSize:8, color:'#9CA3AF' }}>A</span>
            </div>
          </div>
        </div>
        <div className="pc-nav">
          {enabledNavs.map(nav => (
            <div
              key={nav.id}
              className={'pc-nav-item' + (previewNavId === nav.id ? ' active' : '')}
              onClick={() => setPreviewNavId(nav.id)}
            >
              {nav.name}
            </div>
          ))}
          {activeNav && renderDropdown()}
        </div>
        <div className="pc-content">Page content area</div>
      </div>
    </div>
  );
}

/* ── NavDrawer ── */
function NavDrawer({ open, nav, navItems, globalMarket, globalChannel, globalTerminal, onClose, onSave }) {
  // levels: '1'=直跳, '2'=两级, '3'=三级
  const [form, setForm] = React.useState({ name:'', levels:'2', targetUrl:'', targetType:'', collectionId:'', enabled:false });
  const isWeb = globalTerminal === 'web';
  const isNew = !nav;

  // Convert legacy isLeaf to levels
  function levelsFromNav(n) {
    if (!n) return '2';
    if (n.levels) return n.levels;
    return n.isLeaf ? '1' : '2';
  }

  React.useEffect(() => {
    if (nav) {
      setForm({ name:nav.name, levels:levelsFromNav(nav), targetUrl:nav.targetUrl||'', targetType:nav.targetType||'', collectionId:nav.collectionId||'', enabled:nav.enabled });
    } else {
      setForm({ name:'', levels:'2', targetUrl:'', targetType:'', collectionId:'', enabled:false });
    }
  }, [nav, open]);

  function handleSave() {
    if (!form.name.trim()) { message.warning('名称不能为空'); return; }
    if (isWeb && form.levels==='1' && !form.targetUrl.trim()) { message.warning('请填写目标 URL'); return; }
    const dup = navItems.find(n => {
      if (nav && n.id === nav.id) return false;
      return n.market===globalMarket && n.channel===globalChannel && n.terminal===globalTerminal
        && n.name.toLowerCase()===form.name.trim().toLowerCase();
    });
    if (dup) { message.error('当前维度下已存在同名导航'); return; }
    onSave({
      name: form.name.trim(),
      levels: isWeb ? form.levels : '2',
      isLeaf: isWeb ? form.levels==='1' : false,
      targetUrl: (isWeb && form.levels==='1') ? form.targetUrl : '',
      targetType: (isWeb && form.levels==='1') ? form.targetType : '',
      collectionId: (isWeb && form.levels==='1') ? form.collectionId : '',
      enabled: form.enabled,
    });
  }

  const showUrlConfig = isWeb && form.levels === '1';
  const showCollection = showUrlConfig && form.targetType === 'collection';
  const selectedCol = ALL_COLLECTIONS.find(c => c.id === form.collectionId);

  return (

      </div>
      <div className="lp-form-row">
        <span className="lp-form-label"><span style={{color:'#DC2626'}}>* </span>名称 (Name)</span>
        <div className="lp-form-control">
          <Input value={form.name} onChange={e => setForm(f => ({ ...f, name:e.target.value }))} placeholder="e.g. Bags" />
        </div>
      </div>
      {isWeb && (

/* ── MenuItemsExpanded ── */
function MenuItemsExpanded({ navId, navName, globalMarket, globalChannel, globalTerminal, navItems, menuItems, setMenuItems, onDrillL1 }) {
  const isWeb = globalTerminal === 'web';
  const [menuDrawerOpen, setMenuDrawerOpen] = React.useState(false);
  const [editingItem, setEditingItem] = React.useState(null);
  const [drawerParentId, setDrawerParentId] = React.useState(null);
  const [dragL1Id, setDragL1Id] = React.useState(null);
  const [dragL1OverId, setDragL1OverId] = React.useState(null);

  const l1Items = menuItems
    .filter(m => m.navId === navId && m.parentId === null)
    .sort((a, b) => (a.order ?? 999) - (b.order ?? 999));

  function reorderL1(fromId, toId) {
    setMenuItems(prev => {
      const items = prev.filter(m => m.navId === navId && m.parentId === null);
      const rest = prev.filter(m => !(m.navId === navId && m.parentId === null));
      const fi = items.findIndex(m=>m.id===fromId), ti = items.findIndex(m=>m.id===toId);
      if (fi<0||ti<0) return prev;
      const arr=[...items]; const [moved]=arr.splice(fi,1); arr.splice(ti,0,moved);
      const withOrder = arr.map((m, i) => ({ ...m, order: i + 1 }));
      return [...rest, ...withOrder];
    });
  }

  function openAdd(pid) { setDrawerParentId(pid || null); setEditingItem(null); setMenuDrawerOpen(true); }
  function openEdit(it) { setDrawerParentId(it.parentId || null); setEditingItem(it); setMenuDrawerOpen(true); }

  function handleSaveItem(form) {
    const targetNavId = form.navId || navId;
    if (editingItem) {
      setMenuItems(prev => prev.map(m => m.id === editingItem.id ? { ...m, ...form, navId:targetNavId } : m));
      message.success('已保存');
    } else {
      setMenuItems(prev => [...prev, {
        id:genId('mi'), navId:targetNavId, parentId:drawerParentId||null,
        name:form.name, collectionId:form.collectionId||'',
        targetUrl:form.targetUrl||'', targetType:form.targetType||'collection',
        isLeaf:form.isLeaf!==false, enabled:form.enabled, order:999,
      }]);
      message.success('已添加');
    }
    setMenuDrawerOpen(false);
  }

  function handleToggle(id, v) { setMenuItems(prev => prev.map(m => m.id===id ? { ...m, enabled:v } : m)); }

  function handleDelete(id) {
    setMenuItems(prev => prev.filter(m => m.id !== id && m.parentId !== id));
    message.success('已删除');
  }

  function DragHandle() {
    return (
      <span style={{ cursor:'grab', color:'#C4B5FD', fontSize:16, display:'inline-flex', alignItems:'center', padding:'2px 4px' }}>
        <HolderOutlined />
      </span>
    );
  }

  const thS = { background:'#EDE9FE', color:'#6B7280', fontWeight:600, padding:'7px 10px', textAlign:'left', borderBottom:'1px solid #DDD6FE' };
  const tdS = { padding:'8px 10px', borderBottom:'1px solid #EDE9FE' };

  return (
    <div className="nav-expand-wrap">
      <div className="nav-expand-header">
        <span className="nav-expand-title">
          {navName} — 二级导航
          <span style={{ marginLeft:8, fontSize:12, color:'#9CA3AF', fontWeight:400 }}>
            共 {l1Items.length} 项
          </span>
        </span>
        <Button size="small" type="primary" icon={<PlusOutlined />} onClick={() => openAdd(null)}>
          新增二级导航
        </Button>
      </div>

      {l1Items.length === 0 && (
        <div style={{ textAlign:'center', padding:'20px', color:'#9CA3AF', fontSize:13 }}>暂无二级导航</div>
      )}

      {l1Items.length > 0 && (
        <table style={{ width:'100%', borderCollapse:'collapse', fontSize:12 }}>
          <thead>
            <tr>
              <th style={{ ...thS, width:36 }}></th>
              <th style={thS}>名称</th>
              <th style={{ ...thS, width:130 }}>关联 Collection</th>
              <th style={{ ...thS, width:180 }}>跳转链接</th>
              <th style={{ ...thS, width:100 }}>状态</th>
              <th style={{ ...thS, width:110 }}>操作</th>
            </tr>
          </thead>
          <tbody>
            {l1Items.map((l1) => {
              const col = ALL_COLLECTIONS.find(c => c.id === l1.collectionId) || null;
              return (
                <React.Fragment key={l1.id}>
                  <tr
                    style={{ background:'#fff', ...(dragL1OverId===l1.id ? {outline:'2px dashed #A78BFA',outlineOffset:'-2px'} : {}) }}
                    draggable
                    onDragStart={() => setDragL1Id(l1.id)}
                    onDragOver={e => { e.preventDefault(); setDragL1OverId(l1.id); }}
                    onDrop={() => { if (dragL1Id && dragL1Id!==l1.id) reorderL1(dragL1Id, l1.id); setDragL1Id(null); setDragL1OverId(null); }}
                    onDragEnd={() => { setDragL1Id(null); setDragL1OverId(null); }}
                  >
                    <td style={tdS}><DragHandle /></td>
                    <td style={tdS}><span style={{ fontWeight:500 }}>{l1.name}</span></td>
                    <td style={tdS}>
                      {col
                        ? <span style={{ background:'rgba(124,58,237,.08)', color:'#7C3AED', padding:'1px 8px', borderRadius:999, fontSize:11 }}>{col.name}</span>
                        : <span style={{ color:'#9CA3AF', fontSize:11 }}>—</span>
                      }
                    </td>
                    <td style={tdS}>
                      {l1.targetUrl
                        ? <a href={l1.targetUrl} target="_blank" rel="noreferrer" style={{ fontSize:11, color:'#2563EB', textDecoration:'none', display:'flex', alignItems:'center', gap:3 }}>
                            <LinkOutlined style={{ fontSize:10 }} />{l1.targetUrl}
                          </a>
                        : <span style={{ color:'#9CA3AF', fontSize:11 }}>—</span>
                      }
                    </td>
                    <td style={tdS}>
                      <Switch size="small" checked={l1.enabled} onChange={v => handleToggle(l1.id,v)} checkedChildren="启用" unCheckedChildren="停用" />
                    </td>
                    <td style={tdS}>
                      <Space size={4}>
                        <Button size="small" icon={<EditOutlined />} onClick={() => openEdit(l1)}>编辑</Button>
                        {!l1.enabled && (
                          <Popconfirm title={'删除 "'+l1.name+'"？'} description="停用状态下删除，不可恢复。"
                            onConfirm={() => handleDelete(l1.id)} okText="删除" okButtonProps={{ danger:true }} cancelText="取消">
                            <Button size="small" danger icon={<DeleteOutlined />} />
                          </Popconfirm>
                        )}
                      </Space>
                    </td>
                  </tr>
                </React.Fragment>
              );
            })}
          </tbody>
        </table>
      )}

      <MenuItemDrawer
        open={menuDrawerOpen}
        item={editingItem}
        navId={navId}
        navItems={navItems}
        globalMarket={globalMarket}
        globalChannel={globalChannel}
        globalTerminal={globalTerminal}
        menuItems={menuItems}
        parentId={drawerParentId}
        onClose={() => setMenuDrawerOpen(false)}
        onSave={handleSaveItem}
      />
    </div>
  );
}

/* ── NavigationPage ── */
function NavigationPage({ globalMarket, globalChannel, globalTerminal }) {
  const [navItems, setNavItems] = React.useState(INIT_NAVS);
  const [menuItems, setMenuItems] = React.useState(() => buildInitMenuItems());
  const [drawerOpen, setDrawerOpen] = React.useState(false);
  const [editingNav, setEditingNav] = React.useState(null);
  const [expandedRowKeys, setExpandedRowKeys] = React.useState([]);
  const [previewNavId, setPreviewNavId] = React.useState(null);
  const [drillNav, setDrillNav] = React.useState(null);
  const [drillL1, setDrillL1] = React.useState(null);
  const [drillL1DrawerOpen, setDrillL1DrawerOpen] = React.useState(false);
  const [drillL1EditItem, setDrillL1EditItem] = React.useState(null);
  const [dragNavId, setDragNavId] = React.useState(null);
  const [dragOverNavId, setDragOverNavId] = React.useState(null);

  const isWeb = globalTerminal === 'web';
  const displayedNavs = navItems.filter(n =>
    n.market === globalMarket && n.channel === globalChannel && n.terminal === globalTerminal
  );
  const enabledNavs = displayedNavs.filter(n => n.enabled);

  React.useEffect(() => {
    const first = enabledNavs[0];
    setPreviewNavId(first ? first.id : null);
    setExpandedRowKeys([]);
    setDrillNav(null);
    setDrillL1(null);
  }, [globalMarket, globalChannel, globalTerminal]);

  function handleAddNav() { setEditingNav(null); setDrawerOpen(true); }
  function handleEditNav(nav) { setEditingNav(nav); setDrawerOpen(true); }

  function handleSaveNav(form) {
    if (editingNav) {
      setNavItems(prev => prev.map(n => n.id === editingNav.id ? { ...n, ...form } : n));
      message.success('导航已更新');
    } else {
      const newNav = {
        id: genId('nav'), market:globalMarket, channel:globalChannel, terminal:globalTerminal,
        order: displayedNavs.length + 1, ...form,
      };
      setNavItems(prev => [...prev, newNav]);
      message.success('导航已添加');
    }
    setDrawerOpen(false);
  }

  function handleDeleteNav(navId) {
    setNavItems(prev => prev.filter(n => n.id !== navId));
    setMenuItems(prev => prev.filter(m => m.navId !== navId));
    setExpandedRowKeys(prev => prev.filter(k => k !== navId));
    message.success('导航已删除');
  }

  function handleToggleNav(navId, enabled) {
    setNavItems(prev => prev.map(n => n.id === navId ? { ...n, enabled } : n));
  }

  function moveNav(navId, dir) {
    setNavItems(prev => {
      const filtered = prev.filter(n => n.market===globalMarket && n.channel===globalChannel && n.terminal===globalTerminal);
      const others = prev.filter(n => !(n.market===globalMarket && n.channel===globalChannel && n.terminal===globalTerminal));
      const idx = filtered.findIndex(n => n.id === navId);
      const tgt = idx + dir;
      if (tgt < 0 || tgt >= filtered.length) return prev;
      const arr = [...filtered];
      [arr[idx], arr[tgt]] = [arr[tgt], arr[idx]];
      return [...others, ...arr.map((n, i) => ({ ...n, order: i+1 }))];
    });
  }

  function handleExpand(expanded, record) {
    setExpandedRowKeys(prev => expanded ? [...prev, record.id] : prev.filter(k => k !== record.id));
    if (expanded) setPreviewNavId(record.id);
  }

  const menuCountByNav = {};
  displayedNavs.forEach(n => { menuCountByNav[n.id] = 0; });
  menuItems.forEach(m => { if (menuCountByNav[m.navId] !== undefined && m.parentId === null && m.enabled) menuCountByNav[m.navId]++; });

  const columns = [
    {
      title: '', key: 'order', width: 36,
      render: () => (
        <span style={{ cursor:'grab', color:'#C4B5FD', fontSize:16, display:'inline-flex', alignItems:'center', padding:'2px 6px' }}>
          <HolderOutlined />
        </span>
      ),
    },
    {
      title: '名称 (Name)', key: 'name',
      render: (_, record) => (
        <div style={{ display:'flex', alignItems:'center', gap:6 }}>
          {!(isWeb && record.isLeaf)
            ? <a style={{ fontWeight:600, fontSize:13, color:'#7C3AED', cursor:'pointer' }} onClick={() => setDrillNav(record)}>{record.name}</a>
            : <span style={{ fontWeight:500, fontSize:13, color:'#1F2937' }}>{record.name}</span>
          }
          {isWeb && record.isLeaf && <Tag color="blue" style={{ fontSize:10 }}>直跳</Tag>}
          {!(isWeb && record.isLeaf) && <RightOutlined style={{ fontSize:10, color:'#C4B5FD' }} />}
        </div>
      ),
    },
    {
      title: '二级导航数（已启用）', key: 'menuItems', width: 140,
      render: (_, record) => {
        const cnt = menuCountByNav[record.id] || 0;
        return <span style={{ fontSize:13, color:'#374151' }}>{cnt}</span>;
      },
    },
    {
      title: '状态', key: 'status', width: 110,
      render: (_, record) => (
        <Switch size="small" checked={record.enabled} onChange={v => handleToggleNav(record.id, v)} checkedChildren="启用" unCheckedChildren="停用" />
      ),
    },
    {
      title: '操作', key: 'actions', width: 120,
      render: (_, record) => (
        <Space size={6}>
          <Button size="small" icon={<EditOutlined />} onClick={() => handleEditNav(record)}>编辑</Button>
          {!record.enabled && (
            <Popconfirm
              title={'删除 "' + record.name + '"？'}
              description="将同步删除该导航下所有二级导航，不可恢复。"
              onConfirm={() => handleDeleteNav(record.id)}
              okText="删除" okButtonProps={{ danger:true }} cancelText="取消"
            >
              <Button size="small" danger icon={<DeleteOutlined />} />
            </Popconfirm>
          )}
        </Space>
      ),
    },
  ];

  // ── 三级导航列表 ──
  if (drillNav && drillL1) {
    const l2Items = menuItems.filter(m => m.navId === drillNav.id && m.parentId === drillL1.id);
    return (
      <div>
        <div style={{ display:'flex', alignItems:'center', gap:6, marginBottom:20 }}>
          <a style={{ color:'#7C3AED', cursor:'pointer', fontSize:13 }} onClick={() => { setDrillNav(null); setDrillL1(null); }}>Shop页导航配置</a>
          <span style={{ color:'#9CA3AF', fontSize:13 }}>/</span>
          <a style={{ color:'#7C3AED', cursor:'pointer', fontSize:13 }} onClick={() => setDrillL1(null)}>{drillNav.name}</a>
          <span style={{ color:'#9CA3AF', fontSize:13 }}>/</span>
          <span style={{ fontSize:13, fontWeight:600, color:'#1F2937' }}>{drillL1.name}</span>
          <DimBadge market={globalMarket} channel={globalChannel} terminal={globalTerminal} />
        </div>
        <div style={{ display:'flex', flexDirection: isWeb ? 'column' : 'row', gap:24, alignItems:'flex-start' }}>
          <div style={{ flex:1, minWidth:0, width:'100%' }}>
            <div className="nav-expand-wrap">
              <div className="nav-expand-header">
                <span className="nav-expand-title">
                  {drillL1.name} — 三级导航
                  <span style={{ marginLeft:8, fontSize:12, color:'#9CA3AF', fontWeight:400 }}>共 {l2Items.length} 项</span>
                </span>
                <Button size="small" type="primary" icon={<PlusOutlined />}
                  onClick={() => {
                    // reuse MenuItemDrawer via a small inline trigger
                    setDrillL1DrawerOpen(true);
                  }}>新增三级导航</Button>
              </div>
              {l2Items.length === 0 && (
                <div style={{ textAlign:'center', padding:'20px', color:'#9CA3AF', fontSize:13 }}>暂无三级导航，点击「新增三级导航」添加</div>
              )}
              {l2Items.length > 0 && (
                <table style={{ width:'100%', borderCollapse:'collapse', fontSize:12 }}>
                  <thead>
                    <tr>
                      <th style={{ background:'#EDE9FE', color:'#6B7280', fontWeight:600, padding:'7px 10px', textAlign:'left', borderBottom:'1px solid #DDD6FE', width:80 }}>排序</th>
                      <th style={{ background:'#EDE9FE', color:'#6B7280', fontWeight:600, padding:'7px 10px', textAlign:'left', borderBottom:'1px solid #DDD6FE' }}>三级导航名称</th>
                      <th style={{ background:'#EDE9FE', color:'#6B7280', fontWeight:600, padding:'7px 10px', textAlign:'left', borderBottom:'1px solid #DDD6FE', width:100 }}>状态</th>
                      <th style={{ background:'#EDE9FE', color:'#6B7280', fontWeight:600, padding:'7px 10px', textAlign:'left', borderBottom:'1px solid #DDD6FE', width:110 }}>操作</th>
                    </tr>
                  </thead>
                  <tbody>
                    {l2Items.map((l2, idx) => (
                      <tr key={l2.id} style={{ background:'#fff' }}>
                        <td style={{ padding:'8px 10px', borderBottom:'1px solid #EDE9FE' }}>
                          <span style={{ cursor:'grab', color:'#C4B5FD', fontSize:16, display:'inline-flex', alignItems:'center', padding:'2px 4px' }}>
                            <HolderOutlined />
                          </span>
                        </td>
                        <td style={{ padding:'8px 10px', borderBottom:'1px solid #EDE9FE' }}>
                          <div className="l2-indent">
                            <span style={{ fontWeight:500 }}>{l2.name}</span>
                            {l2.targetUrl && <span style={{ fontSize:10, color:'#9CA3AF', marginLeft:4 }}>{l2.targetUrl}</span>}
                          </div>
                        </td>
                        <td style={{ padding:'8px 10px', borderBottom:'1px solid #EDE9FE' }}>
                          <Switch size="small" checked={l2.enabled}
                            onChange={v => setMenuItems(prev => prev.map(m => m.id===l2.id ? {...m,enabled:v} : m))}
                            checkedChildren="启用" unCheckedChildren="停用" />
                        </td>
                        <td style={{ padding:'8px 10px', borderBottom:'1px solid #EDE9FE' }}>
                          <Space size={4}>
                            <Button size="small" icon={<EditOutlined />} onClick={() => { setDrillL1EditItem(l2); setDrillL1DrawerOpen(true); }}>编辑</Button>
                            {!l2.enabled && (
                              <Popconfirm title={'删除 "'+l2.name+'"？'} description="停用状态下删除，不可恢复。" onConfirm={() => setMenuItems(prev=>prev.filter(m=>m.id!==l2.id))} okText="删除" okButtonProps={{ danger:true }} cancelText="取消">
                                <Button size="small" danger icon={<DeleteOutlined />} />
                              </Popconfirm>
                            )}
                          </Space>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              )}
            </div>
            <MenuItemDrawer
              open={drillL1DrawerOpen}
              item={drillL1EditItem}
              navId={drillNav.id}
              navItems={navItems}
              globalMarket={globalMarket}
              globalChannel={globalChannel}
              globalTerminal={globalTerminal}
              menuItems={menuItems}
              parentId={drillL1.id}
              onClose={() => { setDrillL1DrawerOpen(false); setDrillL1EditItem(null); }}
              onSave={form => {
                const targetNavId = form.navId || drillNav.id;
                if (drillL1EditItem) {
                  setMenuItems(prev => prev.map(m => m.id===drillL1EditItem.id ? {...m,...form,navId:targetNavId} : m));
                  message.success('L2已更新');
                } else {
                  setMenuItems(prev => [...prev, { id:genId('mi'), navId:targetNavId, parentId:drillL1.id, name:form.name, collectionId:form.collectionId||'', targetUrl:form.targetUrl||'', targetType:form.targetType||'collection', isLeaf:true, enabled:form.enabled, order:999 }]);
                  message.success('L2已添加');
                }
                setDrillL1DrawerOpen(false); setDrillL1EditItem(null);
              }}
            />
          </div>
          <div style={{ flexShrink: isWeb ? undefined : 0 }}>
            {isWeb
              ? <PCPreview enabledNavs={enabledNavs} menuItems={menuItems} previewNavId={drillNav.id} setPreviewNavId={setPreviewNavId} />
              : <PhoneShell><PhoneNavGrid navs={enabledNavs} menuItems={menuItems} /></PhoneShell>
            }
          </div>
        </div>
      </div>
    );
  }

  // ── 二级导航列表 ──
  if (drillNav) {
    return (
      <div>
        <div style={{ display:'flex', alignItems:'center', gap:6, marginBottom:20 }}>
          <a style={{ color:'#7C3AED', cursor:'pointer', fontSize:13 }} onClick={() => setDrillNav(null)}>Shop页导航配置</a>
          <span style={{ color:'#9CA3AF', fontSize:13 }}>/</span>
          <span style={{ fontSize:13, fontWeight:600, color:'#1F2937' }}>{drillNav.name}</span>
          <DimBadge market={globalMarket} channel={globalChannel} terminal={globalTerminal} />
        </div>
        <div style={{ display:'flex', flexDirection: isWeb ? 'column' : 'row', gap:24, alignItems:'flex-start' }}>
          <div style={{ flex:1, minWidth:0, width:'100%' }}>
            <MenuItemsExpanded
              navId={drillNav.id}
              navName={drillNav.name}
              globalMarket={globalMarket}
              globalChannel={globalChannel}
              globalTerminal={globalTerminal}
              navItems={navItems}
              menuItems={menuItems}
              setMenuItems={setMenuItems}
              onDrillL1={isWeb ? (l1) => setDrillL1(l1) : undefined}
            />
          </div>
          <div style={{ flexShrink: isWeb ? undefined : 0 }}>
            {isWeb
              ? <PCPreview enabledNavs={enabledNavs} menuItems={menuItems} previewNavId={drillNav.id} setPreviewNavId={setPreviewNavId} />
              : <PhoneShell><PhoneNavGrid navs={enabledNavs} menuItems={menuItems} /></PhoneShell>
            }
          </div>
        </div>
      </div>
    );
  }

  return (
    <div>
      <div style={{ marginBottom:20 }}>
        <div style={{ fontSize:20, fontWeight:700, color:'#1F2937', marginBottom:4 }}>Shop页导航配置 (Navigation Config)</div>
        <div style={{ display:'flex', alignItems:'center', gap:8 }}>
          <span style={{ fontSize:13, color:'#6B7280' }}>App 端 Shop 页导航配置，点击一级导航名称进入二级导航配置</span>
          <DimBadge market={globalMarket} channel={globalChannel} terminal={globalTerminal} />
        </div>
      </div>

      <div style={{ display:'flex', flexDirection: isWeb ? 'column' : 'row', gap:24, alignItems:'flex-start' }}>
        <div style={{ flex:1, minWidth:0, width:'100%' }}>
          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:12 }}>
            <span style={{ fontSize:14, fontWeight:600, color:'#374151' }}>
              {'顶部导航'} ({displayedNavs.length})
            </span>
            <Button type="primary" icon={<PlusOutlined />} onClick={handleAddNav}>
              新增一级导航
            </Button>
          </div>

          <Card style={CARD_STYLE} styles={{ body: { padding:0 } }}>
            <Table
              rowKey="id"
              dataSource={displayedNavs}
              columns={columns}
              pagination={false}
              styles={TABLE_STYLES}
              onRow={(record) => ({
                draggable: true,
                onDragStart: () => setDragNavId(record.id),
                onDragOver: (e) => { e.preventDefault(); setDragOverNavId(record.id); },
                onDrop: () => {
                  if (dragNavId && dragNavId !== record.id) {
                    setNavItems(prev => {
                      const cur = prev.filter(n => n.market===globalMarket && n.channel===globalChannel && n.terminal===globalTerminal);
                      const rest = prev.filter(n => !(n.market===globalMarket && n.channel===globalChannel && n.terminal===globalTerminal));
                      const fi = cur.findIndex(n => n.id===dragNavId), ti = cur.findIndex(n => n.id===record.id);
                      if (fi<0||ti<0) return prev;
                      const arr=[...cur]; const [m]=arr.splice(fi,1); arr.splice(ti,0,m);
                      return [...rest, ...arr.map((n,i)=>({...n,order:i+1}))];
                    });
                  }
                  setDragNavId(null); setDragOverNavId(null);
                },
                onDragEnd: () => { setDragNavId(null); setDragOverNavId(null); },
                style: dragOverNavId===record.id ? {background:'#F5F3FF',outline:'2px dashed #A78BFA',outlineOffset:'-2px'} : {},
              })}

              locale={{ emptyText: (
                <div style={{ padding:'40px 20px', textAlign:'center' }}>
                  <GlobalOutlined style={{ fontSize:32, color:'#D1D5DB', marginBottom:12, display:'block' }} />
                  <div style={{ fontSize:14, fontWeight:600, color:'#1F2937', marginBottom:6 }}>暂无导航</div>
                  <div style={{ fontSize:13, color:'#6B7280' }}>当前维度下尚未添加导航。</div>
                </div>
              ) }}
            />
          </Card>

          <NavDrawer
            open={drawerOpen}
            nav={editingNav}
            navItems={navItems}
            globalMarket={globalMarket}
            globalChannel={globalChannel}
            globalTerminal={globalTerminal}
            onClose={() => setDrawerOpen(false)}
            onSave={handleSaveNav}
          />
        </div>

        {/* Preview panel */}
        <div style={{ flexShrink: isWeb ? undefined : 0 }}>
          {isWeb
            ? <PCPreview
                enabledNavs={enabledNavs}
                menuItems={menuItems}
                previewNavId={previewNavId}
                setPreviewNavId={setPreviewNavId}
              />
            : (
              <PhoneShell>
                <PhoneNavGrid navs={enabledNavs} menuItems={menuItems} />
              </PhoneShell>
            )
          }
        </div>
      </div>
    </div>
  );
}

        </Layout.Header>

        <div style={{
          background:'#F3EEFF', borderBottom:'1px solid #DDD6FE',

          <span style={{ fontSize:12, fontWeight:600, color:'#7C3AED', letterSpacing:'0.3px', whiteSpace:'nowrap' }}>全局筛选 (Global Context)</span>
          <div style={{ width:1, height:16, background:'#C4B5FD' }} />
          <div style={{ display:'flex', alignItems:'center', gap:6 }}>
            <span style={{ fontSize:12, color:'#6B7280' }}>市场</span>
            <Select value={globalMarket} options={MARKETS} onChange={setGlobalMarket} style={{ width:100 }} size="small" />
          </div>
          <div style={{ display:'flex', alignItems:'center', gap:6 }}>
            <span style={{ fontSize:12, color:'#6B7280' }}>渠道</span>
            <Select value={globalChannel} options={CHANNELS} onChange={setGlobalChannel} style={{ width:100 }} size="small" />
          </div>
          <div style={{ display:'flex', alignItems:'center', gap:6 }}>
            <span style={{ fontSize:12, color:'#6B7280' }}>终端</span>
            <span style={{ display:'inline-flex', alignItems:'center', padding:'1px 10px', background:'#f5f5f5', border:'1px solid #d9d9d9', borderRadius:6, color:'#595959', fontSize:13, height:24 }}>📱 App</span>
          </div>
        </div>

        <Layout style={{ flex:1, overflow:'hidden' }}>
          <Layout.Sider width={220} style={{ background:'#fff', borderRight:'1px solid #E5E7EB', overflow:'auto' }}>
            <Menu
              mode="inline"
              selectedKeys={['shop-nav-config']}
              defaultOpenKeys={['shop']}
              items={[
                {
                  key: 'shop',
                  icon: React.createElement(ShopOutlined),
                  label: 'Shop页',
                  children: [
                    { key:'shop-nav-config', icon: React.createElement(GlobalOutlined), label: '导航配置' },
                  ],
                },
              ]}
              style={{ border:'none', paddingTop:8 }}
            />
          </Layout.Sider>
          <Layout.Content style={{ background:'#F9FAFB', display:'flex', flexDirection:'column', overflow:'auto' }}>
            <div style={{ padding:'10px 24px', background:'#fff', borderBottom:'1px solid #E5E7EB', display:'flex', alignItems:'center', gap:8, flexShrink:0 }}>
              <Breadcrumb items={[
                { title: React.createElement(HomeOutlined) },
                { title: 'Shop页' },
                { title: '导航配置' },
              ]} style={{ fontSize:13 }} />
            </div>
            <div style={{ flex:1, overflowY:'auto', padding:28 }}>
              <NavigationPage
                globalMarket={globalMarket}
                globalChannel={globalChannel}
                globalTerminal={globalTerminal}
              />
            </div>
          </Layout.Content>
        </Layout>
      </Layout>
    </ConfigProvider>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
