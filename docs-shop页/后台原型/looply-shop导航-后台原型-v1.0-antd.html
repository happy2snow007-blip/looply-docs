<title>Looply · Shop Navigation v1.0</title>

<script crossorigin src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/dayjs.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/antd@6.4.3/dist/antd.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/@ant-design/icons@6.2.1/dist/index.umd.min.js"></script>

<style>
html,body,#root{height:100%;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F9FAFB;color:#1F2937}
#root::before{content:'Loading...';position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#9CA3AF;font-size:14px}
#root:not(:empty)::before{display:none}

.lp-form-row{display:flex;gap:16px;margin-bottom:14px;align-items:flex-start}
.lp-form-row .lp-form-label{width:96px;text-align:right;color:#6B7280;font-size:13px;flex-shrink:0;padding-top:6px}
.lp-form-row .lp-form-control{flex:1}

.lp-upload-zone{border:2px dashed #D1D5DB;border-radius:10px;padding:28px 16px;text-align:center;background:#FAFAFA;cursor:pointer;transition:border-color .15s,background .15s}
.lp-upload-zone:hover{border-color:#7C3AED;background:#FAF5FF}
.lp-upload-zone .hint{font-size:13px;color:#6B7280;margin-bottom:4px}
.lp-upload-zone .sub{font-size:12px;color:#9CA3AF}

.dim-badge{display:inline-flex;align-items:center;background:#7C3AED;color:#fff;font-size:12px;font-weight:600;padding:3px 12px;border-radius:999px;letter-spacing:0.2px;white-space:nowrap}

.items-count-link{color:#7C3AED;font-weight:600;cursor:pointer;text-decoration:none;background:rgba(124,58,237,.08);padding:2px 10px;border-radius:999px;font-size:12px;transition:background .12s;border:none;outline:none}
.items-count-link:hover{background:rgba(124,58,237,.18)}

.col-info-card{background:#EFF6FF;border:1px solid #BFDBFE;border-radius:8px;padding:8px 12px;margin-top:8px}
.col-info-card .col-name{font-weight:600;color:#1E40AF;font-size:13px;margin-bottom:3px}
.col-info-card .col-url{font-size:12px;color:#2563EB;text-decoration:none}
.col-info-card .col-url:hover{text-decoration:underline}
.col-info-card .col-items{font-size:12px;color:#6B7280;margin-top:3px}

/* Phone shell */
.phone-shell{width:300px;min-width:300px;border-radius:28px;background:#1A1A1A;padding:8px;box-shadow:0 20px 60px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.08);position:sticky;top:24px;align-self:flex-start}
.phone-screen{border-radius:22px;overflow:hidden;background:#fff;height:580px;display:flex;flex-direction:column}
.phone-statusbar{height:24px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 14px;flex-shrink:0}
.phone-header{padding:8px 10px 6px;border-bottom:1px solid #F3F4F6;flex-shrink:0;background:#fff}
.phone-body{flex:1;display:flex;overflow:hidden}
.phone-leftnav{width:70px;min-width:70px;background:#F5F5F5;overflow-y:auto;border-right:1px solid #EBEBEB}
.phone-leftnav-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px;cursor:pointer;position:relative;transition:background .12s}
.phone-leftnav-item.active{background:#fff}
.phone-leftnav-item.active::before{content:'';position:absolute;left:0;top:20%;height:60%;width:3px;background:#7C3AED;border-radius:0 2px 2px 0}
.phone-grid{flex:1;overflow-y:auto;padding:8px 6px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-content:start}
.phone-grid-item{display:flex;flex-direction:column;align-items:center;gap:3px}
.phone-tabbar{height:48px;border-top:1px solid #EBEBEB;display:flex;align-items:center;flex-shrink:0;background:#fff}
.phone-tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}

:focus-visible{outline:none;box-shadow:inset 0 0 0 2px rgba(124,58,237,.4)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function PhoneNavGrid({ enabledNavs, previewNavId, setPreviewNavId, menuItems }) {

    <div className="phone-body">

/* ── Navigation Drawer (Add/Edit) ── */
/* Market/Channel/Terminal always disabled (pre-filled from global state) */
function NavDrawer({ open, nav, navItems, globalMarket, globalChannel, globalTerminal, onClose, onSave }) {
  const [form, setForm] = React.useState({ name: '', enabled: true });

  React.useEffect(() => {
    if (nav) {
      setForm({ name: nav.name, enabled: nav.enabled });
    } else {
      setForm({ name: '', enabled: true });
    }
  }, [nav, open]);

  function handleSave() {
    if (!form.name.trim()) { message.warning('Name is required'); return; }
    const duplicate = navItems.find(n => {
      if (nav && n.id === nav.id) return false;
      return n.market === globalMarket
        && n.channel === globalChannel
        && n.terminal === globalTerminal
        && n.name.toLowerCase() === form.name.trim().toLowerCase();
    });
    if (duplicate) {
      message.error('A navigation with this name already exists for the current Market / Channel / Terminal.');
      return;
    }
    onSave({ name: form.name.trim(), enabled: form.enabled });
  }

  const isNew = !nav;
  const chLabel = CHANNELS.find(c => c.value === globalChannel)?.label || globalChannel;

  return (
    <Drawer
      open={open}
      title={isNew ? 'Add Navigation' : 'Edit Navigation'}
      width={480}
      onClose={onClose}
      footer={
        <Space style={{ justifyContent:'flex-end', width:'100%' }}>
          <Button onClick={onClose}>Cancel</Button>
          <Button type="primary" onClick={handleSave}>Save</Button>
        </Space>

        <div className="lp-form-control">
          <Select value={globalMarket} options={MARKETS} disabled style={{ width:'100%' }} />

      </div>
      <div className="lp-form-row">
        <span className="lp-form-label">Channel</span>
        <div className="lp-form-control">
          <Select value={globalChannel} options={CHANNELS} disabled style={{ width:'100%' }} />

        <div className="lp-form-control">
          <Select value={globalTerminal} options={TERMINALS} disabled style={{ width:'100%' }} />
        </div>

        <span className="lp-form-label"><span style={{color:'#DC2626'}}>* </span>Name</span>

/* ── Navigation Page ── */
function NavigationPage({ navItems, setNavItems, menuItems, setMenuItems, itemCounts, onNavigateToMenu, globalMarket, globalChannel, globalTerminal }) {
  const [drawerOpen, setDrawerOpen] = React.useState(false);
  const [editingNav, setEditingNav] = React.useState(null);

  /* Filter by global context — no extra filter controls on this page */
  const displayedNavs = navItems.filter(n =>
    n.market === globalMarket && n.channel === globalChannel && n.terminal === globalTerminal
  );

  /* Phone preview: enabled navs in global context */
  const enabledNavs = displayedNavs.filter(n => n.enabled);
  const [previewNavId, setPreviewNavId] = React.useState(enabledNavs[0]?.id || null);

  React.useEffect(() => {
    const first = navItems.filter(n => n.enabled && n.market === globalMarket && n.channel === globalChannel && n.terminal === globalTerminal)[0];
    if (!previewNavId || !navItems.find(n => n.id === previewNavId)) {
      setPreviewNavId(first ? first.id : null);
    }
  }, [navItems, globalMarket, globalChannel, globalTerminal]);

  function handleAddNav() { setEditingNav(null); setDrawerOpen(true); }
  function handleEditNav(nav) { setEditingNav(nav); setDrawerOpen(true); }

  function handleSaveNav(form) {
    if (editingNav) {
      setNavItems(prev => prev.map(n => n.id === editingNav.id ? { ...n, ...form } : n));
      message.success('Navigation updated');
    } else {
      const newNav = {
        id: genId('nav'), name: form.name, enabled: form.enabled,
        order: navItems.filter(n => n.market === globalMarket && n.channel === globalChannel && n.terminal === globalTerminal).length + 1,
        market: globalMarket, channel: globalChannel, terminal: globalTerminal,
      };
      setNavItems(prev => [...prev, newNav]);
      message.success('Navigation added');
    }
    setDrawerOpen(false);
  }

  function handleDeleteNav(navId) {
    setNavItems(prev => prev.filter(n => n.id !== navId));
    setMenuItems(prev => prev.filter(m => m.navId !== navId));
    message.success('Navigation deleted');
  }

  function handleToggleNav(navId, enabled) {
    setNavItems(prev => prev.map(n => n.id === navId ? { ...n, enabled } : n));
  }

  function moveNav(navId, dir) {
    setNavItems(prev => {
      const arr = [...prev];
      const index = arr.findIndex(n => n.id === navId);
      const targetIndex = index + dir;
      if (targetIndex < 0 || targetIndex >= arr.length) return arr;
      [arr[index], arr[targetIndex]] = [arr[targetIndex], arr[index]];
      return arr.map((n, i) => ({ ...n, order: i + 1 }));
    });
  }

  const menuCountByNav = {};
  navItems.forEach(n => { menuCountByNav[n.id] = 0; });
  menuItems.forEach(m => { if (menuCountByNav[m.navId] !== undefined) menuCountByNav[m.navId]++; });

  const columns = [
    {
      title: '', key: 'order', width: 80,
      render: (_, record) => {
        const globalIndex = navItems.findIndex(n => n.id === record.id);
        return (
          <Space size={2}>
            <HolderOutlined style={{ color:'#D1D5DB', fontSize:16, cursor:'grab', marginRight:4 }} />
            <Button size="small" icon={<ArrowUpOutlined />} disabled={globalIndex === 0} onClick={() => moveNav(record.id, -1)} />
            <Button size="small" icon={<ArrowDownOutlined />} disabled={globalIndex === navItems.length - 1} onClick={() => moveNav(record.id, 1)} />
          </Space>
        );
      },
    },
    {
      title: 'Name', key: 'name',
      render: (_, record) => <span style={{ fontWeight:500, fontSize:13, color:'#1F2937' }}>{record.name}</span>,
    },
    {
      title: 'Menu Items', key: 'menuItems', width: 120,
      render: (_, record) => {
        const count = menuCountByNav[record.id] || 0;
        return (
          <button
            className="items-count-link"
            onClick={() => onNavigateToMenu(record.id)}
            title={'View menu items for ' + record.name}
          >
            {count} {count === 1 ? 'item' : 'items'}
          </button>
        );
      },
    },
    {
      title: 'Status', key: 'status', width: 120,
      render: (_, record) => (
        <Switch size="small" checked={record.enabled} onChange={v => handleToggleNav(record.id, v)}
          checkedChildren="Active" unCheckedChildren="Inactive" />
      ),
    },
    {
      title: 'Actions', key: 'actions', width: 110,
      render: (_, record) => (
        <Space size={6}>
          <Button size="small" icon={<EditOutlined />} onClick={() => handleEditNav(record)}>Edit</Button>
          <Popconfirm
            title={'Delete "' + record.name + '"?'}
            description="This will also remove all associated menu items."
            onConfirm={() => handleDeleteNav(record.id)}
            okText="Delete" okButtonProps={{ danger:true }} cancelText="Cancel"
          >
            <Button size="small" danger icon={<DeleteOutlined />} />
          </Popconfirm>
        </Space>
      ),
    },
  ];

  return (
    <div style={{ display:'flex', flexDirection:'row', gap:24, alignItems:'flex-start' }}>
      <div style={{ flex:1, minWidth:0, overflow:'auto' }}>
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:12 }}>
          <div>
            <div style={{ fontSize:20, fontWeight:700, color:'#1F2937', marginBottom:2 }}>Navigation</div>
            <div style={{ display:'flex', alignItems:'center', gap:8, marginTop:4 }}>
              <div style={{ fontSize:13, color:'#6B7280' }}>Shop page left navigation</div>
              <DimBadge market={globalMarket} channel={globalChannel} terminal={globalTerminal} />
            </div>
          </div>
          <Button type="primary" icon={<PlusOutlined />} onClick={handleAddNav}>
            Add Navigation
          </Button>
        </div>

        <Card style={CARD_STYLE} styles={{ body: { padding:0 } }}>
          <Table
            rowKey="id"
            dataSource={displayedNavs}
            columns={columns}
            pagination={false}
            styles={TABLE_STYLES}
            locale={{ emptyText: (
              <div style={{ padding:'40px 20px', textAlign:'center' }}>
                <AppstoreOutlined style={{ fontSize:32, color:'#D1D5DB', marginBottom:12, display:'block' }} />
                <div style={{ fontSize:14, fontWeight:600, color:'#1F2937', marginBottom:6 }}>No navigations found</div>
                <div style={{ fontSize:13, color:'#6B7280' }}>Add a navigation for the current market / channel / terminal.</div>
              </div>
            ) }}
          />
        </Card>

        <NavDrawer
          open={drawerOpen}
          nav={editingNav}
          navItems={navItems}
          globalMarket={globalMarket}
          globalChannel={globalChannel}
          globalTerminal={globalTerminal}
          onClose={() => setDrawerOpen(false)}
          onSave={handleSaveNav}
        />
      </div>

      <PhoneShell>
        <PhoneNavGrid
          enabledNavs={enabledNavs}
          previewNavId={previewNavId || (enabledNavs[0] ? enabledNavs[0].id : null)}
          setPreviewNavId={setPreviewNavId}
          menuItems={menuItems}
        />
      </PhoneShell>
    </div>
  );
}

/* ── Menu Page ── */
function MenuPage({ navItems, menuItems, setMenuItems, itemCounts, initialNavFilter, globalMarket, globalChannel, globalTerminal }) {
  const [search, setSearch] = React.useState('');
  const [searchInput, setSearchInput] = React.useState('');
  const [navFilter, setNavFilter] = React.useState(initialNavFilter || null);
  const [statusFilter, setStatusFilter] = React.useState('all');
  const [drawerOpen, setDrawerOpen] = React.useState(false);
  const [editingItem, setEditingItem] = React.useState(null);
  const [previewNavId, setPreviewNavId] = React.useState(null);
  const debounceRef = React.useRef(null);

  /* Navigations scoped to global context for filter dropdown */
  const scopedNavs = navItems.filter(n =>
    n.market === globalMarket && n.channel === globalChannel && n.terminal === globalTerminal
  );
  const enabledNavs = scopedNavs.filter(n => n.enabled);

  React.useEffect(() => {
    if (initialNavFilter && initialNavFilter !== 'all') {
      setNavFilter(initialNavFilter || null);
      setPreviewNavId(initialNavFilter);
    } else {
      const first = enabledNavs[0];
      if (first) setPreviewNavId(first.id);
    }
  }, [initialNavFilter]);

  React.useEffect(() => {
    if (navFilter) setPreviewNavId(navFilter);
  }, [navFilter]);

  /* Reset navFilter when global context changes and current filter is out of scope */
  React.useEffect(() => {
    if (navFilter) {
      const still = scopedNavs.find(n => n.id === navFilter);
      if (!still) setNavFilter(null);
    }
  }, [globalMarket, globalChannel, globalTerminal]);

  function handleSearchChange(e) {
    const val = e.target.value;
    setSearchInput(val);
    if (debounceRef.current) clearTimeout(debounceRef.current);
    debounceRef.current = setTimeout(() => setSearch(val), 300);
  }

  function handleAddItem() { setEditingItem(null); setDrawerOpen(true); }
  function handleEditItem(item) { setEditingItem(item); setDrawerOpen(true); }

  function handleSaveItem(form) {
    if (editingItem) {
      setMenuItems(prev => prev.map(m => m.id === editingItem.id ? { ...m, ...form } : m));
      message.success('Menu item updated');
    } else {
      setMenuItems(prev => [...prev, { id: genId('mi'), navId: form.navId, name: form.name, collectionId: form.collectionId, image: null, enabled: form.enabled }]);
      message.success('Menu item added');
    }
    setDrawerOpen(false);
  }

  function handleDeleteItem(itemId) {
    setMenuItems(prev => prev.filter(m => m.id !== itemId));
    message.success('Menu item deleted');
  }

  function handleToggleItem(itemId, enabled) {
    setMenuItems(prev => prev.map(m => m.id === itemId ? { ...m, enabled } : m));
  }

  function moveMenuItem(itemId, dir) {
    setMenuItems(prev => {
      const item = prev.find(m => m.id === itemId);
      if (!item) return prev;
      const siblings = prev.filter(m => m.navId === item.navId);
      const idx = siblings.findIndex(m => m.id === itemId);
      const targetIdx = idx + dir;
      if (targetIdx < 0 || targetIdx >= siblings.length) return prev;
      const newSiblings = [...siblings];
      [newSiblings[idx], newSiblings[targetIdx]] = [newSiblings[targetIdx], newSiblings[idx]];
      const siblingIds = new Set(newSiblings.map(m => m.id));
      return prev.filter(m => !siblingIds.has(m.id)).concat(newSiblings);
    });
  }

  /* Only menu items belonging to scoped navigations */
  const scopedNavIds = new Set(scopedNavs.map(n => n.id));
  const q = search.trim().toLowerCase();
  const filtered = menuItems.filter(m => {
    if (!scopedNavIds.has(m.navId)) return false;
    if (navFilter && m.navId !== navFilter) return false;
    if (statusFilter === 'active' && !m.enabled) return false;
    if (statusFilter === 'inactive' && m.enabled) return false;
    if (q) {
      const col = colById(m.collectionId);
      if (!m.name.toLowerCase().includes(q) && !(col && col.name.toLowerCase().includes(q)) && m.collectionId !== q) return false;
    }
    return true;
  });

  const navFilterOptions = scopedNavs.map(n => ({ value: n.id, label: n.name }));
  const statusOptions = [
    { value:'all', label:'All Status' },
    { value:'active', label:'Active' },
    { value:'inactive', label:'Inactive' },
  ];

  const effectivePreviewNavId = previewNavId || (enabledNavs[0] ? enabledNavs[0].id : null);

  const columns = [
    {
      title: '', key: 'order', width: 80,
      render: (_, record) => {
        const siblings = menuItems.filter(m => m.navId === record.navId);
        const idx = siblings.findIndex(m => m.id === record.id);
        return (
          <Space size={2}>
            <HolderOutlined style={{ color:'#D1D5DB', fontSize:16, cursor:'grab', marginRight:4 }} />
            <Button size="small" icon={<ArrowUpOutlined />} disabled={idx === 0} onClick={() => moveMenuItem(record.id, -1)} />
            <Button size="small" icon={<ArrowDownOutlined />} disabled={idx === siblings.length - 1} onClick={() => moveMenuItem(record.id, 1)} />
          </Space>
        );
      },
    },
    {
      title: 'Navigation', key: 'navigation', width: 120,
      render: (_, record) => {
        const nav = navItems.find(n => n.id === record.navId);
        if (!nav) return <span style={{ color:'#9CA3AF' }}>&mdash;</span>;
        return <Tag style={{ fontSize:11 }}>{nav.name}</Tag>;
      },
    },
    {
      title: 'Name', key: 'name', width: 140,
      render: (_, record) => <span style={{ fontWeight:500, fontSize:13 }}>{record.name}</span>,
    },
    {
      title: 'Image', key: 'image', width: 70,
      render: () => (
        <div style={{ width:32, height:32, borderRadius:'50%', border:'1.5px dashed #D1D5DB', background:'#F9FAFB', display:'flex', alignItems:'center', justifyContent:'center' }}>
          <PictureOutlined style={{ fontSize:12, color:'#D1D5DB' }} />
        </div>
      ),
    },
    {
      title: 'Collection', key: 'collection', width: 220,
      render: (_, record) => {
        const col = colById(record.collectionId);
        if (!col) return <span style={{ color:'#9CA3AF', fontSize:12 }}>Not linked</span>;
        return (
          <div>
            <div style={{ fontWeight:600, color:'#2563EB', fontSize:12 }}>{col.name}</div>
            <a href={'/collections/' + col.slug} target="_blank" style={{ color:'#9CA3AF', fontSize:11, textDecoration:'none' }}>
              {'/collections/' + col.slug}
            </a>
          </div>
        );
      },
    },
    {
      title: 'Items', key: 'items', width: 110,
      render: (_, record) => (
        <Tooltip title="Based on latest collection sync">
          <span style={{ color:'#6B7280', fontSize:12 }}>~{itemCounts[record.id] || 0} items</span>
        </Tooltip>
      ),
    },
    {
      title: 'Status', key: 'status', width: 90,
      render: (_, record) => (
        <Switch size="small" checked={record.enabled} onChange={v => handleToggleItem(record.id, v)}
          checkedChildren="Active" unCheckedChildren="Inactive" />
      ),
    },
    {
      title: 'Actions', key: 'actions', width: 100, fixed: 'right',
      render: (_, record) => (
        <Space size={6}>
          <Button size="small" icon={<EditOutlined />} onClick={() => handleEditItem(record)}>Edit</Button>
          <Popconfirm
            title={'Delete "' + record.name + '"?'}
            description="This action cannot be undone."
            onConfirm={() => handleDeleteItem(record.id)}
            okText="Delete" okButtonProps={{ danger:true }} cancelText="Cancel"
          >
            <Button size="small" danger icon={<DeleteOutlined />} />
          </Popconfirm>
        </Space>
      ),
    },
  ];

  return (
    <div style={{ display:'flex', flexDirection:'row', gap:24, alignItems:'flex-start' }}>
      <div style={{ flex:1, minWidth:0, overflow:'auto' }}>
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:20 }}>
          <div>
            <div style={{ fontSize:20, fontWeight:700, color:'#1F2937', marginBottom:2 }}>Menu</div>
            <div style={{ display:'flex', alignItems:'center', gap:8, marginTop:4 }}>
              <div style={{ fontSize:13, color:'#6B7280' }}>Menu items within each navigation</div>
              <DimBadge market={globalMarket} channel={globalChannel} terminal={globalTerminal} />
            </div>
          </div>
          <Button type="primary" icon={<PlusOutlined />} onClick={handleAddItem}>Add Menu Item</Button>
        </div>

        <div style={{ display:'flex', gap:10, marginBottom:16, flexWrap:'wrap' }}>
          <Input
            prefix={<SearchOutlined style={{ color:'#9CA3AF' }} />}
            placeholder="Search by name, collection name or collection ID"
            value={searchInput} onChange={handleSearchChange} allowClear
            style={{ flex:1, minWidth:280 }}
          />
          <Select
            value={navFilter}
            onChange={v => { setNavFilter(v || null); if (v) setPreviewNavId(v); }}
            options={navFilterOptions}
            style={{ width:200 }}
            placeholder="All Navigations"
            allowClear
          />
          <Select value={statusFilter} onChange={setStatusFilter} options={statusOptions} style={{ width:140 }} />
        </div>

        <Card style={CARD_STYLE} styles={{ body: { padding:0 } }}>
          <Table
            rowKey="id"
            dataSource={filtered}
            columns={columns}
            scroll={{ x:'max-content' }}
            pagination={{ pageSize:20, showTotal: t => t + ' items' }}
            styles={TABLE_STYLES}
            locale={{ emptyText: (
              <div style={{ padding:'40px 20px', textAlign:'center' }}>
                <AppstoreOutlined style={{ fontSize:32, color:'#D1D5DB', marginBottom:12, display:'block' }} />
                <div style={{ fontSize:14, fontWeight:600, color:'#1F2937', marginBottom:6 }}>No menu items found</div>
                <div style={{ fontSize:13, color:'#6B7280' }}>
                  {q || navFilter || statusFilter !== 'all'
                    ? 'Try adjusting your filters or search query.'
                    : 'Add your first menu item to get started.'}
                </div>
              </div>
            ) }}
          />
        </Card>

        <MenuDrawer
          open={drawerOpen}
          item={editingItem}
          navItems={navItems}
          menuItems={menuItems}
          globalMarket={globalMarket}
          globalChannel={globalChannel}
          globalTerminal={globalTerminal}
          onClose={() => setDrawerOpen(false)}
          onSave={handleSaveItem}
        />
      </div>

      <PhoneShell>
        <PhoneNavGrid
          enabledNavs={enabledNavs}
          previewNavId={effectivePreviewNavId}
          setPreviewNavId={setPreviewNavId}
          menuItems={menuItems}
        />
      </PhoneShell>
    </div>
  );
}

/* ── App ── */
function App() {
  const initMenuItems = buildInitMenuItems();
  const [navItems, setNavItems] = React.useState(INIT_NAVS);
  const [menuItems, setMenuItems] = React.useState(initMenuItems);
  const [itemCounts] = React.useState(() => buildInitItemCounts(initMenuItems));
  const [currentPage, setCurrentPage] = React.useState('navigation');
  const [menuNavFilter, setMenuNavFilter] = React.useState('all');

  /* Global filters — top of hierarchy */
  const [globalMarket, setGlobalMarket] = React.useState('US');
  const [globalChannel, setGlobalChannel] = React.useState('looply_app');
  const [globalTerminal, setGlobalTerminal] = React.useState('app');

  function navigateToMenu(navId) {
    setMenuNavFilter(navId);
    setCurrentPage('menu');
  }

  const siderMenuItems = [
    { key:'navigation', icon:<UnorderedListOutlined />, label:'Navigation' },
    { key:'menu', icon:<AppstoreOutlined />, label:'Menu' },
  ];

  return (
    <ConfigProvider theme={looplyTheme}>
      <Layout style={{ minHeight:'100vh' }}>
        <Layout.Header style={{
          background:'#fff', borderBottom:'1px solid #E5E7EB',
          display:'flex', alignItems:'center', justifyContent:'space-between',
          position:'sticky', top:0, zIndex:100, padding:'0 24px',
        }}>
          {/* Left: logo + title */}
          <div style={{ display:'flex', alignItems:'center', gap:12 }}>
            <img src={LOGO_SRC} alt="Looply" style={{ height:32, display:'block' }} onError={e => { e.target.style.display='none'; }} />
            <span style={{ fontSize:12, color:'#9CA3AF', borderLeft:'1px solid #E5E7EB', paddingLeft:12 }}>Shop Admin</span>
          </div>

        </Layout.Header>

        {/* Global filter bar — highest priority, above all page-level controls */}
        <div style={{
          background:'#F3EEFF', borderBottom:'1px solid #DDD6FE',
          padding:'10px 24px', display:'flex', alignItems:'center', gap:16,
          position:'sticky', top:60, zIndex:99,
        }}>
          <span style={{ fontSize:12, fontWeight:600, color:'#7C3AED', letterSpacing:'0.3px', whiteSpace:'nowrap' }}>Global Context</span>
          <div style={{ width:1, height:16, background:'#C4B5FD' }} />
          <div style={{ display:'flex', alignItems:'center', gap:6 }}>
            <span style={{ fontSize:12, color:'#6B7280' }}>Market</span>
            <Select
              value={globalMarket}
              options={MARKETS}
              onChange={setGlobalMarket}
              style={{ width:148 }}
              size="small"
            />
          </div>
          <div style={{ display:'flex', alignItems:'center', gap:6 }}>
            <span style={{ fontSize:12, color:'#6B7280' }}>Channel</span>
            <Select
              value={globalChannel}
              options={CHANNELS}
              onChange={v => { setGlobalChannel(v); setMenuNavFilter(null); }}
              style={{ width:136 }}
              size="small"
            />
          </div>
          <div style={{ display:'flex', alignItems:'center', gap:6 }}>
            <span style={{ fontSize:12, color:'#6B7280' }}>Terminal</span>
            <Select
              value={globalTerminal}
              options={TERMINALS}
              onChange={setGlobalTerminal}
              style={{ width:90 }}
              size="small"
            />
          </div>
        </div>

        <Layout style={{ height:'calc(100vh - 104px)' }}>
          <Layout.Sider width={220} theme="light" style={SIDER_STYLE}>
            <div style={{ padding:'20px 16px 10px', fontSize:11, fontWeight:600, color:'#9CA3AF', letterSpacing:'0.6px', textTransform:'uppercase' }}>
              Shop
            </div>
            <Menu
              mode="inline"
              selectedKeys={[currentPage]}
              items={siderMenuItems}
              style={{ borderRight:'none' }}
              onClick={({ key }) => {
                if (key === 'menu') setMenuNavFilter('all');
                setCurrentPage(key);
              }}
            />
          </Layout.Sider>

          <Layout.Content style={{ padding:28, overflowY:'auto', background:'#F9FAFB' }}>
            {currentPage === 'navigation' && (
              <NavigationPage
                navItems={navItems}
                setNavItems={setNavItems}
                menuItems={menuItems}
                setMenuItems={setMenuItems}
                itemCounts={itemCounts}
                onNavigateToMenu={navigateToMenu}
                globalMarket={globalMarket}
                globalChannel={globalChannel}
                globalTerminal={globalTerminal}
              />
            )}
            {currentPage === 'menu' && (
              <MenuPage
                navItems={navItems}
                menuItems={menuItems}
                setMenuItems={setMenuItems}
                itemCounts={itemCounts}
                initialNavFilter={menuNavFilter}
                globalMarket={globalMarket}
                globalChannel={globalChannel}
                globalTerminal={globalTerminal}
              />
            )}
          </Layout.Content>
        </Layout>
      </Layout>
    </ConfigProvider>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
