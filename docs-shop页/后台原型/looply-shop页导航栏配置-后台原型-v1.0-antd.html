    function stripEmbeddedShell(frame) {
      try {
        const doc = frame.contentDocument;
        if (!doc) return;
        const style = doc.createElement('style');
        style.textContent = `
          html,body,#root{height:100%!important;min-height:100%!important}
          [class*="ant-layout-header"],[class*="ant-layout-sider"]{display:none!important}
          [class*="ant-layout"]{min-height:100%!important;height:100%!important}
          [class*="ant-layout-content"]{padding-top:20px!important}
        `;
        doc.head.appendChild(style);
        const all = Array.from(doc.body.querySelectorAll('div,section'));
        all.forEach(el => {
          const own = Array.from(el.childNodes).filter(n => n.nodeType === 3).map(n => n.textContent).join(' ').trim();
          if (/全局筛选|Global Context|国家|Country/.test(own) && el.querySelector('[class*="ant-select"]')) el.style.display = 'none';
        });
      } catch (e) {
        console.warn('Embedded prototype shell could not be simplified.', e);
      }
    }

        setValidated(true);
        if (valid) message.success('目标配置校验通过');

      };

    function PcRecommendations({contextKey}) {

    function SimplePage({ title }) { return <div style={{margin:20,padding:28,background:'#fff',border:'1px solid #E5E7EB',borderRadius:10}}><div style={{fontSize:20,fontWeight:700}}>{title}</div><div style={{fontSize:13,color:'#6B7280',marginTop:8}}>沿用测试后台现有入口，本次只还原导航位置，不调整业务规则。</div></div> }

    function BannerCreatePage({ onBack }) {
      const [bannerConfig,setBannerConfig]=React.useState({English:{uploaded:true,landingPage:'The Fall Edit',title:'',subtitle:'',titleColor:'#FFFFFF',subtitleColor:'#5F5F5F',buttonText:''},Español:{uploaded:false,landingPage:'The Fall Edit',title:'',subtitle:'',titleColor:'#FFFFFF',subtitleColor:'#5F5F5F',buttonText:''},Français:{uploaded:false,landingPage:'The Fall Edit',title:'',subtitle:'',titleColor:'#FFFFFF',subtitleColor:'#5F5F5F',buttonText:''}});
      const [targetType,setTargetType]=React.useState('collection');
      const langs=Object.keys(bannerConfig);
      const count=Object.values(bannerConfig).filter(x=>x.uploaded).length;
      const updateLang=(lang,field,value)=>setBannerConfig(v=>({...v,[lang]:{...v[lang],[field]:value}}));
      return <div style={{display:'grid',gridTemplateColumns:'minmax(620px,1fr) minmax(420px,.8fr)',height:'100%',background:'#F5F6F8',overflow:'auto'}}>
        <div style={{background:'#fff',padding:24}}>
          <div style={{display:'flex',justifyContent:'space-between',borderBottom:'1px solid #E5E7EB',paddingBottom:16,marginBottom:18}}>
            <div><div style={{fontSize:18,fontWeight:700}}>新增首页 Banner</div><div style={{fontSize:12,color:'#6B7280',marginTop:6}}>首页配置 / Banner 多语言整图</div></div>
            <Space><Tag color="warning">草稿</Tag><Button onClick={onBack}>返回配置列表</Button><Button type="primary" onClick={()=>message.success('Banner 配置已保存')}>保存</Button></Space>
          </div>
          <div style={{fontWeight:600,fontSize:15,borderBottom:'1px solid #E5E7EB',paddingBottom:10}}>基本信息（已锁定）</div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10,margin:'14px 0 22px'}}>{['国家 United States (US)','渠道 美国官方商城','终端 PC端','坑位 首页 Banner'].map(x=><div key={x} style={{padding:11,border:'1px solid #E5E7EB',borderRadius:8,color:'#6B7280',fontSize:12}}>{x}</div>)}</div>
          <div style={{fontWeight:600,fontSize:15,borderBottom:'1px solid #E5E7EB',paddingBottom:10}}>素材与内容</div>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:12,color:'#6B7280',margin:'14px 0 8px'}}><span>当前终端已启用 3 种语言，共需 3 张图片</span><Tag color="error">{count}/3 已上传</Tag></div>
          <div style={{height:6,background:'#F3F4F6',borderRadius:4,marginBottom:14}}><div style={{width:`${count/3*100}%`,height:6,background:'#1677ff',borderRadius:4}} /></div>
          <div style={{border:'1px solid #E5E7EB',borderRadius:10,overflow:'hidden'}}>
            <div style={{padding:'12px 14px',fontWeight:600,background:'#FAFAFA'}}>Mobile 图片 <span style={{float:'right',fontWeight:400,fontSize:11,color:'#6B7280'}}>建议上传 880×644px（2x） · 展示基准 440×322px</span></div>
            {langs.map(lang=>{const item=bannerConfig[lang]; return <div key={lang} style={{padding:14,borderTop:'1px solid #F3F4F6'}}><div style={{display:'flex',alignItems:'center',gap:14}}><div style={{width:88,fontWeight:600,fontSize:13}}><span style={{color:'#A50021'}}>*</span> {lang}<div style={{fontSize:11,color:'#9CA3AF',marginTop:6}}>{item.uploaded?'已上传':'待上传'}</div></div>{item.uploaded?<div style={{height:72,width:180,borderRadius:8,background:'linear-gradient(135deg,#D9D8EE,#A8A7D0)'}}/>:<div style={{height:72,flex:1,border:'1px dashed #D1D5DB',borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',color:'#9CA3AF'}}>暂无图片</div>}<Button type={item.uploaded?'default':'primary'} onClick={()=>updateLang(lang,'uploaded',true)}>{item.uploaded?'替换图片':'上传图片'}</Button></div><div style={{margin:'14px 0 0 102px',padding:'14px 16px',background:'#FAFAFA',border:'1px solid #E5E7EB',borderRadius:8}}><div style={{fontSize:12,fontWeight:600,color:'#374151',marginBottom:12}}>图片文字配置（{lang}）</div><div style={{display:'grid',gridTemplateColumns:'86px 1fr',gap:'10px 12px',alignItems:'center'}}><label style={{fontSize:12,color:'#6B7280'}}>标题</label><Input size="small" value={item.title} placeholder="可选，覆盖图片内标题" onChange={e=>updateLang(lang,'title',e.target.value)}/><label style={{fontSize:12,color:'#6B7280'}}>副标题</label><Input size="small" value={item.subtitle} placeholder="可选，覆盖图片内副标题" onChange={e=>updateLang(lang,'subtitle',e.target.value)}/><label style={{fontSize:12,color:'#6B7280'}}>标题颜色</label><Radio.Group value={item.titleColor} onChange={e=>updateLang(lang,'titleColor',e.target.value)} style={{display:'flex',flexWrap:'wrap',gap:'4px 10px'}}><Radio value="#FFFFFF">白色 #ffffff</Radio><Radio value="#070707">黑色 #070707</Radio><Radio value="#5F5F5F">灰色 #5F5F5F</Radio><Radio value="custom">其他</Radio></Radio.Group><label style={{fontSize:12,color:'#6B7280'}}>副标题颜色</label><Radio.Group value={item.subtitleColor} onChange={e=>updateLang(lang,'subtitleColor',e.target.value)} style={{display:'flex',flexWrap:'wrap',gap:'4px 10px'}}><Radio value="#FFFFFF">白色 #ffffff</Radio><Radio value="#070707">黑色 #070707</Radio><Radio value="#5F5F5F">灰色 #5F5F5F</Radio><Radio value="custom">其他</Radio></Radio.Group><label style={{fontSize:12,color:'#6B7280'}}>按钮文案</label><Input size="small" value={item.buttonText} placeholder="可选，例如 Shop now" onChange={e=>updateLang(lang,'buttonText',e.target.value)}/></div><div style={{fontSize:11,color:'#9CA3AF',marginTop:10}}>留空时不叠加该字段，图片内已有文字继续保留；填写后以前台配置文案为准。</div></div></div>})}
          </div>
          <div style={{display:'grid',gridTemplateColumns:'86px 1fr',alignItems:'center',gap:10,marginTop:14,marginBottom:12}}><label><span style={{color:'#A50021'}}>*</span>目标类型</label><Select value={targetType} onChange={setTargetType} options={[{value:'collection',label:'Collection'},{value:'url',label:'自定义链接'}]}/></div>
          {targetType==='collection'?<div style={{display:'grid',gridTemplateColumns:'86px 1fr',alignItems:'center',gap:10,marginBottom:12}}><label><span style={{color:'#A50021'}}>*</span>关联合集</label><Select placeholder="请选择 Collection" options={[{value:'summer',label:'Summer Edit'},{value:'fall',label:'The Fall Edit'}]}/></div>:<div style={{display:'grid',gridTemplateColumns:'86px 1fr',alignItems:'center',gap:10,marginBottom:12}}><label><span style={{color:'#A50021'}}>*</span>目标 URL</label><Input placeholder="https://..."/></div>}
          <div style={{display:'grid',gridTemplateColumns:'86px 1fr 88px',alignItems:'center',gap:10,marginTop:10}}><label>图片 Alt</label><Input placeholder="点击自动填充" maxLength={125}/><Button>自动填充</Button></div>
          <div style={{fontSize:12,color:'#9CA3AF',margin:'6px 0 14px 86px'}}>图片 SEO 描述文案，≤125 字符</div>
          <div style={{fontWeight:600,fontSize:15,borderBottom:'1px solid #E5E7EB',paddingBottom:10}}>上线状态</div>
          <div style={{display:'flex',alignItems:'center',gap:12,paddingTop:14}}>是否上线 <Switch checked={false} onChange={()=>message.info('已切换上线状态')}/> <span style={{fontSize:12,color:'#6B7280'}}>当前配置将在 C 端展示</span></div>
        </div>
        <div style={{padding:'48px 24px',background:'#F5F6F8'}}><div style={{textAlign:'center',fontSize:12,color:'#9CA3AF',marginBottom:12}}>实时预览 · 上线后前台同步</div><div style={{width:360,margin:'0 auto',border:'10px solid #1F2937',borderRadius:32,overflow:'hidden',background:'#fff'}}><div style={{height:34,padding:'10px 18px',fontSize:11}}>LOOPLY　⌕　♡　🛒</div><div style={{height:190,background:'linear-gradient(135deg,#D9D8EE,#A8A7D0)'}}/><div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',padding:14,fontSize:10,textAlign:'center',color:'#8F001D'}}>♢　♧　♢　☆</div><div style={{padding:14,fontWeight:600,color:'#9CA3AF'}}>Collections</div><div style={{height:120,margin:14,borderRadius:10,background:'#E5E7EB'}}/></div></div>
      </div>;
    }

    function GenericCreatePage({ type, onBack }) { const [target,setTarget]=React.useState('collection'); const [form]=Form.useForm(); const isPc=type==='pc'; return <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.35)',zIndex:20}}><div style={{position:'absolute',right:0,top:0,bottom:0,width:480,background:'#fff',overflow:'auto'}}><div style={{padding:'18px 24px',borderBottom:'1px solid #E5E7EB',fontSize:16,fontWeight:700}}>×　新增一级导航</div><div style={{padding:'22px 24px'}}><Form form={form} layout="vertical" onFinish={()=>{message.success('一级导航已保存');onBack()}}><Form.Item label="国家 (Country)"><Select disabled value="US" options={COUNTRY_OPTIONS}/></Form.Item><Form.Item label="渠道 (Channel)"><Select disabled value="official" options={CHANNEL_OPTIONS}/></Form.Item><Form.Item label="终端 (Terminal)"><Tag>PC</Tag></Form.Item><Form.Item label="名称 (Name)" name="name" rules={[{required:true,message:'请输入名称'}]}><Input placeholder="Bags"/></Form.Item><Form.Item label="导航层级" name="level" initialValue="两级" required><Radio.Group options={['直跳','两级','三级（Mega）']}/></Form.Item><Form.Item label="目标类型" required><Select value={target} onChange={setTarget} options={[{value:'collection',label:'Collection'},{value:'url',label:'自定义 URL'}]}/></Form.Item>{target==='collection'?<Form.Item label="关联合集" name="collection" rules={[{required:true,message:'请选择合集'}]}><Select placeholder="搜索合集..." options={[{value:'bags',label:'Bags'},{value:'new-arrivals',label:'New Arrivals'}]}/></Form.Item>:<Form.Item label="目标 URL" name="url" rules={[{required:true,message:'请输入 URL'}]}><Input placeholder="https://..."/></Form.Item>}<Form.Item label="状态" name="enabled" valuePropName="checked"><Switch checkedChildren="启用" unCheckedChildren="停用"/></Form.Item><div style={{display:'flex',justifyContent:'flex-end',gap:8,marginTop:28}}><Button onClick={onBack}>取消</Button><Button type="primary" htmlType="submit">保存</Button></div></Form></div></div></div>; }

    function CmsApp() {
      const [active, setActive] = React.useState(getRoute);
      const [contexts, setContexts] = React.useState(defaultContexts);
      const [loading, setLoading] = React.useState(true);
      const [homeTab, setHomeTab] = React.useState('banner');
      const [creatingBanner, setCreatingBanner] = React.useState(false);
      const [creatingPage, setCreatingPage] = React.useState(null);
      const [shopNav, setShopNav] = React.useState(null);
      const current = contexts[active];

      React.useEffect(() => {
        const onHash = () => { setActive(getRoute()); setLoading(true); };
        window.addEventListener('hashchange', onHash);
        if (!window.location.hash) window.history.replaceState(null, '', '#/home');
        return () => window.removeEventListener('hashchange', onHash);
      }, []);

      const go = key => {
        if (key === active) return;
        window.location.hash = '/' + key;
      };
      const updateContext = (field, value) => {
        setContexts(prev => ({
          ...prev,
          [active]: { ...prev[active], [field]:value, revision:prev[active].revision + 1 },
        }));
        setLoading(true);
        message.success(`${PAGES[active].label}已切换${field==='country'?'国家':field==='channel'?'渠道':'终端'}`);
      };

      const items = [
        { key:'product', icon:<FileTextOutlined />, label:<span style={{fontWeight:active==='product'?600:400}}>商详页配置</span> },
        { key:'home', icon:<HomeOutlined />, label:<span style={{fontWeight:active==='home'?600:400}}>首页配置</span> },
        { key:'shop', icon:<ShopOutlined />, label:<span style={{fontWeight:active==='shop'?600:400}}>Shop配置</span> },
        { key:'pc', icon:<ApartmentOutlined />, label:<span style={{fontWeight:active==='pc'?600:400}}>PC导航配置</span> },
        { key:'collection', icon:<ShopOutlined />, label:<span style={{fontWeight:active==='collection'?600:400}}>Collection管理</span> },
        { key:'footer', icon:<FileTextOutlined />, label:<span style={{fontWeight:active==='footer'?600:400}}>Footer配置</span> },
      ];
      const frameKey = `${active}-${current.revision}`;

      return (
        <ConfigProvider theme={looplyTheme}>
          <AntApp>
            <Layout style={{height:'100vh'}}>
              <Layout.Header style={{borderBottom:'1px solid #E5E7EB',display:'flex',alignItems:'center'}}>
                <div aria-label="Looply" style={{display:'flex',alignItems:'center',gap:28,color:'#111827'}}><span style={{fontFamily:'Arial, sans-serif',fontSize:28,fontWeight:400,letterSpacing:1.5,lineHeight:1}}>LOOPLY</span><span aria-hidden="true" style={{fontSize:15,lineHeight:1}}>♧</span></div>
                <div style={{width:1,height:20,background:'#E5E7EB',margin:'0 16px'}} />
                <span style={{fontSize:14,fontWeight:500,color:'#6B7280'}}>CMS 管理系统</span>
                <span style={{marginLeft:'auto',fontSize:13,color:'#6B7280'}}>baixue02</span>
              </Layout.Header>
              <Layout style={{minHeight:0}}>
                <Layout.Sider width={220} theme="light" style={{boxShadow:'3px 0 12px rgba(0,0,0,.06)',padding:'8px 0',overflowY:'auto'}}>
                  <Menu mode="inline" items={items} selectedKeys={[active]} onClick={({key}) => go(key)} style={{borderInlineEnd:'none'}} />
                </Layout.Sider>
                <Layout.Content style={{display:'flex',flexDirection:'column',minWidth:0,minHeight:0,overflow:'hidden'}}>
                  <div className="lp-context-bar" aria-label={`${PAGES[active].label}配置范围`}>
                    <span className="lp-context-title">配置范围</span>
                    <label className="lp-filter">
                      <span className="lp-filter-label">国家</span>
                      <Select aria-label="国家" value={current.country} options={COUNTRY_OPTIONS} onChange={v => updateContext('country', v)} style={{width:200}} size="small" />
                    </label>
                    <label className="lp-filter">
                      <span className="lp-filter-label">渠道</span>
                      <Select aria-label="渠道" value={current.channel} options={CHANNEL_OPTIONS} onChange={v => updateContext('channel', v)} style={{width:190}} size="small" />
                    </label>
                    <label className="lp-filter">
                      <span className="lp-filter-label">终端</span>
                      <Select aria-label="终端" value={current.terminal} options={TERMINAL_OPTIONS} onChange={v => updateContext('terminal', v)} style={{width:130}} size="small" />
                    </label>
                  </div>
                  {active === 'home' && <HomeTabs value={homeTab} onChange={tab => { setHomeTab(tab); setLoading(tab === 'banner'); }} />}
                  {active === 'footer' ? <FooterPanel context={current} onLanguageChange={v => updateContext('language', v)} /> : active === 'home' && homeTab === 'collection' ? <HomeCollectionPanel country={current.country} /> : active === 'home' && homeTab === 'seo' ? <HomePlaceholder kind="seo" /> : active === 'home' ? (creatingBanner ? <BannerCreatePage onBack={() => setCreatingBanner(false)} /> : <HomeBannerPanel country={current.country} onCreate={() => setCreatingBanner(true)} />) : active === 'shop' ? (shopNav ? <ShopNavDetail name={shopNav.name} level={shopNav.level} style={shopNav.style} onBack={() => setShopNav(null)} /> : (creatingPage === 'shop' ? <GenericCreatePage type="shop" onBack={() => setCreatingPage(null)} /> : <ShopPage country={current.country} onCreate={() => setCreatingPage('shop')} onOpenNav={(name,level,style) => {setCreatingPage(null);setShopNav({name,level,style})}} />)) : active === 'pc' ? (creatingPage === 'pc' ? <GenericCreatePage type="pc" onBack={() => setCreatingPage(null)} /> : <PcPage country={current.country} onCreate={() => setCreatingPage('pc')} />) : <SimplePage title={PAGES[active].title} />}
                </Layout.Content>
              </Layout>
            </Layout>
          </AntApp>
        </ConfigProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<CmsApp />);
  </script>
</body>
</html>
