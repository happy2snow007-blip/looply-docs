<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Looply 搜索 PRD</title>
  <style>
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f6f7f9;color:#24252a;font:14px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.topbar{position:sticky;top:0;z-index:10;height:50px;padding:0 22px;border-bottom:1px solid #e5e7eb;background:#fff;display:flex;align-items:center;gap:10px}.topbar a{color:#24252a;text-decoration:none;font-weight:700}.title{font-weight:650}.tag{padding:2px 9px;border-radius:999px;background:#ede9fe;color:#6332fb;font-size:11px}.layout{max-width:1180px;margin:auto;display:grid;grid-template-columns:250px minmax(0,1fr)}.toc{position:sticky;top:50px;height:calc(100vh - 50px);overflow:auto;padding:24px 16px;border-right:1px solid #e5e7eb;background:#fff}.toc strong{display:block;margin:0 8px 10px;color:#999;font-size:11px;letter-spacing:.08em}.toc a{display:block;padding:4px 8px;border-radius:4px;color:#666;text-decoration:none;font-size:12px}.toc a[data-level="3"]{padding-left:22px;color:#888}.toc a:hover{background:#f0edff;color:#6332fb}.article{min-width:0;margin:28px;padding:36px 44px;border:1px solid #eceef2;border-radius:10px;background:#fff}.article h1{margin:0 0 24px;padding-bottom:12px;border-bottom:2px solid #6332fb;font-size:28px}.article h2{margin:32px 0 12px;font-size:22px}.article h3{margin:26px 0 10px;font-size:17px}.article p{margin:8px 0}.article ul,.article ol{padding-left:24px}.article table{width:100%;margin:14px 0;border-collapse:collapse;font-size:13px}.article th,.article td{padding:8px 10px;border:1px solid #e3e5e9;text-align:left;vertical-align:top}.article th{background:#f8f9fb}.article code{padding:2px 5px;border-radius:4px;background:#f1f3f6;font-family:"SFMono-Regular",Consolas,monospace;font-size:12px}.article blockquote{margin:12px 0;padding:8px 14px;border-left:3px solid #6332fb;background:#faf9ff;color:#666}.loading{padding:80px;text-align:center;color:#999}@media(max-width:760px){.layout{display:block}.toc{display:none}.article{margin:0;padding:24px 16px;border:0;border-radius:0}.topbar{padding:0 14px}}
  </style>
</head>
<body>
  <header class="topbar"><a href="../../index.html">Looply</a><span>/</span><span class="title">搜索 PRD</span><span class="tag">v0.3</span></header>
  <main class="layout"><nav class="toc"><strong>目录</strong><div id="toc"></div></nav><article class="article" id="article"><div class="loading">加载中…</div></article></main>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    fetch('latest.md',{cache:'no-store'}).then(function(response){if(!response.ok)throw new Error(response.status);return response.text()}).then(function(md){var article=document.getElementById('article');article.innerHTML=marked.parse(md);var toc=document.getElementById('toc');article.querySelectorAll('h1,h2,h3').forEach(function(heading,index){heading.id='section-'+index;var link=document.createElement('a');link.href='#'+heading.id;link.textContent=heading.textContent;link.dataset.level=heading.tagName.slice(1);toc.appendChild(link)})}).catch(function(){document.getElementById('article').innerHTML='<div class="loading">PRD 加载失败，请稍后重试。</div>'});
  </script>
</body>
</html>
