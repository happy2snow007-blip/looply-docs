<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Looply · Global Search UI Review v0.1</title>
  <style>
    :root{
      --ink:#17171a;
      --muted:#85858f;
      --line:#e2e2e8;
      --canvas:#ececf0;
      --panel:#fff;
      --soft:#f7f6fb;
      --accent:#6432fc;
      --accent-soft:#f1edff;
      --warning:#9b5c00;
      --warning-soft:#fff5df;
    }
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0}
    body{min-width:820px;overflow:hidden;background:var(--canvas);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}
    button{font:inherit}
    .review-layout{display:grid;grid-template-columns:minmax(414px,1fr) 380px;gap:18px;width:100%;height:100%;padding:18px}
    .demo-stage{position:relative;min-width:0;height:100%;overflow:hidden;border:1px solid #d9d9df;border-radius:18px;background:#dedee3;box-shadow:0 18px 50px rgba(17,24,39,.1)}
    .demo-stage::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.24) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.24) 1px,transparent 1px);background-size:32px 32px;pointer-events:none}
    .demo-frame-shell{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;padding:18px;overflow:auto}
    .demo-frame{position:relative;display:block;width:100%;height:100%;min-height:680px;border:0;background:#fff;box-shadow:0 16px 44px rgba(17,24,39,.18);transition:width .2s ease,border-radius .2s ease}
    .demo-stage[data-device="mobile"] .demo-frame{width:390px;max-width:100%;height:min(844px,calc(100vh - 36px));border-radius:18px}
    .demo-stage[data-device="pc"] .demo-frame-shell{padding:60px 0 0}
    .demo-stage[data-device="pc"] .demo-frame{min-width:1024px;border-radius:0;box-shadow:none}
    .review-panel{height:100%;min-height:0;padding:22px;border:1px solid var(--line);border-radius:20px;background:var(--panel);box-shadow:0 18px 50px rgba(17,24,39,.12);display:flex;flex-direction:column;overflow:auto}
    .review-panel-kicker{color:#8b5cf6;font-size:10px;font-weight:850;letter-spacing:1.2px;text-transform:uppercase}
    .review-panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-top:6px}
    .review-panel-title{font-size:22px;font-weight:850;line-height:1.2}
    .review-panel-close{width:30px;height:30px;flex:none;border:0;border-radius:50%;background:#f5f5f7;color:#6b7280;font-size:17px;cursor:pointer}
    .platform-switch{position:absolute;left:16px;top:14px;z-index:6;display:grid;grid-template-columns:1fr 1fr;gap:4px;width:224px;padding:4px;border:1px solid rgba(255,255,255,.8);border-radius:11px;background:rgba(23,23,26,.84);box-shadow:0 8px 24px rgba(17,24,39,.2);backdrop-filter:blur(10px)}
    .platform-tab{height:34px;border:0;border-radius:8px;background:transparent;color:rgba(255,255,255,.7);font-size:11px;font-weight:800;cursor:pointer}
    .platform-tab:hover{color:#fff}
    .platform-tab.active{background:#fff;color:var(--accent);box-shadow:0 2px 8px rgba(17,24,39,.16)}
    .review-progress-meta{display:flex;justify-content:space-between;gap:12px;margin-top:18px;color:#8b8b93;font-size:11px;font-weight:700}
    .review-progress{height:5px;margin-top:7px;overflow:hidden;border-radius:99px;background:#ececf1}
    .review-progress-fill{height:100%;border-radius:99px;background:var(--accent);transition:width .2s ease}
    .review-script{margin-top:20px;padding:16px;border-radius:14px;background:var(--soft);color:#374151;font-size:13px;line-height:1.72;white-space:pre-line}
    .review-block{margin-top:18px}
    .review-block-label{margin-bottom:9px;color:#9ca3af;font-size:10px;font-weight:850;letter-spacing:.9px;text-transform:uppercase}
    .review-focus{margin:0;padding:0;list-style:none;display:grid;gap:9px;color:#4b5563;font-size:12px;line-height:1.55}
    .review-focus li{position:relative;padding-left:15px}
    .review-focus li::before{content:"";position:absolute;left:0;top:7px;width:6px;height:6px;border:1.5px solid var(--accent);border-radius:50%}
    .review-actions{display:flex;flex-wrap:wrap;gap:8px}
    .review-action{min-height:34px;padding:7px 10px;border:1px solid #ddd6fe;border-radius:9px;background:#fff;color:var(--accent);font-size:11px;font-weight:750;cursor:pointer}
    .review-action:hover,.review-action.active{background:var(--accent-soft)}
    .review-action:active{transform:translateY(1px)}
    .review-pending{display:none;margin-top:18px;padding:11px 12px;border-radius:10px;background:var(--warning-soft);color:var(--warning);font-size:11px;line-height:1.55}
    .review-pending.show{display:block}
    .review-panel-footer{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:22px}
    .review-nav{height:40px;padding:0 14px;border:1px solid #e5e7eb;border-radius:10px;background:#fff;color:#4b5563;font-size:12px;font-weight:800;cursor:pointer}
    .review-nav.next{flex:1;border-color:var(--accent);background:var(--accent);color:#fff}
    .review-nav:disabled{opacity:.36;cursor:not-allowed}
    .review-show{display:none;position:fixed;right:18px;top:18px;z-index:10;padding:10px 14px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:12px;font-weight:800;box-shadow:0 8px 22px rgba(100,50,252,.25);cursor:pointer}
    body.panel-hidden .review-layout{grid-template-columns:1fr}
    body.panel-hidden .review-panel{display:none}
    body.panel-hidden .review-show{display:block}
    @media(max-width:1000px){.review-layout{grid-template-columns:minmax(400px,1fr) 360px;gap:12px;padding:12px}.review-panel{padding:18px}.demo-frame-shell{padding:12px}}
    @media(prefers-reduced-motion:reduce){.demo-frame,.review-progress-fill{transition:none}}
  </style>
</head>
<body>
  <main class="review-layout">
    <section class="demo-stage" id="demoStage" data-device="mobile" aria-label="Search demo preview">
      <div class="platform-switch" role="tablist" aria-label="选择评审终端">
        <button class="platform-tab active" type="button" role="tab" aria-selected="true" data-platform="mobile">Mobile Web</button>
        <button class="platform-tab" type="button" role="tab" aria-selected="false" data-platform="pc">PC Web</button>
      </div>
      <div class="demo-frame-shell">
        <iframe class="demo-frame" id="demoFrame" title="Looply global search demo"></iframe>
      </div>
    </section>

    <aside class="review-panel" aria-label="Search UI review guide">
      <div class="review-panel-kicker">Search UI Review</div>
      <div class="review-panel-head">
        <div class="review-panel-title" id="reviewTitle">搜索入口</div>
        <button class="review-panel-close" type="button" aria-label="隐藏评审说明" id="hidePanel">×</button>
      </div>
      <div class="review-progress-meta"><span id="reviewCount">1 / 10</span><span>使用 ← → 切换</span></div>
      <div class="review-progress"><div class="review-progress-fill" id="reviewProgress"></div></div>
      <div class="review-script" id="reviewScript"></div>
      <div class="review-block">
        <div class="review-block-label">UI 评审重点</div>
        <ul class="review-focus" id="reviewFocus"></ul>
      </div>
      <div class="review-block" id="reviewActionsBlock">
        <div class="review-block-label">Demo states</div>
        <div class="review-actions" id="reviewActions"></div>
      </div>
      <div class="review-pending" id="reviewPending"></div>
      <div class="review-panel-footer">
        <button class="review-nav" id="reviewPrev" type="button">Previous</button>
        <button class="review-nav next" id="reviewNext" type="button">Next</button>
      </div>
    </aside>
  </main>
  <button class="review-show" id="showPanel" type="button">Show review guide</button>

  <script>
    const SEARCH_DEMO='looply-global-search-web-demo-v0.1.html';
    const FAVORITES_DEMO='../favorites/looply-favorites-prototype-v9.html';
    const combinedReviewSteps=[
      {

        device:'mobile',
        script:'Home / Shop / Favorites｜入口搜索框共用当前 market + locale 的轮播词列表和顺序；点击搜索框进入搜索发现页，并将当下有效词作为 placeholder\nHome 搜索图标｜当前有有效轮播词时直接提交该词\n轮播词不可用｜Home / Shop / Favorites 统一降级为 Search by brand or item\nCollection｜当前页 Header 切换为内联搜索态，搜索图标位于输入框内右侧；空输入保留原商品、Filter、Sort 和滚动位置，不展示搜索发现内容\nCollection 输入｜在 Header 下展示统一 Sug；提交后进入全局搜索结果页',
        focus:['Collection Header 从标题态切换为内联搜索态，以最新 Collection UI 稿为准','Collection 空输入时原列表、Filter、Sort 和滚动位置不变','Collection 清空输入后不转为搜索发现页'],
        actions:[
          {label:'Home entry',device:'mobile',action:'home'},
          {label:'Home discovery',device:'mobile',action:'discovery'},
          {label:'Shop discovery',device:'mobile',action:'discovery'},
          {label:'Collection input',device:'mobile',action:'entry-direct-input'},
          {label:'Favorites entry UI',device:'mobile',source:'favorites'},
          {label:'Favorites discovery',device:'mobile',action:'discovery'}
        ],
        defaultAction:{device:'mobile',action:'home'}
      },
      {
        title:'Mobile 搜索发现页',
        device:'mobile',
        script:'适用入口｜Home、Shop、Favorites；Collection 不使用该初始页\n页面形态｜全屏搜索页\n顶部｜返回按钮 + 搜索框 + 搜索图标\n模块顺序｜Recent → Popular searches → Brands → Categories\n独立降级｜动态模块独立 Loading / 隐藏；固定 Categories 不受动态模块失败影响\n进入后｜自动聚焦并唤起键盘\n空输入、纯空格或纯标点提交｜不请求 Sug、不发搜索请求，Toast 提示 Please enter a brand or item.\n返回｜清空未提交输入，恢复进入搜索前的页面及状态',

        actions:[
          {label:'With history',device:'mobile',action:'discovery'},
          {label:'No history',device:'mobile',action:'discovery-no-history'},
          {label:'Mixed loading',device:'mobile',action:'discovery-loading'},
          {label:'All dynamic empty',device:'mobile',action:'discovery-empty'},

        title:'Recent searches',

        focus:['展开入口必须占据真实位置，不能覆盖词条或单独掉到第三行','词条最大宽度 75%，长词单行省略但点击使用完整词','不同长度 locale 文案下的两行折叠和展开后页面跳动'],
        actions:[
          {label:'Collapsed',device:'mobile',action:'recent-collapsed'},
          {label:'Expanded',device:'mobile',action:'recent-expanded'}
        ],
        defaultAction:{device:'mobile',action:'recent-collapsed'}
      },
      {
        title:'Popular content',
        device:'mobile',
        script:'Popular searches｜按 market + locale 返回并隔离缓存；Mobile Web 最多完整展示 3 行\nPopular brands｜仅按 market 返回和缓存 10 个有序品牌 ID，不按 locale 拆榜；横向滑动，不设 See all\nPopular categories｜前端固定品类 ID 和顺序，横向滑动，不设 See all\n卡片内容｜复用已有图片 + 当前 locale 名称\n独立状态｜代表性 Loading 中仅 Popular brands 展示骨架，Popular searches 和固定 Categories 保持可用',
        focus:['Brands 与 Categories 是否共用图片比例、标题行数和滑动提示','长名称截断、图片裁切及公共缺图占位','横向列表首尾留白、卡片露出量和是否吸附'],
        actions:[
          {label:'Popular content',device:'mobile',action:'discovery'},
          {label:'Loading',device:'mobile',action:'discovery-loading'}
        ],
        defaultAction:{device:'mobile',action:'discovery'}
      },
      {
        title:'Sug 输入联想',
        device:'mobile',
        script:'展示方式｜单列，不分组、不展示分类标题\n顺序｜完全按 Sug 服务返回顺序\nLoading｜3 行同结构轻量骨架\n空结果 / 失败｜保留输入，静默收起，不展示错误或重试\n点击联想｜直接搜索',
        focus:['Sug 行高、图标、文本层级和 hover / pressed / focus','骨架与真实行保持同结构，避免状态切换跳动','空结果或失败后只剩搜索框时的空白区域处理'],
        actions:[
          {label:'Normal',device:'mobile',action:'sug-normal'},
          {label:'Loading',device:'mobile',action:'sug-loading'},
          {label:'Empty',device:'mobile',action:'sug-empty'},
          {label:'Failed',device:'mobile',action:'sug-failed'}
        ],
        defaultAction:{device:'mobile',action:'sug-normal'}
      },
      {
        title:'Mobile 搜索结果页',
        device:'mobile',
        script:'顶部｜返回 + 当前搜索词入口框 + 搜索图标\n重新搜索｜点击入口框或图标进入统一全屏搜索层，带入当前词并展示 Sug\n退出搜索层｜保留原结果、排序、筛选和滚动位置\n结果信息｜Results for “搜索词”, N items\n商品列表｜复用 Collection Mobile 双列商品卡\n商品范围｜只展示当前市场 active 且可售商品，Sold Out 直接排除\n加载｜无限滚动，每页最多 40 个',
        focus:['搜索入口的可点击感，以及进入全屏搜索层的过渡','长搜索词与 Results for 文案的换行和压缩优先级','纠错提示、结果信息和筛选栏的视觉层级','商品卡必须标注复用 Collection 版本，不新建搜索卡片'],
        actions:[
          {label:'Normal',device:'mobile',action:'result-normal'},
          {label:'Correction',device:'mobile',action:'result-hint'}
        ],
        defaultAction:{device:'mobile',action:'result-normal'}
      },
      {
        title:'Mobile Filter / Sort',
        device:'mobile',

        focus:['直接复用 Collection 对应端组件和当前版本','快捷栏横向溢出、选中态和数量状态','抽屉宽度、右侧露出区、底部固定操作栏及安全区'],
        actions:[
          {label:'Quick filters',device:'mobile',action:'result-normal'},
          {label:'Filter drawer',device:'mobile',action:'mobile-filter'},
          {label:'Apply disabled at 0',device:'mobile',action:'filter-zero-selected'},
          {label:'Sort sheet',device:'mobile',action:'mobile-sort'}
        ],
        defaultAction:{device:'mobile',action:'mobile-filter'}
      },
      {
        title:'结果页异常状态',
        device:'mobile',
        script:'首次 Loading｜展示 Results for “搜索词” 与商品骨架\n首次失败｜展示 Results for “搜索词”、加载失败和 Try again\n成功返回｜展示 Results for “搜索词”, N items\n下一页失败｜保留已有商品，在列表末尾展示重试\n搜索无结果｜展示原词、0 items、We couldn’t find any matches、Try searching for a different brand or item.；下方挂载首页 For You，标题为 You May Also Like\n筛选无结果｜展示当前筛选条件、无匹配提示和 Clear filters',

        actions:[
          {label:'First loading',device:'mobile',action:'result-loading'},
          {label:'Request failed',device:'mobile',action:'result-first-failed'},
          {label:'Next failed',device:'mobile',action:'result-next-failed'},
          {label:'Keyword · 0 results',device:'mobile',action:'result-empty'},
          {label:'Recommendation loading',device:'mobile',action:'recommend-loading'},
          {label:'Recommendation hidden',device:'mobile',action:'recommend-unavailable'},
          {label:'Filtered · 0 results',device:'mobile',action:'filter-empty'}

      {

        focus:['真实 locale 文案下文本不遮挡、不溢出、不产生半截词条','补齐键盘焦点、hover、pressed、disabled 和读屏名称','设计稿逐页标注复用组件及版本，避免开发重复实现'],

    const mobileReviewSteps=combinedReviewSteps.filter(step=>step.device==='mobile');
    const pcReviewSteps=[
      {
        title:'PC Header 搜索入口与搜索态',
        device:'pc',
        script:'入口位置｜PC Web 全局 Header\n常态入口｜搜索图标\n点击后｜Header 切换为搜索输入框 + Search + Cancel，下方展示搜索发现内容\n空输入、纯空格或纯标点｜不请求 Sug、不发搜索请求，Toast 提示 Please enter a brand or item.\n退出｜Cancel 或 Esc',

        actions:[
          {label:'Header',device:'pc',action:'home'},
          {label:'Search layer',device:'pc',action:'discovery'},
          {label:'Empty input Toast',device:'pc',action:'input-empty'},
          {label:'Punctuation Toast',device:'pc',action:'input-invalid'}
        ],
        defaultAction:{device:'pc',action:'home'}
      },
      {
        title:'PC 搜索发现层',

        script:'页面形态｜Header 下方展开层\n初始模块｜Recent searches → Popular searches\n不展示｜Popular brands / Popular categories\n无历史｜隐藏 Recent，Popular searches 自动上移\n内容超出｜搜索层内部滚动',

        actions:[

      {

        actions:[

        ],

      },
      {
        title:'PC Sug 输入联想',

        focus:['PC 搜索层内 Sug 行宽、行高和 hover / focus','骨架与真实行同结构，状态切换不跳动','Sug 收起后搜索层空白区域的高度处理'],
        actions:[
          {label:'Normal',device:'pc',action:'sug-normal'},
          {label:'Loading',device:'pc',action:'sug-loading'},

        script:'顶部｜保留全局导航栏及搜索图标，不增加结果页第二套搜索框\n重新搜索｜点击 Header 搜索图标，在导航栏下方展开搜索层\n结果信息｜Results for “搜索词”, N items\n商品列表｜复用 Collection PC 商品卡\n商品范围｜只展示当前市场 active 且可售商品，Sold Out 直接排除\n筛选｜左侧 240px，默认展开\n加载更多｜View More，每次追加 40 个',

    let activePlatform='mobile';
    let reviewSteps=mobileReviewSteps;
    let reviewIndex=0;
    let activeButton=null;
    const frame=document.getElementById('demoFrame');
    const stage=document.getElementById('demoStage');

    function searchUrl(action){return SEARCH_DEMO+'?review_action='+encodeURIComponent(action||'home')}

    function applyAction(action,button){
      activeButton?.classList.remove('active');
      activeButton=button||null;
      activeButton?.classList.add('active');
      const device=action.device||reviewSteps[reviewIndex].device;
      stage.dataset.device=device;
      frame.src=action.source==='favorites'?FAVORITES_DEMO:searchUrl(action.action);
    }

    function renderReviewStep(){
      const step=reviewSteps[reviewIndex];
      document.getElementById('reviewTitle').textContent=step.title;
      document.getElementById('reviewCount').textContent=(reviewIndex+1)+' / '+reviewSteps.length;
      document.getElementById('reviewProgress').style.width=((reviewIndex+1)/reviewSteps.length*100)+'%';
      document.getElementById('reviewScript').textContent=step.script;
      const focus=document.getElementById('reviewFocus');
      focus.innerHTML='';
      step.focus.forEach(item=>{const li=document.createElement('li');li.textContent=item;focus.appendChild(li)});
      const actions=document.getElementById('reviewActions');
      actions.innerHTML='';
      step.actions.forEach(action=>{
        const button=document.createElement('button');
        button.type='button';
        button.className='review-action';
        button.textContent=action.label;
        button.addEventListener('click',()=>applyAction(action,button));
        actions.appendChild(button);
      });
      document.getElementById('reviewActionsBlock').style.display=step.actions.length?'':'none';
      const pending=document.getElementById('reviewPending');
      pending.textContent=step.pending||'';
      pending.classList.toggle('show',Boolean(step.pending));
      document.getElementById('reviewPrev').disabled=reviewIndex===0;
      document.getElementById('reviewNext').disabled=reviewIndex===reviewSteps.length-1;
      document.getElementById('reviewNext').textContent=reviewIndex===reviewSteps.length-1?'Review complete':'Next';
      activeButton=null;
      const defaultAction=step.defaultAction||step.actions[0];
      const defaultIndex=Math.max(0,step.actions.findIndex(action=>action.device===defaultAction.device&&action.action===defaultAction.action&&action.source===defaultAction.source));
      applyAction(defaultAction,actions.children[defaultIndex]||null);
    }

    function changeReviewStep(delta){
      const next=Math.max(0,Math.min(reviewSteps.length-1,reviewIndex+delta));
      if(next===reviewIndex)return;
      reviewIndex=next;
      renderReviewStep();
    }

    function switchPlatform(platform){
      if(platform===activePlatform)return;
      activePlatform=platform;
      reviewSteps=platform==='pc'?pcReviewSteps:mobileReviewSteps;
      reviewIndex=0;
      document.querySelectorAll('.platform-tab').forEach(button=>{
        const active=button.dataset.platform===platform;
        button.classList.toggle('active',active);
        button.setAttribute('aria-selected',String(active));
      });
      renderReviewStep();
    }

    document.getElementById('reviewPrev').addEventListener('click',()=>changeReviewStep(-1));
    document.getElementById('reviewNext').addEventListener('click',()=>changeReviewStep(1));
    document.getElementById('hidePanel').addEventListener('click',()=>document.body.classList.add('panel-hidden'));
    document.getElementById('showPanel').addEventListener('click',()=>document.body.classList.remove('panel-hidden'));
    document.querySelectorAll('.platform-tab').forEach(button=>button.addEventListener('click',()=>switchPlatform(button.dataset.platform)));
    document.addEventListener('keydown',event=>{
      const tag=event.target?.tagName?.toLowerCase();
      if(['input','select','textarea'].includes(tag))return;
      if(event.key==='ArrowRight')changeReviewStep(1);
      if(event.key==='ArrowLeft')changeReviewStep(-1);
    });
    renderReviewStep();
  </script>
