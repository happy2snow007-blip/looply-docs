    .summary{margin-top:15px;padding:14px;border-radius:12px;background:var(--soft);color:#3f3f48;font-size:12px;line-height:1.65}.block{margin-top:17px}.block-label{margin-bottom:8px;color:#9b9ba5;font-size:9px;font-weight:900;letter-spacing:.8px;text-transform:uppercase}.list{margin:0;padding:0;list-style:none;display:grid;gap:8px}.list li{position:relative;padding-left:15px;color:#4c4c56;font-size:11px;line-height:1.5}.list li:before{content:"";position:absolute;left:1px;top:7px;width:5px;height:5px;border:1.5px solid var(--accent);border-radius:50%}.issue{display:none;margin-top:17px;padding:12px 13px;border-radius:11px;background:var(--danger-soft);color:#8f1d13;font-size:11px;line-height:1.55}.issue.show{display:block}.state-buttons{display:flex;flex-wrap:wrap;gap:7px}.state-buttons button{min-height:32px;padding:6px 9px;border:1px solid #ddd6fe;border-radius:8px;background:#fff;color:var(--accent);font-size:9px;font-weight:800;cursor:pointer}.state-buttons button.active,.state-buttons button:hover{background:var(--accent-soft)}

<body>
  <main class="layout">

  <script>
    const SEARCH_DEMO='looply-global-search-web-demo-v0.1.html';
    const steps=[
      {title:'范围与边界',device:'all',status:'confirmed',action:'home',summary:'Web V1 只覆盖 PC Web 与 Mobile Web。两端共用搜索业务规则和数据能力，但入口、页面形态、筛选交互与加载方式分别实现。App 不属于本次开发评审。',logic:['Home、Shop、Collection、Favorites 接入同一全局搜索能力并传递来源页','游客与登录用户均可搜索；身份差异只影响 Recent searches 与 Wishlist 主体','搜推返回最终结果与顺序；Web 负责展示、状态、筛选排序交互和恢复'],acceptance:['PC 与 Mobile 独立入口可访问','所有来源页进入统一搜索能力','App 页面或交互不进入本次验收'],dependencies:['当前 market、locale、渠道与货币上下文','统一身份、搜推、商品、品牌、品类、Collection 公共组件']},
      {title:'Mobile 首页入口与提交',device:'mobile',status:'confirmed',action:'home',summary:'首页搜索框是入口型控件：点击框体进入全屏搜索页；点击右侧图标直接提交当前有效轮播词。',logic:['轮播词与当前 market + locale 的 Popular searches 共用列表和顺序','进入全屏页时输入值保持为空，只把点击当下轮播词带为 placeholder','轮播词缺失或不可用时不请求搜索，Toast：Enter what you\'re looking for.','成功提交轮播词后生成 Recent searches 与 Search event'],acceptance:['点击框体进入全屏搜索页，不直接搜索','点击搜索图标进入对应轮播词结果页','轮播词不可用时保持首页并显示 Toast'],dependencies:['Popular searches 最终有序列表','轮播词内容安全与可用性校验'],states:[['Mobile Home','home'],['Full-screen search','discovery'],['Empty input Toast','input-empty']]},
      {title:'PC Header 搜索层',device:'pc',status:'confirmed',action:'discovery',summary:'PC Header 只展示搜索图标。点击后在导航栏下方展开搜索层，未输入时展示 Recent searches 与 Popular searches。',logic:['Enter 与搜索框内图标提交同一真实输入','空输入或纯空格不请求，显示统一 Toast','Esc 或点击遮罩关闭，未提交输入直接清空','结果页点击 Header 图标复用同一搜索层'],acceptance:['Header、遮罩、搜索层层级正确','关闭后不生成结果 URL、Recent searches 或 Search event','有历史与无历史布局均可用'],dependencies:['PC 全局 Header','Recent searches 与 Popular searches'],states:[['Header','home'],['Search layer','discovery'],['No history','discovery-no-history'],['Empty input Toast','input-empty']]},
      {title:'搜索发现与降级',device:'mobile',status:'pending',action:'discovery',summary:'Mobile 依次展示 Recent、Popular searches、Popular brands、Popular categories；PC 只展示 Recent 与 Popular searches。各动态模块独立加载与降级。',logic:['Recent、Popular searches、Popular brands 使用各自缓存、Loading、空数据与失败状态','Popular categories 由前端固定 ID 和顺序，读取基础品类数据，不请求动态热门数据','单个动态模块不可用时隐藏该模块，其他模块继续展示并自动上移'],acceptance:['单个模块失败不影响输入与其他模块','Mobile 固定 Popular categories 不随动态模块失败消失','切换身份、market 或 locale 后不展示旧语境缓存'],dependencies:['Popular searches/brands 服务','前端固定 Popular categories ID 名单'],states:[['With history','discovery'],['No history','discovery-no-history'],['Loading sample','discovery-loading']],issue:'待修正：当前 Demo 的 discovery Loading / Empty / Failed 会隐藏整个发现区，尚未表达“各模块独立降级”，也会隐藏固定 Popular categories。'},
      {title:'Sug 输入联想',device:'all',status:'confirmed',action:'sug-normal',summary:'有真实输入时隐藏搜索发现内容，接入现有 Sug 服务并按返回相关性顺序单列展示，不分组、不二次排序。',logic:['请求中展示 3 行同结构骨架','空结果或失败时保留输入并静默收起 Sug，不展示错误或 Retry','清空输入后恢复发现内容，迟到结果不得覆盖当前状态','点击 Sug 后直接提交对应搜索'],acceptance:['Normal、Loading、Empty、Failed 四态可分别触发','任何 Sug 状态均允许直接提交当前输入','输入快速变化时只展示最新请求对应结果'],dependencies:['现有 Sug 服务返回最终有序列表'],states:[['Normal','sug-normal'],['Loading','sug-loading'],['Empty','sug-empty'],['Failed','sug-failed']]},
      {title:'Recent 与 Popular content',device:'all',status:'confirmed',action:'recent-collapsed',summary:'Recent searches 最多保存 20 条并按最近时间倒序；PC 与 Mobile 默认均展示 2 行，展开交互分端处理。',logic:['PC 使用 More / Less；Mobile 使用下箭头 / 上箭头','V1 不提供单条删除或清空全部','Mobile Popular searches 最多 3 行；PC 展示服务返回前 10 条','Mobile Popular brands 按 market 返回 10 个；Popular categories 前端固定'],acceptance:['长词单行省略但提交完整值','登录时游客记录复制并合并到账号，最终保留最新 20 条','点击历史、热门词、品牌或品类均生成或更新记录'],dependencies:['anonymous_id / user_id 与账号同步','Popular 冷启动种子清单和固定品类 ID'],states:[['Collapsed','recent-collapsed'],['Expanded','recent-expanded'],['Popular content','discovery']]},
      {title:'搜索结果与商品范围',device:'all',status:'confirmed',action:'result-normal',summary:'结果页复用 Collection 对应终端的商品卡和列表布局。搜索结果与 You May Also Like 只包含当前市场 active 且可售商品。',logic:['Sold Out、下架及不可公开商品直接排除','排除商品不进入结果数、排序、筛选数量或分页','PC 使用 View More，每次追加 40 个；Mobile 无限滚动，每页最多 40 个','结果信息：Results for “query”, N items'],acceptance:['结果数与实际可售结果一致','列表中不存在 Sold Out 卡片','PC/Mobile 商品卡字段与 Collection 当前组件一致'],dependencies:['搜索结果、结果总数和分页','listing 可见性与可售状态','Collection 商品卡和列表组件'],states:[['PC result','result-normal','pc'],['Mobile result','result-normal','mobile'],['Correction','result-hint']]},
      {title:'Filter 与 Sort By',device:'all',status:'blocker',action:'mobile-filter',summary:'Sort By 是两端固定单选入口；Filter 维度、候选值、数量和顺序由搜索接口随当前结果返回。',logic:['PC 侧栏、Mobile 横向栏与 Mobile 抽屉使用同一份有序筛选数据','Mobile 固定展示 Filter、Sort By，其后展示有效维度并横向滑动','筛选候选不收缩；0 数量未选项置灰，已选项保留','Sort By 不属于动态筛选维度，默认 Best Match'],acceptance:['三处维度顺序、候选值和数量完全一致','筛选刷新商品、结果总数与候选数量','调整筛选保留排序；新搜索重置排序和筛选'],dependencies:['搜索接口完整筛选响应','Collection PC/Mobile Filter 与 Sort 组件'],states:[['Mobile Filter','mobile-filter','mobile'],['Mobile Sort','mobile-sort','mobile'],['PC Filter','result-normal','pc'],['PC collapsed','pc-filter-collapsed','pc']],issue:'P0：当前 Demo 的 PC 侧栏、Mobile 横向栏和 Mobile 抽屉使用了三套不同维度与顺序，且未展示候选数量和 0 数量置灰。开发评审前必须统一。'},
      {title:'Loading、失败与 0 结果',device:'all',status:'confirmed',action:'result-loading',summary:'首次请求失败、关键词无结果和筛选无结果是三种不同业务状态，不得互相替代。',logic:['首次失败保留条件，显示加载失败与 Try again，不写 No results','关键词 0 结果保留原词和 0 items，可展示独立 You May Also Like','筛选 0 结果提供 Clear filters，不展示关键词空态或推荐商品','下一批失败保留已有商品，在列表底部重试'],acceptance:['PC/Mobile 空输入、关键词 0、筛选 0、首次失败均有独立入口','You May Also Like 不计入搜索结果数，也不应用本次 Sort / Filter','推荐为空或失败时静默隐藏'],dependencies:['搜索请求状态','独立推荐结果及可售过滤'],states:[['First loading','result-loading'],['Request failed','result-first-failed'],['Next failed','result-next-failed'],['Keyword · 0','result-empty'],['Filtered · 0','filter-empty']]},
      {title:'进入、返回与重新搜索',device:'all',status:'pending',action:'result-normal',summary:'结果页重新搜索使用统一搜索层；从商品详情返回时恢复搜索词、排序、筛选、加载批次与滚动位置。',logic:['Mobile 结果页点击入口框或图标打开全屏搜索层并带入当前词','PC 点击 Header 图标在原结果上方打开搜索层','关闭搜索层保留原结果；提交新词后重置排序和筛选并替换结果','分享 URL 保存搜索目标、非默认排序和已选筛选'],acceptance:['刷新、分享、前进后退可恢复 URL 中的搜索状态','从详情返回恢复列表位置','关闭重新搜索层不丢失原结果'],dependencies:['浏览器 History 与分享 URL','来源页标识和返回策略'],states:[['PC result','result-normal','pc'],['Mobile result','result-normal','mobile'],['Keyword · 0','result-empty','pc']],issue:'待收口：Mobile 分享 URL 直达时没有来源页，顶部返回目标尚未定义；当前 PC 关键词 0 结果的 Search again 也会先清空原结果。'},
      {title:'身份、记录与事件',device:'all',status:'confirmed',action:'discovery',summary:'Recent searches 与 Search event 分别记录；游客按 anonymous_id，登录用户按 user_id，登录时复制合并游客记录。',logic:['Recent 去重键为搜索类型、规范化文案与品牌/品类 ID','搜索结果 0 或请求失败仍记录 Recent 与 Search event','刷新、分享直达和浏览器状态恢复不重复记录','待同步账号记录绑定原 user_id，不得在游客或其他账号下展示'],acceptance:['登录合并后倒序保留最新 20 条','切换账号后旧请求与缓存不进入新主体','同一记录再次搜索更新时间并移到首位'],dependencies:['统一身份和账号云端存储','全局隐私保留、注销与 DSAR 规则']},
      {title:'开发输入与待确认项',device:'all',status:'pending',action:'home',summary:'下列内容不需要重新做产品方案讨论，但必须在联调或提测前提供稳定输入。',logic:['搜索接口返回结果、总数、分页、筛选维度、候选值与数量','Popular searches / brands 支持种子、真实榜单与异常回退','Popular categories 提供稳定 ID 名单和顺序','UI 标注 Collection Filter、Sort 与商品卡的复用版本'],acceptance:['所有动态内容都有空数据、失败与缓存处理','正式清单与 Demo 示例数据明确区分','接口返回结构可覆盖 PRD 的全部用户可见状态'],dependencies:['搜推开发、运营/数据负责人、品牌/品类域、Collection 组件负责人'],issue:'模拟评审剩余：1 个 P0、7 个 P1、2 个 P2。当前最先需要处理的是 Filter Demo 跨制品矛盾，其余问题按评审记录逐项收口。'},
      {title:'开发验收清单',device:'all',status:'confirmed',action:'result-normal',summary:'开发评审通过标准：规则可实现、状态可触发、结果可判定、跨端差异有明确归属，并且 PRD、Demo 与评审说明一致。',logic:['入口、发现、Sug、Recent、Popular、结果、筛选、排序、返回形成完整路径','PC/Mobile 各自覆盖正常、Loading、空数据、失败和恢复','所有确认规则在 Demo 有对应入口或明确注明由接口/公共组件验收'],acceptance:['P0 清零，P1 均有处理结论或明确交付门禁','PRD 与 Demo 无相互矛盾描述','搜推、前端、测试、UI 对依赖与验收范围达成一致'],dependencies:['最终 PRD 基线','修正后的 PC/Mobile Demo','开发接口说明与测试用例']}
    ];
    let filter='all',visibleSteps=steps,stepIndex=0,activeStateButton=null;
    const nav=document.getElementById('reviewNav'),frame=document.getElementById('demoFrame'),stage=document.getElementById('stage');
    const statusText={confirmed:'已确认',pending:'待收口',blocker:'P0 阻塞'};
    function searchUrl(action){return SEARCH_DEMO+'?review_action='+encodeURIComponent(action||'home')}
    function listInto(id,items){const root=document.getElementById(id);root.innerHTML='';items.forEach(item=>{const li=document.createElement('li');li.textContent=item;root.appendChild(li)})}
    function fitFrame(){if(stage.dataset.device==='pc'){const scale=Math.min(1,Math.max(.46,(stage.clientWidth-32)/1280));frame.style.width='1280px';frame.style.minWidth='1280px';frame.style.height=Math.max(760,(stage.clientHeight-70)/scale)+'px';frame.style.zoom=String(scale)}else{frame.style.width='';frame.style.minWidth='';frame.style.height='';frame.style.zoom=''}}
    function openState(state,button){activeStateButton?.classList.remove('active');activeStateButton=button||null;activeStateButton?.classList.add('active');const step=visibleSteps[stepIndex],device=state[2]||step.device;stage.dataset.device=device==='all'?'mobile':device;document.getElementById('stageChip').textContent=(stage.dataset.device==='pc'?'PC WEB':'MOBILE WEB')+' · '+state[0].toUpperCase();frame.src=searchUrl(state[1]);fitFrame()}
    function renderNav(){nav.innerHTML='';visibleSteps.forEach((step,index)=>{const button=document.createElement('button');button.type='button';button.className=index===stepIndex?'active':'';button.innerHTML='<span class="nav-num">'+String(index+1).padStart(2,'0')+'</span><span>'+step.title+'</span><span class="nav-device">'+step.device+'</span>';button.addEventListener('click',()=>{stepIndex=index;renderStep()});nav.appendChild(button)})}
    function renderStep(){const step=visibleSteps[stepIndex];renderNav();document.getElementById('detailTitle').textContent=step.title;const badge=document.getElementById('statusBadge');badge.textContent=statusText[step.status];badge.className='status '+step.status;document.getElementById('summary').textContent=step.summary;listInto('logicList',step.logic);listInto('acceptanceList',step.acceptance);listInto('dependencyList',step.dependencies);const issue=document.getElementById('issueBox');issue.textContent=step.issue||'';issue.classList.toggle('show',Boolean(step.issue));const states=step.states||[[step.device==='pc'?'PC preview':'Mobile preview',step.action,step.device==='all'?'mobile':step.device]];const stateRoot=document.getElementById('stateButtons');stateRoot.innerHTML='';states.forEach((state,index)=>{const button=document.createElement('button');button.type='button';button.textContent=state[0];button.addEventListener('click',()=>openState(state,button));stateRoot.appendChild(button);if(index===0)openState(state,button)});document.getElementById('prevStep').disabled=stepIndex===0;document.getElementById('nextStep').disabled=stepIndex===visibleSteps.length-1;document.getElementById('nextStep').textContent=stepIndex===visibleSteps.length-1?'Review complete':'Next'}
    function applyFilter(value){filter=value;visibleSteps=value==='all'?steps:steps.filter(step=>step.device==='all'||step.device===value);stepIndex=0;document.querySelectorAll('[data-filter]').forEach(button=>button.classList.toggle('active',button.dataset.filter===value));renderStep()}
    document.querySelectorAll('[data-filter]').forEach(button=>button.addEventListener('click',()=>applyFilter(button.dataset.filter)));document.getElementById('prevStep').addEventListener('click',()=>{if(stepIndex>0){stepIndex--;renderStep()}});document.getElementById('nextStep').addEventListener('click',()=>{if(stepIndex<visibleSteps.length-1){stepIndex++;renderStep()}});document.addEventListener('keydown',event=>{if(event.key==='ArrowLeft'&&stepIndex>0){stepIndex--;renderStep()}if(event.key==='ArrowRight'&&stepIndex<visibleSteps.length-1){stepIndex++;renderStep()}});new ResizeObserver(fitFrame).observe(stage);document.getElementById('prdLink').href=location.protocol==='file:'?'../../docs/product/looply-Web全局搜索-PRD-v0.3.md':'../PRD/';renderStep();
  </script>
</body>
