<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <title>Looply · Global Search Development Review v0.1</title>
  <style>
    :root{--ink:#17171a;--muted:#74747f;--line:#e3e3e9;--canvas:#ececf1;--panel:#fff;--soft:#f6f6fa;--accent:#6432fc;--accent-soft:#f0ecff;--ok:#08775b;--ok-soft:#e9f8f3;--warn:#9a5a00;--warn-soft:#fff5df;--danger:#b42318;--danger-soft:#fff0ee}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{min-width:1120px;overflow:hidden;background:var(--canvas);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}button,a{font:inherit}

    .sidebar,.detail{height:100%;min-height:0;border:1px solid var(--line);border-radius:18px;background:var(--panel);box-shadow:0 16px 46px rgba(17,24,39,.09)}
    .sidebar{padding:18px 12px 14px;display:flex;flex-direction:column;overflow:hidden}.brand{padding:0 8px}.brand-mark{font-size:13px;font-weight:900;font-style:italic}.brand-mark i{color:var(--accent);font-style:normal}.brand h1{margin:10px 0 6px;font-size:19px;line-height:1.16}.brand p{margin:0;color:var(--muted);font-size:10px;line-height:1.5}

    .nav-label{padding:0 8px 7px;color:#aaaab3;font-size:9px;font-weight:850;letter-spacing:.8px;text-transform:uppercase}.nav{min-height:0;overflow:auto;padding:0 4px;scrollbar-width:thin}.nav button{width:100%;min-height:39px;margin:2px 0;padding:8px 9px;border:0;border-radius:9px;background:transparent;color:#555560;display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:5px;text-align:left;font-size:10px;font-weight:720;line-height:1.3;cursor:pointer}.nav button:hover{background:#f7f6fb}.nav button.active{background:var(--accent-soft);color:var(--accent)}.nav-num{width:21px;height:21px;border-radius:6px;background:#efeff4;color:#90909a;display:grid;place-items:center;font-size:9px}.nav button.active .nav-num{background:var(--accent);color:#fff}.nav-device{color:#aaaab3;font-size:8px;font-weight:850;text-transform:uppercase}
    .sidebar-footer{margin-top:auto;padding:11px 8px 0;border-top:1px solid #eeeef2;color:#94949e;font-size:9px;line-height:1.5}.sidebar-footer a{color:var(--accent);text-decoration:none;font-weight:800}
    .stage{position:relative;min-width:0;height:100%;overflow:hidden;border:1px solid #d9d9df;border-radius:18px;background:#dedee3;box-shadow:0 16px 46px rgba(17,24,39,.09)}.stage:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.25) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.25) 1px,transparent 1px);background-size:32px 32px;pointer-events:none}.stage-top{position:absolute;left:14px;right:14px;top:12px;z-index:3;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.stage-chip{padding:7px 10px;border-radius:8px;background:rgba(23,23,26,.84);color:#fff;font-size:9px;font-weight:850;letter-spacing:.4px;backdrop-filter:blur(8px)}.stage-note{color:#6e6e77;font-size:9px;font-weight:750}.frame-shell{position:absolute;inset:0;padding:54px 16px 16px;display:flex;align-items:flex-start;justify-content:center;overflow:auto}.demo-frame{display:block;width:100%;height:100%;min-height:680px;border:0;background:#fff;box-shadow:0 16px 42px rgba(17,24,39,.16)}.stage[data-device="mobile"] .demo-frame{width:390px;max-width:100%;height:min(844px,calc(100vh - 84px));border-radius:18px}.stage[data-device="pc"] .frame-shell{justify-content:flex-start}.stage[data-device="pc"] .demo-frame{width:1280px;min-width:1280px;border-radius:0;box-shadow:none;transform-origin:top left}
    .detail{padding:22px;display:flex;flex-direction:column;overflow:auto}.detail-kicker{color:var(--accent);font-size:9px;font-weight:900;letter-spacing:1px;text-transform:uppercase}.detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-top:6px}.detail h2{margin:0;font-size:22px;line-height:1.22}.status{flex:none;padding:5px 8px;border-radius:99px;font-size:9px;font-weight:850}.status.confirmed{background:var(--ok-soft);color:var(--ok)}
    .summary{margin-top:15px;padding:14px;border-radius:12px;background:var(--soft);color:#3f3f48;font-size:12px;line-height:1.65}.block{margin-top:17px}.block-label{margin-bottom:8px;color:#9b9ba5;font-size:9px;font-weight:900;letter-spacing:.8px;text-transform:uppercase}.list{margin:0;padding:0;list-style:none;display:grid;gap:8px}.list li{position:relative;padding-left:15px;color:#4c4c56;font-size:11px;line-height:1.5}.list li:before{content:"";position:absolute;left:1px;top:7px;width:5px;height:5px;border:1.5px solid var(--accent);border-radius:50%}.issue{display:none;margin-top:17px;padding:12px 13px;border-radius:11px;background:var(--danger-soft);color:#8f1d13;font-size:11px;line-height:1.55}.issue.show{display:block}.state-buttons{display:flex;flex-wrap:wrap;gap:7px}.state-buttons button{min-height:32px;padding:6px 9px;border:1px solid #ddd6fe;border-radius:8px;background:#fff;color:var(--accent);font-size:9px;font-weight:800;cursor:pointer}.state-buttons button.active,.state-buttons button:hover{background:var(--accent-soft)}
    .detail-footer{display:flex;gap:8px;margin-top:auto;padding-top:18px}.detail-footer button{height:39px;border:1px solid var(--line);border-radius:9px;background:#fff;color:#555560;font-size:10px;font-weight:850;cursor:pointer}.detail-footer .prev{width:88px}.detail-footer .next{flex:1;border-color:var(--accent);background:var(--accent);color:#fff}.detail-footer button:disabled{opacity:.35;cursor:not-allowed}
    @media(max-width:1280px){.layout{grid-template-columns:210px minmax(410px,1fr) 370px;gap:10px;padding:10px}.detail{padding:18px}.sidebar{padding-left:8px;padding-right:8px}}
  </style>
</head>
<body>
  <main class="layout">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark"><i>⌁</i> LOOPLY</div><h1>Global Search<br>Development Review</h1><p>Web V1 · PRD v0.3<br>PC Web + Mobile Web</p></div>
      <div class="platform-filter" role="tablist" aria-label="筛选评审终端"><button class="active" type="button" data-filter="all">All</button><button type="button" data-filter="pc">PC</button><button type="button" data-filter="mobile">Mobile</button></div>
      <div class="nav-label">Review flow</div><nav class="nav" id="reviewNav" aria-label="开发评审章节"></nav>
      <div class="sidebar-footer">UI 视觉评审继续使用独立版本。<br><a href="looply-global-search-ui-review-v0.1.html">Open UI Review</a> · <a id="prdLink" href="#">Open PRD</a></div>

    </section>
    <aside class="detail" aria-label="开发评审说明">
      <div class="detail-kicker">Development review</div><div class="detail-head"><h2 id="detailTitle">范围与边界</h2><span class="status confirmed" id="statusBadge">已确认</span></div>
      <div class="summary" id="summary"></div>
      <section class="block"><div class="block-label">重点产品逻辑</div><ul class="list" id="logicList"></ul></section>
      <section class="block"><div class="block-label">交互逻辑</div><ul class="list" id="interactionList"></ul></section>
      <section class="block" id="exceptionBlock"><div class="block-label">异常场景与处理</div><ul class="list" id="exceptionList"></ul></section>
      <section class="block" id="statesBlock"><div class="block-label">Demo states</div><div class="state-buttons" id="stateButtons"></div></section>
      <div class="issue" id="issueBox"></div>
      <div class="detail-footer"><button class="prev" id="prevStep" type="button">Previous</button><button class="next" id="nextStep" type="button">Next</button></div>
    </aside>
  </main>
  <script>
    const SEARCH_DEMO='looply-global-search-web-demo-v0.1.html';
    const steps=[
      {title:'范围与共用能力',device:'all',status:'confirmed',action:'home',summary:'Web V1 覆盖 PC Web 和 Mobile Web。各入口复用统一的 Sug、提交与结果能力，入口初始状态和页面形态按来源页与终端分别处理。',logic:['Home、Shop、Collection、Favorites 复用同一 Sug、有效输入提交、搜索结果、Recent searches 和结果异常处理能力','Home、Shop、Favorites 进入搜索发现页；Collection 在当前页切换为内联输入态','游客与登录用户均可搜索；身份差异只影响需要归属用户的数据，不改变搜索与结果逻辑','搜推返回最终结果及顺序；Web 负责展示、状态、筛选排序交互和恢复'],states:[['Mobile home','home','mobile'],['PC header','home','pc']]},
      {title:'Mobile 入口与初始状态',device:'mobile',status:'confirmed',action:'home',summary:'Home、Shop、Favorites 进入搜索发现页；Collection 在当前页切换 Header 为内联搜索态。四个入口后续共用 Sug、搜索提交和结果页。',logic:['Home、Shop、Favorites 共用当前 market + locale 的 Popular searches 轮播列表；有效词作为发现页 placeholder','Home 存在有效轮播词时，点击右侧搜索图标直接提交该词','Collection 内联搜索自动聚焦并唤起键盘；搜索图标位于输入框内右侧','Collection 空输入时保留原商品、Filter、Sort 和滚动位置，不展示发现内容','Collection 输入后在 Header 下展示统一 Sug，提交后进入全局搜索结果页'],states:[['Home · rotating term','home'],['Home · fixed fallback','home-placeholder'],['Discovery entry','discovery'],['Collection · inline input','entry-direct-input']]},
      {title:'PC Header 搜索态',device:'pc',status:'confirmed',action:'discovery',summary:'PC Header 常态展示搜索图标；点击后 Header 切换为搜索输入框、Search 和 Cancel，下方展示搜索发现内容。',logic:['Enter 与 Search 提交同一有效输入','Cancel 或 Esc 退出，未提交输入直接清空','结果页点击 Header 搜索图标复用同一搜索态'],states:[['Header','home'],['Search state','discovery'],['No history','discovery-no-history'],['Empty input Toast','input-empty'],['Punctuation Toast','input-invalid']]},
      {title:'搜索发现与降级',device:'all',status:'confirmed',action:'discovery',summary:'PC 展示 Recent searches 和 Popular searches；Mobile 的 Home、Shop、Favorites 增加 Popular brands 和固定 Popular categories。各动态模块独立加载与降级。',logic:['Recent searches、Popular searches、Popular brands 分别使用自己的缓存、Loading、空数据和失败状态','Popular searches 按 market + locale 隔离缓存；Popular brands 仅按 market 隔离缓存','market 变化后重新读取 Popular searches 和 Popular brands；仅切换 locale 时重新读取 Popular searches，并刷新 Popular brands 的本地化名称','Popular categories 由前端固定 ID 和顺序，不请求动态热门数据','品牌和品类入口向搜索结果传递稳定目标 ID；Demo 使用明确的稳定 mock ID','单个动态模块不可用时仅隐藏该模块，其他内容继续展示'],states:[['Mobile · with history','discovery','mobile'],['Mobile · mixed loading','discovery-loading','mobile'],['Mobile · all dynamic empty','discovery-empty','mobile'],['Mobile · all dynamic failed','discovery-failed','mobile'],['PC · with history','discovery','pc'],['PC · loading','discovery-loading','pc']]},
      {title:'Sug 输入联想',device:'all',status:'confirmed',action:'sug-normal',summary:'有有效输入时隐藏搜索发现内容，按 Sug 服务返回顺序单列展示，不分组或重排。',logic:['请求中展示 3 行轻量骨架','空结果或失败时保留输入并静默收起 Sug','清空输入后按来源恢复初始状态；Collection 仍不展示发现内容','任何 Sug 状态均可直接提交当前有效输入'],states:[['Normal','sug-normal','mobile'],['Loading','sug-loading','mobile'],['Empty','sug-empty','mobile'],['Failed','sug-failed','mobile'],['PC normal','sug-normal','pc']]},
      {title:'Recent 与 Popular content',device:'all',status:'confirmed',action:'recent-collapsed',summary:'Recent searches 最多保存 20 条并按最近时间倒序；PC 与 Mobile 默认均展示 2 行，展开交互分端处理。',logic:['PC 使用 More / Less；Mobile 使用下箭头 / 上箭头','V1 不提供单条删除或清空全部','Mobile Popular searches 最多 3 行；PC 展示服务返回前 10 条','Mobile Popular brands 按 market 返回 10 个；Popular categories 由前端固定'],states:[['Mobile · collapsed','recent-collapsed','mobile'],['Mobile · expanded','recent-expanded','mobile'],['PC · collapsed','recent-collapsed','pc'],['PC · expanded','recent-expanded','pc']]},
      {title:'搜索结果与商品范围',device:'all',status:'confirmed',action:'result-normal',summary:'结果页复用 Collection 对应终端的商品卡和列表布局，只展示当前市场 active 且可售商品。',logic:['Sold Out、下架及不可公开商品直接排除，不进入数量、排序、筛选或分页','PC 使用 View More，每次追加 40 个；Mobile 无限滚动，每页最多 40 个','结果信息为 Results for “query”, N items','仅在搜推返回时展示纠错或推荐词，用户点击后才提交新搜索'],states:[['PC result','result-normal','pc'],['Mobile result','result-normal','mobile'],['Correction','result-hint','mobile']]},
      {title:'Filter 与 Sort By',device:'all',status:'confirmed',action:'mobile-filter',summary:'Sort By 是两端固定单选入口；Filter 维度、候选值、数量和顺序由搜索接口返回。',logic:['PC 侧栏、Mobile 横向栏与 Mobile 抽屉使用同一份搜索响应和顺序','候选集合不收缩；0 数量未选项置灰，已选项数量变为 0 仍保留供取消','Mobile 固定展示 Filter、Sort By，其后展示全部有效维度并横向滑动','V1 排序项为 Newest、Price: Low to High、Price: High to Low，默认 Newest'],states:[['Mobile Filter','mobile-filter','mobile'],['Apply disabled at 0','filter-zero-selected','mobile'],['Mobile Sort','mobile-sort','mobile'],['PC Filter','result-normal','pc'],['PC collapsed','pc-filter-collapsed','pc']]},
      {title:'Loading、失败与 0 结果',device:'all',status:'confirmed',action:'result-loading',summary:'请求失败、关键词无结果和筛选无结果分别使用对应页面状态。',logic:['首次 Loading 展示 Results for “query” 与商品骨架','首次失败展示加载失败与 Try again；下一批失败保留已加载商品并提供重试','关键词 0 结果展示原词、0 items 和空态提示，下方挂载首页 For You 模块，标题为 You May Also Like','推荐数据、顺序、商品卡、加载及状态处理复用首页 For You','筛选 0 结果展示当前筛选条件与 Clear filters'],states:[['First loading','result-loading','mobile'],['Request failed','result-first-failed','mobile'],['Next failed','result-next-failed','mobile'],['Keyword · 0','result-empty','mobile'],['For You loading','recommend-loading','mobile'],['For You unavailable','recommend-unavailable','mobile'],['Filtered · 0','filter-empty','mobile'],['PC states','result-first-failed','pc']]},
      {title:'返回、重新搜索与 URL',device:'all',status:'confirmed',action:'result-normal',summary:'结果页重新搜索使用统一搜索层；刷新、分享和浏览器历史按 URL 恢复搜索状态。',logic:['Mobile 点击结果页词条入口或图标打开全屏搜索层；PC 点击 Header 图标在原结果上方打开搜索层','关闭搜索层保留原结果；提交新词后恢复 Newest、清除旧筛选并替换结果','成功提交后进入可分享 URL；应用筛选或切换排序后同步更新当前 URL','URL 保存搜索目标、已生效筛选和排序；刷新、分享及浏览器前进后退时恢复','刷新或分享进入时从页面顶部加载首批结果；从商品详情返回时恢复列表位置'],states:[['PC result','result-normal','pc'],['Mobile result','result-normal','mobile'],['Keyword · 0','result-empty','pc']]},
      {title:'身份、记录与 Search event',device:'all',status:'confirmed',action:'discovery',summary:'Recent searches 与 Search event 分别记录；游客按 anonymous_id，登录用户按 user_id，登录时复制合并游客记录。',logic:['Recent 按搜索类型、规范化文案和品牌/品类 ID 去重，最多保留 20 条','搜索结果为 0 或请求失败时仍记录 Recent searches 与 Search event','刷新、分享直达和浏览器状态恢复不重复记录','Recent searches 和 Search event 同步失败时绑定原 user_id 排队重试'],states:[['Recent searches','discovery','mobile']]}
    ];
    const interactionMap={
      '范围与共用能力':['四个来源页按各自入口规则进入搜索；有效输入提交后使用同一结果能力','PC 与 Mobile 按各自页面形态展示，搜索提交、记录和结果规则一致'],
      'Mobile 入口与初始状态':['Home、Shop、Favorites 点击入口后进入搜索发现页','Collection 点击 Header 搜索入口后在当前页切换为内联输入态','Collection 空输入保留原列表、筛选和位置，有效输入展示统一 Sug','任一入口提交后进入同一搜索结果页'],
      'PC Header 搜索态':['点击 Header 搜索图标后切换为输入框、Search 和 Cancel','Enter 与 Search 提交同一输入','点击 Cancel 或按 Esc 退出并清空未提交输入'],
      '搜索发现与降级':['点击历史、热门词、品牌或品类后直接搜索','单个模块隐藏后，后续模块自动上移'],
      'Sug 输入联想':['输入有效内容后隐藏搜索发现区并展示 Sug','点击 Sug 直接搜索；也可忽略 Sug 直接提交当前输入','清空后按来源页恢复初始状态'],
      'Recent 与 Popular content':['点击 Recent 重新搜索并将记录移到首位','PC 用 More / Less 展开收起；Mobile 使用上下箭头','点击 Popular 内容直接发起对应搜索'],
      '搜索结果与商品范围':['PC 点击 View More 追加结果；Mobile 上滑自动加载下一页','点击纠错或推荐词后提交新搜索','结果页搜索入口用于重新搜索'],
      'Filter 与 Sort By':['PC 勾选后立即应用；Mobile 在抽屉点击 Apply 后应用','Mobile 横向栏超出屏幕时横向滑动','切换排序或应用筛选后回到列表顶部'],
      'Loading、失败与 0 结果':['首次请求保留页面框架并展示商品骨架','关键词 0 结果通过结果页已有入口重新搜索；筛选 0 结果使用 Clear filters','Try again 使用原条件重新请求'],
      '返回、重新搜索与 URL':['结果页打开搜索层时带入当前词，关闭后保留原结果','提交新词后重置旧筛选并恢复默认排序','筛选或排序生效后同步更新当前 URL','刷新、分享和浏览器前进后退按 URL 恢复；刷新或分享从顶部加载首批结果'],
      '身份、记录与 Search event':['提交搜索后更新当前主体的 Recent searches 并生成 Search event','登录时合并游客记录，相同记录保留较新时间','退出或切换账号后立即切换记录主体']
    };
    const exceptionMap={
      'Mobile 入口与初始状态':['无缓存加载中、空数据、失败或轮播词不可用：展示 Search by brand or item','固定 placeholder 不作为搜索词提交，不生成 Recent searches 或 Search event','Collection 清空输入：保留内联搜索和原页内容，不恢复发现内容'],
      'PC Header 搜索态':['空输入、纯空格或纯标点：不请求 Sug 或发起搜索，提示 Please enter a brand or item.','退出搜索态：不生成结果 URL、Recent searches 或 Search event'],

      'Sug 输入联想':['Sug 空结果或失败：保留输入并静默收起','迟到响应：丢弃，不覆盖最新输入状态','Sug 不可用：仍允许提交当前有效输入'],
      'Recent 与 Popular content':['没有历史：隐藏整个 Recent searches 模块','长词条：界面省略显示，点击仍提交完整内容'],
      '搜索结果与商品范围':['Sold Out、下架或不可公开商品：直接排除','下一页失败：保留已有商品并在列表末尾重试','无更多结果：PC 隐藏 View More，Mobile 停止继续加载'],
      'Filter 与 Sort By':['未选且数量为 0：置灰不可选；已选项数量变为 0：保留并允许取消','Mobile 抽屉预估为 0：Apply 置灰并展示 No items match','已应用条件实际返回 0：进入筛选空态并提供 Clear filters'],
      'Loading、失败与 0 结果':['首次 Loading：展示 Results for “query” 与商品骨架','首次请求失败：展示加载失败与 Try again','关键词无结果：展示原词、0 items、空态提示和标题为 You May Also Like 的首页 For You 模块','筛选无结果：展示当前筛选条件与 Clear filters'],
      '返回、重新搜索与 URL':['关闭重新搜索层：恢复原结果','URL 恢复或浏览器前进后退：不重复生成搜索记录','离开结果页后再打开搜索：按来源页恢复初始状态'],
      '身份、记录与 Search event':['切换主体后旧请求返回：丢弃，不进入新主体','账号同步失败：绑定原 user_id 排队重试，不转成游客记录或事件','搜索请求失败或结果为 0：仍记录已提交搜索及结果状态']
    };
    let filter='all',visibleSteps=steps,stepIndex=0,activeStateButton=null;
    const nav=document.getElementById('reviewNav'),frame=document.getElementById('demoFrame'),stage=document.getElementById('stage');
    const statusText={confirmed:'已确认'};
    function searchUrl(action){return SEARCH_DEMO+'?review_action='+encodeURIComponent(action||'home')}
    function listInto(id,items){const root=document.getElementById(id);root.innerHTML='';items.forEach(item=>{const li=document.createElement('li');li.textContent=item;root.appendChild(li)})}
    function fitFrame(){if(stage.dataset.device==='pc'){const scale=Math.min(1,Math.max(.46,(stage.clientWidth-32)/1280));frame.style.width='1280px';frame.style.minWidth='1280px';frame.style.height=Math.max(760,(stage.clientHeight-70)/scale)+'px';frame.style.zoom=String(scale)}else{frame.style.width='';frame.style.minWidth='';frame.style.height='';frame.style.zoom=''}}
    function openState(state,button){activeStateButton?.classList.remove('active');activeStateButton=button||null;activeStateButton?.classList.add('active');const step=visibleSteps[stepIndex],device=state[2]||step.device;stage.dataset.device=device==='all'?'mobile':device;document.getElementById('stageChip').textContent=(stage.dataset.device==='pc'?'PC WEB':'MOBILE WEB')+' · '+state[0].toUpperCase();frame.src=searchUrl(state[1]);fitFrame()}
    function renderNav(){nav.innerHTML='';visibleSteps.forEach((step,index)=>{const button=document.createElement('button');button.type='button';button.className=index===stepIndex?'active':'';button.innerHTML='<span class="nav-num">'+String(index+1).padStart(2,'0')+'</span><span>'+step.title+'</span><span class="nav-device">'+step.device+'</span>';button.addEventListener('click',()=>{stepIndex=index;renderStep()});nav.appendChild(button)})}
    function renderStep(){const step=visibleSteps[stepIndex];renderNav();document.getElementById('detailTitle').textContent=step.title;const badge=document.getElementById('statusBadge');badge.textContent=statusText[step.status];badge.className='status '+step.status;document.getElementById('summary').textContent=step.summary;listInto('logicList',step.logic);listInto('interactionList',interactionMap[step.title]||[]);const exceptions=exceptionMap[step.title]||[];listInto('exceptionList',exceptions);document.getElementById('exceptionBlock').hidden=!exceptions.length;const issue=document.getElementById('issueBox');issue.textContent=step.issue||'';issue.classList.toggle('show',Boolean(step.issue));const states=step.states||[[step.device==='pc'?'PC preview':'Mobile preview',step.action,step.device==='all'?'mobile':step.device]];const stateRoot=document.getElementById('stateButtons');stateRoot.innerHTML='';states.forEach((state,index)=>{const button=document.createElement('button');button.type='button';button.textContent=state[0];button.addEventListener('click',()=>openState(state,button));stateRoot.appendChild(button);if(index===0)openState(state,button)});document.getElementById('prevStep').disabled=stepIndex===0;document.getElementById('nextStep').disabled=stepIndex===visibleSteps.length-1;document.getElementById('nextStep').textContent=stepIndex===visibleSteps.length-1?'Review complete':'Next'}
    function applyFilter(value){filter=value;visibleSteps=value==='all'?steps:steps.filter(step=>step.device==='all'||step.device===value);stepIndex=0;document.querySelectorAll('[data-filter]').forEach(button=>button.classList.toggle('active',button.dataset.filter===value));renderStep()}
    document.querySelectorAll('[data-filter]').forEach(button=>button.addEventListener('click',()=>applyFilter(button.dataset.filter)));document.getElementById('prevStep').addEventListener('click',()=>{if(stepIndex>0){stepIndex--;renderStep()}});document.getElementById('nextStep').addEventListener('click',()=>{if(stepIndex<visibleSteps.length-1){stepIndex++;renderStep()}});document.addEventListener('keydown',event=>{if(event.key==='ArrowLeft'&&stepIndex>0){stepIndex--;renderStep()}if(event.key==='ArrowRight'&&stepIndex<visibleSteps.length-1){stepIndex++;renderStep()}});new ResizeObserver(fitFrame).observe(stage);document.getElementById('prdLink').href=location.protocol==='file:'?'../../docs/product/looply-Web全局搜索-PRD-v0.3.md':'../PRD/';renderStep();
  </script>
