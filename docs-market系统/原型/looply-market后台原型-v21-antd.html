<head>

<title>Looply MARKET 主数据 后台原型 v21 (antd)</title>

<style>
html,body,#root{height:100%;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F9FAFB;color:#1F2937}
#root::before{content:'正在加载 antd 原型……';position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#9CA3AF;font-size:14px}
#root:not(:empty)::before{display:none}

/* KPI 卡片 */
.lp-kpi{background:linear-gradient(180deg,#FEFCFF 0%,#F3EEFF 100%);border:1px solid #DDD6FE;border-radius:14px;padding:14px 16px}
.lp-kpi .num{font-size:24px;font-weight:700;color:#7C3AED;line-height:1;margin-bottom:6px;font-variant-numeric:tabular-nums}
.lp-kpi .label{font-size:12px;color:#6B7280}

/* 紧凑分页器 */
.lp-pagination{display:flex;align-items:center;justify-content:center;gap:24px;padding:12px 16px;font-size:13px;color:#6B7280}
.lp-pagination .divider{width:1px;height:20px;background:#E5E7EB}

/* 字段提示:虚线下划线 */
.lp-tip-trigger{cursor:help;border-bottom:1px dashed #9CA3AF;padding-bottom:1px}

/* 行内编辑 */
.lp-editable{cursor:pointer;padding:2px 6px;border-radius:6px;border:1px solid transparent;transition:all .15s;display:inline-block;min-width:40px;text-align:right}
.lp-editable:hover{border-color:#DDD6FE;background:#FAF5FF;color:#7C3AED}
.lp-edit-just-saved{color:#16A34A!important;transition:color 1s}

/* 编辑行高亮 */
tr.lp-editing-row>td{background:#FAF5FF!important}
tr.lp-editing-row>td:first-child{box-shadow:inset 3px 0 0 #7C3AED}

/* 提示条 */
.lp-note{padding:14px;border-radius:10px;background:#F3EEFF;border:1px solid #DDD6FE;color:#6D28D9;font-size:12px;line-height:1.8}
.lp-note-sm{padding:10px 14px;background:#F3EEFF;border:1px solid #DDD6FE;border-radius:8px;font-size:12px;color:#6D28D9}

/* 区块小节标题 */
.lp-section-purple{font-size:14px;font-weight:700;color:#7C3AED;margin:0 0 12px}
.lp-section{font-size:15px;font-weight:600;color:#1F2937;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid #E5E7EB}

/* 操作记录区块标题 */
.lp-oplog-title{font-size:14px;font-weight:700;color:#7C3AED;margin:24px 0 12px}

/* 空态 */
.lp-empty{display:flex;flex-direction:column;align-items:center;padding:60px 20px;text-align:center}
.lp-empty .icon{font-size:48px;margin-bottom:16px;color:#9CA3AF}
.lp-empty .icon.err{color:#DC2626}
.lp-empty .title{font-size:16px;font-weight:600;color:#1F2937;margin-bottom:8px}
.lp-empty .desc{font-size:13px;color:#6B7280;margin-bottom:24px;max-width:360px}

/* 表单只读字段网格 */
.lp-form-row{display:flex;gap:16px;margin-bottom:12px;align-items:center}
.lp-form-row:first-of-type{margin-top:8px}
.lp-form-row .lp-form-label{width:96px;text-align:right;color:#6B7280;font-size:13px;flex-shrink:0}
.lp-form-row .lp-form-label .req{color:#DC2626;margin-right:4px}
.lp-form-row .lp-form-control{flex:1}
.lp-helper{font-size:12px;color:#9CA3AF;margin:-4px 0 12px 112px}

/* 详情 preview 区 */
.lp-preview{border:1px solid #E5E7EB;border-radius:14px;padding:16px;background:#fff}
.lp-preview-line{display:flex;justify-content:space-between;gap:20px;padding:10px 0;border-bottom:1px solid #E5E7EB;font-size:13px}
.lp-preview-line:last-child{border-bottom:none}
.lp-preview-line .muted{color:#6B7280}

/* Code 样式 */
.lp-code{font-family:Menlo,Monaco,Consolas,monospace;font-size:12px;color:#374151;background:#F3F4F6;padding:1px 6px;border-radius:4px}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

/* ============ 业务组件 ============ */
function Kpi({ num, label, numStyle, onClick }) {
  return (
    <div className="lp-kpi" style={onClick ? { cursor: 'pointer' } : null} onClick={onClick}>
      <div className="label" style={{ marginBottom: 6 }}>{label}</div>
      <div className="num" style={numStyle}>{num}</div>
    </div>
  );
}

function StatusTag({ variant, children, closable, onClose }) {
  const c = TAG_COLORS[variant] || TAG_COLORS.off;
  return (
    <Tag bordered={false} closable={closable} onClose={onClose}
      style={{ background:c.bg, color:c.color, borderRadius:999, padding:'2px 8px',
               fontSize:12, lineHeight:'18px', marginInlineEnd:4 }}>
      {children}
    </Tag>
  );
}

function TipText({ label, tip }) {
  return (
    <Tooltip title={<div style={{ whiteSpace:'pre-line', lineHeight:1.6 }}>{tip}</div>}
      color="#fff" styles={{ body: { color:'#374151', fontSize:12, padding:'10px 14px' } }}>
      <span className="lp-tip-trigger">{label}</span>
    </Tooltip>
  );
}

function CompactPagination({ total, current=1, pageSize=10, totalPages }) {
  const pages = useMemo(() => {
    const tp = totalPages || Math.ceil(total / pageSize) || 1;
    const out = [{ k:'prev', label:'<', disabled:current===1, arrow:true }];
    if (tp <= 6) for (let i=1; i<=tp; i++) out.push({ k:i, label:i });
    else { out.push({k:1,label:1}); out.push({k:2,label:2}); out.push({k:3,label:3}); out.push({k:'gap',label:'…',disabled:true}); out.push({k:tp,label:tp}); }
    out.push({ k:'next', label:'>', disabled:current===tp, arrow:true });
    return out;
  }, [current, totalPages, total, pageSize]);
  const tp = totalPages || Math.ceil(total / pageSize) || 1;
  return (
    <div className="lp-pagination">
      <span>共 {total.toLocaleString()} 条,每页{' '}
        <Select size="small" value={pageSize} style={{ width:72, marginInline:4 }}
          options={[{value:10,label:10},{value:20,label:20},{value:50,label:50}]} />{' '}条</span>
      <div className="divider" />
      <Space size={2}>
        {pages.map(p => (
          <span key={p.k} style={{
            minWidth:32, height:32, display:'inline-flex', alignItems:'center', justifyContent:'center',
            borderRadius:8, fontSize:13, cursor:p.disabled?'default':'pointer',
            background:p.k===current?'#7C3AED':(p.arrow?'#fff':'transparent'),
            color:p.k===current?'#fff':'#374151',
            border:p.arrow?'1px solid #E5E7EB':'none',
            fontWeight:p.k===current?600:400, opacity:p.disabled?0.35:1,
          }}>{p.label}</span>
        ))}
      </Space>
      <div className="divider" />
      <span>第 {current}/{tp} 页</span>
    </div>
  );
}

}

function EmptyError({ onRetry }) {

function EmptyStateSwitcher({ mode, setMode }) {

}

/* 行内编辑组件(编辑行内直接展示输入控件) */
function InlineEdit({ value, type, options, style }) {
  const [val, setVal] = useState(value);
  if (type === 'number') return <InputNumber size="small" value={val} style={{ width:80, ...style }} onChange={v => setVal(v)} />;
  if (type === 'select') return <Select size="small" value={val} style={{ minWidth:130, ...style }} options={options} onChange={v => setVal(v)} />;
  if (type === 'date') return <DatePicker size="small" value={dayjs(val)} style={{ width:140, ...style }} onChange={(_, ds) => setVal(ds)} />;
  return <Input size="small" value={val} style={{ width:100, ...style }} onChange={e => setVal(e.target.value)} />;
}
function InlineToggle({ value, onLabel='是', offLabel='否' }) {
  const [val, setVal] = useState(value);
  return <span style={{ cursor:'pointer' }} onClick={() => setVal(!val)}><StatusTag variant={val?'on':'off'}>{val ? onLabel : offLabel}</StatusTag></span>;
}

/* 列表页模板 */
function ListPage({ title, desc, headActions, kpis, filters, columns, data, total,
                    entity, createKey, go, scrollX }) {
  const [mode, setMode] = useState('data');
  return (
    <Card style={CARD_STYLE}>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:16, marginBottom:18 }}>
        <div>
          <div style={{ fontSize:20, fontWeight:700, marginBottom:6 }}>{title}</div>
          {desc && <div style={{ color:'#6B7280', fontSize:13 }}>{desc}</div>}
        </div>
        <div>{headActions}</div>
      </div>
      {kpis && (
        <div style={{ display:'grid', gridTemplateColumns:`repeat(${kpis.length},1fr)`, gap:12, marginBottom:18 }}>
          {kpis.map(k => <Kpi key={k.label} num={k.num} label={k.label} />)}
        </div>
      )}
      {filters && mode !== 'zero' && <Space size={12} wrap style={{ marginBottom:16 }}>{filters}</Space>}
      {mode === 'data' && (
        <>
          <Table rowKey={r => r.id || r.code || r.key} columns={columns} dataSource={data}
            pagination={false} styles={TABLE_STYLES}
            scroll={scrollX ? { x: scrollX } : undefined} />
          <CompactPagination total={total || data.length} pageSize={10} />
        </>
      )}
      {mode==='zero'     && <EmptyZero entity={entity} cta={createKey?`新增${entity}`:null} onCta={createKey?(()=>go(createKey)):null} />}
      {mode==='no-match' && <EmptyNoMatch onClear={() => setMode('data')} />}
      {mode==='error'    && <EmptyError onRetry={() => setMode('data')} />}
      <EmptyStateSwitcher mode={mode} setMode={setMode} />
    </Card>
  );
}

function LiveClock({ tz }) {
  const fmt = () => {
    try {
      return new Intl.DateTimeFormat('zh-CN', { timeZone: tz, hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false }).format(new Date());
    } catch (e) { return '—'; }
  };
  const [now, setNow] = useState(fmt());
  useEffect(() => {
    const t = setInterval(() => setNow(fmt()), 1000);
    return () => clearInterval(t);
  }, [tz]);
  return <span style={{ fontVariantNumeric:'tabular-nums', color:'#374151' }}>{now}</span>;
}

        { key: 'market-list-list',   icon: <ShopOutlined />,         label: subLabel('市场管理', 'market-list-list') },
        { key: 'country-list-list',  icon: <GlobalOutlined />,       label: subLabel('国家管理', 'country-list-list') },
        { key: 'timezone-list-list', icon: <ClockCircleOutlined />,  label: subLabel('时区管理', 'timezone-list-list') },
        { key: 'language-list-list', icon: <TranslationOutlined />,  label: subLabel('语言管理', 'language-list-list') },
        { key: 'currency-list-list', icon: <DollarOutlined />,       label: subLabel('货币管理', 'currency-list-list') },
      ],
    },
  ];

  const Cur = PAGES[currentPage] || MarketListPage;

  return (
    <ConfigProvider theme={looplyTheme}>
      <Layout style={{ height: '100vh' }}>
        <Layout.Header style={{ borderBottom: '1px solid #E5E7EB', display:'flex', alignItems:'center' }}>
          <img src={LOGO_SRC} alt="Looply" style={{ height: 32, display: 'block' }} />
          <div style={{ width:1, height:20, background:'#E5E7EB', margin:'0 16px' }} />
          <span style={{ fontSize:14, fontWeight:500, color:'#6B7280' }}>MARKET 主数据</span>
        </Layout.Header>
        <Layout>
          <Layout.Sider width={220} theme="light" style={SIDER_STYLE}>
            <Menu mode="inline" items={menuItems} selectedKeys={[activeKey]}
              defaultOpenKeys={['market']} style={{ borderInlineEnd: 'none' }}
              onClick={({ key }) => go(key)} />
          </Layout.Sider>
          <Layout.Content className="lp-content" style={{ padding:28, overflow:'auto' }}>
            <Cur go={go} />
          </Layout.Content>
        </Layout>
      </Layout>
    </ConfigProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
