<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Looply MARKET主数据后台原型 (Ant Design)</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/dayjs@1/dayjs.min.js"></script>
<script src="https://unpkg.com/antd@5/dist/antd.min.js"></script>
<script src="https://unpkg.com/@ant-design/icons@5/dist/index.umd.min.js"></script>
<script src="https://unpkg.com/@ant-design/pro-components@2/dist/pro-components.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
#root { height: 100vh; }
.logo-area { display: flex; align-items: center; height: 64px; padding: 0 16px; }
.logo-area img { height: 28px; }
.kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
.kpi-card { background: linear-gradient(180deg, #FEFCFF 0%, #F3EEFF 100%); border: 1px solid #DDD6FE; border-radius: 12px; padding: 14px 16px; }
.kpi-num { font-size: 24px; font-weight: 700; color: #7C3AED; }
.kpi-label { font-size: 12px; color: #6B7280; margin-top: 4px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Layout, Menu, Table, Tag, Tabs, Modal, Form, Input, Select, Button, Space,
        Descriptions, Card, Empty, Result, Breadcrumb, ConfigProvider, Steps,
        Avatar, Typography, Divider, message, InputNumber } = antd;
const { Header, Sider, Content } = Layout;
const { AimOutlined, GlobalOutlined, TranslationOutlined, DollarOutlined,
        PlusOutlined, EditOutlined, ArrowLeftOutlined, UnorderedListOutlined } = icons;
const { ProTable, ProDescriptions, ProForm, ProFormText, ProFormSelect,
        ProFormDigit, StepsForm } = ProComponents;
const { useState } = React;
const { Text, Title } = Typography;

// ══════════════════════════════════════════
// 模拟数据
// ══════════════════════════════════════════
const MARKETS = [
  { code: "US", name: "US Market", domain: "looply.com", launch: "2026-06-01", status: "active" },
  { code: "EU", name: "EU Market", domain: "looply.com", launch: "2026-09-01", status: "planning" },
  { code: "APAC", name: "APAC Market", domain: "looply.com", launch: "2027-01-01", status: "planning" },
];

const COUNTRIES = [
  { code: "US", name: "United States", local: "United States", continent: "北美洲", tz: "America/New_York", dial: "+1", currency: "USD", lang: "en", status: "启用" },
  { code: "FR", name: "France", local: "France", continent: "欧洲", tz: "Europe/Paris", dial: "+33", currency: "EUR", lang: "fr", status: "启用" },
  { code: "DE", name: "Germany", local: "Deutschland", continent: "欧洲", tz: "Europe/Berlin", dial: "+49", currency: "EUR", lang: "de", status: "启用" },
  { code: "IT", name: "Italy", local: "Italia", continent: "欧洲", tz: "Europe/Rome", dial: "+39", currency: "EUR", lang: "it", status: "启用" },
  { code: "ES", name: "Spain", local: "España", continent: "欧洲", tz: "Europe/Madrid", dial: "+34", currency: "EUR", lang: "es", status: "启用" },
  { code: "GB", name: "United Kingdom", local: "United Kingdom", continent: "欧洲", tz: "Europe/London", dial: "+44", currency: "GBP", lang: "en", status: "启用" },
  { code: "JP", name: "Japan", local: "日本", continent: "亚洲", tz: "Asia/Tokyo", dial: "+81", currency: "JPY", lang: "ja", status: "启用" },
  { code: "KR", name: "South Korea", local: "대한민국", continent: "亚洲", tz: "Asia/Seoul", dial: "+82", currency: "KRW", lang: "ko", status: "启用" },
  { code: "AU", name: "Australia", local: "Australia", continent: "大洋洲", tz: "Australia/Sydney", dial: "+61", currency: "AUD", lang: "en", status: "启用" },
];

const CURRENCIES = [
  { code: "USD", name: "US Dollar", symbol: "$", pos: "before", decimal: 2, status: "启用" },
  { code: "EUR", name: "Euro", symbol: "€", pos: "before", decimal: 2, status: "启用" },
  { code: "GBP", name: "British Pound", symbol: "£", pos: "before", decimal: 2, status: "启用" },
  { code: "JPY", name: "Japanese Yen", symbol: "¥", pos: "before", decimal: 0, status: "启用" },
  { code: "KRW", name: "South Korean Won", symbol: "₩", pos: "before", decimal: 0, status: "启用" },
  { code: "AUD", name: "Australian Dollar", symbol: "A$", pos: "before", decimal: 2, status: "启用" },
];

const LANGUAGES = [
  { code: "en", name: "English", local: "English", rtl: false, status: "启用" },
  { code: "fr", name: "French", local: "Français", rtl: false, status: "启用" },
  { code: "de", name: "German", local: "Deutsch", rtl: false, status: "启用" },
  { code: "it", name: "Italian", local: "Italiano", rtl: false, status: "启用" },
  { code: "es", name: "Spanish", local: "Español", rtl: false, status: "启用" },
  { code: "ja", name: "Japanese", local: "日本語", rtl: false, status: "启用" },
  { code: "ko", name: "Korean", local: "한국어", rtl: false, status: "启用" },
  { code: "ar", name: "Arabic", local: "العربية", rtl: true, status: "启用" },
];

// Market 详情子数据
const MARKET_COUNTRIES = [
  { code: "FR", name: "France", isPrimary: true, priority: 1, hasDomain: true, domain: "looply.fr", launch: "2026-09-01", status: "筹备中" },
  { code: "DE", name: "Germany", isPrimary: false, priority: 2, hasDomain: true, domain: "looply.de", launch: "2026-09-01", status: "筹备中" },
  { code: "IT", name: "Italy", isPrimary: false, priority: 3, hasDomain: false, domain: "", launch: "2026-10-01", status: "筹备中" },
  { code: "ES", name: "Spain", isPrimary: false, priority: 4, hasDomain: false, domain: "", launch: "2026-10-01", status: "筹备中" },
];
const MARKET_LANGS = [
  { code: "en", name: "English", isDefault: true, priority: 1, status: "筹备中" },
  { code: "fr", name: "French", isDefault: false, priority: 2, status: "筹备中" },
  { code: "de", name: "German", isDefault: false, priority: 3, status: "筹备中" },
  { code: "it", name: "Italian", isDefault: false, priority: 4, status: "筹备中" },
  { code: "es", name: "Spanish", isDefault: false, priority: 5, status: "筹备中" },
];
const MARKET_CURRENCIES = [
  { code: "EUR", name: "Euro", isDefault: true, strategy: "fixed", rate: "1.0", markup: "0%", priority: 1, status: "筹备中" },
  { code: "GBP", name: "British Pound", isDefault: false, strategy: "dynamic", rate: "", markup: "2.5%", priority: 2, status: "筹备中" },
];

// ══════════════════════════════════════════
// 辅助
// ══════════════════════════════════════════
const statusColor = (s) => {
  const map = { "启用": "green", "停用": "default", "active": "green", "planning": "orange", "suspended": "default",
    "运营中": "green", "筹备中": "orange", "已暂停": "default" };
  return map[s] || "default";
};
const marketStatusLabel = (s) => ({ active: "运营中", planning: "筹备中", suspended: "已暂停" }[s] || s);

// ══════════════════════════════════════════
// 市场管理
// ══════════════════════════════════════════
function MarketListPage({ onDetail, onCreate }) {
  const columns = [
    { title: 'Market代码', dataIndex: 'code', render: (t) => <Text strong>{t}</Text>, hideInSearch: true },
    { title: 'Market名称', dataIndex: 'name', hideInSearch: true },
    { title: '上线日期', dataIndex: 'launch', hideInSearch: true },
    { title: '状态', dataIndex: 'status', valueType: 'select',
      fieldProps: { options: [{label:'全部状态',value:''},{label:'运营中',value:'active'},{label:'筹备中',value:'planning'},{label:'已暂停',value:'suspended'}] },
      render: (_, r) => <Tag color={statusColor(r.status)}>{marketStatusLabel(r.status)}</Tag> },
    { title: '搜索', dataIndex: 'keyword', hideInTable: true, fieldProps: { placeholder: '搜索 Market 代码 / 名称' } },
    { title: '操作', key: 'action', hideInSearch: true, render: (_, r) => (
      <Space size="small">
        <Button size="small" onClick={() => onDetail(r)}>查看详情</Button>
        <Button size="small" onClick={onCreate}>编辑</Button>
      </Space>
    )},
  ];
  return (
    <div>
      <div style={{ marginBottom: 16 }}><Title level={4} style={{ margin: 0 }}>市场管理</Title><Text type="secondary">管理 Looply 各销售市场的基础配置</Text></div>
      <div className="kpi-row">
        <div className="kpi-card"><div className="kpi-num">3</div><div className="kpi-label">市场总数</div></div>
        <div className="kpi-card"><div className="kpi-num">1</div><div className="kpi-label">运营中</div></div>
        <div className="kpi-card"><div className="kpi-num">2</div><div className="kpi-label">筹备中</div></div>
        <div className="kpi-card"><div className="kpi-num">0</div><div className="kpi-label">已暂停</div></div>
      </div>
      <ProTable columns={columns} dataSource={MARKETS} rowKey="code" search={{ labelWidth: 'auto', defaultCollapsed: false }}
        toolBarRender={() => [<Button key="c" type="primary" icon={<PlusOutlined />} onClick={onCreate}>新建市场</Button>]}
        headerTitle="市场列表" options={{ reload: false, density: true, setting: true }} pagination={false} />
    </div>
  );
}

// ══════════════════════════════════════════
// 市场详情页（4 Tab）
// ══════════════════════════════════════════
function MarketDetailPage({ market, onBack, onEdit }) {
  const m = market || MARKETS[1];
  const countryColumns = [
    { title: '国家代码', dataIndex: 'code' },
    { title: '国家名称', dataIndex: 'name' },
    { title: '是否主要国家', dataIndex: 'isPrimary', render: (v) => <Tag color={v ? 'green' : 'default'}>{v ? '是' : '否'}</Tag> },
    { title: '优先级', dataIndex: 'priority' },
    { title: '使用独立域名', dataIndex: 'hasDomain', render: (v) => <Tag color={v ? 'green' : 'default'}>{v ? '是' : '否'}</Tag> },
    { title: '独立域名', dataIndex: 'domain', render: (v) => v || '—' },
    { title: '上线日期', dataIndex: 'launch' },
    { title: '状态', dataIndex: 'status', render: (s) => <Tag color={statusColor(s)}>{s}</Tag> },
    { title: '操作', key: 'action', render: () => <Button size="small">编辑</Button> },
  ];
  const langColumns = [
    { title: '语言代码', dataIndex: 'code' },
    { title: '语言名称', dataIndex: 'name' },
    { title: '是否默认', dataIndex: 'isDefault', render: (v) => <Tag color={v ? 'green' : 'default'}>{v ? '是' : '否'}</Tag> },
    { title: '优先级', dataIndex: 'priority' },
    { title: '状态', dataIndex: 'status', render: (s) => <Tag color={statusColor(s)}>{s}</Tag> },
    { title: '操作', key: 'action', render: () => <Button size="small">编辑</Button> },
  ];
  const currColumns = [
    { title: '货币代码', dataIndex: 'code' },
    { title: '货币名称', dataIndex: 'name' },
    { title: '是否默认', dataIndex: 'isDefault', render: (v) => <Tag color={v ? 'green' : 'default'}>{v ? '是' : '否'}</Tag> },
    { title: '汇率策略', dataIndex: 'strategy' },
    { title: '固定汇率', dataIndex: 'rate', render: (v) => v || '—' },
    { title: '加价百分比', dataIndex: 'markup' },
    { title: '优先级', dataIndex: 'priority' },
    { title: '状态', dataIndex: 'status', render: (s) => <Tag color={statusColor(s)}>{s}</Tag> },
    { title: '操作', key: 'action', render: () => <Button size="small">编辑</Button> },
  ];

  const tabItems = [
    { key: 'basic', label: '基本信息', children: (
      <ProDescriptions column={1} bordered size="small"
        dataSource={{ code: m.code, name: m.name, launch: m.launch, status: marketStatusLabel(m.status) }}
        columns={[
          { title: 'Market 代码', dataIndex: 'code' },
          { title: 'Market 名称', dataIndex: 'name' },
          { title: '上线日期', dataIndex: 'launch' },
          { title: '状态', dataIndex: 'status', render: (_, r) => <Tag color={statusColor(m.status)}>{r.status}</Tag> },
        ]}
      />
    )},
    { key: 'country', label: '国家配置', children: (
      <div><Space style={{ marginBottom: 12 }}><Button type="primary" size="small" icon={<PlusOutlined />}>添加国家</Button></Space>
      <Table columns={countryColumns} dataSource={MARKET_COUNTRIES} rowKey="code" pagination={false} size="small" /></div>
    )},
    { key: 'lang', label: '语言配置', children: (
      <div><Space style={{ marginBottom: 12 }}><Button type="primary" size="small" icon={<PlusOutlined />}>添加语言</Button></Space>
      <Table columns={langColumns} dataSource={MARKET_LANGS} rowKey="code" pagination={false} size="small" /></div>
    )},
    { key: 'currency', label: '货币配置', children: (
      <div><Space style={{ marginBottom: 12 }}><Button type="primary" size="small" icon={<PlusOutlined />}>添加货币</Button></Space>
      <Table columns={currColumns} dataSource={MARKET_CURRENCIES} rowKey="code" pagination={false} size="small" /></div>
    )},
  ];

  return (
    <div>
      <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 16 }}>
        <div><Title level={4} style={{ margin: 0 }}>{m.name} 详情</Title></div>
        <Space><Button icon={<ArrowLeftOutlined />} onClick={onBack}>返回列表</Button><Button type="primary" onClick={onEdit}>编辑</Button></Space>
      </div>
      <Tabs items={tabItems} />
    </div>
  );
}

// ══════════════════════════════════════════
// 新建市场（4步向导）
// ══════════════════════════════════════════
function MarketCreatePage({ onBack, onFinish }) {
  const [current, setCurrent] = useState(0);
  const steps = ['基本信息', '国家配置', '语言配置', '货币配置'];

  return (
    <div>
      <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 16 }}>
        <div><Title level={4} style={{ margin: 0 }}>新建市场</Title><Text type="secondary">先创建 Market 基本信息，再逐步完成国家、语言和货币配置。</Text></div>
        <Button icon={<ArrowLeftOutlined />} onClick={onBack}>返回列表</Button>
      </div>
      <Steps current={current} items={steps.map(t => ({ title: t }))} style={{ marginBottom: 24 }} />

      {current === 0 && (
        <Card><Form layout="vertical">
          <Form.Item label="Market 代码"><Input defaultValue="EU" /></Form.Item>
          <Form.Item label="Market 名称"><Input defaultValue="EU Market" /></Form.Item>
          <Form.Item label="上线日期"><Input defaultValue="2026-09-01" /></Form.Item>
          <Form.Item label="状态"><Select defaultValue="planning" options={[{label:'筹备中',value:'planning'},{label:'运营中',value:'active'},{label:'已暂停',value:'suspended'}]} /></Form.Item>
        </Form></Card>
      )}
      {current === 1 && (
        <Card title="国家配置"><Text type="secondary" style={{ display: 'block', marginBottom: 16 }}>从国家主数据中选择 Market 覆盖国家，并补充该国家在当前 Market 下的配置。</Text>
          <Form layout="inline" style={{ marginBottom: 16 }}>
            <Form.Item label="选择国家"><Select defaultValue="FR" style={{ width: 160 }} options={[{label:'France (FR)',value:'FR'},{label:'Germany (DE)',value:'DE'},{label:'Italy (IT)',value:'IT'}]} /></Form.Item>
            <Form.Item label="是否主要国家"><Select defaultValue="是" style={{ width: 80 }} options={[{value:'是'},{value:'否'}]} /></Form.Item>
            <Form.Item label="优先级"><InputNumber defaultValue={1} min={1} style={{ width: 80 }} /></Form.Item>
            <Form.Item><Button>添加国家</Button></Form.Item>
          </Form>
          <Table size="small" pagination={false} rowKey="code" dataSource={MARKET_COUNTRIES.slice(0,2)} columns={[
            {title:'国家代码',dataIndex:'code'},{title:'国家名称',dataIndex:'name'},
            {title:'是否主要国家',dataIndex:'isPrimary',render:v=><Tag color={v?'green':'default'}>{v?'是':'否'}</Tag>},
            {title:'优先级',dataIndex:'priority'},{title:'状态',dataIndex:'status',render:s=><Tag color={statusColor(s)}>{s}</Tag>},
          ]} />
        </Card>
      )}
      {current === 2 && (
        <Card title="语言配置"><Text type="secondary" style={{ display: 'block', marginBottom: 16 }}>从语言主数据中选择 Market 支持语言，并设置默认语言与排序。</Text>
          <Form layout="inline" style={{ marginBottom: 16 }}>
            <Form.Item label="选择语言"><Select defaultValue="en" style={{ width: 160 }} options={[{label:'English (en)',value:'en'},{label:'French (fr)',value:'fr'},{label:'German (de)',value:'de'}]} /></Form.Item>
            <Form.Item label="是否默认"><Select defaultValue="是" style={{ width: 80 }} options={[{value:'是'},{value:'否'}]} /></Form.Item>
            <Form.Item label="优先级"><InputNumber defaultValue={1} min={1} style={{ width: 80 }} /></Form.Item>
            <Form.Item><Button>添加语言</Button></Form.Item>
          </Form>
          <Table size="small" pagination={false} rowKey="code" dataSource={MARKET_LANGS.slice(0,2)} columns={[
            {title:'语言代码',dataIndex:'code'},{title:'语言名称',dataIndex:'name'},
            {title:'是否默认',dataIndex:'isDefault',render:v=><Tag color={v?'green':'default'}>{v?'是':'否'}</Tag>},
            {title:'优先级',dataIndex:'priority'},{title:'状态',dataIndex:'status',render:s=><Tag color={statusColor(s)}>{s}</Tag>},
          ]} />
        </Card>
      )}
      {current === 3 && (
        <Card title="货币配置"><Text type="secondary" style={{ display: 'block', marginBottom: 16 }}>从货币主数据中选择 Market 支持货币，并配置默认货币和汇率规则。</Text>
          <Form layout="inline" style={{ marginBottom: 16 }}>
            <Form.Item label="选择货币"><Select defaultValue="EUR" style={{ width: 160 }} options={[{label:'EUR - Euro',value:'EUR'},{label:'GBP - British Pound',value:'GBP'}]} /></Form.Item>
            <Form.Item label="是否默认"><Select defaultValue="是" style={{ width: 80 }} options={[{value:'是'},{value:'否'}]} /></Form.Item>
            <Form.Item label="汇率策略"><Select defaultValue="fixed" style={{ width: 100 }} options={[{value:'fixed'},{value:'dynamic'}]} /></Form.Item>
            <Form.Item><Button>添加货币</Button></Form.Item>
          </Form>
          <Table size="small" pagination={false} rowKey="code" dataSource={MARKET_CURRENCIES} columns={[
            {title:'货币代码',dataIndex:'code'},{title:'货币名称',dataIndex:'name'},
            {title:'是否默认',dataIndex:'isDefault',render:v=><Tag color={v?'green':'default'}>{v?'是':'否'}</Tag>},
            {title:'汇率策略',dataIndex:'strategy'},{title:'加价百分比',dataIndex:'markup'},
            {title:'状态',dataIndex:'status',render:s=><Tag color={statusColor(s)}>{s}</Tag>},
          ]} />
        </Card>
      )}

      <div style={{ marginTop: 24, display: 'flex', justifyContent: 'flex-end', gap: 12 }}>
        <Button onClick={onBack}>取消</Button>
        {current > 0 && <Button onClick={() => setCurrent(current - 1)}>上一步</Button>}
        {current < 3 && <Button type="primary" onClick={() => setCurrent(current + 1)}>下一步</Button>}
        {current === 3 && <Button type="primary" onClick={onFinish}>保存并创建</Button>}
      </div>
    </div>
  );
}

// ══════════════════════════════════════════
// 国家管理（列表 + 新建/编辑）
// ══════════════════════════════════════════
function CountryPage() {
  const [view, setView] = useState('list'); // list | form
  const [editRecord, setEditRecord] = useState(null);

  const columns = [
    { title: '国家代码', dataIndex: 'code', render: (t) => <Text strong>{t}</Text> },
    { title: '国家名称', dataIndex: 'name' },
    { title: '本地名称', dataIndex: 'local', hideInSearch: true },
    { title: '所属大洲', dataIndex: 'continent', valueType: 'select', fieldProps: { options: [{label:'全部大洲',value:''},{value:'北美洲'},{value:'欧洲'},{value:'亚洲'},{value:'大洋洲'}] } },
    { title: '默认时区', dataIndex: 'tz', hideInSearch: true },
    { title: '电话区号', dataIndex: 'dial', hideInSearch: true },
    { title: '法定货币', dataIndex: 'currency', hideInSearch: true },
    { title: '主要语言', dataIndex: 'lang', hideInSearch: true },
    { title: '状态', dataIndex: 'status', hideInSearch: true, render: (s) => <Tag color={statusColor(s)}>{s}</Tag> },
    { title: '操作', key: 'action', hideInSearch: true, render: (_, r) => <Button size="small" onClick={() => { setEditRecord(r); setView('form'); }}>编辑</Button> },
  ];

  if (view === 'form') {
    const r = editRecord || {};
    return (
      <div>
        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 16 }}>
          <Title level={4} style={{ margin: 0 }}>{editRecord ? `编辑国家 — ${r.code}` : '新建国家'}</Title>
          <Button icon={<ArrowLeftOutlined />} onClick={() => setView('list')}>返回列表</Button>
        </div>
        <Card>
          <Form layout="vertical" initialValues={r}>
            <Form.Item label="国家代码"><Input defaultValue={r.code} disabled={!!editRecord} /></Form.Item>
            <Form.Item label="国家名称"><Input defaultValue={r.name} /></Form.Item>
            <Form.Item label="本地名称"><Input defaultValue={r.local} /></Form.Item>
            <Form.Item label="所属大洲"><Select defaultValue={r.continent || '北美洲'} options={[{value:'北美洲'},{value:'欧洲'},{value:'亚洲'},{value:'大洋洲'}]} /></Form.Item>
            <Form.Item label="默认时区"><Input defaultValue={r.tz} /></Form.Item>
            <Form.Item label="电话区号"><Input defaultValue={r.dial} /></Form.Item>
            <Form.Item label="法定货币"><Select defaultValue={r.currency || 'USD'} options={CURRENCIES.map(c=>({value:c.code,label:c.code}))} /></Form.Item>
            <Form.Item label="主要语言"><Select defaultValue={r.lang || 'en'} options={LANGUAGES.map(l=>({value:l.code,label:l.name}))} /></Form.Item>

// ══════════════════════════════════════════
// 主应用
// ══════════════════════════════════════════
function App() {
  const [currentPage, setCurrentPage] = useState('market-list');
  const [marketView, setMarketView] = useState('list'); // list | detail | create
  const [selectedMarket, setSelectedMarket] = useState(null);

  const menuItems = [
    { key: 'market-grp', icon: React.createElement(AimOutlined), label: 'Market', children: [
      { key: 'market-list', icon: React.createElement(UnorderedListOutlined), label: '市场管理' },
      { key: 'country-list', icon: React.createElement(GlobalOutlined), label: '国家管理' },
      { key: 'language-list', icon: React.createElement(TranslationOutlined), label: '语言管理' },
      { key: 'currency-list', icon: React.createElement(DollarOutlined), label: '货币管理' },
    ]},
  ];

  const pageLabel = () => {
    const map = { 'market-list': '市场管理', 'country-list': '国家管理', 'language-list': '语言管理', 'currency-list': '货币管理' };
    return map[currentPage] || '';
  };

  const renderPage = () => {
    if (currentPage === 'market-list') {
      if (marketView === 'detail') return <MarketDetailPage market={selectedMarket} onBack={() => setMarketView('list')} onEdit={() => setMarketView('create')} />;
      if (marketView === 'create') return <MarketCreatePage onBack={() => setMarketView('list')} onFinish={() => setMarketView('detail')} />;
      return <MarketListPage onDetail={(m) => { setSelectedMarket(m); setMarketView('detail'); }} onCreate={() => setMarketView('create')} />;
    }
    if (currentPage === 'country-list') return <CountryPage />;
    if (currentPage === 'language-list') return <LanguagePage />;
    if (currentPage === 'currency-list') return <CurrencyPage />;
    return <MarketListPage onDetail={(m) => { setSelectedMarket(m); setMarketView('detail'); }} onCreate={() => setMarketView('create')} />;
  };

  return (
    <ConfigProvider theme={{ token: { colorPrimary: '#7C3AED', borderRadius: 8 } }}>
      <Layout style={{ minHeight: '100vh' }}>
        <Sider theme="light" width={220} style={{ boxShadow: '2px 0 8px rgba(0,0,0,0.06)' }}>
          <div className="logo-area"><img src="logo-new.png" alt="Looply" /></div>
          <Divider style={{ margin: '0 0 8px' }} />
          <Menu
            mode="inline"
            defaultOpenKeys={['market-grp']}
            selectedKeys={[currentPage]}
            items={menuItems}
            onClick={({ key }) => { setCurrentPage(key); setMarketView('list'); }}
          />
        </Sider>
        <Layout>
          <Header style={{ background: '#fff', padding: '0 24px', display: 'flex', alignItems: 'center', borderBottom: '1px solid #f0f0f0' }}>
            <Breadcrumb items={[{ title: 'MARKET主数据' }, { title: pageLabel() }]} />
          </Header>
          <Content style={{ margin: 24, padding: 24, background: '#fff', borderRadius: 12, minHeight: 280 }}>
            {renderPage()}
          </Content>
        </Layout>
      </Layout>
    </ConfigProvider>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
