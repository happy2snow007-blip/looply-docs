<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Looply — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --purple: oklch(45% 0.25 285);
    --purple-hover: oklch(40% 0.27 285);
    --purple-light: oklch(95% 0.03 285);
    --purple-subtle: oklch(97% 0.015 285);
    --text-primary: oklch(18% 0.01 285);
    --text-secondary: oklch(45% 0.02 285);
    --text-tertiary: oklch(60% 0.015 285);
    --border: oklch(88% 0.01 285);
    --border-focus: oklch(45% 0.25 285);
    --bg-page: oklch(99% 0.005 285);
    --bg-input: oklch(99% 0.005 285);
    --surface-white: oklch(99.5% 0.003 285);

    --font: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
  }

  html { font-size: 16px; }

  body {
    font-family: var(--font);
    background: var(--bg-page);
    color: var(--text-primary);
    min-height: 100vh;
    min-height: 100dvh;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }

  /* ===== Top Brand Bar ===== */
  .brand-bar {
    background: var(--purple);
    padding: 32px 24px 28px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .brand-bar::before {
    content: '';
    position: absolute;
    top: -60%;
    right: -30%;
    width: 240px;
    height: 240px;
    border-radius: 50%;
    background: oklch(50% 0.2 285 / 0.15);
  }

  .brand-bar::after {
    content: '';
    position: absolute;
    bottom: -50%;
    left: -20%;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: oklch(55% 0.18 285 / 0.12);
  }

  .brand-bar-content {
    position: relative;
    z-index: 1;
  }

  .brand-logo {
    font-size: 1.5rem;
    font-weight: 700;
    color: oklch(99% 0.005 285);
    letter-spacing: -0.03em;
    margin-bottom: 8px;
  }

  .brand-tagline {
    font-size: 0.8125rem;
    color: oklch(85% 0.06 285);
    line-height: 1.5;
  }

  /* ===== Form Area ===== */
  .form-area {
    flex: 1;
    padding: 28px 24px 40px;
    display: flex;
    flex-direction: column;
  }

  .form-header {
    margin-bottom: 28px;
  }

  .form-title {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text-primary);
    margin-bottom: 6px;
  }

  .form-subtitle {
    font-size: 0.875rem;
    color: var(--text-tertiary);
  }

  /* Fields */
  .field-group {
    margin-bottom: 18px;
  }

  .field-label {
    display: block;
    font-size: 0.8125rem;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 6px;
    letter-spacing: 0.01em;
  }

  .field-input-wrap {
    position: relative;
  }

  .field-input {
    width: 100%;
    height: 48px;
    padding: 0 16px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-md);
    background: var(--bg-input);
    font-family: var(--font);
    font-size: 1rem;
    color: var(--text-primary);
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
    outline: none;
    -webkit-appearance: none;
  }

  .field-input::placeholder { color: var(--text-tertiary); }

  .field-input:focus {
    border-color: var(--border-focus);
    box-shadow: 0 0 0 3px oklch(45% 0.25 285 / 0.1);
  }

  .field-input.has-toggle { padding-right: 48px; }

  .toggle-password {
    position: absolute;
    right: 4px;
    top: 50%;
    transform: translateY(-50%);
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-tertiary);
    border-radius: var(--radius-sm);
  }

  .toggle-password:active { color: var(--text-secondary); }
  .toggle-password svg { width: 20px; height: 20px; }

  /* Options Row */
  .form-options {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }

  .remember-me {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    font-size: 0.8125rem;
    color: var(--text-secondary);
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .remember-me input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    width: 20px;
    height: 20px;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    position: relative;
    transition: all 0.15s ease;
    flex-shrink: 0;
  }

  .remember-me input[type="checkbox"]:checked {
    background: var(--purple);
    border-color: var(--purple);
  }

  .remember-me input[type="checkbox"]:checked::after {
    content: '';
    position: absolute;
    left: 6px;
    top: 2px;
    width: 5px;
    height: 10px;
    border: solid oklch(99% 0.005 285);
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }

  .forgot-link {
    font-size: 0.8125rem;
    color: var(--purple);
    text-decoration: none;
    font-weight: 500;
    -webkit-tap-highlight-color: transparent;
  }

  /* Buttons */
  .btn-primary {
    width: 100%;
    height: 50px;
    border: none;
    border-radius: var(--radius-md);
    background: var(--purple);
    color: oklch(99% 0.005 285);
    font-family: var(--font);
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s ease;
    letter-spacing: 0.01em;
    -webkit-tap-highlight-color: transparent;
  }

  .btn-primary:active { background: var(--purple-hover); }

  /* Divider */
  .divider {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 24px 0;
  }

  .divider::before,
  .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .divider span {
    font-size: 0.8125rem;
    color: var(--text-tertiary);
    font-weight: 500;
  }

  /* Social Buttons */
  .social-buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 28px;
  }

  .btn-social {
    width: 100%;
    height: 50px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-md);
    background: var(--surface-white);
    font-family: var(--font);
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--text-primary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.15s ease;
  }

  .btn-social:active {
    background: var(--purple-subtle);
  }

  .btn-social svg { width: 18px; height: 18px; flex-shrink: 0; }

  /* Footer */
  .form-footer {
    text-align: center;
    font-size: 0.875rem;
    color: var(--text-tertiary);
    margin-top: auto;
    padding-top: 16px;
  }

  .form-footer a {
    color: var(--purple);
    text-decoration: none;
    font-weight: 600;
  }

  /* ===== Animation ===== */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .form-area { animation: fadeInUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both; }

  /* Safe area for notch devices */
  @supports (padding-bottom: env(safe-area-inset-bottom)) {
    .form-area {
      padding-bottom: calc(40px + env(safe-area-inset-bottom));
    }
  }
</style>
</head>
<body>

<!-- Top Brand Bar -->
<div class="brand-bar">
  <div class="brand-bar-content">
    <div class="brand-logo">looply</div>
    <p class="brand-tagline">Premium brands, circular future</p>
  </div>
</div>

<!-- Form Area -->
<div class="form-area">
  <div class="form-header">
    <h2 class="form-title">Welcome back</h2>
    <p class="form-subtitle">Sign in to your Looply account</p>
  </div>

  <form onsubmit="return false;">
    <div class="field-group">
      <label class="field-label" for="email">Email</label>
      <div class="field-input-wrap">
        <input class="field-input" type="email" id="email" placeholder="you@example.com" autocomplete="email" inputmode="email">
      </div>
    </div>

    <div class="field-group">
      <label class="field-label" for="password">Password</label>
      <div class="field-input-wrap">
        <input class="field-input has-toggle" type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
        <button type="button" class="toggle-password" onclick="togglePw()" aria-label="Toggle password visibility">
          <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <div class="form-options">
      <label class="remember-me">
        <input type="checkbox">
        <span>Remember me</span>
      </label>
      <a href="#" class="forgot-link">Forgot password?</a>
    </div>

    <button type="submit" class="btn-primary">Sign In</button>
  </form>

  <div class="divider"><span>or</span></div>

  <div class="social-buttons">
    <button class="btn-social">
      <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
      Continue with Google
    </button>
    <button class="btn-social">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
      Continue with Apple
    </button>
    <button class="btn-social">
      <svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" fill="#1877F2"/></svg>
      Continue with Facebook
    </button>
  </div>

  <div class="form-footer">
    Don't have an account? <a href="#">Sign up</a>
  </div>
</div>

<script>
function togglePw() {
  const pw = document.getElementById('password');
  const icon = document.getElementById('eye-icon');
  if (pw.type === 'password') {
    pw.type = 'text';
    icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="1" y1="1" x2="23" y2="23" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>';
  } else {
    pw.type = 'password';
    icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" fill="none"/>';
  }
}
</script>
</body>
</html>
