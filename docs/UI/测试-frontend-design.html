<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>looply — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

  :root{
    --purple:oklch(0.45 0.28 285);
    --purple-light:oklch(0.52 0.24 285);
    --purple-dark:oklch(0.30 0.22 285);
    --purple-subtle:oklch(0.96 0.02 285);
    --bg:#FAFAFA;
    --surface:#FFFFFF;
    --text-primary:#1A1A2E;
    --text-secondary:#5C5C72;
    --text-tertiary:#8E8EA0;
    --border:oklch(0.88 0.01 285);
    --border-focus:oklch(0.45 0.28 285);
    --error:#EF4444;
    --radius:12px;
    --font-body:'DM Sans',system-ui,sans-serif;
    --font-display:'Playfair Display',Georgia,serif;
  }

  html{font-size:16px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  body{font-family:var(--font-body);color:var(--text-primary);background:var(--bg);min-height:100dvh;display:flex}

  /* ---- Layout ---- */
  .login-page{display:flex;width:100%;min-height:100dvh}

  /* ---- Left Brand Panel ---- */
  .brand-panel{
    position:relative;
    width:clamp(380px,45vw,660px);
    min-height:100dvh;
    background:linear-gradient(160deg,var(--purple) 0%,var(--purple-dark) 100%);
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    padding:clamp(32px,5vw,56px);
    overflow:hidden;
  }

  .brand-panel::before{
    content:'';
    position:absolute;
    inset:0;
    background:
      radial-gradient(ellipse 600px 600px at 20% 30%,oklch(0.50 0.30 285 / 0.4),transparent),
      radial-gradient(ellipse 400px 400px at 80% 70%,oklch(0.35 0.20 285 / 0.5),transparent);
    pointer-events:none;
  }

  /* Flowing loop pattern — brand graphic language */
  .brand-pattern{
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    width:480px;height:480px;
    opacity:0.08;
    pointer-events:none;
  }
  .brand-pattern svg{width:100%;height:100%}

  .brand-content{position:relative;z-index:1;display:flex;flex-direction:column;gap:20px}
  .brand-logo{font-family:var(--font-body);font-size:clamp(28px,3vw,36px);font-weight:700;color:#fff;letter-spacing:-1px}
  .brand-tagline{font-family:var(--font-display);font-size:clamp(18px,2vw,24px);font-weight:400;color:rgba(255,255,255,0.82);line-height:1.45;max-width:440px}
  .brand-sub{font-size:14px;color:rgba(255,255,255,0.55);margin-top:4px}

  /* ---- Right Form Panel ---- */
  .form-panel{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:clamp(24px,4vw,80px);
    background:var(--surface);
  }

  .form-wrapper{width:100%;max-width:380px;display:flex;flex-direction:column;gap:28px}

  .form-header{display:flex;flex-direction:column;gap:6px}
  .form-title{font-family:var(--font-display);font-size:clamp(24px,2.5vw,32px);font-weight:600;letter-spacing:-0.5px;color:var(--text-primary)}
  .form-subtitle{font-size:14px;color:var(--text-secondary)}

  /* ---- Social Buttons ---- */
  .social-group{display:flex;flex-direction:column;gap:10px}

  .btn-social{
    display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;padding:13px 24px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    font-family:var(--font-body);font-size:14px;font-weight:500;
    color:var(--text-primary);
    cursor:pointer;
    transition:border-color 0.2s ease,background 0.2s ease;
  }
  .btn-social:hover{border-color:var(--border-focus);background:var(--purple-subtle)}
  .btn-social:active{transform:scale(0.985)}
  .btn-social svg{width:20px;height:20px;flex-shrink:0}

  /* ---- Divider ---- */
  .divider{display:flex;align-items:center;gap:16px}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
  .divider span{font-size:13px;color:var(--text-tertiary);white-space:nowrap}

  /* ---- Inputs ---- */
  .field{display:flex;flex-direction:column;gap:5px}
  .field-label{font-size:13px;font-weight:500;color:var(--text-secondary)}
  .field-input{
    width:100%;padding:12px 16px;
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:10px;
    font-family:var(--font-body);font-size:14px;
    color:var(--text-primary);
    outline:none;
    transition:border-color 0.2s ease,box-shadow 0.2s ease;
  }
  .field-input::placeholder{color:var(--text-tertiary)}
  .field-input:focus{border-color:var(--border-focus);box-shadow:0 0 0 3px oklch(0.45 0.28 285 / 0.1)}

  .input-fields{display:flex;flex-direction:column;gap:16px}

  /* ---- Options Row ---- */
  .options-row{display:flex;justify-content:space-between;align-items:center}

  .checkbox-wrap{display:flex;align-items:center;gap:8px;cursor:pointer}
  .checkbox-wrap input{width:18px;height:18px;accent-color:var(--purple);border-radius:4px;cursor:pointer}
  .checkbox-label{font-size:13px;color:var(--text-secondary)}

  .forgot-link{font-size:13px;font-weight:500;color:var(--purple);text-decoration:none;transition:opacity 0.2s}
  .forgot-link:hover{opacity:0.75}

  /* ---- Primary Button ---- */
  .btn-primary{
    width:100%;padding:14px 24px;
    background:var(--purple);
    border:none;border-radius:var(--radius);
    font-family:var(--font-body);font-size:14px;font-weight:600;
    color:#fff;
    cursor:pointer;
    transition:background 0.2s ease,transform 0.1s ease;
  }
  .btn-primary:hover{background:var(--purple-light)}
  .btn-primary:active{transform:scale(0.985)}

  /* ---- Signup Row ---- */
  .signup-row{text-align:center;font-size:13px;color:var(--text-secondary)}
  .signup-link{color:var(--purple);font-weight:600;text-decoration:none;transition:opacity 0.2s}
  .signup-link:hover{opacity:0.75}

  /* ---- Entry Animation ---- */
  @media(prefers-reduced-motion:no-preference){
    .form-wrapper>*{
      opacity:0;transform:translateY(12px);
      animation:fadeUp 0.5s cubic-bezier(0.16,1,0.3,1) forwards;
    }
    .form-wrapper>*:nth-child(1){animation-delay:0.05s}
    .form-wrapper>*:nth-child(2){animation-delay:0.1s}
    .form-wrapper>*:nth-child(3){animation-delay:0.15s}
    .form-wrapper>*:nth-child(4){animation-delay:0.2s}
    .form-wrapper>*:nth-child(5){animation-delay:0.25s}
    .form-wrapper>*:nth-child(6){animation-delay:0.3s}
    .form-wrapper>*:nth-child(7){animation-delay:0.35s}

    @keyframes fadeUp{to{opacity:1;transform:translateY(0)}}

    .brand-content{
      opacity:0;transform:translateY(20px);
      animation:fadeUp 0.7s 0.2s cubic-bezier(0.16,1,0.3,1) forwards;
    }
  }

  /* ---- Responsive ---- */
  @media(max-width:900px){
    .brand-panel{display:none}
    .form-panel{padding:clamp(24px,6vw,48px)}
  }
</style>
</head>
<body>
<div class="login-page">

  <!-- Left Brand Panel -->
  <div class="brand-panel">
    <div class="brand-pattern">
      <svg viewBox="0 0 480 480" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M120 240C120 174 174 120 240 120C306 120 360 174 360 240C360 306 306 360 240 360C174 360 120 306 120 240Z" stroke="white" stroke-width="2"/>
        <path d="M160 240C160 196 196 160 240 160C284 160 320 196 320 240C320 284 284 320 240 320C196 320 160 284 160 240Z" stroke="white" stroke-width="1.5"/>
        <path d="M80 240C80 152 152 80 240 80C328 80 400 152 400 240C400 328 328 400 240 400C152 400 80 328 80 240Z" stroke="white" stroke-width="1"/>
        <path d="M200 140C200 140 280 180 280 240C280 300 200 340 200 340" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M280 140C280 140 200 180 200 240C200 300 280 340 280 340" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="brand-content">
      <div class="brand-logo">looply</div>
      <div class="brand-tagline">Give pre-loved items a second chance</div>
      <div class="brand-sub">Shop smart. Live sustainably.</div>
    </div>
  </div>

  <!-- Right Form Panel -->
  <div class="form-panel">
    <div class="form-wrapper">

      <div class="form-header">
        <h1 class="form-title">Welcome back</h1>
        <p class="form-subtitle">Sign in to your looply account</p>
      </div>

      <div class="social-group">
        <button class="btn-social" type="button">
          <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          Continue with Google
        </button>
        <button class="btn-social" type="button">
          <svg viewBox="0 0 24 24"><path d="M17.05 20.28c-1.15.66-2.42 1.02-3.77 1.02-4.41 0-7.99-3.58-7.99-7.99s3.58-7.99 7.99-7.99c2.15 0 4.1.85 5.53 2.23l-2.37 2.28c-.87-.83-2-1.3-3.16-1.3-2.65 0-4.8 2.15-4.8 4.8s2.15 4.8 4.8 4.8c1.76 0 3.3-.95 4.13-2.37H13.3v-3.02h7.82c.1.57.16 1.16.16 1.76 0 2.58-.93 4.76-2.53 6.3" fill="#1A1A2E"/><path d="M12.14 2.25c-1.1 0-2 .9-2 2v.5c0 .28.22.5.5.5h3c.28 0 .5-.22.5-.5v-.5c0-1.1-.9-2-2-2z" fill="none"/></svg>
          Continue with Apple
        </button>
        <button class="btn-social" type="button">
          <svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" fill="#1877F2"/></svg>
          Continue with Facebook
        </button>
      </div>

      <div class="divider"><span>or</span></div>

      <div class="input-fields">
        <div class="field">
          <label class="field-label">Email</label>
          <input class="field-input" type="email" placeholder="Enter your email">
        </div>
        <div class="field">
          <label class="field-label">Password</label>
          <input class="field-input" type="password" placeholder="Enter your password">
        </div>
      </div>

      <div class="options-row">
        <label class="checkbox-wrap">
          <input type="checkbox">
          <span class="checkbox-label">Remember me</span>
        </label>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>

      <button class="btn-primary" type="submit">Sign in</button>

      <p class="signup-row">Don't have an account? <a href="#" class="signup-link">Sign up</a></p>

    </div>
  </div>

</div>
</body>
</html>
