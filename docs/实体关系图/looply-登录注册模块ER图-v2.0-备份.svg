<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1100" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,3 L0,6 Z" fill="#999"/>
    </marker>
    <marker id="arrowBoth" viewBox="0 0 10 6" refX="5" refY="3" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#999"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="1300" height="1100" fill="#f8f9fc" rx="12"/>

  <!-- 标题栏 -->
  <rect x="0" y="0" width="1300" height="64" fill="url(#headerGrad)" rx="12"/>
  <rect x="0" y="40" width="1300" height="24" fill="url(#headerGrad)"/>
  <text x="650" y="38" text-anchor="middle" fill="#fff" font-size="20" font-weight="600">looply · 登录注册模块 实体关系图（ER）</text>
  <text x="1260" y="38" text-anchor="end" fill="#8892a4" font-size="11">v2.0 · 2026.03</text>

  <!-- ==================== 核心实体：User 居中 ==================== -->
  <!-- 位置：x=480 y=410 w=340 h=180 中心=(650,500) -->
  <rect x="480" y="410" width="340" height="180" rx="12" fill="#fff" stroke="#1a73a7" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="480" y="410" width="340" height="34" rx="12" fill="#1a73a7"/>
  <rect x="480" y="434" width="340" height="10" fill="#1a73a7"/>
  <text x="650" y="434" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">用户 User</text>
  <text x="496" y="464" fill="#333" font-size="12">用户ID · 昵称 · 头像</text>
  <text x="496" y="484" fill="#333" font-size="12">用户类型（C端 / B端 / 内部）</text>
  <text x="496" y="504" fill="#333" font-size="12">注册渠道（App / H5 / Web）</text>
  <text x="496" y="524" fill="#333" font-size="12">国家地区 · 语言偏好</text>
  <text x="496" y="544" fill="#333" font-size="12">注册时间 · 状态（正常/冻结/注销）</text>
  <text x="496" y="574" fill="#999" font-size="10">核心实体，所有其他实体围绕用户展开</text>

  <!-- ==================== 上方一排：身份认证相关（蓝色） ==================== -->

  <!-- 登录凭证 x=40 y=90 -->
  <rect x="40" y="90" width="230" height="130" rx="8" fill="#fff" stroke="#b3d9f2" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="90" width="230" height="28" rx="8" fill="#e8f4fd"/>
  <rect x="40" y="110" width="230" height="8" fill="#e8f4fd"/>
  <text x="155" y="110" text-anchor="middle" fill="#1a73a7" font-size="12" font-weight="600">登录凭证 Credential</text>
  <text x="54" y="136" fill="#333" font-size="11">凭证类型（邮箱/手机/用户名）</text>
  <text x="54" y="154" fill="#333" font-size="11">凭证值 · 密码哈希</text>
  <text x="54" y="172" fill="#333" font-size="11">是否已验证 · 状态</text>
  <text x="54" y="200" fill="#999" font-size="10">一个用户可同时有邮箱+手机号</text>

  <!-- 三方账号绑定 x=300 y=90 -->
  <rect x="300" y="90" width="230" height="130" rx="8" fill="#fff" stroke="#b3d9f2" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="300" y="90" width="230" height="28" rx="8" fill="#e8f4fd"/>
  <rect x="300" y="110" width="230" height="8" fill="#e8f4fd"/>
  <text x="415" y="110" text-anchor="middle" fill="#1a73a7" font-size="12" font-weight="600">三方账号绑定 OAuthBinding</text>
  <text x="314" y="136" fill="#333" font-size="11">三方平台（Google/Apple/FB）</text>
  <text x="314" y="154" fill="#333" font-size="11">平台用户ID · 平台昵称 · 头像</text>
  <text x="314" y="172" fill="#333" font-size="11">绑定时间 · 状态</text>
  <text x="314" y="200" fill="#999" font-size="10">可同时绑定多个三方平台</text>

  <!-- 验证码 x=560 y=90 -->
  <rect x="560" y="90" width="230" height="130" rx="8" fill="#fff" stroke="#b3d9f2" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="560" y="90" width="230" height="28" rx="8" fill="#e8f4fd"/>
  <rect x="560" y="110" width="230" height="8" fill="#e8f4fd"/>
  <text x="675" y="110" text-anchor="middle" fill="#1a73a7" font-size="12" font-weight="600">验证码 VerificationCode</text>
  <text x="574" y="136" fill="#333" font-size="11">用途（注册/登录/重置/绑定）</text>
  <text x="574" y="154" fill="#333" font-size="11">发送渠道（邮箱/SMS）</text>
  <text x="574" y="172" fill="#333" font-size="11">验证码值 · 尝试次数 · 过期时间</text>
  <text x="574" y="190" fill="#333" font-size="11">状态（待验证/已使用/已过期）</text>

  <!-- 商家资质 x=820 y=90 -->
  <rect x="820" y="90" width="230" height="130" rx="8" fill="#fff" stroke="#b3d9f2" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="820" y="90" width="230" height="28" rx="8" fill="#e8f4fd"/>
  <rect x="820" y="110" width="230" height="8" fill="#e8f4fd"/>
  <text x="935" y="110" text-anchor="middle" fill="#1a73a7" font-size="12" font-weight="600">商家资质 MerchantQualification</text>
  <text x="834" y="136" fill="#333" font-size="11">企业名称 · 营业执照号</text>
  <text x="834" y="154" fill="#333" font-size="11">资质文件 · 联系人</text>
  <text x="834" y="172" fill="#333" font-size="11">审核状态（待审/通过/驳回）</text>
  <text x="834" y="190" fill="#333" font-size="11">驳回原因 · 提交/审核时间</text>
  <text x="834" y="210" fill="#999" font-size="10">仅B端商家有</text>

  <!-- 合规同意记录 x=1080 y=90 -->
  <rect x="1060" y="90" width="210" height="130" rx="8" fill="#fff" stroke="#f0d9b5" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="1060" y="90" width="210" height="28" rx="8" fill="#fff8f0"/>
  <rect x="1060" y="110" width="210" height="8" fill="#fff8f0"/>
  <text x="1165" y="110" text-anchor="middle" fill="#8b6914" font-size="12" font-weight="600">合规同意记录 ConsentRecord</text>
  <text x="1074" y="136" fill="#333" font-size="11">同意类型（隐私/协议/Cookie）</text>
  <text x="1074" y="154" fill="#333" font-size="11">协议版本号 · 适用国家</text>
  <text x="1074" y="172" fill="#333" font-size="11">同意时间 · 撤回时间</text>
  <text x="1074" y="200" fill="#999" font-size="10">每次协议更新需重新同意</text>

  <!-- ==================== 左侧：权限相关（紫色） ==================== -->

  <!-- 角色 x=40 y=380 -->
  <rect x="40" y="380" width="210" height="120" rx="8" fill="#fff" stroke="#c9b3f2" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="380" width="210" height="28" rx="8" fill="#f0e8fd"/>
  <rect x="40" y="400" width="210" height="8" fill="#f0e8fd"/>
  <text x="145" y="400" text-anchor="middle" fill="#7b4ea7" font-size="12" font-weight="600">角色 Role</text>
  <text x="54" y="426" fill="#333" font-size="11">角色名称 · 角色编码</text>
  <text x="54" y="444" fill="#333" font-size="11">描述 · 是否可切换</text>
  <text x="54" y="478" fill="#999" font-size="10">买家/卖家/运营，可切换</text>

  <!-- 权限 x=40 y=540 -->
  <rect x="40" y="540" width="210" height="110" rx="8" fill="#fff" stroke="#c9b3f2" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="540" width="210" height="28" rx="8" fill="#f0e8fd"/>
  <rect x="40" y="560" width="210" height="8" fill="#f0e8fd"/>
  <text x="145" y="560" text-anchor="middle" fill="#7b4ea7" font-size="12" font-weight="600">权限 Permission</text>
  <text x="54" y="586" fill="#333" font-size="11">权限名称 · 权限编码</text>
  <text x="54" y="604" fill="#333" font-size="11">资源类型 · 操作（读/写/删除）</text>
  <text x="54" y="632" fill="#999" font-size="10">RBAC 模型</text>

  <!-- ==================== 右侧：安全防护相关（橙色） ==================== -->

  <!-- MFA配置 x=1060 y=340 -->
  <rect x="1060" y="340" width="210" height="110" rx="8" fill="#fff" stroke="#f2c9a3" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="1060" y="340" width="210" height="28" rx="8" fill="#fef4e8"/>
  <rect x="1060" y="360" width="210" height="8" fill="#fef4e8"/>
  <text x="1165" y="360" text-anchor="middle" fill="#b8860b" font-size="12" font-weight="600">多因素认证配置 MFAConfig</text>
  <text x="1074" y="386" fill="#333" font-size="11">MFA类型（TOTP/SMS/邮箱）</text>
  <text x="1074" y="404" fill="#333" font-size="11">密钥 · 是否启用</text>
  <text x="1074" y="422" fill="#333" font-size="11">配置时间</text>

  <!-- 审计日志 x=1060 y=500 -->
  <rect x="1060" y="500" width="210" height="110" rx="8" fill="#fff" stroke="#c9b3f2" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="1060" y="500" width="210" height="28" rx="8" fill="#f0e8fd"/>
  <rect x="1060" y="520" width="210" height="8" fill="#f0e8fd"/>
  <text x="1165" y="520" text-anchor="middle" fill="#7b4ea7" font-size="12" font-weight="600">审计日志 AuditLog</text>
  <text x="1074" y="546" fill="#333" font-size="11">操作类型（改密码/绑手机/注销）</text>
  <text x="1074" y="564" fill="#333" font-size="11">操作详情 · IP · 设备信息</text>
  <text x="1074" y="582" fill="#333" font-size="11">操作时间</text>

  <!-- 风控记录 x=1060 y=660 -->
  <rect x="1060" y="660" width="210" height="120" rx="8" fill="#fff" stroke="#f2c9a3" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="1060" y="660" width="210" height="28" rx="8" fill="#fef4e8"/>
  <rect x="1060" y="680" width="210" height="8" fill="#fef4e8"/>
  <text x="1165" y="680" text-anchor="middle" fill="#b8860b" font-size="12" font-weight="600">风控记录 RiskRecord</text>
  <text x="1074" y="706" fill="#333" font-size="11">风控类型（暴力破解/异地/新设备）</text>
  <text x="1074" y="724" fill="#333" font-size="11">触发规则 · IP地址</text>
  <text x="1074" y="742" fill="#333" font-size="11">处理结果（放行/验证/拦截/封禁）</text>
  <text x="1074" y="760" fill="#333" font-size="11">触发时间</text>

  <!-- ==================== 下方：设备、日志、会话（橙色） ==================== -->

  <!-- 设备 x=380 y=700 -->
  <rect x="380" y="700" width="230" height="130" rx="8" fill="#fff" stroke="#f2c9a3" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="380" y="700" width="230" height="28" rx="8" fill="#fef4e8"/>
  <rect x="380" y="720" width="230" height="8" fill="#fef4e8"/>
  <text x="495" y="720" text-anchor="middle" fill="#b8860b" font-size="12" font-weight="600">设备 Device</text>
  <text x="394" y="746" fill="#333" font-size="11">设备指纹 · 设备类型</text>
  <text x="394" y="764" fill="#333" font-size="11">操作系统 · 浏览器UA</text>
  <text x="394" y="782" fill="#333" font-size="11">是否信任设备</text>
  <text x="394" y="800" fill="#333" font-size="11">首次/最近登录时间</text>

  <!-- 登录日志 x=140 y=770 -->
  <rect x="40" y="770" width="230" height="120" rx="8" fill="#fff" stroke="#f2c9a3" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="770" width="230" height="28" rx="8" fill="#fef4e8"/>
  <rect x="40" y="790" width="230" height="8" fill="#fef4e8"/>
  <text x="155" y="790" text-anchor="middle" fill="#b8860b" font-size="12" font-weight="600">登录日志 LoginLog</text>
  <text x="54" y="816" fill="#333" font-size="11">登录方式 · IP地址 · 地理位置</text>
  <text x="54" y="834" fill="#333" font-size="11">登录结果（成功/失败/拦截）</text>
  <text x="54" y="852" fill="#333" font-size="11">失败原因 · 登录时间</text>

  <!-- 登录会话 x=720 y=770 -->
  <rect x="720" y="770" width="230" height="120" rx="8" fill="#fff" stroke="#c9b3f2" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="720" y="770" width="230" height="28" rx="8" fill="#f0e8fd"/>
  <rect x="720" y="790" width="230" height="8" fill="#f0e8fd"/>
  <text x="835" y="790" text-anchor="middle" fill="#7b4ea7" font-size="12" font-weight="600">登录会话 Session</text>
  <text x="734" y="816" fill="#333" font-size="11">AccessToken · RefreshToken</text>
  <text x="734" y="834" fill="#333" font-size="11">登录方式 · 登录/过期时间</text>
  <text x="734" y="852" fill="#333" font-size="11">状态（活跃/过期/吊销）</text>

  <!-- ==================== 连线 + 关系标签 ==================== -->
  <!-- 所有连线都是短距离直线，不穿越任何卡片 -->

  <!-- === User 上边 → 上排卡片 === -->

  <!-- User → 登录凭证 1:N -->
  <line x1="530" y1="410" x2="155" y2="220" stroke="#b3d9f2" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="310" y="304" width="46" height="20" rx="10" fill="#1a73a7"/>
  <text x="333" y="318" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">1 : N</text>

  <!-- User → 三方账号绑定 1:N -->
  <line x1="570" y1="410" x2="415" y2="220" stroke="#b3d9f2" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="472" y="304" width="46" height="20" rx="10" fill="#1a73a7"/>
  <text x="495" y="318" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">1 : N</text>

  <!-- User → 验证码 1:N -->
  <line x1="650" y1="410" x2="675" y2="220" stroke="#b3d9f2" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="640" y="304" width="46" height="20" rx="10" fill="#1a73a7"/>
  <text x="663" y="318" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">1 : N</text>

  <!-- User → 商家资质 1:0..1 -->
  <line x1="740" y1="410" x2="935" y2="220" stroke="#b3d9f2" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="810" y="300" width="60" height="20" rx="10" fill="#1a73a7"/>
  <text x="840" y="314" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">1 : 0..1</text>

  <!-- User → 合规同意记录 1:N -->
  <line x1="790" y1="410" x2="1165" y2="220" stroke="#f0d9b5" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="956" y="300" width="46" height="20" rx="10" fill="#8b6914"/>
  <text x="979" y="314" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">1 : N</text>

  <!-- === User 左边 → 角色 === -->

  <!-- User → 角色 M:N -->
  <line x1="480" y1="460" x2="250" y2="440" stroke="#c9b3f2" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="338" y="440" width="52" height="20" rx="10" fill="#7b4ea7"/>
  <text x="364" y="454" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">M : N</text>

  <!-- === 角色 → 权限 === -->

  <!-- 角色 → 权限 M:N -->
  <line x1="145" y1="500" x2="145" y2="540" stroke="#c9b3f2" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="156" y="510" width="52" height="20" rx="10" fill="#7b4ea7"/>
  <text x="182" y="524" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">M : N</text>

  <!-- === User 右边 → 右侧卡片 === -->

  <!-- User → MFA配置 1:0..1 -->
  <line x1="820" y1="450" x2="1060" y2="395" stroke="#f2c9a3" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="910" y="412" width="60" height="20" rx="10" fill="#b8860b"/>
  <text x="940" y="426" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">1 : 0..1</text>

  <!-- User → 审计日志 1:N -->
  <line x1="820" y1="510" x2="1060" y2="555" stroke="#c9b3f2" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="914" y="523" width="46" height="20" rx="10" fill="#7b4ea7"/>
  <text x="937" y="537" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">1 : N</text>

  <!-- User → 风控记录 1:N -->
  <line x1="820" y1="570" x2="1060" y2="720" stroke="#f2c9a3" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="914" y="635" width="46" height="20" rx="10" fill="#b8860b"/>
  <text x="937" y="649" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">1 : N</text>

  <!-- === User 下边 → 设备 === -->

  <!-- User → 设备 1:N -->
  <line x1="600" y1="590" x2="495" y2="700" stroke="#f2c9a3" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="522" y="635" width="46" height="20" rx="10" fill="#b8860b"/>
  <text x="545" y="649" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">1 : N</text>

  <!-- === 设备 → 登录日志 === -->

  <!-- 设备 → 登录日志 1:N（设备左边 → 日志右边） -->
  <line x1="380" y1="810" x2="270" y2="830" stroke="#f2c9a3" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="298" y="810" width="46" height="20" rx="10" fill="#b8860b"/>
  <text x="321" y="824" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">1 : N</text>

  <!-- === 设备 → 登录会话 === -->

  <!-- 设备 → 登录会话 1:N（设备右边 → 会话左边） -->
  <line x1="610" y1="810" x2="720" y2="830" stroke="#d0b8e8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="638" y="810" width="46" height="20" rx="10" fill="#7b4ea7"/>
  <text x="661" y="824" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">1 : N</text>

  <!-- User → 登录日志 1:N（User左下 → 日志上边） -->
  <line x1="480" y1="560" x2="155" y2="770" stroke="#f2c9a3" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <rect x="290" y="655" width="46" height="20" rx="10" fill="#b8860b" opacity="0.7"/>
  <text x="313" y="669" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">1 : N</text>

  <!-- User → 登录会话 1:N（User右下 → 会话上边） -->
  <line x1="750" y1="590" x2="835" y2="770" stroke="#c9b3f2" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <rect x="770" y="670" width="46" height="20" rx="10" fill="#7b4ea7" opacity="0.7"/>
  <text x="793" y="684" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">1 : N</text>

  <!-- ==================== 图例 ==================== -->
  <rect x="40" y="940" width="1220" height="130" rx="10" fill="#fff" stroke="#e2e6ed" stroke-width="1" filter="url(#shadow)"/>

  <text x="60" y="968" fill="#444" font-size="13" font-weight="600">图例</text>

  <!-- 颜色图例 -->
  <rect x="60" y="984" width="14" height="14" rx="3" fill="#1a73a7"/>
  <text x="80" y="996" fill="#666" font-size="11">核心实体 / 身份认证</text>
