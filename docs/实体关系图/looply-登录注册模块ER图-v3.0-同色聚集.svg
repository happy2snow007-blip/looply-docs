<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 920" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,3 L0,6 Z" fill="#999"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="1400" height="920" fill="#f8f9fc" rx="12"/>

  <!-- 标题栏 -->
  <rect x="0" y="0" width="1400" height="60" fill="url(#headerGrad)" rx="12"/>
  <rect x="0" y="36" width="1400" height="24" fill="url(#headerGrad)"/>
  <text x="700" y="36" text-anchor="middle" fill="#fff" font-size="20" font-weight="600">looply · 登录注册模块 实体关系图（ER）</text>
  <text x="1360" y="36" text-anchor="end" fill="#8892a4" font-size="11">v3.0 · 2026.03</text>

  <!-- 上方：身份认证（蓝色） -->
  <text x="340" y="82" fill="#1a73a7" font-size="12" font-weight="600" letter-spacing="2">身份认证</text>
  <line x1="400" y1="78" x2="1060" y2="78" stroke="#b3d9f2" stroke-width="1"/>

  <!-- 登录凭证 -->
  <rect x="340" y="96" width="220" height="130" rx="8" fill="#fff" stroke="#b3d9f2" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="340" y="96" width="220" height="26" rx="8" fill="#e8f4fd"/>
  <rect x="340" y="114" width="220" height="8" fill="#e8f4fd"/>
  <text x="450" y="114" text-anchor="middle" fill="#1a73a7" font-size="12" font-weight="600">登录凭证 Credential</text>
  <text x="354" y="136" fill="#333" font-size="11">凭证类型（邮箱/手机/用户名）</text>
  <text x="354" y="152" fill="#333" font-size="11">凭证值</text>
  <text x="354" y="168" fill="#333" font-size="11">密码哈希</text>
  <text x="354" y="184" fill="#333" font-size="11">是否已验证</text>
  <text x="354" y="200" fill="#333" font-size="11">状态</text>
  <text x="354" y="216" fill="#999" font-size="10">一个用户可同时有邮箱+手机号</text>

  <!-- 三方账号绑定 -->
  <rect x="590" y="96" width="220" height="130" rx="8" fill="#fff" stroke="#b3d9f2" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="590" y="96" width="220" height="26" rx="8" fill="#e8f4fd"/>
  <rect x="590" y="114" width="220" height="8" fill="#e8f4fd"/>
  <text x="700" y="114" text-anchor="middle" fill="#1a73a7" font-size="12" font-weight="600">三方账号绑定 OAuthBinding</text>
  <text x="604" y="136" fill="#333" font-size="11">三方平台（Google/Apple/FB）</text>
  <text x="604" y="152" fill="#333" font-size="11">平台用户ID</text>
  <text x="604" y="168" fill="#333" font-size="11">平台昵称</text>
  <text x="604" y="184" fill="#333" font-size="11">头像</text>
  <text x="604" y="200" fill="#333" font-size="11">绑定时间 · 状态</text>
  <text x="604" y="216" fill="#999" font-size="10">可同时绑定多个三方平台</text>

  <!-- 验证码 -->
  <rect x="840" y="96" width="220" height="140" rx="8" fill="#fff" stroke="#b3d9f2" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="840" y="96" width="220" height="26" rx="8" fill="#e8f4fd"/>
  <rect x="840" y="114" width="220" height="8" fill="#e8f4fd"/>
  <text x="950" y="114" text-anchor="middle" fill="#1a73a7" font-size="12" font-weight="600">验证码 VerificationCode</text>
  <text x="854" y="136" fill="#333" font-size="11">用途（注册/登录/重置/绑定）</text>
  <text x="854" y="152" fill="#333" font-size="11">发送渠道（邮箱/SMS）</text>
  <text x="854" y="168" fill="#333" font-size="11">验证码值</text>
  <text x="854" y="184" fill="#333" font-size="11">尝试次数</text>
  <text x="854" y="200" fill="#333" font-size="11">过期时间</text>
  <text x="854" y="216" fill="#333" font-size="11">状态（待验证/已使用/已过期）</text>

  <!-- 核心：User -->
  <rect x="530" y="290" width="340" height="150" rx="12" fill="#fff" stroke="#1a73a7" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="530" y="290" width="340" height="32" rx="12" fill="#1a73a7"/>
  <rect x="530" y="312" width="340" height="10" fill="#1a73a7"/>
  <text x="700" y="312" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">用户 User</text>
  <text x="546" y="336" fill="#333" font-size="11">用户ID</text>
  <text x="546" y="352" fill="#333" font-size="11">用户类型（C端/B端/内部）</text>
  <text x="546" y="368" fill="#333" font-size="11">注册渠道（App/H5/Web）</text>
  <text x="546" y="384" fill="#333" font-size="11">国家地区</text>
  <text x="546" y="400" fill="#333" font-size="11">语言偏好</text>
  <text x="546" y="416" fill="#333" font-size="11">注册时间 · 状态（正常/冻结/注销）</text>

  <!-- 左侧：权限管理（紫色） -->
  <text x="20" y="262" fill="#7b4ea7" font-size="12" font-weight="600" letter-spacing="2">权限管理</text>
  <line x1="80" y1="258" x2="240" y2="258" stroke="#c9b3f2" stroke-width="1"/>

  <!-- 角色 -->
  <rect x="20" y="278" width="220" height="100" rx="8" fill="#fff" stroke="#c9b3f2" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="20" y="278" width="220" height="26" rx="8" fill="#f0e8fd"/>
  <rect x="20" y="296" width="220" height="8" fill="#f0e8fd"/>
  <text x="130" y="296" text-anchor="middle" fill="#7b4ea7" font-size="12" font-weight="600">角色 Role</text>
  <text x="34" y="318" fill="#333" font-size="11">角色名称</text>
  <text x="34" y="334" fill="#333" font-size="11">角色编码</text>
  <text x="34" y="350" fill="#333" font-size="11">描述</text>
  <text x="34" y="366" fill="#333" font-size="11">是否可切换</text>

  <!-- 权限 -->
  <rect x="20" y="396" width="220" height="90" rx="8" fill="#fff" stroke="#c9b3f2" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="20" y="396" width="220" height="26" rx="8" fill="#f0e8fd"/>
  <rect x="20" y="414" width="220" height="8" fill="#f0e8fd"/>
  <text x="130" y="414" text-anchor="middle" fill="#7b4ea7" font-size="12" font-weight="600">权限 Permission</text>
  <text x="34" y="436" fill="#333" font-size="11">权限名称</text>
  <text x="34" y="452" fill="#333" font-size="11">权限编码</text>
  <text x="34" y="468" fill="#333" font-size="11">资源类型</text>
  <text x="34" y="478" fill="#333" font-size="11">操作（读/写/删除）</text>

  <!-- 审计日志 -->
  <rect x="20" y="504" width="220" height="100" rx="8" fill="#fff" stroke="#c9b3f2" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="20" y="504" width="220" height="26" rx="8" fill="#f0e8fd"/>
  <rect x="20" y="522" width="220" height="8" fill="#f0e8fd"/>
  <text x="130" y="522" text-anchor="middle" fill="#7b4ea7" font-size="12" font-weight="600">审计日志 AuditLog</text>
  <text x="34" y="544" fill="#333" font-size="11">操作类型（改密码/绑手机/注销）</text>
  <text x="34" y="560" fill="#333" font-size="11">操作详情</text>
  <text x="34" y="576" fill="#333" font-size="11">IP地址</text>
  <text x="34" y="592" fill="#333" font-size="11">设备信息 · 操作时间</text>

  <!-- 登录会话 -->
  <rect x="20" y="612" width="220" height="110" rx="8" fill="#fff" stroke="#c9b3f2" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="20" y="612" width="220" height="26" rx="8" fill="#f0e8fd"/>
  <rect x="20" y="630" width="220" height="8" fill="#f0e8fd"/>
  <text x="130" y="630" text-anchor="middle" fill="#7b4ea7" font-size="12" font-weight="600">登录会话 Session</text>
  <text x="34" y="652" fill="#333" font-size="11">AccessToken</text>
  <text x="34" y="668" fill="#333" font-size="11">RefreshToken</text>
  <text x="34" y="684" fill="#333" font-size="11">登录方式</text>
  <text x="34" y="700" fill="#333" font-size="11">登录时间 · 过期时间</text>
  <text x="34" y="712" fill="#333" font-size="11">状态（活跃/过期/吊销）</text>

  <!-- 右侧：安全防护（橙色） -->
  <text x="1160" y="262" fill="#b8860b" font-size="12" font-weight="600" letter-spacing="2">安全防护</text>
  <line x1="1220" y1="258" x2="1380" y2="258" stroke="#f2c9a3" stroke-width="1"/>

  <!-- MFA配置 -->
  <rect x="1160" y="278" width="220" height="95" rx="8" fill="#fff" stroke="#f2c9a3" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="1160" y="278" width="220" height="26" rx="8" fill="#fef4e8"/>
  <rect x="1160" y="296" width="220" height="8" fill="#fef4e8"/>
  <text x="1270" y="296" text-anchor="middle" fill="#b8860b" font-size="12" font-weight="600">多因素认证 MFAConfig</text>
  <text x="1174" y="318" fill="#333" font-size="11">MFA类型（TOTP/SMS/邮箱）</text>
  <text x="1174" y="334" fill="#333" font-size="11">密钥</text>
  <text x="1174" y="350" fill="#333" font-size="11">是否启用</text>
  <text x="1174" y="366" fill="#333" font-size="11">配置时间</text>

  <!-- 风控记录 -->
  <rect x="1160" y="386" width="220" height="110" rx="8" fill="#fff" stroke="#f2c9a3" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="1160" y="386" width="220" height="26" rx="8" fill="#fef4e8"/>
  <rect x="1160" y="404" width="220" height="8" fill="#fef4e8"/>
  <text x="1270" y="404" text-anchor="middle" fill="#b8860b" font-size="12" font-weight="600">风控记录 RiskRecord</text>
  <text x="1174" y="426" fill="#333" font-size="11">风控类型（暴力破解/异地/新设备）</text>
  <text x="1174" y="442" fill="#333" font-size="11">触发规则</text>
  <text x="1174" y="458" fill="#333" font-size="11">IP地址</text>
  <text x="1174" y="474" fill="#333" font-size="11">处理结果（放行/验证/拦截/封禁）</text>
  <text x="1174" y="486" fill="#333" font-size="11">触发时间</text>

  <!-- 设备 -->
  <rect x="1160" y="504" width="220" height="130" rx="8" fill="#fff" stroke="#f2c9a3" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="1160" y="504" width="220" height="26" rx="8" fill="#fef4e8"/>
  <rect x="1160" y="522" width="220" height="8" fill="#fef4e8"/>
  <text x="1270" y="522" text-anchor="middle" fill="#b8860b" font-size="12" font-weight="600">设备 Device</text>
  <text x="1174" y="544" fill="#333" font-size="11">设备指纹</text>
  <text x="1174" y="560" fill="#333" font-size="11">设备类型</text>
  <text x="1174" y="576" fill="#333" font-size="11">操作系统</text>
  <text x="1174" y="592" fill="#333" font-size="11">浏览器UA</text>
  <text x="1174" y="608" fill="#333" font-size="11">是否信任设备</text>
  <text x="1174" y="624" fill="#333" font-size="11">首次/最近登录时间</text>

  <!-- 登录日志 -->
  <rect x="1160" y="644" width="220" height="110" rx="8" fill="#fff" stroke="#f2c9a3" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="1160" y="644" width="220" height="26" rx="8" fill="#fef4e8"/>
  <rect x="1160" y="662" width="220" height="8" fill="#fef4e8"/>
  <text x="1270" y="662" text-anchor="middle" fill="#b8860b" font-size="12" font-weight="600">登录日志 LoginLog</text>
  <text x="1174" y="684" fill="#333" font-size="11">登录方式</text>
  <text x="1174" y="700" fill="#333" font-size="11">IP地址</text>
  <text x="1174" y="716" fill="#333" font-size="11">地理位置</text>
  <text x="1174" y="732" fill="#333" font-size="11">登录结果（成功/失败/拦截）</text>
  <text x="1174" y="744" fill="#333" font-size="11">失败原因 · 登录时间</text>

  <!-- 下方：个人资料（绿色） -->
  <rect x="420" y="520" width="220" height="125" rx="8" fill="#fff" stroke="#7cb89e" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="420" y="520" width="220" height="26" rx="8" fill="#e8f5ee"/>
  <rect x="420" y="538" width="220" height="8" fill="#e8f5ee"/>
  <text x="530" y="538" text-anchor="middle" fill="#2e7d52" font-size="12" font-weight="600">用户个人资料 UserProfile</text>
  <text x="434" y="560" fill="#333" font-size="11">昵称</text>
  <text x="434" y="576" fill="#333" font-size="11">头像URL</text>
  <text x="434" y="592" fill="#333" font-size="11">性别</text>
  <text x="434" y="608" fill="#333" font-size="11">生日</text>
  <text x="434" y="624" fill="#333" font-size="11">个人简介</text>
  <text x="434" y="636" fill="#333" font-size="11">收货地址 · 联系方式</text>

  <!-- 下方：合规（棕色） -->
  <rect x="720" y="620" width="300" height="95" rx="8" fill="#fff" stroke="#f0d9b5" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="720" y="620" width="300" height="26" rx="8" fill="#fff8f0"/>
  <rect x="720" y="638" width="300" height="8" fill="#fff8f0"/>
  <text x="870" y="638" text-anchor="middle" fill="#8b6914" font-size="12" font-weight="600">合规同意记录 ConsentRecord</text>
  <text x="734" y="662" fill="#333" font-size="11">同意类型（隐私政策/用户协议/Cookie/GDPR）</text>
  <text x="734" y="678" fill="#333" font-size="11">协议版本</text>
  <text x="734" y="694" fill="#333" font-size="11">适用国家</text>
  <text x="734" y="706" fill="#333" font-size="11">同意时间 · 撤回时间</text>

  <!-- 连线：User → 身份认证 -->
  <line x1="600" y1="290" x2="450" y2="226" stroke="#b3d9f2" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="500" y="248" width="46" height="20" rx="10" fill="#1a73a7"/>
  <text x="523" y="262" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">1 : N</text>

  <line x1="700" y1="290" x2="700" y2="226" stroke="#b3d9f2" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="677" y="248" width="46" height="20" rx="10" fill="#1a73a7"/>
  <text x="700" y="262" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">1 : N</text>

  <line x1="800" y1="290" x2="950" y2="236" stroke="#b3d9f2" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="850" y="253" width="46" height="20" rx="10" fill="#1a73a7"/>
  <text x="873" y="267" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">1 : N</text>

  <!-- 连线：User → 权限管理 -->
  <line x1="530" y1="330" x2="240" y2="328" stroke="#c9b3f2" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="360" y="319" width="52" height="20" rx="10" fill="#7b4ea7"/>
  <text x="386" y="333" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">M : N</text>

  <!-- 角色 → 权限 -->
  <line x1="130" y1="378" x2="130" y2="396" stroke="#c9b3f2" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="144" y="377" width="52" height="20" rx="10" fill="#7b4ea7"/>
  <text x="170" y="391" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">M : N</text>

  <line x1="530" y1="370" x2="240" y2="604" stroke="#c9b3f2" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="360" y="480" width="46" height="20" rx="10" fill="#7b4ea7"/>
  <text x="383" y="494" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">1 : N</text>

  <line x1="530" y1="410" x2="240" y2="612" stroke="#c9b3f2" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <rect x="360" y="500" width="46" height="20" rx="10" fill="#7b4ea7" opacity="0.7"/>
  <text x="383" y="514" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">1 : N</text>

  <!-- 连线：User → 安全防护 -->
  <line x1="870" y1="330" x2="1160" y2="323" stroke="#f2c9a3" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="990" y="317" width="60" height="20" rx="10" fill="#b8860b"/>
  <text x="1020" y="331" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">1 : 0..1</text>

  <line x1="870" y1="370" x2="1160" y2="436" stroke="#f2c9a3" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="990" y="393" width="46" height="20" rx="10" fill="#b8860b"/>
  <text x="1013" y="407" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">1 : N</text>

  <line x1="870" y1="400" x2="1160" y2="559" stroke="#f2c9a3" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="990" y="470" width="46" height="20" rx="10" fill="#b8860b"/>
  <text x="1013" y="484" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">1 : N</text>

  <line x1="870" y1="420" x2="1160" y2="699" stroke="#f2c9a3" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <rect x="990" y="550" width="46" height="20" rx="10" fill="#b8860b" opacity="0.7"/>
  <text x="1013" y="564" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">1 : N</text>

  <!-- 设备 → 登录日志 -->
  <line x1="1270" y1="634" x2="1270" y2="644" stroke="#f2c9a3" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="1284" y="636" width="46" height="20" rx="10" fill="#b8860b"/>
  <text x="1307" y="650" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">1 : N</text>

  <!-- 设备 → 登录会话（跨区域虚线） -->
  <path d="M 1160 559 L 1100 559 L 1100 740 L 300 740 L 300 662 L 240 662" stroke="#c9b3f2" stroke-width="1.5" stroke-dasharray="6,3" fill="none" marker-end="url(#arrow)"/>
  <rect x="660" y="730" width="46" height="20" rx="10" fill="#7b4ea7" opacity="0.7"/>
  <text x="683" y="744" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">1 : N</text>

  <!-- 连线：User → 下方 -->
  <line x1="600" y1="440" x2="530" y2="520" stroke="#7cb89e" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="540" y="470" width="46" height="20" rx="10" fill="#2e7d52"/>
  <text x="563" y="484" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">1 : 1</text>

  <!-- User → 合规 -->
  <line x1="700" y1="440" x2="870" y2="620" stroke="#f0d9b5" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="760" y="520" width="46" height="20" rx="10" fill="#8b6914"/>
  <text x="783" y="534" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">1 : N</text>

  <!-- 图例 -->
  <rect x="100" y="760" width="1200" height="120" rx="10" fill="#fff" stroke="#e2e6ed" stroke-width="1" filter="url(#shadow)"/>
  <text x="120" y="786" fill="#444" font-size="12" font-weight="600">图例</text>

  <rect x="120" y="798" width="14" height="14" rx="3" fill="#1a73a7"/>
  <text x="140" y="810" fill="#666" font-size="11">核心 / 身份认证</text>
  <rect x="260" y="798" width="14" height="14" rx="3" fill="#c9b3f2"/>
