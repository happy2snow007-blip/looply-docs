<style>
html,body,#root{height:100%;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F9FAFB;color:#1F2937}
#root::before{content:'正在加载 antd 原型……';position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#9CA3AF;font-size:14px}
#root:not(:empty)::before{display:none}
.lp-kpi{background:linear-gradient(180deg,#FEFCFF 0%,#F3EEFF 100%);border:1px solid #DDD6FE;border-radius:14px;padding:14px 16px}
.lp-kpi .num{font-size:24px;font-weight:700;color:#7C3AED;line-height:1;margin-bottom:6px;font-variant-numeric:tabular-nums}
.lp-kpi .label{font-size:12px;color:#6B7280}
.lp-pagination{display:flex;align-items:center;justify-content:center;gap:24px;padding:12px 16px;font-size:13px;color:#6B7280}
.lp-pagination .divider{width:1px;height:20px;background:#E5E7EB}
.lp-tip-trigger{cursor:help;border-bottom:1px dashed #9CA3AF;padding-bottom:1px}
.lp-section{font-size:15px;font-weight:600;color:#1F2937;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid #E5E7EB}
.lp-oplog-title{font-size:14px;font-weight:700;color:#7C3AED;margin:24px 0 12px}
.lp-empty{display:flex;flex-direction:column;align-items:center;padding:60px 20px;text-align:center}
.lp-empty .icon{font-size:48px;margin-bottom:16px;color:#9CA3AF}
.lp-empty .icon.err{color:#DC2626}
.lp-empty .title{font-size:16px;font-weight:600;color:#1F2937;margin-bottom:8px}
.lp-empty .desc{font-size:13px;color:#6B7280;margin-bottom:24px;max-width:360px}
.lp-form-row{display:flex;gap:16px;margin-bottom:12px;align-items:center}
.lp-form-row:first-of-type{margin-top:8px}
.lp-form-row .lp-form-label{width:140px;text-align:right;color:#6B7280;font-size:13px;flex-shrink:0}
.lp-form-row .lp-form-label .req{color:#DC2626;margin-right:4px}
.lp-form-row .lp-form-control{flex:1}
.lp-detail{display:grid;grid-template-columns:140px 1fr;gap:10px 16px;font-size:13px;margin-bottom:24px}
.lp-detail .dl{color:#6B7280}
.lp-detail .dv{color:#1F2937}
.lp-code{font-family:Menlo,Monaco,Consolas,monospace;font-size:11px;color:#6B7280;background:#F3F4F6;padding:1px 6px;border-radius:4px}
.rate-up{color:#16A34A;font-weight:600}
.rate-down{color:#DC2626;font-weight:600}
.rate-flat{color:#9CA3AF}
.lp-radio-card-group{display:flex;gap:12px;margin-bottom:16px}
.lp-radio-card{flex:1;padding:12px 16px;border:2px solid #D1D5DB;border-radius:10px;background:#fff;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .15s}
.lp-radio-card.active{border-color:#7C3AED;background:#FAF5FF}
.lp-radio-card .title{font-weight:600;font-size:13px;color:#1F2937;margin-bottom:2px}
.lp-radio-card .desc{font-size:11px;color:#6B7280}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

/* ───────────── 业务组件 ───────────── */
function Kpi({ num, label, numStyle, onClick }) {
  return <div className="lp-kpi" style={onClick ? { cursor:'pointer' } : null} onClick={onClick}>
    <div className="label" style={{ marginBottom:6 }}>{label}</div><div className="num" style={numStyle}>{num}</div></div>;
}
function StatusTag({ variant, children }) {
  const c = TAG_COLORS[variant] || TAG_COLORS.off;
  return <Tag bordered={false} style={{ background:c.bg, color:c.color, borderRadius:999, padding:'2px 8px', fontSize:12, lineHeight:'18px', marginInlineEnd:4 }}>{children}</Tag>;
}
function TipText({ label, tip }) {
  return (
    <Tooltip title={<div style={{ whiteSpace:'pre-line', lineHeight:1.6 }}>{tip}</div>} color="#fff"
      styles={{ body: { color:'#374151', fontSize:12, padding:'10px 14px', maxWidth:300 } }}>
      <span className="lp-tip-trigger">{label}</span>
    </Tooltip>
  );
}
function CompactPagination({ total, current=1, pageSize=10, totalPages }) {
  const pages = useMemo(() => {
    const tp = totalPages || Math.ceil(total / pageSize) || 1;
    const out = [{ k:'prev', label:'<', disabled:current===1, arrow:true }];
    if (tp <= 6) for (let i=1; i<=tp; i++) out.push({ k:i, label:i });
    else { out.push({k:1,label:1}); out.push({k:2,label:2}); out.push({k:3,label:3}); out.push({k:'gap',label:'…',disabled:true}); out.push({k:tp,label:tp}); }
    out.push({ k:'next', label:'>', disabled:current===tp, arrow:true });
    return out;
  }, [current, totalPages, total, pageSize]);
  const tp = totalPages || Math.ceil(total / pageSize) || 1;
  return (
    <div className="lp-pagination">
      <span>共 {total.toLocaleString()} 条,每页{' '}
        <Select size="small" value={pageSize} style={{ width:72, marginInline:4 }}
          options={[{value:10,label:10},{value:20,label:20},{value:50,label:50}]} />{' '}条</span>
      <div className="divider" />
      <Space size={2}>
        {pages.map(p => (
          <span key={p.k} style={{ minWidth:32, height:32, display:'inline-flex', alignItems:'center', justifyContent:'center',
            borderRadius:8, fontSize:13, cursor:p.disabled?'default':'pointer',
            background:p.k===current?'#7C3AED':(p.arrow?'#fff':'transparent'),
            color:p.k===current?'#fff':'#374151', border:p.arrow?'1px solid #E5E7EB':'none',
            fontWeight:p.k===current?600:400, opacity:p.disabled?0.35:1 }}>{p.label}</span>
        ))}
      </Space>
      <div className="divider" />
      <span>第 {current}/{tp} 页</span>
    </div>
  );
}
function EmptyZero({ entity, cta, onCta }) {
  return <div className="lp-empty"><InboxOutlined className="icon" /><div className="title">暂无{entity}</div>
    <div className="desc">点击下方按钮创建第一个{entity}</div>{cta && <Button type="primary" onClick={onCta}>{cta}</Button>}</div>;
}
function EmptyNoMatch({ onClear }) {
  return <div className="lp-empty"><SearchOutlined className="icon" /><div className="title">未找到匹配结果</div>
    <div className="desc">请尝试调整搜索关键词或筛选条件</div><Button onClick={onClear}>清除筛选条件</Button></div>;
}
function EmptyError({ onRetry }) {
  return <div className="lp-empty"><ExclamationCircleOutlined className="icon err" /><div className="title">加载失败</div>
    <div className="desc">网络异常,请检查网络连接后重试</div><Button type="primary" onClick={onRetry}>重试</Button></div>;
}
function EmptyStateSwitcher({ mode, setMode }) {
  return (
    <div style={{ marginTop:12, display:'flex', gap:8, justifyContent:'center' }}>
      {[['data','正常数据'],['zero','零数据态'],['no-match','无匹配态'],['error','异常态']].map(([k, label]) =>
        <Button key={k} type={mode===k?'primary':'default'} onClick={() => setMode(k)}>{label}</Button>)}
    </div>
  );
}
function FormRow({ label, required, children, helper }) {
  return (
    <>
      <div className="lp-form-row">
        <div className="lp-form-label">{required && <span className="req">*</span>}{label}</div>
        <div className="lp-form-control">{children}</div>
      </div>
      {helper && <div style={{ fontSize:12, color:'#9CA3AF', margin:'-4px 0 12px 156px' }}>{helper}</div>}
    </>
  );
}
function RadioCardGroup({ value, onChange, options }) {
  return (
    <div className="lp-radio-card-group">
      {options.map(o => (
        <label key={o.value} className={'lp-radio-card' + (value === o.value ? ' active' : '')} onClick={() => onChange(o.value)}>
          <input type="radio" checked={value === o.value} onChange={() => {}} style={{ accentColor:'#7C3AED' }} />
          <span><div className="title">{o.title}</div><div className="desc">{o.desc}</div></span>
        </label>
      ))}
    </div>
  );
}

function OpLog({ data, total, cols, types }) {

  'published-rate':'汇率管理 / 平台汇率','published-rate-edit':'汇率管理 / 平台汇率 / 设置汇率','published-rate-history':'汇率管理 / 平台汇率 / 汇率历史',
  'spread-rule':'汇率管理 / 点差规则','spread-rule-edit':'汇率管理 / 点差规则 / 编辑','spread-rule-edit-global':'汇率管理 / 点差规则 / 编辑','spread-rule-add':'汇率管理 / 点差规则 / 新增',
  'exchange-source':'汇率管理 / 数据源管理','exchange-source-edit':'汇率管理 / 数据源管理 / 编辑','exchange-source-test':'汇率管理 / 数据源管理 / 测试连接',
  'fetch-records':'汇率管理 / 原始汇率',
  'alert-center':'汇率管理 / 异常告警','alert-center-threshold':'汇率管理 / 异常告警 / 阈值','alert-center-handle':'汇率管理 / 异常告警 / 处理','alert-center-handle-fixed':'汇率管理 / 异常告警 / 处理',
};

function App() {
  const [currentPage, setCurrentPage] = useState('published-rate');
  const [confirm, setConfirm] = useState({ open:false, text:'' });
  const go = (key) => setCurrentPage(key);
  const onConfirm = (text) => setConfirm({ open:true, text });
  const activeMenu = PAGE_MENU[currentPage];
  const menuItems = [{
    key:'exchange', icon:<BarChartOutlined />, label:'汇率管理',
    children: CHILDREN.map(c => ({ key:c.key, icon:c.icon,
      label:<span style={{ fontWeight: activeMenu===c.key ? 600 : 400, display:'inline-flex', alignItems:'center', gap:8 }}>{c.label}{c.badge && <Badge count={c.badge} size="small" />}</span> })),
  }];
  return (
    <ConfigProvider theme={looplyTheme}>
      <Layout style={{ height:'100vh' }}>
        <Layout.Header style={{ borderBottom:'1px solid #E5E7EB', display:'flex', alignItems:'center' }}>
          <img src={LOGO_SRC} alt="Looply" style={{ height:32, display:'block' }} />
          <div style={{ width:1, height:20, background:'#E5E7EB', margin:'0 16px' }} />
          <span style={{ fontSize:14, fontWeight:500, color:'#6B7280' }}>汇率管理</span>
          <span style={{ marginLeft:'auto', color:'#9CA3AF', fontSize:13 }}>{CRUMB[currentPage]}</span>
        </Layout.Header>
        <Layout>
          <Layout.Sider width={220} theme="light" style={SIDER_STYLE}>
            <Menu mode="inline" items={menuItems} selectedKeys={[activeMenu]} defaultOpenKeys={['exchange']}
              style={{ borderInlineEnd:'none' }} onClick={({ key }) => go(key)} />
          </Layout.Sider>
          <Layout.Content style={{ padding:28, overflow:'auto' }}>
            {currentPage==='published-rate' && <PublishedRateListPage go={go} />}
            {currentPage==='published-rate-edit' && <PublishedRateEditPage go={go} onConfirm={onConfirm} />}
            {currentPage==='published-rate-history' && <PublishedRateHistoryPage go={go} />}
            {currentPage==='spread-rule' && <SpreadRuleListPage go={go} onConfirm={onConfirm} />}
            {currentPage==='spread-rule-edit' && <SpreadRuleEditPage go={go} onConfirm={onConfirm} />}
            {currentPage==='spread-rule-edit-global' && <SpreadRuleEditPage go={go} onConfirm={onConfirm} global />}
            {currentPage==='spread-rule-add' && <SpreadRuleAddPage go={go} onConfirm={onConfirm} />}
            {currentPage==='exchange-source' && <ExchangeSourceListPage go={go} />}
            {currentPage==='exchange-source-edit' && <ExchangeSourceEditPage go={go} onConfirm={onConfirm} />}
            {currentPage==='exchange-source-test' && <ExchangeSourceTestPage go={go} />}
            {currentPage==='fetch-records' && <FetchRecordsListPage />}
            {currentPage==='alert-center' && <AlertCenterListPage go={go} />}
            {currentPage==='alert-center-threshold' && <AlertThresholdPage go={go} onConfirm={onConfirm} />}
            {currentPage==='alert-center-handle' && <AlertHandlePage go={go} onConfirm={onConfirm} />}
            {currentPage==='alert-center-handle-fixed' && <AlertHandlePage go={go} onConfirm={onConfirm} fixed />}
          </Layout.Content>
        </Layout>
      </Layout>
      <ConfirmModal open={confirm.open} text={confirm.text} onClose={() => setConfirm({ open:false, text:'' })} />
    </ConfigProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
