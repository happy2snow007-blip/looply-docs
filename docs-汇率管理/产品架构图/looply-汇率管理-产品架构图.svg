<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
<!-- STRUCTURED DATA
domain: 汇率管理
version: 2.0
scope: 汇率源接入、点差配置、汇率加工发布、汇率查询服务、变动日志与审计、异常监控
excludes: 价格计算、金额格式化、报价锁定、心理价修正、支付结算、财务对账

layers:
  - name: 用户层
    users:
      - role: 运营人员
        operations: [汇率监控, 点差配置, 手动发布, 异常处理, 历史查询]

  - name: 核心能力
    sublayers:
      - name: 数据获取层
        modules:
          - name: 汇率源接入管理
            items: [主数据源(Open Exchange Rates), 备用数据源(ExchangeRate-API), 拉取调度(每小时), 失败重试, 源切换]
      - name: 数据加工层
        modules:
          - name: 点差规则引擎
            items: [全局默认点差(2%), 单币种点差覆盖, 点差计算, 规则优先级]
          - name: 汇率发布机制
            items: [定时发布(每日), 手动发布, 异常阈值检测(±5%), 发布审核]
      - name: 数据服务层
        modules:
          - name: 汇率查询服务
            items: [单个汇率查询, 批量汇率查询, 全量汇率查询, 历史汇率查询]
          - name: 变动日志与审计
            items: [变动日志, 批次记录, 操作审计, 回溯查询]
      - name: 监控运维层
        modules:
          - name: 异常监控告警
            items: [拉取失败告警, 波动超阈值告警, 币种缺失告警, 人工干预]

  - name: 外围系统
    internal: [币种管理模块, 商品系统, 运费系统, 支付系统, 订单系统]
    external: [Open Exchange Rates, ExchangeRate-API]
-->

