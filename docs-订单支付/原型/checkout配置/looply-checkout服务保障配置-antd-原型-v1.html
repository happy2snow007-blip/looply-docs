function StatusTag({variant='off',children}) {

}
function TipText({label,tip}) {
  return <Tooltip title={<div style={{whiteSpace:'pre-line',lineHeight:1.6}}>{tip}</div>} color="#fff" styles={{body:{color:'#374151',fontSize:12,padding:'10px 14px'}}}><span className="lp-tip-trigger">{label}</span></Tooltip>;
}
function FormRow({label,required,helper,children}) {
  return <><div className="lp-form-row"><div className="lp-form-label">{required&&<span className="req">*</span>}{label}</div><div className="lp-form-control">{children}</div></div>{helper&&<div className="lp-helper">{helper}</div>}</>;
}
function AssuranceIcon({iconUrl,alt='保障图标'}) {
  return iconUrl?<img src={iconUrl} alt={alt} style={{width:20,height:20,display:'block',objectFit:'contain'}}/>:<span style={{fontSize:12,color:'#9CA3AF'}}>无</span>;
}
function AssuranceItemDrawer({open,item,onClose,onSave}) {
  const [form,setForm]=React.useState(item||{});
  React.useEffect(()=>{if(open)setForm(item||{iconUrl:'',iconName:'',copy:'',enabled:true});},[open,item]);
  const patch=(key,value)=>setForm(current=>({...current,[key]:value}));
  const beforeUpload=file=>{
    const allowed=['image/svg+xml','image/png'].includes(file.type)||/\.(svg|png)$/i.test(file.name);
    if(!allowed){message.error('仅支持 SVG 或 PNG 格式');return Upload.LIST_IGNORE;}
    if(file.size>200*1024){message.error('图标文件不能超过 200 KB');return Upload.LIST_IGNORE;}
    const reader=new FileReader();
    reader.onload=()=>setForm(current=>({...current,iconUrl:reader.result,iconName:file.name}));
    reader.readAsDataURL(file);
    return false;
  };
  const submit=()=>{
    if(!form.iconUrl){message.warning('请上传图标');return;}
    if(!String(form.copy||'').trim()){message.warning('请输入展示文案');return;}
    onSave({...form,copy:form.copy.trim()});
  };
  return <Drawer open={open} onClose={onClose} closable={false} maskClosable={false} width={620} title={form.id?'编辑保障项':'新增保障项'} extra={<Button onClick={onClose}>取消</Button>} footer={<div style={{display:'flex',justifyContent:'flex-end',gap:12}}><Button onClick={onClose}>取消</Button><Button type="primary" onClick={submit}>保存到草稿</Button></div>}>
    <h4 className="lp-section">保障项配置</h4>
    <FormRow label="启用状态"><Switch checked={Boolean(form.enabled)} checkedChildren="启用" unCheckedChildren="停用" onChange={value=>patch('enabled',value)}/></FormRow>
    <FormRow label="图标" required helper="支持 SVG、PNG，建议 24 × 24 px，文件不超过 200 KB。"><div style={{display:'flex',alignItems:'center',gap:12}}><span className="lp-icon-preview"><AssuranceIcon iconUrl={form.iconUrl}/></span><Upload accept=".svg,.png,image/svg+xml,image/png" maxCount={1} showUploadList={false} beforeUpload={beforeUpload}><Button icon={<UploadOutlined/>}>上传图标</Button></Upload><span style={{fontSize:12,color:'#6B7280'}}>{form.iconName||'未上传'}</span></div></FormRow>
    <FormRow label="展示文案" required helper="前台以图标 + 单行文案展示。"><Input value={form.copy} maxLength={80} showCount placeholder="Secure payment processing" onChange={event=>patch('copy',event.target.value)}/></FormRow>
  </Drawer>;
}

function PreviewModal({open,items,onClose}) {
  const enabled=items.filter(item=>item.enabled).sort((a,b)=>a.sortOrder-b.sortOrder);
  const rows=enabled.map(item=><div className="lp-assurance-row" key={item.id}><span className="lp-icon-preview" style={{width:22,height:22,border:0,background:'transparent'}}><AssuranceIcon iconUrl={item.iconUrl}/></span><div className="copy">{item.copy}</div></div>);
  const pc=<div className="lp-preview-shell"><div className="lp-preview-pc"><div className="lp-preview-main"><strong>Contact & delivery</strong><div className="lp-preview-lines"><div className="lp-preview-line"/><div className="lp-preview-line short"/><div className="lp-preview-line"/><div className="lp-preview-line"/></div></div><div><div className="lp-preview-summary"><strong>Order summary</strong><div className="lp-preview-lines"><div className="lp-preview-line"/><div className="lp-preview-line short"/><div className="lp-preview-line"/></div></div><div className="lp-assurance-box">{rows}</div></div></div><div className="lp-preview-note">PC：服务保障展示在订单汇总下方</div></div>;
  const h5=<div className="lp-preview-shell"><div className="lp-preview-phone"><div className="lp-phone-head">Checkout</div><div className="lp-phone-block"/><div className="lp-phone-block"/><div className="lp-phone-pay">Pay Now</div><div className="lp-assurance-box" style={{border:0,padding:'6px 0'}}>{rows}</div></div><div className="lp-preview-note">移动端：服务保障展示在支付操作区下方</div></div>;
  return <Modal title="Checkout 服务保障预览" open={open} onCancel={onClose} closable={false} maskClosable={false} centered width={980} footer={[<Button key="close" onClick={onClose}>关闭</Button>]}><Tabs defaultActiveKey="pc" items={[{key:'pc',label:<span><DesktopOutlined/> PC</span>,children:pc},{key:'h5',label:<span><MobileOutlined/> H5</span>,children:h5}]}/></Modal>;
}

function PublishModal({open,config,onClose,onPublish}) {
  const enabledCount=config.items.filter(item=>item.enabled).length;
  return <Modal title="检查并发布" open={open} onCancel={onClose} closable={false} maskClosable={false} centered width={520} footer={[<Button key="cancel" onClick={onClose}>取消</Button>,<Button key="publish" type="primary" icon={<CloudUploadOutlined/>} onClick={onPublish}>确认发布</Button>]}>
    <Alert type="warning" showIcon message="发布后将更新 Checkout 线上服务保障内容"/>
    <div className="lp-impact-list"><div className="lp-impact-row"><span>当前 Market</span><strong>{config.marketLabel}</strong></div><div className="lp-impact-row"><span>发布版本</span><strong>v{config.draftVersion}</strong></div><div className="lp-impact-row"><span>默认语言</span><strong>{config.locale}</strong></div><div className="lp-impact-row"><span>展示终端</span><strong>PC、移动端</strong></div><div className="lp-impact-row"><span>启用保障项</span><strong>{enabledCount} 项</strong></div></div>
  </Modal>;
}

function OperationLog({data}) {
  const columns=[{title:'操作时间',dataIndex:'at'},{title:'操作人',dataIndex:'who'},{title:'操作类型',dataIndex:'type',render:value=><StatusTag variant={value==='发布'?'on':'pending'}>{value}</StatusTag>},{title:'操作详情',dataIndex:'detail'}];
  return <Card style={CARD_STYLE}><div className="lp-oplog-title" style={{marginTop:0}}><HistoryOutlined/> 操作日志</div><Space size={8} wrap style={{marginBottom:12}}><Select size="small" defaultValue="" style={{width:130}} options={[{value:'',label:'全部操作类型'},{value:'edit',label:'编辑'},{value:'publish',label:'发布'},{value:'disable',label:'停用'}]}/><Select size="small" defaultValue="" style={{width:130}} options={[{value:'',label:'全部操作人'},{value:'liyuxue',label:'liyuxue'},{value:'mia',label:'Mia Chen'}]}/><DatePicker.RangePicker size="small" placeholder={['开始日期','结束日期']}/><Button size="small" icon={<SearchOutlined/>}>查询</Button></Space><Table rowKey="id" size="small" pagination={false} styles={TABLE_STYLES} columns={columns} dataSource={data}/></Card>;
}

function AssuranceConfigPage() {
  const [configs,setConfigs]=React.useState(INITIAL_CONFIGS);
  const [currentMarket,setCurrentMarket]=React.useState('US');
  const [dirtyByMarket,setDirtyByMarket]=React.useState({US:false,HK:false});
  const [logs,setLogs]=React.useState(INITIAL_LOGS);
  const [drawerOpen,setDrawerOpen]=React.useState(false);
  const [editingItem,setEditingItem]=React.useState(null);
  const [previewOpen,setPreviewOpen]=React.useState(false);
  const [publishOpen,setPublishOpen]=React.useState(false);
  const [draggingId,setDraggingId]=React.useState(null);
  const [dragOverId,setDragOverId]=React.useState(null);
  const config=configs[currentMarket];
  const dirty=dirtyByMarket[currentMarket];
  const ordered=[...config.items].sort((a,b)=>a.sortOrder-b.sortOrder);
  const enabledCount=config.items.filter(item=>item.enabled).length;
  const addLog=(type,detail)=>setLogs(current=>({...current,[currentMarket]:[{id:`${currentMarket}-LOG-${Date.now()}`,at:'2026-11-18 16:30',who:'liyuxue',type,detail},...current[currentMarket]]}));
  const updateConfig=patch=>{setConfigs(current=>({...current,[currentMarket]:{...current[currentMarket],...patch,updatedAt:'2026-11-18 16:30',updatedBy:'liyuxue'}}));setDirtyByMarket(current=>({...current,[currentMarket]:true}));};
  const updateItems=items=>updateConfig({items});
  const switchMarket=value=>{setCurrentMarket(value);setDrawerOpen(false);setPreviewOpen(false);setPublishOpen(false);};
  const openItemCreate=()=>{setEditingItem(null);setDrawerOpen(true);};
  const openItemEdit=item=>{setEditingItem(item);setDrawerOpen(true);};
  const saveItem=form=>{
    if(form.id){updateItems(config.items.map(item=>item.id===form.id?form:item));addLog('编辑',`编辑“${form.copy}”`);}
    else {const next={...form,id:`${currentMarket}-${Date.now()}`,sortOrder:Math.max(0,...config.items.map(item=>item.sortOrder))+10};updateItems([...config.items,next]);addLog('编辑',`新增“${form.copy}”`);}
    setDrawerOpen(false);message.success('已更新当前编辑内容');
  };
  const reorderItems=(sourceId,targetId)=>{if(!sourceId||sourceId===targetId)return;const next=[...ordered];const sourceIndex=next.findIndex(item=>item.id===sourceId);const targetIndex=next.findIndex(item=>item.id===targetId);if(sourceIndex<0||targetIndex<0)return;const [moved]=next.splice(sourceIndex,1);next.splice(targetIndex,0,moved);updateItems(next.map((item,index)=>({...item,sortOrder:(index+1)*10})));};
  const startDrag=(event,item)=>{setDraggingId(item.id);setDragOverId(null);event.dataTransfer.effectAllowed='move';event.dataTransfer.setData('text/plain',item.id);};
  const dragOver=(event,item)=>{event.preventDefault();event.dataTransfer.dropEffect='move';if(item.id!==draggingId)setDragOverId(item.id);};
  const dropItem=(event,item)=>{event.preventDefault();reorderItems(event.dataTransfer.getData('text/plain')||draggingId,item.id);setDraggingId(null);setDragOverId(null);};
  const endDrag=()=>{setDraggingId(null);setDragOverId(null);};
  const saveDraft=()=>{const nextVersion=config.hasUnpublished?config.draftVersion:config.draftVersion+1;setConfigs(current=>({...current,[currentMarket]:{...current[currentMarket],draftVersion:nextVersion,hasUnpublished:true}}));setDirtyByMarket(current=>({...current,[currentMarket]:false}));addLog('保存草稿',`保存 ${config.marketLabel} 草稿 v${nextVersion}`);message.success('草稿已保存');};
  const requestPublish=()=>{if(dirty){message.warning('请先保存草稿');return;}if(!config.hasUnpublished){message.info('当前没有待发布草稿');return;}if(enabledCount===0){message.error('至少启用一个保障项后才能发布');return;}setPublishOpen(true);};
  const publish=()=>{const version=`v${config.draftVersion}`;setConfigs(current=>({...current,[currentMarket]:{...current[currentMarket],publishedVersion:config.draftVersion,hasUnpublished:false}}));setPublishOpen(false);addLog('发布',`发布 ${config.marketLabel} 配置 ${version}`);message.success('配置发布成功');};
  const itemColumns=[
    {title:'排序',key:'sort',width:80,render:(_,item)=><Tooltip title="拖动调整顺序"><span className="lp-drag-handle" draggable={true} role="button" tabIndex={0} aria-label="拖动调整顺序" onDragStart={event=>startDrag(event,item)} onDragEnd={endDrag}><HolderOutlined/></span></Tooltip>},
    {title:'图标',dataIndex:'iconUrl',width:96,render:(value,item)=><span className="lp-icon-preview"><AssuranceIcon iconUrl={value} alt={item.iconName}/></span>},
    {title:'展示文案',dataIndex:'copy',render:value=><div className="lp-copy-primary">{value}</div>},
    {title:'状态',dataIndex:'enabled',width:100,render:value=><StatusTag variant={value?'on':'off'}>{value?'启用':'停用'}</StatusTag>},
    {title:'操作',key:'actions',width:220,render:(_,item)=><Space size={6}><Button size="small" icon={<EditOutlined/>} onClick={()=>openItemEdit(item)}>编辑</Button><Button size="small" onClick={()=>updateItems(config.items.map(value=>value.id===item.id?{...value,enabled:!value.enabled}:value))}>{item.enabled?'停用':'启用'}</Button><Button size="small" danger icon={<DeleteOutlined/>} disabled={config.items.length<=1} onClick={()=>updateItems(config.items.filter(value=>value.id!==item.id))}>删除</Button></Space>}
  ];
  return <>
    <Card style={CARD_STYLE}>
      <div className="lp-config-head"><div className="lp-page-title">Checkout 配置</div></div>
      <div className="lp-filterbar"><div><div style={{fontSize:12,color:'#6B7280',marginBottom:6}}>当前 Market</div><Select value={currentMarket} style={{width:240}} prefix={<GlobalOutlined/>} options={MARKET_OPTIONS} onChange={switchMarket}/></div></div>
      <Tabs activeKey="assurance" style={{marginTop:20}} tabBarExtraContent={<Space><Button icon={<EyeOutlined/>} onClick={()=>setPreviewOpen(true)}>预览</Button><Button disabled={!dirty} onClick={saveDraft}>保存草稿</Button><Button type="primary" icon={<CloudUploadOutlined/>} onClick={requestPublish}>检查并发布</Button></Space>} items={[{
        key:'assurance',label:'服务保障',children:<>
          <div className="lp-config-head" style={{marginTop:8}}><div className="lp-page-desc">{config.marketLabel} · 默认语言 {config.locale} · 前台仅展示图标和单行文案</div><Button type="primary" icon={<PlusOutlined/>} onClick={openItemCreate}>新增保障项</Button></div>
          <Table rowKey="id" columns={itemColumns} dataSource={ordered} pagination={false} styles={TABLE_STYLES} rowClassName={item=>item.id===draggingId?'lp-dragging-row':item.id===dragOverId?'lp-drag-over-row':''} onRow={item=>({onDragOver:event=>dragOver(event,item),onDrop:event=>dropItem(event,item)})}/>
        </>
      }]}/>
    </Card>
    <OperationLog data={logs[currentMarket]}/>
    <AssuranceItemDrawer open={drawerOpen} item={editingItem} onClose={()=>setDrawerOpen(false)} onSave={saveItem}/>
    <PreviewModal open={previewOpen} items={config.items} onClose={()=>setPreviewOpen(false)}/>
    <PublishModal open={publishOpen} config={config} onClose={()=>setPublishOpen(false)} onPublish={publish}/>
  </>;
}

function App() {
  const menuItems=[
    {key:'content',icon:<FileTextOutlined/>,label:'内容管理'},
    {key:'checkout',icon:<ShoppingCartOutlined/>,label:'Checkout 配置'}
  ];
  return <ConfigProvider theme={looplyTheme}><Layout style={{height:'100vh'}}><Layout.Header style={{borderBottom:'1px solid #E5E7EB',display:'flex',alignItems:'center'}}><img src={LOGO_SRC} alt="Looply" style={{width:118,height:'auto',display:'block'}}/><div style={{width:1,height:20,background:'#E5E7EB',margin:'0 16px'}}/><span style={{fontSize:14,fontWeight:500,color:'#6B7280'}}>CMS 管理系统</span><span style={{marginLeft:'auto',color:'#9CA3AF',fontSize:13}}>Checkout 配置</span></Layout.Header><Layout><Layout.Sider width={220} theme="light" style={SIDER_STYLE}><Menu mode="inline" items={menuItems} selectedKeys={['checkout']} style={{borderInlineEnd:'none'}} onClick={({key})=>{if(key!=='checkout')message.info('原型仅展示 Checkout 配置页面');}}/></Layout.Sider><Layout.Content style={{padding:28,overflow:'auto'}}><AssuranceConfigPage/></Layout.Content></Layout></Layout></ConfigProvider>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
