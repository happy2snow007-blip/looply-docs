<title>Looply 订单管理后台原型 v7</title>

<script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

<style>
html,body,#root{height:100%;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F9FAFB;color:#1F2937}
#root::before{content:'正在加载 antd 原型……';position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#9CA3AF;font-size:14px}
#root:not(:empty)::before{display:none}
.lp-kpi{background:linear-gradient(180deg,#FEFCFF 0%,#F3EEFF 100%);border:1px solid #DDD6FE;border-radius:14px;padding:14px 16px}
.lp-kpi .num{font-size:24px;font-weight:700;color:#7C3AED;line-height:1;margin-bottom:6px;font-variant-numeric:tabular-nums}
.lp-kpi .label{font-size:12px;color:#6B7280}
.lp-pagination{display:flex;align-items:center;justify-content:center;gap:24px;padding:12px 16px;font-size:13px;color:#6B7280}
.lp-pagination .divider{width:1px;height:20px;background:#E5E7EB}
.lp-tip-trigger{cursor:help;border-bottom:1px dashed #9CA3AF;padding-bottom:1px}
.lp-note{padding:14px;border-radius:10px;background:#F3EEFF;border:1px solid #DDD6FE;color:#6D28D9;font-size:12px;line-height:1.8}
.lp-section-purple{font-size:14px;font-weight:700;color:#7C3AED;margin:0 0 12px}
.lp-section{font-size:15px;font-weight:600;color:#1F2937;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid #E5E7EB}
.lp-oplog-title{font-size:14px;font-weight:700;color:#7C3AED;margin:24px 0 12px}
.lp-empty{display:flex;flex-direction:column;align-items:center;padding:60px 20px;text-align:center}
.lp-empty .icon{font-size:48px;margin-bottom:16px;color:#9CA3AF}
.lp-empty .icon.err{color:#DC2626}
.lp-empty .title{font-size:16px;font-weight:600;color:#1F2937;margin-bottom:8px}
.lp-empty .desc{font-size:13px;color:#6B7280;margin-bottom:24px;max-width:360px}
.lp-form-row{display:flex;gap:16px;margin-bottom:12px;align-items:center}
.lp-form-row:first-of-type{margin-top:8px}
.lp-form-row .lp-form-label{width:96px;text-align:right;color:#6B7280;font-size:13px;flex-shrink:0}
.lp-form-row .lp-form-label .req{color:#DC2626;margin-right:4px}
.lp-form-row .lp-form-control{flex:1}
.lp-helper{font-size:12px;color:#9CA3AF;margin:-4px 0 12px 112px}
.lp-detail{display:grid;grid-template-columns:120px 1fr;gap:10px 16px;font-size:13px;margin-bottom:24px}
.lp-detail .dl{color:#6B7280}
.lp-detail .dv{color:#1F2937}
:focus-visible{outline:none;box-shadow:inset 0 0 0 2px rgba(124,58,237,.4)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const TAG_COLORS = {
  on:{bg:'#F0FDF4',color:'#16A34A'}, sale:{bg:'#EFF6FF',color:'#2563EB'},
  pending:{bg:'#FFFBEB',color:'#D97706'}, off:{bg:'#F3F4F6',color:'#6B7280'},
  req:{bg:'#FEF2F2',color:'#DC2626'}, warn:{bg:'#FFF1F2',color:'#E11D48'},
};
function StatusTag({ variant, children }) {
  const c = TAG_COLORS[variant] || TAG_COLORS.off;
  return <Tag bordered={false} style={{ background:c.bg, color:c.color, borderRadius:999, padding:'2px 8px', fontSize:12, lineHeight:'18px', marginInlineEnd:4 }}>{children}</Tag>;
}
function Kpi({ num, label, numStyle }) {
  return <div className="lp-kpi"><div className="label" style={{marginBottom:6}}>{label}</div><div className="num" style={numStyle}>{num}</div></div>;
}
function TipText({ label, tip }) {
  return <Tooltip title={<div style={{whiteSpace:'pre-line',lineHeight:1.6}}>{tip}</div>} color="#fff" styles={{body:{color:'#374151',fontSize:12,padding:'10px 14px'}}}><span className="lp-tip-trigger">{label}</span></Tooltip>;
}
function CompactPagination({ total, current=1, pageSize=10 }) {
  const tp = Math.ceil(total/pageSize)||1;
  const pages = useMemo(()=>{
    const out=[{k:'prev',label:'<',disabled:current===1,arrow:true}];
    if(tp<=6) for(let i=1;i<=tp;i++) out.push({k:i,label:i});
    else{out.push({k:1,label:1},{k:2,label:2},{k:3,label:3},{k:'gap',label:'…',disabled:true},{k:tp,label:tp});}
    out.push({k:'next',label:'>',disabled:current===tp,arrow:true});
    return out;
  },[current,tp]);
  return(
    <div className="lp-pagination">
      <span>{'共 '+total.toLocaleString()+' 条，每页 '}<Select size="small" value={pageSize} style={{width:72,marginInline:4}} options={[{value:10,label:10},{value:20,label:20},{value:50,label:50}]} />{' 条'}</span>
      <div className="divider"/>
      <Space size={2}>{pages.map(p=><span key={p.k} style={{minWidth:32,height:32,display:'inline-flex',alignItems:'center',justifyContent:'center',borderRadius:8,fontSize:13,cursor:p.disabled?'default':'pointer',background:p.k===current?'#7C3AED':(p.arrow?'#fff':'transparent'),color:p.k===current?'#fff':'#374151',border:p.arrow?'1px solid #E5E7EB':'none',fontWeight:p.k===current?600:400,opacity:p.disabled?0.35:1}}>{p.label}</span>)}</Space>
      <div className="divider"/>
      <span>{'第 '+current+'/'+tp+' 页'}</span>
    </div>
  );
}
function EmptyZero({ entity, cta, onCta }) {
  return <div className="lp-empty"><InboxOutlined className="icon"/><div className="title">{'暂无'+entity}</div><div className="desc">{'点击下方按钮创建第一个'+entity}</div>{cta&&<Button type="primary" onClick={onCta}>{cta}</Button>}</div>;
}
function EmptyNoMatch({ onClear }) {
  return <div className="lp-empty"><SearchOutlined className="icon"/><div className="title">未找到匹配结果</div><div className="desc">请尝试调整搜索关键词或筛选条件</div><Button onClick={onClear}>清除筛选条件</Button></div>;
}
function EmptyError({ onRetry }) {
  return <div className="lp-empty"><ExclamationCircleOutlined className="icon err"/><div className="title">加载失败</div><div className="desc">网络异常，请检查网络连接后重试</div><Button type="primary" onClick={onRetry}>重试</Button></div>;
}
function EmptyStateSwitcher({ mode, setMode }) {
  return <div style={{marginTop:12,display:'flex',gap:8,justifyContent:'center'}}>{[['data','正常数据'],['zero','零数据态'],['no-match','无匹配态'],['error','异常态']].map(([k,l])=><Button key={k} type={mode===k?'primary':'default'} onClick={()=>setMode(k)}>{l}</Button>)}</div>;
}
function FormRow({ label, required, children, helper }) {
  return <><div className="lp-form-row"><div className="lp-form-label">{required&&<span className="req">*</span>}{label}</div><div className="lp-form-control">{children}</div></div>{helper&&<div className="lp-helper">{helper}</div>}</>;
}
function OpLog({ data }) {
  const rows = data || [
    {i:1,at:'2026-06-15 14:30:25',who:'系统',type:'创建订单',detail:'支付成功，自动创建订单 ORD20260615001'},

  ];

        {title:'操作时间',dataIndex:'at',width:180},

/* ── Page: 弃单管理 ── */
function AbandonedCartPage({ go }) {
  const [mode, setMode] = useState('data');
  const [recoverOpen, setRecoverOpen] = useState(false);
  const [selectedRow, setSelectedRow] = useState(null);
  const [strategyOpen, setStrategyOpen] = useState(false);
  const columns = [
    {title:'会话编号',dataIndex:'id',width:160,render:v=><span style={{fontFamily:'Menlo,Monaco,Consolas,monospace',fontSize:12,color:'#374151',background:'#F3F4F6',padding:'1px 6px',borderRadius:4}}>{v}</span>},
    {title:'买家',dataIndex:'buyer',width:180},
    {title:'商品数',dataIndex:'items',width:80,render:v=>v+'件'},
    {title:'预估金额',dataIndex:'amount',width:120},
    {title:'状态',dataIndex:'status',width:100,render:v=><StatusTag variant={CHECKOUT_TAG[v]}>{CHECKOUT_STATUS_MAP[v]}</StatusTag>},
    {title:'创建时间',dataIndex:'createdAt',width:160},
    {title:'操作',key:'op',width:200,fixed:'right',render:(_,r)=>(
      <Space size={6}>
        <Button size="small" onClick={()=>go('abandoned-detail')}>查看详情</Button>
        {r.status==='pending'&&<Button size="small" onClick={()=>{setSelectedRow(r);setRecoverOpen(true);}}>发送恢复链接</Button>}
      </Space>
    )},
  ];
  return (
    <Card style={CARD_STYLE}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:16,marginBottom:18}}>
        <div><div style={{fontSize:20,fontWeight:700,marginBottom:6}}>弃单管理</div><div style={{color:'#6B7280',fontSize:13}}>查看结算会话弃单数据，支持手动及自动发送恢复链接</div></div>
        <Button icon={<EditOutlined/>} onClick={()=>setStrategyOpen(true)}>恢复策略设置</Button>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12,marginBottom:18}}>
        <Kpi num="23" label="今日弃单数"/><Kpi num="18.5%" label="弃单率"/><Kpi num="5" label="已恢复数"/><Kpi num="21.7%" label="恢复率"/>
      </div>
      {mode==='data'&&<Space size={12} wrap style={{marginBottom:16}}>
        <Input placeholder="买家邮箱" prefix={<SearchOutlined style={{color:'#9CA3AF'}}/>} allowClear style={{width:200}}/>
        <Select defaultValue="" style={{width:140}} options={[{value:'',label:'全部状态'},{value:'pending',label:'待转化'},{value:'converted',label:'已转化'}]}/>
        <DatePicker.RangePicker placeholder={['开始日期','结束日期']}/>
        <Button type="primary" icon={<SearchOutlined/>}>查询</Button>
        <Button icon={<ReloadOutlined/>}>重置</Button>
      </Space>}
      {mode==='data'&&<><Table rowKey="id" columns={columns} dataSource={ABANDON_DATA} pagination={false} styles={TABLE_STYLES} scroll={{x:'max-content'}}/><CompactPagination total={ABANDON_DATA.length}/></>}
      {mode==='zero'&&<EmptyZero entity="弃单记录"/>}
      {mode==='no-match'&&<EmptyNoMatch onClear={()=>setMode('data')}/>}
      {mode==='error'&&<EmptyError onRetry={()=>setMode('data')}/>}
      <EmptyStateSwitcher mode={mode} setMode={setMode}/>

      {/* 发送恢复链接确认 */}
      <Modal title="发送恢复链接" open={recoverOpen} onCancel={()=>setRecoverOpen(false)} closable={false} maskClosable={false} centered={true} width={480}
        footer={[<Button key="c" onClick={()=>setRecoverOpen(false)}>取消</Button>,<Button key="s" type="primary" icon={<SendOutlined/>} onClick={()=>setRecoverOpen(false)}>确认发送</Button>]}>

/* ── Page: 对账管理 ── */
function ReconciliationPage({ go }) {
  const [mode, setMode] = useState('data');
  const [pullOpen, setPullOpen] = useState(false);
  const [exportOpen, setExportOpen] = useState(false);
  const [exportDone, setExportDone] = useState(false);
  const [expandedKeys, setExpandedKeys] = useState([]);

  const parse$ = v => parseFloat(String(v).replace('$','').replace(',',''));
  const hasDiff = (a,b) => { if(a==='—'||b==='—') return false; return Math.round((parse$(a)-parse$(b))*100)/100!==0; };
  const hasAnyDiff = r => r.settleStatus==='settled'&&(hasDiff(r.sysPayment,r.chPayment)||hasDiff(r.sysFee,r.chFee)||hasDiff(r.sysRefund,r.chRefund));

  const filtered = RECON_ORDER_DATA;
  const unsettledCount = RECON_ORDER_DATA.filter(r=>r.settleStatus==='unsettled').length;
  const settledCount = RECON_ORDER_DATA.filter(r=>r.settleStatus==='settled').length;
  const discrepantCount = RECON_ORDER_DATA.filter(hasAnyDiff).length;
  const amtCell = (sys,ch,val,isSys) => {
    if(val==='—') return <span style={{color:'#9CA3AF'}}>—</span>;
    const diff = hasDiff(sys,ch);
    return <span style={{fontWeight:500,color:diff?'#E11D48':'#1F2937'}}>{val}</span>;
  };
  const refundAmtCell = (sys,ch,val) => {
    if(val==='—') return <span style={{color:'#9CA3AF'}}>—</span>;
    if(val==='$0.00') return <span style={{color:'#9CA3AF'}}>$0.00</span>;
    const diff = hasDiff(sys,ch);
    return <span style={{fontWeight:500,color:diff?'#E11D48':'#DC2626'}}>{val}</span>;
  };

  const txnColumns = [
    {title:'流水号',dataIndex:'transNo',width:160,render:v=><span style={{fontFamily:'Menlo,Monaco,Consolas,monospace',fontSize:12,color:'#374151',background:'#F3F4F6',padding:'1px 6px',borderRadius:4}}>{v}</span>},
    {title:'类型',dataIndex:'type',width:80,render:v=><StatusTag variant={TXN_TYPE_TAG[v]}>{TXN_TYPE_MAP[v]}</StatusTag>},
    {title:'渠道流水号',dataIndex:'channelTxnId',width:160,render:v=><span style={{fontFamily:'Menlo,Monaco,Consolas,monospace',fontSize:12}}>{v}</span>},
    {title:'金额',dataIndex:'amount',width:100,render:v=><span style={{fontWeight:500}}>{v}</span>},
    {title:'手续费',dataIndex:'fee',width:90},
    {title:'状态',dataIndex:'status',width:90,render:v=><StatusTag variant={TXN_STATUS_TAG[v]}>{TXN_STATUS_MAP[v]}</StatusTag>},
  ];

  const columns = [
    {title:'订单号',dataIndex:'orderNo',width:160,render:v=><Button type="link" size="small" style={{padding:0,fontSize:13}} onClick={()=>go('order-detail')}>{v}</Button>},
    {title:'支付单号',dataIndex:'paymentNo',width:160,render:v=><Button type="link" size="small" style={{padding:0,fontSize:13}} onClick={()=>go('payment-order-list')}>{v}</Button>},
    {title:'买家',dataIndex:'buyer',width:160},
    {title:'商家',dataIndex:'merchant',width:130},
    {title:'通道',dataIndex:'channel',width:90},
    {title:'订单金额',dataIndex:'orderAmount',width:100,render:v=><span style={{fontWeight:600}}>{v}</span>},
    {title:<TipText label="收款对比" tip="系统记录的收款金额 vs 渠道结算报告确认的收款金额，有差异时标红"/>,children:[
      {title:'系统',dataIndex:'sysPayment',width:90,render:(_,r)=>amtCell(r.sysPayment,r.chPayment,r.sysPayment,true)},
      {title:'渠道',dataIndex:'chPayment',width:90,render:(_,r)=>amtCell(r.sysPayment,r.chPayment,r.chPayment,false)},
    ]},
    {title:<TipText label="手续费对比" tip="系统记录的渠道手续费 vs 渠道结算报告中实际扣取的手续费，有差异时标红"/>,children:[
      {title:'系统',dataIndex:'sysFee',width:80,render:(_,r)=>amtCell(r.sysFee,r.chFee,r.sysFee,true)},
      {title:'渠道',dataIndex:'chFee',width:80,render:(_,r)=>amtCell(r.sysFee,r.chFee,r.chFee,false)},
    ]},
    {title:<TipText label="退款对比" tip="系统记录的累计退款金额 vs 渠道结算报告确认的退款金额，有差异时标红"/>,children:[
      {title:'系统',dataIndex:'sysRefund',width:80,render:(_,r)=>refundAmtCell(r.sysRefund,r.chRefund,r.sysRefund)},
      {title:'渠道',dataIndex:'chRefund',width:80,render:(_,r)=>refundAmtCell(r.sysRefund,r.chRefund,r.chRefund)},
    ]},
    {title:'结算状态',dataIndex:'settleStatus',width:90,render:v=><StatusTag variant={SETTLE_TAG[v]}>{SETTLE_STATUS_MAP[v]}</StatusTag>},
  ];

  return (
    <Card style={CARD_STYLE}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:16,marginBottom:18}}>
        <div><div style={{fontSize:20,fontWeight:700,marginBottom:6}}>对账管理</div><div style={{color:'#6B7280',fontSize:13}}>按订单维度核对收款、手续费、退款，确保资金准确到账</div></div>
        <Space>
          <Button icon={<SyncOutlined/>} onClick={()=>setPullOpen(true)}>拉取结算报告</Button>
          <Button icon={<DownloadOutlined/>} onClick={()=>{setExportDone(false);setExportOpen(true)}}>导出</Button>
        </Space>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12,marginBottom:18}}>
        <Kpi num={String(RECON_ORDER_DATA.length)} label="订单总数"/><Kpi num={String(unsettledCount)} label="待结算"/><Kpi num={String(settledCount)} label="已结算"/><Kpi num={String(discrepantCount)} label="有差异" numStyle={{color:'#E11D48'}}/>
      </div>
      {mode==='data'&&<>
        <Space size={12} wrap style={{marginBottom:16}}>
          <Input placeholder="订单号" prefix={<SearchOutlined style={{color:'#9CA3AF'}}/>} allowClear style={{width:170}}/>
          <Input placeholder="买家邮箱" prefix={<SearchOutlined style={{color:'#9CA3AF'}}/>} allowClear style={{width:170}}/>
          <Select defaultValue="" style={{width:120}} options={[{value:'',label:'全部商家'},{value:'looply',label:'Looply Official'},{value:'vintage',label:'Vintage Luxe'},{value:'second',label:'Second Style'},{value:'preloved',label:'Pre-Loved Co'}]}/>
          <Select defaultValue="" style={{width:120}} options={[{value:'',label:'全部通道'},{value:'airwallex',label:'Airwallex'},{value:'paypal',label:'PayPal'}]}/>
          <Select defaultValue="" style={{width:120}} options={[{value:'',label:'结算状态'},{value:'unsettled',label:'待结算'},{value:'settled',label:'已结算'}]}/>
          <Select defaultValue="" style={{width:120}} options={[{value:'',label:'差异状态'},{value:'yes',label:'有差异'},{value:'no',label:'无差异'}]}/>
          <DatePicker.RangePicker placeholder={['付款开始','付款结束']}/>
          <Button type="primary" icon={<SearchOutlined/>}>查询</Button>
          <Button icon={<ReloadOutlined/>}>重置</Button>
        </Space>
        <Table rowKey="id" bordered columns={columns} dataSource={filtered} pagination={false} styles={TABLE_STYLES} scroll={{x:'max-content'}}
          expandable={{
            expandedRowKeys:expandedKeys,
            onExpandedRowsChange:setExpandedKeys,
            expandedRowRender:r=><div style={{padding:'8px 0'}}>
              <div style={{fontSize:12,color:'#6B7280',marginBottom:8,fontWeight:500}}>该订单关联的支付流水</div>
              <Table rowKey="transNo" size="small" columns={txnColumns} dataSource={r.txns} pagination={false}
                styles={{header:{cell:{background:'#F9FAFB',fontSize:12}},body:{cell:{fontSize:12}}}}/>
            </div>,
          }}/>
        <CompactPagination total={filtered.length}/>
      </>}
      {mode==='zero'&&<EmptyZero entity="对账记录"/>}
      {mode==='no-match'&&<EmptyNoMatch onClear={()=>setMode('data')}/>}
      {mode==='error'&&<EmptyError onRetry={()=>setMode('data')}/>}
      <EmptyStateSwitcher mode={mode} setMode={setMode}/>

      {/* 拉取结算报告 */}
      <Modal title="拉取结算报告" open={pullOpen} onCancel={()=>setPullOpen(false)} closable={false} maskClosable={false} centered={true} width={480}
        footer={[<Button key="c" onClick={()=>setPullOpen(false)}>取消</Button>,<Button key="s" type="primary" icon={<SyncOutlined/>} onClick={()=>setPullOpen(false)}>开始拉取</Button>]}>
        <Alert type="info" showIcon={false} message="从支付渠道拉取结算报告，系统将自动按订单匹配并比对收款、手续费、退款金额" style={{marginBottom:16}}/>
        <FormRow label="支付通道" required><Select placeholder="请选择" style={{width:'100%'}} options={[{value:'airwallex',label:'Airwallex'},{value:'paypal',label:'PayPal'}]}/></FormRow>
        <FormRow label="时间范围" required><DatePicker.RangePicker style={{width:'100%'}} placeholder={['开始日期','结束日期']}/></FormRow>
      </Modal>

      {/* 导出对账数据 */}
      <Modal title="导出对账数据" open={exportOpen} onCancel={()=>setExportOpen(false)} closable={false} maskClosable={false} centered={true} width={520}
        footer={exportDone
          ?[<Button key="c" type="primary" onClick={()=>setExportOpen(false)}>完成</Button>]
          :[<Button key="c" onClick={()=>setExportOpen(false)}>取消</Button>,<Button key="s" type="primary" icon={<DownloadOutlined/>} onClick={()=>setExportDone(true)}>开始导出</Button>]}>
        {!exportDone?<>
          <Alert type="info" showIcon={false} message="导出当前筛选条件下的对账数据，包含订单金额、渠道金额、差异对比等信息，用于线下核对处理" style={{marginBottom:16}}/>
          <FormRow label="导出范围" required>
            <Radio.Group defaultValue="filtered" style={{display:'flex',flexDirection:'column',gap:8}}>
              <Radio value="filtered">当前筛选结果（{filtered.length} 条）</Radio>
              <Radio value="all">全部数据（{RECON_ORDER_DATA.length} 条）</Radio>
            </Radio.Group>
          </FormRow>
          <FormRow label="支付通道">
            <Select defaultValue="" style={{width:'100%'}} options={[{value:'',label:'全部通道'},{value:'airwallex',label:'Airwallex'},{value:'paypal',label:'PayPal'}]}/>
          </FormRow>
          <FormRow label="付款时间">
            <DatePicker.RangePicker style={{width:'100%'}} placeholder={['开始日期','结束日期']}/>
          </FormRow>
          <FormRow label="文件格式" required>
            <Radio.Group defaultValue="xlsx">
              <Radio value="xlsx">Excel (.xlsx)</Radio>
              <Radio value="csv">CSV (.csv)</Radio>
            </Radio.Group>
          </FormRow>
        </>:<>
          <div style={{textAlign:'center',padding:'32px 0'}}>
            <CheckCircleOutlined style={{fontSize:48,color:'#10B981'}}/>
            <div style={{fontSize:16,fontWeight:600,marginTop:12,color:'#111827'}}>导出成功</div>
            <div style={{color:'#6B7280',fontSize:13,marginTop:6}}>文件已开始下载，请在浏览器下载列表中查看</div>
            <div style={{marginTop:16,padding:'12px 16px',background:'#F9FAFB',borderRadius:8,display:'inline-block'}}>
              <span style={{color:'#374151',fontSize:13}}>looply-对账数据-20260629.xlsx</span>
            </div>
          </div>
        </>}
      </Modal>

    </Card>
  );
}

        </>}
      </Modal>
    </Card>
  );
}

/* ── App ── */
function App() {
  const [activeKey, setActiveKey] = useState('abandoned-cart');
  const [currentPage, setCurrentPage] = useState('abandoned-cart');
  const go = (key) => { setCurrentPage(key); if(key!=='order-detail'&&key!=='abandoned-detail') setActiveKey(key); };
  const subLabel = (text, key) => <span style={{fontWeight:activeKey===key?600:400}}>{text}</span>;
  const menuItems = [
    {key:'order-group',icon:<ProfileOutlined/>,label:'订单中心',children:[
      {key:'abandoned-cart',icon:<ShoppingCartOutlined/>,label:subLabel('弃单管理','abandoned-cart')},
      {key:'order-list',icon:<FileTextOutlined/>,label:subLabel('订单管理','order-list')},
    ]},
    {key:'pay-group',icon:<DollarOutlined/>,label:'支付中心',children:[
      {key:'payment-order-list',icon:<CreditCardOutlined/>,label:subLabel('支付单管理','payment-order-list')},
      {key:'refund-order-list',icon:<RollbackOutlined/>,label:subLabel('退款单管理','refund-order-list')},
      {key:'payment-txn-list',icon:<SwapOutlined/>,label:subLabel('支付流水','payment-txn-list')},
      {key:'reconciliation',icon:<AuditOutlined/>,label:subLabel('对账管理','reconciliation')},
    ]},
  ];
  const breadcrumbMap = {
    'abandoned-cart':'订单中心 / 弃单管理',
    'abandoned-detail':'订单中心 / 弃单管理 / 弃单详情',
    'order-list':'订单中心 / 订单管理',
    'order-detail':'订单中心 / 订单管理 / 订单详情',
    'payment-order-list':'支付中心 / 支付单管理',
    'refund-order-list':'支付中心 / 退款单管理',
    'payment-txn-list':'支付中心 / 支付流水',
    'reconciliation':'支付中心 / 对账管理',
  };
  return (
    <ConfigProvider theme={looplyTheme}>
      <Layout style={{height:'100vh'}}>
        <Layout.Header style={{borderBottom:'1px solid #E5E7EB',display:'flex',alignItems:'center'}}>
          <img src={LOGO_SRC} alt="Looply" style={{height:32,display:'block'}}/>
          <div style={{width:1,height:20,background:'#E5E7EB',margin:'0 16px'}}/>
          <span style={{fontSize:14,fontWeight:500,color:'#6B7280'}}>订单 · 支付系统</span>
          <span style={{marginLeft:'auto',color:'#9CA3AF',fontSize:13}}>{breadcrumbMap[currentPage]||''}</span>
        </Layout.Header>
        <Layout>
          <Layout.Sider width={220} theme="light" style={SIDER_STYLE}>
            <Menu mode="inline" items={menuItems} selectedKeys={[activeKey]} defaultOpenKeys={['order-group','pay-group']} style={{borderInlineEnd:'none'}}
              onClick={({key})=>go(key)}/>
          </Layout.Sider>
          <Layout.Content style={{padding:28,overflow:'auto'}}>
            {currentPage==='abandoned-cart'&&<AbandonedCartPage go={go}/>}
            {currentPage==='abandoned-detail'&&<AbandonedDetailPage go={go}/>}
            {currentPage==='order-list'&&<OrderListPage go={go}/>}
            {currentPage==='order-detail'&&<OrderDetailPage go={go}/>}
            {currentPage==='payment-order-list'&&<PaymentOrderListPage go={go}/>}
            {currentPage==='refund-order-list'&&<RefundOrderListPage go={go}/>}
            {currentPage==='payment-txn-list'&&<PaymentTransactionListPage go={go}/>}
            {currentPage==='reconciliation'&&<ReconciliationPage go={go}/>}
          </Layout.Content>
        </Layout>
      </Layout>
    </ConfigProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
