<title>Looply 后台 — 社媒分享管理</title>

<style>
html,body,#root{height:100%;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F9FAFB;color:#1F2937}
#root::before{content:'正在加载 antd 原型……';position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#9CA3AF;font-size:14px}
#root:not(:empty)::before{display:none}
.lp-kpi{background:linear-gradient(180deg,#FEFCFF 0%,#F3EEFF 100%);border:1px solid #DDD6FE;border-radius:14px;padding:14px 16px}
.lp-kpi .num{font-size:24px;font-weight:700;color:#7C3AED;line-height:1;margin-bottom:6px;font-variant-numeric:tabular-nums}
.lp-kpi .label{font-size:12px;color:#6B7280}
.lp-pagination{display:flex;align-items:center;justify-content:center;gap:24px;padding:12px 16px;font-size:13px;color:#6B7280}
.lp-pagination .divider{width:1px;height:20px;background:#E5E7EB}
.lp-tip-trigger{cursor:help;border-bottom:1px dashed #9CA3AF;padding-bottom:1px}
.lp-section{font-size:15px;font-weight:600;color:#1F2937;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid #E5E7EB}
.lp-section-purple{font-size:14px;font-weight:700;color:#7C3AED;margin:0 0 12px}
.lp-oplog-title{font-size:14px;font-weight:700;color:#7C3AED;margin:24px 0 12px}
.lp-form-row{display:flex;gap:16px;margin-bottom:12px;align-items:center}
.lp-form-row:first-of-type{margin-top:8px}
.lp-form-row .lp-form-label{width:96px;text-align:right;color:#6B7280;font-size:13px;flex-shrink:0}
.lp-form-row .lp-form-label .req{color:#DC2626;margin-right:4px}
.lp-form-row .lp-form-control{flex:1}
.lp-helper{font-size:12px;color:#9CA3AF;margin:-4px 0 12px 112px}
.lp-note{padding:14px;border-radius:10px;background:#F3EEFF;border:1px solid #DDD6FE;color:#6D28D9;font-size:12px;line-height:1.8}
.lp-empty{display:flex;flex-direction:column;align-items:center;padding:60px 20px;text-align:center}
.lp-empty .icon{font-size:48px;margin-bottom:16px;color:#9CA3AF}
.lp-empty .icon.err{color:#DC2626}
.lp-empty .title{font-size:16px;font-weight:600;color:#1F2937;margin-bottom:8px}
.lp-empty .desc{font-size:13px;color:#6B7280;margin-bottom:24px;max-width:360px}
.lp-code{font-family:Menlo,Monaco,Consolas,monospace;font-size:12px;color:#374151;background:#F3F4F6;padding:1px 6px;border-radius:4px}
.lp-detail{display:grid;grid-template-columns:120px 1fr;gap:10px 16px;font-size:13px;margin-bottom:24px}
.lp-detail .dl{color:#6B7280}
.lp-detail .dv{color:#1F2937}
:focus-visible{outline:none;box-shadow:inset 0 0 0 2px rgba(124,58,237,.4)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

// ===================== TAG_COLORS & BUSINESS COMPONENTS =====================
const TAG_COLORS = {
  on:      { bg: '#F0FDF4', color: '#16A34A' },
  sale:    { bg: '#EFF6FF', color: '#2563EB' },
  pending: { bg: '#FFFBEB', color: '#D97706' },
  off:     { bg: '#F3F4F6', color: '#6B7280' },
  req:     { bg: '#FEF2F2', color: '#DC2626' },
  warn:    { bg: '#FFF1F2', color: '#E11D48' },
};

function StatusTag({ variant, children }) {
  const c = TAG_COLORS[variant] || TAG_COLORS.off;
  return <Tag bordered={false} style={{ background: c.bg, color: c.color, borderRadius: 999, padding: '2px 8px', fontSize: 12, lineHeight: '18px', marginInlineEnd: 4 }}>{children}</Tag>;
}

function Kpi({ num, label }) {
  return <div className="lp-kpi"><div className="label" style={{ marginBottom: 6 }}>{label}</div><div className="num">{num}</div></div>;
}

function TipText({ label, tip }) {
  return <Tooltip title={<div style={{ whiteSpace: 'pre-line', lineHeight: 1.6 }}>{tip}</div>} color="#fff" styles={{ body: { color: '#374151', fontSize: 12, padding: '10px 14px' } }}><span className="lp-tip-trigger">{label}</span></Tooltip>;
}

function FormRow({ label, required, children, helper }) {
  return <><div className="lp-form-row"><div className="lp-form-label">{required && <span className="req">*</span>}{label}</div><div className="lp-form-control">{children}</div></div>{helper && <div className="lp-helper">{helper}</div>}</>;
}

function CompactPagination({ total, pageSize = 10 }) {
  const tp = Math.ceil(total / pageSize) || 1;
  return <div className="lp-pagination"><span>共 {total.toLocaleString()} 条</span><div className="divider" /><span>第 1/{tp} 页</span></div>;
}

function EmptyZero({ entity, onCta }) {
  return <div className="lp-empty"><InboxOutlined className="icon" /><div className="title">暂无{entity}</div><div className="desc">点击下方按钮创建第一个{entity}</div><Button type="primary" onClick={onCta}>新增{entity}</Button></div>;
}

function EmptyNoMatch({ onClear }) {
  return <div className="lp-empty"><SearchOutlined className="icon" /><div className="title">未找到匹配结果</div><div className="desc">请尝试调整搜索关键词或筛选条件</div><Button onClick={onClear}>清除筛选条件</Button></div>;
}

function EmptyError({ onRetry }) {
  return <div className="lp-empty"><ExclamationCircleOutlined className="icon err" /><div className="title">加载失败</div><div className="desc">网络异常，请检查网络连接后重试</div><Button type="primary" onClick={onRetry}>重试</Button></div>;
}

function EmptyStateSwitcher({ mode, setMode }) {
  return <div style={{ marginTop: 12, display: 'flex', gap: 8, justifyContent: 'center' }}>{[['data', '正常数据'], ['zero', '零数据态'], ['no-match', '无匹配态'], ['error', '异常态']].map(([k, label]) => <Button key={k} size="small" type={mode === k ? 'primary' : 'default'} onClick={() => setMode(k)}>{label}</Button>)}</div>;
}

function ListPage({ title, desc, headActions, kpis, filters, columns, data, entity, createKey, go, scrollX }) {
  const [mode, setMode] = useState('data');
  return (
    <Card style={CARD_STYLE}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 16, marginBottom: 18 }}>
        <div><div style={{ fontSize: 20, fontWeight: 700, marginBottom: 6 }}>{title}</div>{desc && <div style={{ color: '#6B7280', fontSize: 13 }}>{desc}</div>}</div>
        <div>{headActions}</div>
      </div>
      {kpis && <div style={{ display: 'grid', gridTemplateColumns: `repeat(${kpis.length},1fr)`, gap: 12, marginBottom: 18 }}>{kpis.map((k, i) => <Kpi key={i} num={k.num} label={k.label} />)}</div>}
      {filters && <Space size={12} wrap style={{ marginBottom: 16 }}>{filters}</Space>}
      {mode === 'data' && <><Table rowKey={r => r.id || r.short_code || r.key || r.code} columns={columns} dataSource={data} pagination={false} styles={TABLE_STYLES} scroll={scrollX ? { x: scrollX } : undefined} /><CompactPagination total={data.length} /></>}
      {mode === 'zero' && <EmptyZero entity={entity} onCta={() => go && go(createKey)} />}
      {mode === 'no-match' && <EmptyNoMatch onClear={() => setMode('data')} />}
      {mode === 'error' && <EmptyError onRetry={() => setMode('data')} />}
      <EmptyStateSwitcher mode={mode} setMode={setMode} />
    </Card>
  );
}

// ===================== APP =====================
function App() {
  const [currentPage, setCurrentPage] = useState('overview');
  const [pageParam, setPageParam] = useState(null);

  const go = (page, param) => { setCurrentPage(page); setPageParam(param || null); };

  const subLabel = (text, key) => <span style={{ fontWeight: currentPage === key ? 600 : 400 }}>{text}</span>;

  const menuItems = [
    { key: 'overview', icon: <AppstoreOutlined />, label: subLabel('数据概览', 'overview') },
    { type: 'divider' },
    {
      key: 'short-links', icon: <LinkOutlined />, label: '短链管理',
      children: [
        { key: 'link-list', icon: <UnorderedListOutlined />, label: subLabel('短链列表', 'link-list') },
        { key: 'link-create', icon: <PlusOutlined />, label: subLabel('创建短链', 'link-create') },
      ],
    },
    {
      key: 'referral', icon: <GiftOutlined />, label: '推荐计划',
      children: [
        { key: 'referral-list', icon: <UserOutlined />, label: subLabel('推荐记录', 'referral-list') },
      ],
    },
    {
      key: 'attribution', icon: <LineChartOutlined />, label: '归因分析',
      children: [
        { key: 'attribution-events', icon: <BarChartOutlined />, label: subLabel('转化事件', 'attribution-events') },
      ],
    },
    {
      key: 'antifraud', icon: <SecurityScanOutlined />, label: '反作弊管理',
      children: [
        { key: 'antifraud-list', icon: <SafetyOutlined />, label: subLabel('风险记录', 'antifraud-list') },
      ],
    },
  ];

  const breadcrumb = {
    overview: '数据概览',
    'link-list': '短链管理 / 短链列表',
    'link-create': '短链管理 / 创建短链',
    'link-detail': '短链管理 / 短链详情',
    'referral-list': '推荐计划 / 推荐记录',
    'attribution-events': '归因分析',
    'antifraud-list': '反作弊管理 / 风险记录',
  };

  const activeMenuKey = currentPage === 'link-detail' ? 'link-list' : currentPage;

  const renderPage = () => {
    if (currentPage === 'overview') return <OverviewPage />;
    if (currentPage === 'link-list') return <ShortLinkListPage go={go} />;
    if (currentPage === 'link-detail') return <ShortLinkDetailPage record={pageParam} go={go} />;
    if (currentPage === 'link-create') return <ShortLinkCreatePage go={go} />;
    if (currentPage === 'referral-list') return <ReferralPage />;
    if (currentPage === 'attribution-events') return <AttributionPage />;
    if (currentPage === 'antifraud-list') return <AntiFraudPage />;
    return <OverviewPage />;
  };

  return (
    <ConfigProvider theme={looplyTheme}>
      <Layout style={{ height: '100vh' }}>
        <Layout.Header style={{ display: 'flex', alignItems: 'center', borderBottom: '1px solid #E5E7EB' }}>
          <img src={LOGO_SRC} alt="Looply" style={{ height: 32, display: 'block' }} />
          <div style={{ width: 1, height: 20, background: '#E5E7EB', margin: '0 16px' }} />
          <span style={{ fontSize: 14, fontWeight: 500, color: '#6B7280' }}>社媒分享管理</span>
          <span style={{ marginLeft: 'auto', color: '#9CA3AF', fontSize: 13 }}>{breadcrumb[currentPage] || ''}</span>
        </Layout.Header>
        <Layout>
          <Layout.Sider width={220} theme="light" style={SIDER_STYLE}>
            <Menu
              mode="inline"
              items={menuItems}
              selectedKeys={[activeMenuKey]}
              defaultOpenKeys={['short-links', 'referral', 'attribution', 'antifraud']}
              style={{ borderInlineEnd: 'none' }}
              onClick={({ key }) => {
                if (key === 'link-list') go('link-list');
                else if (key === 'link-create') go('link-create');
                else if (key === 'referral-list') go('referral-list');
                else if (key === 'attribution-events') go('attribution-events');
                else if (key === 'antifraud-list') go('antifraud-list');
                else if (key === 'overview') go('overview');
              }}
            />
          </Layout.Sider>
          <Layout.Content style={{ padding: 28, overflow: 'auto' }}>
            {renderPage()}
          </Layout.Content>
        </Layout>
      </Layout>
    </ConfigProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
