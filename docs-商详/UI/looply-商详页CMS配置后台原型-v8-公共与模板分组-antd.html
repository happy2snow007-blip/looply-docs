    .lp-entity-name{font-weight:600;color:#1F2937;margin-bottom:3px}
    .lp-meta{font-size:12px;color:#9CA3AF;line-height:18px}

    .lp-rule-path .arrow{color:#9CA3AF}
    .lp-form-row{display:flex;gap:16px;margin-bottom:14px;align-items:flex-start}

    .lp-form-control{flex:1;min-width:0}
    .lp-helper{font-size:12px;color:#9CA3AF;margin:-6px 0 14px 128px;line-height:18px}
    .lp-effective{border:1px solid #E5E7EB;border-radius:10px;padding:12px 14px;background:#FAFAFA}
    .lp-effective-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px;font-size:13px;font-weight:600}
    .lp-effective-url{font-family:Menlo,Monaco,Consolas,monospace;font-size:12px;color:#374151;line-height:18px;word-break:break-all}
    .lp-empty{display:flex;flex-direction:column;align-items:center;padding:60px 20px;text-align:center}
    .lp-empty .icon{font-size:48px;margin-bottom:16px;color:#9CA3AF}
    .lp-empty .icon.err{color:#DC2626}
    .lp-empty .title{font-size:16px;font-weight:600;color:#1F2937;margin-bottom:8px}
    .lp-empty .desc{font-size:13px;color:#6B7280;margin-bottom:24px;max-width:360px}
    .lp-state-switcher{margin-top:14px;display:flex;gap:8px;justify-content:center;align-items:center;color:#9CA3AF;font-size:12px}
    .lp-oplog-title{font-size:14px;font-weight:700;color:#A4002A;margin:24px 0 12px}
    .lp-rule-list{display:grid;gap:0;border:1px solid #E5E7EB;border-radius:12px;overflow:hidden}
    .lp-rule-item{display:grid;grid-template-columns:32px 1fr;gap:12px;padding:14px 16px;border-bottom:1px solid #F3F4F6}
    .lp-rule-item:last-child{border-bottom:0}
    .lp-rule-num{width:28px;height:28px;border-radius:50%;background:#FCEEEF;color:#A4002A;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
    .lp-rule-title{font-size:13px;font-weight:600;margin-bottom:3px}
    .lp-rule-desc{font-size:12px;color:#6B7280;line-height:18px}
    :focus-visible{outline:none;box-shadow:inset 0 0 0 2px rgba(164,0,42,.4)}
    @media(max-width:1100px){.lp-kpi-grid{grid-template-columns:repeat(2,1fr)}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  </style>
</head>

};

const COLLECTION_OPTIONS=[
  {value:'COL-10031',label:'Bags · /collections/bags',slug:'bags',market:'US',status:'published'},
  {value:'COL-10487',label:'Crossbody Bags · /collections/crossbody-bag',slug:'crossbody-bag',market:'US',status:'published'},

];

];
const TYPE_LABEL={brand:'品牌',l1:'一级类目',l3:'三级类目'};

function StatusTag({variant='off',children}){const c=TAG_COLORS[variant]||TAG_COLORS.off;return <Tag bordered={false} style={{background:c.bg,color:c.color,borderRadius:999,padding:'2px 8px',fontSize:12,lineHeight:'18px',marginInlineEnd:4}}>{children}</Tag>}
function Kpi({num,label}){return <div className="lp-kpi"><div className="num">{num}</div><div className="label">{label}</div></div>}
function FormRow({label,required,helper,children}){return <><div className="lp-form-row"><div className="lp-form-label">{required&&<span className="req">*</span>}{label}</div><div className="lp-form-control">{children}</div></div>{helper&&<div className="lp-helper">{helper}</div>}</>}
function effectiveRoute(row){
  const collection=COLLECTION_OPTIONS.find(item=>item.value===row.collectionId);
  const usable=collection&&collection.status==='published'&&collection.market===row.market;
  if(usable)return {source:'collection',label:'Collection',variant:'on',url:`https://www.looply.com/en-US/collections/${collection.slug}`,reason:'已关联可用 Collection'};
  if(String(row.fallback||'').trim())return {source:'search',label:'搜索兜底',variant:'pending',url:`https://www.looply.com/en-US/search?keyword=${encodeURIComponent(row.fallback.trim()).replace(/%20/g,'+')}&trigger_type=breadcrumb`,reason:collection?'Collection 不可用，已自动兜底':'未关联 Collection，已自动兜底'};
  return {source:'error',label:'配置异常',variant:'req',url:'—',reason:'缺少可用 Collection 和搜索关键词'};
}
function EmptyZero(){return <div className="lp-empty"><InboxOutlined className="icon"/><div className="title">暂无面包屑对象</div><div className="desc">品牌与类目数据将从主数据自动同步，无需在此手动新建。</div></div>}
function EmptyNoMatch({onClear}){return <div className="lp-empty"><SearchOutlined className="icon"/><div className="title">未找到匹配结果</div><div className="desc">请尝试调整搜索关键词或筛选条件</div><Button onClick={onClear}>清除筛选条件</Button></div>}
function EmptyError({onRetry}){return <div className="lp-empty"><ExclamationCircleOutlined className="icon err"/><div className="title">加载失败</div><div className="desc">网络异常，请检查网络连接后重试</div><Button type="primary" onClick={onRetry}>重试</Button></div>}
function EmptyStateSwitcher({mode,setMode}){return <div className="lp-state-switcher"><span>原型状态：</span>{[['data','正常数据'],['zero','零数据态'],['no-match','无匹配态'],['error','异常态']].map(([key,label])=><Button size="small" key={key} type={mode===key?'primary':'default'} onClick={()=>setMode(key)}>{label}</Button>)}</div>}

function MappingModal({open,row,onClose,onSave}){
  const [form,setForm]=React.useState(row||{});
  React.useEffect(()=>{if(open)setForm(row||{});},[open,row]);
  const patch=(key,value)=>setForm(current=>({...current,[key]:value}));
  const route=effectiveRoute(form);
  const selected=COLLECTION_OPTIONS.find(item=>item.value===form.collectionId);
  const submit=()=>{if(!String(form.label||'').trim()){message.warning('请输入面包屑名称');return}if(route.source==='error'){message.error('请关联可用 Collection 或填写搜索兜底关键词');return}onSave({...form,label:form.label.trim(),fallback:String(form.fallback||'').trim()})};
  return <Modal title="编辑面包屑跳转" open={open} onCancel={onClose} closable={false} maskClosable={false} centered width={680} footer={[<Button key="cancel" onClick={onClose}>取消</Button>,<Button key="preview" icon={<EyeOutlined/>} disabled={route.source==='error'} onClick={()=>message.info(`预览：${route.url}`)}>预览落地页</Button>,<Button key="save" type="primary" onClick={submit}>保存</Button>]}>
    <Alert type={route.source==='collection'?'success':route.source==='search'?'warning':'error'} showIcon message={route.reason} style={{marginBottom:18}}/>
    <FormRow label="配置对象"><Input value={`${TYPE_LABEL[form.type]||''} · ${form.name||''}`} disabled/></FormRow>
    <FormRow label="稳定 ID"><Input value={form.id||''} disabled/></FormRow>
    <FormRow label="面包屑名称" required helper="仅控制前台展示名称，不参与 URL 拼接。"><Input value={form.label||''} maxLength={60} onChange={event=>patch('label',event.target.value)}/></FormRow>
    <FormRow label="首选 Collection" helper="按 Collection ID 关联；名称与 URL Slug 不一致也不会影响跳转。">
      <Select allowClear showSearch value={form.collectionId||undefined} placeholder="未关联时使用搜索结果页" style={{width:'100%'}} options={COLLECTION_OPTIONS.map(item=>({value:item.value,label:item.label,disabled:item.status!=='published'}))} onChange={value=>patch('collectionId',value||null)}/>
      {selected&&<div className="lp-meta" style={{marginTop:6}}>Collection ID：{selected.value} · {selected.status==='published'?'已发布':'已下架'} · {selected.market} Market</div>}
    </FormRow>
    <FormRow label="搜索兜底词" required={route.source!=='collection'} helper="无可用 Collection 时自动跳转搜索结果页；默认取面包屑名称，可单独调整。"><Input value={form.fallback||''} maxLength={80} placeholder="例如 Crossbody Bags" onChange={event=>patch('fallback',event.target.value)}/></FormRow>
    <FormRow label="当前生效地址">
      <div className="lp-effective"><div className="lp-effective-head"><span>{route.label}</span><StatusTag variant={route.variant}>{route.label}</StatusTag></div><div className="lp-effective-url">{route.url}</div></div>
    </FormRow>
  </Modal>
}

function RuleModal({open,onClose}){return <Modal title="面包屑跳转规则" open={open} onCancel={onClose} closable={false} maskClosable={false} centered width={620} footer={[<Button key="close" type="primary" onClick={onClose}>知道了</Button>]}><div className="lp-rule-list"><div className="lp-rule-item"><div className="lp-rule-num">1</div><div><div className="lp-rule-title">优先使用已关联的 Collection</div><div className="lp-rule-desc">Collection 必须为已发布，且 Market、渠道与当前商品一致。</div></div></div><div className="lp-rule-item"><div className="lp-rule-num">2</div><div><div className="lp-rule-title">不可用时自动进入搜索结果页</div><div className="lp-rule-desc">未关联、已下架、已删除或 Market 不匹配时，使用搜索兜底词生成地址。</div></div></div><div className="lp-rule-item"><div className="lp-rule-num">3</div><div><div className="lp-rule-title">前台只读取最终生效地址</div><div className="lp-rule-desc">前台不拼接 slug；接口返回 label、url 和来源类型，避免命名差异导致错误。</div></div></div></div></Modal>}

function LogModal({open,onClose}){const logs=[{id:'L1',at:'2026-11-23 10:34',who:'liyuxue',type:'编辑',detail:'Crossbody Bags：关联 Collection COL-10487'},{id:'L2',at:'2026-11-22 18:20',who:'liyuxue',type:'编辑',detail:'CHANEL：设置搜索兜底词 CHANEL'},{id:'L3',at:'2026-11-20 09:42',who:'Evan Li',type:'自动切换',detail:'Shoulder Bags：Collection 下架，切换为搜索兜底'}];const columns=[{title:'操作时间',dataIndex:'at',width:155},{title:'操作人',dataIndex:'who',width:110},{title:'操作类型',dataIndex:'type',width:110,render:value=><StatusTag variant={value==='自动切换'?'pending':'sale'}>{value}</StatusTag>},{title:'操作详情',dataIndex:'detail'}];return <Modal title="变更记录" open={open} onCancel={onClose} closable={false} maskClosable={false} centered width={820} footer={[<Button key="close" onClick={onClose}>关闭</Button>]}><Space size={8} wrap style={{marginBottom:12}}><Select defaultValue="" style={{width:140}} options={[{value:'',label:'全部操作类型'},{value:'edit',label:'编辑'},{value:'auto',label:'自动切换'}]}/><DatePicker.RangePicker placeholder={['开始日期','结束日期']}/><Button icon={<SearchOutlined/>}>查询</Button></Space><Table rowKey="id" columns={columns} dataSource={logs} pagination={false} styles={TABLE_STYLES}/></Modal>}

const PDP_MODULES=[
  {key:'trust',name:'Certified Authentic 鉴定认证',tag:'认证'},
  {key:'condition',name:'Condition 成色',tag:'品质'},
  {key:'description',name:'Description 描述',tag:'信息'},
  {key:'shipping',name:'Shipping & Returns 配送与退货',tag:'履约'}
];
function ModulePlaceholder({module}){return <Card size="small" title={module.name}><div className="lp-meta">沿用线上商品模板配置，本原型未调整该模块字段。</div></Card>}

function BreadcrumbConfigPage(){
  const [rows,setRows]=React.useState(INITIAL_ROWS);
  const [market,setMarket]=React.useState('US');
  const [activeType,setActiveType]=React.useState('all');
  const [keyword,setKeyword]=React.useState('');
  const [routeFilter,setRouteFilter]=React.useState('all');
  const [mode,setMode]=React.useState('data');
  const [editing,setEditing]=React.useState(null);
  const [ruleOpen,setRuleOpen]=React.useState(false);
  const [logOpen,setLogOpen]=React.useState(false);
  const [activeFamily,setActiveFamily]=React.useState('watch');
  const [activePdpModule,setActivePdpModule]=React.useState('breadcrumb');
  const filtered=rows.filter(row=>row.market===market&&(activeType==='all'||row.type===activeType)&&(routeFilter==='all'||effectiveRoute(row).source===routeFilter)&&(!keyword||`${row.name}${row.id}${row.label}`.toLowerCase().includes(keyword.toLowerCase())));
  const collectionCount=rows.filter(row=>row.market===market&&effectiveRoute(row).source==='collection').length;
  const searchCount=rows.filter(row=>row.market===market&&effectiveRoute(row).source==='search').length;
  const errorCount=rows.filter(row=>row.market===market&&effectiveRoute(row).source==='error').length;
  const clearFilters=()=>{setKeyword('');setRouteFilter('all');setActiveType('all');setMode('data')};
  const saveRow=next=>{setRows(current=>current.map(row=>row.id===next.id?{...next,updatedAt:'2026-11-23 16:40',updatedBy:'liyuxue'}:row));setEditing(null);message.success('面包屑跳转配置已保存')};
  const columns=[
    {title:'配置对象',key:'entity',width:210,render:(_,row)=><div><div className="lp-entity-name">{row.name}</div><div className="lp-meta"><StatusTag variant="opt">{TYPE_LABEL[row.type]}</StatusTag>{row.id}</div></div>},
    {title:'面包屑展示',dataIndex:'label',width:150,render:value=><span>{value}</span>},
    {title:'首选 Collection',key:'collection',width:240,render:(_,row)=>{const item=COLLECTION_OPTIONS.find(value=>value.value===row.collectionId);return item?<div><div>{item.label.split(' · ')[0]}</div><div className="lp-meta">{item.value} · /{item.slug}</div></div>:<span className="lp-meta">未关联</span>}},
    {title:'当前跳转结果',key:'route',width:430,render:(_,row)=>{const route=effectiveRoute(row);return <div><Space size={6} style={{marginBottom:5}}><StatusTag variant={route.variant}>{route.label}</StatusTag><span className="lp-meta">{route.reason}</span></Space><Tooltip title={route.url}><div className="lp-url">{route.url}</div></Tooltip></div>}},
    {title:'更新信息',key:'updated',width:155,render:(_,row)=><div><div>{row.updatedAt}</div><div className="lp-meta">{row.updatedBy}</div></div>},
    {title:'操作',key:'action',fixed:'right',width:140,render:(_,row)=><Space size={6}><Button size="small" icon={<EditOutlined/>} onClick={()=>setEditing(row)}>编辑</Button><Tooltip title="查看当前落地地址"><Button size="small" icon={<EyeOutlined/>} onClick={()=>message.info(effectiveRoute(row).url)}/></Tooltip></Space>}
  ];
  return <>
    <Card style={CARD_STYLE}>
      <div className="lp-page-head"><div><div className="lp-page-title">商详页配置</div></div>{activePdpModule==='breadcrumb'&&<Space><Button icon={<InfoCircleOutlined/>} onClick={()=>setRuleOpen(true)}>跳转规则</Button><Button icon={<HistoryOutlined/>} onClick={()=>setLogOpen(true)}>变更记录</Button></Space>}</div>
      <div style={{display:'grid',gridTemplateColumns:'280px minmax(0,1fr)',gap:20,alignItems:'start'}}>
        <Card size="small" title="配置导航">
          <div style={{fontSize:13,fontWeight:650,marginBottom:8}}>公共配置</div>
          <Button block type={activePdpModule==='breadcrumb'?'primary':'default'} style={{height:'auto',minHeight:40,textAlign:'left',whiteSpace:'normal'}} onClick={()=>setActivePdpModule('breadcrumb')}>
            <span style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8,width:'100%'}}><span>Breadcrumb 面包屑</span><StatusTag variant={activePdpModule==='breadcrumb'?'sale':'off'}>全局</StatusTag></span>
          </Button>
          <Divider style={{margin:'18px 0 14px'}}/>
          <div style={{fontSize:13,fontWeight:650,marginBottom:8}}>商品模板</div>
          <Select value={activeFamily} onChange={setActiveFamily} style={{width:'100%',marginBottom:12}} options={[{value:'watch',label:'watch 模板'},{value:'bag',label:'bag 模板'},{value:'jewelry',label:'jewelry 模板'},{value:'accessories',label:'accessories 模板'}]}/>
          <Space direction="vertical" size={8} style={{width:'100%'}}>
            {PDP_MODULES.map((module,index)=><Button key={module.key} block type={activePdpModule===module.key?'primary':'default'} style={{height:'auto',minHeight:40,textAlign:'left',whiteSpace:'normal'}} onClick={()=>setActivePdpModule(module.key)}><span style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8,width:'100%'}}><span>{index+1}. {module.name}</span><StatusTag variant="off">{module.tag}</StatusTag></span></Button>)}
          </Space>
        </Card>
        <div style={{minWidth:0}}>
          {activePdpModule==='breadcrumb'?<>
            <div style={{margin:'0 0 18px'}}><div style={{fontSize:16,fontWeight:650,marginBottom:5}}>Breadcrumb 面包屑</div><div className="lp-page-desc">品牌、一级类目和三级类目跳转配置。</div></div>
            <div className="lp-kpi-grid"><Kpi num={rows.filter(row=>row.market===market).length} label="配置对象"/><Kpi num={collectionCount} label="Collection 生效"/><Kpi num={searchCount} label="搜索兜底"/><Kpi num={errorCount} label="配置异常"/></div>
            <Tabs activeKey={activeType} onChange={setActiveType} items={[{key:'all',label:'全部'},{key:'brand',label:'品牌'},{key:'l1',label:'一级类目'},{key:'l3',label:'三级类目'}]}/>
            <div className="lp-toolbar"><Space size={10} wrap><Select value={market} style={{width:190}} prefix={<GlobalOutlined/>} options={MARKET_OPTIONS} onChange={setMarket}/><Input value={keyword} onChange={event=>setKeyword(event.target.value)} placeholder="搜索名称或稳定 ID" allowClear prefix={<SearchOutlined style={{color:'#9CA3AF'}}/>} style={{width:240}}/><Select value={routeFilter} style={{width:150}} options={[{value:'all',label:'全部跳转结果'},{value:'collection',label:'Collection'},{value:'search',label:'搜索兜底'},{value:'error',label:'配置异常'}]} onChange={setRouteFilter}/><Button icon={<ReloadOutlined/>} onClick={clearFilters}>重置</Button></Space><div className="lp-meta"><DatabaseOutlined/> 配置对象由品牌/类目主数据自动同步</div></div>
            {mode==='data'&&filtered.length>0&&<><Table rowKey="id" columns={columns} dataSource={filtered} pagination={false} styles={TABLE_STYLES} scroll={{x:'max-content'}}/><div style={{textAlign:'center',padding:'12px 0',fontSize:13,color:'#6B7280'}}>共 {filtered.length} 条</div></>}
            {mode==='data'&&filtered.length===0&&<EmptyNoMatch onClear={clearFilters}/>} 
            {mode==='zero'&&<EmptyZero/>}
            {mode==='no-match'&&<EmptyNoMatch onClear={()=>setMode('data')}/>} 
            {mode==='error'&&<EmptyError onRetry={()=>setMode('data')}/>} 
            <EmptyStateSwitcher mode={mode} setMode={setMode}/>
          </>:<ModulePlaceholder module={PDP_MODULES.find(module=>module.key===activePdpModule)}/>} 
        </div>
      </div>
    </Card>
    <MappingModal open={Boolean(editing)} row={editing} onClose={()=>setEditing(null)} onSave={saveRow}/>
    <RuleModal open={ruleOpen} onClose={()=>setRuleOpen(false)}/>
    <LogModal open={logOpen} onClose={()=>setLogOpen(false)}/>
  </>
}

    {key:'pdp',icon:<FileTextOutlined/>,label:<span style={{fontWeight:activeKey==='pdp'?600:400}}>商详页配置</span>},

}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
