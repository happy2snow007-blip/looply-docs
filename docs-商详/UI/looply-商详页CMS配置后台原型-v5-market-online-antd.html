function buildAttrsFromRule(rule) {
  const catName = rule.scope;
  const defs = CATEGORY_ATTR_DEFS[catName] || [];
  const result = [];
  rule.attrs.forEach((name, i) => {
    const def = defs.find(d => d.name === name);
    result.push({ id:`a${i+1}`, type:'attr', name, source:def?.source||'', sample:def?.sample||'(value)', sources:def?.sources||NEW_SOURCES });
  });
  result.push({ id:'sg', type:'sizeguide', name:'Size', enabled:true });
  const extraDefs = defs.filter(d => !rule.attrs.includes(d.name)).slice(0, 2);
  extraDefs.forEach((d, i) => {
    result.push({ id:`e${i+1}`, type:'attr', name:d.name, source:d.source, sample:d.sample, sources:d.sources });
  });
  return result;
}

/* ========== AttrRows（v2 风格：拖拽 + 展示名 + 数据源 + 删除/Switch） ========== */
function AttrRows({ attrs, onName, onSource, onRemove, onToggleSG, onReorder }) {
  const [dragId, setDragId] = React.useState(null);
  const [overId, setOverId] = React.useState(null);
  const onDragStart = (e, id) => { setDragId(id); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', id); };
  const onDragOver = (e, id) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; if (id !== dragId) setOverId(id); };
  const onDrop = (e, id) => { e.preventDefault(); if (dragId && dragId !== id && onReorder) onReorder(dragId, id); setDragId(null); setOverId(null); };
  const onDragEnd = () => { setDragId(null); setOverId(null); };

  return attrs.map(a => {
    const isDragging = dragId === a.id;
    const isOver = overId === a.id && dragId !== a.id;
    const dragProps = { draggable:true, onDragStart:e=>onDragStart(e,a.id), onDragOver:e=>onDragOver(e,a.id), onDrop:e=>onDrop(e,a.id), onDragEnd };
    const dropStyle = isOver ? { borderTopColor:'#A4002A', borderTopWidth:2 } : {};

    return a.type === 'sizeguide' ? (
      <div className="lp-attr-row" key={a.id} {...dragProps}
        style={{ opacity: isDragging ? 0.35 : (a.enabled ? 1 : 0.45), transition:'opacity .15s', ...dropStyle }}>
        <HolderOutlined className="drag" />
        <Input value={a.name} disabled={!a.enabled} style={{ width:140 }}
          placeholder="为空时不展示属性名" onChange={e => onName?.(a.id, e.target.value)} />
        <Select disabled value="尺码指南（固定模块）" style={{ flex:1 }}
          options={[{ value:'尺码指南（固定模块）', label:'尺码指南（固定模块）' }]} />
        <Switch size="small" checked={a.enabled} onChange={v => onToggleSG?.(a.id, v)} />
      </div>
    ) : (
      <div className="lp-attr-row" key={a.id} {...dragProps}
        style={{ opacity: isDragging ? 0.35 : 1, transition:'opacity .15s', ...dropStyle }}>
        <HolderOutlined className="drag" />
        <Input value={a.name} style={{ width:140 }}
          placeholder="展示名" onChange={e => onName?.(a.id, e.target.value)} />
        <Select value={a.source || undefined} placeholder="请选择数据源" style={{ flex:1 }}
          onChange={v => onSource?.(a.id, v)}
          options={(a.sources || NEW_SOURCES).map(s => ({ value:s, label:s }))} />
        <Button size="small" danger onClick={() => onRemove?.(a.id)}>删除</Button>
      </div>
    );
  });
}

/* ========== ConditionEditModal ========== */
function ConditionEditModal({ open, config, onClose }) {
  const [grades, setGrades] = useState(config?.grades || []);
  const [dirty, setDirty] = useState(false);
  const mark = (fn) => (...a) => { setDirty(true); fn(...a); };
  const updateGrade = (id, field, val) => setGrades(prev => prev.map(g => g.id === id ? { ...g, [field]:val } : g));
  const addGrade = () => {
    const n = grades.length + 1;
    setGrades(prev => [...prev, { id:`g${n}`, name:'', desc:'' }]);
  };
  const removeGrade = (id) => setGrades(prev => prev.filter(g => g.id !== id));
  const handleCancel = () => confirmDiscard(dirty, () => { setDirty(false); onClose(); });

  return (
    <Modal open={open} onCancel={handleCancel} closable={false} maskClosable={false} centered width={920}
      title="编辑 Condition 成色配置" footer={[
        <Button key="c" onClick={handleCancel}>取消</Button>,
        <Button key="s" type="primary" onClick={() => { setDirty(false); onClose(); }}>保存</Button>,
      ]}>
      <div style={{ fontSize:13,fontWeight:600,color:'#374151',marginBottom:8 }}>成色等级（{grades.length} 个，从高到低排列）</div>
      {grades.map((g, idx) => (
        <div key={g.id} style={{ padding:12,border:'1px solid #E5E7EB',borderRadius:10,marginBottom:8,background:'#fff' }}>
          <div style={{ display:'flex',alignItems:'center',gap:8,marginBottom:8 }}>
            <HolderOutlined style={{ color:'#9CA3AF',cursor:'grab' }} />
            <Input value={g.name} onChange={mark(e => updateGrade(g.id,'name',e.target.value))} style={{ width:140 }} placeholder="等级名称" />
            <Tag style={{ background:'#F9FAFB',border:'1px solid #E5E7EB',color:'#6B7280',borderRadius:6,padding:'1px 8px',margin:0 }}>
              {Math.round(100*(grades.length-idx)/grades.length)}%
            </Tag>
            {grades.length > 2 && <Button size="small" danger type="text" icon={<DeleteOutlined />} onClick={mark(() => removeGrade(g.id))} style={{ marginLeft:'auto' }} />}
          </div>
          <Input.TextArea value={g.desc} onChange={mark(e => updateGrade(g.id,'desc',e.target.value))} placeholder="成色说明（前台展示给用户的完整描述）" rows={2} />
        </div>
      ))}
      <Button type="dashed" block icon={<PlusOutlined />} onClick={mark(addGrade)} style={{ marginTop:4 }}>添加等级</Button>
      <ConditionBarPreview grades={grades} activeIndex={2} />
    </Modal>
  );
}

    const isDragging = dragId === f.id;
    const isOver = overId === f.id && dragId !== f.id;
    const dragProps = { draggable:true, onDragStart:e=>onDragStart(e,f.id), onDragOver:e=>onDragOver(e,f.id), onDrop:e=>onDrop(e,f.id), onDragEnd };
    const dropStyle = isOver ? { borderTopColor:'#A4002A', borderTopWidth:2 } : {};

    return (
      <div className="lp-attr-row" key={f.id} {...dragProps}
        style={{ opacity: isDragging ? 0.35 : 1, transition:'opacity .15s', ...dropStyle }}>
        <HolderOutlined className="drag" />
        <Input value={f.name} style={{ width:140 }}
          placeholder="展示名（空则仅展示值）" onChange={e => onName?.(f.id, e.target.value)} />
        <Select value={f.source || undefined} placeholder="请选择数据源" style={{ flex:1 }}
          onChange={v => onSource?.(f.id, v)}
          options={COND_DETAIL_SOURCES.map(s => { const used = fields.some(o => o.id !== f.id && o.source === s.key); return { value:s.key, label: used ? s.label+' (已选)' : s.label, disabled: used }; })} />
        <Button size="small" danger onClick={() => onRemove?.(f.id)}>删除</Button>
      </div>
    );
  });
}

/* ========== EditTemplateModal（P0-1：模板编辑） ========== */
function EditTemplateModal({ open, template, onClose }) {
  const [label, setLabel] = useState(template?.label || '');
  const [desc, setDesc] = useState(template?.desc || '');
  const [cats, setCats] = useState(template?.categories || []);
  const [dirty, setDirty] = useState(false);
  const mark = (fn) => (...a) => { setDirty(true); fn(...a); };
  React.useEffect(() => { if (template) { setLabel(template.label); setDesc(template.desc); setCats(template.categories); setDirty(false); } }, [open]);
  const handleCancel = () => confirmDiscard(dirty, () => { setDirty(false); onClose(); });
  const templatesInMarket = marketTemplates(template?.marketId);
  const occupiedCategories = occupiedCategoriesByMarket(template?.marketId);
  const otherOccupied = occupiedCategories.filter(c => !(template?.categories||[]).includes(c));
  const catOptions = ALL_CATEGORIES.map(c => {
    const occupied = otherOccupied.includes(c);
    const owner = occupied ? templatesInMarket.find(t => t.categories.includes(c))?.label : '';
    return { value:c, label: occupied ? `${c}（已被 ${owner} 占用）` : c, disabled: occupied };
  });
  const market = MARKETS.find(m => m.id === template?.marketId);
  return (
    <Modal open={open} onCancel={handleCancel} closable={false} maskClosable={false} centered width={720}
      title="编辑模板" footer={[
        <Button key="del" danger style={{ float:'left' }} onClick={() => {
          Modal.confirm({ title:'确认删除模板？', content:`删除「${template?.label}」后，关联的类目将失去 CMS 配置。此操作不可恢复。`,
            okText:'确认删除', okButtonProps:{ danger:true }, cancelText:'取消', centered:true, onOk: onClose });
        }}>删除模板</Button>,
        <Button key="c" onClick={handleCancel}>取消</Button>,
        <Button key="s" type="primary" disabled={!label} onClick={() => { setDirty(false); onClose(); }}>保存</Button>,
      ]}>
      <Alert type="info" showIcon={false} style={{ marginBottom:14 }}
        message={`所属 Market：${market?.short || template?.marketId || '-'}。保存后只影响该 Market 下的模板，不影响其他 Market 的同名模板。`} />
      <div style={{ marginBottom:14 }}>
        <div style={{ fontSize:13,fontWeight:600,color:'#374151',marginBottom:6 }}>模板名称</div>
        <Input value={label} onChange={mark(e=>setLabel(e.target.value))} />
      </div>
      <div style={{ marginBottom:14 }}>
        <div style={{ fontSize:13,fontWeight:600,color:'#374151',marginBottom:6 }}>描述</div>
        <Input.TextArea value={desc} onChange={mark(e=>setDesc(e.target.value))} rows={2} />
      </div>
      <div style={{ marginBottom:14 }}>
        <div style={{ fontSize:13,fontWeight:600,color:'#374151',marginBottom:6 }}>关联类目</div>
        <Select mode="multiple" value={cats} onChange={mark(setCats)} style={{ width:'100%' }} options={catOptions} />
        <div style={{ fontSize:12,color:'#9CA3AF',marginTop:4 }}>灰色选项已被其他模板占用，不可选择。</div>
      </div>
    </Modal>
  );
}

        <Input value={moduleTitle} onChange={mark(e=>setModuleTitle(e.target.value))} />
      </div>
      <div style={{ display:'grid',gridTemplateColumns:'1fr 1fr',gap:18 }}>
        <div>

            <div style={{ fontSize:13,fontWeight:600,color:'#374151',marginBottom:6 }}>说明文案</div>
            <RichTextToolbar />
            <Input.TextArea value={shippingDesc} onChange={mark(e=>setShippingDesc(e.target.value))} rows={5}

        <div>
          <div style={{ fontSize:14,fontWeight:600,color:'#374151',marginBottom:10 }}>Easy Returns</div>
          <div style={{ marginBottom:12 }}>
            <div style={{ fontSize:13,fontWeight:600,color:'#374151',marginBottom:6 }}>标题</div>
            <Input value={returnTitle} onChange={mark(e=>setReturnTitle(e.target.value))} />
          </div>
          <div>
            <div style={{ fontSize:13,fontWeight:600,color:'#374151',marginBottom:6 }}>说明文案</div>
            <RichTextToolbar />
            <Input.TextArea value={returnDesc} onChange={mark(e=>setReturnDesc(e.target.value))} rows={5}
              style={{ borderRadius:'0 0 8px 8px',borderTop:'1px solid #E5E7EB' }} />
          </div>
        </div>
      </div>
      <div style={{ margin:'18px 0' }}>
        <div style={{ fontSize:13,fontWeight:600,color:'#374151',marginBottom:6 }}>Return & Refund Policy 链接</div>
        <Input value={policyLink} onChange={mark(e=>setPolicyLink(e.target.value))} placeholder="按 Market 填写政策页面链接" prefix={<LinkOutlined style={{ color:'#9CA3AF' }} />} />
      </div>
      <div style={{ fontSize:11,fontWeight:700,color:'#9CA3AF',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:12,paddingTop:12,borderTop:'1px solid #E5E7EB' }}>
        前台预览
      </div>
      <div className="lp-policy-preview">
        <h4>{moduleTitle || 'Shipping & Returns'}</h4>
        <p><strong>{shippingTitle || 'Free Shipping'}</strong><br />{shippingDesc || '未配置配送文案'}</p>
        <p><strong>{returnTitle || 'Easy Returns'}</strong><br />{returnDesc || '未配置退换货文案'}</p>
        <div style={{ color:'#A4002A',fontSize:12,textDecoration:'underline' }}>{policyLink || '未配置政策链接'}</div>

/* ========== 模块禁用占位面板（P2-9） ========== */
function DisabledModulePanel({ moduleName }) {
  return (
    <div className="lp-disabled-panel">
      <StopOutlined style={{ fontSize:36,color:'#D1D5DB',marginBottom:12 }} />
      <div style={{ fontSize:15,fontWeight:600,color:'#6B7280',marginBottom:6 }}>{moduleName} 模块已关闭</div>
      <div style={{ fontSize:12,color:'#9CA3AF' }}>开启左侧模块开关后可编辑配置内容</div>
    </div>
  );
}

/* ========== PdpConfigPage ========== */
function PdpConfigPage() {
  const [activeMarket, setActiveMarket] = useState('US');
  const [activeTemplate, setActiveTemplate] = useState('us-watch');
  const [activeModule, setActiveModule] = useState('trust');
  const [opLogOpen, setOpLogOpen] = useState(false);
  const [newTplOpen, setNewTplOpen] = useState(false);
  const [copyTplOpen, setCopyTplOpen] = useState(false);
  const [editTplOpen, setEditTplOpen] = useState(false);
  const [editTplData, setEditTplData] = useState(null);
  const [logFilterTpl, setLogFilterTpl] = useState('all');
  const [logFilterMod, setLogFilterMod] = useState('all');

  /* P0-2：模块开关受控状态 */
  const [moduleStates, setModuleStates] = useState({
    'us-watch': { trust:true, condition:true, description:true, shipping:true },
    'us-bag': { trust:true, condition:true, description:true, shipping:true },
    'us-jewelry': { trust:true, condition:true, description:true, shipping:true },
    'us-accessories': { trust:true, condition:true, description:true, shipping:true },
    'hk-watch': { trust:true, condition:true, description:true, shipping:true },
    'hk-bag': { trust:true, condition:true, description:true, shipping:true },
  });
  const toggleModule = (tplKey, modKey, val) => {
    setModuleStates(prev => ({ ...prev, [tplKey]: { ...prev[tplKey], [modKey]:val } }));
  };

  /* P2-10：未关联类目 */
  const templatesInMarket = marketTemplates(activeMarket);
  const activeMarketInfo = MARKETS.find(m => m.id === activeMarket);
  const occupiedCategories = occupiedCategoriesByMarket(activeMarket);
  const unassociatedCats = ALL_CATEGORIES.filter(c => !occupiedCategories.includes(c));
  React.useEffect(() => {
    const first = marketTemplates(activeMarket)[0];
    setActiveTemplate(first?.key || '');
    setActiveModule('trust');
    setLogFilterTpl('all');
  }, [activeMarket]);

  /* P1-5：变更日志筛选 */
  const filteredLogs = OPLOG_DATA.filter(row => {
    if (row.market !== activeMarket) return false;
    if (logFilterTpl !== 'all' && row.template !== logFilterTpl) return false;
    if (logFilterMod !== 'all' && row.module !== logFilterMod) return false;
    return true;
  });
  const activeTpl = templatesInMarket.find(t => t.key === activeTemplate);
  const handleDeleteTemplate = () => {
    if (!activeTpl) return;
    Modal.confirm({
      title:'确认删除模板？',
      content:`删除「${activeTpl.label}」后，${activeMarketInfo?.short || activeMarket} 下关联类目将失去该模板配置。此操作不可恢复。`,
      okText:'确认删除',
      okButtonProps:{ danger:true },
      cancelText:'取消',
      centered:true,
    });
  };

  const templateTabs = templatesInMarket.map(t => {
    const ms = moduleStates[t.key] || { trust:true, condition:true, description:true, shipping:true };
    return {
      key: t.key,
      label: t.label,
      children: (
        <>
          <div style={{ display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16 }}>
            <div style={{ display:'flex',gap:6,flexWrap:'wrap',alignItems:'center' }}>
              <span style={{ fontSize:12,color:'#9CA3AF',marginRight:2 }}>关联类目：</span>
              {t.categories.map(c => <Tag key={c} color="purple">{c}</Tag>)}
            </div>
            <Button size="small" icon={<EditOutlined />} onClick={() => { setEditTplData(t); setEditTplOpen(true); }}>编辑模板</Button>
          </div>

          <div className="lp-workspace">
            <div style={{ width:320, flexShrink:0 }}>
              <div className="lp-module-panel">
                <div style={{ fontSize:13, fontWeight:600, color:'#374151', marginBottom:14 }}>
                  模块列表 <span style={{ fontWeight:400, color:'#9CA3AF' }}>共 {MODULES.length} 个</span>
                </div>
                {MODULES.map((m, i) => {
                  const isOn = ms[m.key];
                  const isActive = activeModule === m.key;
                  const cls = !isOn ? 'lp-module-item-disabled' : isActive ? 'lp-module-item' : 'lp-module-item-off';
                  return (
                    <div key={m.key} className={cls} onClick={() => setActiveModule(m.key)}>
                      <span style={{ flex:1, fontSize:13, fontWeight:500, color: isOn ? '#1F2937' : '#9CA3AF' }}>{i + 1}. {m.name}</span>
                      <StatusTag variant={isOn ? m.tagVariant : 'off'}>{m.tag}</StatusTag>
                      <Switch size="small" checked={isOn} onClick={e => e.stopPropagation()}
                        onChange={v => toggleModule(t.key, m.key, v)} />
                    </div>
                  );
                })}
                <Alert type="info" showIcon={false} style={{ marginTop:6 }}
                  message="仅展示有 CMS 配置项的模块。Breadcrumb、Gallery、商品信息区等固定模块无需配置。" />
              </div>
            </div>

            <div style={{ flex:1, minWidth:0 }}>
              {!ms[activeModule] && activeModule !== 'condition' ? (
                <DisabledModulePanel moduleName={MODULES.find(m=>m.key===activeModule)?.name || ''} />
              ) : (
                <>
                  {activeModule === 'trust' && <TrustPanel templateKey={t.key} />}
                  {activeModule === 'condition' && <ConditionPanel templateKey={t.key} templateCategories={t.categories} switchOff={!ms['condition']} />}
                  {activeModule === 'description' && <DescriptionPanel templateKey={t.key} templateCategories={t.categories} />}
                  {activeModule === 'shipping' && <ShippingReturnsPanel templateKey={t.key} marketId={t.marketId} />}
                </>
              )}
            </div>
          </div>
        </>
      ),
    };
  });

  return (
    <>
    <Card style={CARD_STYLE}>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:16, marginBottom:18 }}>
        <div>
          <div style={{ fontSize:20, fontWeight:700, marginBottom:6 }}>商详页配置</div>
        </div>
        <Tooltip title="查看配置变更记录">
          <Button icon={<HistoryOutlined />} onClick={() => setOpLogOpen(true)}>变更记录</Button>
        </Tooltip>
      </div>

      <div className="lp-market-bar">
        <div style={{ display:'flex',gap:12,alignItems:'center',flexWrap:'wrap' }}>
          <div style={{ display:'flex',alignItems:'center',gap:12 }}>
            <span style={{ fontSize:12,color:'#6B7280',whiteSpace:'nowrap' }}>当前 Market</span>
            <Select value={activeMarket} onChange={setActiveMarket} style={{ width:220 }}
              options={MARKETS.map(m => ({ value:m.id, label:`${m.short} · ${m.currency}` }))} />
          </div>
        </div>
        <div style={{ display:'flex',gap:8,alignItems:'center' }}>
          <Button icon={<CopyOutlined />} onClick={() => setCopyTplOpen(true)}>从其他 Market 复制模板</Button>
        </div>
      </div>

      <Tabs type="card" activeKey={activeTemplate} onChange={setActiveTemplate}
        items={templateTabs}
        tabBarExtraContent={
          <Space size={8}>
            <Button danger icon={<DeleteOutlined />} onClick={handleDeleteTemplate}>删除模板</Button>
            <Button icon={<PlusOutlined />} onClick={() => setNewTplOpen(true)}>新建模板</Button>
          </Space>
        }
      />
    </Card>

    <Drawer title="配置变更记录" open={opLogOpen} onClose={() => setOpLogOpen(false)} width={840}
      styles={{ body:{ padding:'16px 24px' } }}>
      <div style={{ fontSize:12, color:'#9CA3AF', marginBottom:14 }}>记录当前 Market 下所有模板的配置变更操作，包括模板管理、规则新增、编辑、删除及模块开关变更。</div>
      <div style={{ display:'flex', gap:12, marginBottom:14 }}>
        <Select value={logFilterTpl} onChange={setLogFilterTpl} style={{ width:180 }}
          options={[{ value:'all', label:'全部模板' }, ...templatesInMarket.map(t=>({ value:t.label, label:t.label }))]} />
        <Select value={logFilterMod} onChange={setLogFilterMod} style={{ width:160 }}
          options={[{ value:'all', label:'全部模块' },
            { value:'模板管理', label:'模板管理' },{ value:'模块管理', label:'模块管理' },
            { value:'Certified Authentic', label:'Certified Authentic' },{ value:'Condition', label:'Condition' },{ value:'Description', label:'Description' },
            { value:'Shipping & Returns', label:'Shipping & Returns' },
          ]} />
        <Button onClick={() => { setLogFilterTpl('all'); setLogFilterMod('all'); }}>重置</Button>
        <span style={{ alignSelf:'center', fontSize:12, color:'#9CA3AF' }}>共 {filteredLogs.length} 条记录</span>
      </div>
      <Table rowKey="key" dataSource={filteredLogs} columns={OPLOG_COLUMNS}
        pagination={false} size="small" styles={TABLE_STYLES} />
    </Drawer>

    <NewTemplateModal open={newTplOpen} marketId={activeMarket} onClose={() => setNewTplOpen(false)} />
    <CopyMarketTemplateModal open={copyTplOpen} targetMarketId={activeMarket} onClose={() => setCopyTplOpen(false)} />
    <EditTemplateModal open={editTplOpen} template={editTplData} onClose={() => { setEditTplOpen(false); setEditTplData(null); }} />
    </>
  );
}

/* ========== PlaceholderPage ========== */
function PlaceholderPage({ title, desc }) {
  return (
    <Card style={CARD_STYLE}>
      <div style={{ marginBottom:18 }}>
        <div style={{ fontSize:20, fontWeight:700, marginBottom:6 }}>{title}</div>
        <div style={{ color:'#6B7280', fontSize:13 }}>{desc}</div>
      </div>
      <Result icon={<ToolOutlined style={{ color:'#9CA3AF' }} />} title="功能建设中"
        subTitle="该模块正在规划中，敬请期待。" />
    </Card>
  );
}

/* ========== App ========== */
const MENU_LABELS = { 'home-config':'首页配置', 'plp-config':'列表页配置', 'pdp-config':'商详页配置' };

function App() {
  const [activeKey, setActiveKey] = useState('pdp-config');
  const menuItems = [
    { key:'home-config', icon:<HomeOutlined />,      label:subLabel('首页配置', 'home-config', activeKey) },
    { key:'plp-config',  icon:<AppstoreOutlined />,  label:subLabel('列表页配置', 'plp-config', activeKey) },
    { key:'pdp-config',  icon:<FileTextOutlined />,  label:subLabel('商详页配置', 'pdp-config', activeKey) },
  ];

  return (
    <ConfigProvider theme={looplyTheme}>
      <Layout style={{ height:'100vh' }}>
        <Layout.Header style={{ borderBottom:'1px solid #E5E7EB', display:'flex', alignItems:'center' }}>
          <img src={LOGO_SRC} alt="Looply" style={{ width:118, height:'auto', display:'block' }} />
          <div style={{ width:1, height:20, background:'#E5E7EB', margin:'0 16px' }} />
          <span style={{ fontSize:14, fontWeight:500, color:'#6B7280' }}>CMS 管理系统</span>
          <span style={{ marginLeft:'auto', color:'#9CA3AF', fontSize:13 }}>{MENU_LABELS[activeKey]}</span>
        </Layout.Header>
        <Layout>
          <Layout.Sider width={220} theme="light" style={SIDER_STYLE}>
            <Menu mode="inline" items={menuItems} selectedKeys={[activeKey]}
              style={{ borderInlineEnd:'none' }} onClick={({ key }) => setActiveKey(key)} />
          </Layout.Sider>
          <Layout.Content style={{ padding:28, overflow:'auto' }}>
            {activeKey === 'pdp-config' && <PdpConfigPage />}
            {activeKey === 'plp-config' && <PlaceholderPage title="列表页配置" desc="管理商品列表页的布局和筛选配置（待建设）。" />}
            {activeKey === 'home-config' && <PlaceholderPage title="首页配置" desc="管理首页模块和内容配置（待建设）。" />}
          </Layout.Content>
        </Layout>
      </Layout>
    </ConfigProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
