<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Looply 商详页CMS配置后台原型 — antd</title>

<script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>

<style>
/* 基础:加载占位、平台字体 */
html,body,#root{height:100%;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F9FAFB;color:#1F2937}
#root::before{content:'正在加载 antd 原型……';position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#9CA3AF;font-size:14px}
#root:not(:empty)::before{display:none}

/* KPI 卡片 */
.lp-kpi{background:linear-gradient(180deg,#FEFCFF 0%,#F3EEFF 100%);border:1px solid #DDD6FE;border-radius:14px;padding:14px 16px}
.lp-kpi .num{font-size:24px;font-weight:700;color:#7C3AED;line-height:1;margin-bottom:6px;font-variant-numeric:tabular-nums}
.lp-kpi .label{font-size:12px;color:#6B7280}

/* 紧凑分页器 */
.lp-pagination{display:flex;align-items:center;justify-content:center;gap:24px;padding:12px 16px;font-size:13px;color:#6B7280}
.lp-pagination .divider{width:1px;height:20px;background:#E5E7EB}

/* 字段提示:虚线下划线 */
.lp-tip-trigger{cursor:help;border-bottom:1px dashed #9CA3AF;padding-bottom:1px}

/* 紫色提示条 / 小提示条 */
.lp-note{padding:14px;border-radius:10px;background:#F3EEFF;border:1px solid #DDD6FE;color:#6D28D9;font-size:12px;line-height:1.8}
.lp-note-sm{padding:10px 14px;background:#F3EEFF;border:1px solid #DDD6FE;border-radius:8px;font-size:12px;color:#6D28D9}

/* 区块小节标题 */
.lp-section-purple{font-size:14px;font-weight:700;color:#7C3AED;margin:0 0 12px}
.lp-section{font-size:15px;font-weight:600;color:#1F2937;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid #E5E7EB}

/* === 商详页 CMS 配置专用业务样式(结构性布局,非 antd 组件仿造) === */
.lp-module-panel{border:1px solid #E5E7EB;border-radius:14px;background:#fff;padding:14px}
.lp-module-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #7C3AED;background:#F3EEFF;border-radius:10px;cursor:pointer}
.lp-config-panel{border:1px solid #E5E7EB;border-radius:14px;background:#fff;padding:20px;min-height:520px}
.lp-config-panel-title{font-size:15px;font-weight:700;color:#1F2937;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid #E5E7EB;display:flex;justify-content:space-between;align-items:center;gap:12px}
.lp-attr-row{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid #DDD6FE;background:#FAF5FF;border-radius:8px;margin-bottom:6px}
.lp-attr-row .drag{color:#9CA3AF;cursor:grab;font-size:14px;flex-shrink:0}
.lp-scope-box{padding:14px;background:#F9FAFB;border:1px solid #E5E7EB;border-radius:10px;margin-bottom:18px}
.lp-scope-arrow{color:#D1D5DB;font-size:18px;align-self:flex-end;padding-bottom:6px}
.lp-preview-card{border:1px solid #E5E7EB;border-radius:10px;padding:16px;background:#FAFAFA}
.lp-preview-card .pv-title{font-size:12px;font-weight:600;color:#6B7280;margin-bottom:12px;letter-spacing:.3px}
.lp-preview-attr{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid #F3F4F6;font-size:13px}
.lp-preview-attr:last-child{border-bottom:none}
.lp-preview-attr .pv-label{color:#6B7280}
.lp-preview-attr .pv-val{color:#1F2937;font-weight:500}

/* 键盘焦点态(a11y 硬性) */
:focus-visible{outline:none;box-shadow:inset 0 0 0 2px rgba(124,58,237,.4)}

/* 减弱动效(spec 硬性) */
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

/* ========== 业务组件 ========== */
function StatusTag({ variant, children }) {
  const c = TAG_COLORS[variant] || TAG_COLORS.off;
  return (
    <Tag bordered={false}
      style={{ background:c.bg, color:c.color, borderRadius:999, padding:'2px 8px',
               fontSize:12, lineHeight:'18px', marginInlineEnd:4 }}>
      {children}
    </Tag>
  );
}

// 属性名小标签(紫色 pill,用 antd Tag 承载品牌色)
function AttrChip({ children }) {
  return (
    <Tag style={{ margin:'0 4px 2px 0', background:'#F3EEFF', color:'#7C3AED',
                  border:'1px solid #DDD6FE', borderRadius:4, fontSize:11, lineHeight:'18px', padding:'0 6px' }}>
      {children}
    </Tag>
  );
}

/* ========== 属性行 + 预览(编辑 / 新增弹窗共用渲染逻辑) ========== */
function AttrRows({ attrs, onName, onSource, onRemove, onToggleSG }) {
  return attrs.map(a => a.type === 'sizeguide' ? (
    <div className="lp-attr-row" key={a.id} style={{ opacity: a.enabled ? 1 : .45 }}>
      <HolderOutlined className="drag" />
      <Input value={a.name} disabled={!a.enabled} style={{ width:140 }}
        placeholder="为空时不展示属性名" onChange={e => onName(a.id, e.target.value)} />
      <Select disabled value="尺码指南（固定模块）" style={{ flex:1 }}
        options={[{ value:'尺码指南（固定模块）', label:'尺码指南（固定模块）' }]} />
      <Switch size="small" checked={a.enabled} onChange={v => onToggleSG(a.id, v)} />
    </div>
  ) : (
    <div className="lp-attr-row" key={a.id}>
      <HolderOutlined className="drag" />
      <Input value={a.name} style={{ width:140 }}
        placeholder="为空时不展示属性名" onChange={e => onName(a.id, e.target.value)} />
      <Select value={a.source || undefined} placeholder="请选择数据源" style={{ flex:1 }}
        onChange={v => onSource(a.id, v)}
        options={(a.sources || NEW_SOURCES).map(s => ({ value:s, label:s }))} />
      <Button size="small" danger onClick={() => onRemove(a.id)}>删除</Button>
    </div>
  ));
}

function PreviewCard({ attrs, itemNo }) {
  return (
    <div className="lp-preview-card">
      <div className="pv-title">Description 区域预览</div>
      <div style={{ padding:'6px 0', fontSize:12, color:'#9CA3AF', borderBottom:'1px solid #F3F4F6', marginBottom:8 }}>
        jewelry item #: {itemNo}
      </div>
      {attrs.map(a => {
        if (a.type === 'sizeguide') {
          if (!a.enabled) return null;
          return (
            <div className="lp-preview-attr" key={a.id}>
              <span className="pv-label" style={{ color:'#7C3AED' }}>{a.name || 'Size'}</span>
              <span className="pv-val"><a style={{ color:'#7C3AED', textDecoration:'underline' }}>Size Guide</a></span>
            </div>
          );
        }
        if (a.name) {
          return (
            <div className="lp-preview-attr" key={a.id}>
              <span className="pv-label">{a.name}</span>
              <span className="pv-val">{a.sample}</span>
            </div>
          );
        }
        return (
          <div className="lp-preview-attr" key={a.id}>
            <span className="pv-val" style={{ color:'#9CA3AF', fontStyle:'italic' }}>{a.sample}（无属性名）</span>
          </div>
        );
      })}
    </div>
  );
}

/* ========== 弹窗:编辑属性展示规则 ========== */
function AttrEditModal({ open, onClose }) {
  const [attrs, setAttrs] = useState(EDIT_INIT);
  const seq = React.useRef(100);

  const onName = (id, name) => setAttrs(p => p.map(a => a.id === id ? { ...a, name } : a));
  const onSource = (id, source) => setAttrs(p => p.map(a => a.id === id ? { ...a, source } : a));
  const onRemove = (id) => setAttrs(p => p.filter(a => a.id !== id));
  const onToggleSG = (id, enabled) => setAttrs(p => p.map(a => a.id === id ? { ...a, enabled } : a));
  const addAttr = () => {
    const nid = 'n' + (seq.current++);
    setAttrs(p => [...p, { id:nid, type:'attr', name:'', source:'', sample:'', sources:NEW_SOURCES }]);

  const attrCount = attrs.filter(a => a.type === 'attr').length;
  const sgOn = attrs.find(a => a.type === 'sizeguide')?.enabled;

      </span>}
      footer={[
        <Button key="c" onClick={onClose}>取消</Button>,
        <Button key="s" onClick={onClose}>保存</Button>,
        <Button key="p" type="primary" onClick={onClose}>保存并发布</Button>,
      ]}>
      {/* 作用域(只读) */}
      <div className="lp-scope-box">
        <div style={{ fontSize:13, fontWeight:600, color:'#374151', marginBottom:10 }}>作用域</div>
        <div style={{ display:'flex', gap:12, alignItems:'flex-end', flexWrap:'wrap' }}>
          <div>
            <div style={{ fontSize:11, color:'#9CA3AF', marginBottom:4 }}>类目（必选）</div>
            <Select disabled value="Jewelry & Accessories" style={{ minWidth:180 }}
              options={[{ value:'Jewelry & Accessories', label:'Jewelry & Accessories' }]} />
          </div>
          <span className="lp-scope-arrow">&gt;</span>
          <div>
            <div style={{ fontSize:11, color:'#9CA3AF', marginBottom:4 }}>品牌（可选）</div>
            <Select disabled value="LOUIS VUITTON" style={{ minWidth:150 }}
              options={[{ value:'LOUIS VUITTON', label:'LOUIS VUITTON' }]} />
          </div>
          <span className="lp-scope-arrow">&gt;</span>
          <div>
            <div style={{ fontSize:11, color:'#9CA3AF', marginBottom:4 }}>系列（可选）</div>
            <Select disabled value="all" style={{ minWidth:150 }}
              options={[{ value:'all', label:'不限（品牌级规则）' }]} />
          </div>
        </div>
        <div style={{ marginTop:8, fontSize:12, color:'#6B7280' }}>
          当前作用域：<strong style={{ color:'#7C3AED' }}>Jewelry &amp; Accessories &gt; LOUIS VUITTON &gt; 全系列</strong>
        </div>
      </div>

      <div style={{ display:'flex', gap:16 }}>
        {/* 左:属性配置 */}
        <div style={{ flex:1, minWidth:0 }}>
          <div style={{ fontSize:13, fontWeight:600, color:'#374151', marginBottom:8 }}>属性配置</div>
          <Alert type="info" showIcon={false} style={{ marginBottom:12 }}
            message={<span style={{ fontSize:11, lineHeight:1.6 }}><strong>操作说明：</strong>先填写前台展示名（用户看到的属性名），再选择数据源（取哪个后台属性的值）。展示名进翻译模块输出多语言版本。</span>} />
          <div style={{ marginBottom:12 }}>
            <Tag style={{ background:'#F3EEFF', border:'1px solid #DDD6FE', color:'#7C3AED', borderRadius:6, padding:'2px 8px' }}>
              已配置 {attrCount} 个属性{sgOn ? ' + Size Guide' : ''}
            </Tag>
          </div>
          <div style={{ marginBottom:8, fontSize:11, color:'#9CA3AF', lineHeight:1.5 }}>
            数据源可选范围：当前类目下的全部描述属性和销售属性
          </div>
          <div style={{ marginBottom:6, fontSize:11, fontWeight:600, color:'#9CA3AF', letterSpacing:'.3px' }}>
            已配置（拖拽调整展示顺序）
          </div>
          <AttrRows attrs={attrs} onName={onName} onSource={onSource} onRemove={onRemove} onToggleSG={onToggleSG} />
          <Button block onClick={addAttr} icon={<PlusOutlined />}
            style={{ marginTop:12, borderStyle:'dashed', color:'#7C3AED', borderColor:'#DDD6FE' }}>
            添加属性

        </div>

        {/* 右:前台预览 */}
        <div style={{ width:280, flexShrink:0 }}>
          <div style={{ fontSize:13, fontWeight:600, color:'#374151', marginBottom:8 }}>前台预览效果</div>

  const seq = React.useRef(100);
  const hasCat = !!cat;

  const onName = (id, name) => setAttrs(p => p.map(a => a.id === id ? { ...a, name } : a));
  const onSource = (id, source) => setAttrs(p => p.map(a => a.id === id ? { ...a, source } : a));
  const onRemove = (id) => setAttrs(p => p.filter(a => a.id !== id));
  const onToggleSG = (id, enabled) => setAttrs(p => p.map(a => a.id === id ? { ...a, enabled } : a));
  const addAttr = () => {
    const nid = 'n' + (seq.current++);
    setAttrs(p => [...p, { id:nid, type:'attr', name:'', source:'', sample:'', sources:NEW_SOURCES }]);
  };
  const handleClose = () => { setCat(undefined); setAttrs([{ id:'sg', type:'sizeguide', name:'Size', enabled:true }]); onClose(); };

  return (
    <Modal open={open} onCancel={handleClose} closable={false} maskClosable={false} centered width={920}
      title="新增属性展示规则"
      footer={[
        <Button key="c" onClick={handleClose}>取消</Button>,
        <Button key="s" disabled={!hasCat} onClick={handleClose}>保存</Button>,
        <Button key="p" type="primary" disabled={!hasCat} onClick={handleClose}>保存并发布</Button>,
      ]}>
      {/* 作用域(可编辑) */}
      <div className="lp-scope-box">
        <div style={{ fontSize:13, fontWeight:600, color:'#374151', marginBottom:10 }}>作用域</div>
        <div style={{ display:'flex', gap:12, alignItems:'flex-end', flexWrap:'wrap' }}>
          <div>
            <div style={{ fontSize:11, color:'#9CA3AF', marginBottom:4 }}>类目（必选）</div>

              { value:'Jewelry & Accessories', label:'Jewelry & Accessories' },
              { value:'Bags', label:'Bags' },
              { value:'Electronics', label:'Electronics' },
            ]} />
          </div>
          <span className="lp-scope-arrow">&gt;</span>
          <div>
            <div style={{ fontSize:11, color:'#9CA3AF', marginBottom:4 }}>品牌（可选）</div>
            <Select defaultValue="all" style={{ minWidth:150 }} options={[

              { value:'lv', label:'LOUIS VUITTON' },

          <span className="lp-scope-arrow">&gt;</span>
          <div>
            <div style={{ fontSize:11, color:'#9CA3AF', marginBottom:4 }}>系列（可选）</div>
            <Select defaultValue="all" style={{ minWidth:150 }} options={[{ value:'all', label:'不限' }]} />

        </div>
        {!hasCat && <div style={{ marginTop:8, fontSize:12, color:'#D97706' }}>请先选择类目，选择后加载该类目下可用的后台属性</div>}
      </div>

      {/* 状态切换:未选类目 vs 已选类目 */}
      {!hasCat ? (
        <div style={{ padding:40, textAlign:'center', border:'1px dashed #D1D5DB', borderRadius:10, color:'#9CA3AF' }}>
          <div style={{ fontSize:14, marginBottom:6 }}>请先选择作用域</div>
          <div style={{ fontSize:12 }}>选择类目后，可添加属性并配置展示名和数据源</div>
        </div>
      ) : (
        <div style={{ display:'flex', gap:16 }}>
          <div style={{ flex:1, minWidth:0 }}>
            <div style={{ marginBottom:8 }}>
              <Tag style={{ background:'#F3EEFF', border:'1px solid #DDD6FE', color:'#7C3AED', borderRadius:6, padding:'2px 8px' }}>

/* ========== 弹窗:删除规则确认(含影响范围预览) ========== */
function DeleteConfirmModal({ rule, onClose }) {
  const open = !!rule;
  const scope = rule ? rule.scope : '';
  return (
    <Modal open={open} onCancel={onClose} closable={false} maskClosable={false} centered width={460}
      title="确认删除规则"
      footer={[
        <Button key="c" onClick={onClose}>取消</Button>,
        <Button key="d" danger onClick={onClose}>确认删除</Button>,
      ]}>
      <div style={{ display:'flex', gap:12, alignItems:'flex-start' }}>
        <ExclamationCircleOutlined style={{ color:'#DC2626', fontSize:24, marginTop:2, flexShrink:0 }} />
        <div>
          <div style={{ fontSize:14, fontWeight:600, color:'#1F2937', marginBottom:6 }}>
            确定要删除「{scope}」的属性展示规则吗？
          </div>
          <div style={{ fontSize:13, color:'#6B7280', lineHeight:1.7, marginBottom:12 }}>
            删除后，该规则下的所有属性配置将被清除，且不可恢复。
          </div>
          <Alert type="warning" showIcon={false}
            message={<span style={{ fontSize:12, lineHeight:1.6 }}>
              <strong>影响范围：</strong>以下 1 个子级当前继承此规则，删除后将回退到上一级兜底规则：
              <div style={{ marginTop:6, paddingLeft:12 }}>· {scope} &gt; CHANEL（当前继承 {scope} 类目级规则）</div>
            </span>} />
        </div>
      </div>
    </Modal>
  );
}

/* ========== App ========== */
const MENU_LABELS = { 'home-config':'首页配置', 'plp-config':'列表页配置', 'pdp-config':'商详页配置' };

function App() {
  const [activeKey, setActiveKey] = useState('pdp-config');
  const [editOpen, setEditOpen] = useState(false);
  const [newOpen, setNewOpen] = useState(false);
  const [delRule, setDelRule] = useState(null);

  const menuItems = [
    { key:'home-config', icon:<HomeOutlined />,      label:subLabel('首页配置', 'home-config', activeKey) },
    { key:'plp-config',  icon:<AppstoreOutlined />,  label:subLabel('列表页配置', 'plp-config', activeKey) },
    { key:'pdp-config',  icon:<FileTextOutlined />,  label:subLabel('商详页配置', 'pdp-config', activeKey) },
  ];

  return (
    <ConfigProvider theme={looplyTheme}>
      <Layout style={{ height:'100vh' }}>
        <Layout.Header style={{ borderBottom:'1px solid #E5E7EB', display:'flex', alignItems:'center' }}>
          <img src={LOGO_SRC} alt="Looply" style={{ height:32, display:'block' }} />
          <div style={{ width:1, height:20, background:'#E5E7EB', margin:'0 16px' }} />
          <span style={{ fontSize:14, fontWeight:500, color:'#6B7280' }}>CMS 管理系统</span>
          <span style={{ marginLeft:'auto', color:'#9CA3AF', fontSize:13 }}>{MENU_LABELS[activeKey]}</span>
        </Layout.Header>
        <Layout>
          <Layout.Sider width={220} theme="light" style={SIDER_STYLE}>
            <Menu mode="inline" items={menuItems} selectedKeys={[activeKey]}
              style={{ borderInlineEnd:'none' }} onClick={({ key }) => setActiveKey(key)} />
          </Layout.Sider>
          <Layout.Content style={{ padding:28, overflow:'auto' }}>
            {activeKey === 'pdp-config' && (
              <PdpConfigPage
                onNew={() => setNewOpen(true)}
                onEdit={() => setEditOpen(true)}
                onDelete={(r) => setDelRule(r)} />
            )}
            {activeKey === 'plp-config' && (
              <PlaceholderPage title="列表页配置" desc="管理商品列表页的布局和筛选配置（待建设）。" />
            )}
            {activeKey === 'home-config' && (
              <PlaceholderPage title="首页配置" desc="管理首页模块和内容配置（待建设）。" />

        </Layout>
      </Layout>

      <AttrEditModal open={editOpen} onClose={() => setEditOpen(false)} />
      <AttrNewModal open={newOpen} onClose={() => setNewOpen(false)} />
      <DeleteConfirmModal rule={delRule} onClose={() => setDelRule(null)} />
    </ConfigProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
