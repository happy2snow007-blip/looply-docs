<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Looply 商详页CMS配置后台原型 V2 — antd</title>

<script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/dayjs@1.11.21/dayjs.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/antd@6.4.3/dist/antd.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/@ant-design/icons@6.2.1/dist/index.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.28.4/babel.min.js"></script>

<style>
html,body,#root{height:100%;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F9FAFB;color:#1F2937}
#root::before{content:'正在加载 antd 原型……';position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#9CA3AF;font-size:14px}
#root:not(:empty)::before{display:none}

.lp-kpi{background:linear-gradient(180deg,#FEFCFF 0%,#F3EEFF 100%);border:1px solid #DDD6FE;border-radius:14px;padding:14px 16px}
.lp-kpi .num{font-size:24px;font-weight:700;color:#7C3AED;line-height:1;margin-bottom:6px;font-variant-numeric:tabular-nums}
.lp-kpi .label{font-size:12px;color:#6B7280}
.lp-pagination{display:flex;align-items:center;justify-content:center;gap:24px;padding:12px 16px;font-size:13px;color:#6B7280}
.lp-pagination .divider{width:1px;height:20px;background:#E5E7EB}
.lp-tip-trigger{cursor:help;border-bottom:1px dashed #9CA3AF;padding-bottom:1px}
.lp-note{padding:14px;border-radius:10px;background:#F3EEFF;border:1px solid #DDD6FE;color:#6D28D9;font-size:12px;line-height:1.8}
.lp-note-sm{padding:10px 14px;background:#F3EEFF;border:1px solid #DDD6FE;border-radius:8px;font-size:12px;color:#6D28D9}
.lp-section-purple{font-size:14px;font-weight:700;color:#7C3AED;margin:0 0 12px}
.lp-section{font-size:15px;font-weight:600;color:#1F2937;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid #E5E7EB}

/* 商详页 CMS 配置专用 */
.lp-module-panel{border:1px solid #E5E7EB;border-radius:14px;background:#fff;padding:14px}
.lp-module-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #7C3AED;background:#F3EEFF;border-radius:10px;cursor:pointer;margin-bottom:8px}
.lp-module-item-off{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #E5E7EB;background:#fff;border-radius:10px;cursor:pointer;margin-bottom:8px;transition:border-color .15s,background .15s}
.lp-module-item-off:hover{border-color:#DDD6FE;background:#FAF5FF}
.lp-config-panel{border:1px solid #E5E7EB;border-radius:14px;background:#fff;padding:20px;min-height:520px}
.lp-config-panel-title{font-size:15px;font-weight:700;color:#1F2937;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid #E5E7EB;display:flex;justify-content:space-between;align-items:center;gap:12px}
.lp-attr-row{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid #DDD6FE;background:#FAF5FF;border-radius:8px;margin-bottom:6px}
.lp-attr-row .drag{color:#9CA3AF;cursor:grab;font-size:14px;flex-shrink:0}
.lp-scope-box{padding:14px;background:#F9FAFB;border:1px solid #E5E7EB;border-radius:10px;margin-bottom:18px}
.lp-scope-arrow{color:#D1D5DB;font-size:18px;align-self:flex-end;padding-bottom:6px}
.lp-preview-card{border:1px solid #E5E7EB;border-radius:10px;padding:16px;background:#FAFAFA}
.lp-preview-card .pv-title{font-size:12px;font-weight:600;color:#6B7280;margin-bottom:12px;letter-spacing:.3px}
.lp-preview-attr{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid #F3F4F6;font-size:13px}
.lp-preview-attr:last-child{border-bottom:none}
.lp-preview-attr .pv-label{color:#6B7280}
.lp-preview-attr .pv-val{color:#1F2937;font-weight:500}

/* Trust Statement 信任声明 */
.lp-trust-item{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border:1px solid #E5E7EB;border-radius:8px;margin-bottom:6px;background:#FAFAFA}
.lp-trust-preview{border:1px solid #E5E7EB;border-radius:10px;padding:16px;background:#FAFAFA}
.lp-trust-preview-item{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:12px;color:#374151}

/* Condition 成色配置 */
.lp-grade-row{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid #DDD6FE;background:#FAF5FF;border-radius:8px;margin-bottom:6px}
.lp-grade-row .drag{color:#9CA3AF;cursor:grab;font-size:14px;flex-shrink:0}
.lp-progress-preview{padding:16px;border:1px solid #E5E7EB;border-radius:10px;background:#FAFAFA}
.lp-progress-bar{height:6px;background:#E5E7EB;border-radius:3px;position:relative;margin:16px 0 8px}
.lp-progress-fill{height:100%;background:linear-gradient(90deg,#7C3AED,#A78BFA);border-radius:3px}
.lp-grade-labels{display:flex;justify-content:space-between;font-size:10px;color:#9CA3AF}
.lp-guide-row{padding:12px 14px;border:1px solid #E5E7EB;border-radius:8px;margin-bottom:8px;background:#FAFAFA}

:focus-visible{outline:none;box-shadow:inset 0 0 0 2px rgba(124,58,237,.4)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

/* ========== Description 属性行(含 Size Guide 开关) ========== */
function AttrRows({ attrs, onName, onSource, onRemove, onToggleSG, onReorder }) {
  const [dragId, setDragId] = React.useState(null);
  const [overId, setOverId] = React.useState(null);

  const onDragStart = (e, id) => { setDragId(id); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', id); };
  const onDragOver = (e, id) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; if (id !== dragId) setOverId(id); };
  const onDrop = (e, id) => { e.preventDefault(); if (dragId && dragId !== id && onReorder) onReorder(dragId, id); setDragId(null); setOverId(null); };
  const onDragEnd = () => { setDragId(null); setOverId(null); };

  return attrs.map(a => {
    const isDragging = dragId === a.id;
    const isOver = overId === a.id && dragId !== a.id;
    const dragProps = { draggable:true, onDragStart:e => onDragStart(e, a.id), onDragOver:e => onDragOver(e, a.id), onDrop:e => onDrop(e, a.id), onDragEnd };
    const dropStyle = isOver ? { borderTopColor:'#7C3AED', borderTopWidth:2 } : {};

    return a.type === 'sizeguide' ? (
      <div className="lp-attr-row" key={a.id} {...dragProps}
        style={{ opacity: isDragging ? 0.35 : (a.enabled ? 1 : 0.45), transition:'opacity .15s', ...dropStyle }}>
        <HolderOutlined className="drag" />
        <Input value={a.name} disabled={!a.enabled} style={{ width:140 }}
          placeholder="为空时不展示属性名" onChange={e => onName(a.id, e.target.value)} />
        <Select disabled value="尺码指南（固定模块）" style={{ flex:1 }}
          options={[{ value:'尺码指南（固定模块）', label:'尺码指南（固定模块）' }]} />
        <Switch size="small" checked={a.enabled} onChange={v => onToggleSG(a.id, v)} />
      </div>
    ) : (
      <div className="lp-attr-row" key={a.id} {...dragProps}
        style={{ opacity: isDragging ? 0.35 : 1, transition:'opacity .15s', ...dropStyle }}>
        <HolderOutlined className="drag" />
        <Input value={a.name} style={{ width:140 }}
          placeholder="展示名" onChange={e => onName(a.id, e.target.value)} />
        <Select value={a.source || undefined} placeholder="请选择数据源" style={{ flex:1 }}
          onChange={v => onSource(a.id, v)}
          options={(a.sources || NEW_SOURCES).map(s => ({ value:s, label:s }))} />
        <Button size="small" danger onClick={() => onRemove(a.id)}>删除</Button>
      </div>
    );
  });
}

function ConditionEditModal({ open, isNew, onClose }) {
  const [cat, setCat] = useState(isNew ? undefined : 'Luxury (Jewelry, Bags, Watches)');
  const [grades, setGrades] = useState(isNew ? [] : CONDITION_GRADES_INIT);
  const [guideItems, setGuideItems] = useState(isNew ? [] : CONDITION_GUIDE_INIT);
  const [activeTab, setActiveTab] = useState('grades');
  const seq = React.useRef(300);
  const hasCat = !!cat;

  const addGrade = () => {
    const nid = 'g' + (seq.current++);
    setGrades(p => [...p, { id:nid, name:'', desc:'', progress:0 }]);
    setGuideItems(p => [...p, { id:'cg' + seq.current, grade:'', text:'' }]);
  };
  const removeGrade = (id) => {
    const idx = grades.findIndex(g => g.id === id);
    setGrades(p => p.filter(g => g.id !== id));
    if (idx >= 0 && idx < guideItems.length) {
      setGuideItems(p => p.filter((_, i) => i !== idx));
    }
  };
  const onGradeName = (id, name) => {
    const idx = grades.findIndex(g => g.id === id);
    setGrades(p => p.map(g => g.id === id ? { ...g, name } : g));
    if (idx >= 0 && idx < guideItems.length) {
      setGuideItems(p => p.map((item, i) => i === idx ? { ...item, grade:name } : item));
    }
  };
  const onGradeDesc = (id, desc) => setGrades(p => p.map(g => g.id === id ? { ...g, desc } : g));
  const onGradeProgress = (id, progress) => setGrades(p => p.map(g => g.id === id ? { ...g, progress } : g));
  const onGuideText = (id, text) => setGuideItems(p => p.map(g => g.id === id ? { ...g, text } : g));

  const handleClose = () => {
    if (isNew) { setCat(undefined); setGrades([]); setGuideItems([]); }
    setActiveTab('grades');
    onClose();
  };

  const gradeReorder = (fromId, toId) => {
    setGrades(p => {
      const arr = [...p]; const fi = arr.findIndex(a => a.id === fromId); const ti = arr.findIndex(a => a.id === toId);
      const [moved] = arr.splice(fi, 1); arr.splice(ti, 0, moved); return arr;
    });
  };

  const tabItems = [
    { key:'grades', label:'等级枚举',
      children: (
        <div style={{ display:'flex', gap:16 }}>
          <div style={{ flex:1, minWidth:0 }}>
            <div style={{ marginBottom:8, fontSize:11, color:'#9CA3AF' }}>
              定义品类的成色等级，从高到低排列。每个等级包含名称、描述和进度条位置（百分比）。
            </div>
            <div style={{ marginBottom:6, fontSize:11, fontWeight:600, color:'#9CA3AF' }}>
              等级列表（从高到低排列）
            </div>
            {grades.map(g => (
              <div className="lp-grade-row" key={g.id}>
                <HolderOutlined className="drag" />
                <Input value={g.name} onChange={e => onGradeName(g.id, e.target.value)}
                  placeholder="等级名称" style={{ width:120 }} />
                <Input value={g.desc} onChange={e => onGradeDesc(g.id, e.target.value)}
                  placeholder="等级描述" style={{ flex:1 }} />
                <InputNumber value={g.progress} onChange={v => onGradeProgress(g.id, v)}
                  min={0} max={100} formatter={v => v + '%'}
                  parser={v => v.replace('%', '')}
                  style={{ width:80 }} />
                <Button size="small" danger icon={<DeleteOutlined />}
                  onClick={() => removeGrade(g.id)} />
              </div>
            ))}
            <Button block onClick={addGrade} icon={<PlusOutlined />}
              style={{ marginTop:8, borderStyle:'dashed', color:'#7C3AED', borderColor:'#DDD6FE' }}>
              添加等级
            </Button>
          </div>
          <div style={{ width:280, flexShrink:0 }}>
            <ConditionPreviewCard grades={grades} activeGrade={grades[1] ? grades[1].name : (grades[0] ? grades[0].name : '')} />
          </div>
        </div>
      ),
    },
    { key:'guide', label:'成色指南',
      children: (
        <div style={{ display:'flex', gap:16 }}>
          <div style={{ flex:1, minWidth:0 }}>
            <div style={{ marginBottom:8, fontSize:11, color:'#9CA3AF' }}>
              为每个等级配置详细的成色指南说明文案，展示在 Condition Guide 弹窗中。
            </div>
            {guideItems.map(item => (
              <div className="lp-guide-row" key={item.id}>
                <div style={{ fontSize:12, fontWeight:600, color:'#7C3AED', marginBottom:6 }}>
                  {item.grade || '(等级名称)'}
                </div>
                <Input.TextArea value={item.text} onChange={e => onGuideText(item.id, e.target.value)}
                  placeholder="该等级的详细说明文案"
                  autoSize={{ minRows:2, maxRows:4 }} />
              </div>
            ))}
            {guideItems.length === 0 && (
              <div style={{ padding:30, textAlign:'center', border:'1px dashed #D1D5DB', borderRadius:10, color:'#9CA3AF', fontSize:12 }}>
                请先在「等级枚举」标签页中添加等级
              </div>
            )}
          </div>
          <div style={{ width:280, flexShrink:0 }}>
            <ConditionGuidePreviewCard guideItems={guideItems} />
          </div>
        </div>
      ),
    },
  ];

  return (
    <Modal open={open} onCancel={handleClose} closable={false} maskClosable={false} centered width={1020}
      title={isNew ? '新增成色配置规则' : '编辑成色配置规则'}
      footer={[
        <Button key="c" onClick={handleClose}>取消</Button>,
        <Button key="s" type="primary" disabled={isNew && !hasCat} onClick={handleClose}>保存</Button>,
      ]}>
      <div className="lp-scope-box">
        <div style={{ fontSize:13, fontWeight:600, color:'#374151', marginBottom:10 }}>作用域</div>
        <div>
          <div style={{ fontSize:11, color:'#9CA3AF', marginBottom:4 }}>品类（必选）</div>
          <Select placeholder="请选择品类" value={cat} onChange={setCat}
            disabled={!isNew} style={{ minWidth:280 }} options={[
            { value:'Luxury (Jewelry, Bags, Watches)', label:'Luxury (Jewelry, Bags, Watches)' },
            { value:'Electronics', label:'Electronics' },
            { value:'Apparel', label:'Apparel' },
          ]} />
        </div>
        {isNew && !hasCat && <div style={{ marginTop:8, fontSize:12, color:'#D97706' }}>请先选择品类</div>}
      </div>

      {(!isNew || hasCat) && (
        <Tabs activeKey={activeTab} onChange={setActiveTab} items={tabItems} />
      )}
    </Modal>
  );
}

            ))}
            <Alert type="warning" showIcon={false} style={{ marginTop:4 }}
              message={<span style={{ fontSize:11, lineHeight:1.6 }}>仅展示有 CMS 配置项的模块。Breadcrumb、Gallery、商品信息区等固定模块无需配置。</span>} />
          </div>
        </div>

        {/* 右：配置面板 */}
        <div style={{ flex:1, minWidth:0 }}>
          {activeModule === 'description' && <DescriptionPanel />}
          {activeModule === 'trust' && <TrustPanel />}
          {activeModule === 'condition' && <ConditionPanel />}
        </div>
      </div>
    </Card>

    <Drawer title="配置变更记录" open={opLogOpen} onClose={() => setOpLogOpen(false)} width={780}
      styles={{ body:{ padding:'16px 24px' } }}>
      <div style={{ fontSize:12, color:'#9CA3AF', marginBottom:14 }}>记录所有模块的配置变更操作，包括规则新增、编辑、删除及模块开关变更。</div>
      <Table rowKey="key" dataSource={OPLOG_DATA} columns={OPLOG_COLUMNS}
        pagination={false} size="small" styles={TABLE_STYLES} />
    </Drawer>
    </>
  );
}

/* ========== 页面：待建设占位 ========== */
function PlaceholderPage({ title, desc }) {
  return (
    <Card style={CARD_STYLE}>
      <div style={{ marginBottom:18 }}>
        <div style={{ fontSize:20, fontWeight:700, marginBottom:6 }}>{title}</div>
        <div style={{ color:'#6B7280', fontSize:13 }}>{desc}</div>
      </div>
      <Result icon={<ToolOutlined style={{ color:'#9CA3AF' }} />} title="功能建设中"
        subTitle="该模块正在规划中，敬请期待。" />
    </Card>
  );
}

/* ========== App ========== */
const MENU_LABELS = { 'home-config':'首页配置', 'plp-config':'列表页配置', 'pdp-config':'商详页配置' };

function App() {
  const [activeKey, setActiveKey] = useState('pdp-config');

  const menuItems = [
    { key:'home-config', icon:<HomeOutlined />,      label:subLabel('首页配置', 'home-config', activeKey) },
    { key:'plp-config',  icon:<AppstoreOutlined />,  label:subLabel('列表页配置', 'plp-config', activeKey) },
    { key:'pdp-config',  icon:<FileTextOutlined />,  label:subLabel('商详页配置', 'pdp-config', activeKey) },
  ];

  return (
    <ConfigProvider theme={looplyTheme}>
      <Layout style={{ height:'100vh' }}>
        <Layout.Header style={{ borderBottom:'1px solid #E5E7EB', display:'flex', alignItems:'center' }}>
          <img src={LOGO_SRC} alt="Looply" style={{ height:32, display:'block' }} />
          <div style={{ width:1, height:20, background:'#E5E7EB', margin:'0 16px' }} />
          <span style={{ fontSize:14, fontWeight:500, color:'#6B7280' }}>CMS 管理系统</span>
          <span style={{ marginLeft:'auto', color:'#9CA3AF', fontSize:13 }}>{MENU_LABELS[activeKey]}</span>
        </Layout.Header>
        <Layout>
          <Layout.Sider width={220} theme="light" style={SIDER_STYLE}>
            <Menu mode="inline" items={menuItems} selectedKeys={[activeKey]}
              style={{ borderInlineEnd:'none' }} onClick={({ key }) => setActiveKey(key)} />
          </Layout.Sider>
          <Layout.Content style={{ padding:28, overflow:'auto' }}>
            {activeKey === 'pdp-config' && <PdpConfigPage />}
            {activeKey === 'plp-config' && (
              <PlaceholderPage title="列表页配置" desc="管理商品列表页的布局和筛选配置（待建设）。" />
            )}
            {activeKey === 'home-config' && (
              <PlaceholderPage title="首页配置" desc="管理首页模块和内容配置（待建设）。" />
            )}
          </Layout.Content>
        </Layout>
      </Layout>
    </ConfigProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
