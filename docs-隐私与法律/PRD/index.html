<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Looply PRD - 隐私与法律 PRD</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#28282d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.7}.topbar{position:sticky;top:0;z-index:2;height:52px;padding:0 24px;display:flex;align-items:center;gap:10px;background:#fff;border-bottom:1px solid #e5e7eb}.brand{font-weight:800;color:#222;text-decoration:none}.title{font-weight:650}.tag{padding:2px 9px;border-radius:999px;background:#eee9ff;color:#6337ed;font-size:12px}.download{margin-left:auto;color:#6337ed;text-decoration:none;font-size:13px}.layout{max-width:1180px;margin:auto;display:grid;grid-template-columns:240px minmax(0,1fr)}.toc{position:sticky;top:52px;height:calc(100vh - 52px);overflow:auto;padding:28px 18px;background:#fff;border-right:1px solid #e5e7eb}.toc a{display:block;padding:4px 7px;color:#62626a;text-decoration:none;font-size:13px;border-radius:5px}.toc a:hover{background:#f0edff;color:#6337ed}.toc .h3{padding-left:20px;font-size:12px}.article{margin:32px;padding:40px 50px;max-width:850px;background:#fff;border-radius:12px;box-shadow:0 8px 30px rgba(20,20,30,.06)}h1{font-size:28px;border-bottom:2px solid #6337ed;padding-bottom:10px}h2{margin-top:32px}h3{margin-top:25px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 10px;border:1px solid #e5e7eb;text-align:left}th{background:#f7f7fa}code{background:#f1f2f5;padding:2px 5px;border-radius:4px}blockquote{margin-left:0;padding:8px 16px;border-left:3px solid #6337ed;background:#f8f7ff}.error{color:#b42318}@media(max-width:760px){.layout{display:block}.toc{display:none}.article{margin:12px;padding:22px 18px}.topbar{padding:0 14px}.download{display:none}}
  </style>
</head>
<body>
  <header class="topbar"><a class="brand" href="../../index.html">Looply</a><span>/</span><span class="title">隐私与法律 PRD</span><span class="tag">v0.1</span><a class="download" href="latest.md" download>下载 Markdown</a></header>
  <main class="layout"><nav class="toc" id="toc"></nav><article class="article" id="article">加载中…</article></main>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    fetch('latest.md',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('PRD 加载失败');return r.text()}).then(md=>{const article=document.querySelector('#article');article.innerHTML=marked.parse(md);const toc=document.querySelector('#toc');article.querySelectorAll('h2,h3').forEach((h,i)=>{h.id='section-'+i;const a=document.createElement('a');a.href='#'+h.id;a.textContent=h.textContent;a.className=h.tagName==='H3'?'h3':'';toc.append(a)})}).catch(e=>{document.querySelector('#article').innerHTML='<p class="error">'+e.message+'，请下载 Markdown 查看。</p>'});
  </script>
</body>
</html>
