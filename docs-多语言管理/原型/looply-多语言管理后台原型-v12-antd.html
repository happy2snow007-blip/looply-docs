<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Looply · 多语言管理后台原型 v11 (antd)</title>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/dayjs@1.11.21/dayjs.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/antd@6.4.3/dist/antd.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/@ant-design/icons@6.2.1/dist/index.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.28.4/babel.min.js"></script>
<style>
/* 基础:加载占位、平台字体 */
html,body,#root{height:100%;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F9FAFB;color:#1F2937}
#root::before{content:'正在加载 antd 原型……';position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#9CA3AF;font-size:14px}
#root:not(:empty)::before{display:none}

/* KPI 卡片 */
.lp-kpi{background:linear-gradient(180deg,#FEFCFF 0%,#F3EEFF 100%);border:1px solid #DDD6FE;border-radius:14px;padding:14px 16px}
.lp-kpi .num{font-size:24px;font-weight:700;color:#7C3AED;line-height:1;margin-bottom:6px;font-variant-numeric:tabular-nums}
.lp-kpi .label{font-size:12px;color:#6B7280}

/* 紧凑分页器 */
.lp-pagination{display:flex;align-items:center;justify-content:center;gap:24px;padding:12px 16px;font-size:13px;color:#6B7280}
.lp-pagination .divider{width:1px;height:20px;background:#E5E7EB}

/* 字段提示:虚线下划线 */
.lp-tip-trigger{cursor:help;border-bottom:1px dashed #9CA3AF;padding-bottom:1px}

/* 紫色提示条 */
.lp-note{padding:14px;border-radius:10px;background:#F3EEFF;border:1px solid #DDD6FE;color:#6D28D9;font-size:12px;line-height:1.8}
.lp-note-sm{padding:10px 14px;background:#F3EEFF;border:1px solid #DDD6FE;border-radius:8px;font-size:12px;color:#6D28D9}

/* 区块小节标题 */
.lp-section-purple{font-size:14px;font-weight:700;color:#7C3AED;margin:0 0 12px}
.lp-section{font-size:15px;font-weight:600;color:#1F2937;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid #E5E7EB}
.lp-oplog-title{font-size:14px;font-weight:700;color:#7C3AED;margin:24px 0 12px}

/* 空态 */
.lp-empty{display:flex;flex-direction:column;align-items:center;padding:60px 20px;text-align:center}
.lp-empty .icon{font-size:48px;margin-bottom:16px;color:#9CA3AF}
.lp-empty .icon.err{color:#DC2626}
.lp-empty .title{font-size:16px;font-weight:600;color:#1F2937;margin-bottom:8px}
.lp-empty .desc{font-size:13px;color:#6B7280;margin-bottom:24px;max-width:360px}

/* 表单字段行 */
.lp-form-row{display:flex;gap:16px;margin-bottom:12px;align-items:flex-start}
.lp-form-row:first-of-type{margin-top:8px}
.lp-form-row .lp-form-label{width:96px;text-align:right;color:#6B7280;font-size:13px;flex-shrink:0;padding-top:7px}
.lp-form-row .lp-form-label .req{color:#DC2626;margin-right:4px}
.lp-form-row .lp-form-control{flex:1;min-width:0}
.lp-helper{font-size:12px;color:#9CA3AF;margin:-4px 0 12px 112px}

/* 详情 detail grid */
.lp-detail{display:grid;grid-template-columns:120px 1fr;gap:10px 16px;font-size:13px;margin-bottom:24px}
.lp-detail .dl{color:#6B7280}
.lp-detail .dv{color:#1F2937}

/* Code 样式 */
.lp-code{font-family:Menlo,Monaco,Consolas,monospace;font-size:12px;color:#374151;background:#F3F4F6;padding:1px 6px;border-radius:4px}

/* ── Translation导航页:KPI + 筛选Tab + 卡片网格 ── */
.lp-nav-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
.lp-nav-title{font-size:20px;font-weight:700;color:#1F2937;margin-bottom:4px}
.lp-nav-subtitle{font-size:13px;color:#6B7280}
.lp-nav-actions{display:flex;align-items:center;gap:10px}
.lp-kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.lp-kpi-card{background:#fff;border:1px solid #E5E7EB;border-radius:12px;padding:16px 18px;transition:box-shadow .18s}
.lp-kpi-card:hover{box-shadow:0 4px 12px rgba(0,0,0,.06)}
.lp-kpi-num{font-size:24px;font-weight:700;color:#1F2937;margin-bottom:2px}
.lp-kpi-label{font-size:12px;color:#6B7280}
.lp-kpi-sub{font-size:11px;color:#9CA3AF;margin-top:2px}
.lp-filter-bar{display:flex;align-items:center;gap:0;margin-bottom:18px;border-bottom:1px solid #E5E7EB}
.lp-filter-tab{padding:10px 16px;font-size:13px;font-weight:500;color:#6B7280;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.lp-filter-tab:hover{color:#374151}
.lp-filter-tab.active{color:#7C3AED;border-bottom-color:#7C3AED}
.lp-filter-tab .tab-count{margin-left:4px;font-size:11px;opacity:.7}
.lp-view-toggle{margin-left:auto;display:flex;gap:4px;padding-bottom:8px}
.lp-card-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.lp-res-card{background:#fff;border:1px solid #E5E7EB;border-radius:12px;padding:14px 16px;cursor:pointer;transition:all .2s cubic-bezier(.4,0,.2,1)}
.lp-res-card:hover{border-color:#D4B5FF;box-shadow:0 6px 16px rgba(124,58,237,.08);transform:translateY(-2px)}
.lp-res-card.placeholder{border-style:dashed;opacity:.75}
.lp-res-card.placeholder:hover{transform:none;box-shadow:none;border-color:#D1D5DB}
.lp-res-card-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.lp-res-card-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.lp-res-card-name{font-size:14px;font-weight:600;color:#1F2937}
.lp-res-card-badge{font-size:10px;padding:2px 8px;border-radius:10px;white-space:nowrap;font-weight:500;margin-left:auto}
.lp-res-card-entity{font-size:11px;font-family:Menlo,Monaco,Consolas,monospace;color:#9CA3AF;background:#F3F4F6;padding:1px 6px;border-radius:4px;margin-bottom:8px;display:inline-block}
.lp-res-card-desc{font-size:12px;color:#6B7280;margin-bottom:10px;line-height:1.4;min-height:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lp-res-card-progress{margin-bottom:8px}
.lp-res-card-progress-text{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#6B7280;margin-bottom:5px}
.lp-res-card-progress-pct{font-weight:600;color:#7C3AED}
.lp-res-card-fields{border-top:1px solid #F3F4F6;padding-top:10px;margin-bottom:10px}
.lp-res-card-fields-title{font-size:11px;color:#9CA3AF;margin-bottom:6px}
.lp-res-card-field-item{font-size:12px;color:#374151;padding:2px 0;display:flex;align-items:center;gap:5px}
.lp-res-card-field-item .check-icon{color:#16A34A;font-size:11px}
.lp-res-card-footer{display:flex;align-items:center;justify-content:space-between;padding-top:8px;border-top:1px solid #F3F4F6}
.lp-res-card-footer span{font-size:12px;color:#7C3AED;font-weight:500}
.lp-res-card-footer .arrow{font-size:11px;color:#7C3AED;transition:transform .15s}
.lp-res-card:hover .lp-res-card-footer .arrow{transform:translateX(3px)}
.lp-bottom-bar{display:flex;align-items:center;gap:16px;margin-top:24px;padding:14px 18px;background:#FAFAFB;border-radius:12px;border:1px solid #F3F4F6}
.lp-bottom-bar-item{font-size:12px;color:#6B7280;display:flex;align-items:center;gap:6px}
.lp-bottom-bar-item .dot{width:7px;height:7px;border-radius:50%}
.ph-badge{font-size:11px;padding:1px 7px;border-radius:10px;background:#F3F4F6;color:#9CA3AF;white-space:nowrap}
.ready-badge{font-size:11px;padding:1px 7px;border-radius:10px;background:#F0FDF4;color:#16A34A;white-space:nowrap}
.partial-badge{font-size:11px;padding:1px 7px;border-radius:10px;background:#FFF7ED;color:#EA580C;white-space:nowrap}

/* ── 翻译主从分栏页 ── */
.master-wrap{display:flex;gap:0;height:600px;border:1px solid #E5E7EB;border-radius:14px;overflow:hidden}
.master-left{width:300px;flex-shrink:0;border-right:1px solid #E5E7EB;display:flex;flex-direction:column;background:#fff}
.master-left-head{padding:12px;border-bottom:1px solid #F3F4F6}
.master-left-list{flex:1;overflow-y:auto}
.master-left-foot{padding:10px 14px;border-top:1px solid #E5E7EB;font-size:12px;color:#9CA3AF;text-align:center}
.res-item{padding:11px 14px;border-bottom:1px solid #F3F4F6;cursor:pointer;transition:background .15s;border-left:3px solid transparent}
.res-item:hover{background:#FAF5FF}
.res-item.active{background:#F3EEFF;border-left-color:#7C3AED}
.res-item .res-id{font-size:11px;color:#9CA3AF;font-family:Menlo,Monaco,Consolas,monospace;margin-bottom:3px}
.res-item .res-name{font-size:13px;color:#1F2937;font-weight:500;margin-bottom:7px;line-height:1.3}
.master-right{flex:1;overflow-y:auto;padding:18px;background:#FAFAFB}
.field-card{border:1px solid #E5E7EB;border-radius:12px;padding:14px;margin-bottom:14px;background:#fff}
.field-card.outdated{border-color:#F59E0B}
.field-card-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.field-card-name{font-size:13px;font-weight:600;color:#1F2937}
.field-card-key{font-size:11px;color:#9CA3AF;font-family:Menlo,Monaco,Consolas,monospace}
.field-card-body{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field-col-label{font-size:11px;color:#6B7280;margin-bottom:6px}
.field-src{font-size:13px;color:#374151;line-height:1.6;background:#F9FAFB;border:1px solid #F3F4F6;border-radius:8px;padding:8px 10px;min-height:38px}

/* 键盘焦点态 + 减弱动效(a11y 硬性) */
:focus-visible{outline:none;box-shadow:inset 0 0 0 2px rgba(124,58,237,.4)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

function CompactPagination({ total, current=1, pageSize=10, totalPages }) {
  const tp = totalPages || Math.ceil(total / pageSize) || 1;
  const pages = React.useMemo(() => {
    const out = [{ k:'prev', label:'<', disabled:current===1, arrow:true }];
    if (tp <= 6) for (let i=1; i<=tp; i++) out.push({ k:i, label:i });
    else { out.push({k:1,label:1}); out.push({k:2,label:2}); out.push({k:3,label:3}); out.push({k:'gap',label:'…',disabled:true}); out.push({k:tp,label:tp}); }
    out.push({ k:'next', label:'>', disabled:current===tp, arrow:true });
    return out;
  }, [current, tp]);
  return (
    <div className="lp-pagination">
      <span>共 {total.toLocaleString()} 条,每页{' '}
        <Select size="small" value={pageSize} style={{ width:72, marginInline:4 }}
          options={[{value:10,label:10},{value:20,label:20},{value:50,label:50}]} />{' '}条</span>
      <div className="divider" />
      <Space size={2}>
        {pages.map(p => (
          <span key={p.k} style={{
            minWidth:32, height:32, display:'inline-flex', alignItems:'center', justifyContent:'center',
            borderRadius:8, fontSize:13, cursor:p.disabled?'default':'pointer',
            background:p.k===current?'#7C3AED':(p.arrow?'#fff':'transparent'),
            color:p.k===current?'#fff':'#374151', border:p.arrow?'1px solid #E5E7EB':'none',
            fontWeight:p.k===current?600:400, opacity:p.disabled?0.35:1,
          }}>{p.label}</span>
        ))}
      </Space>
      <div className="divider" />
      <span>第 {current}/{tp} 页</span>
    </div>
  );
}

function TranslationNavPage({ targetLang, setTargetLang, openResource }) {
  const [filterCat, setFilterCat] = useState('dict');
  const [searchText, setSearchText] = useState('');

  const allItems = DOMAINS.flatMap(d => d.items.map(it => ({ ...it, domain: d.title })));
  const totalCount = allItems.length;

  const getProgress = (type) => {
    const rd = RD[type];
    if (!rd || rd._ph) return { done:0, total:0 };
    const its = rd.groups ? rd.groups.flatMap(g => g.items) : rd.items;
    const done = its.reduce((s, it) => s + it.d, 0);
    const total = its.reduce((s, it) => s + it.t, 0);
    return { done, total };
  };
  const getItemCount = (type) => {
    const rd = RD[type];
    if (!rd || rd._ph) return 0;
    return rd.groups ? rd.groups.reduce((s, g) => s + g.items.length, 0) : rd.items.length;
  };

  const totalDone = allItems.reduce((s, it) => { const p = getProgress(it.type); return s + p.done; }, 0);
  const totalFields = allItems.reduce((s, it) => { const p = getProgress(it.type); return s + p.total; }, 0);
  const doneResources = allItems.filter(it => { const p = getProgress(it.type); return p.total > 0 && p.done === p.total; }).length;
  const pendingResources = totalCount - doneResources;

  const catCounts = { dict:0, page:0, system:0 };
  allItems.forEach(it => { const m = RES_META[it.type]; if (m) catCounts[m.cat]++; });

  const filteredItems = allItems.filter(it => {
    const m = RES_META[it.type];
    if (filterCat !== 'all' && m && m.cat !== filterCat) return false;
    if (searchText.trim()) {
      const q = searchText.toLowerCase();
      return it.name.toLowerCase().includes(q) || (m && m.desc.toLowerCase().includes(q));
    }
    return true;
  });

  return (
    <Card style={CARD_STYLE} styles={{ body:{ padding:'24px 28px' } }}>
      {/* Header */}
      <div className="lp-nav-header">
        <div>
          <div className="lp-nav-title">Translation</div>
          <div className="lp-nav-subtitle">管理所有可翻译资源,跟踪多语言翻译进度</div>
        </div>
        <div className="lp-nav-actions">
          <Input prefix={<SearchOutlined style={{ color:'#9CA3AF' }} />} allowClear
            placeholder="搜索资源名称..."
            style={{ width:200 }} value={searchText} onChange={e => setSearchText(e.target.value)} />
          <Select value={targetLang} onChange={setTargetLang} style={{ width:140 }}
            prefix={<GlobalOutlined />} options={LANG_OPTS} />
        </div>
      </div>

      {/* Filter Tabs */}
      <div className="lp-filter-bar">
        <span className={'lp-filter-tab' + (filterCat==='dict' ? ' active' : '')} onClick={() => setFilterCat('dict')}>
          商品域<span className="tab-count">({catCounts.dict})</span>
        </span>
        <span className={'lp-filter-tab' + (filterCat==='page' ? ' active' : '')} onClick={() => setFilterCat('page')}>
          前端页面<span className="tab-count">({catCounts.page})</span>
        </span>
        <span className={'lp-filter-tab' + (filterCat==='system' ? ' active' : '')} onClick={() => setFilterCat('system')}>
          通知模板<span className="tab-count">({catCounts.system})</span>
        </span>
      </div>

      {/* Card Grid */}
      <div className="lp-card-grid">
        {filteredItems.map(it => {
          const meta = RES_META[it.type] || {};
          const badge = CATEGORY_BADGES[meta.cat] || CATEGORY_BADGES.dict;
          const prog = getProgress(it.type);
          const itemCount = getItemCount(it.type);
          const pct = prog.total > 0 ? Math.round(prog.done / prog.total * 100) : 0;
          const isPh = it.status === 'placeholder';
          return (
            <div key={it.type} className={'lp-res-card' + (isPh ? ' placeholder' : '')} onClick={() => openResource(it.type)}>
              <div className="lp-res-card-head">
                <div className="lp-res-card-icon" style={{ background: meta.iconBg || '#F3F4F6', color: meta.iconColor || '#6B7280' }}>
                  {meta.icon || <FileTextOutlined />}
                </div>
                <span className="lp-res-card-name">{it.name}</span>
                <span className="lp-res-card-badge" style={{ background: badge.bg, color: badge.color }}>{badge.label}</span>
              </div>
              {meta.entity && <div><span className="lp-res-card-entity">{meta.entity}</span></div>}
              <div className="lp-res-card-desc">{meta.desc || '待设计'}</div>

              {/* Arrow */}
              <div style={{ textAlign:'right', marginTop:4 }}>
                <RightOutlined style={{ fontSize:11, color:'#7C3AED', opacity:.6 }} className="arrow" />
              </div>
            </div>
          );
        })}
      </div>

      {/* Bottom Bar */}
      <div className="lp-bottom-bar">
        <div className="lp-bottom-bar-item">
          <GlobalOutlined style={{ color:'#7C3AED' }} />
          <span>当前语言: en → {targetLang}</span>
        </div>
        <div className="lp-bottom-bar-item">
          <div className="dot" style={{ background:'#16A34A' }} />

        <div className="lp-bottom-bar-item">
          <div className="dot" style={{ background:'#7C3AED' }} />
          <span>自动翻译: 就绪</span>
        </div>
        <div className="lp-bottom-bar-item" style={{ marginLeft:'auto', cursor:'pointer', color:'#7C3AED' }}
          onClick={() => {}}>
          查看翻译任务 <RightOutlined style={{ fontSize:10 }} />
        </div>
      </div>
    </Card>
  );
}

                      <span style={{ fontSize:11, fontWeight:500, whiteSpace:'nowrap', color: done ? '#16A34A' : '#6B7280' }}>{it.d}/{it.t}</span>
                    </div>
                  </div>
                );
              })}
              {filtered.length === 0 && <div style={{ padding:'40px 14px', textAlign:'center', color:'#9CA3AF', fontSize:12 }}>未找到匹配项</div>}
            </div>
            <div className="master-left-foot">共 {items.length} 项</div>
          </div>

          <div className="master-right">
            {!cur ? (
              <div style={{ display:'flex', alignItems:'center', justifyContent:'center', height:'100%', color:'#9CA3AF', fontSize:13 }}>请选择左侧资源</div>
            ) : !fields ? (
              <div style={{ display:'flex', alignItems:'center', justifyContent:'center', height:'100%', color:'#9CA3AF', fontSize:13 }}>该项暂无翻译字段数据(原型演示)</div>
            ) : (
              <>
                <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:16 }}>
                  <span style={{ fontWeight:600, fontSize:15 }}>{cur.id} · {cur.name}</span>
                  <div style={{ marginLeft:'auto', display:'flex', alignItems:'center', gap:8 }}>
                    <div style={{ width:90 }}>
                      <Progress percent={curPct} showInfo={false} size="small"
                        strokeColor={cur.d === cur.t ? '#16A34A' : '#7C3AED'} trailColor="#E5E7EB" />
                    </div>
                    <span style={{ fontSize:12, fontWeight:600, color: cur.d === cur.t ? '#16A34A' : '#7C3AED' }}>{cur.d}/{cur.t}</span>
                  </div>
                </div>

                <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:18 }}>
                  {cur.d < cur.t
                    ? <Button type="primary" icon={<ThunderboltOutlined />}>一键 AI 翻译未完成字段</Button>
                    : <Tag icon={<CheckCircleOutlined />} color="success" style={{ borderRadius:8, padding:'4px 12px' }}>全部翻译已完成</Tag>}
                  <Button type="primary" style={{ marginLeft:'auto' }}>保存</Button>
                </div>

                {fields.map(f => {
                  const st = STATUS_MAP[f.st] || STATUS_MAP.untranslated;
                  const isStale = f.st === 'outdated';
                  return (
                    <div key={f.k} className={'field-card' + (isStale ? ' outdated' : '')}>
                      <div className="field-card-head">
                        <span className="field-card-name">{f.n}</span>
                        <span className="field-card-key">{f.k}</span>
                        <span style={{ marginLeft:'auto' }}><StatusTag variant={st.variant}>{st.text}</StatusTag></span>
                      </div>
                      {isStale && <Alert type="warning" showIcon style={{ marginBottom:12 }}
                        message="源文本已变更,当前译文可能与最新内容不一致" />}
                      <div className="field-card-body">
                        {f.type === 'image' ? (<>
                          <div>
                            <div className="field-col-label">源图片 (EN)</div>
                            <div style={{ marginTop:4, padding:8, background:'#F9FAFB', borderRadius:8, border:'1px solid #E5E7EB', position:'relative' }}>
                              <img src={f.s} alt="source" style={{ maxWidth:'100%', maxHeight:120, borderRadius:6, display:'block' }}
                                onError={e => { e.target.style.display='none'; e.target.nextSibling.style.display='block'; }} />
                              <div style={{ display:'none', color:'#6B7280', fontSize:12 }}>{f.s}</div>
                              <Button size="small" icon={<UploadOutlined />} style={{ position:'absolute', top:8, right:8 }}>替换</Button>
                            </div>
                          </div>
                          <div>
                            <div className="field-col-label">翻译图片 ({langCode}){isStale && <span style={{ color:'#D97706' }}> · 旧版本</span>}</div>
                            {f.r ? (
                              <div style={{ marginTop:4, padding:8, background: isStale ? '#FFFBEB' : '#F9FAFB', borderRadius:8, border: isStale ? '1px solid #F59E0B' : '1px solid #E5E7EB' }}>
                                <img src={f.r} alt="translated" style={{ maxWidth:'100%', maxHeight:120, borderRadius:6, display:'block' }}
                                  onError={e => { e.target.style.display='none'; e.target.nextSibling.style.display='block'; }} />
                                <div style={{ display:'none', color:'#6B7280', fontSize:12 }}>{f.r}</div>
                              </div>
                            ) : (
                              <div style={{ marginTop:4, padding:20, background:'#F9FAFB', borderRadius:8, border:'1px dashed #D1D5DB', textAlign:'center', color:'#9CA3AF', fontSize:13 }}>
                                <UploadOutlined style={{ fontSize:20, marginBottom:4, display:'block' }} />点击上传翻译图片
                              </div>
                            )}
                          </div>
                        </>) : f.type === 'rich_text' ? (<>
                          <div>
                            <div className="field-col-label">源文本 (EN) <Tag color="purple" style={{ marginLeft:4, fontSize:11 }}>富文本</Tag></div>
                            <div style={{ marginTop:4, border:'1px solid #E5E7EB', borderRadius:8, overflow:'hidden' }}>
                              <div style={{ display:'flex', gap:2, padding:'6px 10px', background:'#F3F4F6', borderBottom:'1px solid #E5E7EB' }}>
                                <Button size="small" type="text" style={{ fontWeight:700, minWidth:28 }}>B</Button>
                                <Button size="small" type="text" style={{ fontStyle:'italic', minWidth:28 }}>I</Button>
                                <Button size="small" type="text" style={{ textDecoration:'underline', minWidth:28 }}>U</Button>
                                <div style={{ width:1, background:'#D1D5DB', margin:'2px 4px' }} />
                                <Button size="small" type="text">H1</Button>
                                <Button size="small" type="text">H2</Button>
                                <div style={{ width:1, background:'#D1D5DB', margin:'2px 4px' }} />
                                <Button size="small" type="text">UL</Button>
                                <Button size="small" type="text">OL</Button>
                              </div>
                              <div style={{ padding:'12px 14px', minHeight:80, fontSize:13, lineHeight:1.7 }}
                                dangerouslySetInnerHTML={{ __html: f.s }} />
                            </div>
                          </div>
                          <div>
                            <div className="field-col-label">翻译 ({langCode}) <Tag color="purple" style={{ marginLeft:4, fontSize:11 }}>富文本</Tag>{isStale && <span style={{ color:'#D97706' }}> · 旧译文</span>}</div>
                            <div style={{ marginTop:4, border: isStale ? '1px solid #F59E0B' : '1px solid #E5E7EB', borderRadius:8, overflow:'hidden', background: isStale ? '#FFFBEB' : undefined }}>
                              <div style={{ display:'flex', gap:2, padding:'6px 10px', background: isStale ? '#FEF3C7' : '#F3F4F6', borderBottom: isStale ? '1px solid #F59E0B' : '1px solid #E5E7EB' }}>
                                <Button size="small" type="text" style={{ fontWeight:700, minWidth:28 }}>B</Button>
                                <Button size="small" type="text" style={{ fontStyle:'italic', minWidth:28 }}>I</Button>
                                <Button size="small" type="text" style={{ textDecoration:'underline', minWidth:28 }}>U</Button>
                                <div style={{ width:1, background:'#D1D5DB', margin:'2px 4px' }} />
                                <Button size="small" type="text">H1</Button>
                                <Button size="small" type="text">H2</Button>
                                <div style={{ width:1, background:'#D1D5DB', margin:'2px 4px' }} />
                                <Button size="small" type="text">UL</Button>
                                <Button size="small" type="text">OL</Button>
                              </div>
                              {f.r ? (
                                <div style={{ padding:'12px 14px', minHeight:80, fontSize:13, lineHeight:1.7 }}
                                  dangerouslySetInnerHTML={{ __html: f.r }} />
                              ) : (
                                <div style={{ padding:'12px 14px', minHeight:80, color:'#9CA3AF', fontSize:13 }}>点击输入翻译或使用 AI 翻译</div>
                              )}
                            </div>
                          </div>
                        </>) : (<>
                          <div>
                            <div className="field-col-label">源文本 (EN)</div>
                            <Input.TextArea defaultValue={f.s} autoSize={{ minRows:1 }} />
                          </div>
                          <div>
                            <div className="field-col-label">翻译 ({langCode}){isStale && <span style={{ color:'#D97706' }}> · 旧译文</span>}</div>
                            <Input.TextArea defaultValue={f.r} autoSize={{ minRows:1 }}
                              placeholder="点击输入翻译或使用 AI 翻译"
                              style={isStale ? { borderColor:'#F59E0B', background:'#FFFBEB' } : undefined} />
                          </div>
                        </>)}
                      </div>
                      <div style={{ display:'flex', justifyContent:'flex-end', marginTop:12, gap:8 }}>
                        {f.type === 'image' ? (
                          <Button size="small" icon={<UploadOutlined />}
                            type={f.st === 'untranslated' ? 'primary' : 'default'}>上传图片</Button>
                        ) : (
                          <Button size="small" icon={<ThunderboltOutlined />}
                            type={(f.st === 'untranslated' || isStale) ? 'primary' : 'default'}>AI 翻译</Button>
                        )}
                      </div>
                    </div>
                  );
                })}
              </>
            )}
          </div>
        </div>
        </>
      )}
    </Card>
  );
}

      <FormRow label="导入方式">
        <Select style={{ width:'100%' }} defaultValue="xlsx"
          options={[{ value:'xlsx', label:'Excel文件 (.xlsx)' },{ value:'csv', label:'CSV文件' },{ value:'json', label:'JSON文件' }]} />
      </FormRow>
      <FormRow label="文件">
        <Upload beforeUpload={() => false} maxCount={1}><Button icon={<ImportOutlined />}>选择文件</Button></Upload>
      </FormRow>
      <Alert type="info" showIcon style={{ marginTop:8 }} message="模板说明"
        description={<div style={{ fontSize:12, lineHeight:1.7 }}>必填列:Key名称、Key类型(业务字段/页面文案)<br />选填列:来源/归属、实体类型、字段名、源文本、备注</div>} />
    </Modal>
  );
}

function EditKeyModal({ open, onClose }) {
  return (
    <Modal title="编辑Key" open={open} onCancel={onClose} closable={false} maskClosable={false} centered width={480}
      footer={[<Button key="c" onClick={onClose}>取消</Button>, <Button key="s" type="primary" onClick={onClose}>保存</Button>]}>
      <FormRow label="Key名称"><Input value="product.title" disabled /></FormRow>
      <FormRow label="字段显示名" required><Input defaultValue="商品标题" /></FormRow>
      <FormRow label="字段类型" required>
        <Select style={{ width:'100%' }} defaultValue="text"
          options={[{ value:'text', label:'text (文本)' },{ value:'image', label:'image (图片)' },{ value:'rich_text', label:'rich_text (富文本)' }]} />
      </FormRow>
      <FormRow label="来源" required>
        <Select style={{ width:'100%' }} defaultValue="商品中心"
          options={[{ value:'商品中心', label:'商品中心' },{ value:'类目中心', label:'类目中心' }]} />
      </FormRow>
      <FormRow label="状态" required>
        <Select style={{ width:'100%' }} defaultValue="启用"
          options={[{ value:'启用', label:'启用' },{ value:'停用', label:'停用' }]} />
      </FormRow>
      <FormRow label="备注"><Input placeholder="选填" /></FormRow>
    </Modal>
  );
}

function EditTermModal({ open, onClose }) {
  return (
    <Modal title="编辑术语" open={open} onCancel={onClose} closable={false} maskClosable={false} centered width={480}
      footer={[<Button key="c" onClick={onClose}>取消</Button>, <Button key="s" type="primary" onClick={onClose}>保存</Button>]}>
      <FormRow label="源词" required><Input defaultValue="Handbag" /></FormRow>
      <FormRow label="规则" required>
        <Select style={{ width:'100%' }} defaultValue="强制术语"
          options={[{ value:'禁译词', label:'禁译词' },{ value:'强制术语', label:'强制术语' }]} />
      </FormRow>
      <FormRow label="备注"><Input defaultValue="品类名,翻译时强制匹配" /></FormRow>
    </Modal>
  );
}

function Dialogs({ dialog, closeDialog }) {
  return (
    <>
      <AddTermModal open={dialog === 'add-term'} onClose={closeDialog} />
      <ImportTermModal open={dialog === 'import-term'} onClose={closeDialog} />
      <RegisterKeyModal open={dialog === 'register-key'} onClose={closeDialog} />
      <BatchImportModal open={dialog === 'batch-import'} onClose={closeDialog} />
      <EditKeyModal open={dialog === 'edit-key'} onClose={closeDialog} />
      <EditTermModal open={dialog === 'edit-term'} onClose={closeDialog} />
    </>
  );
}

/* ════════════════ App ════════════════ */
const PAGE_TITLE = {
  'page-translation-nav':'Translation', 'page-key-management':'Key管理', 'page-glossary-list':'术语表',
};
const ACTIVE_KEY = {
  'page-translation-nav':'translation-nav', 'page-translation-master':'translation-nav',
  'page-key-management':'key-management', 'page-glossary-list':'glossary-list', 'page-glossary-detail':'glossary-list',
};
const MENU_TO_PAGE = {
  'translation-nav':'page-translation-nav', 'key-management':'page-key-management', 'glossary-list':'page-glossary-list',
};

function App() {
  const [currentPage, setCurrentPage] = useState('page-translation-nav');
  const [resType, setResType] = useState('product');
  const [targetLang, setTargetLang] = useState('fr');
  const [dialog, setDialog] = useState(null);

  const go = (p) => { setCurrentPage(p); window.scrollTo(0, 0); };
  const openResource = (type) => { setResType(type); go('page-translation-master'); };
  const openDialog = (k) => setDialog(k);
  const closeDialog = () => setDialog(null);

  const activeKey = ACTIVE_KEY[currentPage];
  const subLabel = (text, key) => <span style={{ fontWeight: activeKey === key ? 600 : 400 }}>{text}</span>;
  const menuItems = [
    { key:'lang', icon:<TranslationOutlined />, label:'多语言管理', children:[
      { key:'translation-nav', icon:<UnorderedListOutlined />, label: subLabel('Translation','translation-nav') },
      { key:'key-management', icon:<KeyOutlined />, label: subLabel('Key管理','key-management') },
      { key:'glossary-list', icon:<BookOutlined />, label: subLabel('术语表','glossary-list') },
    ]},
  ];

  let breadcrumb = PAGE_TITLE[currentPage] || '';
  if (currentPage === 'page-translation-master') breadcrumb = 'Translation / ' + (RD[resType] ? RD[resType].label : '');
  if (currentPage === 'page-glossary-detail') breadcrumb = '术语表 / 术语详情';

  return (
    <ConfigProvider theme={looplyTheme}>
      <Layout style={{ height: '100vh' }}>
        <Layout.Header style={{ borderBottom:'1px solid #E5E7EB', display:'flex', alignItems:'center' }}>
          <img src={LOGO_SRC} alt="Looply" style={{ height: 32, display:'block' }} />
          <div style={{ width:1, height:20, background:'#E5E7EB', margin:'0 16px' }} />
          <span style={{ fontSize:14, fontWeight:500, color:'#6B7280' }}>多语言管理后台</span>
          <span style={{ marginLeft:'auto', color:'#9CA3AF', fontSize:13 }}>{breadcrumb}</span>
        </Layout.Header>
        <Layout>
          <Layout.Sider width={220} theme="light" style={SIDER_STYLE}>
            <Menu mode="inline" items={menuItems} selectedKeys={[activeKey]} defaultOpenKeys={['lang']}
              style={{ borderInlineEnd:'none' }}
              onClick={({ key }) => { if (MENU_TO_PAGE[key]) go(MENU_TO_PAGE[key]); }} />
          </Layout.Sider>
          <Layout.Content style={{ padding:28, overflow:'auto' }}>
            {currentPage==='page-translation-nav' && <TranslationNavPage targetLang={targetLang} setTargetLang={setTargetLang} openResource={openResource} />}
            {currentPage==='page-translation-master' && <MasterDetailPage resType={resType} targetLang={targetLang} setTargetLang={setTargetLang} go={go} />}
            {currentPage==='page-key-management' && <KeyManagementPage openDialog={openDialog} />}
            {currentPage==='page-glossary-list' && <GlossaryListPage go={go} openDialog={openDialog} />}
            {currentPage==='page-glossary-detail' && <GlossaryDetailPage go={go} openDialog={openDialog} />}
            <Dialogs dialog={dialog} closeDialog={closeDialog} />
          </Layout.Content>
        </Layout>
      </Layout>
    </ConfigProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
