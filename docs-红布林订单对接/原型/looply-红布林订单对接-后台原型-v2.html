<style>
html,body,#root{height:100%;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F9FAFB;color:#1F2937}
#root::before{content:'正在加载 antd 原型……';position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#9CA3AF;font-size:14px}
#root:not(:empty)::before{display:none}
.lp-kpi{background:linear-gradient(180deg,#FEFCFF 0%,#F3EEFF 100%);border:1px solid #DDD6FE;border-radius:14px;padding:14px 16px}
.lp-kpi .num{font-size:24px;font-weight:700;color:#7C3AED;line-height:1;margin-bottom:6px;font-variant-numeric:tabular-nums}
.lp-kpi .label{font-size:12px;color:#6B7280}
.lp-pagination{display:flex;align-items:center;justify-content:center;gap:24px;padding:12px 16px;font-size:13px;color:#6B7280}
.lp-pagination .divider{width:1px;height:20px;background:#E5E7EB}
.lp-tip-trigger{cursor:help;border-bottom:1px dashed #9CA3AF;padding-bottom:1px}
.lp-note{padding:14px;border-radius:10px;background:#F3EEFF;border:1px solid #DDD6FE;color:#6D28D9;font-size:12px;line-height:1.8}
.lp-section-purple{font-size:14px;font-weight:700;color:#7C3AED;margin:0 0 12px}
.lp-section{font-size:15px;font-weight:600;color:#1F2937;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid #E5E7EB}
.lp-oplog-title{font-size:14px;font-weight:700;color:#7C3AED;margin:24px 0 12px}
.lp-empty{display:flex;flex-direction:column;align-items:center;padding:60px 20px;text-align:center}
.lp-empty .icon{font-size:48px;margin-bottom:16px;color:#9CA3AF}
.lp-empty .icon.err{color:#DC2626}
.lp-empty .title{font-size:16px;font-weight:600;color:#1F2937;margin-bottom:8px}
.lp-empty .desc{font-size:13px;color:#6B7280;margin-bottom:24px;max-width:360px}
.lp-form-row{display:flex;gap:16px;margin-bottom:12px;align-items:center}
.lp-form-row:first-of-type{margin-top:8px}
.lp-form-row .lp-form-label{width:96px;text-align:right;color:#6B7280;font-size:13px;flex-shrink:0}
.lp-form-row .lp-form-label .req{color:#DC2626;margin-right:4px}
.lp-form-row .lp-form-control{flex:1}
.lp-helper{font-size:12px;color:#9CA3AF;margin:-4px 0 12px 112px}
.lp-detail{display:grid;grid-template-columns:120px 1fr;gap:10px 16px;font-size:13px;margin-bottom:24px}
.lp-detail .dl{color:#6B7280}
.lp-detail .dv{color:#1F2937}
:focus-visible{outline:none;box-shadow:inset 0 0 0 2px rgba(124,58,237,.4)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const TAG_COLORS = {
  on:{bg:'#F0FDF4',color:'#16A34A'}, sale:{bg:'#EFF6FF',color:'#2563EB'},
  pending:{bg:'#FFFBEB',color:'#D97706'}, off:{bg:'#F3F4F6',color:'#6B7280'},
  req:{bg:'#FEF2F2',color:'#DC2626'}, warn:{bg:'#FFF1F2',color:'#E11D48'},
};
function StatusTag({ variant, children }) {
  const c = TAG_COLORS[variant] || TAG_COLORS.off;
  return <Tag bordered={false} style={{ background:c.bg, color:c.color, borderRadius:999, padding:'2px 8px', fontSize:12, lineHeight:'18px', marginInlineEnd:4 }}>{children}</Tag>;
}
function Kpi({ num, label, numStyle }) {
  return <div className="lp-kpi"><div className="label" style={{marginBottom:6}}>{label}</div><div className="num" style={numStyle}>{num}</div></div>;
}
function TipText({ label, tip }) {
  return <Tooltip title={<div style={{whiteSpace:'pre-line',lineHeight:1.6}}>{tip}</div>} color="#fff" styles={{body:{color:'#374151',fontSize:12,padding:'10px 14px'}}}><span className="lp-tip-trigger">{label}</span></Tooltip>;
}
function CompactPagination({ total, current=1, pageSize=10 }) {
  const tp = Math.ceil(total/pageSize)||1;
  const pages = useMemo(()=>{
    const out=[{k:'prev',label:'<',disabled:current===1,arrow:true}];
    if(tp<=6) for(let i=1;i<=tp;i++) out.push({k:i,label:i});
    else{out.push({k:1,label:1},{k:2,label:2},{k:3,label:3},{k:'gap',label:'…',disabled:true},{k:tp,label:tp});}
    out.push({k:'next',label:'>',disabled:current===tp,arrow:true});
    return out;
  },[current,tp]);
  return(
    <div className="lp-pagination">
      <span>{'共 '+total.toLocaleString()+' 条，每页 '}<Select size="small" value={pageSize} style={{width:72,marginInline:4}} options={[{value:10,label:10},{value:20,label:20},{value:50,label:50}]} />{' 条'}</span>
      <div className="divider"/>
      <Space size={2}>{pages.map(p=><span key={p.k} style={{minWidth:32,height:32,display:'inline-flex',alignItems:'center',justifyContent:'center',borderRadius:8,fontSize:13,cursor:p.disabled?'default':'pointer',background:p.k===current?'#7C3AED':(p.arrow?'#fff':'transparent'),color:p.k===current?'#fff':'#374151',border:p.arrow?'1px solid #E5E7EB':'none',fontWeight:p.k===current?600:400,opacity:p.disabled?0.35:1}}>{p.label}</span>)}</Space>
      <div className="divider"/>
      <span>{'第 '+current+'/'+tp+' 页'}</span>
    </div>
  );
}
function EmptyZero({ entity, cta, onCta }) {
  return <div className="lp-empty"><InboxOutlined className="icon"/><div className="title">{'暂无'+entity}</div><div className="desc">{'点击下方按钮创建第一个'+entity}</div>{cta&&<Button type="primary" onClick={onCta}>{cta}</Button>}</div>;
}
function EmptyNoMatch({ onClear }) {
  return <div className="lp-empty"><SearchOutlined className="icon"/><div className="title">未找到匹配结果</div><div className="desc">请尝试调整搜索关键词或筛选条件</div><Button onClick={onClear}>清除筛选条件</Button></div>;
}
function EmptyError({ onRetry }) {
  return <div className="lp-empty"><ExclamationCircleOutlined className="icon err"/><div className="title">加载失败</div><div className="desc">网络异常，请检查网络连接后重试</div><Button type="primary" onClick={onRetry}>重试</Button></div>;
}
function EmptyStateSwitcher({ mode, setMode }) {
  return <div style={{marginTop:12,display:'flex',gap:8,justifyContent:'center'}}>{[['data','正常数据'],['zero','零数据态'],['no-match','无匹配态'],['error','异常态']].map(([k,l])=><Button key={k} type={mode===k?'primary':'default'} onClick={()=>setMode(k)}>{l}</Button>)}</div>;
}
function FormRow({ label, required, children, helper }) {
  return <><div className="lp-form-row"><div className="lp-form-label">{required&&<span className="req">*</span>}{label}</div><div className="lp-form-control">{children}</div></div>{helper&&<div className="lp-helper">{helper}</div>}</>;
}
function OpLog({ data }) {
  const rows = data || [
    {i:1,at:'2026-06-15 14:30:25',who:'系统',type:'创建订单',detail:'支付成功，自动创建订单 ORD20260615001'},

  ];

        {title:'操作时间',dataIndex:'at',width:180},

/* ── 共享组件：发起退款弹窗（列表页 + 详情页同一套，避免分开维护不一致）── */
function RefundModal({ open, onClose, order, stage }) {
  const [checked, setChecked] = useState([]);
  React.useEffect(()=>{
    if(open && order){ setChecked((order.items||[]).filter(x=>x.f_status==='pending').map(x=>x.id)); }
  },[open]);
  const S = stage ? CANCEL_STAGE_MAP[stage] : null;
  const allItems = order ? (order.items||[]) : [];
  const items = order ? (order.items||[]).filter(x=>x.f_status==='pending') : [];
  const defaultAmount = order ? parseFloat(String(order.amount||'0').replace(/[$,]/g,''))||0 : 0;
  return (
    <Modal title="发起退款" open={open} onCancel={onClose} closable={false} maskClosable={false} centered={true} width={640}
      footer={[
        <Button key="c" onClick={onClose}>取消</Button>,
        <Button key="s" danger={stage!=='intl'} type="primary" disabled={S&&S.refund&&checked.length===0} onClick={onClose}>{S?S.confirm:'确认'}{S&&S.refund&&checked.length>0?'（'+checked.length+'件）':''}</Button>,
      ]}>
      {order&&S&&(()=>{
        // 方案A：按所勾商品各自阶段分别处理。说明块只提示"运营需额外动作"的部分，系统自动联动的细节不平铺
        const picked=allItems.filter(x=>checked.includes(x.id));
        const cntAuto=picked.filter(x=>x.stage==='unpaid'||x.stage==='paid').length;   // 系统自动接口取消
        const cntShipped=picked.filter(x=>x.stage==='shipped').length;                  // 需运营线下协调退回
        const cntIntl=picked.filter(x=>x.stage==='intl').length;                        // 转售后
        return <>
        <div className="lp-detail">
          <div className="dl">订单号</div><div className="dv">{order.id}</div>
          <div className="dl">买家</div><div className="dv">{order.buyer}</div>
        </div>
        {picked.length===0
          ? <Alert type="info" showIcon={false} message="请在下方勾选要退款的商品；系统按每件对应红布林订单的履约阶段自动判定处理方式" style={{marginBottom:16}}/>
          : <div style={{marginBottom:16}}>
              {(cntAuto>0||cntShipped>0)&&<Alert type={cntShipped>0?'warning':'success'} showIcon style={{marginBottom:8}} message={<span>
                {cntAuto>0&&<div><b>{cntAuto} 件</b>由系统自动联动红布林取消并退款，<b>无需额外操作</b></div>}
                {cntShipped>0&&<div style={{marginTop:cntAuto>0?4:0}}><b>{cntShipped} 件已发货</b>：需<b>线下协调红布林退回</b></div>}
              </span>}/>}
              {cntIntl>0&&<Alert type="info" showIcon style={{marginBottom:8}} message={<span><b>{cntIntl} 件已发国际物流</b>：将转入 looply 售后退货流程处理</span>}/>}
            </div>}
        {S.refund&&<>
          <h4 className="lp-section-purple">选择退款商品</h4>
          <Table size="small" rowKey="id" pagination={false} styles={TABLE_STYLES}
            rowSelection={{selectedRowKeys:checked,onChange:setChecked}}
            columns={[{title:'商品名称',dataIndex:'name'},{title:<TipText label="红布林订单" tip="订单号 + 系统按该单状态自动判定的履约阶段，不可人工更改"/>,dataIndex:'rhlNo',width:190,render:(v,r)=>(
              <div style={{lineHeight:1.6}}>
                {v?<span style={{fontFamily:'Menlo,Monaco,Consolas,monospace',fontSize:12,color:'#374151',background:'#F3F4F6',padding:'1px 6px',borderRadius:4}}>{v}</span>:<span style={{color:'#9CA3AF'}}>—</span>}
                <div style={{marginTop:3}}>{r.stage&&CANCEL_STAGE_MAP[r.stage]?<StatusTag variant="pending">{CANCEL_STAGE_MAP[r.stage].title}</StatusTag>:<span style={{color:'#9CA3AF',fontSize:12}}>—</span>}</div>
              </div>
            )},{title:'成色等级',dataIndex:'grade',width:100},{title:'单价',dataIndex:'price',width:100}]}
            dataSource={items}/>
          <Alert type="info" showIcon={false} message="退款金额基于商品实付金额（已扣除优惠），非商品原价" style={{margin:'12px 0'}}/>

    <ConfigProvider theme={looplyTheme}>

    </ConfigProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
