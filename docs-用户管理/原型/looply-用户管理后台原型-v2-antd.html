<title>Looply 用户管理后台原型 — antd</title>

<style>
html,body,#root{height:100%;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F9FAFB;color:#1F2937}
#root::before{content:'正在加载 antd 原型……';position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#9CA3AF;font-size:14px}
#root:not(:empty)::before{display:none}

/* KPI 卡片 */
.lp-kpi{background:linear-gradient(180deg,#FEFCFF 0%,#F3EEFF 100%);border:1px solid #DDD6FE;border-radius:14px;padding:14px 16px}
.lp-kpi .num{font-size:24px;font-weight:700;color:#7C3AED;line-height:1;margin-bottom:6px;font-variant-numeric:tabular-nums}
.lp-kpi .label{font-size:12px;color:#6B7280}

/* 紧凑分页器 */
.lp-pagination{display:flex;align-items:center;justify-content:center;gap:24px;padding:12px 16px;font-size:13px;color:#6B7280}
.lp-pagination .divider{width:1px;height:20px;background:#E5E7EB}

/* 字段提示:虚线下划线 */
.lp-tip-trigger{cursor:help;border-bottom:1px dashed #9CA3AF;padding-bottom:1px}

/* 紫色提示条 */
.lp-note{padding:14px;border-radius:10px;background:#F3EEFF;border:1px solid #DDD6FE;color:#6D28D9;font-size:12px;line-height:1.8}
.lp-note-sm{padding:10px 14px;background:#F3EEFF;border:1px solid #DDD6FE;border-radius:8px;font-size:12px;color:#6D28D9}

/* 区块小节标题 */
.lp-section-purple{font-size:14px;font-weight:700;color:#7C3AED;margin:0 0 12px}
.lp-section{font-size:15px;font-weight:600;color:#1F2937;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid #E5E7EB}
.lp-oplog-title{font-size:14px;font-weight:700;color:#7C3AED;margin:24px 0 12px}

/* 空态 */
.lp-empty{display:flex;flex-direction:column;align-items:center;padding:60px 20px;text-align:center}
.lp-empty .icon{font-size:48px;margin-bottom:16px;color:#9CA3AF}
.lp-empty .icon.err{color:#DC2626}
.lp-empty .title{font-size:16px;font-weight:600;color:#1F2937;margin-bottom:8px}
.lp-empty .desc{font-size:13px;color:#6B7280;margin-bottom:24px;max-width:360px}

/* 表单只读字段行 */
.lp-form-row{display:flex;gap:16px;margin-bottom:12px;align-items:center}
.lp-form-row:first-of-type{margin-top:8px}
.lp-form-row .lp-form-label{width:96px;text-align:right;color:#6B7280;font-size:13px;flex-shrink:0}
.lp-form-row .lp-form-label .req{color:#DC2626;margin-right:4px}
.lp-form-row .lp-form-control{flex:1}
.lp-helper{font-size:12px;color:#9CA3AF;margin:-4px 0 12px 112px}

/* Detail Grid(label-value 网格) */
.lp-detail{display:grid;grid-template-columns:96px 1fr;gap:12px 16px;font-size:13px;margin-bottom:8px;align-items:center}
.lp-detail .dl{color:#6B7280}
.lp-detail .dv{color:#1F2937}

/* Code 样式 */
.lp-code{font-family:Menlo,Monaco,Consolas,monospace;font-size:12px;color:#374151;background:#F3F4F6;padding:1px 6px;border-radius:4px}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

/* ============ 通用 style 常量 ============ */
const CARD_STYLE = { boxShadow: '0 10px 24px rgba(16,24,40,.06)', marginBottom: 20 };
const TABLE_STYLES = { root: { borderRadius: 14, border: '1px solid #E5E7EB', overflow: 'hidden' } };

/* ============ 业务组件 ============ */
function Kpi({ num, label }) {
  return (
    <div className="lp-kpi">
      <div className="num">{num}</div>
      <div className="label">{label}</div>
    </div>
  );
}

const TAG_COLORS = {
  on: {bg:'#F0FDF4',color:'#16A34A'}, sale: {bg:'#EFF6FF',color:'#2563EB'},
  pending: {bg:'#FFFBEB',color:'#D97706'}, off: {bg:'#F3F4F6',color:'#6B7280'},
  req: {bg:'#FEF2F2',color:'#DC2626'}, warn: {bg:'#FFF1F2',color:'#E11D48'},
  desc: {bg:'#F0FDF4',color:'#16A34A'}, enum: {bg:'#FFFBEB',color:'#D97706'},
  opt: {bg:'#F3F4F6',color:'#6B7280'},
};
function StatusTag({ variant, children, closable, onClose }) {
  const c = TAG_COLORS[variant] || TAG_COLORS.off;
  return (
    <Tag bordered={false} closable={closable} onClose={onClose}
      style={{ background:c.bg, color:c.color, borderRadius:999, padding:'2px 8px',
               fontSize:12, lineHeight:'18px', marginInlineEnd:4 }}>
      {children}
    </Tag>
  );
}

function TipText({ label, tip }) {
  return (
    <Tooltip title={<div style={{ whiteSpace:'pre-line', lineHeight:1.6 }}>{tip}</div>}
      color="#fff" styles={{ body: { color:'#374151', fontSize:12, padding:'10px 14px' } }}>
      <span className="lp-tip-trigger">{label}</span>
    </Tooltip>
  );
}

function CompactPagination({ total, current=1, pageSize=10, totalPages }) {
  const tp = totalPages || Math.ceil(total / pageSize) || 1;
  const pages = useMemo(() => {
    const out = [{ k:'prev', label:'<', disabled:current===1, arrow:true }];
    if (tp <= 6) for (let i=1; i<=tp; i++) out.push({ k:i, label:i });
    else { out.push({k:1,label:1}); out.push({k:2,label:2}); out.push({k:3,label:3}); out.push({k:'gap',label:'…',disabled:true}); out.push({k:tp,label:tp}); }
    out.push({ k:'next', label:'>', disabled:current===tp, arrow:true });
    return out;
  }, [current, tp]);
  return (
    <div className="lp-pagination">
      <span>共 {total.toLocaleString()} 条,每页{' '}
        <Select size="small" value={pageSize} style={{ width:72, marginInline:4 }}
          options={[{value:10,label:10},{value:20,label:20},{value:50,label:50}]} />{' '}条</span>
      <div className="divider" />
      <Space size={2}>
        {pages.map(p => (
          <span key={p.k} style={{
            minWidth:32, height:32, display:'inline-flex', alignItems:'center', justifyContent:'center',
            borderRadius:8, fontSize:13, cursor:p.disabled?'default':'pointer',
            background:p.k===current?'#7C3AED':(p.arrow?'#fff':'transparent'),
            color:p.k===current?'#fff':'#374151', border:p.arrow?'1px solid #E5E7EB':'none',
            fontWeight:p.k===current?600:400, opacity:p.disabled?0.35:1,
          }}>{p.label}</span>
        ))}
      </Space>
      <div className="divider" />
      <span>第 {current}/{tp} 页</span>
    </div>
  );
}

function EmptyZero({ entity, cta, onCta }) {
  return <div className="lp-empty"><InboxOutlined className="icon" />
    <div className="title">暂无{entity}</div>
    <div className="desc">点击下方按钮创建第一个{entity}</div>
    {cta && <Button type="primary" onClick={onCta}>{cta}</Button>}
  </div>;
}
function EmptyNoMatch({ onClear }) {
  return <div className="lp-empty"><SearchOutlined className="icon" />
    <div className="title">未找到匹配结果</div>
    <div className="desc">请尝试调整搜索关键词或筛选条件</div>
    <Button onClick={onClear}>清除筛选条件</Button>
  </div>;
}
function EmptyError({ onRetry }) {
  return <div className="lp-empty"><ExclamationCircleOutlined className="icon err" />
    <div className="title">加载失败</div>
    <div className="desc">网络异常,请检查网络连接后重试</div>
    <Button type="primary" onClick={onRetry}>重试</Button>
  </div>;
}
function EmptyStateSwitcher({ mode, setMode }) {
  return (
    <div style={{ marginTop:12, display:'flex', gap:8, justifyContent:'center' }}>
      {[['data','正常数据'],['zero','零数据态'],['no-match','无匹配态'],['error','异常态']].map(([k, label]) =>
        <Button key={k} type={mode===k?'primary':'default'} onClick={() => setMode(k)}>{label}</Button>
      )}
    </div>
  );
}

/* 列表页模板 */
function ListPage({ title, desc, headActions, kpis, filters, columns, data, total,
                    entity, createLabel, onCreate, scrollX, rowSelection, batchBar }) {
  const [mode, setMode] = useState('data');
  return (
    <Card style={CARD_STYLE}>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:16, marginBottom:18 }}>
        <div>
          <div style={{ fontSize:20, fontWeight:700, marginBottom:6 }}>{title}</div>
          {desc && <div style={{ color:'#6B7280', fontSize:13, maxWidth:760 }}>{desc}</div>}
        </div>
        <Space wrap>{headActions}</Space>
      </div>
      {kpis && (
        <div style={{ display:'grid', gridTemplateColumns:`repeat(${kpis.length},1fr)`, gap:12, marginBottom:18 }}>
          {kpis.map((k, i) => <Kpi key={i} num={k.num} label={k.label} />)}
        </div>
      )}
      {filters && <Space size={12} wrap style={{ marginBottom:16 }}>{filters}</Space>}
      {batchBar}
      {mode === 'data' && (
        <>
          <Table rowKey={r => r.id} columns={columns} dataSource={data}
            pagination={false} styles={TABLE_STYLES}
            rowSelection={rowSelection}
            scroll={scrollX ? { x: scrollX } : undefined} />
          <CompactPagination total={total || data.length} pageSize={10} />
        </>
      )}
      {mode==='zero'     && <EmptyZero entity={entity} cta={createLabel || null} onCta={onCreate} />}
      {mode==='no-match' && <EmptyNoMatch onClear={() => setMode('data')} />}
      {mode==='error'    && <EmptyError onRetry={() => setMode('data')} />}
      <EmptyStateSwitcher mode={mode} setMode={setMode} />
    </Card>
  );
}

function PlaceholderModule({ pageName }) {

    { title:'说明', dataIndex:'note', width:260 },
    { title:'已打标用户数', dataIndex:'tagged', width:130, align:'right',
      render:v => v.toLocaleString() },
    { title:'创建时间', dataIndex:'at', width:120 },
    { title:'操作', key:'op', width:150, fixed:'right', render:(_, r) => (
        <Space size={6}>
          <Button size="small" onClick={() => openDialog('tag-edit')}>编辑</Button>
          {r.status === '启用'
            ? <Button size="small" danger onClick={() => Modal.confirm({ title:'确认停用', content:`确定停用标签"${r.name}"吗？停用后新打标不可选该标签。`, okText:'确认停用', okButtonProps:{danger:true}, cancelText:'取消', centered:true })}>停用</Button>
            : <Button size="small" onClick={() => Modal.confirm({ title:'确认启用', content:`确定启用标签"${r.name}"吗？`, okText:'确认启用', cancelText:'取消', centered:true })}>启用</Button>}
        </Space>
      ) },
  ];
  return (
    <ListPage
      title="用户标签"
      desc="维护运营标签池,管理标签的新增、编辑和停用"
      headActions={<Button type="primary" onClick={() => openDialog('tag-create')}>新增标签</Button>}
      kpis={[
        { num:'5', label:'标签总数' }, { num:'4', label:'启用中' },
        { num:'1', label:'已停用' }, { num:'985', label:'累计打标次数' },
      ]}
      filters={[
        <Input key="s" placeholder="搜索标签名称" prefix={<SearchOutlined style={{ color:'#9CA3AF' }} />} allowClear style={{ width:200 }} />,
        <Select key="st" defaultValue="" style={{ width:130 }} options={[
          { value:'', label:'全部状态' }, { value:'启用', label:'启用' }, { value:'停用', label:'停用' },
        ]} />,
        <Button key="q" type="primary" icon={<SearchOutlined />}>查询</Button>,
        <Button key="r" icon={<ReloadOutlined />}>重置</Button>,
      ]}
      columns={columns}
      data={TAG_DATA}
      total={5}
      entity="标签"
      createLabel="新增标签"
      onCreate={() => openDialog('tag-create')}
      scrollX="max-content"
    />
  );
}

/* ============ 弹窗(骨架占位,后续 Edit 填充) ============ */
const TAG_CHECK_OPTIONS = [
  { value:'高净值用户', count:128 }, { value:'价格敏感型', count:356 },
  { value:'高复购潜力', count:89 }, { value:'低活跃待召回', count:412 },
].map(o => ({
  value: o.value,
  label: <span style={{ display:'inline-flex', justifyContent:'space-between', width:300 }}>
    <span>{o.value}</span><span style={{ color:'#9CA3AF', fontSize:11 }}>{o.count}人</span>
  </span>,
}));

function AppDialogs({ dialog, onClose }) {
  const isTagForm = dialog === 'tag-create' || dialog === 'tag-edit';

  return (
    <>
      {/* 新增 / 编辑标签 */}
      <Modal title={dialog === 'tag-edit' ? '编辑标签' : '新增标签'} open={isTagForm} onCancel={onClose}
        closable={false} maskClosable={false} centered={true} width={480}
        footer={[
          <Button key="c" onClick={onClose}>取消</Button>,
          <Button key="s" type="primary" onClick={onClose}>保存</Button>,
        ]}>
        <div className="lp-form-row" style={{ alignItems:'flex-start' }}>
          <div className="lp-form-label" style={{ paddingTop:6 }}><span className="req">*</span>标签名称</div>
          <div className="lp-form-control">
            <Input placeholder="输入标签名称" maxLength={20} showCount />
            <div style={{ fontSize:12, color:'#9CA3AF', marginTop:4 }}>名称不可重复</div>
          </div>
        </div>
        <div className="lp-form-row" style={{ alignItems:'flex-start', marginBottom:24 }}>
          <div className="lp-form-label" style={{ paddingTop:6 }}>标签说明</div>
          <div className="lp-form-control"><Input.TextArea rows={3} placeholder="描述标签的定义和适用场景" maxLength={200} showCount /></div>
        </div>
      </Modal>

      {/* 批量打标签 */}
      <Modal title="批量打标签" open={dialog === 'batch-tag'} onCancel={onClose}
        closable={false} maskClosable={false} centered={true} width={480}
        footer={[
          <Button key="c" onClick={onClose}>取消</Button>,
          <Button key="s" type="primary" onClick={onClose}>确认打标</Button>,
        ]}>
        <Alert type="info" showIcon={false} style={{ marginBottom:14 }}
          message={<span>已选择 <b>3</b> 个用户,请选择要添加的标签:</span>} />
        <Input placeholder="搜索标签名称" prefix={<SearchOutlined style={{ color:'#9CA3AF' }} />} allowClear style={{ marginBottom:12 }} />
        <Checkbox.Group options={TAG_CHECK_OPTIONS}
          style={{ display:'flex', flexDirection:'column', gap:10 }} />
      </Modal>

      {/* 打标(单用户:勾选打标 / 取消勾选摘标) */}
      <Modal title="打标" open={dialog === 'add-tag'} onCancel={onClose}
        closable={false} maskClosable={false} centered={true} width={480}
        footer={[
          <Button key="c" onClick={onClose}>取消</Button>,
          <Button key="s" type="primary" onClick={onClose}>确认</Button>,
        ]}>
        <div style={{ marginBottom:14, fontSize:13, color:'#6B7280' }}>
          为用户 <b>U100001 (Alex Johnson)</b> 设置标签,勾选=打标,取消勾选=摘标:
        </div>
        <div style={{ marginBottom:10, fontSize:12, color:'#9CA3AF' }}>
          (以下勾选项按用户实际已有标签回填)
        </div>
        <Input placeholder="搜索标签名称" prefix={<SearchOutlined style={{ color:'#9CA3AF' }} />} allowClear style={{ marginBottom:12 }} />
        <Checkbox.Group options={TAG_CHECK_OPTIONS}
          defaultValue={['高净值用户','高复购潜力','价格敏感型','低活跃待召回']}
          style={{ display:'flex', flexDirection:'column', gap:10 }} />
      </Modal>
    </>
  );
}

/* ============ App ============ */
const MENU_ITEMS = (active) => {
  const lbl = (text, key) => <span style={{ fontWeight: active === key ? 600 : 400 }}>{text}</span>;
  return [
    { key: 'page-user-list-list', icon: <UserOutlined />, label: lbl('用户列表', 'page-user-list-list') },
    { type: 'divider' },
    { key: 'page-tag-mgmt-list', icon: <TagsOutlined />, label: lbl('用户标签', 'page-tag-mgmt-list') },
  ];
};

function App() {
  const [page, setPage] = useState('page-user-list-list');
  const [dialog, setDialog] = useState(null);
  const go = (p) => setPage(p);
  const openDialog = (d) => setDialog(d);
  // 详情页时菜单仍高亮"用户列表"
  const activeKey = page === 'page-user-list-detail' ? 'page-user-list-list' : page;
  const crumb = page === 'page-user-list-detail' ? '用户列表 / 用户详情'
    : page === 'page-tag-mgmt-list' ? '用户标签' : '用户列表';

  return (
    <ConfigProvider theme={looplyTheme}>
      <Layout style={{ height: '100vh', width: '100vw', overflow: 'hidden' }}>
        <Layout.Header style={{ borderBottom: '1px solid #E5E7EB', display:'flex', alignItems:'center' }}>
          <img src={LOGO_SRC} alt="Looply" style={{ height: 32, display: 'block' }} />
          <div style={{ width:1, height:20, background:'#E5E7EB', margin:'0 16px' }} />
          <span style={{ fontSize:14, fontWeight:500, color:'#6B7280' }}>用户管理系统</span>
          <span style={{ marginLeft:'auto', color:'#9CA3AF', fontSize:13 }}>{crumb}</span>
        </Layout.Header>
        <Layout style={{ overflow:'hidden' }}>
          <Layout.Sider width={220} theme="light" style={SIDER_STYLE}>
            <Menu mode="inline" items={MENU_ITEMS(activeKey)} selectedKeys={[activeKey]}
              style={{ borderInlineEnd: 'none' }}
              onClick={({ key }) => setPage(key)} />
          </Layout.Sider>
          <Layout.Content style={{ padding:28, overflow:'auto', minWidth:0 }}>
            {page === 'page-user-list-list'   && <UserListPage go={go} openDialog={openDialog} />}
            {page === 'page-user-list-detail' && <UserDetailPage go={go} openDialog={openDialog} />}
            {page === 'page-tag-mgmt-list'    && <TagListPage go={go} openDialog={openDialog} />}
          </Layout.Content>
        </Layout>
      </Layout>
      <AppDialogs dialog={dialog} onClose={() => setDialog(null)} />
    </ConfigProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
